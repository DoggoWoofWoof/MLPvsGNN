phase: MP_APPROX_L9
opened: 2026-10-01
status: DECLARED_NOT_RUN
branch_type: POST_HOC_ANALYSIS
track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  Level 8 (configs/mp_approx_l8.yaml, RUN at e6836c3). On metaqa, level 8's primary arm TP read L8_MID, with rho_bar
  0.529 [0.471, 0.591]. That was the first metaqa reading above LOW on the ladder. Its hashed control, TP-hash, read 0.630
  [0.568, 0.688] and beat the text-composed TP (text_vs_hash -0.101 [-0.150, -0.054]). Its true-chain oracle reached
  the GNN (1.007 [0.954, 1.063]). By hop, TP read 0.838, 0.676 and 0.442, and TP's argmax chain was the true chain on 0.59
  of queries. kappa and eta sat at the grid's edge in 59 and 57 of 60 mixture units, and EM kept its last round in 46 of
  60. This file targets those weak points with two changes to the model and says so. First, the walks become
  non-backtracking (NB): a walk never steps straight back to the node it came from. Second, the type vector gains an
  exact residual per token sequence, next to the rotary text composition. The file also widens the kappa and eta grid
  and doubles the EM rounds. It reads level 8's protocol nested inside every unit, so each change has its own paired
  contrast on the same queries.
design_informed_by: >-
  This design was informed by a descriptive look at level 8's filed units and sidecar on the host, made after level 8's
  run record (outputs/mp_approx_l8_diag/, untracked; not a result and not filed). It found four things.
  (a) Walks that step back to the node they came from made level 8's types overlap. At hop 1, most of TP's argmax types
  that were not the true chain were the true chain followed by a step back and forth, for example release_year:fwd >
  release_year:bwd > release_year:fwd on 185 of the 3,000 hop-1 query-seed pairs. The reach set of such a type contains the true chain's.
  (b) On hop-3 movie_to_X_to_movie_to_Y queries, the true chain's reach set holds the topic movie's own Y, reached by
  walking back through the topic movie, and that node is gold on only part of those queries. Removing it from R* raised
  the hop-3 oracle's hit@1 from 0.804 to 0.867, against the GNN's 0.843.
  (c) On the symmetric 2-hop qtypes, a b0 seed was in the true chain's reach set on almost every query and was never
  gold: 53 of 53 queries for actor_to_movie_to_actor, 71 of 78 for movie_to_actor_to_movie, 78 of 85 for
  movie_to_director_to_movie, 64 of 67 for movie_to_writer_to_movie and 50 of 51 for writer_to_movie_to_writer.
  (d) Excluding the seeds from the oracle, and weighting R* by walk counts, did not help.
  These looks used level 8's 3,000 queries, and this file's population excludes all of them.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, how far can level 8's non-message-passing typed-walk model be pushed toward the GNN's gain over its twin?
  The file asks this when the walks are non-backtracking and the type vector carries an exact per-sequence residual next
  to the rotary text composition. It reads how much of the GNN's gain the primary arm NB-hyb recovers: rho on recall@5,
  full_coverage@5 and hit@1, against the twin and the GNN of each seed pair, on 3,000 fresh V2_GATE queries disjoint
  from levels 0 to 8. It also reads, as paired contrasts on the same queries, what each part adds. Those parts are
  non-backtracking against standard walks, the residual against text alone, text against the residual alone, the
  residual against level 8's hashed buckets, a nonlinear query map, and the wider protocol against level 8's. It reads
  the total against level 8's primary procedure, re-run on these queries. Two true-chain oracles bound what choosing
  the right chain can give with each kind of walk.
role: >-
  Measurement, as at level 8. The object is a set of non-message-passing models fitted to gold labels, cross-fitted
  within V2_GATE. No GNN output enters any fit, target, loss or selection. The twin's z-scored output is the base score,
  as at every level. No model, number or reading of this file enters QLS-U, the twin, a feature contract, M3, M4 or any
  selection. A deployable model of this form would be a competitor trained on the fit split under the QLS-U contract,
  and it would need its own declaration. This file does not open one, and it opens no later level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code, as at level 8
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    Level 8's argument (configs/mp_approx_l8.yaml#boundary) holds unchanged. The standard and the non-backtracking walk
    counts, and the reach sets, are computed at compile time from the served graph, the seed set and the retrieval
    ranks, with no trainable parameter. Excluding the step back to the previous node is a fixed rule on the walk's node
    sequence, and no parameter enters it. Inside the model, every learned quantity is a function of the query embedding
    and a discrete walk type only. The new residual E is a learned vector per discrete token sequence, and the MLP
    query map is a function of the query embedding only. Nothing in any model reads the edge list or a neighbour's
    embedding, score or state, and nothing is repeated.
  what_it_is: >-
    The function class is a query-weighted count of typed non-backtracking walks. It is an approximation of message
    passing by construction, as level 8's is: it could be written as a linear propagation that excludes the step back,
    with a weight per walk that depends on (query, walk type). It has no learned per-edge message, no neighbour state
    and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    As at level 8, the walks read only the packed structural message edges the GNN's cell reads: the same pool, the
    same cap of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction flags.
    The ner and knn families are not read. The fairness contract holds, because both models read the same pool graph.

authorization:
  given:
    - '2026-09-30, the user: "basically i dont want message passing but approximations to it, and pushing it as far as possible and targeting the weakpoints, i think offsets or rope based methods can work because all the stuff is anyways in the semantic space we just need to learn those transformations from the query etc and work from that, and explicit positions so that we have a proper way to represnt, what else do you think we should focus on"'
    - '2026-09-30, the user: "should we allow the edges only not the graph nodes because the gnn also uses them a lot so adding the explicit edges and then using that as a basis for learned offsets along with the queries i think that should be allowed for us because we are still not passing any info"'
    - '2026-09-30, the user: "i think we can do something like learn the proper edge representation that works for us in our space and not hash then use that as extra feature, keep improving that feature and the learning from it, like how isonet++ worked, idk some sort of estimation maximization"'
  how_the_messages_are_answered: >-
    "Pushing it as far as possible and targeting the weakpoints" becomes this file's two changes, each aimed at a weak
    point level 8 filed or its descriptive look showed. Non-backtracking walks address overlapping types and the
    topic's own attributes. The exact per-sequence residual addresses text losing to hash. The RoPE offsets stay as
    the text half of the primary arm's type vector. "Learn the proper edge representation ... not hash" becomes the
    residual E, a learned vector per exact token sequence with no collisions, set against level 8's hashed buckets under
    the same model (id_vs_hash). The EM over the latent chain is kept.
  go_ahead: >-
    Standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  placement_messages:
    - '2026-09-29, the user: "use the damn host not on laptop"'
    - '2026-09-29, the user: "you have the highest priority for cpu and gpu you should never wait and finish everything as fast as possible"'
    - '2026-09-30, the user: "pls mpve and do on the host for faster execution"'
    - answered in placement below
  terminal: STOP_FOR_REVIEW after the run record. No later level, arm or deployable model is opened by any reading here.

this_file_does_not_touch:
  fits: >-
    No GNN or twin is fitted. The pilot's six checkpoints are read. Only this file's arms are fitted, and they are
    cross-fitted measurement models.
  rows: >-
    Level 0's 2,400 metaqa rows (which levels 1 to 7 reused) and level 8's 3,000 rows leave the population before
    anything is scored. V2_HELD_CONFIRMATION is never read. The metaqa eval split is a dev split, and no test row is read.
  frozen: >-
    M2-M3B, universal-v2, UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU task-level qualification, the
    six-dataset base, DEPLOY_CK_2WIKI, DEPLOY_CK_FULL_2WIKI and levels 0 to 8 all keep their bytes: declarations,
    scripts, tests, sidecars, probes, records and documents. Level 8's script is imported unchanged; this file's script
    rebinds some of its module names inside its own process only. Level 0's and level 4's scripts are imported unchanged.
  package: >-
    The CRAG package is read-only. On the host, the verified mirror stands in for it in memory only. Nothing is written
    under either root, and nothing from them enters git.
  competitors: no arm output, type weight, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:
  where: >-
    The host CPU, through tools/rx (docs/GPU_HOST_HANDOVER.md), in rx env mpr-cpu (torch 2.8.0+cpu, numpy 2.3.2, the
    laptop's pinned closure), Windows native. No GPU is used, and scipy and numba are not used.
  why_the_host: >-
    The user's placement messages. The laptop finishes the six-base seed-2 fit, and after that it files the six-base
    work and runs DEPLOY_CK_FULL_2WIKI's latency, which needs the laptop idle.
  package: >-
    As at level 8 (configs/mp_approx_l8.yaml#placement.package). The host mirror of configs/host_mirror_six.yaml (RUN at
    06b6667) is read through the pinned verify_metaqa.json, which must be VERIFIED at <root>/data/final_canonical with
    the declared freeze and the loader imported from the mirror. universal_v2_run.load_configs is wrapped in the
    process, in memory only. No config file is edited, and m3b_compile.open_package's own freeze check still runs.
  threads:
    score: 6 torch threads and BLAS and OpenMP pools of 6, set before numpy loads (level 0's and level 8's scoring counts)
    fit_and_read: 4 torch threads and pools of 4, with torch's deterministic algorithms (level 8's fit_process)
  proof_per_query: >-
    The scoring pass checks the 14 metrics of T_k and G_k against the pilot's stored per-query values on every scored
    query. That check is this placement's proof, query by query. A mismatch is a hard stop, and no tolerance is added.
  host_native: >-
    Every arm and reference is fitted, scored and read on the host CPU. The twin's and the GNN's metrics are the stored
    values, checked exactly. No number of this file is set beside a number made on the laptop.
  identical_code: >-
    Every host job runs from the commit that adds scripts/mp_approx_l9.py and records the LF sha256 of every repository
    module it imports, scripts/mp_approx_l8.py among them. The file stage checks that they form one set, equal to the
    committed files.
  laptop_steps: the doc and file stages, which make no number
  scheduling: >-
    A smoke on a few queries, written outside outputs/mp_approx_l9, comes first. Then the three score shards are
    submitted at once, followed by the assemble and the check. After that, one fit job per arm plus the repeat, and
    then the read. Each job is submitted as soon as its inputs exist. The host scheduler orders them with the
    six-base's jobs under mpr's priority, and nothing running is preempted.

transfer: >-
  None of the data moves. Level 8's inputs are already on the host, as is level 8's qids.json (written there by level
  8's scoring pass). Every host job checks each pinned input's sha256 before reading it. A missing file is pushed with rx
  push --inputs, as the same bytes, before the job. The code arrives as the git-tracked tree. No token or credential
  goes to the host.

