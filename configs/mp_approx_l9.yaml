population:
  rule: >-
    Start from metaqa V2_GATE: the M3B eval population, with its declared digest and count, the stored halves and hops,
    and held rows out, all recomputed as level 8's stage_score does. Level 0's 2,400 rows leave it. They are recomputed
    through level 0's metaqa_subsample and must equal level 0's qids.json and q_row.npy (pinned). Level 8's 3,000 rows
    leave it as well. They are recomputed through level 8's own rule and salt (l8_rows, "mp_approx_l8|") and must equal
    level 8's qids.json (pinned). Per hop, the remaining rows are sorted by sha256("mp_approx_l9|" + query_id), and the
    first 1,000 are kept: 3,000 queries in population order. The rule reads only ids, hops and the gate mask.
  available_per_hop: {1: 3221, 2: 5644, 3: 5473}   # level 8's available rows per hop (4,221, 6,644, 6,473) less level 8's 1,000 each
  folds: level 0's fold_of (sha256(id) mod 5) and is_inner (sha256(id + "|inner") mod 10 == 0), imported unchanged
  gold: >-
    The in-pool golds are m3b_compile.gold_local_of's. A query with no in-pool gold is scored and read, but it enters no
    fit, because it carries no evidence about the chain.
  why_disjoint: >-
    Levels 0 to 7 were read on level 0's rows. This file's design follows level 8's readings and a descriptive look at
    level 8's rows. A fresh draw keeps all of those rows out of every number here.

scoring_pass:   # host CPU, score threads; level 8's stage_score, imported unchanged, with its names rebound in this process
  path: >-
    Level 8's scoring pass (configs/mp_approx_l8.yaml#scoring_pass) runs unchanged, with four names of its module rebound
    in this process only. The population rule becomes this file's. The walk programme becomes this file's combined
    programme (walks below). The pins become this file's, which include every one of level 8's. The declaration and
    output paths become this file's. The chunking, the six forwards, the integrity check, the kept per-query and
    per-node arrays and the shards are level 8's.
  integrity: >-
    As at level 8. rank_metrics of T_k and G_k on the full pool must equal the pilot's stored per-query values of all 14
    metrics exactly, on every scored query. The first mismatch is a hard stop.
  shards: three processes, --shard i/3, then one process without --shard that assembles, as at level 8

walks:   # compiled inside the scoring pass, per query, from the packed batch the forwards read
  graph_tokens_buckets_types: >-
    As at level 8 (configs/mp_approx_l8.yaml#walks): the query's structural message edges, one token 3 r + d per distinct
    relation among an edge's K_REL slots, the seed buckets b0 and b1, and types (bucket, t1, ..., tL) with L = 1, 2 or 3.
  std: >-
    Level 8's counts, from level 8's walk_entries, called unchanged: every walk of the type from a seed of the bucket, and
    walks may revisit nodes.
  nb: >-
    Non-backtracking counts. c_tau(v) is the number of walks v_0, ..., v_L of type tau with v_0 a seed of the bucket and
    v_L = v, over the tokenised edges, with v_{i+1} != v_{i-1} for every i >= 1 (a walk never steps straight back to
    the node it came from). An edge with two relations still counts as two parallel edges, and a step back is excluded
    whichever relation it would use. The counts come from an exact int64 programme over (prefix, previous node, node)
    states, joined by the edges sorted by source, and summed over the previous node for each stored entry. They are
    stored in the same (type, node, count) form.
  one_sidecar: >-
    Both families are compiled in the one pass, from the same packed edges. They are stored in one sidecar. An NB type
    of bucket b is stored under bucket b + 2, so its code is level 8's code plus 2 * 28^3 (43,904), and in every query its entries
    follow the standard ones. A view of each family reads the sidecar back with the buckets 0 and 1, and every arm
    reads one view.
  checks_per_query: >-
    NB's length-1 entries equal the standard length-1 entries exactly. Every NB (type, node) entry is also a standard
    entry, with an NB count no larger than the standard count. A failure is a hard stop that names the query.
  per_type: the size of R_tau and h_tau per type and per family, as at level 8
  null_type: every query also has the null type, u(v) = 1 / n_q over its pool
  ceilings: >-
    More than 2e7 stored (type, node) entries in one query, counting both families, or more than 2e9 over the
    population, is a hard stop. So is a count >= 2^32.
  true_chain: level 8's map from the qtype, imported unchanged (configs/mp_approx_l8.yaml#walks.true_chain)
  direction_check: >-
    Before any fit, the check stage runs level 8's direction check on each family. It files the share of queries whose
    true chain reaches an in-pool gold from either bucket, and the same share with fwd and bwd swapped at every step. In
    either family, a swapped share above the declared share is a hard stop.

arms:   # each arm reads z(T_k), the query embedding, the relation text and one family's compiled types and counts, nothing else
  families: every arm reads one view, std or nb, named by its prefix
  relation_text: >-
    As at level 8: e_r is the served relation table's row for relation r, checked equal to the pinned
    metaqa_rel_embeddings.npy cast to float32, in the pinned vocabulary order.
  query: q is the query embedding the pool was built from (prep.qemb)
  query_map:
    linear: A q, with A a learned 1536 x 64 map, as at level 8
    mlp: >-
      A(q) = W2 GELU(W1 q + b1) + b2, with W1 of 1536 x 256 and W2 of 256 x 64, in torch's default initialisation. It
      replaces A q everywhere A q appears, including the null logit.
  type_vector:   # the weight is level 8's, w(q, tau) = <A(q), e(tau) + beta_b + lambda_L> + c_{b,L}, null logit <A(q), nu> + c_null
    text: e(tau) = level 8's TP composition, the sum over positions l of Rot(l theta) (P e_r + delta_d) (level 8's TypeModel "TP", called unchanged)
    hash: e(tau) = level 8's TP-hash vector H[L, bucket(tau)] (level 8's TypeModel "TP-hash", called unchanged)
    id: >-
      e(tau) = E[s(tau)], where s(tau) is the type's token sequence with the bucket dropped. E holds one learned 64-vector
      per token sequence that occurs in the family's population table, and it starts at 0. Both buckets of a sequence
      share it, while the bucket still enters through beta_b and c_{b,L}. A sequence that occurs only in a unit's scored
      fold receives no gradient and keeps its initial 0, so no label reaches it.
    hyb: >-
      e(tau) = level 8's TP composition + E[s(tau)]. The parameters are created in level 8's TP order (A, then P, delta,
      theta), with E added last at 0. At its initialisation, the arm therefore scores exactly as level 8's TP does under
      the same seed.
  fitted:   # arm: family, type_vector, query_map
    NB-hyb: [nb, hyb, linear]        # the primary arm
    NB-hyb-mlp: [nb, hyb, mlp]
    NB-text: [nb, text, linear]      # level 8's TP on non-backtracking walks
    NB-id: [nb, id, linear]
    NB-hash: [nb, hash, linear]      # level 8's TP-hash on non-backtracking walks
    STD-hyb: [std, hyb, linear]
    STD-text: [std, text, linear]    # level 8's TP; with the nested protocol it is level 8's primary procedure on these queries
    STD-hash: [std, hash, linear]    # level 8's TP-hash
  mixture: >-
    As at level 8: p(tau | q) is the softmax of w(q, .) over the query's types in the arm's family and the null type,
    with u_tau(v) = 1[c_tau(v) > 0] / |R_tau| and m_q(v) = sum_tau p(tau | q) u_tau(v). The score is s_k(v) = z(T_k)(v) +
    kappa log(n_q m_q(v) + eta).
  references:
    NB-oracle: level 8's TP-oracle rule on the nb view, where R* is the true chain's non-backtracking reach set from the better bucket
    STD-oracle: level 8's TP-oracle rule on the std view, which is level 8's TP-oracle on these queries

em:   # every fitted arm
  likelihood_e_step_round_0_m_step: >-
    As at level 8 (configs/mp_approx_l8.yaml#em), through level 8's Fitter, called unchanged on the arm's view. That
    means eps = 0.01, AdamW (lr 1e-3, weight decay 1e-4), 64 queries per minibatch, and 10 epochs per M-step, with the
    epoch that has the best inner-validation soft cross-entropy restored. Each round starts from the previous round's
    parameters.
  rounds: >-
    10 (E, M) rounds after round 0. The kept round is the one with the best inner-validation marginal log-likelihood
    over rounds 0 to 10, and ties go to the earliest.
  kappa_eta: >-
    kappa is chosen in {1/32, 1/16, 1/8, 1/4, 1/2, 1, 2, 4, 8, 16} and eta in {0.01, 0.1, 1, 10, 100}, on the
    inner-validation queries, by the mean of recall@5, full_coverage@5 and hit@1 of s_k. Ties go to the smaller kappa,
    then to the larger eta.
  nested_level8_protocol: >-
    Every unit also files the scores of level 8's protocol on the same fit. The kept round is chosen over rounds 0 to 5
    only, and kappa and eta on level 8's grid, {0.25, 0.5, 1, 2, 4, 8} x {0.01, 0.1, 1}, with level 8's tie rules.
    Rounds 1 to 5 of the unit are the same computation whether or not rounds 6 to 10 follow, so the nested scores are
    the scores level 8's fit_unit would file for the arm. A test checks this bit for bit for STD-text against level 8's
    fit_unit with arm TP. The nested scores are read as the arm "<arm>@L8".

cross_fitting:
  units: >-
    As at level 8: one unit per (arm, k, fold). It trains on the other four folds' queries that have an in-pool gold,
    with the inner-validation queries held out of the gradient, and scores the fold's queries. torch.manual_seed and
    numpy default_rng both take 1000 + 10 k + fold.
  out_of_fold: every scored query's arm score comes from the unit that did not see the query
  unit_files: >-
    Each unit is written atomically with its fit log: the per-round and per-epoch losses, the marginal
    log-likelihoods, the kept round, kappa and eta under both protocols, and the parameter count. A unit already written
    is skipped on a restart.
  repeat: >-
    The unit (NB-hyb, k = 0, fold 0) runs again in a fresh process. Its out-of-fold arrays and fit log are compared
    bitwise with the first run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule. T_k's and G_k's values are the stored ones, checked in the scoring pass.
  rho_readable_rho_bar_gap: >-
    As at level 8: rho_M = (mean over k and queries of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)). A metric is
    readable when its denominator's 95% interval lies above 0. rho_bar is the mean of rho_M over the readable metrics,
    and gap_to_gnn is the mean of M(arm_k) - M(G_k) per metric.
  strata: per hop (1, 2, 3); a stratum's rho is read only if its own denominator interval lies above 0
  anchors:   # descriptive, overall and per hop, per family
    level8_anchors: level 8's check anchors (topic entity, chain reach, chain fit, gold in pool, sizes, edges) on each view
    self_reach: the share of queries whose R* holds a b0 seed, and the share whose R* holds a b0 seed that is gold, per view
    nb_trim: >-
      The mean over queries of |R*_std \ R*_nb| / |R*_std|, and the share of in-pool golds that are in R*_std but not in
      R*_nb (golds the non-backtracking rule removes), overall and per hop.
    agreement: >-
      The share of queries on which the primary arm's out-of-fold argmax type has the true chain's token sequence, with
      the bucket ignored. It is filed per k, then as the mean over k. A null argmax does not agree. The same is filed for
      every fitted arm.
    nmi: the normalised mutual information between the primary's out-of-fold argmax token sequence and the qtype (k = 0)
    grid_edges: >-
      Per arm, the number of units whose kappa or eta sits at an end of its grid, and the number whose kept round is the
      last, under both protocols.

statistics:
  bootstrap: >-
    Level 0's bootstrap: queries resampled with replacement, 1000 resamples, numpy default_rng(0) (level 0's
    boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample matrix serves
    every quantity, so contrasts are paired.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    nb_adds: NB-hyb - STD-hyb
    nb_adds_hash: NB-hash - STD-hash
    id_residual_adds: NB-hyb - NB-text
    text_residual_adds: NB-hyb - NB-id
    id_vs_hash: NB-id - NB-hash
    query_mlp_adds: NB-hyb-mlp - NB-hyb
    protocol_adds: NB-hyb - NB-hyb@L8
    over_level8_primary: NB-hyb - STD-text@L8
    ceiling_gap: NB-oracle - NB-hyb
    nb_ceiling: NB-oracle - STD-oracle

readings:   # filed before any number
  primary: NB-hyb
  bands:   # of rho_bar; the first that applies; the same thresholds as level 8
    L9_ABOVE_GNN: the interval's lower end is above 1
    L9_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L9_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L9_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: NB-oracle's rho_bar interval upper end <= 0.50
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
    GRID_EDGE: more than half of the primary's 15 units choose kappa or eta at an end of the wide grid
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l9_above_gnn: >-
      Primary L9_ABOVE_GNN. On this metaqa population, a non-message-passing model scores above the GNN on the readable
      metrics on average. It reads compiled non-backtracking typed walks and the relation text, and it is fitted to
      golds. The GNN's metaqa advantage over its twin is then reproducible without learned message passing, given those
      inputs.
    l9_high: primary L9_HIGH -- the model recovers most of the GNN's gain on this population
    l9_mid: primary L9_MID -- it recovers part of the gain
    l9_low: primary L9_LOW -- it recovers little of the gain; read it with CEILING_LOW and the agreement anchor
    nb_adds: the nb_adds interval lies above 0 -- non-backtracking walks add to standard walks under the primary's model
    nb_hurts: the nb_adds interval lies below 0 -- non-backtracking walks lose to standard walks under the primary's model
    id_residual_adds: the id_residual_adds interval lies above 0 -- the exact per-sequence residual adds to text alone
    text_residual_adds: the text_residual_adds interval lies above 0 -- the text composition adds to the residual alone
    id_beats_hash: the id_vs_hash interval lies above 0 -- exact sequences beat level 8's hashed buckets under the same model
    query_mlp_adds: the query_mlp_adds interval lies above 0 -- a nonlinear query map adds to the linear one
    protocol_adds: the protocol_adds interval lies above 0 -- the wider grid and the extra EM rounds add
    above_level8_primary: the over_level8_primary interval lies above 0 -- the primary beats level 8's primary procedure on the same queries
    nb_raises_ceiling: the nb_ceiling interval lies above 0 -- the non-backtracking true chain bounds higher than the standard one
    chain_not_identified: the agreement anchor below 0.5 with ceiling_gap's interval above 0 -- the chain is not learned from the question
  wording: >-
    Every arm is cross-fitted on metaqa V2_GATE queries with gold labels. The file measures what non-message-passing
    typed-walk models recover of the GNN's gain on this population. It is never a deployable or selected model, and it
    says nothing about another dataset. No reading may be phrased as "message passing is unnecessary", "we do not need
    message passing" or "the MLP wins". rho here is level 8's quantity on a fresh population. Level 8's numbers are
    quoted beside this file's only with the population named, and the paired comparisons with level 8 are the @L8
    arms on this file's queries. rho is not the within-U_q oracle rho of levels 0 to 7, and the two are never set side
    by side as one quantity.

compute:
  scoring: >-
    Level 8's pass took about 1.07 s per query over three shards of 6 threads, about 18 min per shard. The
    non-backtracking programme adds a pass over (prefix, previous node, node) states per query. Estimate: about 20 to
    30 min per shard, at about 5 to 8 GB per shard.
  storage: >-
    Level 8 stored 5,449 entries per query (at most 14,970). NB entries are at most the standard ones, so the sidecar
    holds at most twice level 8's: about 33 million entries, well under 1 GB.
  fits: >-
    Eight arms x 3 seeds x 5 folds = 120 units plus the repeat, at 4 threads. Level 8's units took 15 to 30 s over 5
    rounds. With 10 rounds, the residual E (one 64-vector per token sequence in the family's table) and the wider
    grid, a unit should take about 1 to 2 min, so one job per arm takes about 15 to 30 min.
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the population digest or count, the halves, the hops, level 0's recomputed rows or level 8's recomputed rows
    differ from the declared or stored ones, or a level 0 row, a level 8 row, a held row or a test row would be scored
  - any integrity check of scoring_pass fails
  - >-
    a structural edge without a relation slot or a direction flag; a walk count >= 2^32; a ceiling of walks is passed;
    the seeds differ from seeds_of; a seed is not a pool member; NB's length-1 entries differ from the standard ones,
    or an NB entry is not a standard entry or exceeds its count
  - a qtype does not parse to a chain of its hop's length, or the direction check fails in either family
  - the relation table differs from the pinned embeddings or vocabulary order
  - the host jobs' recorded code sha256 values are not one set equal to the committed files

outputs:
  script: scripts/mp_approx_l9.py (stages score [--shard i/n], assemble, check, fit [--arm], repeat, read, doc, file)
  sidecars: >-
    outputs/mp_approx_l9/metaqa/ on the host. It holds the per-query and per-node arrays, the walk entries of both
    families, qids.json and meta.json (the sha256 of every array), check.json, units/<arm>/ with the out-of-fold
    scores and fit logs, repeat/ and read.json.
  record: outputs/mp_approx_l9/record.json, assembled on the laptop from the fetched read.json, check.json and meta.json without arithmetic
  document: docs/MP_APPROX_L9.md
  run_record: run_record_mp_approx_l9_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l9.py
  - this file parses, its pins are the files' current sha256, and the declared constants are the script's
  - >-
    the population rule on toy ids is disjoint from level 0's and level 8's rows, recomputes level 8's rows by level
    8's rule, sorts per hop by this file's salted sha256 and keeps the first N
  - >-
    on small random typed multigraphs, with parallel edges and self-loops, the non-backtracking counts of both buckets
    at lengths 1 to 3 equal a brute-force enumeration of the walks with v_{i+1} != v_{i-1}. They do not depend on the
    order of the edges or on the block size. They lie within the standard counts, and at length 1 they equal them.
  - >-
    the combined programme returns level 8's entries unchanged, followed by the NB entries under buckets 2 and 3,
    sorted by code, then node; a broken NB entry stops
  - >-
    on a synthetic combined sidecar, the std view and the nb view each hold exactly their family's entries, with codes
    back under buckets 0 and 1, and level 8's Fitter, mixture and E-step run on each
  - >-
    hyb at its initialisation scores exactly as level 8's TP under the same seed; id reads only E, beta, lambda, c and
    the query map; E is shared by the two buckets of a sequence; the mlp map has the declared shape; each arm's inputs
    are only z(T_k), q, the relation text and the view's types and counts
  - >-
    the nested level-8 protocol of STD-text equals level 8's fit_unit with arm TP bit for bit on a synthetic sidecar,
    and EM with NB-hyb recovers a planted chain from query features
  - metrics, rho, readability and the band order come out right on toy cases, and the contrasts are the declared pairs
  - the check, fit, repeat, read, doc and file stages run end to end on a synthetic combined sidecar
  - no held, level 0 or level 8 query id appears in any sidecar

execution:
  order: >-
    This file alone (commit). The script and tests (commit). Then on the host: a smoke, the three score shards
    submitted at once, the assemble, and the check (direction checks and anchors). Then the eight fit jobs and the
    repeat at once, then the read. Then fetch the read, check and meta files, and on the laptop build the record, the
    doc and the run record (commit).
  stop_after_run: STOP_FOR_REVIEW
