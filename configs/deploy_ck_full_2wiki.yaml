  six_base: configs/mp_approx_six_base.yaml and its fits are not read or written; this file's laptop stages start only after its fits end and its records and eval are filed (the advisor's order)
  package: the CRAG package is read in place on the laptop, read-only, never written, moved or copied
  competitors: no output of this file becomes an input, target, teacher, gate or selection criterion of QLS-U, M3 or M4

