population:
  split: dev
  queries: 12576
  ids_sha256: 9473c881c2811f9c8ce493294ecbbe8628779cdd0e291e62dd60ed14f60e408f
  halves: {V2_GATE: 6290, V2_HELD_CONFIRMATION: 6286}
  rule: deploy_ck_2wiki's population, checked by its eval_population unchanged (digest, size, split and halves against this block and universal-v2's filed values)
  primary_half: V2_HELD_CONFIRMATION, deploy_ck_2wiki's primary half; V2_GATE and the whole population are read beside it with the same bands

scoring:   # stage score: the retrieval of every fit, on the laptop CPU
  pass: >-
    deploy_ck_2wiki.eval_placed, imported unchanged, with device "cpu", no CPU-timed copies (cpu_models empty) and
    amendment 2's laptop reference as its batch check (outputs/deploy_ck_2wiki_reference/batches_laptop.json, sha256
    17353b73..., the first 16 eval batches compared field by field as they are packed). Its checks stand: the population,
    the halves, the ceiling against the headroom cell, the M3B MRR audit on every scorer, the agreement with the frozen
    M3B fixed rrf, the compiled-form scores of ck_full beside its forward. The nine fits are loaded by this file's own
    loader against the pins above and built by deploy_ck_2wiki.build_model (its parameter pins).
  rebinding:   # deploy_ck_2wiki's module globals, rebound in memory in this process only; the sealed script is not edited
    compile_eval_query: >-
      this file's checked compile: the dense rows gathered as before (nodes.read), then the fast compiler
      (fast_features.compiler_for at 8 threads; none, i.e. the reference would serve, is a hard stop) and the reference
      compile_query_v2 on the same inputs; pool, seeds_local, scalars (bit for bit), seedw and every edge array compared
      as tests/test_fast_features.py compares them; any difference is a hard stop; the fast compile is returned
    EVAL: outputs/deploy_ck_full_2wiki/eval
    OUT: outputs/deploy_ck_full_2wiki (where a hard stop writes its evidence)
    LATENCY_QUERIES: 0 (deploy_ck_2wiki's forward-only latency block does not run; this file's latency stage owns timing)
  record_fields_rewritten: the eval record's file field names this file and the rebinding is recorded beside it
  metrics: recall@5 (primary), full_coverage@5 (co-read), hit@1 (descriptive); per arm, the per-query mean over its three seeds
  host_agreement: >-
    systems only: per fit, the number of queries where recall@5, full_coverage@5 or hit@1 differs from
    deploy_ck_2wiki's host eval arrays (outputs/deploy_ck_2wiki/eval/2wiki.npz, pinned), with the query ids aligned by
    the pinned id list. Filed, never read, never used to change anything.

latency:   # stages latency-prepare, latency, memory: systems measurements, all on the laptop
  sample:
    timed: 1024 queries of V2_HELD_CONFIRMATION, evenly spaced over its positions in population order (numpy linspace over the half's positions, rounded; all distinct)
    warm_up: 64 queries of V2_GATE, evenly spaced the same way, run through the whole path before each timed pass and never timed
  arms_and_seed: twin, ck_full and gnn, seed 0 of each (the architecture, not the weights, sets the cost)
  path:   # per query, a batch of one; each stage timed with time.perf_counter; total = the wall time of the whole path
    pool: >-
      the query's pool rebuilt from its cached first-stage lists under the frozen construction (equal_rrf_budget_50 +
      STRUCT h1_c25): m3b_pools.seeds_of, m3b_compile.base_rows on the query's own row, m3b_pools.expand_hops,
      m3b_compile.build_pool, all imported unchanged; outside the clock it must equal the pool the population's prepare
      built (a difference is a hard stop)
    gather: the pool's served embeddings (context.nodes.read), as deploy_ck_2wiki's compile_eval_query gathers them
    compile: the fast compiler (compiler_for(...).compile, v2), from the gathered rows
    pack: universal_v2_models.pack_queries_v2 of the one query
    forward: V2.arm_view and the model's forward, under torch.no_grad, in eval mode
    topk: torch.topk of the scores at k = min(5, pool size) and the global ids of the top entries
  not_charged: >-
    the first-stage retrieval (the query's dense embedding and its dense and SPLADE top-1000 lists, read from the M3B
    caches; upstream of every arm and identical for all), loading the context and the weights, the numba JIT (filed as
    startup seconds), the fixed scorers and every check
  passes:   # in each timed process, in this order
    e2e_fast: the primary; the whole path with the fast compiler, no hooks
    e2e_reference: descriptive; the same path with compile_query_v2 in place of the fast compiler (what the wiring saves)
    breakdown: >-
      descriptive; the e2e_fast path again with forward pre- and post-hooks on the node-local modules each arm shares
      with the twin (input, body where present, readout) and on ck_full's kernel module. graph_part = forward minus the
      node-local modules (the GNN's edge encoding, relations, cells and evidence flow; ck_full's q_state, kernel and
      message projection; about 0 for the twin); kernel = ck_full's kernel module alone, the query-dependent kernel
      built from the query-conditioned halo and applied. The hooks are kept out of the primary pass.
  checks_outside_the_clock: >-
    before any timing (latency-prepare, one process): for every sampled and warm-up query the rebuilt pool equals the
    prepared pool and the fast compile equals the reference (hard stops), and each arm's seed-0 scores and top-5 from the
    cached compile are filed. After each timed pass, every query's top-5 ids and the largest score difference from the
    filed ones (E2E_PATH_DIFFERS if a top-5 differs).
  rounds: >-
    3 rounds; in each, every arm in a fresh process, in the rotated order round 0 twin, ck_full, gnn; round 1 ck_full,
    gnn, twin; round 2 gnn, twin, ck_full. Every process records its startup seconds (context, weights, JIT), its ready
    working set, its peak working set and the CPU frequency at its start and end.
  memory: >-
    peak RAM is filed two ways. (a) Each timed process's peak working set (psutil peak_wset): the whole server, the shared
    context included. (b) The model-side working memory: per arm and round a fresh process that loads only the arm's
    seed-0 weights and the pre-packed batches of the 128 sampled queries with the largest pools (latency-prepare writes
    them, pinned by sha256), runs one warm-up forward, records the working set, runs the forward over all 128, and files
    the peak working set's increase over that point, beside the arm's parameter and buffer bytes.
  laptop_state: >-
    before each timed or memory process: AC power (psutil.sensors_battery; on battery the driver waits up to 30 minutes,
    then hard stops) and the system CPU below 15% over a 3-second sample (the driver waits up to 20 minutes, polling
    every 30 seconds, then runs and flags LAPTOP_NOT_IDLE). The active power scheme (powercfg /getactivescheme) is read
    and filed, never changed. No other stage of this project runs while the latency processes run.

statistics:
  retention: >-
    deploy_ck_2wiki's procedure: one resample matrix per half, default_rng(0), 1000 resamples of the half's queries with
    replacement (deploy_ck_2wiki.resample_matrix), 95% percentile intervals; contrasts are paired differences of per-query
    seed means.
  contrasts:
    gnn_gain: gnn - twin
    full_gain: ck_full - twin
    full_vs_gnn: ck_full - gnn
  shares:   # read only where the denominator's interval lies above 0
    full_share: (ck_full - twin) / (gnn - twin)
  latency: >-
    a cluster bootstrap over the 1024 timed queries: default_rng(0), 1000 resamples of query positions with replacement;
    a drawn query brings its three rounds. Per resample and arm the p50, p95 and p99 of the pooled e2e_fast totals; the
    ratios ck_full / gnn (primary), twin / gnn and ck_full / twin per percentile; 95% percentile intervals. Points are the
    same statistics on all 3 x 1024 values. The forward alone, the graph part and the kernel get the same treatment,
    descriptively.
  memory: the median over the three rounds of each arm's model-side increase, and its ratio ck_full / gnn; descriptive, with the parameter bytes

readings:   # filed before any number of this file exists
  primary_half: V2_HELD_CONFIRMATION
  retention:
    metric: recall@5
    co_read: full_coverage@5
    descriptive: hit@1
    bands:   # exactly one, on the primary half and metric
      GNN_GAIN_ABSENT: gnn_gain's interval reaches 0 (lower end <= 0) -- there is no GNN gain on this half to keep
      FULL_KEEPS: full_share >= 0.75 and its interval's lower end >= 0.50
      FULL_PARTIAL: not FULL_KEEPS, and full_gain's interval lies above 0
      FULL_NO_GAIN: full_gain's interval reaches 0 (lower end <= 0)
  speed:
    statistic: the e2e_fast p50 ratio ck_full / gnn
    bands:   # exactly one
      E2E_FASTER: the ratio's interval lies at or below 0.90 (upper end <= 0.90)
      E2E_MARGINAL: the upper end lies above 0.90 and below 1.00
      E2E_NOT_FASTER: the upper end is 1.00 or more
  flags:
    FULL_NOT_BELOW_GNN: full_vs_gnn's interval reaches 0 or above (upper end >= 0)
    GATE_HALF_DIFFERS: the retention band on V2_GATE is not the reading
    FC5_DIFFERS: the retention band on full_coverage@5 (primary half) is not the reading
    E2E_SLOWER: the p50 ratio's interval lies above 1.00 (lower end > 1.00)
    TAIL_DIFFERS: the speed band computed on p95 or on p99 is not the p50's
    FORWARD_ONLY_DIFFERS: the speed band computed on the forward alone is not the end-to-end one
    MEMORY_ABOVE_GNN: ck_full's model-side memory increase (median over rounds) exceeds the GNN's
    E2E_PATH_DIFFERS: any timed query's top-5 differs from the cached pass's
    LAPTOP_NOT_IDLE: any timed or memory process started without the idle condition
  pareto_statement: >-
    filed from the numbers, in this form: "ck_full keeps {full_share} [{lo}, {hi}] of the GNN's recall@5 gain over the
    twin on V2_HELD_CONFIRMATION at {r50} [{lo}, {hi}] of the GNN's end-to-end p50 latency ({r95} at p95, {r99} at p99)
    and {m} of its model-side memory increase; laptop CPU, 8 threads, a batch of one, the fast compiler wired in." The
    twin's ratios are filed beside it as the no-propagation floor.
  interpretation: >-
    FULL_KEEPS with E2E_FASTER: one query-conditioned hop keeps most of the GNN's gain for measurably less end-to-end
    time, which is the Pareto point the advisor asked for. FULL_KEEPS with E2E_MARGINAL or E2E_NOT_FASTER: the retention
    holds but the shared path dominates the time, so the forward's saving does not reach the server. FULL_PARTIAL or
    FULL_NO_GAIN would contradict deploy_ck_2wiki's host reading of the same weights. None of these opens a stage.
  anticipated: >-
    FULL_KEEPS (deploy_ck_2wiki's ref_share on the same weights). The speed band is open: deploy_ck_2wiki's host CPU
    forward ratio ck_full / gnn was about 0.56 at p50 (a host number, the basis of the anticipation only, never compared
    with this file's), and every arm also pays the shared path, which dilutes the ratio; E2E_FASTER or E2E_MARGINAL is
    anticipated.
  wording: >-
    ck_full is named a compressed, query-conditioned one-hop message-passing approximation. No reading may call it a
    non-message-passing model, an MLP or a QLS-U replacement, and none may be phrased as "message passing is unnecessary",
    "we do not need message passing" or "the MLP wins": whatever ck_full keeps is kept by message passing. No speed
    claim is made except the band this file reads. All numbers are dev-split numbers on one dataset, scored and timed on
    the laptop; none is a canonical result, and none is set beside a host number or an earlier stage's number.

