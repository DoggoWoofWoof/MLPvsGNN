phase: DEPLOY_CK_FULL_2WIKI
opened: 2026-09-30
status: DECLARED_NOT_RUN
branch_type: POST_HOC_ANALYSIS
track: MP-APPROX (the deployable step, advisor step 4; not MP-ORACLE)
extends: >-
  configs/deploy_ck_2wiki.yaml (RUN at d2e51c3). On 2wiki's V2_HELD_CONFIRMATION half (6,286 queries), recall@5, seed
  means over three host_gpu_det fits: twin 0.8533, ck_qi 0.8574, ck_full 0.8926, ck_self 0.8504, gnn 0.8972. Its reading
  was CK_PARTIAL for the compiled form ck_qi (ck_share 0.093 [0.045, 0.142]) with COMPILED_COST (ck_qi - ck_full -0.0352
  [-0.0381, -0.0321]); the per-query form ck_full, its reference, read CK_KEEPS descriptively (ref_share 0.895 [0.851,
  0.944]; ck_full - gnn -0.0046 [-0.0068, -0.0024]). Its latency table timed each arm's forward alone at a batch of one on
  the host and named the end-to-end timing with the fast compiler as step 4's file. This is that file, for ck_full.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  End to end, from a query's cached first-stage lists to its top-5, with the fast feature compiler wired in and on one
  machine, how much of the GNN's recall@5 gain over its matched twin does ck_full keep, and at what fraction of the GNN's
  latency (p50, p95, p99) and memory? Every arm is deploy_ck_2wiki's sealed fits, unchanged: the twin (u_mlp_v2_mix),
  ck_full and the GNN (u_gnn_v2_ef), seeds 0, 1 and 2.
role: >-
  The advisor's decision after deploy_ck_2wiki, quoted in authorization. The selected arm is ck_full; its role is a
  compressed, query-conditioned one-hop message-passing approximation. It is not a non-message-passing MLP and it is not
  a QLS-U replacement: its kernel is learned propagation by configs/universal_v2.yaml#learned_vs_fixed_propagation (its
  message weights kappa and its values are trainable and applied over the pool edges), and its neighbour side reads the
  query, so the kernel is built per query and cannot be compiled once (L7, deploy_ck_2wiki). What this file measures is
  the retrieval it keeps and the time and memory it costs, beside the GNN on the same machine.

authorization:
  given: >-
    2026-09-30, the advisor's reply to the two questions filed after deploy_ck_2wiki, pasted by the user. Quoted:
    "Yes, advance `ck_full` — but do not call it the non-MP solution"; the declaration "DEPLOY_CK_FULL_2WIKI / selected
    arm: ck_full / role: compressed/query-conditioned one-hop MP approximation / NOT: non-message-passing MLP, QLS-U
    replacement"; "Then measure it properly end-to-end against GNN"; "don't claim a speed advantage until that stage";
    "Keep it small: same held population; same three seeds; ck_full frozen architecture; GNN as same-machine comparator;
    no architecture changes"; the measurements R@5, FullCov@5, Hit@1, end-to-end p50/p95/p99, peak RAM, the
    query-dependent kernel-build time, the forward time and the total latency; and the result as the fraction of the GNN
    gain retained beside the runtime ratio.
  order_quoted: >-
    "Do not pause the six-dataset fits. Let them finish." Then: "finish six-dataset base seeds 1–2; file their
    records/eval; then make the laptop idle; wire `fast_features.py`; run the final p50/p95/p99 end-to-end latency stage."
  go_ahead: >-
    standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before the script that runs it, and is then run as written.
  terminal: STOP_FOR_REVIEW after the run record. Any other dataset, a refit, a batch size other than one, a GPU timing, or a compiled form of ck_full each need their own file.

corrections_to_the_proposal:   # checked against the code and deploy_ck_2wiki's record before this file was written
  same_three_seeds_are_the_sealed_fits: >-
    "same three seeds" is read as deploy_ck_2wiki's nine sealed fits of these arms (seeds 0, 1, 2), pinned below by the
    bytes and the content of their weights. Nothing is refitted: a laptop refit would be a new draw on another placement,
    and "ck_full frozen architecture" with "no architecture changes" leaves nothing to fit.
  the_kernel_is_built_inside_the_forward: >-
    ck_full's query-dependent kernel (psi and the values from the query-conditioned halo row of every entry, kappa, alpha,
    the sum) is computed inside its forward, so deploy's forward-only table already contained it. What that table did
    not time is the path around the forward: the per-query pool, the embedding gather, the feature compile, the pack and
    the top-K. This file times the whole path, and times the kernel module separately inside the forward.
  what_the_arms_share: >-
    all three arms read the same compile (universal-v2's frozen contract, 197 columns) and the same packed batch. The
    pack builds the message edges for every arm and the twin reads none of them, so the twin's end-to-end time is an
    upper bound for a server that runs the twin alone. The shared stages are timed per arm all the same: each arm is
    timed as a whole server.
  scores_are_remade_on_this_machine: >-
    the Pareto point pairs a retention with a latency, and no number is set beside a number made on another machine. The
    retention is therefore scored again, on the laptop CPU, from the same weights and the same population, and is never
    set beside deploy_ck_2wiki's host_gpu_det numbers. The CPU's scores of the same weights may differ from the GPU's in
    the last bits (configs/cpu_gpu_equivalence.yaml: score-level NOT_EQUIVALENT); the number of queries where a metric
    differs from deploy_ck_2wiki's host eval arrays is filed per fit as a systems count, never a reading.
  wiring_the_fast_compiler: >-
    src/mp_retrieval/fast_features.py (f4fc3c2) reproduces compile_query_v2 bit for bit under one BLAS configuration (its
    tests; the BLAS-thread trap of configs/host_mirror_six.yaml). Every stage of this file that compiles runs at 8
    OpenBLAS threads, the count at which amendment 2's laptop reference was packed, and compiles every query with the
    fast compiler and, outside any clock, with the reference; any difference is a hard stop. The fast compiler is
    imported unchanged and is not edited by this file (its freeze stands).
  forward_compiled_is_not_timed: >-
    ck_full has no compile-once form (L7: its neighbour side reads the query). Its forward_compiled (the moments) is
    scored beside the forward by the imported eval pass as deploy_ck_2wiki scored it, as an exactness check only; it is
    never timed and never an arm.

