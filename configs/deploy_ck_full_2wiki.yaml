placement:
  machine: >-
    the laptop (Inspiron-14; 12 logical and 10 physical CPUs; 15.7 GB), CPU only, float32; torch 2.8.0+cpu, numpy 2.3.2,
    numba 0.67.0. Every stage sets OPENBLAS_NUM_THREADS, OMP_NUM_THREADS, MKL_NUM_THREADS, NUMEXPR_NUM_THREADS and
    NUMBA_NUM_THREADS to 8 before numpy, numba and torch load, and torch.set_num_threads(8).
  why_the_laptop: >-
    the fast compiler needs numba, which only the laptop's environment carries (the host's rx environments are not
    edited), and the Pareto point needs the retention and the latency from one machine.
  identical_code: >-
    every stage runs from one git commit, the commit that adds scripts/deploy_ck_full_2wiki.py, and records the LF sha256
    of every repository module it imported (the absolute-path guard of deploy_ck_2wiki.module_shas). The file stage checks
    that they are one set, equal to the committed files.
  no_cross_machine_numbers: no number of this file is set beside a number made on the host

compute:
  score: >-
    12,576 queries compiled twice (the fast compiler and, as its check, the reference), nine fits and ck_full's compiled
    form scored on the CPU in blocks of 227 queries, and the fixed scorers; projected under 1.5 h, peak working set a few GB
  latency: nine timed processes (startup, three passes of 1,088 queries) and nine memory processes; projected under 2 h
  ceiling: >-
    a stage over 4 hours is stopped by the driver and filed as a deviation; nothing else changes. The six-base's laptop
    fits and eval end before any stage here starts, so no stage competes with them for memory.

hard_stops:   # on any: the evidence is written to outputs/deploy_ck_full_2wiki/hard_stop.json, nothing further runs in that process, and it is reported
  - any pin in inputs or arms fails (code, files, weights bytes or content, records)
  - the fast compiler does not serve 2wiki's context, or a query's fast compile differs from the reference in any array
  - the population, its split or its halves differ from population; any test split
  - amendment 2's batch check, the ceiling check, the MRR audit or the M3B fixed-rrf agreement fails
  - a rebuilt pool differs from the prepared pool
  - the laptop is on battery for 30 minutes before a timed process
  - an arm's parameter count is not its pin

outputs:
  laptop: >-
    outputs/deploy_ck_full_2wiki/{eval/2wiki.{npz,json}, eval/2wiki_query_ids.json, latency/sample.json,
    latency/packed_top128.pt, latency/<arm>__r<round>.json, memory/<arm>__r<round>.json, read.json, record.json}
    (git-ignored) and docs/DEPLOY_CK_FULL_2WIKI.md
  run_record: run_record_deploy_ck_full_2wiki_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_deploy_ck_full_2wiki.py, laptop CPU, committed with the script and run before any stage
  - this file parses; its arms, fits, bands and flags are the script's in order; every fit key is deploy_ck_2wiki's
  - the frozen code and the pinned files equal their pins
  - the rebinding sets exactly the four globals and is undone by the context that made it
  - the checked compile detects a one-bit change in the scalars, the seed weights, an edge array or the pool
  - the latency sample has 1024 distinct held positions and 64 distinct gate positions, evenly spaced, and is deterministic
  - the cluster bootstrap reproduces a known ratio on synthetic latencies, and every speed band and flag lands where its rule says
  - the retention bands on synthetic arrays land where the rules say (each band, an unreadable share)
  - module_shas survives torch.ops' relative __file__ (torch.ops.aten imported first)
  - >-
    a smoke on the real 2wiki data, laptop CPU, read-only, run first once the six-base has ended: the score pass on a
    shard of the population with the nine fits (the fast and reference compiles equal on every query), then
    latency-prepare, one timed process and one memory process on 16 sampled queries, then read and doc on those records

execution:
  order: >-
    this file committed alone -> the script and its tests committed, the tests passing on the laptop -> (the six-base
    fits end; its records and eval are filed) -> the smoke -> score -> latency-prepare -> latency (nine timed processes)
    and memory (nine processes) -> read -> doc -> file (run record) -> STOP_FOR_REVIEW
