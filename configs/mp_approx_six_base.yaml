this_file_does_not_touch:
  stage_2: every stage-2 cache, checkpoint, eval array, record and document keeps its bytes; universal_v2_six.py and universal_v2_run.py are imported unchanged
  ladder: levels 0 to 5 keep their declarations, scripts, tests, sidecars, probes, records and documents
  package: the CRAG package is read in place and never written; nothing from it enters git
  competitors: no checkpoint, score, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - a pinned input or frozen code file differs from its sha256
  - the twin's parameter count is not 330955
  - universal_v2_six.open_six or training_rule_six refuses (a cache that is not the frozen contract or the filed carve, or a training rule that is not the frozen one)
  - the frozen rule's EpochTooLong abort
  - the fit-hour ceiling above
  - in work 2, any integrity mismatch

outputs:
  work_1: outputs/mp_approx_six_base/fits/ (weights, fit records, the fit log)
  work_2: outputs/mp_approx_six_base/<name>/ (level 0's sidecar layout), scoring records
  record: dated blocks appended to this file (fits_record_<date> after work 1, run_record_<date> after work 2)

tests:   # tests/test_mp_approx_six_base.py
  - the declaration's pins parse and the frozen code files hash to them
  - the fit stage builds u_mlp_v2_mix through the frozen make_model with 330,955 parameters on the frozen contract's inputs
  - a fit whose record exists is not repeated; the fit-hour ceiling refuses a fit that would breach it
  - fit keys and output paths are this file's, never stage 2's directories

execution:
  - commit this file alone
  - commit scripts/mp_approx_six_base.py (work 1) and its tests, with no number
  - run the three fits in order on the laptop; file fits_record_<date>
  - commit work 2's code and its tests, pinning the stage-2 eval arrays, with no number
  - run work 2; file run_record_<date>; status RUN; commit; STOP_FOR_REVIEW

amendment_1_2026_09_30_record_crash:   # filed after seed 0's first process ended rc 1 and before any process runs again
  what: >-
    Seed 0's first fit process (started 04:57Z by --stage fits) ran the frozen rule to its end: six epochs, early stop
    after epoch 5, best epoch 3, 25,373.9 s. At 12:00Z it wrote the best weights (u_mlp_v2_mix__H128__six__s0.pt,
    sha256 0b2702d70ae3...) and its checkpoint (finished, epochs_done 6). It then raised FileNotFoundError in module_shas
    while building the record: torch.ops and torch.classes carry __file__ = "_ops.py" and "_classes.py", which resolve
    under the repository and name no file. No record was written and the checkpoint was kept. --stage fits exited as
    declared ("the next seed is not started"); seeds 1 and 2 had not started.
  fix: >-
    systems only. module_shas skips a __file__ that is not absolute, as scripts/mp_approx_l3.py and
    scripts/deploy_ck_2wiki.py already do, and one test is added. No code that packs, fits or scores changes, and no
    pinned file changes.
  seed_0: >-
    runs again through its own finished checkpoint, as work_1.resumable declares: fit_model restores the checkpoint's
    record and best weights and takes no step. The weights it writes must equal the first process's by content; the first
    file is kept as outputs/mp_approx_six_base_superseded/u_mlp_v2_mix__H128__six__s0.first_process.pt. Its record's
    module_sha256 names the fixed script. Its peak RSS and wall seconds are the resuming process's, while the fit's
    seconds come from the checkpoint.
  then: >-
    --stage fits runs seeds 1 and 2 in order on the laptop, as placement declares, each in a fresh process at 8 threads
    with the first launch's environment. Its output is appended to fits.log and fits.err, which keep the first process's.
  unchanged: everything else

