phase: MP_APPROX_SIX_BASE
opened: 2026-09-30
status: RUN
branch_type: POST_HOC_ANALYSIS
track: MP-ORACLE
extends: >-
  the MP-Approx ladder (configs/mp_approx_l0.yaml to configs/mp_approx_l5.yaml), which reads only the pilot trio
  (metaqa, 2wiki, squad), and universal-v2 stage 2 (configs/universal_v2.yaml#run_record_stage_2_2026_09_28, RUN at
  c2cfda1), which fitted u_gnn_v2_ef jointly on the six datasets and nothing else. Level 0 recorded why the ladder
  stops at three datasets (configs/mp_approx_l0.yaml#corrections_to_the_proposal.matched_pairs): "a trained GNN with a
  matched twin exists only for the pilot trio ... The stage-2 six-dataset GNN has no six-dataset twin". This file
  builds that twin and the scored base the ladder reads, so a later level can run on six datasets. No level runs here.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  Build the six-dataset base of the ladder. (1) Fit the matched non-message-passing twin of the stage-2 six-dataset
  GNN: u_mlp_v2_mix jointly on the six datasets under stage 2's frozen training rule, seeds 0 to 2. (2) Score the
  six-dataset pair (T_k, G_k, G0_k) on each dataset's evaluation rows and keep level 0's sidecar, so that the ladder's
  targets r_k = z(G_k) - z(T_k) and e_k = z(G_k) - z(G0_k) exist on hotpotqa, musique and webqsp, and on the trio
  under the same pair.
role: >-
  An analysis base only. The twin is fitted so that the GNN's residual over a matched non-message-passing model can be
  measured; it is not a Universal-MLP candidate. The stage-2 ruling stands unchanged: "Don't advance u_mlp_v2_mix as the
  universal MLP" (configs/universal_v2.yaml#authorization_stage_2_2026_09_22.ruling_verbatim). No checkpoint, score,
  target or number of this file enters QLS-U, a feature contract, M3, M4, any gate or any selection. The twin's
  select-carve numbers are the early-stopping trace of its own fit and are never read as a result.

authorization:
  given: '2026-09-30, the user: "parallely get ready to add the other datasets also into the mix"'
  context: >-
    the advisor's L6 plan, pasted by the user with that message, keeps metaqa as the target, 2wiki as the positive
    control and squad as the negative control of the next level. That level runs on the trio base. This file prepares
    the base on which the ladder can later add hotpotqa, musique and webqsp.
  go_ahead: >-
    standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  terminal: >-
    STOP_FOR_REVIEW after the run record. No level is run on the six-dataset base by this file; each needs its own
    dated file (or a dated block in its level's file) that names this base.

rulings_respected:
  stage_2_scope: >-
    authorization_stage_2_2026_09_22 opened stage 2 "for u_gnn_v2_ef and nothing else". This file does not edit that
    block, its run record or any stage-2 artifact. The twin is fitted under a new file, into new directories.
  universal_mlp_ruling: >-
    u_mlp_v2_mix is not advanced. v2.1 (V21_STAGE_A_FAIL at d14c7f6) and v2.2A (V22A_STAGE_A_FAIL at 6ff664c) stay
    closed, and v2.2B stays unopened. This twin is the ladder's reference model, exactly as the trio twin was at level 0.
  stages_3_and_4: universal_v2 later_stages.stage_3_per_dataset_copies and stage_4_leave_one_dataset_out are not opened
  h3_twin_parity: >-
    configs/universal_v2.yaml#hypotheses.H3_twin_parity_where_mp_does_not_pay names a stage-2 GNN-minus-twin
    measurement that stage 2 could not make, because it fitted no twin. This file does not read that hypothesis. Any
    reading of it would be a separate dated block in configs/universal_v2.yaml.

what_exists:
  gnn: >-
    u_gnn_v2_ef__H128__six__s{0,1,2}: stage 2's three joint six-dataset checkpoints, 420,932 parameters each, fitted on
    the laptop CPU at 8 threads (best epochs 3, 5, 4; 107,168 s, 106,387 s and 91,249 s). They are read-only here.
  trio_twin_not_used: >-
    u_mlp_v2_mix__H128__s{0,1,2} (outputs/universal_v2/fits/) was fitted on the trio only. Scoring hotpotqa, musique or
    webqsp with it would mix transfer to an unseen dataset into r_k, so it is not used by this file.
  no_six_twin: no checkpoint of any non-message-passing arm fitted on the six datasets exists

work_1_twin_fits:
  arm: u_mlp_v2_mix
  architecture: >-
    universal_v2_run.make_model("u_mlp_v2_mix", inputs, bank), imported unchanged: UMLPv2Mix (the QLSU body and readout
    over the GatedInputBlock), hidden 128, dropout 0.2, over the frozen 129-column contract
    (contract_frozen_2026_09_19, core sha256 8d1da88b14df...). The relation bank is the served six-dataset bank, an
    input and not a weight, as in stage 2.
  parameters: 330955   # the trio twin's count over the same 129 columns; any other count is a hard stop
  training_rule: >-
    stage 2's, read through universal_v2_six.training_rule_six (imported unchanged), which refuses unless it is the
    frozen rule: max_epochs 6, 2000 batches per epoch, batch 16, patience 2, lr 1e-3, weight_decay 1e-4, clip 1.0,
    dataset_draw per_query (for every slot the dataset is drawn uniformly over the six, then a fit query of it),
    epoch_limit_s 28800. Early stopping on the macro select recall@5 over the six select carves, the best epoch's
    weights kept. m3b_train.fit_model, imported unchanged, with pack_workers 2 and prefetch_depth 2 (universal_v2_run.PACK),
    as stage 2's fits.
  carves: >-
    the six fit and select caches under outputs/universal_v2/cache/, opened through universal_v2_six.open_six (imported
    unchanged), which checks each against the frozen contract and against the carve that stage 2 filed before a weight
    moves. The meta.json files are pinned below by sha256.
  seeds: [0, 1, 2]
  seeding: torch.manual_seed(seed) before the model is built, then fit_model(seed=seed), as stage 2's stage_fit_six
  warm_start: none. Every fit starts from its seed's initialisation; no trio or stage-2 checkpoint is loaded
  config_passed_to_fit_model: '{"H": 128, "stage": "six", "file": "mp_approx_six_base"}'
  resumable: >-
    through fit_model's own checkpoint (outputs/mp_approx_six_base/fits/<key>.ckpt, written after every epoch), so a
    restart continues as the uninterrupted fit would have. The checkpoint is deleted once the record is written.
  outputs: outputs/mp_approx_six_base/fits/u_mlp_v2_mix__H128__six__s{seed}.pt and .json (state_sha256 in the record)
  record_fields: >-
    fit_model's record (epochs run, best epoch, the per-epoch history with its per-dataset select recall@5, seconds),
    plus the key, arm, seed, parameters, datasets, the training rule as read, threads, pack settings, peak RSS, the
    placement, the LF sha256 of every repository module the process imported, and state_sha256.

work_2_scoring_pass:   # declared now, before any number of it exists; its code is committed before it runs
  runs_after: work 1's three fit records exist
  path: >-
    level 0's scoring pass (configs/mp_approx_l0.yaml#scoring_pass), with the six-dataset pair in place of the trio
    pair: T_k = u_mlp_v2_mix__H128__six__s{k} (this file), G_k = u_gnn_v2_ef__H128__six__s{k} (stage 2), G0_k = G_k
    with message_passing = False for one forward, restored at once and asserted, state_dict digest equal before and
    after. Level 0's code is imported unchanged wherever it is parameterised by paths; anything that is not is copied
    under a new name in this file's script, and a test holds the copy equal to level 0's on level 0's trio pair.
  populations:
    metaqa: level 0's 2,400 queries exactly (800 per hop among the V2_GATE rows, level 0's sha256 rule and salt)
    2wiki: level 0's 6,290 queries exactly (V2_GATE)
    squad: level 0's 5,841 queries exactly (V2_GATE)
    hotpotqa: stage 2's evaluation population, all 7,405 queries (it has no V2 halves)
    musique: stage 2's evaluation population, all 2,417 queries (it has no V2 halves)
    webqsp: stage 2's evaluation population, the 1,503 queries it scored (46 zero-gold queries were excluded there and stay excluded)
    held_rows: V2_HELD_CONFIRMATION rows are never read; they exist only on the trio and are outside level 0's queries
    test_rows: every population is a dev split (m3b_controlled_comparison.yaml#populations.eval_splits); no test row is read
  integrity:
    gnn_against_stage_2: >-
      for G_k, rank_metrics of the full-pool scores equals the stage-2 stored per-query value of all 14 METRIC_NAMES
      exactly, on every scored query (outputs/universal_v2/six/eval/<name>.npz, pinned below). The scoring runs at 4
      threads, the thread count of the stage-2 eval records, so the check can be exact.
    twin: T_k has no stored counterpart; its full-pool metrics are computed and filed, and nothing is checked against them
    analysis_set: level 0's (the nine functions' top-20 metrics equal within U_q and on the full pool)
    on_mismatch: hard stop at the first mismatch, naming the query, function and metric; no tolerance is added afterwards
  sidecar: >-
    level 0's layout exactly (the files level 0's Sidecar class reads), under outputs/mp_approx_six_base/<name>/, with
    U_q = the in-pool golds plus the top 20 of each of the nine functions (KEEP_TOP 20), folds and the inner split by
    level 0's rules, and the first-support STRUCT bucket by D0.1's rule. On metaqa, 2wiki and squad the queries are
    level 0's, so a later level can set the six-dataset pair beside the trio pair on the same rows.
  descriptive_gap: >-
    the seed-mean full-pool recall@5, hit@1 and full_coverage@5 of G_k and T_k per dataset are filed as the gap that
    the ladder's levels would approximate (as level 0's gaps_already_filed). They are not a result of this file, carry
    no interval and no reading, and are never set beside a number of another file.

placement:
  every_stage: laptop CPU, the machine and thread count of stage 2's six-dataset fits
  threads: work 1 runs at 8 threads (stage 2's fits, amendment_7_2026_09_23); work 2 at 4 (stage 2's eval records)
  one_at_a_time: >-
    the laptop has 15.7 GB of RAM and stage 2's joint fit peaked at 9.4 GB, so the fits run one after another (seed 0,
    1, 2), each in a fresh process, and work 2 starts after the last fit
  why_not_the_host: >-
    the joint fit and the scoring pass read the node embeddings of every pool of all six datasets from the served CRAG
    files through the frozen packer. A host mirror of those files is about 56 GB, about 13 hours of upload at the rate
    measured on 2026-09-29 (docs/GPU_HOST_HANDOVER.md#the-data-problem), and a host-CPU stage would also need its own
    dated authorization and mirror verification. The laptop runs the fits without the transfer and on the platform of
    the six-dataset GNN they are matched to.
  a_later_host_placement: >-
    if a later file moves any part of this base to the host, it files the authorization, the mirror and its
    verification first; a host-CPU fit is a new draw, never a replica of a laptop seed

compute:
  estimate: >-
    the trio twin's epochs took about 23 to 40 minutes against 75 to 156 for the trio GNN; stage 2's joint GNN epochs
    took 3.6 to 6.4 hours on this laptop at 8 threads. At the same ratio a joint twin epoch is about 1 to 2 hours, so a
    fit of up to 6 epochs is about 4 to 12 hours and the three fits about 12 to 36 hours. The scoring pass is about 3
    to 5 hours at 4 threads (stage 2's per-query eval times, nine forwards instead of three).
  ceiling: >-
    45 fit-hours for the three fits. Before a fit starts, the seconds of the fits already filed plus that fit's
    projection (the longest filed fit, or 15 hours before any is filed) must stay within it; otherwise ceiling_breach.json
    is written and no further fit starts. The frozen rule's epoch_limit_s (28800 s) stays the per-epoch abort.
  disk: about 5 MB per checkpoint and a checkpoint file while a fit runs; work 2's sidecars about 1 to 4 GB per dataset

