      outputs/host_mirror_six/verify_hotpotqa.json: 7bf639021d627bee5c036d12c8c5e09d681d887831334a8707a454a04935d335
      outputs/host_mirror_six/verify_webqsp.json: 35c5e4114b803e74e9908e467dedc5326200f10eb048b17f7b18f5a2e52ea349
    how_it_is_read: >-
      before a host process opens anything, it checks that the root is the one configs/host_mirror_six.yaml names
      (host.mirror_root). It also checks that each verify record has its pinned sha256 and is VERIFIED at
      <root>/data/final_canonical, with the declared freeze and the loader imported from the mirror, and that together
      the records cover the six datasets. Anything else refuses the process. The mirror reaches the frozen code only in
      memory: universal_v2_run.load_configs is wrapped in the process so that substrate.package_root is the mirror, for
      level 0's stage_score and for score_pair alike. No config file is edited, and m3b_compile.open_package's own check
      of the served freeze still runs.
  host_placement:
    machine: >-
      the lab host through tools/rx (docs/GPU_HOST_HANDOVER.md): host CPU only, rx env mpr-cpu (torch 2.8.0+cpu, numpy
      2.3.2, the laptop's pinned closure), Windows native. No GPU is used.
    threads: >-
      unchanged from placement.threads. Each scoring process runs at 4 torch threads with BLAS pools of 2
      (M3B_BLAS_THREADS unset, as on the laptop); each equivalence runs at level 0's 6 and 6.
    verdict_and_this_deviation: >-
      configs/cpu_gpu_equivalence.yaml's verdict_host_cpu_t8 (EQUIVALENT_WITHIN_TOLERANCE; T1 bit-identical to the laptop
      on all 1,056 cells) names the host CPU at 8 threads. These processes run at work 2's declared counts instead,
      because work 2's integrity check compares against stage 2's stored per-query values, which were computed at 4
      threads. That check stays exact, and it is this placement's proof, query by query, that the host reproduces the
      laptop's forwards at these counts: G_k's 14 metrics on every scored query of the six datasets, and in each trio
      equivalence level 0's own check of T_k and G_k against the pilot's laptop values. A mismatch is the declared hard
      stop (hard_stops: in work 2, any integrity mismatch). Work 2 then returns to the laptop under a further amendment,
      and no tolerance is added. T_k of the six pair has no stored counterpart (work_2_scoring_pass.integrity.twin). Its
      host forwards stand on the same arm's exact trio check and on G_k's.
    at_once: >-
      placement.one_at_a_time was the laptop's RAM (15.7 GB). The host's 127.7 GB holds several scoring processes at
      once (stage 2's eval peaked at 7.7 to 11.8 GB per process), so the jobs are submitted together and the host
      scheduler orders them.
  shards: >-
    systems only. A scoring pass may run as n shard processes (--shard i/n). Shard i scores the chunks ci with ci mod n
    = i of the declared chunking, which is unchanged (level 0's CHUNK_NODES over the mean pool size). One process
    without --shard then finds every chunk written and assembles them through level 0's assemble. Stage 2's metaqa eval
    ran in four shards the same way. The rows, the chunks, the arrays and every check are one process's, and a chunk no
    shard wrote is scored by the assembling process. Each shard files shard_<i>of<n>.json (its chunks, seconds, peak
    RSS, threads, placement and module sha256), and the assembling process carries these records into meta.json.
    Declared shards: musique 4, metaqa 3, webqsp 2; squad, 2wiki and hotpotqa one process each.
  sidecars: >-
    the sidecars stay on the host, under outputs/mp_approx_six_base/<name>/ there, where the ladder's host-native levels
    read them. The link down is about 0.75 MB/s (docs/GPU_HOST_HANDOVER.md), and level 0's trio sidecars were 1.2 to
    1.8 GB each. After the six passes, a host process (--stage verify) re-reads every array against its meta.json
    through level 0's Sidecar and files verify_host.json. The laptop fetches meta.json, qids.json, query.npy, the
    q_*.npy arrays, the shard records, the equivalence records and verify_host.json. It checks each fetched array
    against meta.json, takes verify_host.json for the arrays that stayed on the host, and files run_record_<date>. The
    record says where each sidecar is.
  transfer: >-
    pushed with rx --inputs before the jobs that read them, each checked on the host by the existing pin checks. For
    work 2: the six stage-2 eval arrays and id lists (inputs.stage_2_eval), outputs/universal_v2/feature_contract.json
    and selection.json (inputs.contract), the twelve cache meta.json files (inputs.caches) and the three stage-2
    checkpoints (inputs.gnn_checkpoints). For the equivalence: level 0's inputs, which are the trio's pilot eval arrays
    and id lists and the pilot's six checkpoints. After fits_record_<date>: the three twin fits.
  identical_code: every work-2 process, on the host or the laptop, runs the commit that adds this amendment's code; the file stage checks it as declared, shards included
  unchanged: everything else, including every population, the integrity checks, the hard stops, the sidecar layout and the thread counts
