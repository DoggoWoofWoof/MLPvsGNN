    mirror_root: C:/Users/Student2/rx/projects/mpr/mirror/CRAG
    freeze_RECORD_SHA256: 58958f33a3af74c21fa625ffd79da16c573cb5d2ba7e9745da0056b568591ab0
    verify_record: {path: outputs/host_mirror_six/verify_metaqa.json, sha256: 1afb2506fb85f6df532d27bed5ecfa11580de55614222bb504145f57b76c02ec}

population:
  rule: >-
    Start from metaqa V2_GATE, recomputed as level 8's stage_score does (the M3B eval population with its declared
    digest and count, the stored halves and hops, held rows out). Level 0's 2,400 rows leave it (recomputed through
    level 0's metaqa_subsample, equal to level 0's pinned qids.json and q_row.npy). Level 8's, level 9's and level 10's
    3,000 rows each leave it, each recomputed through its own level's rule and salt and checked against its pinned
    qids.json (level 10's through l10_rows, "mp_approx_l10|", which checks level 9's, whose l9_rows checks level 8's).
    Per hop, the remaining rows are sorted by sha256("mp_approx_l11|" + query_id), and the first 1,000 are kept: 3,000
    queries in population order. The rule reads only ids, hops and the gate mask.
  available_per_hop: {1: 1221, 2: 3644, 3: 3473}   # level 10's available rows per hop (2,221, 4,644, 4,473) less level 10's 1,000 each
  budget: >-
    After this file, 221 hop-1 V2_GATE rows remain outside every level's population. A later level that draws fresh
    metaqa rows cannot draw 1,000 per hop, and its own file says how it draws.
  folds: level 0's fold_of (sha256(id) mod 5) and is_inner (sha256(id + "|inner") mod 10 == 0), imported unchanged
  gold: >-
    The in-pool golds are m3b_compile.gold_local_of's. A query with no in-pool gold is scored and read, but it enters no
    fit, because it carries no evidence about the chain.
  why_disjoint: >-
    Levels 0 to 7 were read on level 0's rows, and levels 8, 9 and 10 on their own rows. This file's design follows level
    10's readings and the descriptive looks at level 10's rows. A fresh draw keeps all of those rows out of every number
    here. Level 9's and level 10's rows enter only as training rows (training_rows) and are never scored.

training_rows:   # read by the NB-setX fit only
  what: >-
    Level 9's and level 10's 6,000 compiled rows, from the sidecars their own scoring passes wrote on the host, read as
    their non-backtracking family. They are V2_GATE rows, disjoint from each other and from this file's population. Each
    passed its own level's scoring integrity check (the 14 metrics of T_k and G_k equal to the pilot's stored values on
    every query, with 0 mismatches) and its own level's check stage.
  why_these: >-
    The learning curve (design_informed_by (a)) was still rising at level 10's fit-set size. Level 8's sidecar holds
    the standard family only, and level 0's sidecar is in level 0's form, so neither carries non-backtracking walks.
    Level 9's and level 10's sidecars are the only compiled non-backtracking metaqa rows outside this file's population.
  role_in_a_unit: >-
    In every NB-setX unit, an added row is a training row whatever the unit's fold. If it has an in-pool gold, it is a
    fit row, or an inner-validation row when level 0's is_inner holds for its id. If it has no in-pool gold, it is in no
    set of the unit. No added row is ever scored. So the added rows enter the fit set, the per-epoch early stopping,
    the kept round's inner marginal log-likelihood and the inner selection of each score's parameters. data_adds reads
    all of these together.
  merged_view: >-
    The NB-setX fitter reads one view of three sidecars' non-backtracking families: this file's 3,000 rows, then level
    9's 3,000, then level 10's 3,000. Each part is level 9's View with its checks on, so every array and qids.json is
    checked against its meta.json, and its folds and inner flags against level 0's rules. The per-query and per-type
    arrays are concatenated in that order. Node-level and entry-level reads (a query's entries, reach sets, golds and
    the twin's z-scores) go to the query's own part, at its index there. The added rows' fold is set to -1, which is no
    fold, so level 8's unit_queries puts them in every unit's training rows. qtype indices map into one merged list:
    this file's qtypes, then any new names in order of first appearance. Level 8's Fitter, level 10's SetFitter and
    level 10's fit_unit read the merged view through the same attributes and methods as a single view, unchanged.
  reads_no_number: >-
    No number of this file is read on an added row. On added rows, the fits compute only their losses, their marginal
    log-likelihoods and the inner metrics that choose the kept epoch, kappa, eta and beta.

scoring_pass:   # host CPU, score threads; level 8's stage_score, imported unchanged, with its names rebound in this process
  path: >-
    As at level 10, level 8's scoring pass runs unchanged, with the names of its module that level 9 rebinds, rebound in
    this process only. The population rule becomes this file's. The walk programme is level 9's combined programme
    (walk_entries_both, imported unchanged). The pins become this file's, which include every one of level 10's. The
    declaration and output paths become this file's. The chunking, the six forwards, the integrity check, the kept
    per-query and per-node arrays and the shards are level 8's, and the sidecar has level 9's combined form.
  integrity: >-
    As at levels 8 to 10. rank_metrics of T_k and G_k on the full pool must equal the pilot's stored per-query values of
    all 14 metrics exactly, on every scored query. The first mismatch is a hard stop.
  shards: three processes, --shard i/3, then one process without --shard that assembles, as at levels 9 and 10

walks: >-
  Level 9's (configs/mp_approx_l9.yaml#walks), unchanged: the std family (level 8's counts) and the nb family
  (non-backtracking counts), compiled in one pass into one sidecar and read back as two views; the per-query checks,
  the null type, the ceilings and level 8's true-chain map. The fits read the nb family only.

check: >-
  Before any fit, the check stage runs level 9's check_family on each view, imported unchanged: level 8's direction
  check (a swapped share above the declared share, in either family, is a hard stop) and level 9's anchors. It
  refuses any level 0, 8, 9 or 10 query id and any held row in the sidecar.

arms:   # each arm reads z(T_k), the query embedding, the relation text and the nb family's compiled types and counts, nothing else
  model: >-
    Level 10's NB-set model, unchanged, on both fits: level 9's NB-hyb model (level 8's TP composition plus the exact
    per-sequence residual, the linear query map A q, 1536 x 64, w(q, tau) = <A q, e(tau) + beta_b + lambda_L> +
    c_{b,L} and the null logit <A q, nu> + c_null) on non-backtracking walks, with level 10's set likelihood and its
    closed-form theta. p(tau | q) is the softmax of w(q, .) over the query's nb types and the null type.
  fits:   # fit: its training rows
    NB-set: this file's rows only (level 10's fit on this file's population, the control)
    NB-setX: this file's rows, plus level 9's and level 10's rows (training_rows)
  procedure: >-
    Each unit of both fits is level 10's fit_unit for NB-set (scripts/mp_approx_l10_fit.py, imported unchanged), called
    unchanged on level 10's SetFitter over the fit's view. For NB-set that view is level 9's View of this file's
    sidecar. For NB-setX it is the merged view. fit_unit runs the EM, keeps a round by the inner marginal
    log-likelihood, scores the fold under level 10's two scores and chooses kappa and eta for each on the inner
    queries. This file keeps fit_unit's arrays and fit log as they are. The log-probabilities of the inner and scored
    queries under the kept round are captured from the arguments fit_unit passes to level 10's score_fold. score_fold
    is wrapped in this process only, and the capture is checked to be the same for both of its calls. The dsh score is
    computed from the capture.
  scores:   # s_k(v) = z(T_k)(v) + kappa log(a_q(v) + eta)
    cov: level 10's coverage score, as fit_unit computes and selects it (configs/mp_approx_l10.yaml#arms.scores.cov)
    dsh: >-
      a_q(v) = n_q m_q(v) under the tempered posterior, through level 8's mixture (Fitter.mixture, called unchanged):
      p_beta(tau | q) = p(tau | q)^beta / sum of p^beta over the query's types and the null type. At beta = infinity,
      all mass goes to the largest p, the first one in the order of the query's types then the null type on a tie.
      At beta = 1, dsh is level 10's dens.
  selection: >-
    The kept round is fit_unit's. For dsh, beta in {1, 1.5, 2, 3, 4, 8, infinity}, kappa in {1/32, 1/16, 1/8, 1/4,
    1/2, 1, 2, 4, 8, 16} and eta in {0.01, 0.1, 1, 10, 100} are chosen together on the unit's inner queries by the mean
    of recall@5, full_coverage@5 and hit@1, from rank_metrics. Ties go to the smaller beta, then the smaller kappa, then
    the larger eta. For cov, fit_unit's own choice is kept.
  read_arms:   # arm: fit, score
    NB-setX-dsh: [NB-setX, dsh]   # the primary arm
    NB-setX-cov: [NB-setX, cov]
    NB-set-dsh: [NB-set, dsh]
    NB-set-cov: [NB-set, cov]     # level 10's primary procedure on these queries
  references:
    NB-oracle: level 8's oracle rule on the nb view (R*, the true chain's reach set from the bucket with the larger Jaccard with the golds, plus 1e6)

em:
  e_step_m_step: >-
    Level 10's, unchanged (configs/mp_approx_l10.yaml#em): level 8's E-step and M-step through level 10's SetFitter,
    AdamW (lr 1e-3, weight decay 1e-4), 64 queries per minibatch and 10 epochs per M-step, with the epoch that has the
    best inner-validation soft cross-entropy restored, theta in closed form after each M-step, and 10 rounds after
    round 0. On the merged view, the minibatches, the E-step and theta's sums run over the merged fit set.
  set_equals_level10: >-
    NB-set's units are level 10's NB-set units on this file's sidecar. A test checks on a synthetic combined sidecar that
    this file's unit returns level 10's arrays and fit log bit for bit. A second test checks that a merged view of one
    sidecar alone gives the same unit as that sidecar's own view, bit for bit.

cross_fitting:
  units: >-
    As at level 10: one unit per (fit, k, fold), 30 units. A unit trains on the other four folds' queries of this file
    that have an in-pool gold, and for NB-setX also on every added row with an in-pool gold. Inner-validation queries
    are held out of the gradient. The unit scores its fold's queries under both scores. torch.manual_seed and numpy
    default_rng both take 1000 + 10 k + fold.
  out_of_fold: every scored query's arm score comes from the unit that did not see the query
  unit_files: >-
    Each unit is written atomically. It holds fit_unit's arrays (the scored queries, both of level 10's scores and their
    metrics, the argmax), the dsh scores and metrics, and the fit log: fit_unit's log, the dsh choice (beta, kappa, eta
    and its inner mean), the dsh inner grid, and the fit and inner queries by source (this file, level 9, level 10). A
    unit already written is skipped on a restart.
  repeat: >-
    The unit (NB-setX, k = 0, fold 0) runs again in a fresh process. Its out-of-fold arrays and fit log are compared
    bitwise with the first run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule. T_k's and G_k's values are the stored ones, checked in the scoring pass.
  rho_readable_rho_bar_gap: >-
    As at levels 8 to 10: rho_M = (mean over k and queries of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)). A metric
    is readable when its denominator's 95% interval lies above 0. rho_bar is the mean of rho_M over the readable
    metrics, and gap_to_gnn is the mean of M(arm_k) - M(G_k) per metric.
  strata: per hop (1, 2, 3); a stratum's rho is read only if its own denominator interval lies above 0
  anchors:   # descriptive
    level9_anchors: level 9's check anchors on each view (topic entity, chain reach, gold in pool, sizes, edges, self_reach, nb_trim)
    agreement: >-
      Per fit, the share of queries on which the out-of-fold argmax type has the true chain's token sequence, with the
      bucket ignored; per k, then the mean over k; overall and per hop. A null argmax does not agree.
    genre_agreement: the same share, on the queries whose qtype's last kind is genre
    gap_split: >-
      For NB-setX-dsh and NB-set-cov: (NB-oracle - arm) per metric, summed over the (query, seed) pairs on which the
      fit's argmax sequence is the true chain's, and over those on which it is not, each divided by the seed count and
      the metric's summed denominator; the mean over the readable metrics; overall and per hop.
    theta: per fit, the kept theta (rho_1, rho_2, rho_3, eps_s), the mean, minimum and maximum over units
    grid_edges: per read arm, the number of units whose kappa or eta sits at an end of the grid, and the number whose kept round is the last
    beta_choices: per dsh arm, the number of units that choose each beta
    training_rows: per fit, the fit and inner queries per unit by source (this file, level 9, level 10)

statistics:
  bootstrap: >-
    Level 0's bootstrap: queries resampled with replacement, 1000 resamples, numpy default_rng(0) (level 0's
    boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample matrix serves
    every quantity, so contrasts are paired.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    data_adds: NB-setX-dsh - NB-set-dsh
    data_adds_cov: NB-setX-cov - NB-set-cov
    dsh_adds: NB-setX-dsh - NB-setX-cov
    dsh_adds_own: NB-set-dsh - NB-set-cov
    over_level10_primary: NB-setX-dsh - NB-set-cov
    ceiling_gap: NB-oracle - NB-setX-dsh

readings:   # filed before any number
  primary: NB-setX-dsh
  bands:   # of rho_bar; the first that applies; the same thresholds as levels 8 to 10
    L11_ABOVE_GNN: the interval's lower end is above 1
    L11_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L11_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L11_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: NB-oracle's rho_bar interval upper end <= 0.50
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
    GRID_EDGE: more than half of the primary's 15 units choose kappa or eta at an end of the grid
    THETA_AT_CLIP: a unit's kept theta has a component at a clip bound (the units are listed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l11_above_gnn: >-
      Primary L11_ABOVE_GNN. On this metaqa population, a non-message-passing model scores above the GNN on the readable
      metrics on average. It reads compiled non-backtracking typed walks and the relation text, and it is fitted to
      golds. The GNN's metaqa advantage over its twin is then reproducible without learned message passing, given those
      inputs and that many gold-labelled training queries.
    l11_high: primary L11_HIGH -- the model recovers most of the GNN's gain on this population
    l11_mid: primary L11_MID -- it recovers part of the gain
    l11_low: primary L11_LOW -- it recovers little of the gain; read it with CEILING_LOW and the agreement anchor
    data_adds: the data_adds interval lies above 0 -- the added training rows add under the sharpened mixture
    data_hurts: the data_adds interval lies below 0 -- the added training rows lose under the sharpened mixture
    dsh_adds: the dsh_adds interval lies above 0 -- the sharpened mixture adds to the coverage score with the added rows
    dsh_hurts: the dsh_adds interval lies below 0 -- the sharpened mixture loses to the coverage score with the added rows
    above_level10_primary: the over_level10_primary interval lies above 0 -- the primary beats level 10's primary procedure on the same queries
    chain_not_identified: the primary fit's agreement below 0.5 with ceiling_gap's interval above 0 -- the chain is not learned from the question
  wording: >-
    Every arm is cross-fitted on metaqa V2_GATE queries with gold labels. The file measures what non-message-passing
    typed-walk models recover of the GNN's gain on this population. It is never a deployable or selected model, and it
    says nothing about another dataset. No reading may be phrased as "message passing is unnecessary", "we do not need
    message passing" or "the MLP wins". NB-setX's units fit on about 3.5 times as many gold-labelled queries as NB-set's,
    and a reading of either names its number (the training_rows anchor). rho here is level 8's quantity on a fresh
    population.
    Level 10's numbers are quoted beside this file's only with the population named, and the paired comparison with
    level 10 is the NB-set-cov arm on this file's queries. rho is not the within-U_q oracle rho of levels 0 to 7, and
    the two are never set side by side as one quantity.

compute:
  scoring: level 10's pass took about 18 to 23 min per shard at 6 threads; the same is expected here
  storage: level 10's sidecar held about 31 million entries (both families); the same order is expected here
  fits: >-
    NB-set: 15 units in three jobs, one per seed, five units each. Each unit should take about 2 min, as at level 10,
    plus the dsh selection (7 x 50 grid points on its inner queries). NB-setX: 15 units in 15 jobs, one per unit, with
    about 3.5 times the fit queries and about 3.5 times the inner queries, so about 6 to 9 min each. Then the repeat.
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the population digest or count, the halves, the hops, level 0's, level 8's, level 9's or level 10's recomputed rows
    differ from the declared or stored ones, or a level 0, 8, 9 or 10 row, a held row or a test row would be scored
  - any integrity check of scoring_pass fails
  - any hard stop of level 9's walks or check
  - the relation table differs from the pinned embeddings or vocabulary order
  - a set likelihood's theta or marginal log-likelihood is not finite
  - >-
    a training sidecar's meta.json is not its pin, one of its arrays or its qids.json is not the sha256 its meta.json
    records, its folds or inner flags are not level 0's rules, or one of its query ids is in this file's population or
    in the other training sidecar
  - the merged view's concatenated arrays do not line up with its parts (types per query, type rows, pool sizes, golds)
  - level 10's two calls of score_fold in a unit did not receive the same log-probabilities
  - the host jobs' recorded code sha256 values are not one value per module equal to the committed files

outputs:
  scripts: >-
    scripts/mp_approx_l11.py (stages score [--shard i/n], assemble, check; the population rule and the pins) and
    scripts/mp_approx_l11_fit.py (stages fit [--fit F --k K [--fold F]], repeat, read, doc, file; the merged view and
    the dsh score)
  sidecars: >-
    outputs/mp_approx_l11/metaqa/ on the host. It holds the per-query and per-node arrays, the walk entries of both
    families, qids.json and meta.json (the sha256 of every array), check.json, units/<fit>/ with the out-of-fold scores
    and metrics of each score and the fit logs, repeat/ and read.json.
  record: outputs/mp_approx_l11/record.json, assembled on the laptop from the fetched read.json, check.json and meta.json without arithmetic
  document: docs/MP_APPROX_L11.md
  run_record: run_record_mp_approx_l11_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l11.py and tests/test_mp_approx_l11_fit.py, run on the host in rx env mpr-cpu
  - this file parses, its pins are the files' current sha256, and the declared constants are the scripts'
  - >-
    the population rule on toy ids is disjoint from level 0's, level 8's, level 9's and level 10's rows, recomputes
    level 10's rows by level 10's rule, sorts per hop by this file's salted sha256 and keeps the first N
  - the rebound scoring pass restores level 8's names after it runs, and reads this file's rule, pins and paths inside it
  - >-
    NB-set's unit equals level 10's fit_unit for NB-set bit for bit on a synthetic combined sidecar (arrays and fit
    log), and the captured log-probabilities are the ones level 10's score_fold received
  - >-
    a merged view of one sidecar alone gives the same unit as that sidecar's own view, bit for bit. On a merged view of
    synthetic sidecars, every added row with an in-pool gold is in the fit set or the inner set of every unit, by its
    inner flag, and no added row is scored. Per-query reads (entries, reach, golds, z) equal the part's.
  - >-
    the tempered posterior equals p^beta renormalised over the types and the null type. beta = 1 gives level 10's dens
    a_q exactly, and beta = infinity gives a point mass on the first largest p. The dsh selection follows the declared
    grid and tie order.
  - each arm's inputs are only z(T_k), q, the relation text and the view's types and counts
  - metrics, rho, readability, the band order and the gap split come out right on toy cases, and the contrasts are the declared pairs
  - the check, fit, repeat, read, doc and file stages run end to end on synthetic combined sidecars
  - no held, level 0, level 8, level 9 or level 10 query id appears in this file's sidecar

execution:
  order: >-
    This file alone (commit). Then scripts/mp_approx_l11.py and tests/test_mp_approx_l11.py (commit), those tests on
    the host, a smoke on a few queries written outside outputs/mp_approx_l11, the three score shards at once, then the
    assemble and the check. In parallel, scripts/mp_approx_l11_fit.py and tests/test_mp_approx_l11_fit.py (commit) and
    those tests on the host. Once the check has passed, the three NB-set jobs and the first NB-setX unit at once. Once
    that unit's peak memory is known, the other 14 NB-setX units and the repeat at once. Then the read. Then fetch the
    read, check and meta files, and on the laptop build the record, the doc and the run record (commit).
  stop_after_run: STOP_FOR_REVIEW

