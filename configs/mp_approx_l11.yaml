phase: MP_APPROX_L11
opened: 2026-10-01
status: RUN
branch_type: POST_HOC_ANALYSIS
track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  Level 10 (configs/mp_approx_l10.yaml, RUN at a5d6b1e). On metaqa, level 10's primary arm NB-set-cov read L10_MID, with
  rho_bar 0.719 [0.665, 0.772], and every learned arm stayed below the GNN on all three metrics. The set likelihood added
  to level 8's under the coverage score (set_adds +0.039 [0.006, 0.074]), and non-backtracking walks added to standard
  ones (nb_adds +0.055 [0.017, 0.090]). The coverage score added nothing over level 8's mixture (cov_adds +0.002 [-0.025,
  0.028]). The non-backtracking true-chain oracle read 1.049 [0.993, 1.102], and ceiling_gap was 0.329 [0.277, 0.379].
  The argmax type had the true chain's tokens on 0.868 of queries, and 0.211 of the ceiling gap sat on the (query, seed)
  pairs where it did. This file makes two changes, each aimed at a limit that a descriptive look at level 10's units
  measured, and gives each its own paired contrast on the same queries. First, levels 9's and 10's 6,000 compiled rows
  join every unit as training and inner-validation queries; they are never scored. Second, the score reads level 8's
  mixture under the posterior raised to a power beta and renormalised, with beta chosen on the inner queries together
  with kappa and eta. Level 10's model, likelihood, EM and fit_unit are imported and called unchanged.
design_informed_by: >-
  This design was informed by two descriptive looks at level 10's filed units on the host, made after level 10's run
  record and neither of them a result nor filed: outputs/mp_approx_l10_diag/diag.py (sha256
  e547bbc9c4ea1eb4e9cfc6ebcd0fe02800cdb1f1f2e6cc70f310a74c37e45671) with its diag.json (sha256
  5f930a1c3404c16d04808bddebb1a9eb4bc508ef3bedc74c29a2808c437706c9), and outputs/mp_approx_l10_diag/diag_curve.py (sha256
  42cf640dfcfe7b3871fe1c47e5855fd6d38fc6e09d91ca56c19258c9dc0e6d7e) with its curve.json (sha256
  59b617678b74b00c8cecaf86df34dea640700644e45d59ae3e320473306c20b4), all untracked. diag.py refitted level 10's NB-set and
  NB-draw units through level 10's fit_unit, called unchanged; all 30 refits were bit-identical to the filed units. It
  kept the per-query type log-probabilities and scored each fold again under variants, each chosen on the unit's inner
  queries by level 9's rule. It found six things, in rho_bar on level 10's 3,000 queries.
  (a) The fit is data-limited. diag_curve.py refitted NB-set at k = 0 with each unit's fit set cut to 25%, 50% and 100%
  (531, 1,062 and 2,123 queries per unit on average; at 100% all five units were bit-identical to the filed ones).
  Under level 10's coverage score it read 0.613, 0.662 and 0.712. Under the mixture at beta = 2 it read 0.598, 0.672
  and 0.755, and each hop rose by 0.156 to 0.167 from 25% to 100% (hop 3: 0.558, 0.639, 0.714). Under both scores the
  gain per doubling did not shrink between the two doublings.
  (b) A sharper posterior helps under level 8's mixture. With p raised to beta = 2 and renormalised, the mixture read
  0.757 [0.706, 0.810], +0.038 [0.015, 0.061] over NB-set-cov; beta = 3 read 0.754, and beta chosen with kappa and eta on
  the inner queries read 0.753 (+0.033 [0.008, 0.058]). Under the coverage score, sharpening added at most +0.014 (beta
  = 3, interval spanning 0). The argmax type alone (beta = infinity) read 0.731 under both. Under the mixture at beta =
  2, the gap split was 0.187 on the pairs whose argmax sequence was the true chain's and 0.104 on the others, against
  0.211 and 0.119 for NB-set-cov.
  (c) Gates tuned per subgroup of the inner queries did not help. Per tercile of the posterior's largest probability,
  three of four variants read 0.009 to 0.020 below the same variant with one gate per unit, and the fourth (the
  unnormalised coverage) read 0.010 above it. Per argmax length, all five read 0.016 to 0.056 below. The set model's
  posterior predictive P(v gold | q) as the gate, with beta chosen, read 0.742 (+0.023 [0.009, 0.040]). The
  unnormalised coverage read 0.725 to 0.727. Hard gates lost: the argmax type's reach set under level 8's hard gate
  read 0.587. It closed the gap on the right-chain pairs to 0.129 but opened it on the others to 0.332.
  (d) The right-chain gap is the posterior's, not the gate form's. The true chain's R* as a point mass under a soft gate
  chosen on the inner queries' own R* read 1.048, against the oracle's 1.049. On right-chain pairs the posterior put
  mean 0.863 on the true chain's types; the argmax bucket was R*'s on 0.955 of them (0.918 at hop 3). The true chain
  from bucket 0 under the hard gate read 0.965.
  (e) Confidence separates the pairs. The share of pairs whose argmax sequence was the true chain's, by quintile of the
  posterior's largest probability, was 0.49, 0.87, 0.98, 1.00 and 1.00.
  (f) The wrong argmax still clusters by qtype. directed_by:fwd was the argmax on 52 of 213 movie_to_writer_to_movie_to_director
  pairs, "release_year:fwd > release_year:bwd > has_genre:fwd" on 61 of 258 movie_to_actor_to_movie_to_genre pairs,
  and movie_to_genre's right share was 0.60.
  These looks used level 10's 3,000 queries, and this file's population excludes them. Level 10's rows enter this file
  only as training rows, never scored.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, how far toward the GNN's gain over its twin can level 10's non-message-passing typed-walk model go when it
  is fitted on more gold-labelled queries and scored through a sharpened mixture? It reads how much of the GNN's gain the
  primary arm NB-setX-dsh recovers: rho on recall@5, full_coverage@5 and hit@1, against the twin and the GNN of each
  seed pair, on 3,000 fresh V2_GATE queries disjoint from levels 0 to 10. As paired contrasts on the same queries, it
  also reads what each change adds: the added training rows under each score, and the sharpened mixture under each
  set of training rows. It reads the total against level 10's primary procedure, re-run on these queries. The
  non-backtracking true-chain oracle bounds what choosing the right chain can give.
role: >-
  Measurement, as at levels 8 to 10. The object is a set of non-message-passing models fitted to gold labels,
  cross-fitted within V2_GATE. No GNN output enters any fit, target, loss or selection. The twin's z-scored output is
  the base score, as at every level. No model, number or reading of this file enters QLS-U, the twin, a feature
  contract, M3, M4 or any selection. A deployable model of this form would be a competitor trained on the fit split
  under the QLS-U contract, and it would need its own declaration. This file does not open one, and it opens no later
  level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code, as at levels 8 to 10
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    Level 10's argument (configs/mp_approx_l10.yaml#boundary) holds unchanged: the model, the walks, the reach sets and
    the set likelihood are level 10's. The added training rows change only the queries the query map and theta are
    fitted on. The sharpened mixture reads the same type weights, raised to one power per unit and renormalised over the
    query's types and the null type, and the same compiled reach sets, through level 8's mixture called unchanged.
    Inside the model, every learned quantity is still a function of the query embedding and a discrete walk type only.
    Nothing in any model reads the edge list or a neighbour's embedding, score or state, and nothing is repeated.
  what_it_is: >-
    The function class is a query-weighted count of typed walks, as at levels 9 and 10. Under the sharpened mixture, a
    node's structural term is a tempered posterior's average of uniform reach sets. It has no learned per-edge message,
    no neighbour state and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    As at levels 8 to 10, the walks read only the packed structural message edges the GNN's cell reads: the same pool,
    the same cap of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction
    flags. The ner and knn families are not read. The fairness contract holds, because both models read the same pool
    graph. The training rows of levels 9 and 10 were compiled by the same walk programme from the same pilot.

authorization:
  given:
    - '2026-09-30, the user: "basically i dont want message passing but approximations to it, and pushing it as far as possible and targeting the weakpoints, i think offsets or rope based methods can work because all the stuff is anyways in the semantic space we just need to learn those transformations from the query etc and work from that, and explicit positions so that we have a proper way to represnt, what else do you think we should focus on"'
    - '2026-09-30, the user: "i think we can do something like learn the proper edge representation that works for us in our space and not hash then use that as extra feature, keep improving that feature and the learning from it, like how isonet++ worked, idk some sort of estimation maximization"'
  how_the_messages_are_answered: >-
    "Pushing it as far as possible and targeting the weakpoints" becomes this file's two changes. Each is aimed at a
    limit the descriptive looks measured. The added training rows address the learning curve, which was still rising
    at level 10's fit-set size. The sharpened mixture addresses the posterior mass left outside the argmax type's reach
    set, which a single soft gate per unit can trade against the wrong-chain pairs. Level 10's model (non-backtracking
    walks, the rotary text composition plus the exact per-sequence residual, the linear query map), its set likelihood
    and its EM over the latent chain are kept unchanged. "Keep improving that feature and the learning from it" is the
    same EM fitted on more queries.
  go_ahead: >-
    Standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  placement_messages:
    - '2026-09-29, the user: "use the damn host not on laptop"'
    - '2026-09-30, the user: "pls mpve and do on the host for faster execution"'
    - '2026-10-01, the user: "dont request resources if you wont use them i want the best utilization at all times dont create a deadlock for other projects if you wont use the resources and whatever you request use them fully"'
    - '2026-10-01, the user: "parallely keep stuff i want full utilization and less time stuck waiting by any project or process request only what you can actually use and dont over request and keep underutilizing"'
    - answered in placement below
  terminal: STOP_FOR_REVIEW after the run record. No later level, arm or deployable model is opened by any reading here.

this_file_does_not_touch:
  fits: >-
    No GNN or twin is fitted. The pilot's six checkpoints are read. Only this file's arms are fitted, and they are
    cross-fitted measurement models.
  rows: >-
    Level 0's 2,400 metaqa rows (which levels 1 to 7 reused), level 8's 3,000 rows, level 9's 3,000 rows and level 10's
    3,000 rows leave the population before anything is scored. Level 9's and level 10's compiled sidecars are read as
    training rows only (training_rows), and no number is read on them. Level 8's and level 0's rows are not read.
    V2_HELD_CONFIRMATION is never read. The metaqa eval split is a dev split, and no test row is read.
  frozen: >-
    M2-M3B, universal-v2, UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU task-level qualification, the
    six-dataset base, DEPLOY_CK_2WIKI, DEPLOY_CK_FULL_2WIKI and levels 0 to 10 all keep their bytes: declarations,
    scripts, tests, sidecars, probes, records and documents. Level 8's, level 9's and level 10's scripts are imported
    unchanged, and this file's scripts rebind some of their module names inside their own processes only. Level 0's and
    level 4's scripts are imported unchanged. Level 9's and level 10's sidecars are opened read-only.
  package: >-
    The CRAG package is read-only. On the host, the verified mirror stands in for it in memory only. Nothing is written
    under either root, and nothing from them enters git.
  competitors: no arm output, type weight, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:
  where: >-
    The host CPU, through tools/rx (docs/GPU_HOST_HANDOVER.md), in rx env mpr-cpu (torch 2.8.0+cpu, numpy 2.3.2, the
    laptop's pinned closure), Windows native. No GPU is used, and scipy and numba are not used. The tests run there too.
  why_the_host: >-
    The user's placement messages. Level 9's and level 10's full sidecars, the training rows, are on the host only.
  package: As at level 10 (configs/mp_approx_l10.yaml#placement.package), through the pinned verify_metaqa.json.
  threads:
    score: 6 torch threads and BLAS and OpenMP pools of 6, set before numpy loads (level 9's scoring counts)
    fit_and_read: 4 torch threads and pools of 4, with torch's deterministic algorithms (level 8's fit_process)
  reservations: >-
    Each job reserves what the same kind of job measurably used at level 10, plus a small margin, and never more than it
    can use. Score shard: 2.5 CPUs and 3 GB (level 10 measured about 2.1 and 2.5). Assemble and check: 1 CPU and 3 GB.
    NB-set fit job: 1.5 CPUs and 1 GB (level 10's fit jobs measured about 1.3 and 0.46 to 0.64). The first NB-setX unit
    job runs before the other 14, with 1.5 CPUs and 3 GB. The other NB-setX unit jobs and the repeat reserve 1.5 CPUs
    and that job's measured peak plus 0.5 GB, rounded up to the next 0.5 GB. Read: 1 CPU and 1 GB (the read does not
    open the training rows). Tests and smoke: 1 CPU and 2 GB. rx reserves without capping, and every process
    fixes its own pools at start, so a reservation changes no number. Jobs whose inputs exist are submitted at once,
    so they run in parallel under mpr's priority, and nothing running is preempted.
  proof_per_query: >-
    The scoring pass checks the 14 metrics of T_k and G_k against the pilot's stored per-query values on every scored
    query. That check is this placement's proof, query by query. A mismatch is a hard stop, and no tolerance is added.
    The training rows were checked the same way by level 9's and level 10's scoring passes.
  host_native: >-
    Every arm and reference is fitted, scored and read on the host CPU. The twin's and the GNN's metrics are the stored
    values, checked exactly. No number of this file is set beside a number made on the laptop.
  identical_code: >-
    Every host job runs from a commit of this phase and records the LF sha256 of every repository module it imports.
    The file stage checks that each module has one value across all jobs, equal to the file at the commit it names.
    scripts/mp_approx_l11.py is committed first and is not edited after that commit. scripts/mp_approx_l11_fit.py
    follows in a second commit, and the score jobs never import it.
  laptop_steps: the doc and file stages, which make no number

transfer: >-
  None of the data moves. Level 8's, level 9's and level 10's inputs are already on the host, as are level 9's and level
  10's sidecars and qids.json files (written there by their scoring passes). Every host job checks each pinned input's
  sha256 before reading it. A missing file is pushed with rx push --inputs, as the same bytes, before the job. The code
  arrives as the git-tracked tree. No token or credential goes to the host.

