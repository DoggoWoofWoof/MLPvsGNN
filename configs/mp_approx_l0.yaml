phase: MP_APPROX_L0
opened: 2026-09-29
status: DECLARED_NOT_RUN
branch_type: POST_HOC_ANALYSIS
track: MP-ORACLE
extends: >-
  configs/universal_v2.yaml (the pilot's frozen trio checkpoints and their V2_GATE evaluation arrays) and the UMLP
  diagnostics chain (D0 to D0.3, v2.1, v2.2A). None of those files is edited. This is level 0 of the "Message-Passing
  Approximation Ladder" proposed on 2026-09-29; every later level is its own dated file.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  How much of what the trained GNN does to each candidate -- its score relative to the matched non-message-passing
  twin, the part of that score its cell's edges produce, and the neighbour messages the cell passes -- can be predicted
  from information that is already compiled at the candidate, with no propagation?
role: >-
  Measurement only. The GNN's outputs are the probes' targets, which the proposal allows "only to measure approximation
  capacity". A probe is never a retriever, a competitor, a teacher or a feature: no probe, target or number of this
  file enters QLS-U, the twin, a feature contract, M3, M4 or any selection. Distilling the GNN into a model that is then
  evaluated as a competitor would need its own declaration, and the proposal rules it out for the QLS-U line.

authorization:
  given: 2026-09-29, pasted by the user (advisor text). Verbatim excerpts
  excerpts:
    - "We should **close only the two failed mechanisms** (`coverage-loss retrain` and `linear global offset`), not close the non-message-passing line."
    - "**MP-Approx: How much of learned message passing can fixed graph compilation recover?**"
    - "### Level 0 — current 129 scalars"
    - "How well can we predict the GNN's actual effect?"
    - "where using GNN outputs is explicitly allowed **only to measure approximation capacity**."
    - "We should **not** use GNN distillation for the main QLS-U competitor because that breaks our causal information contract."
    - "Not `MLP-v2.2B`."
  go_ahead: >-
    standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  placement_message: >-
    2026-09-29, the user: "now since you have the gpu etc you can choose to run there wherever needed and feasible, use
    all the systems at your disposal for a fast and quick outputs and runs". Answered in placement below.
  terminal: STOP_FOR_REVIEW after the run record. Level 1 is not opened by any reading here.

rulings_recorded:   # the proposal's closures, recorded here; the v2.1 and v2.2A files keep their bytes and status lines
  closed_as_mechanisms:
    v2_1_coverage_objective: V21_STAGE_A_FAIL at d14c7f6 -- the coverage-loss retrain is closed as a mechanism
    v2_2a_linear_offset: V22A_STAGE_A_FAIL at 6ff664c -- the frozen-base linear global offset is closed as a mechanism
  stays_open: the non-message-passing line (the twin family and every compiled-feature model)
  not_opened: v2.2B. Neither this file nor the proposal opens it

corrections_to_the_proposal:   # checked against the code before this file was written
  phi0_is_not_scalars_only: >-
    the twin u_mlp_v2_mix and the GNN u_gnn_v2_ef share the M3B input block (the twin's copy adds query gates on the
    depth-basis blocks), whose linear reads 773 columns. There are 258 scalar columns: the 129 contract scalars, raw and
    within-query z-scored. The other 515 are vector channels. A 258-wide semantic head holds the projected query and node
    embeddings, their product, their absolute difference and two dot products. One column is semantic_difference. Three
    64-wide hop-1 family prototypes are normalize(gelu(mean of the projected embeddings of the node's structural, ner and
    knn in-neighbours)) times q_state, and a 64-wide seed-reach prototype weights the seeds' projected embeddings by 1 at distance 1 and 0.5 at distance 2, times
    n_state.
    The proposal's level 1, vector hop tokens, therefore already exists at depth 1 in both models, as a learned
    projection. Depth >= 2 tokens and fixed (random or PCA) projections do not exist in either model.
  two_no_mp_references: >-
    "s_NO-MP" has two meanings here, and both are measured. (a) The matched twin: u_mlp_v2_mix, fitted separately on the
    same trio under the same contract, with the same input-block family and no cell. It is the non-message-passing
    model the pilot compared. (b) The GNN's own no-edge counterfactual: UGNNv2 with message_passing = False, whose
    forward removes every edge before the cell. The cell and the evidence flow then see only self-loops, and the input
    block, hop-1 prototypes included, is unchanged. (b) was never trained in that regime. It isolates what the cell's
    edges do inside the trained model, and (a) is the trained comparator.
  the_message: >-
    the cell's step-t message is m_v = sum over v's in-edges and one self-loop of alpha_uv (W_mh h_u + W_mr r_uv). The
    proposal's m_v, a GAT sum over N(v), is its neighbour part m_nbr = m - alpha_vv (W_mh h_v + W_mr r_self). That part
    is the message target here.
  matched_pairs: >-
    a trained GNN with a matched twin exists only for the pilot trio (2wiki, metaqa, squad):
    u_gnn_v2_ef__H128__s{0,1,2} with u_mlp_v2_mix__H128__s{0,1,2}. The stage-2 six-dataset GNN has no six-dataset twin,
    so this file does not use it.

this_file_does_not_touch:
  fits: >-
    nothing is fitted except the probes, which are cross-fitted analysis models. The six checkpoints are loaded
    read-only, and every weight file and record is checked against its sha256.
  rows: >-
    V2_GATE rows only. V2_HELD_CONFIRMATION rows leave the population before anything is compiled or scored. All three
    eval splits are dev splits (m3b_controlled_comparison.yaml#populations.eval_splits); no test row is read.
  frozen: >-
    M2-M3B, universal-v2 (pilot, replication, stage 2), UMLP D0-D0.3, v2.1 and v2.2A keep their files, arrays,
    checkpoints and status lines, and this file does not touch the CPU-GPU equivalence declaration (its own run appends
    to it). M3B stays byte-pinned (configs/universal_v2.yaml#m3b_incumbents.must_not).
    The frozen code is imported unchanged. The only code copied is the cell's attention (message split below), under a
    new name in the new script, and the run verifies it against the cell.
  package: the CRAG package is read-only. Nothing is written under its root and nothing from it enters git
  competitors: no probe output, target, basis or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:
  every_stage: laptop CPU (the reference machine of configs/cpu_gpu_equivalence.yaml#placements.reference)
  threads: >-
    scoring runs at 6 threads, the thread count of the stored pilot eval records, so the integrity check below can be
    exact. The probes run at 4 threads per process, one process per dataset, up to three at once. Every probe is a
    deterministic function of its fold, seed and thread count.
  why_not_the_lab_host: >-
    (1) Scoring compiles each V2_GATE pool on the fly from served CRAG files that exist only on the laptop. For these
    three datasets the planning sizes of the host mirror total about 25 GB (metaqa 6.0, 2wiki 18.8, squad 0.25;
    configs/cpu_gpu_equivalence.yaml#mirror_verification.sizes_for_planning, caches included), several hours of upload
    against about 1.3 h of scoring here. (2) No placement has passed configs/cpu_gpu_equivalence.yaml, so the host cannot
    be named for a scientific stage (placement_rules). (3) The probe stage is small. The user's placement message is
    answered by running the equivalence test under its own file; a later level may name the host in its own dated
    block after a pass.

