    V2_GATE (19,738 queries; hop 1: 5,021, hop 2: 7,444, hop 3: 7,273, the hop read from the query id as
    universal_v2_run does), stratified subsample. For each hop, the 800 V2_GATE queries with the smallest
    sha256("mp_approx_l0|" + query_id) are kept, 2,400 in all. The rule reads only ids, and the full gate would take
    about 6.6 h at the pilot's 1.21 s per query.
  2wiki: V2_GATE, all 6,290 queries
  squad: >-
    V2_GATE, all 5,841 queries. The control: the pilot's GNN and twin are level on squad (seed-mean recall@5 0.9020 vs
    0.9063).
