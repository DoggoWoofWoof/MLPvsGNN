scoring_pass:
  path: >-
    the D0.1 path, imported unchanged. The M3B eval population is recomputed and must equal the declared digest and
    count. The halves are recomputed and must equal the stored halves, and held rows leave. m3b_compile.prepare,
    compile_query_v2 and pack_queries_v2 then give one packed batch per chunk (24,000 // mean pool size queries), which
    every scored function reads.
  functions:   # per query, on the full pool
    T_k: u_mlp_v2_mix__H128__s{k} (twin), k = 0, 1, 2
    G_k: u_gnn_v2_ef__H128__s{k} (GNN)
    G0_k: >-
      G_k with message_passing = False for one forward. The attribute is restored at once and asserted True, and the
      state_dict digest is equal before and after.
  integrity:
    stored: >-
      for T_k and G_k, rank_metrics of the full-pool scores equals the stored per-query value of all 14 METRIC_NAMES
      exactly, on every scored query. Seed 0 is checked against <name>.npz and seeds 1-2 against
      <name>__more_69caa3fe.npz. G0_k has no stored counterpart.
    message_split: >-
      the copied attention's full message equals the tensor the cell passes to its dropout (torch.testing.assert_close,
      atol 1e-5, rtol 1e-5) at every step of every chunk
    analysis_set: >-
      within U_q, for T_k, G_k and G0_k, the nine metrics fixed by the top 20 (recall@1/5/10/20, hit@1, ndcg@5/20,
      full_coverage@5/20) and gold_in_pool equal their full-pool values. This holds by construction under the frozen
      tie rule (score descending, then pool position) and is checked.
    on_mismatch: hard stop at the first mismatch, naming the query, function and metric; no tolerance is added afterwards
  analysis_set:
    U_q: >-
      the in-pool golds plus the top 20 of each of the nine functions, kept in pool order. It is the set the
      approximations re-rank; KEEP_TOP = 20 as in D0.3.
    why: >-
      metaqa pools average 2,017 candidates, too many to keep with their vectors. Every candidate outside U_q is a
      non-gold that none of the nine functions ranks in its top 20.
    consequence: >-
      the endpoints' metrics are exact within U_q. An approximation's recall@5, full_coverage@5 and hit@1 within U_q
      can only be equal to or higher than on the full pool, because a candidate from outside U_q could only displace. So every
      recovery below is an upper bound on the full-pool recovery of the same probe. A LOW reading is robust to this; a
      HIGH reading is not a full-pool claim.
  z_scores: every function's scores are z-scored within the query over the FULL pool (float64); U_q rows are kept afterwards
  kept_per_U_q_row: >-
    the 129 contract scalars (raw), their within-query z-scores (full pool), and z(T_k), z(G_k), z(G0_k) with their
    full-pool ranks. For each k: B1's 515 vector channels of T_k (the columns 258-772 its input linear reads); B2 = T_k's
    body output (128) and base_z; and G_k's neighbour message m_nbr at steps 1, 2, 3 (128 each). Vectors are stored as
    float16, every score and scalar as float32 or wider.
  kept_per_query: row, query id, hop, gold_total, pool size, |U_q|, fold, the first-support STRUCT bucket, and the full-pool 14 metrics of the nine functions
  first_support_STRUCT: >-
    the smallest t in {1, 2, 3} for which some in-pool gold has has_h{t}_STRUCT > 0 in the compiled scalars (0 when
    none, -1 when no gold is in the pool). This is D0.1's rule.

targets:   # per U_q row; per seed pair k
  r_k: z(G_k) - z(T_k), the GNN's residual over the twin (primary)
  e_k: z(G_k) - z(G0_k), the part of the GNN's score its cell's edges produce inside the trained model (secondary)
  m_k_t: G_k's neighbour message at step t = 1, 2, 3, a 128-vector (secondary; the proposal's "message fidelity")
  centring: >-
    every target and every prediction is centred within the query over U_q before any fit or measure. A shift shared
    by a query's candidates ranks nothing (the repository's per-query centred scores).

bases:   # node-local: nothing here is computed by the cell or reads another candidate's state
  B0: >-
    the 129 contract scalars (Phi_129): raw values through sign(x) log1p(|x|), plus the within-query z-scores; 258
    columns. The same for every k.
  B1: >-
    B0 plus T_k's 515 vector channels: the semantic head, semantic_difference, the three hop-1 family prototypes and the
    seed-reach prototype, i.e. everything the twin's input linear reads except its gating of the scalars; 773 columns
  B2: >-
    T_k's own final representation: its body output (128) and base_z. A linear readout of it is the twin's own function
    class.
  standardisation: >-
    per fold, mean and standard deviation from the training rows only. A column with sd < 1e-6 becomes 0, and values
    are clipped to [-8, 8].

probes:   # cross-fitted; every out-of-fold prediction comes from a probe that never saw the query
  folds: 5 folds, fold = int(sha256(query_id)) mod 5 -- D0.2's rule; all rows of a query in one fold
  inner_split: >-
    the training-fold queries with int(sha256(query_id + "|inner")) mod 10 == 0 are the inner validation set, used
    only to choose lambda and to stop the MLP
  ridge: >-
    closed form on within-query-centred standardised features and target, penalty lambda * n_rows * ||beta||^2. lambda
    comes from {1e-3, 1e-2, 1e-1, 1, 10, 100}, chosen by inner-validation within-query MSE, and the probe is refitted
    on all training folds. The messages are multi-output: one lambda per step, chosen on the summed MSE of the 128
    outputs.
  mlp: >-
    Linear(d, 128), GELU, Linear(128, 128), GELU, Linear(128, 1) -- the twin body's width. AdamW (lr 1e-3, weight
    decay 1e-4), minibatches of 64 queries (all their U_q rows), and a loss equal to the mean of the squared difference
    between the within-query-centred prediction and target. At most 30 epochs; the MLP stops after 3 epochs without an
    inner-validation improvement and restores its best epoch. torch.manual_seed and numpy default_rng both take
    1000 + 10 k + fold.
  grid:
    r_k: [B0-ridge, B0-mlp, B1-ridge, B1-mlp, B2-ridge]
    e_k: [B0-ridge, B1-ridge]
    m_k_t: [B0-ridge, B1-ridge]
  references:   # no fitting
    twin: z(T_k) itself -- recovery 0 by definition
    other_seed_residual: z(T_k) + the mean of r over the other two seeds (for e, z(G0_k) + the other seeds' mean e) -- how much of the residual transfers across GNN seeds
    reproducibility: the within-query-centred Pearson correlation of r_k with r_k' over U_q rows, for the three seed pairs; likewise for e

quantities:   # per dataset; per k, then averaged over k
  fit:
    R2: "1 - sum (rhat_c - r_c)^2 / sum r_c^2, pooled over U_q rows (within-query centred)"
    spearman: per query over U_q, Spearman(rhat, r), averaged over queries with at least 3 rows and neither side constant
    DPR: >-
      discordant-pair recovery. Pairs of a query's U_q rows are counted when T_k and G_k order them with opposite
      strict signs. DPR is the share of those pairs that the approximation orders as G_k does (a tie counts as not
      recovered), per query, averaged over queries with at least one such pair.
    gold_DPR: DPR over the discordant pairs with exactly one gold
    top5_overlap: "|top5(approximation) intersect top5(G_k)| / 5 within U_q, beside the twin's own overlap with G_k"
  retrieval:
    approximation: shat_k = z(T_k) + rhat_k (for e, z(G0_k) + ehat_k), re-ranking U_q under the frozen tie rule
    metrics: [recall@5, full_coverage@5, hit@1]
    rho: >-
      rho_M = (mean over k and queries of M(shat_k) - M(T_k)) / (mean of M(G_k) - M(T_k)), the proposal's "fraction of MP
      task gain recovered" with the twin as NO-MP. For e: (M(shat_e) - M(G0)) / (M(G) - M(G0)).
    readable: >-
      a metric is readable on a dataset when its denominator's 95% bootstrap interval lies above 0. The proposal
      requires a denominator that is "meaningful and nonzero", and one where the GNN is worse would make rho measure
      the recovery of a loss.
    rho_bar: the mean of rho_M over the dataset's readable metrics, with its interval from the same resamples
  message:
    R2_t: "1 - sum ||mhat_c - m_c||^2 / sum ||m_c||^2 over U_q rows and the 128 dimensions (within-query centred)"
    cosine_t: the mean over U_q rows of cos(mhat_c, m_c), for rows where ||m_c|| > 0
  strata: >-
    metaqa by hop (1, 2, 3); 2wiki by gold_total (2; 3 or more); every dataset by the first-support STRUCT bucket.
    Descriptive. A stratum's rho is read only if its own denominator interval lies above 0.

statistics:
  bootstrap: >-
    queries resampled with replacement, 1000 resamples, numpy default_rng(0), 95% percentile interval. One resample
    matrix per dataset serves every quantity, so contrasts are paired. Seeds are averaged inside each resample.
  contrasts:
    vector_channels: rho_bar(B1-mlp) - rho_bar(B0-mlp)
    nonlinearity: rho_bar(B0-mlp) - rho_bar(B0-ridge)
    twin_representation: rho_bar(B2-ridge) - rho_bar(B1-mlp)

readings:   # filed before any number; per dataset, no pooled reading
  primary_probe: B0-mlp on r_k -- the proposal's level 0 ("current 129 scalars"), with nonlinear capacity
  bands:   # of rho_bar, for every probe on r_k (and on e_k, descriptively)
    L0_HIGH: rho_bar >= 0.75 and its interval's lower end >= 0.50
    L0_LOW: rho_bar <= 0.25 and its interval's upper end <= 0.50
    L0_MID: neither
    NOT_READ: the dataset has no readable metric (squad is expected here; that is the control, not a failure)
  exactly_one: per dataset, the band of the primary probe is the dataset's reading
  flags:   # descriptive, filed with the thresholds
    FIT_NOT_RANK: a probe with R2 >= 0.5 whose band is L0_LOW -- it fits the residual's variance but not its ranking-relevant part
    SEED_BOUND: mean reproducibility of r below 0.5 -- most of the residual is seed-specific, which caps any seed-agnostic probe
    MESSAGE_NOT_RETRIEVAL: B1-ridge message R2, averaged over steps, >= 0.5 while B1-mlp on r is L0_LOW
  interpretation_map:   # what each outcome licenses; none of it opens a stage
    primary_high: >-
      the compiled scalars already predict the GNN's effect at the ranking level on that dataset (within U_q). The
      twin's shortfall there is not missing information at level 0. Closing it is a learning question, which no file
      has opened: v2.1 and v2.2A are closed as mechanisms and v2.2B is not opened.
    primary_low_vectors_add: >-
      primary L0_LOW with the vector_channels interval above 0: the twin's depth-1 vector channels carry part of what
      the scalars lose, which is the proposal's "scalar compiler loses semantics" diagnosis at depth 1. It licenses
      level 1 (depth >= 2 vector tokens) as the next file.
    b1_low: >-
      B1-mlp L0_LOW: node-local information, depth-1 vectors included, does not predict the effect. What the cell adds
      lies in depth >= 2, query-conditioned weighting or typed composition, the ground of levels 1 to 4.
    twin_representation: >-
      the twin_representation interval's upper end at or above 0, with B2-ridge not L0_LOW: the effect is linearly present in
      the twin's own final representation, so what fails is its readout or objective.
    message_not_retrieval: the proposal's "scorer/objective problem" diagnosis
  wording: >-
    every probe is an oracle fit on the GNN's own outputs over V2_GATE queries of the same dataset. Recovery is a
    statement of capacity within U_q, never of a deployable model. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins"; low and high recovery are both results.

compute:
  scoring: metaqa about 55 min, 2wiki about 15 min, squad about 12 min, one lane at 6 threads. Peak memory is about the pilot's (5.5 GB on 2wiki), and chunks go to disk as they finish
  probes: per dataset 30 MLP fits and 165 closed-form fits (each after a six-value lambda search), about 10 to 20 min
  disk: about 3.5 GB under outputs/mp_approx_l0/ (git-ignored)
  resumable: >-
    each chunk is written atomically, and a restart resumes after the last complete chunk. The chunk boundaries are a
    function of the population alone.

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails (eval arrays, query ids, contract, selection, weights, records, frozen code)
  - the population digest or count, or the recomputed halves, differ from the declared or stored ones
  - a held, select, fit or test row would be compiled or scored
  - any integrity check of scoring_pass fails
  - the message_passing attribute or a state_dict digest is not restored after a no-edge forward

outputs:
  script: scripts/mp_approx_l0.py (stages score, probe, read, doc, file)
  sidecars: outputs/mp_approx_l0/<name>/ (arrays as .npy, meta.json with every array's sha256), outputs/mp_approx_l0/<name>/probes/ (out-of-fold predictions, fit log)
  record: outputs/mp_approx_l0/record.json
  document: docs/MP_APPROX_L0.md
  run_record: run_record_mp_approx_l0_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l0.py
  - this file parses; its pins are the files' current sha256; the frozen code is unchanged
  - the metaqa subsample rule is deterministic, 800 per hop, and reads ids only; the fold and inner-split rules equal D0.2's
  - the copied attention reproduces QueryRelationCell's message on a random graph and splits it into a self and a neighbour part that sum to it
  - a no-edge forward restores message_passing and leaves the state_dict unchanged
  - U_q metrics equal full-pool metrics for the functions that built U_q (synthetic pools, ties included)
  - ridge within-query centring recovers a planted linear residual; a query-constant shift in the target is ignored
  - the MLP probe is deterministic at a fixed seed and thread count
  - rho, DPR, gold_DPR, top-5 overlap, within-query R2 and the bands on hand-computed toy cases
  - no held query id appears in any sidecar

execution:
  order: this file alone (commit); script and tests (commit); score metaqa, 2wiki, squad; probe; read; doc; run record (commit)
  stop_after_run: STOP_FOR_REVIEW
