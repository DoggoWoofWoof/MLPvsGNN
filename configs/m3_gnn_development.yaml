# --------------------------------------------------------------------------
# Gates. What the fitting amendment must earn.
# --------------------------------------------------------------------------

launch_authorization:
  gates:
    archaeology_recorded: true          # earned 2026-09-07, historical_gnn above, verified by live instantiation
    fairness_contract_bound: true       # earned 2026-09-07, docs/GRAPH_INFORMATION_FAIRNESS_CONTRACT.md
    screen_derived_from_graph_only_evidence: true  # earned 2026-09-07, screen_selection above
    selection_rule_frozen: true         # earned 2026-09-07, selection_rule above, no QLS term
    candidate_set_declared: true        # earned 2026-09-07, candidates above
    truncation_declared: true           # earned 2026-09-07, depth_and_radius_are_not_independent
    runner_exists: false
    instrumentation_tests_pass: false
    smoke_measures_a_gnn_fit: false
    compute_ceiling_refiled_against_measurement: false
  gates_are_earned_not_waived: >-
    The four false gates are the work of the next phase-step. A gate is turned
    true by doing the thing it names and pointing at the artifact that proves
    it, never by deciding it does not apply.

stop_condition:
  this_turn_produced:
    - the M3 declaration
    - historical GNN archaeology, verified by live instantiation
    - the fairness-contract audit, including where its clauses bite
    - the candidate architecture proposal
    - the mechanically derived representative screen
    - the workload and compute estimate
  and_then: STOP_FOR_REVIEW
  not_authorised:
    - training any GNN
    - comparing anything against QLS
    - opening M4
    - additional seeds
    - canonical CRAG
    - Package F
    - resuming E2
    - reopening QLS feature or semantic selection, which M2B closed
