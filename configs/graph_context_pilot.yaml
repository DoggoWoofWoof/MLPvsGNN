modal:
  app: message-passing-retrieval-graph-context
  result_volume: message-passing-retrieval-data
  storage_root: /root/message-passing-retrieval/storage
  cpu: 8
  memory_mb: 32768
  # Stage B is 25 queries x 6 arms. Context construction is milliseconds even on
  # webqsp's 781k-node graph (p95 232 ms, measured locally at true graph scale).
  # The feature kernel is Numba-compiled in this image; the local Python
  # fallback measured 16 s/query on a 40k-node SEED_H2 context and is not
  # representative. One hour is far above any plausible Stage B and is the unit
  # a restart would redo, since resumption here is per split.
  timeout_seconds: 3600
  # D0b is the one stage that runs a whole split rather than a capped prefix:
  # 13,500 train+validation queries against Stage B and C's 25 and 300. Its
  # indivisible unit is correspondingly larger, so it gets a larger window
  # rather than the shared one being loosened for stages that do not need it.
  # Projected at ~1,440 s -- 540 s of feature build at 40 ms per query for both
  # arms, the 600 s load ceiling, and under 300 s of linear training -- so this
  # is roughly fivefold headroom and stays a ceiling rather than an estimate.
  # The GPU shape D1 runs on. Stages B, C, D0 and D0b request none; the
  # decorator reads this only for the stages listed in gpu_stages, so a CPU
  # stage never pays for an accelerator it does not use.
  gpu: A10G
  gpu_stages:
    [stage_d1, stage_d2, stage_d3, stage_d4, stage_d5, stage_d6, stage_d7,
     stage_d8, stage_d9, stage_d10]
  stage_timeout_seconds:
    stage_d0b: 7200
    # D0c builds the same two contexts over the same 13,500 queries as D0b, adds
    # a per-candidate degree pass, and trains six arms for ten epochs instead of
    # four for three. Projected at ~550 s from D0b's measured parts, so this is
    # roughly tenfold headroom and stays a ceiling rather than an estimate.
    stage_d0c: 5400
    # Bounded by D1's measured 218 s, with the same order of headroom.
    stage_d2: 3600
    stage_d3: 3600
    # D4 shares D3's feature build and trains one arm instead of two, so it is
    # strictly cheaper than D3's measured 90.4 s of accounted work. Same ceiling,
    # not a tighter one: a timeout is a bound, not a projection.
    stage_d4: 3600
    stage_d5: 3600
    stage_d6: 3600
    # D6 trained two arms on one shared build and accounted 96.5 s. D7 trains
    # four on the same build and refits neither of D6's, so it is bounded by
    # roughly 132 s of accounted work. Same ceiling, not a tighter one: a
    # timeout is a bound, not a projection.
    stage_d7: 3600
    # D8 trains one arm on the same shared build, refits neither D6's base nor
    # D7's support arm, and adds one bounded pass for the new signal. Bounded
    # by roughly 111 s of accounted work, well inside D7's own 139.6 s. Same
    # ceiling, not a tighter one: a timeout is a bound, not a projection.
    stage_d8: 3600
    # D9 trains at most one arm on the same shared build, refits neither D6's
    # base nor D7's paths arm, and adds three bounded passes for the new
    # signal. Bounded by roughly 115 s of accounted work -- D8's 124.3 s
    # measured, plus two more graph passes and D8's support column recomputed
    # once for the overlap diagnostic, minus nothing. It can also stop at
    # either of its two gates and spend no training run at all. Same ceiling,
    # not a tighter one: a timeout is a bound, not a projection.
    stage_d9: 3600
    stage_d10: 3600
    # D1 is projected at ~515 s from measured parts -- 350 s of feature build
    # at D0b's per-query rates, ~90 s to read 474 MB of embeddings, 50 s of
    # training at the frozen sa_mlp confirmation's measured 21.4 s/seed, and
    # 20 s of scoring. This is tenfold headroom and stays a ceiling, not an
    # estimate, because the window is what a restart would redo.
    stage_d1: 5400
