    normalisation_unchanged: >-
      candidate_readout, NORMALISED_COLUMNS, the transforms, the PPR definition
      and the path definitions are all untouched. D7 is diagnosing the historical
      block. It is not yet implementing the QLS-v2 replacements that a surviving
