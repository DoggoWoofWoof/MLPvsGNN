      it does not say which pairs overlap, and nothing here licenses a
      combinatorial sweep to find out. Not a statistical claim -- +0.82 against
      +0.64 is a difference of two point estimates at one dataset and one seed,
      and the -1.07 residual is descriptive. Not a feature recommendation -- a
      family surviving is evidence that its KIND of information is useful, never
      that its QLS-v1 implementation should be carried into QLS-v2. Not an
      architecture result -- the 13-column block is a diagnostic, three columns
      wider and 183 parameters larger than the frozen model.
    decides:
      - >-
        Two families earn continued QLS-v2 development, not four -- SUPPORT and
        PATHS. DIFFUSION and NEIGHBOURHOOD leave immediate priority.
      - >-
        Do NOT carry the v1 implementations forward. SUPPORT surviving motivates
        distinct supporting seeds, support fraction or retrieval-weighted support
        over bounded bitsets, NOT the raw edge count. PATHS surviving motivates
        path diversity, unique predecessor count or independent seed support by
        hop, NOT raw walk counts.
      - >-
        DIFFUSION not surviving is not an argument to retain iterative PPR under
        any reading; bounded diffusion would have been the question and it did
        not clear the bar to be asked.
      - >-
        NEIGHBOURHOOD not surviving closes this common-neighbour statistic, not
        cheap bounded topology as an idea.
      - >-
        Do NOT launch pairwise family combinations. The sub-additivity makes them
        tempting and that is exactly why they need their own declaration and a
        clear reason. No combinatorial family sweep.
      - >-
        The global-context branch stays closed; TARGET_H1 already failed its
        controlled effectiveness test.
    actual_cost:
      new_runs: 4
      accounted_seconds: 139.6
      accounted_gpu_hours: 0.039
      accounted_usd: 0.07
      note: >-
        50.5 s shared feature build, 2.0 s static, 14.6 s assembling and proving
        the prior, then 18.5 + 17.5 + 17.5 + 17.6 s of training and 0.34 s of
        inference per arm. Against the declared authorisation ceiling of 0.15
        GPU-hours and $0.60 and the measured expectation of about 132 s filed
        before launch. Under $0.25 billed at $1.734/h. The gate reported 0.2 h /
        $0.87 again, which is the D1 stage-independent whole-split ceiling and
        not a D7 forecast.

  D6:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D6_RESULTS.md
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d6.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      Once graded retrieval evidence and seed-distance geometry are already
      present, do QLS-v1 remaining six structural statistics provide meaningful
      incremental ranking value?
    columns_under_test:
      [seed_connections, paths_length_1, paths_length_2, paths_length_3,
       personalized_pagerank, common_out_neighbors_with_seed_neighborhood]
    why_it_is_needed: >-
      D3 measured these six at +1.12 R@5 against a baseline that had no retrieval
      prior at all. That number is what a broad structural-feature frontier would be
      justified by, and D5 showed the prior is far stronger than any structural
      increment, so the six have to be re-measured conditionally before anything is
      built on them. This is the quantity that decides whether broad structural
      development is warranted.
    why_two_arms_not_one: >-
      FULL_LOCAL already occupies all ten local slots. There is no exact
      representation of FULL_LOCAL plus the three-column graded retrieval prior
      inside ten dimensions. A one-arm Z3R would either overwrite columns 4-6 --
      seed_connections, paths_length_1, paths_length_2, which are three of the six
      features under test -- or compare a 13-dimensional treatment against D5
      reused 10-dimensional Z2R and attribute the dimensionality and
      parameterisation difference to graph structure. At effect sizes around one
      R@5 point that confound is not acceptable. Two matched arms in one widened
      representation is the only design that isolates the six columns.
    representation:
      local_dim: 13
      cols_0_to_9: exact historical QLS local block, unchanged positions
      col_10: dense_reciprocal_rank
      col_11: splade_reciprocal_rank
      col_12: retriever_agreement
      prior_values: >-
        numerically identical to D4 and D5, injected after historical local
        normalisation, proven against the D4 build_graded_retrieval_block.
    arms:
      D6_BASE_13: >-
        cols0-3 exact DISTANCE_ONLY geometry; cols4-9 exactly zero; cols10-12 exact
        graded retrieval prior. NEW.
      D6_FULL_13: >-
        cols0-9 exact FULL_LOCAL historical features; cols10-12 the same exact
        prior. NEW.
    matched_between_arms:
      [architecture, parameter count, initialisation procedure, optimizer,
       batching, training budget, static block, semantic branch, CAND graph,
       scoring pool, retrieval prior]
    the_only_difference: six residual structural columns, zero versus active
    tensor_invariants:
      base_distance: D6_BASE_13[:,0:4] == D3 DISTANCE_ONLY[:,0:4]
      full_historical: D6_FULL_13[:,0:10] == historical FULL_LOCAL[:,0:10]
      both_priors: "[:,10:13] == the exact D4/D5 graded retrieval prior"
      base_residual_zero: D6_BASE_13[:,4:10] == 0 exactly
      required: max_abs_diff 0 on every one, and the arms must differ in exactly
        the six columns under test and in no others
    normalisation_unchanged: >-
      candidate_readout.NORMALISED_COLUMNS stays (4,5,6,7,8,9) and is NOT extended
      to cols 10-12. The retrieval prior is an externally defined universal
      transform and keeps its exact A3 values. Widening the normaliser would turn
      D6 into a second normalisation experiment. The runner refuses if
      NORMALISED_COLUMNS is not the frozen tuple.
    parameter_accounting:
      historical_parameters: 213506
      historical_input_dim: 275
      head_width: 61
      d6_parameters: 213689
      d6_input_dim: 278
      increase: 183
      increase_percent: 0.0857
      why: >-
        Three more input columns at an unchanged head width. The head width is
        taken from the historical ten-column solve and held fixed rather than
        re-solved, because re-solving gives head 60 and 213,409 parameters -- a
        NARROWER head on a wider input, which would change capacity and information
        together. VERIFIED FROM CODE at embedding_dim 1536, projection_dim 64,
        static_dim 7.
      acceptable_because: both D6 arms carry exactly this widened architecture
      not_a_proposed_architecture: >-
        D6 is a diagnostic model used to isolate information value. It is not a
        claim about the final minimal QLS-v2 architecture.
    reports:
      primary: >-
        delta_remaining_structure_given_retrieval_and_geometry = D6_FULL_13 -
        D6_BASE_13, on recall@1, recall@5, recall@20, mrr, full_coverage@20.
      metric_shape_matters: >-
        D3 measured the six columns at -0.60 R@1, +1.12 R@5, +0.17 R@20, -0.80 MRR,
        +0.40 FullCov@20. That R@5-specific shape is the thing to watch. If it
        disappears once graded retrieval evidence is available, the six were likely
        compensating for the missing retrieval prior rather than adding independent
        graph knowledge. If it persists, that is stronger evidence of genuine
        structural complementarity.
      also: the same frozen degree strata, which are not refitted
    d5_z2r_role: >-
      DESCRIPTIVE REFERENCE, NOT CAUSAL CONTROL. D5 arms have local_dim 10 and
      213,506 parameters, so they are not the control for anything D6 reports. The
      runner also reports D6_BASE_13 minus Z2R as a widening check: if they are
      close, cross-stage reading is safe; if they differ materially, widening the
      explicit input changes optimisation or initialisation enough that cross-stage
      comparisons need caution. D6 is NOT modified after observing that difference.
    interpretation_fixed_in_advance:
      A_remaining_structure_negligible: >-
        Near zero on R@5 with no meaningful R@20 or FullCov benefit. Conclude the
        six historical support, path, PPR and common-neighbour features do not
        justify broad structural development once direct retrieval evidence and
        seed geometry are exposed, and radically simplify the QLS-v2 base to graded
        dense retrieval, graded SPLADE retrieval, retriever agreement, bare seed
        identity and seed-distance geometry. Does NOT open the old 30-35 feature
        frontier.
      B_modest_residual_gain: >-
        Roughly +0.5 to +1.5 R@5, or a clear depth/coverage benefit. Remaining
        structure is live but must justify itself family by family. Do NOT add all
        six to QLS-v2; the next experiment decomposes support, paths, diffusion/PPR
        and common-neighbour topology one grouped family at a time against the
        strong retrieval+geometry base.
      C_large_residual_gain: >-
        Above about +1.5 R@5 with consistent supporting metrics. Structural
        development remains a major priority. Even then the global-context branch
        stays closed and the work goes into better explicit statistics on G[Cq],
        because TARGET_H1 already failed its controlled effectiveness test.
    frozen_operating_point:
      [2wiki_clean, seed 0, 3 epochs, same train/holdout split, same loss,
       same batching, same optimizer, same selection procedure]
    no_extra_epochs: >-
      The objective is decomposition of the frozen QLS-v1 regime, not convergence
      optimisation. D6 does not get a larger budget than the arms it is read
      against.
    projected_cost:
      new_runs: 2
      measured_expected:
        basis: >-
          From the D5 actuals: 49.8 s shared feature build, 1.9 s static, 6.4 s
          assembling and proving the prior, then 18.2 s training and 0.3 s inference
          per arm. D6 shares one build and trains two arms, so 49.8 + 1.9 + 6.4 +
          2 x 18.5 = about 95 s of accounted compute. D3 trained two arms on the
          same substrate and accounted 90.4 s, which corroborates it.
        accounted_gpu_hours: 0.027
        accounted_usd: 0.05
        billed_usd_including_container_overhead: 0.15
      generic_safety_ceiling:
        gpu_hours: 0.20
        usd: 0.90
        note: >-
          Authorisation ceiling, not a forecast. Reported separately from the
          measured expectation on purpose.
      the_gate_number_is_not_a_forecast: >-
        spawn_modal_jobs.py will report 0.2 h / $0.87 for this stage as it did for
        D3, D4 and D5. VERIFIED FROM CODE: every fitted graph-context stage is
        priced with the D1 whole-split model, documented in that source as a ceiling
        the later stages are bounded by. It is stage-independent and must not be
        quoted as a calibrated D6 projection.
      stop_condition: >-
        If actual cost exceeds 0.20 GPU-hours or $0.90, stop and inspect.
    does_not_authorise:
      [second dataset, second seed, GNN, TARGET_H1, R0-R5 sweep, LODO, E2 resume,
       Package F, architecture search, convergence study, graph-context branch,
       workspace migration]
    is_the_only_experiment: true
    outcome: >-
      REMAINING STRUCTURE MODEST / FAMILY TEST WARRANTED. 2Wiki validation, seed 0.
      D6_BASE_13 39.39 / 71.38 / 77.70 / 93.88 / 51.90;
      D6_FULL_13 38.77 / 72.28 / 77.94 / 93.18 / 52.43.
      delta_remaining_structure_given_retrieval_and_geometry
      -0.63 R@1, +0.89 R@5, +0.24 R@20, -0.70 MRR, +0.53 FullCov@20.
      +0.89 R@5 sits inside the pre-registered B band of +0.5 to +1.5.
    the_compensation_hypothesis_is_wrong: >-
      D3 measured these six unconditionally at -0.60 / +1.12 / +0.17 / -0.80 / +0.40.
      The conditional version is -0.63 / +0.89 / +0.24 / -0.70 / +0.53: the whole
      sign shape survives, R@5 shrinks by 0.23 points, and both coverage measures
      grow slightly. The six were NOT compensating for the missing retrieval prior.
      Whatever they carry, the prior did not already contain it. That is a stronger
      result for structure than D5 alone suggested and a smaller one than +1.12 was
      ever going to justify.
    it_is_a_trade_not_a_gain: >-
      D6_FULL_13 is not the better arm. It wins R@5, R@20 and FullCov@20 and loses
      R@1 (-0.63) and MRR (-0.70). What D5 showed for the distance buckets -- that
      they stop costing precision once the prior is present -- does NOT extend to
      the other six. Adopting all six wholesale would trade about 0.6 R@1 and 0.7
      MRR for about 0.9 R@5 and 0.5 FullCov@20, and nothing in this stage says that
      trade is worth making.
    concentrated_where_the_graph_is: >-
      isolated (834) -0.30 / +0.36 / -0.12 / -0.28 / -0.24; degree_1 (750) -0.37 /
      +1.23 / +0.20 / -0.62 / +0.53; low_degree (1218) -1.19 / +0.90 / +0.39 / -1.30
      / +0.82; ordinary (198) +0.51 / +1.77 / +1.01 / +0.95 / +2.02. Only the most
      connected stratum is positive on all five, and it holds the largest value on
      every one; coverage tracks connectivity monotonically. The headline +0.89 R@5
      averages over strata ranging from +0.36 to +1.77, and the stratum carrying the
      strongest signal is 6.6% of validation. low_degree pays most of the precision
      cost. boundaries_fitted_here false; query counts identical to D5.
    tensor_invariants_measured:
      base_distance_is_d3: max_abs_diff 0.0, elementwise identical, 4,851,276 rows
      full_historical_is_the_historical_block: max_abs_diff 0.0, identical
      both_priors_are_d4s: max_abs_diff 0.0, identical
      base_residual_columns: exactly zero
      the_arms_differ_in: columns [4, 5, 6, 7, 8, 9] and no others
      normalised_columns: (4,5,6,7,8,9), not extended to cols 10-12
    parameter_accounting_measured:
      historical_parameters: 213506
      d6_parameters: 213689
      increase: 183
      increase_percent: 0.0857
      head_width: 61
      both_arms_identical: true
      note: >-
        Head width held from the historical ten-column solve rather than re-solved.
        Re-solving returns head 60 at 213,409 parameters, a narrower head on a wider
        input, which would change capacity and information together.
    widening_check_measured: >-
      D6_BASE_13 minus D5 Z2R: -0.17 R@1, -0.06 R@5, -0.11 R@20, -0.30 MRR, -0.23
      FullCov@20. Every difference under a third of a point and all five slightly
      negative, so widening the explicit input by three columns changed almost
      nothing and cross-stage reading between D5 and D6 is safe at this resolution.
      D5 remains DESCRIPTIVE REFERENCE, NOT CAUSAL CONTROL; 19 reference conditions
      checked, all matched.
    convergence_note: >-
      VERIFIED FROM CODE, _fit restores the best held-out epoch. Both arms peaked at
      epoch 2 (D6_BASE_13 0.7090 then 0.7081; D6_FULL_13 0.7181 then 0.7155), so
      neither was favoured by selection and the three-epoch budget was not the
      binding constraint -- unlike D4 and D5, which were still rising at the
      boundary.
    not_established: >-
      Not a decomposition: six columns from four families moved as one group, and
      nothing says which produced the +0.89 R@5 or whether one family produced all
      of it while another cost the R@1. Not a statistical claim: +0.89 against D3's
      +1.12 is a difference of two point estimates at one dataset and one seed, not
      resolvable at this resolution. Not an architecture result: the 13-column block
      is a diagnostic, three columns wider and 183 parameters larger than the frozen
      model, and is not proposed as the QLS-v2 input. One dataset, one seed, G[Cq].
    decides:
      - >-
        Pre-registered B branch. Remaining structure is live and must justify
        itself family by family.
      - >-
        Do NOT add all six to QLS-v2; the group is a trade concentrated in the
        most connected 6.6% of queries.
      - >-
        Do NOT open the old 30-35 feature frontier; the question is whether any
        existing family earns its place, not whether to go wider.
      - >-
        The next decomposition is four grouped families against the retrieval +
        geometry base: support (seed_connections), paths (paths_length_1..3),
        diffusion (personalized_pagerank), common-neighbour topology
        (common_out_neighbors_with_seed_neighborhood). One family at a time.
      - >-
        The global-context branch stays closed; TARGET_H1 already failed its
        controlled effectiveness test.
    actual_cost:
      new_runs: 2
      accounted_seconds: 96.5
      note: >-
        49.5 s shared feature build, 1.9 s static, 9.5 s assembling and proving the
        prior, 18.0 s + 16.9 s training, 0.3 s + 0.3 s inference. Against the
        declared 0.20 GPU-hour and $0.90 ceilings and the measured expectation of
        about 95 s / $0.05 filed before launch. Under $0.15 billed at $1.734/h. The
        gate reported 0.2 h / $0.87 again, which is the D1 stage-independent
        whole-split ceiling and not a D6 forecast.

  D5:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D5_RESULTS.md
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d5.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      After graded retrieval evidence is available, does seed-distance geometry
      still provide incremental ranking value?
    why_it_is_needed: >-
      D4 found the graded retrieval prior larger than any structural increment on
      R@1, R@5 and MRR, but weaker than distance geometry on exactly the two
      coverage measures (+1.55 vs +5.13 R@20; +2.43 vs +8.77 FullCov@20). That
      reads as complementary rather than substitutive, and nothing measured so far
      tests whether the two add. D5 composes them directly. It also tells us
      whether D3 remaining-structure increment of +1.12 survives once the much
      stronger retrieval evidence is exposed, which is why that number may not be
      used as the justification for any further structural work until D6.
    arms:
      Z1_SEED_ID_ONLY: the bare bit; REUSED from D3
      Z2_DISTANCE_ONLY: the frozen four-column distance bucket group; REUSED from D3
      Z3_FULL_LOCAL: >-
        all ten historical columns; REUSED from D3, which itself reused it from D2
        as FULL_CAND, so this row is a two-hop reuse and is recorded as measured in
        D2
      Z1R_SEED_PLUS_GRADED_RETRIEVAL: the bit plus the A3 prior; REUSED from D4
      Z2R_DISTANCE_PLUS_GRADED_RETRIEVAL: >-
        the D3 distance group plus the exact D4 prior; NEW, and the only training
        run in this stage
    columns:
      slots_0_to_3: >-
        distance_0..3, byte-for-byte the D3 DISTANCE_ONLY masking of the same
        build_local_features output. Outside NORMALISED_COLUMNS by construction.
      slots_4_to_6: >-
        dense_reciprocal_rank, splade_reciprocal_rank, retriever_agreement,
        injected AFTER candidate_readout has run.
      slots_7_to_9: zero
    the_normalisation_trap:
      what_it_would_have_been: >-
        candidate_readout divides columns 4-9 by their own per-query maximum and
        leaves 0-3 untouched. A prior written into slots 4-6 BEFORE that
        normalisation would not be the prior D4 measured, so Z2R - Z1R would have
        confounded adding geometry with changing the retrieval transform.
      what_the_runner_does: >-
        build_local_features applies candidate_readout before returning, so the
        injection happens after it. That is a property of call ordering, not of the
        column indices, and D4 proved nothing about it, so D5 proves it rather than
        assuming it.
      measured_note: >-
        On this data the naive layout would in fact have been harmless. Each prior
        column per-query maximum is exactly 1.0 -- rank 0 is always in Cq, and
        agreement reaches 1 whenever the lists overlap -- so candidate_readout would
        have divided by one. MEASURED, max abs difference 0.0. That is a coincidence
        of the reciprocal-rank transform, not a guarantee: a different K, a
        percentile transform or a pool missing rank 0 would each break it. Recorded
        so the fix is not credited with averting a corruption it did not avert, and
        the proof is kept anyway because relying on the coincidence would be fragile.
    equivalence_invariants:
      prior_matches_d4: >-
        Z2R columns 4-6 are compared elementwise against the block that the D4
        build_graded_retrieval_block produces, calling the shipped D4 code rather
        than a second implementation. Required: max_abs_diff exactly 0.0 and
        np.array_equal. The runner raises otherwise.
      geometry_matches_d3: >-
        Z2R columns 0-3 are compared elementwise against masked_local over
        DISTANCE_COLUMNS on the same build_local_features output D3 masked, plus a
        complete-one-hot check and a check that slots 7-9 are exactly zero.
      therefore: Z2R is exactly D3 geometry plus exactly the D4 prior and nothing else.
    the_prior_is_unchanged_from_d4:
      constant_K: 60
      formula: (K + 1) / (K + zero_based_rank + 1)
      missing_retriever_handling: exactly 0.0
      agreement: 1.0 iff ranked by both retrievers
      no_new_normalisation: true
      no_percentile_transform: true
      no_seed_only_masking: true
      why: >-
        D5 is a composition experiment. If the prior itself changed, the comparison
        would not be about composition.
    ablation:
      method: injecting the prior into free slots after candidate_readout
      parameter_difference: 0
      why: >-
        The distance group keeps its historical slots so the geometry is D3 exactly,
        and the prior lands in three columns that are zero in DISTANCE_ONLY, so
        local_dim stays 10, head width stays 61 and the parameter count stays
        213,506.
      same_epoch_budget_for_every_arm: true
    reuse:
      arms:
        Z1: D3 SEED_ID_ONLY
        Z2: D3 DISTANCE_ONLY
        Z3: D2 FULL_CAND, via D3 FULL_LOCAL
        Z1R: D4 SEED_PLUS_GRADED_RETRIEVAL
      why: >-
        Four of the five rows were measured under identical conditions in earlier
        stages. The runner checks every condition against BOTH source files -- and
        additionally that D3 and D4 agree about SEED_ID_ONLY, since D4 reused it
        from D3 and a disagreement would mean the chain is broken behind us. It
        refuses rather than reusing across a mismatch.
      provenance_is_not_relabelled: >-
        measured_in names where the numbers of a row were produced, not the file D5
        read them out of, so FULL_LOCAL keeps pointing at stage_d2.
      new_runs: 1
    reports:
      delta_prior_given_geometry: >-
        Z2R - Z2. Does the D4 retrieval gain survive once geometry is present?
      delta_geometry_given_prior: >-
        Z2R - Z1R. Does geometry survive once the prior is present? The
        scientifically more important of the two.
      interaction: >-
        (Z2R - Z1R) - (Z2 - Z1). Near zero means additive, positive means
        complementary, negative means overlapping. DESCRIPTIVE ONLY at one dataset,
        one seed, one operating point -- a sign, not a statistical interaction claim.
      metrics: [recall@1, recall@5, recall@20, mrr, full_coverage@20]
      read_all_of_them: >-
        Not R@5 alone. D4 traded head accuracy against depth, so R@1, R@20 and
        FullCov@20 each have to be inspected before the stage is classified.
      also: the same frozen degree strata, which are not refitted
    interpretation_fixed_in_advance:
      A_retrieval_and_geometry_compose_strongly: >-
        Both conditionals clearly positive. The minimal QLS-v2 starting point is
        graded retrieval prior plus seed identity plus seed-distance geometry. Does
        NOT authorise opening a large R0-R5 feature grid.
      B_geometry_redundant_given_retrieval: >-
        delta_geometry_given_prior near zero or negative. Geometry drops out of the
        minimal base and the D3 +1.12 cannot justify further structural work.
      C_retrieval_redundant_given_geometry: >-
        delta_prior_given_geometry near zero. Would contradict the D4 magnitude and
        would need explaining before anything is built on it.
      D_head_depth_tradeoff_remains: >-
        Z2R wins precision and loses coverage, or the reverse. Does NOT authorise
        adding a larger model; it makes the objective, not the capacity, the issue.
    projected_cost:
      basis: >-
        Measured from D4: 74.4 s of accounted compute for one shared feature build
        (50.7 s), 2.1 s static, 2.8 s assembling the prior, 18.5 s training and
        0.3 s inference. D5 trains ONE arm on the same build and adds one extra
        prior-assembly pass for the equivalence proof, so it is priced as one new
        run at the measured D4 cost plus a few seconds.
      new_runs: 1
      gpu_hours_ceiling: 0.10
      cost_ceiling_usd: 0.45
      wall_time_ceiling_minutes: 10
      expected_actual_usd: 0.15
      stop_condition: >-
        If the gate projection exceeds 0.10 GPU-h or $0.45 without a technical
        explanation, stop and inspect rather than launch.
    does_not_authorise:
      [second dataset, second seed, GNN, R0-R5 sweep, LODO, E2, TARGET_H1,
       PATH, BRIDGE, SEED_H2, graph-context gating, larger model, more epochs
       for any one arm, Z3R]
    z3r_is_not_authorised_here: >-
      FULL_LOCAL plus the exact prior is the likely next question if interpretation
      A occurs, but it is a separate declaration and is not launched from this one.
    outcome: >-
      RETRIEVAL + GEOMETRY COMPOSE STRONGLY. 2Wiki validation, seed 0.
      Z1 SEED_ID_ONLY 30.15 / 65.27 / 72.22 / 80.73 / 42.77;
      Z2 DISTANCE_ONLY 29.63 / 66.76 / 77.36 / 80.08 / 51.53;
      Z3 FULL_LOCAL 29.03 / 67.88 / 77.53 / 79.28 / 51.93;
      Z1R SEED_PLUS_GRADED_RETRIEVAL 39.32 / 69.39 / 73.78 / 93.76 / 45.20;
      Z2R DISTANCE_PLUS_GRADED_RETRIEVAL 39.56 / 71.44 / 77.81 / 94.18 / 52.13.
      delta_prior_given_geometry +9.93 / +4.68 / +0.45 / +14.10 / +0.60;
      delta_geometry_given_prior +0.23 / +2.05 / +4.03 / +0.42 / +6.93.
      Both conditionals positive on all five metrics, and Z2R is the best of the
      five arms on all five metrics.
    interaction_measured: >-
      +0.75 R@1, +0.56 R@5, -1.10 R@20, +1.06 MRR, -1.83 FullCov@20. Complementary
      on precision, partly overlapping on depth. DESCRIPTIVE ONLY: five differences
      of differences at one dataset, one seed, one operating point.
    seven_columns_beat_ten: >-
      Z2R against Z3 FULL_LOCAL: +10.53 R@1, +3.56 R@5, +0.28 R@20, +14.90 MRR,
      +0.20 FullCov@20. Four distance buckets plus three retrieval columns beat all
      ten historical columns on every metric at identical parameter count, which
      resolves the D4 head/depth trade-off rather than confirming it. The two
      coverage margins are small and should be read as no longer behind rather than
      ahead.
    ceiling_caveat: >-
      candidate_ceiling is 79.33 and Z2R reaches 77.81 R@20, so 98.1% of achievable
      recall@20 is taken. The +0.45 delta_prior_given_geometry on R@20 is partly
      that ceiling, not only a property of the prior.
    geometry_stops_costing_precision: >-
      D3 measured delta_distance NEGATIVE on R@1 (-0.52) and MRR (-0.65). With the
      prior present the same geometry is positive on both (+0.23, +0.42). That is
      the positive precision interaction.
    opposite_stratum_signatures: >-
      delta_prior_given_geometry is flat across strata on precision (+9.17 to +11.36
      R@1, +13.56 to +15.50 MRR) and near zero on coverage everywhere, turning
      slightly negative on the most connected stratum. delta_geometry_given_prior is
      the mirror image: near zero on R@1 and MRR, rising monotonically with
      connectivity on R@20 (+0.63 to +6.69) and FullCov@20 (-0.24 to +13.13). The
      strata are a graph property, so a signal indifferent to it is text evidence
      and a signal that scales with it is using the induced structure. This is the
      strongest evidence in the stage that the two carry different information.
      boundaries_fitted_here false; query counts identical to D4.
    equivalence_measured:
      prior_matches_d4: max_abs_diff 0.0, elementwise identical, 4,851,276 rows
      geometry_matches_d3: elementwise identical, complete one-hot, slots 7-9 zero
      seed_identity: 4,851,276 rows, 105,675 seed rows, 0 mismatches
    the_trap_did_not_bite_here: >-
      MEASURED and recorded in docs/GRAPH_CONTEXT_D5_RESULTS.md section 4: on this
      data the pre-normalisation layout would have produced identical values,
      because each prior column per-query maximum is exactly 1.0 and
      candidate_readout would have divided by one. Max absolute difference 0.0, and
      a probe column with maximum 0.5 was rescaled to 1.0 in the same call, so the
      mechanism is real and only its effect here is nil. The ordering and the proof
      are kept because depending on the coincidence would be fragile. The fix is not
      credited with averting a corruption it did not avert.
    reuse_measured: >-
      54 guarded conditions checked against BOTH source files, all matched. The
      guard also requires D3 and D4 to agree about SEED_ID_ONLY, since D4 reused it
      from D3. FULL_LOCAL is recorded as measured_in stage_d2 via stage_d3, not
      relabelled. arms_trained_here == [DISTANCE_PLUS_GRADED_RETRIEVAL].
    convergence_caveat: >-
      Z2R runs the frozen three-epoch budget and is still improving at the boundary
      (loss 1.846 -> 1.528 -> 1.415, held-out tail R@5 0.6938 -> 0.7064 -> 0.7088).
      Deliberate: four of the five rows are earlier stages and this arm must not be
      given a convergence advantage over its own controls.
    not_established: >-
      Not a statistical interaction claim. Not a verdict on the six remaining
      structural columns: the D3 +1.12 R@5 was measured against a much weaker
      baseline and whether any of it survives the prior is exactly what Z3R would
      test, so it still cannot justify further structural work. Not new information
      about the world, since Cq was built by RRF over the same two lists. Three
      retrieval and four distance columns each move as a group. One dataset, one
      seed, context G[Cq].
    actual_cost:
      new_runs: 1
      accounted_seconds: 76.6
      note: >-
        49.8 s shared feature build, 1.9 s static, 6.4 s assembling and proving the
        prior, 18.2 s training, 0.3 s inference. Under $0.15 at $1.734/h against
        $0.45 authorised. The gate reported 0.2 h / $0.87, byte-identical to the D3
        and D4 figures: VERIFIED FROM CODE, every fitted graph-context stage is
        priced with the D1 whole-split model, documented in spawn_modal_jobs.py as a
        ceiling the later stages are bounded by, so it is not a D5-specific
        projection and its excess over the declared $0.45 has a technical cause.

  D4:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D4_RESULTS.md
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d4.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      After the model already knows bare retrieval-seed membership, does graded
      retrieval evidence provide substantial additional ranking value?
    why_it_is_needed: >-
      D3 showed the seed bit carries 87.4% of the query-local block's R@5 value and
      beats the whole block on R@1 and MRR. The bit is coarse: it says whether a
      candidate was in the dense-top-5 union SPLADE-top-5 set and nothing about
      rank, retriever agreement, or the ~350 candidates outside that set. Whether
      graded evidence adds to it decides where QLS-v2 starts.
    arms:
      Z1_SEED_ID_ONLY: only distance_0, exact bare seed membership; REUSED from D3
      Z1R_SEED_PLUS_GRADED_RETRIEVAL: >-
        that same bit, plus A3's dense and SPLADE reciprocal-rank features and a
        retriever-agreement column, for every candidate in Cq; NEW
    the_bit_is_preserved_not_replaced: >-
      Both arms carry distance_0, bit-identical, from the same build_local_features
      call. Replacing it with graded evidence would have confounded "is graded
      evidence better than the bit" with "what happens when the bit is removed",
      and only the second is already answered. Asserted in the runner.
    definition: >-
      B, the full candidate retrieval prior: graded evidence for every candidate in
      Cq, not only for seeds. Feasible because Cq IS the top-200 dense union SPLADE
      union while Sq is only the top-5 union, so every candidate carries a rank
      from at least one retriever. Because it is definition B the arm is named
      GRADED_RETRIEVAL_PRIOR, not seed quality.
    columns:
      slot_0: distance_0, unchanged, exactly I[d in Sq]
      slot_1: dense_reciprocal_rank (A3), overwrites the zeroed distance_1 slot
      slot_2: splade_reciprocal_rank (A3), overwrites the zeroed distance_2 slot
      slot_3: retriever_agreement (NEW), overwrites the zeroed distance_3 slot
      slots_4_to_9: zero in both arms
    a3_audit:
      feature_names: [dense_reciprocal_rank, splade_reciprocal_rank]
      source: mp_retrieval.linear_control.rank_feature_rows, called as D0B calls it
      formula: (K + 1) / (K + zero_based_rank + 1)
      constant_K: 60
      missing_retriever_handling: exactly 0.0 for a candidate absent from that ranking
      normalisation: >-
        universal. Rank 0 is exactly 1.0 and rank r is the same value whatever the
        list length or pool size, so no pool-dependent scale enters. Verified in the
        runner by halving the list and requiring every value to be unchanged.
      seeds_special_cased: false
      new_feature: >-
        retriever_agreement only, 1.0 iff the candidate is ranked by both
        retrievers. A deterministic function of the two A3 columns, disclosed as new
        rather than presented as an A3 feature.
    ablation:
      method: filling zeroed slots, not widening the block
      parameter_difference: 0
      why: >-
        The three retrieval columns are exactly zero in SEED_ID_ONLY, so local_dim,
        head width and parameter count (213,506 at head 61) are identical and the
        increment measures information, not capacity.
      same_epoch_budget_for_every_arm: true
    reuse:
      arms: {Z1: D3 SEED_ID_ONLY}
      why: >-
        Identical conditions, so retraining it for cosmetic symmetry would pay twice
        for the same numbers and would give one arm a different initialisation. The
        runner checks dataset, fingerprint, context, model, node count, candidate
        contract, local feature schema, candidate rows, static feature source,
        architecture, epoch-budget policy, that D3's reused row is the bare-bit arm
        and was trained in D3, that the seed-identity proof agrees on column, row
        count, seed rows and mismatches, all three split sizes and all five training
        values. It refuses rather than reusing across a mismatch.
      new_runs: 1
    reports:
      delta_retrieval_quality: >-
        Z1R - Z1, the incremental value of graded dense and SPLADE evidence over
        every candidate, given bare seed membership. The only main causal comparison.
      metrics: [recall@1, recall@5, recall@20, mrr, full_coverage@20]
      also: the same frozen degree strata, which are not refitted
    interpretation_fixed_in_advance:
      A_graded_retrieval_prior_dominates: >-
        Gain much larger than D3's +1.12 R@5 remaining-structure increment. QLS-v2
        begins from a graded retrieval prior plus seed identity plus minimal seed
        geometry.
      B_retrieval_and_structure_both_live: >-
        Gain roughly 0.5 to 1.5 R@5, comparable to the remaining structural block.
        Both stay live and are compared on effectiveness against serving and
        parameter cost.
      C_seed_bit_already_saturated: >-
        Gain negligible. The bare bit already captures what retrieval evidence
        offers this ranker; the next lever is seed-distance geometry, then selective
        testing of the six remaining structural statistics.
    projected_cost:
      basis: >-
        Measured from D3: 90.4 s of accounted compute for one shared feature build
        (51.0 s), 2.0 s static, two trainings (18.9 s + 17.8 s) and two scorings. D4
        shares the same build and trains ONE arm, adding only a cheap pass to
        assemble the rank columns. Priced as one new run, not two.
      new_runs: 1
      gpu_hours_ceiling: 0.10
      cost_ceiling_usd: 0.45
      wall_time_ceiling_minutes: 10
      expected_actual_usd: 0.15
    outcome: >-
      GRADED RETRIEVAL PRIOR DOMINATES NEXT PRIORITY. 2Wiki validation, seed 0.
      SEED_ID_ONLY 30.15 / 65.27 / 72.22 / 80.73 / 42.77;
      SEED_PLUS_GRADED_RETRIEVAL 39.32 / 69.39 / 73.78 / 93.76 / 45.20.
      delta_retrieval_quality +9.18 R@1, +4.13 R@5, +1.55 R@20, +13.03 MRR,
      +2.43 FullCov@20. Positive on every metric.
    size_against_d3: >-
      On R@5 the prior is 3.67x delta_remaining_structure and 2.77x delta_distance,
      far outside the 0.5-1.5 band that would have meant interpretation B. On R@1 it
      is 2.55x delta_seed and on MRR 1.26x. With delta_seed it is one of only two
      increments measured across D2-D4 positive on all five metrics; both structural
      increments beyond the bit are negative on R@1 and MRR.
    three_columns_beat_ten: >-
      Against D3 FULL_LOCAL: +10.29 R@1, +1.51 R@5, +14.48 MRR, but -3.75 R@20 and
      -6.73 FullCov@20. One bit plus dense rank, SPLADE rank and their agreement,
      with no graph-derived structure at all, beat the entire frozen query-local
      block on every precision measure and lose on both coverage measures.
      conditional_hit@1 67.53 -> 88.50; conditional_hit@20 reaches 100.00.
    coverage_is_where_structure_still_earns: >-
      delta_retrieval_quality is smallest on exactly the two measures distance
      geometry was largest on (+1.55 vs +5.13 R@20; +2.43 vs +8.77 FullCov@20). Both
      retrievers rank by text similarity, so a gold no retriever placed highly is not
      made findable by reporting where they placed it. The signals are complementary.
    flat_across_strata: >-
      +9.07 to +9.34 R@1 and +12.40 to +13.82 MRR across all four strata, within a
      third of a point end to end -- unlike delta_seed which falls monotonically with
      connectivity and delta_distance which rises. The strata are a graph property
      and the prior is indifferent to it, because it is text evidence. Only R@20
      climbs with connectivity (+1.17 to +2.65). boundaries_fitted_here false.
    prior_coverage: >-
      4,851,276 candidate rows, 0 ranked by neither retriever, 548,724 (11.31%) by
      both, 2,151,276 by each alone. 359.35 candidates per query against 7.83 seeds,
      so most of the arm's information concerns candidates the seed bit is silent on.
    seed_bit_preserved: >-
      Bit-identical in both arms from the same build_local_features call; 105,675
      seed rows; distance_0 re-verified elementwise against the historical
      _seed_indicator on 4,851,276 rows with 0 mismatches. seed_bit_replaced false.
    reuse: >-
      SEED_ID_ONLY was not retrained. All 25 guarded conditions matched D3. One new
      run only. Identical initialisation and batch order: seed_everything(0) precedes
      _build_model in both stages and _fit shuffles with a per-epoch Random(seed +
      epoch * 1_000_003) independent of global RNG state.
    convergence_caveat: >-
      The new arm runs the frozen three-epoch budget and is still descending at the
      boundary (loss 1.961 -> 1.699 -> 1.598, held-out tail R@5 0.6840 -> 0.6869 ->
      0.6905). Deliberate: D4 reuses a D3 arm as its control and must not give itself
      a convergence advantage over it.
    not_established: >-
      Three columns move together, so the agreement column is not separated from the
      two rank columns. The prior is not new information about the world: Cq was
      itself built by RRF over these two lists, so it reports retrieval evidence the
      ranker previously could not see, which makes it free at serving time rather
      than novel. Not a claim that structure is unnecessary. One dataset, one seed.
    actual_cost:
      new_runs: 1
      accounted_seconds: 74.4
      note: >-
        50.7 s shared feature build, 2.1 s static, 2.8 s assembling the prior, 18.5 s
        training, 0.3 s inference. Container total not captured by the spawn path;
        the result was on the volume within three minutes of the spawn returning, so
        under $0.15 at $1.734/h against $0.45 authorised.
    does_not_authorise:
      [second dataset, second seed, GNN, R0-R5 sweep, LODO, E2, TARGET_H1,
       PATH, BRIDGE, SEED_H2, graph-context gating, per-family decomposition of
       the six remaining structural columns, more epochs for any one arm]

  D3:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D3_RESULTS.md
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d3.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      How much of QLS-v1's query-local block value is bare retrieval-seed
      identity, how much is seed-distance geometry, and how much is the
      remaining graph-derived structure?
    why_it_is_needed: >-
      D2 measured the block as a whole (-20.82 R@5) but cannot attribute it. All
      ten columns are seed-anchored and sa_mlp has no other seed channel, so
      zeroing the block removes seed identity, seed geometry and graph structure
      at once. The seed_only comparison in the D2 write-up sizes the split only
      by cross-stage inference at a different head width; D3 replaces that
      inference with a within-stage measurement.
    proven_before_running: >-
      distance_0 is exactly I[d in Sq]. It is set from is_seed before any BFS hop
      and never overwritten, and candidate_readout leaves columns 0-3 untouched,
      so it is elementwise identical to the historical _seed_indicator. Proven in
      tests/test_seed_membership_column.py and asserted again at full scale
      inside the runner on the real queries.
    arms:
      Z0_ZERO_LOCAL: all ten query-local columns zero; reused from D2 NO_QUERY_LOCAL
      Z1_SEED_ID_ONLY: only distance_0, exact bare seed membership; NEW
      Z2_DISTANCE_ONLY: the complete frozen distance bucket group 0-3; NEW
      Z3_FULL_LOCAL: the original ten-column block; reused from D2 FULL_CAND
    naming: >-
      Z1 is not called SEED_MEMBERSHIP_ONLY-plus-buckets and Z2 is not called
      seed-membership-only. Keeping all four distance buckets exposes seed
      geometry, not membership, so the arm that keeps them is named
      DISTANCE_ONLY.
    ablation:
      method: masking, not removal
      parameter_difference: 0
      why: >-
        Identical architecture, head width and parameter count (213,506 at head
        61) in all four arms, so the ladder measures information and not
        capacity.
      same_epoch_budget_for_every_arm: true
    reuse:
      arms: {Z0: D2 NO_QUERY_LOCAL, Z3: D2 FULL_CAND}
      why: >-
        Identical conditions, so retraining them would pay twice for the same
        numbers. The runner checks dataset, fingerprint, context, model, node
        count, candidate contract, candidate rows, static feature source, all
        three split sizes and all five training values against D2's result file,
        and refuses rather than reusing across a mismatch.
      new_runs: 2
    reports:
      delta_seed: Z1 - Z0, value of knowing which candidates were retrieval seeds
      delta_distance: Z2 - Z1, incremental value of seed-distance geometry
      delta_remaining_structure: >-
        Z3 - Z2, incremental value of seed connections, path statistics,
        personalised PageRank and common-neighbour structure
      metrics: [recall@1, recall@5, recall@20, mrr, full_coverage@20]
      also: the same frozen degree strata, which are not refitted
    interpretation_fixed_in_advance:
      A_seed_identity_dominates: >-
        delta_seed carries almost all of the D2 gap. Most of QLS-v1's apparent
        query-local structural value is retrieval-seed identity, and structural
        work has only modest demonstrated headroom. Before opening R0-R5 broadly,
        isolate which small structural family produces the remainder.
      B_seed_geometry_dominates: >-
        delta_distance is large. Seed geometry is the main useful structural
        primitive; favour a minimal QLS-v2 built on seed identity, distinct
        support and a better distance distribution rather than a feature
        catalogue.
      C_remaining_structure_has_large_value: >-
        delta_remaining_structure is large. Support, path and diffusion
        statistics carry genuine incremental value beyond identity and distance,
        which justifies opening the QLS-v2 structural frontier.
      D_seed_and_distance_recover_almost_all: >-
        Do NOT test a large structural catalogue. Start QLS-v2 from retrieval
        prior + seed identity + minimal seed geometry and add one family at a
        time.
    projected_cost:
      basis: >-
        Measured from D2: 88.1 s of accounted compute for one shared feature
        build (49.7 s) plus two trainings (18.5 s + 17.1 s) and two scorings. D3
        shares one build across four arms and trains two, so its accounted work
        is within a few seconds of D2's. Priced as two new runs, not four.
      new_runs: 2
      gpu_hours_ceiling: 0.20
      cost_ceiling_usd: 0.90
      wall_time_ceiling_minutes: 12
      expected_actual_usd: 0.30
    outcome: >-
      SEED IDENTITY DOMINATES. Ladder on 2Wiki validation, seed 0, R@5: ZERO_LOCAL
      47.07, SEED_ID_ONLY 65.27, DISTANCE_ONLY 66.76, FULL_LOCAL 67.88. Increments
      delta_seed +18.20, delta_distance +1.49, delta_remaining_structure +1.12, which
      telescope to D2's +20.82 exactly. Seed identity is 87.4% of the R@5 gap, 67.0%
      of R@20 and 59.5% of FullCov@20.
    one_bit_beats_the_block: >-
      SEED_ID_ONLY beats FULL_LOCAL on R@1 (30.15 vs 29.03) and MRR (80.73 vs 79.28)
      and reaches 96.1% of its R@5 from a single binary column. The other nine
      columns are a net loss of 1.12 R@1 and 1.45 MRR against the bare indicator.
    distance_geometry: >-
      The one structural increment with real value, and it is entirely depth: +5.13
      R@20 and +8.77 FullCov@20 against -0.52 R@1 and -0.65 MRR. Its stratified shape
      is the mirror image of delta_seed -- worth +1.02 R@20 on isolated and +9.60 on
      ordinary -- because an isolated candidate has no geometry to read.
    remaining_structure_lower_priority_not_eliminated: >-
      seed_connections, paths_length_1/2/3, personalized_pagerank and
      common_out_neighbors are worth +1.12 R@5, +0.17 R@20, +0.40 FullCov@20 and are
      NEGATIVE on R@1 and MRR. Interpretation C, "remaining structure has large
      value", is REFUSED. Interpretation D also holds: seed identity plus distance
      recovers 94.6% of the R@5 gap, 99.0% of R@20 and 98.2% of FullCov@20. These six
      columns are NOT eliminated. +1.12 R@5 is materially smaller than seed identity
      but still large enough to matter at the scale of the QLS-versus-GNN gap.
      Correct status: remaining structural statistics are lower-priority and must
      justify their cost individually; they are not yet eliminated.
    remaining_structure_next_step: >-
      Positive on R@5 (+1.12) and near-zero on R@20 (+0.17) while negative on R@1
      (-0.60) and MRR (-0.80). The six columns may be optimising specifically around
      the R@5 operating region rather than improving ranking globally. Decompose them
      individually or by family later, not as one block. DEFERRED, not refused, and
      not authorised by this stage.
    seed_identity_proof: >-
      distance_0 verified elementwise identical to the historical _seed_indicator on
      4,851,276 real candidate rows, 0 mismatches, 105,675 seed rows; the distance
      group is a complete one-hot on every row. Asserted inside the run, not assumed.
    reuse: >-
      ZERO_LOCAL and FULL_LOCAL were not retrained. All 18 guarded conditions matched
      D2. Two new runs only.
    supersedes_the_d2_inference: >-
      The D2 write-up sized this split by cross-stage inference at ~18.8 / ~2.57. D3
      measures +18.20 / +2.61 within one stage. The inference was close but is no
      longer what the conclusion rests on.
    convergence_caveat: >-
      Every arm runs the frozen three-epoch QLS-v1 budget and every arm is still
      descending at the boundary. Deliberate: D3 decomposes D2 at D2's operating
      point and no arm may be given more epochs than another. Not a converged claim.
    actual_cost:
      new_runs: 2
      accounted_seconds: 90.4
      note: >-
        51.0 s shared feature build, 2.0 s static, 18.9 s + 17.8 s training, 0.7 s
        inference. Container total not captured by the spawn path; wall clock under
        ten minutes, so under $0.29 at $1.734/h against $0.90 authorised.
    does_not_authorise:
      [second dataset, second seed, GNN, R0-R5 sweep, LODO, E2, TARGET_H1,
       PATH, BRIDGE, SEED_H2, graph-context gating, more epochs for any one arm]

  D2:
    status: COMPLETE
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d2.py
    results: docs/GRAPH_CONTEXT_D2_RESULTS.md
    dataset: 2wiki_clean
    audit: docs/QLS_V1_COMPONENT_AUDIT.md
    question: >-
      What is the incremental value of QLS-v1's query-local structural feature
      block under the historical semantically filtered candidate graph?
    why_it_is_not_a_duplicate: >-
      The frozen ladder was audited from code before this was filed. seed_only is
      built with static_dim=0 and local_dim=1 and is fed a single binary retrieval
      seed indicator, so seed_only -> sa_mlp (+2.58 R@5 on 2Wiki, five seeds)
      moves the seven static features, the ten query-local features and the seed
      indicator at once, at two head widths. No other frozen condition is
      "interactions + static, no local". The linear half is already answered by
      D0c at no cost; only the nonlinear arm is missing.
    arms:
      FULL_CAND: exact QLS-v1 on G[Cq]; reproduces D1's CAND arm as a control
      NO_QUERY_LOCAL: identical model with the ten query-local columns zeroed
    ablation:
      method: zeroing, not removal
      why: >-
        Keeps architecture, head width and parameter count identical (213,506 at
        head 61), removing the capacity, optimiser and parameter-count confounds
        that the historical seed_only contrast carries. The first-layer weights
        reading the zeroed columns receive exactly zero gradient; AdamW's
        decoupled weight decay still shrinks them, which cannot change a score,
        because a weight multiplying zero contributes zero. Dead but trainable,
        and recorded as such.
      parameter_difference: 0
    context: CAND only. This is not a context experiment; that branch is closed.
    not_named_retrieval_only: >-
      The model keeps the seven static graph features, the candidate embeddings,
      the learned projection and the interaction block. It is named for what it
      removes.
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    reports: overall plus the same frozen degree strata, which are not refitted
    projected_cost:
      basis: >-
        Measured from D1: 217.8 s and 209.5 s for two arms that each built their
        own context. D2 builds one context for both arms and CAND is the cheaper
        one (p95 3.9 ms vs TARGET_H1's 9.6 ms), so it is bounded by D1's own
        elapsed rather than estimated upward from it.
      gpu_hours_ceiling: 0.20
      cost_ceiling_usd: 0.90
      wall_time_ceiling_minutes: 12
      expected_actual_usd: 0.10
    interpretation_fixed_in_advance:
      D2_A: >-
        FULL_CAND > NO_QUERY_LOCAL. The useful structural signal is the
        query-filtered structure already inside G[Cq]. Redirects QLS-v2 to better
        statistics on G[Cq] -- distinct seed support, seed geometry, path
        diversity, bounded diffusion, robust normalisation, provenance separation
        -- rather than expanding global context.
      D2_B: >-
        FULL_CAND ~= NO_QUERY_LOCAL. QLS-v1's gains may come primarily from the
        semantic and retrieval components. In that case do NOT begin the R0-R5
        structural frontier; first audit where QLS-v1's historical gain comes
        from.
    outcome: >-
      SEED-ANCHORED LOCAL BLOCK MATTERS. Reading D2-A. Zeroing the ten query-local
      columns costs -20.82 R@5, -16.07 R@20, -8.92 MRR and -2.48 R@1 on 2Wiki
      validation at seed 0. The block is load-bearing in QLS-v1 by a wide margin.
      Deliberately NOT stated as "structural block matters": zeroing removes seed
      identity, seed geometry and graph-derived structure simultaneously, and D2
      cannot attribute the loss among them. D3 measures that attribution.
    outcome_must_not_be_broadened_to: >-
      "graph structure is worth twenty points". All ten columns are seed-anchored and
      sa_mlp has no other seed input -- no reciprocal-rank features, no separate seed
      indicator -- so NO_QUERY_LOCAL cannot tell which candidates the retriever
      returned. Against the frozen ladder (seed_only, one binary membership column,
      65.83 R@5) roughly 18.8 of the 20.8 points is bare seed membership and about
      2.57 is everything the structural statistics add on top. That split is
      INFERENCE across two splits and two stages, not a measurement.
    control: >-
      FULL_CAND reproduced D1's CAND bit-identically on all five metrics (29.033 /
      67.883 / 77.525 / 79.2816 / 51.933) and on every recorded digit of the
      per-epoch train loss. Third independent container to do so.
    stratified: >-
      The block's value falls as candidate-induced evidence rises. R@5 delta runs
      -22.84 isolated, -23.03 degree_1, -19.03 low_degree, -14.90 ordinary; on
      ordinary, removing the block IMPROVES R@1 by 3.54 and leaves MRR flat. Strata
      were not refitted (boundaries_fitted_here false).
    convergence_caveat: >-
      Both arms select epoch 3 of 3, the boundary, and both are still descending.
      Three epochs is the frozen QLS-v1 budget and running it is what makes FULL_CAND
      reproduce CAND, but this is not a converged measurement, and the D0b lesson
      applies to the stratified reading in particular.
    reconciles_with_d0c: >-
      D0c's linear CAND - RETRIEVAL_ONLY was mild (-2.21 R@1, +0.96 R@5) because the
      linear model keeps two reciprocal-rank features and so still knows what was
      retrieved. The nonlinear model does not. The stages ablate different amounts of
      seed information; they are not in tension.
    actual_cost:
      accounted_seconds: 88.1
      note: >-
        Container total was not captured by the spawn path. Wall clock from launch to
        COMPLETE was under ten minutes, so under $0.29 at $1.734/h against $0.90
        authorised.
    does_not_authorise: [second dataset, second seed, GNN, R0-R5 sweep, LODO, E2]

  D1:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D0C_D1_RESULTS.md
    outcome: >-
      NULL. TARGET_H1 vs CAND at QLS-v1 is null overall (R@5 67.88 -> 67.97, R@1
      -0.05, R@20 -0.03, MRR +0.09) and null in every pre-registered stratum. The
      largest per-stratum move is +0.83 R@1 on degree_1; the largest anywhere is
      -1.01 R@20 on ordinary, which is 198 queries. On the isolated stratum, the
      27.8% of queries this line was aimed at, the ranker gains nothing: -0.48
      R@1, -0.06 R@5. TARGET_H1 does not enter QLS-v2 as a context.
    preregistered_hypothesis_result: >-
      NOT SUPPORTED. context_value_falls_as_evidence_rises predicted the
      TARGET_H1 - CAND benefit would decrease across induced-degree strata
      0 / 1 / 2-4 / 5+. non_increasing holds for R@20 alone, across deltas that
      are all inside a point, and fails for R@1, R@5 and MRR. The strata were
      frozen before the run and boundaries_fitted_here is false in the result.
    reproduction: >-
      D1 ran twice -- once as declared, once more after the stratified reporting
      was added, since the first run emitted only overall numbers. Both runs, in
      separate containers, returned bit-identical validation metrics for both
      arms on all four measures. The second run changed reporting only: same
      seed, same holdout, same selection rule, validation still read once per arm
      within a run.
    actual_cost:
      runs: 2
      elapsed_seconds: 427.3
      gpu_hours: 0.119
      container_usd: 0.206
      gpu_hours_authorised: 1.0
      cost_authorised_usd: 2.50
    status_before: DECLARED
    declaration: docs/COMPUTE_LEDGER.md
    runner: scripts/run_graph_context_d1.py
    dataset: 2wiki_clean
    arms: [CAND, TARGET_H1]
    seeds: 1
    seed: 0
    model: sa_mlp
    what: >-
      First effectiveness pilot: 2wiki only, CAND vs TARGET_H1, one seed, same
      frozen ranker architecture and feature schema in both arms, bit-identical
      Cq, train for fitting and validation for reporting. The test split is not
      read and the runner refuses it.
    metrics: [recall_at_1, recall_at_5, recall_at_20, mrr]
    normalisation: candidate_readout
    scoring_domain: Cq
    normalisation_domain: Cq
    bridge_feature: >-
      Not used. D1 is a context-only comparison; adding a schema change to a
      context change would leave a positive result unattributable to either.
    epoch_selection: >-
      A deterministic tail of the training split, never validation. The frozen
      _fit selects a checkpoint on whatever it is handed and the frozen protocol
      then reports on test; D1 has no test split, so the reporting split is read
      exactly once per arm and the selection set is carved out of train.
    prerequisite:
      what: >-
        The active workspace holds this dataset topology-only. QLS-v1 scores from
        node and query embeddings, so D1 cannot run until they are replicated.
        Every graph-context stage before D1 opened the dataset with
        require_embeddings=False, which is why nothing caught this earlier.
      files:
        - {path: nodes.npy, megabytes: 385.9}
        - {path: queries_all.npy, megabytes: 87.9}
      required_megabytes: 473.8
      optional:
        path: derived/fixed_structural_features_v1/
        megabytes: 104.7
        buys: >-
          The sealed-cache alignment check that D0b had to skip. Without it the
          rebuilt static block is corroborated only by CAND reproducing A3's
          frozen validation R@5, which is agreement rather than identity.
      source_workspace: deepalimohapatra1973
      target_workspace: pilgnnteam
      is_a_workspace_migration: false
      status: SATISFIED
      executed:
        slice: embeddings_only
        files_copied: 2
        megabytes: 473.8
        optional_derived_copied: false
        optional_derived_reason: >-
          D1 performs no correctness check that requires it. The CAND arm's agreement
          with A3 is already established by D0b at the same static parameters, and
          D1's own equivalence claim is the candidate-readout identity, checked
          in-process against the context normalisation rather than against a cache.
          The approval was for the required payload only.
        verification:
          before_transfer: source byte size and sha256 recorded per file
          after_transfer: target byte size and sha256 re-read and compared
          shape_dtype: >-
            nodes.npy (65865, 1536) float32 and queries_all.npy (15000, 1536)
            float32, both finite on the read head. Checked on the staged bytes; the
            target carries the same sha256, so it is the same header.
          mismatches: 0
        files_verified:
          - path: operator_data/2wiki_clean/6e4ac5ee0e1355ad/nodes.npy
            bytes: 404674688
            sha256: 14b5186dc6d5395e1096220abdae5ff8a416e724a2d4366f2a0d43559572535b
          - path: operator_data/2wiki_clean/6e4ac5ee0e1355ad/queries_all.npy
            bytes: 92160128
            sha256: 769fcb7a139058722b4c21178cb5d6be6092d0840244a1793e87c271ea75b646
    projected_cost:
      basis: >-
        Measured, not modelled. Per-query context latency and the static rebuild
        come from the completed D0b run on this exact dataset and image; the
        training term is the frozen sa_mlp confirmation's measured 21.4 s/seed
        on 2wiki.
      feature_build_seconds: 350
      static_rebuild_seconds: 3
      training_seconds: 50
      scoring_seconds: 20
      embedding_load_seconds: 90
      # The ceilings are the launcher gate's own projection rounded up, not the
      # estimate above: 600 s load + 15,000 x 35 ms + 120 s training = 1,245 s,
      # which the gate reports as 0.35 container-hours at $1.734/h for A10G with
      # 8 cores and 32 GB, divided by the standing assumption that useful work is
      # 40% of billed time -- $1.50. A declaration under what the gate projects
      # would block its own launch, which is how D0b's first ceiling was wrong.
      gpu_hours_ceiling: 0.35
      cost_ceiling_usd: 1.60
      wall_time_ceiling_minutes: 25
    resolved_confound:
      was: >-
        Six of the ten frozen QLS-v1 descriptor columns are normalised by a
        per-query maximum over the local node space, and that space is what
        differs between the arms, so a positive result could not on its own be
        attributed to restored structure rather than to a moved normaliser.
      fix: >-
        Candidate-readout normalisation. The kernel still computes over the
        arm's context, but the normalising maximum is taken over the scored
        candidates, so no candidate is rescaled by a node nobody scores. Under
        CAND the two domains coincide and the arm is bit-identical to the
        historical one, which is proven rather than asserted in
        tests/test_candidate_readout.py.
      residual: >-
        Column 8 (personalised PageRank) is degree-coupled through its
        rank[s]/out_degree[s] readout, so no normaliser can make it invariant to
        the context. Recorded rather than hidden; the remaining five normalised
        columns are invariant.
      confound_free_channel: >-
        Columns 0-3 are the unnormalised one-hot seed-distance bucket and do
        separate these two arms (an isolated candidate sits at >=3 under CAND and
        can sit at 1 or 2 under TARGET_H1), so they are reported per arm, over
        all candidates and over the golds, beside the metrics.
    what_d0b_already_showed: >-
      D0b ran this same contrast through a linear ranker rather than QLS-v1 and
      found it near-flat overall (validation R@5 67.82 vs 67.83) but strongly
      stratified: on the isolated stratum TARGET_H1 gained +3.06 R@1 and +4.44
      MRR, while on low_degree it lost -2.51 R@1. D1 is still worth running --
      a 19-parameter linear map cannot use structure the way a 205k-parameter
      ranker can, and the stratified split is a hypothesis about QLS-v1, not a
      measurement of it.
    kill_gate: >-
      If TARGET_H1 <= CAND on validation R@k and MRR: DO NOT SCALE. Record that
      substantial graph structure was removed historically and that restoring it
      in this form did not improve ranking. Only on a positive result may the
      two-dataset Stage E declaration be PREPARED -- hotpotqa_clean for severe
      truncation, musique_clean as the semantic-dominant control, both chosen
      before outcomes, one seed each. Preparing is not launching.

advancement:
  rule: >-
    An arm advances only if it materially restores structure WHERE Phase -1
    found loss -- recovery and seed-distance improvement concentrated on
    formerly isolated and low-degree candidates -- AND its projected serving
    cost is plausible. More reach is not
    better; the whole corpus is reachable in three hops on every dataset.
  kill: >-
    Strictly Pareto-dominated on (p95 construction latency, structural recovery)
    means killed, recorded, and not trained.

aggregation:
  query_selection: deterministic_prefix_of_the_split_order
  never_sampled: true
  cap_is_recorded: true

reporting:
  splits: [validation]
  note: >-
    Validation only. The test split is not read during a phase whose output
    influences a design decision.

