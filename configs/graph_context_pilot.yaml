        slice: embeddings_only
        files_copied: 2
        megabytes: 473.8
        optional_derived_copied: false
        optional_derived_reason: >-
          D1 performs no correctness check that requires it. The CAND arm's agreement
          with A3 is already established by D0b at the same static parameters, and
          D1's own equivalence claim is the candidate-readout identity, checked
          in-process against the context normalisation rather than against a cache.
          The approval was for the required payload only.
        verification:
          before_transfer: source byte size and sha256 recorded per file
          after_transfer: target byte size and sha256 re-read and compared
          shape_dtype: >-
            nodes.npy (65865, 1536) float32 and queries_all.npy (15000, 1536)
            float32, both finite on the read head. Checked on the staged bytes; the
            target carries the same sha256, so it is the same header.
          mismatches: 0
        files_verified:
          - path: operator_data/2wiki_clean/6e4ac5ee0e1355ad/nodes.npy
            bytes: 404674688
            sha256: 14b5186dc6d5395e1096220abdae5ff8a416e724a2d4366f2a0d43559572535b
          - path: operator_data/2wiki_clean/6e4ac5ee0e1355ad/queries_all.npy
            bytes: 92160128
            sha256: 769fcb7a139058722b4c21178cb5d6be6092d0840244a1793e87c271ea75b646
    projected_cost:
      basis: >-
        Measured, not modelled. Per-query context latency and the static rebuild
        come from the completed D0b run on this exact dataset and image; the
        training term is the frozen sa_mlp confirmation's measured 21.4 s/seed
        on 2wiki.
      feature_build_seconds: 350
      static_rebuild_seconds: 3
      training_seconds: 50
      scoring_seconds: 20
      embedding_load_seconds: 90
      # The ceilings are the launcher gate's own projection rounded up, not the
      # estimate above: 600 s load + 15,000 x 35 ms + 120 s training = 1,245 s,
      # which the gate reports as 0.35 container-hours at $1.734/h for A10G with
      # 8 cores and 32 GB, divided by the standing assumption that useful work is
      # 40% of billed time -- $1.50. A declaration under what the gate projects
      # would block its own launch, which is how D0b's first ceiling was wrong.
      gpu_hours_ceiling: 0.35
      cost_ceiling_usd: 1.60
      wall_time_ceiling_minutes: 25
    resolved_confound:
      was: >-
        Six of the ten frozen QLS-v1 descriptor columns are normalised by a
        per-query maximum over the local node space, and that space is what
        differs between the arms, so a positive result could not on its own be
        attributed to restored structure rather than to a moved normaliser.
      fix: >-
        Candidate-readout normalisation. The kernel still computes over the
        arm's context, but the normalising maximum is taken over the scored
        candidates, so no candidate is rescaled by a node nobody scores. Under
        CAND the two domains coincide and the arm is bit-identical to the
        historical one, which is proven rather than asserted in
        tests/test_candidate_readout.py.
      residual: >-
        Column 8 (personalised PageRank) is degree-coupled through its
        rank[s]/out_degree[s] readout, so no normaliser can make it invariant to
        the context. Recorded rather than hidden; the remaining five normalised
        columns are invariant.
      confound_free_channel: >-
        Columns 0-3 are the unnormalised one-hot seed-distance bucket and do
        separate these two arms (an isolated candidate sits at >=3 under CAND and
        can sit at 1 or 2 under TARGET_H1), so they are reported per arm, over
        all candidates and over the golds, beside the metrics.
    what_d0b_already_showed: >-
      D0b ran this same contrast through a linear ranker rather than QLS-v1 and
      found it near-flat overall (validation R@5 67.82 vs 67.83) but strongly
      stratified: on the isolated stratum TARGET_H1 gained +3.06 R@1 and +4.44
      MRR, while on low_degree it lost -2.51 R@1. D1 is still worth running --
      a 19-parameter linear map cannot use structure the way a 205k-parameter
      ranker can, and the stratified split is a hypothesis about QLS-v1, not a
      measurement of it.
    kill_gate: >-
      If TARGET_H1 <= CAND on validation R@k and MRR: DO NOT SCALE. Record that
      substantial graph structure was removed historically and that restoring it
      in this form did not improve ranking. Only on a positive result may the
      two-dataset Stage E declaration be PREPARED -- hotpotqa_clean for severe
      truncation, musique_clean as the semantic-dominant control, both chosen
      before outcomes, one seed each. Preparing is not launching.

advancement:
  rule: >-
    An arm advances only if it materially restores structure WHERE Phase -1
    found loss -- recovery and seed-distance improvement concentrated on
    formerly isolated and low-degree candidates -- AND its projected serving
    cost is plausible. More reach is not
    better; the whole corpus is reachable in three hops on every dataset.
  kill: >-
    Strictly Pareto-dominated on (p95 construction latency, structural recovery)
    means killed, recorded, and not trained.

aggregation:
  query_selection: deterministic_prefix_of_the_split_order
  never_sampled: true
  cap_is_recorded: true

reporting:
  splits: [validation]
  note: >-
    Validation only. The test split is not read during a phase whose output
    influences a design decision.

