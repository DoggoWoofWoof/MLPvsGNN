    tensor_invariants:
      distance: arm[:,0:4] == D6_BASE_13[:,0:4]
      prior: "arm[:,10:13] == the exact D6/D5/D4 graded retrieval prior"
      support: arm[:,4] == D6_FULL_13[:,4]
      paths: "arm[:,5:8] == D6_FULL_13[:,5:8]"
      diffusion: arm[:,8] == D6_FULL_13[:,8]
      neighbourhood: arm[:,9] == D6_FULL_13[:,9]
      every_other_residual_column: exactly zero
