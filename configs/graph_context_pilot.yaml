    execution_order:
      1: amend the D9 status wording -- DONE before this block was written
      2: file this corrected systems rule -- this block
      3: reuse the D9 feature artifact if trustworthy -- NONE EXISTS, recompute
      4: verify every reuse and tensor guard listed above
      5: train exactly one V arm
      6: report B, H and V on the three increments and five metrics
