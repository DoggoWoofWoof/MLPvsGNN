experiment: graph_context_pilot
status: STAGES_A_B_C_COMPLETE_TARGET_H1_RECOMMENDED
phase: "P1"
protocol: docs/COMPUTE_LEDGER.md
results: docs/GRAPH_CONTEXT_PILOT_RESULTS.md

question: >-
  Phase -1 measured what the candidate-induced graph G[Cq] destroys. This asks
  what each replacement context recovers, on real validation queries, without
  training anything. The deliverable is the smallest defensible context that
  repairs the measured loss without turning a query into a whole-graph
  computation.

frozen_conclusions:
  # The exact wording the evidence supports, recorded so that later work quotes
  # this rather than a remembered, wider version of it.
  d1_result:
    statement: >-
      On 2Wiki validation, seed 0, replacing the historical candidate-induced
      graph with TARGET_H1 while keeping the QLS-v1 architecture, scoring pool,
      feature schema, optimisation and candidate-readout normalisation fixed
      produced no meaningful ranking improvement.
    measured_target_h1_minus_cand_pp:
      overall: {recall@1: -0.05, recall@5: +0.08, recall@20: -0.03, mrr: +0.09}
      and: no preregistered degree stratum shows a meaningful effect
    established:
      - structural information was genuinely removed by candidate induction
      - simply restoring TARGET_H1 does not improve QLS-v1 on the strongest
        initial 2Wiki test
    must_not_be_broadened_to:
      - global graph context is useless
      - structural context is useless
      - TARGET_H1 can never help QLS-v2
      - graph starvation was irrelevant
    why: >-
      None of those is established. One dataset, one seed, one context
      definition, one representation.

  connectivity_gating:
    status: KILLED FOR NOW
    evidence:
      - SELECTIVE_SUBSTITUTE < CAND
      - SELECTIVE_MASK << CAND
      - BOTH ~= CAND
      - >-
        the converged exploratory TARGET_H1 - CAND stratification moves in the
        opposite direction to the original hypothesis
    do_not_pursue:
      - learned gate
      - hard degree threshold
      - degree-conditioned restored-context routing
    do_not_spend_an_experiment_on: nearby thresholds
    reopen_only_on: materially new evidence

  bridge_support:
    status: KILLED AT D0b
    why: >-
      The strong univariate AUC did not translate into incremental ranking value
      once the restored-context descriptors were available.
    do_not_resurrect_because: its mechanism is interpretable

  paused_branches:
    status: DO NOT RUN WITHOUT NEW EVIDENCE
    branches:
      - TARGET_H1 development
      - TARGET_H2
      - SEED_H2
      - PATH
      - BRIDGE
      - global-context feature engineering
      - graph-context gating
    reopen_only_if: D2 or later QLS-v2 evidence specifically requires it

  topological_completeness_is_not_retrieval_usefulness:
    status: HYPOTHESIS
    phase_minus_1_established: >-
      graph starvation is real; candidate induction cuts 70-90% of boundary
      edges and destroys large fractions of 2-hop paths
    d1_adds: the missing graph is not automatically useful ranking information
    together: >-
      topological completeness is not the same as retrieval usefulness.
      Literature-motivated neighbourhood restoration makes the graph more
      topologically complete, but on the first controlled effectiveness
      experiment that additional topology provides no ranking benefit. The
      likely reason is that Cq is itself query-conditioned, so candidate
      induction is also a semantic filtering operation -- retrieval graphs may
      differ from generic node-classification and link-prediction settings for
      that reason. HYPOTHESIS until broader evidence.
    not_concluded: >-
      that the historical construction was simply wrong because papers use local
      neighbourhoods.

working_hypotheses:
  # Recorded before D0c and D1 report, so that neither can be read as having
  # confirmed a frame it was designed under. These are hypotheses. None of them
  # is a finding, and none may be cited as one.
  candidate_induction_is_not_only_damage:
    status: HYPOTHESIS
    recorded: 2026-09-02, before D0c and D1 reported
    what_changed: >-
      Phase -1 and D0 treated G[Cq] as a lesion: a one-hop deletion that removes
      legitimate structure and manufactures isolates. D0b's stratified split is
      consistent with that on the isolated stratum and inconsistent with it
      everywhere else, where restoring the deleted context made top-of-list
      ranking worse rather than better.
    damage: >-
      Vertex induction removes legitimate structural context and creates
      isolates. On 2wiki validation, 27.8% of queries have a gold with no in-pool
      neighbour. MEASURED.
    filter: >-
      Vertex induction is also a query-specific semantic filter. Cq comes from
      retrieval, so G[Cq] keeps the edges between things already judged relevant
      and drops generic hub connectivity. Widening the context restores the hubs
      along with the evidence. HYPOTHESIS.
    consequence_for_qls_v2: >-
      The design target is the minimum sufficient selectively-restored structure,
      not maximum graph restoration. This changes what a good result looks like:
      an arm that restores more context and ranks no better is not a failed
      repair, it may be a repair that also undid a filter.
    not_claimed:
      - TARGET_H1 is universally better than CAND. Not shown.
      - Global graph restoration improves ranking overall. Not shown; the overall
        effect measured at D0b is null at the linear level (R@5 67.82 -> 67.83).
    what_would_falsify_it: >-
      A context that restores structure without suppressing the query-specific
      bias -- for instance one that is uniformly better across every degree
      stratum -- would mean the dilution has some other cause and the filter
      reading is unnecessary.

  context_value_falls_as_evidence_rises:
    status: HYPOTHESIS
    recorded: 2026-09-02, before D1 ran
    statement: >-
      The value of restored context decreases as usable candidate-induced
      structural evidence increases. Where G[Cq] already describes a candidate,
      widening the context adds mostly noise; where G[Cq] says nothing, it adds
      the only evidence there is.
    tested_by: D1, and separately and non-confirmatorily by D0c
    strata_fixed_in_advance: [0, 1, 2-4, 5+]
    strata_definition: >-
      Undirected distinct non-self degree of the candidate inside G[Cq]; the same
      DEGREE_BUCKETS the D0b runner used, which is why the boundaries are not a
      choice made for D1.
    strata_may_be_changed_after_reading_d1: false
    read_on: the TARGET_H1 - CAND delta per stratum, for R@1, R@5, R@20 and MRR

contract:
  read_only: true
  models_trained: false
  gpu_used: false
  scored_nodes: exactly_Cq_in_every_arm
  candidate_pools_modified: false
  candidate_pools_expanded: false
  candidate_ceiling_changed: false
  gold_ids_used_in_context_construction: false
  gold_labels_used: false
  test_split_read: false
  package_f_accessed: false
  e2_touched: false
  crag_modified: false
  invented_edges: false
  qls_kernel: the_shipped_structural_features_kernel_not_a_reimplementation

definitions:
  Cq: the frozen Dense/SPLADE candidate set -- the scoring universe
  Sq: >-
    the frozen retrieval seeds. A SUBSET of Cq by construction of the artifact
    (seed_global = pool[seed_local]), so Cq union Sq == Cq. VERIFIED FROM CODE.
    The seed arms differ from the target arms only in what they expand from.
    Sq is much smaller than Cq: MEASURED at Stage C, SEED_H1 adds 9-56% more
    nodes at the median where TARGET_H1 adds 470-1977%, on a median Cq of
    316-364 candidates. The seeds-per-query count itself is not recorded by
    the pilot result files and is NOT asserted here.
  Uq: the context -- nodes allowed to contribute structural information
  invariant: Cq is a subset of Uq, therefore |Uq| >= |Cq|
  total_context_ratio: "|Uq| / |Cq|, bounded below by 1"
  added_context_ratio: "(|Uq| - |Cq|) / |Cq|, bounded below by 0"
  never_interchange: >-
    Reading one ratio as the other once understated a 472k-node context as
    "0.2x the pool". They are reported as separate fields.

arms:
  CAND:
    definition: "Uq = Cq"
    role: historical control, must stay bit-exact with the frozen construction
  SEED_H1:
    definition: "Uq = Cq union N1_out(Sq)"
    role: cheap control; expected to add little because Sq is small and inside Cq
  TARGET_H1:
    definition: "Uq = Cq union N1_in(Cq)"
    role: >-
      directly repairs the one-hop deletion Phase -1 measured (median rho_1
      0.077-0.250). In-neighbours, not out: every frozen operator flows
      source_to_target, so this is what a one-layer GNN actually lost.
  SEED_H2:
    definition: "Uq = Cq union N<=2_out(Sq)"
    role: >-
      structural-information control. Expected to advance on recovery and fail
      on cost: 60-65% of the corpus graph on 2wiki and hotpotqa.
  PATH_H2:
    definition: "Uq = Cq union {v not in Cq : exists s in Sq, c in Cq, s->v->c, s != c}"
    role: literature-inspired enclosing arm, seed-anchored
  BRIDGE_H2:
    definition: "Uq = Cq union {v not in Cq : exists c1,c2 in Cq, c1->v->c2, c1 != c2}"
    role: literature-inspired enclosing arm, candidate-anchored

distinctness_rule:
  status: VERIFIED_FROM_CODE_AND_DATA
  why: >-
    Five of the six sealed graphs are reachability-symmetric -- 2wiki stores
    855,146 edges as 521,614 distinct pairs with every reverse present. A path
    rule asking only "reachable from a seed AND has an edge into Cq" is then
    satisfied through the seed itself, because Sq is inside Cq. The first
    version did exactly that and returned a set identical to SEED_H1 on all 25
    smoke queries. The arms therefore require two DISTINCT candidate endpoints.
  deduplicated_view_because: >-
    34.1%-53.6% of stored messages are duplicates, and hotpotqa's sealed graph
    additionally stores 538.14 self-loops per query -- the only one of the 24
    audited graph-splits that carries any. Both are removed before a path is
    counted, so a duplicate edge cannot pose as a second endpoint and a
    self-loop cannot pose as a bridge.

lattice:
  order:
    - "CAND <= PATH_H2 <= SEED_H1 <= SEED_H2"
    - "CAND <= PATH_H2 <= BRIDGE_H2 <= TARGET_H1"
  enforced_in: tests/test_graph_context.py

excluded_before_any_compute:
  rule: >-
    Killed on Phase -1's already-measured corpus share, at zero pilot cost. A
    per-query context of 472k nodes has no serving story, and calling it
    "bounded local context" would be false.
  SEED_H3: 33.0%-99.7% of the corpus graph
  TARGET_H2: 17.9%-93.2% of the corpus graph
  TARGET_H3: 72.5%-100.0% of the corpus graph

retention_convention:
  status: VERIFIED_FROM_CODE
  source: src/mp_retrieval/graph_substrate.py::retention_summary
  rule: >-
    rho(v) = stored non-self out-messages of v landing in Uq, over stored
    non-self out-messages of v. Stored multiplicity is kept on both sides;
    stored self-loops are removed from both. This is the Phase -1 convention
    exactly, so the CAND arm has to reproduce the audited rho_1 rather than
    merely resemble it -- pinned in tests/test_graph_context.py.
  why_it_matters: >-
    Leaving self-loops in the denominator would have understated hotpotqa's
    retention by roughly a third, on the one dataset that has any, and hotpotqa
    holds the lowest measured median retention.

descriptor_saturation:
  status: STRUCTURAL_IDENTITY_VERIFIED_ON_480_COMPARISONS
  claim: >-
    No context wider than SEED_H1 can move a distance bucket of the frozen
    QLS-v1 descriptor, and none can change a candidate's raw seed-incidence
    count, on any graph.
  proof: >-
    Columns 0-3 are one-hot over {0, 1, 2, >=3-or-unreachable}. A candidate
    reaches bucket 2 exactly when some path seed -> x -> candidate exists with
    at most one intermediate, and every such x is an out-neighbour of a seed,
    which is precisely what SEED_H1 already admits. Column 4 counts edges
    incident to a seed; Sq is inside Cq, so every seed-candidate edge is already
    present in G[Cq] and widening cannot add one.
  evidence: >-
    480 arm comparisons over 120 random graphs, symmetric and directed: zero
    bucket movements and zero raw-count changes above SEED_H1. Column 4's
    normalised value nonetheless differed on 17 of them, which is the rescaling
    confound, not restored structure. Reproduced on the real 2wiki CSR with hub
    pools: all six arms returned byte-identical buckets, SEED_H1 at 166 context
    nodes against TARGET_H1 at 40,653.
  consequence: >-
    distance_bucket_changed was declared the primary movement signal before this
    was known. It is provably constant above SEED_H1, so it cannot rank the arms
    and is demoted to a reported diagnostic. This re-specifies a measurement
    before it is taken; no arm, threshold or spend changes.

measurements:
  size: [context_nodes, added_nodes, total_ratio, added_ratio, graph_share, context_edges]
  recovery: [retention_mean, retention_median, boundary_cut, isolated_fraction]
  reach:
    primary: distance_improved
    primary_rationale: >-
      Seed distance recomputed through the arm's own context, uncapped to four
      hops and divided by nothing. Both defects of the frozen descriptor are
      absent: it is not saturated at two hops, so it separates arms that the
      one-hot bucket lumps together, and it has no per-query normaliser, so a
      candidate's value moves only when its own topology did.
      distance_improved is the fraction of candidates strictly closer to a seed
      than the historical substrate G[Cq] made them.
    secondary: [seed_reach_at_1, seed_reach_at_2, seed_reach_at_3, seed_reach_at_4, seed_unreachable]
    censored: >-
      seed_distance_mean admits unreachable candidates at the sentinel
      SEED_DISTANCE_HOPS + 1 and is read beside seed_unreachable, never alone.
    stratified_by: prior_induced_degree
    strata: [isolated, degree_1, low_degree, ordinary]
    max_hops: 4
    cost: >-
      Diagnostic only. Nothing at serving time computes seed distance, so its
      latency is reported separately and excluded from total_ms and from the
      Pareto axis.
  movement:
    status: REPORTED_NOT_RELIED_ON
    reason: see descriptor_saturation
    reported: [distance_bucket_changed, any_column_changed]
    stratified_by: prior_induced_degree
    strata: [isolated, degree_1, low_degree, ordinary]
  systems: [build_ms, feature_ms, total_ms]
  distributions: [median, p90, p95, p99, max, mean]

stage_b_outcome:
  status: MEASURED
  queries: 25 per dataset, validation, none skipped for want of seeds
  datasets: [2wiki_clean, hotpotqa_clean]
  killed:
    PATH_H2: >-
      Structurally dominated by SEED_H1, not narrowly beaten by it. PATH_H2 is a
      SUBSET of SEED_H1 by the lattice, it recovered the same structure to three
      decimal places (2wiki 0.2938 against 0.2941, hotpotqa 0.3104 against
      0.3104), and it cost 6.2x and 2.8x as much to build (p95 8.7 ms against
      1.4, 204.4 ms against 73.5) because identifying a path node needs a
      second matrix step. More queries cannot reverse a subset relation.
    BRIDGE_H2: >-
      Same shape one level up: a SUBSET of TARGET_H1 that costs more to build.
      Recovered 0.594 and 0.708 median retention against TARGET_H1's 1.000, at
      p95 5.1 ms against 1.9 and 199.5 ms against 74.0. Dominated on both axes
      on both datasets.
    SEED_H2: >-
      Dominated on both axes, which is worse than the declaration predicted.
      The filed hypothesis was that it would advance on information and fail on
      cost; it failed on both, recovering 0.811 and 0.950 against TARGET_H1's
      1.000 while holding 60.2% and 52.9% of the corpus graph and costing 74.4
      and 2119.4 ms per query at the median.
  surviving:
    CAND: >-
      The historical control, on the frontier only because it is free. It is not
      a candidate for advancement; it is what the other arms are measured against.
    SEED_H1: >-
      On the frontier by a margin of half a millisecond on both datasets, at a
      third of TARGET_H1's recovery. Carried because the preregistered rule
      kills only dominated arms and this one is not dominated -- not because it
      looks promising.
    TARGET_H1: >-
      Recovers the radius-1 deletion completely -- retention 1.000, boundary cut
      0.000, isolated fraction 0.000 -- at 3.1% and 0.6% of the corpus graph and
      p95 1.9 ms and 74.0 ms to build. Completeness is an IDENTITY on a
      reachability-symmetric graph rather than a discovery: if every stored edge
      carries its reverse, every out-neighbour of a candidate is an in-neighbour
      of a candidate and so already inside Cq u N1_in(Cq). What the pilot
      measures is that the sealed graphs behave that way at radius 1, and at
      what cost.
  saturation_confirmed_at_scale: >-
    Predicted before the run and observed exactly: reach<=1 is identical across
    all six arms including CAND (2wiki 0.0580, hotpotqa 0.1008), because Sq is
    inside Cq so every seed-candidate edge is already in G[Cq]; and reach<=2 is
    identical across all five non-CAND arms (0.7630, 0.9040), because reaching
    distance 2 needs one intermediate and every such node is in SEED_H1. The
    arms separate only at distance 3 and beyond -- exactly the range the frozen
    descriptor collapses into a single class.

stage_c_outcome:
  status: MEASURED
  queries: 300 per dataset, validation, none skipped for want of seeds
  datasets: all_six
  arms: [CAND, SEED_H1, TARGET_H1]
  results: docs/GRAPH_CONTEXT_PILOT_RESULTS.md
  recommended_arm: TARGET_H1
  frontier_verdict: >-
    All three arms survive. SEED_H1 is dominated by TARGET_H1 on hotpotqa and
    webqsp only, and the preregistered rule kills only an arm dominated on
    every measured dataset. It is carried as an ablation, not a recommendation.
  recovery: >-
    TARGET_H1 restores median radius-1 retention to 1.0000 and the isolated
    fraction to 0.0000 on all six datasets. Boundary cut is 0.0000 on five and
    0.0015 on hotpotqa -- the one dataset the substrate audit measured as not
    reachability-symmetric, so the exception falls exactly where direction
    matters. CAND reproduces Phase -1's starvation on real queries: retention
    0.0908-0.3170, boundary cut 0.7000-0.9173, isolated 17.1%-36.8%.
  advancement_criterion_met: >-
    Required the seed-distance improvement to stay concentrated on formerly
    isolated and low-degree candidates rather than flattening across strata.
    Met on 6/6: TARGET_H1's improvement is monotone decreasing in prior induced
    degree on every dataset, helping 87.3%-99.4% of formerly isolated
    candidates against 14.0%-53.1% of degree-5+ ones.
  cost: >-
    TARGET_H1 total p95 8.7-170.1 ms per query, p99 9.8-205.9 ms, on the frozen
    QLS-v1 kernel. Context construction is the cheap half everywhere; the
    descriptor kernel dominates and scales with context nodes, not corpus size.
  size_qualification: >-
    REQUIRED WHENEVER THE CONTEXT SIZE IS QUOTED. TARGET_H1 is bounded in
    ABSOLUTE NODE COUNT -- median 2,012-7,520 and p95 at most 12,039 across
    corpora spanning 13.7k to 781k nodes -- and NOT in share of the graph. On
    the small corpora the median context is 16.4% (musique), 18.7% (metaqa) and
    30.2% (squad) of the whole graph, reaching 50.2% on one squad query. That is
    a consequence of a fixed-size candidate pool on a small corpus, not of an
    expansive rule, but "bounded local context" is false on those three without
    the qualification stated beside it.
  open_tail: >-
    hotpotqa's TARGET_H1 context reaches 142,073 nodes on one query in 300,
    against a p95 of 7,509 and a p99 of 21,778. Reported, not handled. Any
    serving story needs a cap.
  not_established: >-
    No effectiveness claim: nothing was trained. No QLS-v2 versus GNN
    comparison. Validation split only. PATH_H2, BRIDGE_H2 and SEED_H2 were
    killed on Stage B's two datasets and never run on the other four -- the
    first two kills rest on subset relations and hold everywhere, SEED_H2's
    rests on a measurement of two datasets.

qls_v1_parameters:
  source: configs/sa_mlp_screen.yaml::query_local_features
  damping: 0.85
  ppr_iterations: 8
  note: the frozen values, so CAND reproduces the historical descriptor exactly

stages:
  A:
    status: PASSED
    what: synthetic correctness, 521 tests
    cost: seconds, local
  B:
    status: MEASURED
    queries: 25
    datasets: [2wiki_clean, hotpotqa_clean]
    what: >-
      real validation queries, all six arms, on the two datasets the ledger
      declared -- the pair where induction destroyed the most two-hop reach
      (2wiki 13.6% retained, hotpotqa 27.5%). Not all six: Stage B's job is to
      measure throughput and separate the arms, and the remaining four datasets
      would triple its cost without changing either answer. They arrive at C.
    declared_in: docs/COMPUTE_LEDGER.md
  C:
    status: MEASURED
    queries: 300
    datasets: all_six
    arms: [CAND, SEED_H1, TARGET_H1]
    what: survivors only
    cost: >-
      MEASURED 921 container-seconds across 6 concurrent CPU jobs = 0.26
      CPU-hours, about $0.16, against a declared ceiling of 3.25 CPU-hours and
      $5.15. Declared in the ledger after B returned, never before.
    results: docs/GRAPH_CONTEXT_PILOT_RESULTS.md
    rule: >-
      Do not consume all 300 if an arm clearly fails before then. Kill an arm at
      B if it does not lower isolation, does not bring candidates closer to a
      seed than G[Cq] did, or costs a fraction of the corpus that cannot be
      served. The second clause originally read "does not move distance
      buckets"; that test is provably vacuous above SEED_H1 -- see
      descriptor_saturation -- and was replaced before Stage B ran.

  D0:
    status: MEASURED
    results: docs/GRAPH_CONTEXT_D0_RESULTS.md
    queries: 300
    datasets: all_six
    arms: [CAND, TARGET_H1]
    what: >-
      Zero-training relevance diagnostic. Stage C established that TARGET_H1
      performs its intended repair; it did not establish that the repair is
      useful. D0 asks whether structural quantities computed under TARGET_H1
      separate relevant candidates from irrelevant ones better than the same
      quantities computed under CAND, on the Stage-C sample, using validation
      relevance labels for SCORING ONLY.
    features: [seed_distance, distinct_seed_support, two_hop_seed_support, bridge_support]
    statistic: >-
      Per-query rank AUC -- the pairwise win rate with ties at one half --
      reported beside the tie fraction, because a constant quantity also scores
      0.5 and "cannot discriminate" is not "is not defined here". A query with
      no positive or no negative candidate is unscorable and is counted, never
      imputed at 0.5.
    negative_control: >-
      distinct_seed_support is identical under both contexts by construction:
      Sq is inside Cq, so every seed-to-candidate edge already survives vertex
      induction on G[Cq]. It is carried to prove the harness cannot manufacture
      a difference where none exists.
    labels: >-
      Validation relevance labels, read AFTER the pool and seeds and never
      passed to context construction. Development evidence, not evaluation. The
      test split is not read; the runner refuses it.
    trains_nothing: true
    gpu: none
    kill_gate: >-
      If TARGET_H1's discrimination is no better than CAND's, and in particular
      if it is no better on the formerly isolated and low-degree strata where
      the repair lands, do not spend GPU on Stage D1 or on a new GNN. Record
      that substantial graph structure was removed historically and that
      restoring it in this form did not improve ranking.
    outcome: >-
      HALF MET, and the half that failed is recorded rather than reinterpreted.
      Overall, neither context dominates: bridge_support improves on 5/6
      datasets by 0.010-0.066 AUC while two_hop_seed_support degrades on 5/6 by
      up to 0.274 and seed_distance does not move. On the formerly isolated
      stratum the gate is met decisively -- CAND scores exactly 0.5000 there by
      identity, because all three support quantities are constant-zero for a
      candidate with no induced neighbour, and TARGET_H1 reaches 0.9513 (2wiki),
      0.9054 (musique) and 0.8749 (hotpotqa). On the low-degree stratum it is
      not met: bridge_support at degree 2-4 improves on 2 datasets and degrades
      on 4. The clause was written to rule out a gain confined to
      well-connected candidates; the observed failure is the opposite one.
    outcome_qualification: >-
      The isolated stratum is scorable only when a GOLD candidate was isolated,
      which happens in 20.0% of 2wiki queries, 10.3% of musique, 6.0% of
      hotpotqa, 1.5% of webqsp, 1.0% of squad and 0.0% of metaqa. squad and
      webqsp rest on three queries each and metaqa on none, so only 2wiki,
      musique and hotpotqa carry weight. The overall deltas are point estimates:
      the runner retained means and medians, not the paired per-query
      differences, so D0 cannot say whether an overall delta is outside noise.
      No D0 conclusion rests on the sign of one.

  D0B:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D0B_RESULTS.md
    outcome: >-
      bridge_support KILLED. Added to an arm that already holds the ten frozen
      local columns over TARGET_H1, it moves overall validation R@1 by +0.53
      points and R@20 by -0.10, and changes R@5 and R@20 by exactly zero on the
      isolated stratum it was built for. The D0 univariate AUC of 0.9513 does not
      survive as incremental ranking value. Section 5's separate later QLS-v2
      probe for this feature is therefore withdrawn rather than deferred: D0b was
      that probe. bridge_support standalone addition: KILLED AT D0b, not to be
      reintroduced except as a documented new hypothesis carrying its own
      declaration.
    secondary_outcome: >-
      CAND vs TARGET_H1 is null overall (validation R@5 67.82 vs 67.83) and
      strongly stratified: isolated +3.06 R@1 and +4.44 MRR on 834 of 3,000
      queries, low_degree -2.50 R@1. This is a prior for D1, not a measurement of
      QLS-v1.
    equivalence: >-
      The CAND arm reproduces A3 seed 0 -- identical validation R@5 and 19
      weights agreeing to 3.53e-05 -- through a static block rebuilt from
      graph.pt rather than the sealed cache, which corroborates the rebuild and
      candidate-readout normalisation at once.
    actual_cost:
      elapsed_seconds: 412.1
      container_usd: 0.073
      cost_ceiling_usd: 0.70
    runner: scripts/run_graph_context_d0b.py
    dataset: 2wiki_clean
    what: >-
      D0 scored each structural quantity on its own. This asks the multivariate
      question that decides whether bridge_support is worth a place in QLS-v2:
      does it still help once the ordinary retrieval and static graph features
      are present? CPU only, no GNN, no architecture search, no test split.
    arms:
      RETRIEVAL_ONLY: 2 rank + 7 static. A floor, not a candidate design.
      CAND: "+ the 10 frozen local columns over Cq. Reproduces A3's feature set."
      TARGET_H1: "+ the same 10 over Cq union N1_in(Cq)."
      TARGET_H1_BRIDGE: "+ log1p(bridge_support), candidate-normalised."
    learner: >-
      The frozen A3 linear control, unchanged: bias-free, weights initialised at
      zero, multi-positive listwise loss, AdamW, weight decay 0.0, gradient clip
      1.0, 3 epochs, 512-query batches, one seed. The learning rate is A3's
      selected value for this dataset, carried and not re-selected.
    seed: 0
    rrf_constant: 60
    splits: [train, validation]
    # The active workspace holds the topology-only slice of this dataset: graph,
    # candidates, seeds, golds and splits, but not the sealed derived/ caches.
    # The static block is a deterministic function of graph.pt, so it is rebuilt
    # through the shipped builder at the frozen parameters rather than
    # replicated -- the two then agree by construction, not by resemblance.
    static_features:
      source: configs/sa_mlp_screen.yaml::static_features
      pagerank_damping: 0.85
      pagerank_iterations: 30
      clustering_max_wedges_per_node: 64
    normalisation: candidate-readout in every arm
    epoch_selection: >-
      none. The final epoch is reported. A3 selects its epoch on validation and
      reports on test; D0b has no test split, so selecting and reporting on
      validation would be reading one number twice. The per-epoch trajectory is
      retained so a reader can check whether another epoch reorders the arms.
    projected_cost:
      cpu_hours_ceiling: 0.42
      cost_ceiling_usd: 0.70
      wall_time_ceiling_minutes: 25
      basis: >-
        13,500 train+validation queries at the Stage C measured p99 of 4.01 ms
        (CAND) and 9.84 ms (TARGET_H1) is 3.1 CPU-minutes of feature build; the
        launcher's gate pads that threefold to 40 ms per query to cover the
        seed-support and induced-degree work Stage C did not time, adds the
        600 s load ceiling and 300 s for training, and returns 0.42 CPU-hours.
        At the measured $0.634 per container-hour that is $0.27 of compute; the
        gate's utilisation model reports $0.66, and the ceiling is set above the
        larger of the two rather than the more flattering one. Training is four
        linear models of at most 20 parameters, so the cost is dominated by
        image pull and dataset load rather than by the experiment.
    kill_gate: >-
      If TARGET_H1_BRIDGE does not beat TARGET_H1 on validation R@k or MRR --
      overall or on the formerly isolated stratum -- the bridge feature does not
      survive its cheapest multivariate test and is dropped from the QLS-v2
      candidate set. It is not carried forward on the strength of a univariate
      AUC.
    does_not_gate: >-
      D0b does NOT decide D1. D1 is a context-only causal experiment on the
      frozen QLS-v1 architecture and takes no bridge feature; adding one would
      confound a graph-context change with a representation change. D0b informs
      what a later QLS-v2 probe should contain.

  D0C:
    status: COMPLETE
    evidence_class: EXPLORATORY
    results: docs/GRAPH_CONTEXT_D0C_D1_RESULTS.md
    outcome: >-
      Conditional use of restored context is NOT promising. BOTH matches CAND's
      R@5 to the digit (68.38) while losing 0.96 R@1, so a learner handed both
      blocks extracts nothing from the restored one. SELECTIVE_SUBSTITUTE is
      worse than CAND on three of four measures. SELECTIVE_MASK is the worst arm
      by a wide margin, which confirms the historical block is load-bearing. The
      approved question was whether this justified designing a principled
      query-conditioned reliability feature; it does not, and no learned gate is
      to be built on this evidence.
    secondary_outcome: >-
      D0b's stratified split does not survive convergence -- it inverts.
      TARGET_H1 - CAND R@1 moves from +3.06 to -1.80 on the isolated stratum and
      from -0.51 to +3.28 on ordinary. D0b's split is retracted as evidence: four
      arms compared at a shared three-epoch budget were being compared at their
      rates of ascent.
    tertiary_outcome: >-
      RETRIEVAL_ONLY's R@1 lead survives convergence at reduced size, +2.21
      rather than +6.12, against -0.96 R@5 and -3.83 R@20. Roughly two thirds of
      the D0b gap was the unconverged comparison. Still a 19-parameter result and
      still not a QLS-v1 statement.
    convergence: >-
      Every arm selects an interior epoch (4 to 9 of 10) and every arm's
      train-tail R@5 peaks and turns down inside the budget, which is the
      property D0b lacked. Not full convergence: mean train loss over the last
      four epochs still creeps 4.3% for RETRIEVAL_ONLY and 3.2% for
      SELECTIVE_MASK, against under 1.4% for the four arms carrying the full
      local block.
    actual_cost:
      elapsed_seconds: 451.2
      container_usd: 0.079
      cost_ceiling_usd: 0.80
    runner: scripts/run_graph_context_d0c.py
    dataset: 2wiki_clean
    what: >-
      D0b found TARGET_H1 neutral overall and sharply stratified. Two readings
      survive that: the restored columns carry information a linear map cannot
      route conditionally, or restoring context genuinely helps only the starved
      candidates. D0c separates them by making the conditioning explicit, and
      re-runs every arm to convergence so the comparison is not read off an
      arbitrary shared epoch. CPU only, no GNN, no test split.
    arms:
      RETRIEVAL_ONLY: 2 rank + 7 static. The floor, re-run converged.
      CAND: "+ the 10 frozen local columns over Cq."
      TARGET_H1: "+ the same 10 over Cq union N1_in(Cq)."
      BOTH: "+ both blocks; the learner chooses the coefficients."
      SELECTIVE_SUBSTITUTE: "+ 10 columns: H1 where induced degree < 2, CAND otherwise."
      SELECTIVE_MASK: "+ 10 columns: H1 where induced degree < 2, zeros otherwise."
    confirmatory_arms: [CAND, TARGET_H1, BOTH]
    exploratory_arms: [SELECTIVE_SUBSTITUTE, SELECTIVE_MASK]
    post_hoc_threshold:
      value: induced degree < 2
      chosen: after observing D0b's degree strata
      preregistered: false
      may_be_used_for_confirmation: false
      may_be_frozen_into_qls_v2: false
      universal_transfer_claimed: false
      purpose: >-
        To answer only whether conditional use of restored graph information is
        promising enough to justify designing a principled query-conditioned
        reliability feature. A yes buys a design effort, not a design.
    reliability_variable:
      name: induced_degree_in_G[Cq]
      trained_on: false
      exposed_as: >-
        the axis the TARGET_H1 - CAND delta is reported along, so the question is
        whether context value falls as historical structural evidence rises
      strata: [0, 1, 2-4, 5+]
      boundaries_fitted_here: false
    learner: the frozen A3 linear control, learning rate carried from A3
    epochs: 10
    epoch_selection: >-
      argmax validation-proxy recall@5 on a deterministic tail of train, so the
      reporting split is read exactly once per arm. D0b showed every arm still
      climbing at epoch 3, which is why its RETRIEVAL_ONLY R@1 lead is not a
      feature conclusion and why this stage does not repeat that comparison at an
      unconverged checkpoint.
    holdout_fraction: 0.1
    seed: 0
    rrf_constant: 60
    splits: [train, validation]
    normalisation: candidate_readout
    not_compared_to_d0b_absolutes: >-
      D0c fits on train-minus-tail where D0b fit on all of train, so the absolute
      numbers are not a continuation. Read the arms against each other.
    projected_cost:
      # The gate's own projection rounded up: 600 s load + 15,000 x 45 ms +
      # 400 s training = 1,675 s at $0.634/h, divided by the standing assumption
      # that useful work is 40% of billed time.
      cpu_hours_ceiling: 0.47
      cost_ceiling_usd: 0.80
      wall_time_ceiling_minutes: 30
      expected_actual_usd: 0.10
    does_not_gate: >-
      D1. D0c and D1 ask different questions and neither substitutes for the
      other; D0c may not add arms to D1 or change its schema.

  D3:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D3_RESULTS.md
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d3.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      How much of QLS-v1's query-local block value is bare retrieval-seed
      identity, how much is seed-distance geometry, and how much is the
      remaining graph-derived structure?
    why_it_is_needed: >-
      D2 measured the block as a whole (-20.82 R@5) but cannot attribute it. All
      ten columns are seed-anchored and sa_mlp has no other seed channel, so
      zeroing the block removes seed identity, seed geometry and graph structure
      at once. The seed_only comparison in the D2 write-up sizes the split only
      by cross-stage inference at a different head width; D3 replaces that
      inference with a within-stage measurement.
    proven_before_running: >-
      distance_0 is exactly I[d in Sq]. It is set from is_seed before any BFS hop
      and never overwritten, and candidate_readout leaves columns 0-3 untouched,
      so it is elementwise identical to the historical _seed_indicator. Proven in
      tests/test_seed_membership_column.py and asserted again at full scale
      inside the runner on the real queries.
    arms:
      Z0_ZERO_LOCAL: all ten query-local columns zero; reused from D2 NO_QUERY_LOCAL
      Z1_SEED_ID_ONLY: only distance_0, exact bare seed membership; NEW
      Z2_DISTANCE_ONLY: the complete frozen distance bucket group 0-3; NEW
      Z3_FULL_LOCAL: the original ten-column block; reused from D2 FULL_CAND
    naming: >-
      Z1 is not called SEED_MEMBERSHIP_ONLY-plus-buckets and Z2 is not called
      seed-membership-only. Keeping all four distance buckets exposes seed
      geometry, not membership, so the arm that keeps them is named
      DISTANCE_ONLY.
    ablation:
      method: masking, not removal
      parameter_difference: 0
      why: >-
        Identical architecture, head width and parameter count (213,506 at head
        61) in all four arms, so the ladder measures information and not
        capacity.
      same_epoch_budget_for_every_arm: true
    reuse:
      arms: {Z0: D2 NO_QUERY_LOCAL, Z3: D2 FULL_CAND}
      why: >-
        Identical conditions, so retraining them would pay twice for the same
        numbers. The runner checks dataset, fingerprint, context, model, node
        count, candidate contract, candidate rows, static feature source, all
        three split sizes and all five training values against D2's result file,
        and refuses rather than reusing across a mismatch.
      new_runs: 2
    reports:
      delta_seed: Z1 - Z0, value of knowing which candidates were retrieval seeds
      delta_distance: Z2 - Z1, incremental value of seed-distance geometry
      delta_remaining_structure: >-
        Z3 - Z2, incremental value of seed connections, path statistics,
        personalised PageRank and common-neighbour structure
      metrics: [recall@1, recall@5, recall@20, mrr, full_coverage@20]
      also: the same frozen degree strata, which are not refitted
    interpretation_fixed_in_advance:
      A_seed_identity_dominates: >-
        delta_seed carries almost all of the D2 gap. Most of QLS-v1's apparent
        query-local structural value is retrieval-seed identity, and structural
        work has only modest demonstrated headroom. Before opening R0-R5 broadly,
        isolate which small structural family produces the remainder.
      B_seed_geometry_dominates: >-
        delta_distance is large. Seed geometry is the main useful structural
        primitive; favour a minimal QLS-v2 built on seed identity, distinct
        support and a better distance distribution rather than a feature
        catalogue.
      C_remaining_structure_has_large_value: >-
        delta_remaining_structure is large. Support, path and diffusion
        statistics carry genuine incremental value beyond identity and distance,
        which justifies opening the QLS-v2 structural frontier.
      D_seed_and_distance_recover_almost_all: >-
        Do NOT test a large structural catalogue. Start QLS-v2 from retrieval
        prior + seed identity + minimal seed geometry and add one family at a
        time.
    projected_cost:
      basis: >-
        Measured from D2: 88.1 s of accounted compute for one shared feature
        build (49.7 s) plus two trainings (18.5 s + 17.1 s) and two scorings. D3
        shares one build across four arms and trains two, so its accounted work
        is within a few seconds of D2's. Priced as two new runs, not four.
      new_runs: 2
      gpu_hours_ceiling: 0.20
      cost_ceiling_usd: 0.90
      wall_time_ceiling_minutes: 12
      expected_actual_usd: 0.30
    outcome: >-
      SEED IDENTITY DOMINATES. Ladder on 2Wiki validation, seed 0, R@5: ZERO_LOCAL
      47.07, SEED_ID_ONLY 65.27, DISTANCE_ONLY 66.76, FULL_LOCAL 67.88. Increments
      delta_seed +18.20, delta_distance +1.49, delta_remaining_structure +1.12, which
      telescope to D2's +20.82 exactly. Seed identity is 87.4% of the R@5 gap, 67.0%
      of R@20 and 59.5% of FullCov@20.
    one_bit_beats_the_block: >-
      SEED_ID_ONLY beats FULL_LOCAL on R@1 (30.15 vs 29.03) and MRR (80.73 vs 79.28)
      and reaches 96.1% of its R@5 from a single binary column. The other nine
      columns are a net loss of 1.12 R@1 and 1.45 MRR against the bare indicator.
    distance_geometry: >-
      The one structural increment with real value, and it is entirely depth: +5.13
      R@20 and +8.77 FullCov@20 against -0.52 R@1 and -0.65 MRR. Its stratified shape
      is the mirror image of delta_seed -- worth +1.02 R@20 on isolated and +9.60 on
      ordinary -- because an isolated candidate has no geometry to read.
    remaining_structure_lower_priority_not_eliminated: >-
      seed_connections, paths_length_1/2/3, personalized_pagerank and
      common_out_neighbors are worth +1.12 R@5, +0.17 R@20, +0.40 FullCov@20 and are
      NEGATIVE on R@1 and MRR. Interpretation C, "remaining structure has large
      value", is REFUSED. Interpretation D also holds: seed identity plus distance
      recovers 94.6% of the R@5 gap, 99.0% of R@20 and 98.2% of FullCov@20. These six
      columns are NOT eliminated. +1.12 R@5 is materially smaller than seed identity
      but still large enough to matter at the scale of the QLS-versus-GNN gap.
      Correct status: remaining structural statistics are lower-priority and must
      justify their cost individually; they are not yet eliminated.
    remaining_structure_next_step: >-
      Positive on R@5 (+1.12) and near-zero on R@20 (+0.17) while negative on R@1
      (-0.60) and MRR (-0.80). The six columns may be optimising specifically around
      the R@5 operating region rather than improving ranking globally. Decompose them
      individually or by family later, not as one block. DEFERRED, not refused, and
      not authorised by this stage.
    seed_identity_proof: >-
      distance_0 verified elementwise identical to the historical _seed_indicator on
      4,851,276 real candidate rows, 0 mismatches, 105,675 seed rows; the distance
      group is a complete one-hot on every row. Asserted inside the run, not assumed.
    reuse: >-
      ZERO_LOCAL and FULL_LOCAL were not retrained. All 18 guarded conditions matched
      D2. Two new runs only.
    supersedes_the_d2_inference: >-
      The D2 write-up sized this split by cross-stage inference at ~18.8 / ~2.57. D3
      measures +18.20 / +2.61 within one stage. The inference was close but is no
      longer what the conclusion rests on.
    convergence_caveat: >-
      Every arm runs the frozen three-epoch QLS-v1 budget and every arm is still
      descending at the boundary. Deliberate: D3 decomposes D2 at D2's operating
      point and no arm may be given more epochs than another. Not a converged claim.
    actual_cost:
      new_runs: 2
      accounted_seconds: 90.4
      note: >-
        51.0 s shared feature build, 2.0 s static, 18.9 s + 17.8 s training, 0.7 s
        inference. Container total not captured by the spawn path; wall clock under
        ten minutes, so under $0.29 at $1.734/h against $0.90 authorised.
    does_not_authorise:
      [second dataset, second seed, GNN, R0-R5 sweep, LODO, E2, TARGET_H1,
       PATH, BRIDGE, SEED_H2, graph-context gating, more epochs for any one arm]

  D2:
    status: COMPLETE
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d2.py
    results: docs/GRAPH_CONTEXT_D2_RESULTS.md
    dataset: 2wiki_clean
    audit: docs/QLS_V1_COMPONENT_AUDIT.md
    question: >-
      What is the incremental value of QLS-v1's query-local structural feature
      block under the historical semantically filtered candidate graph?
    why_it_is_not_a_duplicate: >-
      The frozen ladder was audited from code before this was filed. seed_only is
      built with static_dim=0 and local_dim=1 and is fed a single binary retrieval
      seed indicator, so seed_only -> sa_mlp (+2.58 R@5 on 2Wiki, five seeds)
      moves the seven static features, the ten query-local features and the seed
      indicator at once, at two head widths. No other frozen condition is
      "interactions + static, no local". The linear half is already answered by
      D0c at no cost; only the nonlinear arm is missing.
    arms:
      FULL_CAND: exact QLS-v1 on G[Cq]; reproduces D1's CAND arm as a control
      NO_QUERY_LOCAL: identical model with the ten query-local columns zeroed
    ablation:
      method: zeroing, not removal
      why: >-
        Keeps architecture, head width and parameter count identical (213,506 at
        head 61), removing the capacity, optimiser and parameter-count confounds
        that the historical seed_only contrast carries. The first-layer weights
        reading the zeroed columns receive exactly zero gradient; AdamW's
        decoupled weight decay still shrinks them, which cannot change a score,
        because a weight multiplying zero contributes zero. Dead but trainable,
        and recorded as such.
      parameter_difference: 0
    context: CAND only. This is not a context experiment; that branch is closed.
    not_named_retrieval_only: >-
      The model keeps the seven static graph features, the candidate embeddings,
      the learned projection and the interaction block. It is named for what it
      removes.
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    reports: overall plus the same frozen degree strata, which are not refitted
    projected_cost:
      basis: >-
        Measured from D1: 217.8 s and 209.5 s for two arms that each built their
        own context. D2 builds one context for both arms and CAND is the cheaper
        one (p95 3.9 ms vs TARGET_H1's 9.6 ms), so it is bounded by D1's own
        elapsed rather than estimated upward from it.
      gpu_hours_ceiling: 0.20
      cost_ceiling_usd: 0.90
      wall_time_ceiling_minutes: 12
      expected_actual_usd: 0.10
    interpretation_fixed_in_advance:
      D2_A: >-
        FULL_CAND > NO_QUERY_LOCAL. The useful structural signal is the
        query-filtered structure already inside G[Cq]. Redirects QLS-v2 to better
        statistics on G[Cq] -- distinct seed support, seed geometry, path
        diversity, bounded diffusion, robust normalisation, provenance separation
        -- rather than expanding global context.
      D2_B: >-
        FULL_CAND ~= NO_QUERY_LOCAL. QLS-v1's gains may come primarily from the
        semantic and retrieval components. In that case do NOT begin the R0-R5
        structural frontier; first audit where QLS-v1's historical gain comes
        from.
    outcome: >-
      SEED-ANCHORED LOCAL BLOCK MATTERS. Reading D2-A. Zeroing the ten query-local
      columns costs -20.82 R@5, -16.07 R@20, -8.92 MRR and -2.48 R@1 on 2Wiki
      validation at seed 0. The block is load-bearing in QLS-v1 by a wide margin.
      Deliberately NOT stated as "structural block matters": zeroing removes seed
      identity, seed geometry and graph-derived structure simultaneously, and D2
      cannot attribute the loss among them. D3 measures that attribution.
    outcome_must_not_be_broadened_to: >-
      "graph structure is worth twenty points". All ten columns are seed-anchored and
      sa_mlp has no other seed input -- no reciprocal-rank features, no separate seed
      indicator -- so NO_QUERY_LOCAL cannot tell which candidates the retriever
      returned. Against the frozen ladder (seed_only, one binary membership column,
      65.83 R@5) roughly 18.8 of the 20.8 points is bare seed membership and about
      2.57 is everything the structural statistics add on top. That split is
      INFERENCE across two splits and two stages, not a measurement.
    control: >-
      FULL_CAND reproduced D1's CAND bit-identically on all five metrics (29.033 /
      67.883 / 77.525 / 79.2816 / 51.933) and on every recorded digit of the
      per-epoch train loss. Third independent container to do so.
    stratified: >-
      The block's value falls as candidate-induced evidence rises. R@5 delta runs
      -22.84 isolated, -23.03 degree_1, -19.03 low_degree, -14.90 ordinary; on
      ordinary, removing the block IMPROVES R@1 by 3.54 and leaves MRR flat. Strata
      were not refitted (boundaries_fitted_here false).
    convergence_caveat: >-
      Both arms select epoch 3 of 3, the boundary, and both are still descending.
      Three epochs is the frozen QLS-v1 budget and running it is what makes FULL_CAND
      reproduce CAND, but this is not a converged measurement, and the D0b lesson
      applies to the stratified reading in particular.
    reconciles_with_d0c: >-
      D0c's linear CAND - RETRIEVAL_ONLY was mild (-2.21 R@1, +0.96 R@5) because the
      linear model keeps two reciprocal-rank features and so still knows what was
      retrieved. The nonlinear model does not. The stages ablate different amounts of
      seed information; they are not in tension.
    actual_cost:
      accounted_seconds: 88.1
      note: >-
        Container total was not captured by the spawn path. Wall clock from launch to
        COMPLETE was under ten minutes, so under $0.29 at $1.734/h against $0.90
        authorised.
    does_not_authorise: [second dataset, second seed, GNN, R0-R5 sweep, LODO, E2]

