experiment: graph_context_pilot
status: STAGES_A_B_C_COMPLETE_TARGET_H1_RECOMMENDED
phase: "P1"
protocol: docs/COMPUTE_LEDGER.md
results: docs/GRAPH_CONTEXT_PILOT_RESULTS.md

question: >-
  Phase -1 measured what the candidate-induced graph G[Cq] destroys. This asks
  what each replacement context recovers, on real validation queries, without
  training anything. The deliverable is the smallest defensible context that
  repairs the measured loss without turning a query into a whole-graph
  computation.

contract:
  read_only: true
  models_trained: false
  gpu_used: false
  scored_nodes: exactly_Cq_in_every_arm
  candidate_pools_modified: false
  candidate_pools_expanded: false
  candidate_ceiling_changed: false
  gold_ids_used_in_context_construction: false
  gold_labels_used: false
  test_split_read: false
  package_f_accessed: false
  e2_touched: false
  crag_modified: false
  invented_edges: false
  qls_kernel: the_shipped_structural_features_kernel_not_a_reimplementation

definitions:
  Cq: the frozen Dense/SPLADE candidate set -- the scoring universe
  Sq: >-
    the frozen retrieval seeds. A SUBSET of Cq by construction of the artifact
    (seed_global = pool[seed_local]), so Cq union Sq == Cq. VERIFIED FROM CODE.
    The seed arms differ from the target arms only in what they expand from.
    Sq is much smaller than Cq: MEASURED at Stage C, SEED_H1 adds 9-56% more
    nodes at the median where TARGET_H1 adds 470-1977%, on a median Cq of
    316-364 candidates. The seeds-per-query count itself is not recorded by
    the pilot result files and is NOT asserted here.
  Uq: the context -- nodes allowed to contribute structural information
  invariant: Cq is a subset of Uq, therefore |Uq| >= |Cq|
  total_context_ratio: "|Uq| / |Cq|, bounded below by 1"
  added_context_ratio: "(|Uq| - |Cq|) / |Cq|, bounded below by 0"
  never_interchange: >-
    Reading one ratio as the other once understated a 472k-node context as
    "0.2x the pool". They are reported as separate fields.

arms:
  CAND:
    definition: "Uq = Cq"
    role: historical control, must stay bit-exact with the frozen construction
  SEED_H1:
    definition: "Uq = Cq union N1_out(Sq)"
    role: cheap control; expected to add little because Sq is small and inside Cq
  TARGET_H1:
    definition: "Uq = Cq union N1_in(Cq)"
    role: >-
      directly repairs the one-hop deletion Phase -1 measured (median rho_1
      0.077-0.250). In-neighbours, not out: every frozen operator flows
      source_to_target, so this is what a one-layer GNN actually lost.
  SEED_H2:
    definition: "Uq = Cq union N<=2_out(Sq)"
    role: >-
      structural-information control. Expected to advance on recovery and fail
      on cost: 60-65% of the corpus graph on 2wiki and hotpotqa.
  PATH_H2:
    definition: "Uq = Cq union {v not in Cq : exists s in Sq, c in Cq, s->v->c, s != c}"
    role: literature-inspired enclosing arm, seed-anchored
  BRIDGE_H2:
    definition: "Uq = Cq union {v not in Cq : exists c1,c2 in Cq, c1->v->c2, c1 != c2}"
    role: literature-inspired enclosing arm, candidate-anchored

distinctness_rule:
  status: VERIFIED_FROM_CODE_AND_DATA
  why: >-
    Five of the six sealed graphs are reachability-symmetric -- 2wiki stores
    855,146 edges as 521,614 distinct pairs with every reverse present. A path
    rule asking only "reachable from a seed AND has an edge into Cq" is then
    satisfied through the seed itself, because Sq is inside Cq. The first
    version did exactly that and returned a set identical to SEED_H1 on all 25
    smoke queries. The arms therefore require two DISTINCT candidate endpoints.
  deduplicated_view_because: >-
    34.1%-53.6% of stored messages are duplicates, and hotpotqa's sealed graph
    additionally stores 538.14 self-loops per query -- the only one of the 24
    audited graph-splits that carries any. Both are removed before a path is
    counted, so a duplicate edge cannot pose as a second endpoint and a
    self-loop cannot pose as a bridge.

lattice:
  order:
    - "CAND <= PATH_H2 <= SEED_H1 <= SEED_H2"
    - "CAND <= PATH_H2 <= BRIDGE_H2 <= TARGET_H1"
  enforced_in: tests/test_graph_context.py

excluded_before_any_compute:
  rule: >-
    Killed on Phase -1's already-measured corpus share, at zero pilot cost. A
    per-query context of 472k nodes has no serving story, and calling it
    "bounded local context" would be false.
  SEED_H3: 33.0%-99.7% of the corpus graph
  TARGET_H2: 17.9%-93.2% of the corpus graph
  TARGET_H3: 72.5%-100.0% of the corpus graph

retention_convention:
  status: VERIFIED_FROM_CODE
  source: src/mp_retrieval/graph_substrate.py::retention_summary
  rule: >-
    rho(v) = stored non-self out-messages of v landing in Uq, over stored
    non-self out-messages of v. Stored multiplicity is kept on both sides;
    stored self-loops are removed from both. This is the Phase -1 convention
    exactly, so the CAND arm has to reproduce the audited rho_1 rather than
    merely resemble it -- pinned in tests/test_graph_context.py.
  why_it_matters: >-
    Leaving self-loops in the denominator would have understated hotpotqa's
    retention by roughly a third, on the one dataset that has any, and hotpotqa
    holds the lowest measured median retention.

descriptor_saturation:
  status: STRUCTURAL_IDENTITY_VERIFIED_ON_480_COMPARISONS
  claim: >-
    No context wider than SEED_H1 can move a distance bucket of the frozen
    QLS-v1 descriptor, and none can change a candidate's raw seed-incidence
    count, on any graph.
  proof: >-
    Columns 0-3 are one-hot over {0, 1, 2, >=3-or-unreachable}. A candidate
    reaches bucket 2 exactly when some path seed -> x -> candidate exists with
    at most one intermediate, and every such x is an out-neighbour of a seed,
    which is precisely what SEED_H1 already admits. Column 4 counts edges
    incident to a seed; Sq is inside Cq, so every seed-candidate edge is already
    present in G[Cq] and widening cannot add one.
  evidence: >-
    480 arm comparisons over 120 random graphs, symmetric and directed: zero
    bucket movements and zero raw-count changes above SEED_H1. Column 4's
    normalised value nonetheless differed on 17 of them, which is the rescaling
    confound, not restored structure. Reproduced on the real 2wiki CSR with hub
    pools: all six arms returned byte-identical buckets, SEED_H1 at 166 context
    nodes against TARGET_H1 at 40,653.
  consequence: >-
    distance_bucket_changed was declared the primary movement signal before this
    was known. It is provably constant above SEED_H1, so it cannot rank the arms
    and is demoted to a reported diagnostic. This re-specifies a measurement
    before it is taken; no arm, threshold or spend changes.

measurements:
  size: [context_nodes, added_nodes, total_ratio, added_ratio, graph_share, context_edges]
  recovery: [retention_mean, retention_median, boundary_cut, isolated_fraction]
  reach:
    primary: distance_improved
    primary_rationale: >-
      Seed distance recomputed through the arm's own context, uncapped to four
      hops and divided by nothing. Both defects of the frozen descriptor are
      absent: it is not saturated at two hops, so it separates arms that the
      one-hot bucket lumps together, and it has no per-query normaliser, so a
      candidate's value moves only when its own topology did.
      distance_improved is the fraction of candidates strictly closer to a seed
      than the historical substrate G[Cq] made them.
    secondary: [seed_reach_at_1, seed_reach_at_2, seed_reach_at_3, seed_reach_at_4, seed_unreachable]
    censored: >-
      seed_distance_mean admits unreachable candidates at the sentinel
      SEED_DISTANCE_HOPS + 1 and is read beside seed_unreachable, never alone.
    stratified_by: prior_induced_degree
    strata: [isolated, degree_1, low_degree, ordinary]
    max_hops: 4
    cost: >-
      Diagnostic only. Nothing at serving time computes seed distance, so its
      latency is reported separately and excluded from total_ms and from the
      Pareto axis.
  movement:
    status: REPORTED_NOT_RELIED_ON
    reason: see descriptor_saturation
    reported: [distance_bucket_changed, any_column_changed]
    stratified_by: prior_induced_degree
    strata: [isolated, degree_1, low_degree, ordinary]
  systems: [build_ms, feature_ms, total_ms]
  distributions: [median, p90, p95, p99, max, mean]

stage_b_outcome:
  status: MEASURED
  queries: 25 per dataset, validation, none skipped for want of seeds
  datasets: [2wiki_clean, hotpotqa_clean]
  killed:
    PATH_H2: >-
      Structurally dominated by SEED_H1, not narrowly beaten by it. PATH_H2 is a
      SUBSET of SEED_H1 by the lattice, it recovered the same structure to three
      decimal places (2wiki 0.2938 against 0.2941, hotpotqa 0.3104 against
      0.3104), and it cost 6.2x and 2.8x as much to build (p95 8.7 ms against
      1.4, 204.4 ms against 73.5) because identifying a path node needs a
      second matrix step. More queries cannot reverse a subset relation.
    BRIDGE_H2: >-
      Same shape one level up: a SUBSET of TARGET_H1 that costs more to build.
      Recovered 0.594 and 0.708 median retention against TARGET_H1's 1.000, at
      p95 5.1 ms against 1.9 and 199.5 ms against 74.0. Dominated on both axes
      on both datasets.
    SEED_H2: >-
      Dominated on both axes, which is worse than the declaration predicted.
      The filed hypothesis was that it would advance on information and fail on
      cost; it failed on both, recovering 0.811 and 0.950 against TARGET_H1's
      1.000 while holding 60.2% and 52.9% of the corpus graph and costing 74.4
      and 2119.4 ms per query at the median.
  surviving:
    CAND: >-
      The historical control, on the frontier only because it is free. It is not
      a candidate for advancement; it is what the other arms are measured against.
    SEED_H1: >-
      On the frontier by a margin of half a millisecond on both datasets, at a
      third of TARGET_H1's recovery. Carried because the preregistered rule
      kills only dominated arms and this one is not dominated -- not because it
      looks promising.
    TARGET_H1: >-
      Recovers the radius-1 deletion completely -- retention 1.000, boundary cut
      0.000, isolated fraction 0.000 -- at 3.1% and 0.6% of the corpus graph and
      p95 1.9 ms and 74.0 ms to build. Completeness is an IDENTITY on a
      reachability-symmetric graph rather than a discovery: if every stored edge
      carries its reverse, every out-neighbour of a candidate is an in-neighbour
      of a candidate and so already inside Cq u N1_in(Cq). What the pilot
      measures is that the sealed graphs behave that way at radius 1, and at
      what cost.
  saturation_confirmed_at_scale: >-
    Predicted before the run and observed exactly: reach<=1 is identical across
    all six arms including CAND (2wiki 0.0580, hotpotqa 0.1008), because Sq is
    inside Cq so every seed-candidate edge is already in G[Cq]; and reach<=2 is
    identical across all five non-CAND arms (0.7630, 0.9040), because reaching
    distance 2 needs one intermediate and every such node is in SEED_H1. The
    arms separate only at distance 3 and beyond -- exactly the range the frozen
    descriptor collapses into a single class.

stage_c_outcome:
  status: MEASURED
  queries: 300 per dataset, validation, none skipped for want of seeds
  datasets: all_six
  arms: [CAND, SEED_H1, TARGET_H1]
  results: docs/GRAPH_CONTEXT_PILOT_RESULTS.md
  recommended_arm: TARGET_H1
  frontier_verdict: >-
    All three arms survive. SEED_H1 is dominated by TARGET_H1 on hotpotqa and
    webqsp only, and the preregistered rule kills only an arm dominated on
    every measured dataset. It is carried as an ablation, not a recommendation.
  recovery: >-
    TARGET_H1 restores median radius-1 retention to 1.0000 and the isolated
    fraction to 0.0000 on all six datasets. Boundary cut is 0.0000 on five and
    0.0015 on hotpotqa -- the one dataset the substrate audit measured as not
    reachability-symmetric, so the exception falls exactly where direction
    matters. CAND reproduces Phase -1's starvation on real queries: retention
    0.0908-0.3170, boundary cut 0.7000-0.9173, isolated 17.1%-36.8%.
  advancement_criterion_met: >-
    Required the seed-distance improvement to stay concentrated on formerly
    isolated and low-degree candidates rather than flattening across strata.
    Met on 6/6: TARGET_H1's improvement is monotone decreasing in prior induced
    degree on every dataset, helping 87.3%-99.4% of formerly isolated
    candidates against 14.0%-53.1% of degree-5+ ones.
  cost: >-
    TARGET_H1 total p95 8.7-170.1 ms per query, p99 9.8-205.9 ms, on the frozen
    QLS-v1 kernel. Context construction is the cheap half everywhere; the
    descriptor kernel dominates and scales with context nodes, not corpus size.
  size_qualification: >-
    REQUIRED WHENEVER THE CONTEXT SIZE IS QUOTED. TARGET_H1 is bounded in
    ABSOLUTE NODE COUNT -- median 2,012-7,520 and p95 at most 12,039 across
    corpora spanning 13.7k to 781k nodes -- and NOT in share of the graph. On
    the small corpora the median context is 16.4% (musique), 18.7% (metaqa) and
    30.2% (squad) of the whole graph, reaching 50.2% on one squad query. That is
    a consequence of a fixed-size candidate pool on a small corpus, not of an
    expansive rule, but "bounded local context" is false on those three without
    the qualification stated beside it.
  open_tail: >-
    hotpotqa's TARGET_H1 context reaches 142,073 nodes on one query in 300,
    against a p95 of 7,509 and a p99 of 21,778. Reported, not handled. Any
    serving story needs a cap.
  not_established: >-
    No effectiveness claim: nothing was trained. No QLS-v2 versus GNN
    comparison. Validation split only. PATH_H2, BRIDGE_H2 and SEED_H2 were
    killed on Stage B's two datasets and never run on the other four -- the
    first two kills rest on subset relations and hold everywhere, SEED_H2's
    rests on a measurement of two datasets.

qls_v1_parameters:
  source: configs/sa_mlp_screen.yaml::query_local_features
  damping: 0.85
  ppr_iterations: 8
  note: the frozen values, so CAND reproduces the historical descriptor exactly

stages:
  A:
    status: PASSED
    what: synthetic correctness, 521 tests
    cost: seconds, local
  B:
    status: MEASURED
    queries: 25
    datasets: [2wiki_clean, hotpotqa_clean]
    what: >-
      real validation queries, all six arms, on the two datasets the ledger
      declared -- the pair where induction destroyed the most two-hop reach
      (2wiki 13.6% retained, hotpotqa 27.5%). Not all six: Stage B's job is to
      measure throughput and separate the arms, and the remaining four datasets
      would triple its cost without changing either answer. They arrive at C.
    declared_in: docs/COMPUTE_LEDGER.md
  C:
    status: MEASURED
    queries: 300
    datasets: all_six
    arms: [CAND, SEED_H1, TARGET_H1]
    what: survivors only
    cost: >-
      MEASURED 921 container-seconds across 6 concurrent CPU jobs = 0.26
      CPU-hours, about $0.16, against a declared ceiling of 3.25 CPU-hours and
      $5.15. Declared in the ledger after B returned, never before.
    results: docs/GRAPH_CONTEXT_PILOT_RESULTS.md
    rule: >-
      Do not consume all 300 if an arm clearly fails before then. Kill an arm at
      B if it does not lower isolation, does not bring candidates closer to a
      seed than G[Cq] did, or costs a fraction of the corpus that cannot be
      served. The second clause originally read "does not move distance
      buckets"; that test is provably vacuous above SEED_H1 -- see
      descriptor_saturation -- and was replaced before Stage B ran.

  D0:
    status: MEASURED
    results: docs/GRAPH_CONTEXT_D0_RESULTS.md
    queries: 300
    datasets: all_six
    arms: [CAND, TARGET_H1]
    what: >-
      Zero-training relevance diagnostic. Stage C established that TARGET_H1
      performs its intended repair; it did not establish that the repair is
      useful. D0 asks whether structural quantities computed under TARGET_H1
      separate relevant candidates from irrelevant ones better than the same
      quantities computed under CAND, on the Stage-C sample, using validation
      relevance labels for SCORING ONLY.
    features: [seed_distance, distinct_seed_support, two_hop_seed_support, bridge_support]
    statistic: >-
      Per-query rank AUC -- the pairwise win rate with ties at one half --
      reported beside the tie fraction, because a constant quantity also scores
      0.5 and "cannot discriminate" is not "is not defined here". A query with
      no positive or no negative candidate is unscorable and is counted, never
      imputed at 0.5.
    negative_control: >-
      distinct_seed_support is identical under both contexts by construction:
      Sq is inside Cq, so every seed-to-candidate edge already survives vertex
      induction on G[Cq]. It is carried to prove the harness cannot manufacture
      a difference where none exists.
    labels: >-
      Validation relevance labels, read AFTER the pool and seeds and never
      passed to context construction. Development evidence, not evaluation. The
      test split is not read; the runner refuses it.
    trains_nothing: true
    gpu: none
    kill_gate: >-
      If TARGET_H1's discrimination is no better than CAND's, and in particular
      if it is no better on the formerly isolated and low-degree strata where
      the repair lands, do not spend GPU on Stage D1 or on a new GNN. Record
      that substantial graph structure was removed historically and that
      restoring it in this form did not improve ranking.
    outcome: >-
      HALF MET, and the half that failed is recorded rather than reinterpreted.
      Overall, neither context dominates: bridge_support improves on 5/6
      datasets by 0.010-0.066 AUC while two_hop_seed_support degrades on 5/6 by
      up to 0.274 and seed_distance does not move. On the formerly isolated
      stratum the gate is met decisively -- CAND scores exactly 0.5000 there by
      identity, because all three support quantities are constant-zero for a
      candidate with no induced neighbour, and TARGET_H1 reaches 0.9513 (2wiki),
      0.9054 (musique) and 0.8749 (hotpotqa). On the low-degree stratum it is
      not met: bridge_support at degree 2-4 improves on 2 datasets and degrades
      on 4. The clause was written to rule out a gain confined to
      well-connected candidates; the observed failure is the opposite one.
    outcome_qualification: >-
      The isolated stratum is scorable only when a GOLD candidate was isolated,
      which happens in 20.0% of 2wiki queries, 10.3% of musique, 6.0% of
      hotpotqa, 1.5% of webqsp, 1.0% of squad and 0.0% of metaqa. squad and
      webqsp rest on three queries each and metaqa on none, so only 2wiki,
      musique and hotpotqa carry weight. The overall deltas are point estimates:
      the runner retained means and medians, not the paired per-query
      differences, so D0 cannot say whether an overall delta is outside noise.
      No D0 conclusion rests on the sign of one.

  D0B:
    status: DECLARED
    runner: scripts/run_graph_context_d0b.py
    dataset: 2wiki_clean
    what: >-
      D0 scored each structural quantity on its own. This asks the multivariate
      question that decides whether bridge_support is worth a place in QLS-v2:
      does it still help once the ordinary retrieval and static graph features
      are present? CPU only, no GNN, no architecture search, no test split.
    arms:
      RETRIEVAL_ONLY: 2 rank + 7 static. A floor, not a candidate design.
      CAND: "+ the 10 frozen local columns over Cq. Reproduces A3's feature set."
      TARGET_H1: "+ the same 10 over Cq union N1_in(Cq)."
      TARGET_H1_BRIDGE: "+ log1p(bridge_support), candidate-normalised."
    learner: >-
      The frozen A3 linear control, unchanged: bias-free, weights initialised at
      zero, multi-positive listwise loss, AdamW, weight decay 0.0, gradient clip
      1.0, 3 epochs, 512-query batches, one seed. The learning rate is A3's
      selected value for this dataset, carried and not re-selected.
    seed: 0
    rrf_constant: 60
    splits: [train, validation]
    # The active workspace holds the topology-only slice of this dataset: graph,
    # candidates, seeds, golds and splits, but not the sealed derived/ caches.
    # The static block is a deterministic function of graph.pt, so it is rebuilt
    # through the shipped builder at the frozen parameters rather than
    # replicated -- the two then agree by construction, not by resemblance.
    static_features:
      source: configs/sa_mlp_screen.yaml::static_features
      pagerank_damping: 0.85
      pagerank_iterations: 30
      clustering_max_wedges_per_node: 64
    normalisation: candidate-readout in every arm
    epoch_selection: >-
      none. The final epoch is reported. A3 selects its epoch on validation and
      reports on test; D0b has no test split, so selecting and reporting on
      validation would be reading one number twice. The per-epoch trajectory is
      retained so a reader can check whether another epoch reorders the arms.
    projected_cost:
      cpu_hours_ceiling: 0.42
      cost_ceiling_usd: 0.70
      wall_time_ceiling_minutes: 25
      basis: >-
        13,500 train+validation queries at the Stage C measured p99 of 4.01 ms
        (CAND) and 9.84 ms (TARGET_H1) is 3.1 CPU-minutes of feature build; the
        launcher's gate pads that threefold to 40 ms per query to cover the
        seed-support and induced-degree work Stage C did not time, adds the
        600 s load ceiling and 300 s for training, and returns 0.42 CPU-hours.
        At the measured $0.634 per container-hour that is $0.27 of compute; the
        gate's utilisation model reports $0.66, and the ceiling is set above the
        larger of the two rather than the more flattering one. Training is four
        linear models of at most 20 parameters, so the cost is dominated by
        image pull and dataset load rather than by the experiment.
    kill_gate: >-
      If TARGET_H1_BRIDGE does not beat TARGET_H1 on validation R@k or MRR --
      overall or on the formerly isolated stratum -- the bridge feature does not
      survive its cheapest multivariate test and is dropped from the QLS-v2
      candidate set. It is not carried forward on the strength of a univariate
      AUC.
    does_not_gate: >-
      D0b does NOT decide D1. D1 is a context-only causal experiment on the
      frozen QLS-v1 architecture and takes no bridge feature; adding one would
      confound a graph-context change with a representation change. D0b informs
      what a later QLS-v2 probe should contain.

  D1:
    status: DECLARED
    declaration: docs/COMPUTE_LEDGER.md
    dataset: 2wiki_clean
    arms: [CAND, TARGET_H1]
    seeds: 1
    what: >-
      First effectiveness pilot: 2wiki only, CAND vs TARGET_H1, one seed, same
      frozen ranker architecture and feature schema in both arms, bit-identical
      Cq, train for fitting and validation for reporting. The test split is not
      read and the runner refuses it.
    metrics: [recall_at_1, recall_at_5, recall_at_20, mrr]
    projected_cost:
      feature_build_cpu_hours: 0.06
      gpu_hours_ceiling: 1.0
      cost_ceiling_usd: 2.29
      wall_time_ceiling_minutes: 40
    declared_confound: >-
      Six of the ten frozen QLS-v1 descriptor columns are normalised by a
      per-query maximum over the local node space, and that space is what
      differs between the arms, so a positive result cannot on its own be
      attributed to restored structure rather than to a moved normaliser.
      Holding the schema fixed is still the right control -- the normaliser is
      part of the frozen system. Columns 0-3 are the unnormalised one-hot
      seed-distance bucket and do separate these two arms (an isolated
      candidate sits at >=3 under CAND and can sit at 1 or 2 under TARGET_H1),
      so they are the confound-free channel and are reported per arm beside the
      metrics.
    kill_gate: >-
      If TARGET_H1 <= CAND on validation R@k and MRR: DO NOT SCALE. Record that
      substantial graph structure was removed historically and that restoring it
      in this form did not improve ranking. Only on a positive result may the
      two-dataset Stage E declaration be PREPARED -- hotpotqa_clean for severe
      truncation, musique_clean as the semantic-dominant control, both chosen
      before outcomes, one seed each. Preparing is not launching.

advancement:
  rule: >-
    An arm advances only if it materially restores structure WHERE Phase -1
    found loss -- recovery and seed-distance improvement concentrated on
    formerly isolated and low-degree candidates -- AND its projected serving
    cost is plausible. More reach is not
    better; the whole corpus is reachable in three hops on every dataset.
  kill: >-
    Strictly Pareto-dominated on (p95 construction latency, structural recovery)
    means killed, recorded, and not trained.

aggregation:
  query_selection: deterministic_prefix_of_the_split_order
  never_sampled: true
  cap_is_recorded: true

reporting:
  splits: [validation]
  note: >-
    Validation only. The test split is not read during a phase whose output
    influences a design decision.

datasets:
  2wiki_clean:
    expected_queries: 15000
    confirmation: outputs/sa_mlp_confirmation/2wiki_clean.json
    candidate_contract_compatibility: pre_hop_metadata_v1
  musique_clean:
    expected_queries: 19938
    confirmation: outputs/sa_mlp_confirmation/musique_clean.json
    candidate_contract_compatibility: pre_hop_metadata_v1
  webqsp:
    expected_queries: 1578
    confirmation: outputs/sa_mlp_confirmation/webqsp.json
  hotpotqa_clean:
    expected_queries: 97852
    confirmation: outputs/sa_mlp_confirmation/hotpotqa_clean.json
  squad_clean:
    expected_queries: 130319
    confirmation: outputs/sa_mlp_confirmation/squad_clean.json
  metaqa:
    expected_queries: 407513
    confirmation: outputs/sa_mlp_confirmation/metaqa.json

modal:
  app: message-passing-retrieval-graph-context
  result_volume: message-passing-retrieval-data
  storage_root: /root/message-passing-retrieval/storage
  cpu: 8
  memory_mb: 32768
  # Stage B is 25 queries x 6 arms. Context construction is milliseconds even on
  # webqsp's 781k-node graph (p95 232 ms, measured locally at true graph scale).
  # The feature kernel is Numba-compiled in this image; the local Python
  # fallback measured 16 s/query on a 40k-node SEED_H2 context and is not
  # representative. One hour is far above any plausible Stage B and is the unit
  # a restart would redo, since resumption here is per split.
  timeout_seconds: 3600
  # D0b is the one stage that runs a whole split rather than a capped prefix:
  # 13,500 train+validation queries against Stage B and C's 25 and 300. Its
  # indivisible unit is correspondingly larger, so it gets a larger window
  # rather than the shared one being loosened for stages that do not need it.
  # Projected at ~1,440 s -- 540 s of feature build at 40 ms per query for both
  # arms, the 600 s load ceiling, and under 300 s of linear training -- so this
  # is roughly fivefold headroom and stays a ceiling rather than an estimate.
  stage_timeout_seconds:
    stage_d0b: 7200
