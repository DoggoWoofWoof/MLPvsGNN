        D6/D5/D4 graded retrieval prior; among cols 4-9, only the family's own
        columns, at exactly D6_FULL_13's values, with every other residual column
        exactly zero.
    why_four_runs_not_five: >-
      D6 already fitted the matched control at this exact architecture: local_dim
      13, head width 61, 213,689 parameters, seed 0, same split, same budget.
      Refitting D6_BASE_13 would produce a number that cannot change any decision
      D7 makes. The project has repeatedly demonstrated deterministic
      reproduction across independent containers -- D1 reproduced bit-identically,
      D2's FULL reproduced D1, and every stage since has carried tensor-equivalence
      guards -- so a fifth run buys within-file symmetry and nothing else. Spend
      only on conditions that can change the decision.
    reuse_guards: >-
      Load-bearing, not decorative: every D7 increment is a D7 arm minus a D6
      arm. Before launch the runner requires dataset, seed, split sizes, node
      fingerprint, candidate contract, context CAND, local_dim 13, head width 61,
      213,689 parameters, static feature source, optimizer, loss, batching, epoch
      budget, model-selection procedure, retrieval prior exactness and the frozen
      normaliser to match D6's recorded values. Any material difference stops the
      stage.
    deterministic_reproduction_check: >-
      Because D6's arms were fitted in another container, D7 rebuilds D6's two
      blocks locally -- masking an array, not fitting a model -- and recomputes
      the content-sensitive statistics D6 recorded from its own build: candidate
      row count, the residual columns' total nonzero entry count, the prior's
      rows-ranked-by-both and rows-ranked-by-neither counts, the prior-vs-D4
