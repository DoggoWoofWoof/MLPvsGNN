  D9:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D9_RESULTS.md
    outcome: >-
      PATH REPLACEMENT EFFECTIVENESS UNTESTED -- ABORTED BY PRE-REGISTERED
      SYSTEMS GATE
    outcome_qualification: >-
      The stage stopped at the microbenchmark: 92.4 s of branch-diversity
      construction against a 74.2 s historical feature build. No arm was fitted,
      so there is no ladder, no increment and no effectiveness claim of any
      kind. D7's PATHS classification is untouched and the three effectiveness
      readings filed in advance remain untested.
    terminology_correction: >-
      This stage was first recorded as PATH REPLACEMENT UNINFORMATIVE ON 2WIKI,
      which is the runner constant and is still the literal string inside
      stage_d9.json. That label is withdrawn as the canonical conclusion because
      it is easy to misread as "the representation carried no signal". The
      representation was informative: hops 2 and 3 diverged strongly from the
      historical walk column on supported rows and on within-query ordering, and
      the filed mechanistic gate would have passed. What is untested is
      EFFECTIVENESS. This is a correction to the wording of the conclusion, not
      a re-reading of the measurements -- every number in this block and in
      stage_d9.json is unchanged. The result file is left byte-identical on
      purpose: it records what the runner decided at the time it decided it.
    the_gate_that_was_never_reached: >-
      The frozen mechanistic gate was computed on validation before the abort
      and recorded in full. Applying the filed thresholds to it -- arithmetic on
      the stage's own measurement, not a second run -- it would NOT have fired.
      Hop 1 is representation-equivalent at 0.094% of within-query pairs
      reordered; hops 2 and 3 diverge materially at 0.370% and 0.845% against a
      0.0025 threshold. The stage would have proceeded to train one arm.
    the_predicted_weakness_held: >-
      Both conditions declared weak before measurement behaved as declared.
      Nonzero agreement came back at exactly 1.000000 in all three columns, with
      no discriminating power whatever. The pooled Spearman passed in all three
      (0.998383 to 0.999669) and is an artifact of the shared zero mass: on rows
      where either column is nonzero it collapses to 0.409761 / 0.650787 /
      0.710165. The ordering condition was the only discriminator, exactly as
      filed.
    mechanistic_finding: >-
      Walk multiplicity is mostly multiplicity. At hop 3 the historical column
      ranges over walk counts to 7,880 while the branch count reaches 255 and
      the number of distinct seeds reaching the candidate never exceeds 9.
      395,695 within-query pairs are strictly reversed at hop 3, and 1,176,596
      pairs the walk count separates are ties under the replacement.
    reach_is_not_branch: >-
      CONFIRMED ON REAL DATA. Identical at hop 1 by construction, then differing
      on 36,786 rows at hop 2 and 74,356 at hop 3, with Pearson falling to
      0.725978 and 0.637605. Injecting "distinct seeds within k hops" would have
      handed the learner reach, which never exceeds 9, instead of branch, which
      reaches 255.
    overlap_with_d8: >-
      Diagnostic only, never trained. At hop 1 branch diversity is very nearly
      D8's distinct support (Pearson 0.931212, Spearman 0.999810), which is also
      the one column the mechanistic gate calls equivalent. At hops 2 and 3 the
      overlap falls away (Spearman 0.527883 and 0.611398). The part of the path
      family that is not already support is the part beyond one hop.
    cost_rule_defect_found: >-
      The abort rule as filed -- and as implemented identically in D8 -- compares
      the WHOLE construction wall clock against the historical build. 79.24 s of
      the 92.4 s was re-extracting induced edges the historical build already
      computes, which the same declaration says is NOT charged to a new feature.
      The kernel itself is 9.84 s, 13.25% of the build, at 0.877 ms p95 per
      query in 6368 bytes of workspace. D8 passed the same rule at 42.0 s
      against a 51.4 s build; this container ran the identical historical build
      1.44 times slower and the re-extraction crossed with it. The rule was NOT
      changed after seeing this: repairing a preregistered rule inside the stage
      whose outcome it produced is exactly the result-driven rewriting this
      project forbids. It is recorded, and its repair is the next experiment's
      first correction.
    systems_measured: >-
      branch kernel 9.84 s, p50 0.620 / p95 0.877 / p99 1.022 ms per query;
      shared induced-edge extraction 79.24 s reported separately; D8 overlap
      diagnostic 1.19 s timed separately again; temporary workspace 6368 bytes;
      peak RSS 6,250,299,392 bytes; three fixed graph passes, no convergence
      loop.
    storage_ceiling_measured: >-
      The frozen 13-column block is float16. The 138 distinct branch-saturation
      values present collapse to 78 when stored, and branch counts above 51 stop
      being distinguishable from their successors. The historical columns are
      log1p ratios in the same dtype and pay the same cost, so neither arm is
      advantaged, but any future structural feature inherits this ceiling.
    not_established: >-
      Nothing about effectiveness. No arm was fitted. Whether branch diversity
      ranks better or worse than walk multiplicity is untested, and the
      mechanistic divergence is not a proxy for it -- D8 is the standing
      reminder that two nearly rank-equivalent signals can still differ on all
      five metrics. Hop 1 is a partial exception in the other direction: the two
      representations are equivalent there under the filed rule, so even a
      fitted arm could not have attributed anything at hop 1 to the correction.
    actual_cost:
      container_seconds: 229.0
      gpu_hours: 0.064
      usd: 0.11
      against_authorisation: 0.08 GPU-h and $0.40
      why_above_the_passing_projection: >-
        the 0.035 GPU-h projection was priced from D8's container; this one ran
        the same historical feature build 1.44 times slower and still paid for
        the feature work before aborting.
      fitted_runs: 0
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d9.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      Is the useful part of the historical PATHS family branch/path diversity
      rather than raw walk multiplicity? And does 2Wiki provide enough
      representation divergence between the two to answer that at all?
    why_paths_is_next: >-
      D7 measured PATHS at -0.12 R@1, +0.82 R@5, +0.13 R@20, -0.15 MRR, +0.30
      FullCov and left it PROMISING / DEFERRED. After D8 it is the strongest
      untested residual family. D8 did not earn a weighted-support follow-up:
      rule A did not fire, so retrieval-weighted support is not promoted here.
    the_replacement_is_not_reach: >-
      "Distinct seeds reaching the candidate within k hops" is multi-hop seed
      support and would recreate D8's SUPPORT feature at a larger radius. D9
      keeps three concepts separate and injects only the second.
    three_concepts_kept_separate:
      REACH: which distinct SEEDS reach the candidate in exactly h hops
      BRANCH: through how many distinct immediate PREDECESSORS that arrives
      WALK: how many enumerated length-h walks arrive, the historical count
    historical_audit_first: >-
      VERIFIED FROM CODE at src/mp_retrieval/structural_features.py:426-443 and
      reproduced exactly against qls_local_features on eight named graphs in
      tests/test_path_diversity.py. w_0 is the seed indicator; w_h[target] +=
      w_{h-1}[source] over the induced edges; the column is log1p(w_h) divided by
      the per-query maximum over the local node space. Lengths are EXACT, not
      cumulative. There is no visited set, so vertices and edges may repeat. The
      family is DIRECTED, unlike seed_connections, which credits both endpoints.
      Parallel edges multiply, self-loops pad every hop, a reciprocal pair gives
      the candidate hop 1, the seed hop 2 and the candidate hop 3 from one edge,
      and a hub with fan-out k gives its sink k walks from a single seed. The
      accumulator is float32, exact for integers below 2**24.
    the_replacement_definition:
      names: [branch_diversity_1, branch_diversity_2, branch_diversity_3]
      columns: [5, 6, 7]
      masks: >-
        M_0(v) = {v} if v in Sq else empty;
        M_h(v) = union over distinct predecessors p != v of M_{h-1}(p)
      branch: >-
        branch_h(d) = |{p : (p,d) a distinct induced edge, p != d,
        M_{h-1}(p) non-empty}|
      canonical_scalar: branch_diversity_h(d) = branch_h(d) / (branch_h(d) + 1)
      why_that_scalar: >-
        Intrinsic and bounded in [0,1] by construction, so it needs no per-query
        maximum and a candidate's value never moves because another candidate
        entered the pool. STRICTLY MONOTONE in branch_h, deliberately: any
        ordering divergence from the historical column is then attributable to
        the counting rule and not to the transform. Concave, so a hub with fifty
        branches reads 0.980 against three branches at 0.750 rather than sixteen
        times larger.
      alternatives_recorded_and_rejected:
        branch_over_indegree: >-
          bounded, but it is a purity measure: it saturates at 1.0 for every
          degree-1 candidate whose one predecessor carries evidence, and 2Wiki's
          gold nodes are concentrated in the isolated and degree_1 strata.
        raw_count: >-
          unbounded and would need the per-query maximum this replacement exists
          to remove.
      self_loops: >-
        excluded everywhere, from the branch count and the mask propagation
        alike. A node is not an independent branch of evidence into itself.
      parallel_edges: >-
        collapsed. The edge list is deduplicated to distinct (predecessor,
        candidate) pairs once, before any hop.
      reach_is_computed_but_not_injected: >-
        reach_h and reach_fraction_h are recorded as diagnostics so REACH and
        BRANCH can be shown to differ. They are not columns of any arm.
    injection_discipline: >-
      The three scalars are appended after historical candidate_readout, exactly
      as D5's prior and D8's support fraction are. normalised_columns stays
      (4,5,6,7,8,9) and is NOT extended to them. The gate is elementwise
      equality with branch/(branch+1) over every candidate row.
    bounded_computation: >-
      Seed bitsets propagated over deduplicated edges. Three fixed graph passes,
      one per hop, no iteration to convergence. FORBIDDEN and not implemented:
      simple-path enumeration, DFS over all paths, disjoint-path max-flow, motif
      enumeration, any path-list materialisation.
    arms:
      D6_BASE_13: cols 0-3 distance geometry, 4-9 zero, 10-12 the graded prior. REUSED.
      D7_PATHS_13: the same, with cols 5-7 carrying the historical walk columns. REUSED.
      D9_PATH_DIVERSITY_13: the same, with cols 5-7 carrying branch_diversity_1/2/3.
    comparisons:
      H_minus_B: historical path-family value, carried from D7 unchanged
      V_minus_B: bounded-diversity value given retrieval and geometry
      V_minus_H: the replacement delta, the comparison D9 exists to make
    frozen_operating_point:
      local_dim: 13
      head_width: 61
      parameters: 213689
      epochs: 3
      architecture_change: none
    mechanistic_gate_thresholds_filed_before_measurement:
      when: recorded in this declaration, before the gate was computed
      rule: >-
        STOP BEFORE TRAINING if and only if ALL THREE conditions hold on
        validation feature construction, on the post-transform values actually
        presented to the learner.
      spearman_abs_min: 0.995
      which_spearman: >-
        the POOLED Spearman over every validation candidate row, per mapped
        column pair, computed on the post-transform values. Named explicitly
        here, before the gate was computed, because the filed threshold did not
        say which of the several Spearmans it meant and a statistic chosen after
        seeing numbers is not a pre-registered one. Per-query Spearman is
        undefined for the many queries where a column is constant, which is why
        it is reported beside the rule rather than being the rule.
      ordering_change_max: 0.0025
      which_ordering_statistic: >-
        the fraction of within-query candidate pairs whose strict ordering or tie
        status differs between the mapped columns, counted exactly from the
        per-query joint contingency table over (walk count, branch count). Both
        columns are strictly monotone transforms of those counts within a query,
        so the table determines every pairwise comparison.
      nonzero_agreement_min: 0.995
      mapped_columns: [[paths_length_1, branch_diversity_1],
                       [paths_length_2, branch_diversity_2],
                       [paths_length_3, branch_diversity_3]]
      expected_weakness_recorded_in_advance: >-
        branch_h(d) > 0 implies walk_h(d) > 0 by construction, and the converse
        fails only where every route into the candidate at that hop is a
        self-loop. Nonzero agreement is therefore expected to pass at close to
        1.0 and carries almost no discriminating power here. This is stated
        before the measurement so that a near-1.0 figure is not later read as
        evidence of equivalence. The pooled Spearman is expected to be inflated
        the same way, because roughly 95% of candidate rows are zero in both
        columns and that shared mass dominates the pooled ranks. The condition
        with actual discriminating power is the ordering one. All three are kept
        as filed rather than reweighted: they form an AND, so trivially-passing
        conditions only make the gate fire more readily, which is the
        conservative direction for spending a training run. What that costs is
        an increased chance of an UNINFORMATIVE verdict, and that is stated here
        rather than discovered afterwards.
      also_reported_but_not_part_of_the_rule:
        - Pearson correlation per mapped column
        - per-query Spearman, pooled and on supported rows only
        - fraction of candidate rows whose values differ numerically
        - within-query pairs tied in one column but not the other
        - within-query pairs strictly reversed
        - block-level divergence, the rank correlation of the path block L2 norm
        - value-distribution divergence per column
        - REACH vs BRANCH correlation, to show the two are not one statistic
        - BRANCH vs D8 distinct support, the sub-additivity overlap diagnostic
    do_not_force_one_to_one: >-
      The historical columns are exact-hop walk counts on a per-query maximum;
      the replacement is an intrinsic bounded branch count. Both the mapped
      column comparisons and a block-level comparison are reported. Neither is
      dropped to make the table tidy.
    overlap_diagnostic_only: >-
      D7 found strong sub-additivity: the individual family R@5 deltas sum to
      +1.96 against a joint +0.89. If branch diversity is computed from
      propagated seed masks it may be another encoding of support, so its
      correlation with D8's distinct support is reported. D9 does NOT train
      distinct support and path diversity together.
    interpretation_fixed_in_advance:
      material: 0.005
      A_improves: >-
        V beats H materially while reducing the head-metric tradeoff: branch
        diversity is a better explicit structural primitive than raw walk
        multiplicity, and becomes a QLS-v2 candidate.
      B_pareto_matches: >-
        effectiveness inside the band while the replacement is bounded,
        deterministic, cheaper at p95/p99 and clearer: retain on Pareto grounds.
        An accuracy increase is not required.
      C_fails: >-
        historical multiplicity carries information branch diversity does not.
        Do NOT add walk counts back. At that point SUPPORT and PATHS have both
        failed to improve under correction, which is itself evidence that
        rewriting historical structural features into cleaner versions does not
        automatically improve ranking, and the next question is whether the
        residual is worth further structural engineering at all.
      D_uninformative: >-
        the gate fired: 2Wiki does not separate the two representations enough
        to test the replacement, and no fitted arm was run.
    systems_measurement: >-
      The branch kernel is timed separately from the shared induced-edge
      extraction, p50/p95/p99 per query, with temporary workspace, peak RSS and
      the fixed pass count. Shared graph preparation is NOT charged to the new
      feature. Compared against the historical path computation where separable.
    projected_cost:
      gate_fires:
        gpu_hours: 0.0
        usd: 0.0
        what: CPU feature analysis only, no fitted run
      gate_passes:
        gpu_hours: 0.035
        usd: 0.06
        what: one fitted arm on one shared build, priced from D8's measured 124.3 s
      authorisation:
        gpu_hours: 0.08
        usd: 0.40
      stop_before_training_if: >-
        the branch-diversity construction time exceeds the historical local
        feature build time, regardless of representation divergence.
      gate_note: >-
        scripts/spawn_modal_jobs.py prices every fitted graph-context stage with
        D1's whole-split model and reports 0.2 h / $0.87 for D9 as for D3-D8. It
        is a stage-independent ceiling, not a D9 projection, and it enforces only
        that no indivisible unit exceeds its container window.
    execution_order:
      - audit the historical paths_length_1/2/3 formulas from code
      - define one bounded path/branch-diversity replacement from that audit
      - prove synthetic correctness
      - benchmark the kernel
      - run the frozen mechanistic-divergence gate on validation
      - if representation-equivalent, STOP without model training
      - otherwise train exactly one D9 arm
      - compare B, H and V
      - STOP
    does_not_authorise:
      [second dataset, second seed, GNN, TARGET_H1, global context, weighted
       support, support plus path combination, PPR replacement, simple-path
       enumeration, motif enumeration, architecture search, LODO, E2 resume,
       Package F, convergence study, workspace migration]
    is_the_only_experiment: true

  D8:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D8_RESULTS.md
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d8.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      Does a corrected distinct-seed-support representation beat the historical
      edge-count proxy it replaces, at the same matched 13-column architecture?
    selection_rule_correction:
      recorded: before D8 was launched and before any D8 outcome existed
      the_rule_is_not: choose the largest R@5
      the_rule_is: >-
        choose the smallest, cheapest representation that remains on the
        effectiveness / system Pareto frontier.
      what_it_changes_here: >-
        D7's pre-registered dominance rule fired for PATHS at +0.82 R@5 against
        SUPPORT's +0.64, and the proposal that followed was a PATHS replacement
        pilot. Under the correct rule that proposal is wrong: PATHS buys 0.18
        points more R@5 while SUPPORT is head-neutral (-0.03 R@1, +0.09 MRR
        against PATHS's -0.12 / -0.15), returns more coverage (+0.40 against
        +0.30 FullCov@20), is one column rather than three, and is very likely
        the cheaper bounded computation. SUPPORT is the Pareto-efficient choice
        even though it is not the R@5 maximiser.
      this_is_not_outcome_driven_threshold_moving: >-
        The correction is filed here, in the declaration, before D8 runs and
        before any D8 number exists. D7's own thresholds and verdicts are
        untouched -- PATHS still measured +0.82 and is still PROMISING. What
        changed is which surviving family gets developed first, which is a
        forward priority decision, not a rewrite of a completed measurement.
    why_support_first: >-
      D7 established that seed-support information still has incremental value
      after the graded retrieval prior, seed identity and seed-distance geometry
      are all present: +0.64 R@5, +0.40 FullCov@20, at no head-ranking cost. It
      is the only family in D7 that improved a head metric at all. And it maps
      onto a specific, nameable QLS-v1 defect rather than a vague one: the
      historical column counts graph edges, not distinct retrieval seeds
      supporting the candidate. A bitset-based support implementation can
      eventually give support, reachability and seed geometry from the same
      bounded computation, which is a systems argument as well as an
      effectiveness one.
    historical_audit_first: >-
      D8 does not rely on the name `seed_connections`. Step one is to read the
      exact formula off the frozen kernel and report it: formula, hop radius,
      whether multiplicity is possible, whether duplicate and reverse edges count
      separately, the normalisation, the maximum observed value and the full
      computation path. Only then is a replacement defined.
    do_not_start_with_several_features: >-
      ONE primary replacement, DISTINCT_SEED_SUPPORT. D8 does not simultaneously
      introduce support@1, support@2, support@3, weighted support, path diversity
      or diffusion. One corrected representation against one historical proxy.
    the_replacement_definition:
      relation_unchanged: >-
        s supports d iff there is an induced edge s->d or d->s inside G[Cq] with
        s a retrieval seed. Same radius, same edge list, same seed privilege rule
        as the historical column. Only the counting rule changes.
      support_count: "support_count(d) = |{s in Sq : s supports d}|"
      support_fraction: "support_fraction(d) = support_count(d) / |Sq|"
      canonical_scalar: support_fraction
      why_that_one: >-
        Chosen before any effectiveness result. It is naturally bounded in [0,1],
        it means the same thing in every query, and it needs no per-query
        normaliser -- which is the second historical defect, not just the first.
        support_count is reported alongside it so the raw quantity stays visible.
      what_it_does_not_fix: >-
        A seed adjacent to another seed still accrues support, exactly as it does
        historically. D8 changes the counting rule and nothing else, so that the
        comparison isolates one change.
    injection_discipline: >-
      The replacement is injected at column 4 AFTER the historical
      candidate_readout normalisation, exactly as D5's graded retrieval prior is
      appended after it. If the new scalar were routed through candidate_readout
      it would be divided by the per-query maximum a second time and would mean
      what the historical column means. The runner asserts elementwise that the
      learner receives count/|Sq| and records how many queries have a column
      maximum strictly below 1.0 -- under a per-query max rescaling that count
      would necessarily be zero. This is an intentional QLS-v2 representation
      change and is documented as one.
    arms:
      trained_here: [D8_DISTINCT_SUPPORT_13]
      reused:
        D6_BASE_13: >-
          B, the exact matched causal control, reused from stage_d6 via stage_d7,
          not refitted.
        D7_SUPPORT_13: >-
          H, the historical edge-count proxy at the identical architecture,
          reused from stage_d7, not refitted.
      representation: >-
        cols 0-3 exactly D6's seed-distance geometry; col 4 the D8 distinct
        support scalar; cols 5-9 exactly zero; cols 10-12 exactly the D5/D6
        graded retrieval prior. local_dim 13, head width 61, 213,689 parameters.
      architecture_changed: false
    comparisons:
      H_minus_B: >-
        Is historical support useful at all? Already measured in D7 at +0.64 R@5.
        Carried here unchanged so the three arms read as one ladder.
      V_minus_B: Is distinct support useful?
      V_minus_H: >-
        Does the corrected support representation beat the historical edge-count
        proxy? This is the comparison D8 exists to make.
      on: [recall@1, recall@5, recall@20, mrr, full_coverage@20]
    mechanistic_comparison_before_training: >-
      Computed on validation-feature construction only, and reported BEFORE any
      effectiveness number is interpreted. Correlation between the two signals;
      the fraction of within-query candidate pairs the two order differently,
      split into strict reversals and one-sided ties; the fraction of candidate
      rows where the historical edge count exceeds the distinct seed count; and
      the distribution of both conditioned on induced degree 0 / 1 / 2-4 / 5+.
      THIS IS NOT A SELECTION CRITERION. If the two signals turn out to be nearly
      identical on 2Wiki then the representation defect does not occur materially
      here, and that has to be said plainly before any effectiveness difference
      is read as having fixed it.
    the_same_statistic_over_every_opened_query: >-
      Recorded beside the validation figures because it is free, and because a
      validation-only number that differed sharply from it would itself be worth
      knowing. The validation figures are the reported ones: the effectiveness
      numbers this comparison exists to explain are validation numbers, so a
      mechanistic statement about a different population would be describing
      queries nobody is scoring.
    bitset_backend: >-
      One bit per retrieval seed. |Sq| is about 7 on 2Wiki, so every candidate's
      support set fits in one 64-bit word and popcount(mask[d]) is the number of
      distinct supporting seeds. Recorded: algorithm, asymptotic complexity,
      temporary memory, and the number of fixed graph passes. NO SIMD, Numba
      specialisation or CUDA optimisation work in D8 unless the implementation is
      unexpectedly slow -- D8 is first an information-value test, not a systems
      optimisation.
    paths_is_deferred_not_killed:
      classification: PROMISING / DEFERRED
      measured: +0.82 R@5 in D7, the largest single-family increment
      why_deferred: >-
        Not because it lost. Because SUPPORT is the Pareto-efficient first move
        and PATHS costs three columns to SUPPORT's one. If improved support later
        absorbs the historical PATHS gain, a separate path feature may never be
        needed; if it does not, PATHS is the next candidate and is already
        motivated.
    interpretation_fixed_in_advance:
      thresholds:
        material: 0.50 pp
        band: anything strictly inside +/- 0.50 pp
      A_DISTINCT_SUPPORT_IMPROVES: >-
        V is materially better than H on at least one reported metric and
        materially worse on none. A serious QLS-v2 feature. The question it would
        raise next is retrieval-weighted distinct support -- which is NOT
        automatically run.
      B_DISTINCT_SUPPORT_PARETO_MATCHES_HISTORICAL: >-
        No material difference in either direction, or a genuine mixed result
        where each arm is materially better on something. V still wins as the
        QLS-v2 replacement on Pareto grounds: clearer semantics, a bounded [0,1]
        range needing no per-query normaliser, and a cheaper bounded computation.
        DO NOT REQUIRE AN ACCURACY INCREASE WHEN REPRESENTATION AND SYSTEM COST
        IMPROVE.
      C_DISTINCT_SUPPORT_FAILS: >-
        V is materially worse than H on at least one reported metric and
        materially better on none. Do NOT immediately revert to raw edge counts.
        Record the failure and move to the deferred PATHS replacement as the next
        candidate.
      also_reported_separately: >-
        The user's rule A read literally -- a >= +0.50 pp R@5 gain with R@1 and
        MRR maintained inside the band -- is recorded as its own boolean beside
        the trichotomy, so the exact stated criterion is visible independent of
        the Pareto reading.
      these_are_development_decisions: >-
        One dataset, one seed. Stage-D development decisions, not statistical
        significance claims.
    not_authorised_in_d8:
      weighted_support: >-
        Retrieval-weighted support is a possible D9 ONLY if D8 earns it. Not now.
      path_diversity: >-
        No predecessor diversity, branch count or shortest-path multiplicity
        implementation in D8.
      also:
        [global graph, TARGET_H1, second dataset, second seed, GNN, diffusion,
         path replacement, architecture search, E2 resume, Package F,
         workspace migration]
    systems_measurement: >-
      Incremental feature-construction cost for the new signal only, p50 / p95 /
      p99 per query, measured separately from the historical build. Peak CPU RSS
      and the temporary structural workspace in bytes. The whole QLS pipeline
      time is NOT attributed to one feature.
    frozen_operating_point:
      [2wiki_clean, seed 0, CAND graph, frozen candidate pool, same semantic
       branch, same retrieval prior, same distance geometry, same static block,
       3 epochs, same listwise loss, same optimizer, same batching, same
       best-epoch restoration, local_dim 13, head width 61, 213689 parameters]
    projected_cost:
      new_runs: 1
      shared_feature_builds: 1
      reuses: [D6_BASE_13, D7_SUPPORT_13]
      measured_expected:
        basis: >-
          From the D7 actuals: 50.5 s shared feature build, 2.0 s static, 14.6 s
          assembling and proving the prior, 18.5 s training and 0.34 s inference
          for the SUPPORT arm. D8 adds one bounded pass for the new signal and
          the mechanistic comparison, budgeted generously at 25 s, and trains one
          arm: 50.5 + 2.0 + 14.6 + 25 + 18.5 + 0.4 = about 111 s of accounted
          compute.
        accounted_gpu_hours: 0.031
        accounted_usd: 0.06
        conservative_billed_usd_including_container_overhead: 0.25
        wall_time_ceiling_minutes: 30
      authorisation_ceiling:
        gpu_hours: 0.08
        usd: 0.40
      stop_before_training_if: >-
        The measured distinct-support construction time exceeds the historical
        local feature build time -- that is, if the new signal more than doubles
        the build. Registered here before launch. On that condition the runner
        writes the microbenchmark and the mechanistic comparison and STOPS
        without fitting the model, and the stage reports rather than trains.
      the_gate_number_is_not_a_forecast: >-
        spawn_modal_jobs.py will report 0.2 h / $0.87 for this stage as it did
        for D3 through D7, which is ABOVE the $0.40 authorisation ceiling. That
        is expected and is not a breach. VERIFIED FROM CODE: every fitted
        graph-context stage is priced with the D1 whole-split model, documented
        in that source as a ceiling the later stages are bounded by, and the gate
        enforces only that no indivisible unit exceeds its container window. It
        does not enforce a dollar ceiling and it is not a calibrated D8
        projection.
      stop_condition: >-
        If actual cost exceeds 0.08 GPU-hours or $0.40, stop and inspect.
    execution_order:
      - audit the exact historical seed_connections formula from code
      - define one exact distinct-support replacement
      - implement the bounded bitset computation
      - prove it against a brute-force synthetic reference
      - measure how much historical and distinct support actually differ
      - verify the D6 and D7 reuse guards
      - file this one-run declaration
      - train D8_DISTINCT_SUPPORT_13
      - compare V - B and V - H
      - STOP
    does_not_authorise:
      [second dataset, second seed, GNN, TARGET_H1, global context, weighted
       support, path diversity, architecture search, LODO, E2 resume, Package F,
       convergence study, workspace migration]
    is_the_only_experiment: true
    outcome: >-
      DISTINCT SUPPORT PARETO-MATCHES HISTORICAL. Every V - H metric is inside
      the +/-0.50 pp material band: R@1 -0.07, R@5 -0.43, R@20 -0.04, MRR -0.12,
      FullCov@20 -0.07. The corrected representation therefore stays on the
      frontier and is carried forward as the QLS-v2 support column on
      representation and system grounds -- bounded [0,1] by construction, no
      per-query normaliser, 1.66 s and one fixed graph pass -- and NOT on
      accuracy. It did not beat the proxy on any metric.
    outcome_qualification: >-
      R@5 at -0.43 misses the FAILS threshold by 0.07 pp, and all five metrics
      are negative. The margin is recorded, not used: the threshold was fixed in
      the declaration and does not move because a result landed near it, exactly
      as D7's DIFFUSION missed PROMISING by the same 0.07. Five out of five in
      one direction is not a coin-flip tie, and the write-up says so. Rule A did
      not fire, so retrieval-weighted distinct support is not promoted.
    mechanistic_finding: >-
      Reported before the effectiveness numbers, on validation feature
      construction. The representation defect is real and universal where it can
      occur -- 100.0% of the 50,003 supported rows have more edge endpoints than
      distinct supporting seeds, 3.75 edges per 1.23 seeds -- but only 4.63% of
      candidate rows carry any support at all, and the two signals order
      candidates almost identically: 0.094% of 194,238,384 within-query pairs
      ordered differently, 209 strictly reversed. On 2Wiki these are close to the
      same signal, which is why no effectiveness difference here can be read as
      evidence that correcting the defect is what moved it. No candidate row has
      induced degree 1, so 2Wiki stores induced edges in both directions.
    historical_formula_audited: >-
      VERIFIED FROM CODE at src/mp_retrieval/structural_features.py:340-425.
      seed_connections accumulates induced edge ENDPOINTS at hop radius 1:
      reverse and parallel edges count separately, a reciprocal pair from one
      seed scores 2, a self-loop on a seed scores 2, a seed adjacent to a seed
      accrues support; then log1p and a per-query maximum. Two defects, not one:
      the count is edges rather than seeds, and the value is not intrinsic.
      Maximum observed raw value 28 on validation, 30 over all opened queries.
    systems_measured: >-
      Kernel 1.66 s total, 3.23% of the 51.4 s historical build, p50 0.080 ms,
      p95 0.095 ms, p99 0.119 ms per query; the 581 ms maximum is numba's first
      compile. Shared induced-edge extraction is 39.22 s and is reported
      separately rather than charged to the feature. Temporary workspace 3,184
      bytes, one fixed graph pass, no convergence iteration. Peak process RSS
      5.47 GB, dominated by the 4.85M-row feature block.
    cost_gate_measured: >-
      Did not fire: 42.0 s construction against a 51.4 s historical build. No
      SIMD, numba specialisation or CUDA work was done.
    not_established: >-
      A Pareto match is not interchangeability. On a graph storing edges once
      rather than reciprocally, or with denser multiplicity, the two signals
      would diverge further and this comparison would have to be redone. One
      dataset, one seed, development evidence on G[Cq]. PATHS remains PROMISING /
      DEFERRED at +0.82 R@5, unchanged by D8.
    actual_cost:
      accounted_seconds: 124.3
      gpu_hours: 0.035
      usd: 0.06
      authorised_gpu_hours: 0.08
      authorised_usd: 0.40
      note: >-
        Measured component time -- 51.4 s feature build, 2.1 s static, 10.3 s
        prior, 42.0 s replacement construction, 18.2 s training, 0.35 s
        inference -- at $1.734/h. Container startup and image import are not
        included and were not measured.

  D7:
    status: COMPLETE
    results: docs/GRAPH_CONTEXT_D7_RESULTS.md
    evidence_class: CONFIRMATORY within its own narrow question
    runner: scripts/run_graph_context_d7.py
    dataset: 2wiki_clean
    seed: 0
    holdout_fraction: 0.1
    splits: [train, validation]
    question: >-
      Which historical structural family, if any, is responsible for the residual
      +0.89 R@5 once direct retrieval evidence and seed geometry are already
      available? And secondarily, which family causes the -0.63 R@1 / -0.70 MRR
      tradeoff?
    not_a_general_feature_search: >-
      D7 decomposes the six columns D6 already measured. It does not widen the
      frontier, propose new statistics, or test anything outside the frozen
      QLS-v1 historical block.
    why_it_is_needed: >-
      D6 measured the six residual columns as one block: +0.89 R@5, +0.24 R@20,
      +0.53 FullCov, but -0.63 R@1 and -0.70 MRR. That is not Pareto-clean, and a
      block moved as one unit cannot say which part bought the depth and which
      part sold the head. If one family carries the gain and another carries the
      loss, QLS-v2 can keep the useful primitive and delete the harmful one.
    families:
      SUPPORT:
        columns: [4]
        names: [seed_connections]
      PATHS:
        columns: [5, 6, 7]
        names: [paths_length_1, paths_length_2, paths_length_3]
      DIFFUSION:
        columns: [8]
        names: [personalized_pagerank]
      NEIGHBOURHOOD:
        columns: [9]
        names: [common_out_neighbors_with_seed_neighborhood]
      note: >-
        These names describe the historical QLS-v1 signals only. They are not the
        final QLS-v2 feature definitions. The four families are disjoint and
        together cover the six residual columns exactly once, which is what makes
        the additivity residual meaningful; the runner refuses otherwise.
    arms:
      trained_here:
        [D7_SUPPORT_13, D7_PATHS_13, D7_DIFFUSION_13, D7_NEIGHBOURHOOD_13]
      reused_from_d6:
