# M3A -- SOTA information contract, typed graph reconstruction, candidate headroom
#
# One file per phase. This file declares M3A and authorises no model fit.
#
# M2D closed the semantic ladder at STOP_S4_DEVELOPMENT_CONFIRMED with S3 as the
# final development QLS model. The next risk is not QLS over-tuning and is no
# longer GNN over-tuning either: it is comparing a richly-informed GNN against an
# information-starved feed-forward ranker and calling the difference "message
# passing". M3A exists to remove that confound before either model is trained.
#
# Nothing in this file may be read as a result. It fixes the rules; M3B produces
# the numbers.

phase: M3A_SOTA_INFORMATION_CONTRACT
opened: 2026-09-08
status: M3A_DECLARED_NO_RECONSTRUCTION_AUTHORISED

this_file_authorises: >-
  Declaration only. It authorises no QLS-U fit, no GAT fit, no GAT-NO-MP fit, no
  M4, and no canonical migration. Every quantity below that describes future work
  is an estimate; the gates at the bottom name what a dated amendment must earn
  before any reconstruction or encoding job is submitted.

# --------------------------------------------------------------------------
# The registered question. This wording is mandatory and may not be paraphrased
# into a claim about the answer.
# --------------------------------------------------------------------------

scientific_question: >-
  After matching candidate exposure and inference-time graph information to
  modern graph-retrieval/GNN systems, how much effectiveness remains
  attributable specifically to learned message passing?

registered_framing:
  mandatory_wording: true
  valid_outcomes: >-
    A nonzero message-passing benefit is a valid scientific outcome. So is a zero
    or negative one. The phase is designed to measure the increment, not to
    retire it.
  forbidden_framings:
    - prove message passing is unnecessary
    - show that we do not need message passing
    - demonstrate that the MLP wins
  why: >-
    Every gate in M0-M2D exists to stop a conclusion being fixed before the
    measurement. A phase that sets out to prove its own hypothesis forfeits that
    apparatus, and the reviewer would be right to discount the result.

# --------------------------------------------------------------------------
# Where this sits. M3 as previously declared becomes M3B and is superseded in
# scope, not deleted.
# --------------------------------------------------------------------------

phase_order:
  - M2D: frozen historical QLS development, closed at STOP_S4_DEVELOPMENT_CONFIRMED
  - M3A: this file -- information contract, typed graph, candidate headroom
  - M3B: train QLS-U, GAT-NO-MP and GAT under one identical information contract
  - FREEZE: architectures frozen with config and checkpoint hashes
  - M4: the first and only direct controlled comparison

supersedes:
  file: configs/m3_gnn_development.yaml
  what_is_superseded: >-
    Its candidate set (G0/G1 plain GATs), its six-cell screen matrix, its
    selection rule and its workload. Those were declared for a plain
    node-embedding GNN screen under the historical information contract.
  what_survives: >-
    Its firewall (no QLS number may enter GNN selection), its graph-privilege
    regime definitions R1/R2/R3, its truncation caveat, and its record that the
    historical operator is per-dataset. M3B will restate what it needs.
  rule: >-
    That file is not edited to match this one and its status line is not
    rewritten to claim a result. It is marked superseded and left as the record
    of what was declared on 2026-09-07.

# --------------------------------------------------------------------------
# Naming. Frozen before any result artifact exists, per review decision 1.
# --------------------------------------------------------------------------

model_naming:
  display_name: QLS-U
  formal_name: Universal Query-Local Structure Ranker
  internal_key: qls_u_sota_v1
  key_choice_rationale: >-
    The review offered `qls_u` with `qls_u_sota_v1` as the fallback if collision
    risk existed. It does. `qls_universal` is already an established M2-era name
    in configs/m2_qls_v2_freeze.yaml and configs/m2c_s4_structural_conditioning.yaml,
    where it denotes a shared FEATURE BLOCK, not a model. `qls_u` sitting beside
    `qls_universal_block` would read as an abbreviation of it and conflate a model
    with a feature group. The suffixed key cannot be misread.
  is_not: >-
    QLS-U is not S5, not S3, not S4, and not an ensemble or a renaming of any of
    them. S3, S4 and A3 remain frozen historical semantic-ladder objects.
  reuse_is_architectural_only: >-
    QLS-U starts from the S4-style projection machinery and retains the validated
    semantic_difference repair. That is a reuse of code and layer shape. QLS-U
    results are never to be reported or described as S4 results.
  historical_keys_must_not_be_renamed: true
  frozen_before_any_result_artifact_exists: true

# --------------------------------------------------------------------------
# What must not move. M2-M2D remain valid because their substrate is untouched.
# --------------------------------------------------------------------------

frozen_historical_contracts:
  rule: >-
    Typed relation reconstruction creates NEW versioned artifacts beside the old
    ones. It never mutates, replaces or re-hashes an artifact an existing result
    depends on.
  untouchable:
    - the historical graph.pt files and their digests
    - the M2 candidate universe and candidate ordering contract
    - the frozen node and query embeddings
    - the canonical splits
    - every filed M2, M2B, M2C and M2D result
  consequence: >-
    Old and new evidence coexist. M2-M2D claims continue to hold under the
    historical graph contract; M3A/M3B claims hold under the typed contract; no
    claim is silently re-based onto a substrate it was not measured on.

# --------------------------------------------------------------------------
# A. SOTA archaeology
# --------------------------------------------------------------------------

sota_archaeology:
  purpose: >-
    Establish what information current graph-retrieval systems actually receive at
    inference, so that "feature parity" is defined against the literature rather
    than against our own imagination.
  systems_required:
    knowledge_base:
      - NuTrea
      - ReaRev
      - GNN-RAG
    passage_multi_hop:
      - GraphER
      - GFM-Retriever   # where implementation detail is sufficiently public
  fields_per_system:
    - dataset
    - corpus
    - candidate_or_subgraph_construction
    - seed_or_topic_entity_assumptions
    - graph_node_type
    - graph_edge_type
    - relations_typed
    - relation_embeddings
    - query_conditioning_mechanism
    - node_features
    - edge_features
    - structural_statistics
    - message_passing_operator
    - depth
    - hidden_width
    - pretraining
    - external_supervision
    - output_metric
    - test_time_information_privilege
  mandatory_separation:
    - transferable_inference_time_feature
    - model_architecture
    - privileged_or_oracle_assumption
    - training_or_pretraining_resource
  oracle_rule: >-
    Do not copy oracle topic-entity information into our contract unless it is
    inference-safe and obtainable under our own retrieval setup. A feature that
    requires gold linking is an oracle, not a feature.
  comparability_rule: >-
    External absolute numbers are reference only. Corpora, candidate universes,
    entity linking, graph construction, relation typing, pretrained models and
    metrics all differ. No percentage-point claim against an external system
    unless the protocol matches.
  outputs:
    - docs/M3A_SOTA_ARCHAEOLOGY.md
    - outputs/m3a/sota_archaeology.json

# --------------------------------------------------------------------------
# B. The universal feature contract F(q, v)
# --------------------------------------------------------------------------

feature_contract:
  name: SOTA_FEATURE_CONTRACT
  principle: >-
    One dataset-agnostic schema. The same weights process all six datasets.
  groups:
    semantic:
      - query_embedding
      - candidate_embedding
      - s4_style_projected_semantic_representation
      - semantic_difference
    retrieval:
      - dense_score
      - dense_rank
      - splade_score
      - splade_rank
      - retriever_agreement
    seed:
      - is_seed
      - seed_rank_statistics
      - min_inference_safe_graph_distance   # where computable
    explicit_qls:
      - SUPPORT
      - PATH
      - NODE_ROLE
    sota_inspired_structural:
      - relation_query_compatibility
      - relation_frequency_rf_ief_like_statistics
      - local_structural_degree_statistics
      - seed_conditioned_relation_statistics
      - entity_overlap_cohesion_statistics
      - edge_family_provenance_statistics
  availability_masks:
    required_for: every optional group
    why: >-
      Without a mask, zero is ambiguous between "the relation matched poorly" and
      "this graph has no typed relation at all". Those are different states and a
      model that cannot distinguish them is being handed a silent confound.
  prohibitions:
    - no dataset ID as a feature
    - no dataset-specific branch in the feature builder
    - no feature added merely because a paper contains it
  required_per_feature:
    - source
    - exact_formula
    - inference_availability
    - cost
    - expected_mechanism
    - datasets_on_which_defined
  outputs:
    - docs/M3A_FEATURE_CONTRACT.md
    - outputs/m3a/feature_contract.json

# --------------------------------------------------------------------------
# C. Typed graph contract -- MetaQA and WebQSP
# --------------------------------------------------------------------------

typed_graph_contract:
  name: TYPED_GRAPH_CONTRACT
  applies_to: [metaqa, webqsp]
  motivation: >-
    The historical flattened graph tells a model only that A and B are connected.
    NuTrea and ReaRev see that A is connected to B BY a named relation, and let
    the question interact with that relation. That is the single largest
    information gap between our setup and the KB state of the art.
  edge_record:
    - src
    - dst
    - relation_id
    - relation_text
    - direction
    - edge_family        # STRUCT for reconstructed KB triples
  direction_rule: >-
    Preserve true relation direction. Where reverse adjacency is needed for
    traversal, represent it explicitly as an inverse-direction edge rather than
    silently symmetrizing, which would destroy the relation's meaning.
  assertions_required:
    - every edge maps into the exact model node row-space
    - zero unmapped edges, or every unmapped edge explicitly accounted for
    - deterministic digest over the built artifact
    - no gold label and no test-split read during construction
    - construction is split-independent
  must_not: >-
    Modify, overwrite or re-hash the historical untyped graph.pt.

# --------------------------------------------------------------------------
# D. Passage universal edge contract
# --------------------------------------------------------------------------

passage_edge_contract:
  applies_to: [hotpotqa_clean, 2wiki_clean, musique_clean, squad_clean]
  principle: >-
    Map whatever relations exist into the SAME abstract edge interface the KB
    datasets use, so one model reads one schema.
  edge_record:
    - src
    - dst
    - edge_family
    - edge_type
    - direction
    - relation_text              # where semantically meaningful
    - shared_entity_count        # where available
    - shared_entity_specificity  # where available
    - semantic_similarity        # where applicable
  unavailable_fields: represented by masks, never by dataset-specific code paths
  must_not: >-
    Manufacture relation labels from gold support chains. A label derived from
    the answer is an oracle wearing a feature's clothes.

# --------------------------------------------------------------------------
# E. Graph provenance
# --------------------------------------------------------------------------

graph_provenance:
  views_maintained:
    - G_STRUCT
    - G_KNN
    - G_FULL
  optional_where_clean_ner_edges_exist:
    - G_NER
    - G_STRUCT_NER
  first_use: diagnostics, not a model sweep
  diagnostics_required:
    - candidate_ceiling
    - reach
    - graph_availability
    - incremental_unique_gold_exposure
    - graph_size_and_cost
  sweep_rule: >-
    Provenance does not become a 6 datasets x 4 graphs x 3 models x seeds grid.
    Understand which graph contract is scientifically defensible, freeze ONE
    primary graph for the model comparison, and make provenance an ablation.

# --------------------------------------------------------------------------
# F/G. High-headroom common candidate contract
# --------------------------------------------------------------------------

candidate_contract:
  name: HIGH_HEADROOM_CANDIDATE_CONTRACT
  motivation: >-
    A multi-hop GNN compared inside a candidate pool that withholds the multi-hop
    evidence it was designed to use is not being tested, it is being starved. The
    pool must be generous enough that message passing has something to do.
  construction:
    must_be: parameter-free and model-independent
    may_combine:
      - dense_and_splade_retrieval
      - bounded_struct_expansion
      - bounded_typed_relation_expansion
      - other prospectively justified parameter-free discovery
    must_not: >-
      No learned QLS score and no GNN score may select the candidate universe.
    identical_for: [qls_u_sota_v1, gat, gat_no_mp]
  reported_per_dataset:
    - recall_ceiling@1
    - recall_ceiling@5
    - recall_ceiling@20
    - ANY
    - ALL_full_coverage
    - candidates_per_query
    - nodes_per_query
    - edges_per_query
    - mathematical_max@K
    - normalized_attainable_headroom
  mandatory_separation:
    - candidate_supply
    - ranking_attainment
  ceiling_discipline: >-
    recall_ceiling@K is K-aware and bounds recall@K. candidate_ceiling is pool
    coverage with no K. Confusing them invents headroom on metaqa and webqsp.
  selection_rule:
    prefer: >-
      The smallest prospectively defensible budget at which the ceiling is near
      its knee and/or >= 90% of mathematically attainable recall@5 is reached.
    if_infeasible: >-
      Report the full curve rather than exploding the graph to chase the
      threshold.
    freeze: ONE main candidate contract before any training

# --------------------------------------------------------------------------
# H/I/J. The three objects M3B will train. Declared here, fitted there.
# --------------------------------------------------------------------------

proposed_objects:
  qls_u_sota_v1:
    role: the proposed efficient model
    composition: >-
      One model. S4-style 1536->64 semantic projections plus semantic_difference,
      concatenated with the frozen SOTA_FEATURE_CONTRACT, into one shared
      feed-forward scorer producing one score.
    prohibitions:
      - no learned message passing anywhere
      - no ensemble, no S3 or S4 running beside it
      - no dataset router, no KB-specific head, no passage-specific model
      - no GNN teacher, no GNN hidden-state targets, no distillation
  gat:
    role: the message-passing baseline
    receives: the same base information contract F(q, v)
    additionally_may_access: >-
      The raw frozen graph edges and, where M3A freezes them, typed relation and
      edge attributes. Message passing is the mechanism under test, so access to
      the edges is the treatment, not an unfairness.
    must_not_receive: any gold-derived feature unavailable to QLS-U
  gat_no_mp:
    role: causal control, not a proposed production model
    preserves_as_closely_as_possible:
      - feature contract
      - projection width
      - readout capacity
      - normalization
      - training protocol
    disables: neighbour aggregation
    measures: the increment attributable to message passing itself

# --------------------------------------------------------------------------
# What the record already contains. Prior evidence, not the claim.
# --------------------------------------------------------------------------

prior_repo_evidence:
  source: outputs/sa_mlp_screen/decision.json
  observed_recall@5_seed_0:
    metaqa:   {plain_mlp: 0.1777740288481356, gnn: 0.25547617283292434, sa_mlp: 0.3004071987893109}
    webqsp:   {plain_mlp: 0.27657238459830785, gnn: 0.3110326182408632, sa_mlp: 0.32655165256926644}
  gap_closure_fraction_exceeds_one_on: [metaqa, webqsp, hotpotqa_clean]
  gradient_path: >-
    Verified live in docs/M3_GNN_ARCHAEOLOGY.md. The historical GNNs carried real
    gradient through every convolution, so this is not an artifact of a dead GNN.
  status: >-
    Prior repo-side evidence motivating M3A/M3B. It is NOT promoted to the final
    claim: it was measured before feature parity, before typed relations and
    inside the historical candidate universe. M3B tests whether the mechanism
    survives under a stronger information contract and higher headroom.

# --------------------------------------------------------------------------
# Out of scope
# --------------------------------------------------------------------------

distillation:
  status: OUT_OF_SCOPE
  forbidden_targets:
    - GNN logits
    - GNN rankings
    - GNN hidden states
    - GNN relation attention
    - GNN pseudo-labels
  why: >-
    Feature parity and distillation answer different questions. An MLP taught the
    GNN's outputs is no longer independent of the GNN, so the comparison stops
    isolating message passing.
  if_wanted_later: a separately declared systems phase after the causal comparison is frozen

# --------------------------------------------------------------------------
# Cost discipline
# --------------------------------------------------------------------------

compute:
  status: NOT_YET_FILED
  m3a_is: archaeology, graph construction and diagnostics
  no_training_in_m3a: >-
    QLS-U, GAT and GAT-NO-MP are not trained during M3A. Not a smoke, not a
    pilot, not a single fit.
  must_file_before_heavy_reconstruction_or_encoding:
    - predicted_cpu_hours
    - predicted_gpu_hours
    - graph_storage
    - relation_storage
    - candidate_cache_storage
    - expected_spend
    - hard_ceiling
    - abort_condition

# --------------------------------------------------------------------------
# Gates
# --------------------------------------------------------------------------

launch_authorization:
  authorised_by_review_2026_09_08:
    - filing the completed repository GNN archaeology
    - SOTA literature and code archaeology
    - this M3A declaration
    - typed relation reconstruction
    - universal feature-contract construction
    - parameter-free candidate and headroom analysis
    - graph provenance and headroom diagnostics
    - cost and storage report
  not_authorised:
    - QLS-U training
    - GAT training
    - GAT-NO-MP training
    - M4
    - canonical final confirmation
    - Package F
    - E2 resumption
  gates:
    repo_gnn_archaeology_filed: true
    model_key_frozen: true
    historical_contracts_declared_untouchable: true
    registered_question_recorded_verbatim: true
    sota_archaeology_recorded: true    # docs/M3A_SOTA_ARCHAEOLOGY.md, amendment 1
    feature_contract_frozen: false
    typed_graph_contract_frozen: false
    candidate_contract_frozen: false
    no_leakage_proof_filed: false
    headroom_table_filed: false
    provenance_table_filed: false
    construction_cost_filed: false

stop_condition: >-
  M3A ends only when SOTA_FEATURE_CONTRACT, TYPED_GRAPH_CONTRACT and
  HIGH_HEADROOM_CANDIDATE_CONTRACT are all frozen with schema hashes, graph
  hashes, node alignment, availability masks, a no-leakage proof, a per-dataset
  headroom table, a graph provenance table and construction cost. M3B is then
  PROPOSED, not launched. Review authorises M3B in a separate turn.

# --------------------------------------------------------------------------
# AMENDMENT 1, dated 2026-09-08, filed after the SOTA archaeology and before any
# feature is built. Review sharpened the hypothesis. Nothing above is deleted;
# where this amendment is narrower or wider than a clause above, this governs.
# --------------------------------------------------------------------------

amendment_1_2026_09_08:
  status: RECORDED_BEFORE_ANY_FEATURE_EXISTS
  why_now: >-
    The archaeology is filed and no feature has been built, so the design rule
    can still be committed before the number it will judge.

  what_changed:
    not_the_registered_question: >-
      The scientific_question above is unchanged and remains mandatory wording.
      This amendment changes what F(q, v) is allowed to contain, not what is
      being asked.
    hypothesis_under_test: >-
      Learned message passing may become unnecessary when the useful graph
      computation is compiled into sufficiently expressive fixed or query-local
      structural features before ranking.
    superseded_reading: >-
      The weaker reading -- that an MLP given a GNN's own raw inputs matches the
      GNN -- is NOT the claim, and matching QLS-U's inputs to a SOTA GNN's stated
      input list would delete the mechanism under test.

  feature_admission:
    rule: >-
      A feature is admissible if it is computable at inference without gold
      labels or oracle linking, is defined or explicitly masked on every dataset,
      and is given to BOTH models. Whether a published GNN lists it as an input
      is not a criterion.
    added_converse_of_existing_prohibition: >-
      feature_contract.prohibitions still forbids adding a feature merely because
      a paper contains it. This amendment adds the converse: no feature may be
      refused merely because no paper contains it. The compiled features are the
      method.
    unchanged_prohibitions:
      - no gold-derived feature
      - no oracle topic-entity assignment
      - no dataset ID and no dataset-specific branch
      - no test-split read at any point

  asymmetric_information_design:
    qls_u_receives: F(q, v)
    gnn_receives: F(q, v) + G
    G: the raw graph, typed relations where frozen, and learned message passing
    the_gnn_is_strictly_advantaged: true
    delta: Delta = GNN(F, G) - QLS_U(F)
    delta_measures: >-
      the effectiveness remaining attributable specifically to learned message
      passing after compilation, which is the registered question. It is NOT the
      value of graph access, which both models have.
    sign_not_predicted: true
    why_asymmetry_is_the_conservative_choice: >-
      Handicapping the GNN would make a small Delta uninformative. Advantaging it
      means a small Delta cannot be explained by starving it.

  compilation_targets:
    note: >-
      Directions to build, not yet a frozen contract. Each still has to pass
      feature_contract.required_per_feature before it enters
      SOTA_FEATURE_CONTRACT, and each needs an availability mask.
    A_query_local_topology: >-
      shortest hop distance to any seed, distinct supporting seeds, distinct
      supporting paths, supporting seeds at 1/2/3 hops, unique neighbours
      reached, seed-normalised support, candidate degree, local clustering,
      seed-connected components, fraction of seeds connected. Fixes the four
      known weaknesses of the historical QLS block: edge counts standing in for
      distinct seeds, collapsed distance buckets, walk counts standing in for
      distinct paths, and missing normalisation.
    B_typed_relation_compatibility: >-
      max and mean query-to-relation similarity, top-3 relation match, relation
      frequency, RF-IEF, matching seed-to-candidate relations, two-hop relation
      chains, direction match, per-hop relation-pattern scores. Requires
      TYPED_GRAPH_CONTRACT and is masked on untyped datasets.
    C_deterministic_neighbourhood_embeddings: >-
      mu^(1), mu^(2), mu^(3) as unlearned means of frozen neighbour embeddings,
      kept separate per provenance and relation family, projected 1536 -> 64.
      Fixed aggregation plus a learned interaction, against learned aggregation
      at every layer.
    D_seed_conditioned_deterministic_aggregation: >-
      p^(1), p^(2), p^(3) as unlearned means of frozen embeddings of the seeds
      that reach the candidate at that hop; ranker input [q, d, p^(1), p^(2),
      p^(3)]. Query-dependent aggregation without learned aggregation.
    cost_rule: >-
      C and D are the dominant new storage and compute cost in M3A and must be
      priced in the construction cost report before they are built.

  two_tables_never_merged:
    controlled_comparison: >-
      QLS-U, GAT-NO-MP and GAT, our protocol, our candidates, our metrics, paired
      seeds. This is the only table a Delta may be read from.
    native_external_reference: >-
      NuTrea, ReaRev, GNN-RAG, GraphER, GFM-Retriever reported in their own
      protocols with their own metrics, for context only. No percentage-point
      claim crosses between the tables. PR@K is set coverage, not recall@K.

  external_evidence_recorded:
    source: outputs/m3a/sota_archaeology.json
    grapher_three_arm_ablation: >-
      GraphER's own Table 5 contains a third arm, GraphER-GCS, which the paper
      states is a linear transformation of the initial retrieval scores and is
      therefore parameter-free. At PR@10 the five-layer GATv2 exceeds it by 0.2
      on HotpotQA, 1.9 on 2Wiki and 0.5 on MuSiQue; at PR@5 on HotpotQA the GAT
      is the worst of the three arms.
    status: >-
      MECHANISTIC_EXTERNAL_EVIDENCE. It motivates the compilation hypothesis and
      it is not our result. It does not license any claim about our datasets and
      it does not predict our Delta.

# --------------------------------------------------------------------------
# AMENDMENT 2, dated 2026-09-08. The typed relations M3A planned to reconstruct
# already exist upstream. Recorded before any of the substrate is on this box,
# so the acceptance conditions are fixed before the data can influence them.
# --------------------------------------------------------------------------

amendment_2_2026_09_08:
  status: DECLARED_BY_REVIEW_NOT_YET_VERIFIED_IN_THIS_REPOSITORY
  provenance: >-
    Reported by review from the canonical dataset build, with a transfer manifest
    at transfer/TRANSFER_MANIFEST.md in that project. None of data/final_canonical,
    data/canonical or transfer/ exists in this repository; this repository's data/
    holds three L2 pilot tensors. Every figure below is therefore a DECLARED
    figure, not one this phase has measured.
  verification_rule: >-
    No figure in this amendment may enter a contract, a report or a paper table
    until it has been recomputed here from the delivered artifact. Record the
    recomputation, not this amendment, as the source.

  what_it_changes:
    item_4_is_no_longer_reconstruction: >-
      The authorised item "typed relation reconstruction" becomes ADOPT_AND_ALIGN.
      Building a typed MetaQA or WebQSP graph from scratch is now the wrong move:
      it would duplicate a lossless upstream build and produce a second, divergent
      relation vocabulary.
    typed_graph_contract_verb: reconstruct -> adopt, align, verify, hash
    unchanged: >-
      The historical graph.pt remains untouchable and the adopted substrate is a
      NEW parallel artifact, which is what the phase order already required.

  declared_typed_substrate:
    metaqa:
      relations: 9
      edges: 133582
      losslessness_claim: >-
        source kb.txt 134741 lines -> 133582 distinct triples -> 133582 canonical
        edges, difference exactly 0, all 9 relations intact
      caveat_for_direction_B: >-
        9 relation types is a small vocabulary. Query-to-relation compatibility
        has very low cardinality here, so a null on MetaQA would be weak evidence
        about typed-relation features in general and must not be reported as one.
    webqsp_v1:
      relations: 7058
      triples: 8309195
      nodes: 2592894
      corroboration: both figures declared an exact match to the published RoG figures
      integrity_declared: 0 malformed, 0 dangling endpoints, DISPLAY_NAME_EMPTY_N 0
      blocker: >-
        NO EMBEDDINGS EXIST. The data/canonical/webqsp/ encodings belong to a
        superseded 1316466-node corpus in a dead ID space and must not be joined
        to v1. Until WebQSP v1 is encoded, the semantic feature group is undefined
        on WebQSP and no QLS-U or GAT row may be produced for it.
    untyped_datasets:
      squad:    {relations: 1, reason: manifest states no native graph available}
      musique:  {relations: 1, reason: manifest states no native graph available}
      hotpotqa: {relations: 1, reason: hyperlink graph, single link type}
      2wiki:    {relations: 1, reason: hyperlink graph, single link type}
      consequence: >-
        Relation-family features (compilation target B) are DEFINED on metaqa and
        webqsp and MASKED on the other four. Masked is not zero. This is the case
        the availability_masks clause was written for, and it is now concrete
        rather than hypothetical.

  corrections_to_earlier_figures:
    use_2wiki_universe_not_2wiki: >-
      data/canonical/2wiki/ -- encodings and graph both -- belongs to a superseded
      398354-node corpus. The graph matching the canonical corpus is
      2wiki_universe at 28963600 edges. An earlier audit figure of 359549 edges
      for 2wiki is superseded and must not be cited.
    stale_records_not_to_be_quoted:
      records:
        - path: data/final_canonical/MANIFEST.json
          stale_value: WEBQSP_BLOCKED_ON_FREEBASE_SOURCE / READY_5_OF_6
        - path: data/final_canonical/webqsp/status.json
          stale_value: BLOCKED_PENDING_FREEBASE_SOURCE
      why: >-
        Both predate the WebQSP union CWQ build that is on disk. A phase that
        quoted them would file a blocker that no longer exists.

  declared_known_gaps:
    2wiki_mentions_without_ref_ids: 6194218
    meaning: >-
      hyperlink mentions with no resolvable target curid, so they cannot become
      edges. Nothing was discarded by choice, but the 2wiki hyperlink graph must
      not be described as complete in any report or paper table.
    rev2_encoding_staleness:
      rows: 87859
      of_total: 11223176
      fraction: 0.0078
      composition: {2wiki: 87765, hotpotqa: 94}
      cause: >-
        REV2 gave empty-bodied articles their title as text; the encodings predate
        it, so these rows encoded the empty string.
      remedy: a delta re-encode patch, base shards untouched

  declared_id_bridge:
    character: mechanical rewrite for three corpora, an emitted join table for two
    rules:
      2wiki:    "2wu:<curid> -> 2wiki:c<curid>"
      hotpotqa: "hotpot_<curid> -> hotpotqa:c<curid>"
      metaqa:   "metaqa_ent_<i> -> metaqa:e<i:05d>"
      musique:  exact text join, table emitted
      squad:    exact text join, table emitted
    declared_coverage: full on all five
    declared_unmappable_graph_endpoints: {metaqa: 0, musique: 0, squad: 0}
    musique_off_by_one: >-
      117533 legacy vs 117534 canonical is benign: legacy hashed text alone,
      canonical hashes (title, text), and one paragraph is carried by two titles.
      Both share the one vector, which is correct because the encoder input was
      text only.
    do_not_use: >-
      node_id_map_legacy.json -- it bridges the document space and covers
      essentially no graph endpoints.

  declared_encoder_configuration:
    dense:
      model: Alibaba-NLP/gte-Qwen2-1.5B-instruct
      precision: FP16
      normalized: true
      dim: 1536
      document_prefix: none
      query_prefix_shape: >-
        an Instruct/Query two-line instruction prefix; copy it byte-exact from the
        delivered transfer manifest rather than retyping it here
    splade:
      model: naver/splade-cocondenser-ensembledistil
      pooling: log(1 + relu) max-pool
      vocab: 30522
      max_len: 256
    shard_size: 40000
    why_recorded: >-
      Any WebQSP v1 encode must reproduce this exactly, or WebQSP semantic
      features would sit in a different space from the other five datasets and the
      one-model-for-all-datasets requirement would be silently violated.

  acceptance_conditions_before_item_4_consumes_this:
    - recompute relation count and edge count per dataset from the delivered artifact
    - recompute the MetaQA losslessness chain from kb.txt rather than accepting 133582
    - confirm every graph endpoint maps into the model node row-space, or account for each that does not
    - confirm the substrate carries no gold label and no test-split dependence
    - emit a deterministic digest per adopted graph and record it in TYPED_GRAPH_CONTRACT
    - confirm 2wiki_universe is the graph joined, and that data/canonical/2wiki/ is nowhere on the path
    - state WebQSP embedding status explicitly in every table that contains a WebQSP cell

  comparability_hazard_registered_now:
    hazard: >-
      The canonical substrate is a DIFFERENT corpus from the one M0A-M2D ran on.
      Node counts, edge counts and candidate pools all differ.
    rule: >-
      No QLS-U, GAT or GAT-NO-MP number computed on the canonical substrate may be
      compared to any frozen M0A-M2D number, or placed in a table beside one
      without an explicit substrate column. The frozen results remain valid for
      the substrate they were computed on and are not restated.
    why_now: >-
      This is written before the substrate arrives, so the rule cannot be shaped by
      the first comparison someone wants to make.

# --------------------------------------------------------------------------
# AMENDMENT 3, dated 2026-09-08. Review accepted d291155 and both amendments,
# and locked two decisions. This amendment is the adoption contract: it is
# written while the transfer package is still absent from this box, so no rule
# in it can have been shaped by the data it will judge.
# --------------------------------------------------------------------------

amendment_3_2026_09_08:
  status: ADOPTION_CONTRACT_FILED
  accepts:
    commit: d291155
    amendments: [amendment_1_2026_09_08, amendment_2_2026_09_08]
  package_location:
    corrected_on: 2026-09-08
    correction: >-
      This amendment was first filed saying the package was absent. That was true
      of the paths inside this repository and false about the machine: review
      then identified the CRAG folder. The sections below are unchanged; only the
      premise about where the bytes are is corrected.
    root: C:/Users/Swastik/Desktop/CRAG
    root_is_outside_this_repository: true
    access_mode: READ_ONLY
    access_rule: >-
      The package belongs to another project. Verify in place. Never write to,
      move, rename or re-hash anything under the root, and never copy it into
      this repository. All verification output is a sidecar under outputs/m3a/.
    what_is_present_in_this_repository: data/processed/{2wiki,musique,webqsp}_clean_l2_pilot.pt and data/README.md

  # ------------------------------------------------------------------------
  # Decision 1
  # ------------------------------------------------------------------------
  decision_1_webqsp_encode:
    verdict: YES
    webqsp_status: PRIORITY_DATASET_NOT_OPTIONAL_APPENDIX
    m3b_shape: >-
      M3B is a six-dataset experiment. It may only be planned as five if the
      encode is shown genuinely infeasible under a SEPARATELY FILED compute
      ceiling. Convenience is not infeasibility.
    reasons:
      - richest transferred typed-relation vocabulary, ~7058 declared types
      - relation/query compatibility is therefore meaningfully testable
      - a KB regime where SOTA message-passing systems receive substantial relational information
      - excluding it would weaken the central test of fixed compilation against learned propagation
    compute_record_required_before_encoding:
      - number of missing query embeddings
      - number of missing node/entity/document embeddings
      - encoder identity
      - embedding dimension
      - batch size
      - expected GPU seconds
      - expected walltime
      - expected storage
      - expected cost
      - hard ceiling
    encode_rules:
      do_not_re_encode: anything already present and verified
      encoder_contract: exactly the one frozen for the new canonical substrate
      historical_reuse_forbidden_when: node or corpus identity differs
      why_the_last_rule: >-
        Reusing a historical clean-substrate embedding across a changed node
        space would put WebQSP's semantics in a different space from the other
        five datasets, silently breaking the one-model-for-all-datasets
        requirement without failing any test.

  # ------------------------------------------------------------------------
  # Decision 2
  # ------------------------------------------------------------------------
  decision_2_adoption_verification:
    verdict: YES
    principle: VERIFY_IS_NOT_REBUILD
    rules:
      - transferred typed-relation artifacts must pass independent verification here before adoption
      - do not reconstruct a second relation vocabulary or second graph
      - repair is a later review decision, authorised only if verification fails
      - preserve transferred bytes wherever possible
      - emit sidecar verification and alignment artifacts, never rewrite the incoming source

  # ------------------------------------------------------------------------
  # A-J: the binding sections
  # ------------------------------------------------------------------------
  section_A_transfer_ingest_gate:
    order: inventory first, without modification
    fields_per_artifact:
      - relative path
      - byte size
      - sha256
      - declared source revision
      - schema or version
      - corpus identity
      - node-space identity
      - relation-space identity
    manifest: one immutable transfer manifest
    immutability: >-
      Write-once. A second ingest of the same root must refuse to overwrite and
      must diff against the existing manifest instead.
    blocks: no feature construction before this passes

  section_B_metaqa_losslessness:
    run_locally: true
    why_cheap_enough: the relation vocabulary is only about 9 types
    verify:
      - source triples
      - parsed triples
      - mapped src IDs
      - mapped dst IDs
      - relation IDs
      - relation text
      - direction
      - duplicate handling
      - inverse-edge representation
      - final typed-edge count
    accounting_identity: source = mapped + explicitly rejected/malformed/unmapped
    enumeration_required: every non-mapped row is listed individually, not counted
    upstream_claims_to_establish_independently:
      - 0 malformed
      - 0 dangling
    also_verify: the transferred typed graph is lossless relative to this local reconstruction
    must_not: >-
      Replace the transferred graph with the locally reconstructed one merely
      because they are equivalent. Equivalence is the result, not a licence to
      substitute.

  section_C_webqsp_adoption_verification:
    must_not: independently reinvent the 7058-relation vocabulary
    verify_against: its own authoritative source contract
    minimum_checks:
      - relation vocabulary cardinality
      - relation ID uniqueness
      - relation text uniqueness and collisions
      - src/dst node resolution
      - direction preservation
      - inverse-edge convention
      - malformed rows
      - dangling rows
      - duplicate policy
      - edge-family provenance
      - node-space alignment
    rog_exact_claim:
      recompute_if: the source representation needed for the check is included in the package
      otherwise_status: UPSTREAM_ASSERTED_NOT_LOCALLY_REPRODUCIBLE
      status_meaning: >-
        Not a rejection. It goes to review. What it forbids is recording an
        unreproducible upstream claim as though this phase had measured it.

  section_D_historical_substrates_untouched:
    untouched:
      - clean development substrate
      - old graph.pt
      - frozen M0A-M2D results
    canonical_is: a NEW experimental substrate
    table_rule: every table mentioning historical and canonical results together carries substrate identity
    forbidden_arithmetic: >-
      new canonical QLS-U minus historical S3/S4, presented as a model delta. It
      would be a substrate delta wearing a model delta's clothes.

  section_E_node_space_alignment:
    chain: graph node ID -> canonical document/entity ID -> embedding row -> retrieval row
    property_required: deterministic, and one-to-one where required
    report:
      - N graph nodes
      - N canonical nodes
      - N embedding rows
      - N retrieval rows
      - missing in each direction
      - duplicates in each direction
    blocks: no model result may exist before this alignment is green

  section_F_relation_representation:
    do_not_yet: encode relation text merely because relations exist
    audit_first:
      - relation cardinality
      - relation text quality
      - directionality
      - query coverage
      - frequency distribution
      - entropy and concentration
    regimes_to_contrast:
      metaqa: about 9 types
      webqsp: about 7058 types
    requirement: quantify how different these regimes are before choosing the relation feature representation
    forbidden_generalisation: >-
      A MetaQA null must never be reported as "typed relation features do not
      help". Its relation vocabulary has extremely low cardinality, so the null
      is about that regime and not about typed features.

  section_G_graph_compilation_target:
    contract_is_not_limited_to: features copied from SOTA papers
    research_target: the strongest defensible non-message-passing compilation of graph information
    sota_features_are: evidence about useful information, not a maximum allowed feature list
    retain: directions A, C and D even where no SOTA model uses them
    final_comparison:
      qls_u_receives: F(q, v)
      gnn_receives: F(q, v) + raw graph G
      gnn_is: strictly information-advantaged
    primary_quantity: delta_MP = effectiveness[GNN(F, G)] - effectiveness[QLS-U(F)]
    sign_predicted: false

  section_H_fixed_signal_preservation:
    status: RECORDED_AS_AN_ARCHITECTURE_REQUIREMENT_NOT_AUTHORISED_TO_BUILD
    requirement: >-
      A learned feed-forward scorer must not be allowed to destroy a strong fixed
      graph score because the optimisation failed to preserve it.
    verified_motivating_pattern:
      dataset: MuSiQue
      metric: PR@10
      fixed_gcs: 36.9
      mlp: 32.4
      gat: 37.4
      reading: the learned arm fell 4.5 below a fixed signal it received as an input feature
    to_evaluate_later:
      - score = fixed_base_score + learned_residual
      - any other prospectively declared architecture that can represent the fixed score without relearning it
    do_not: implement or train this during adoption
    symmetry_constraint_added_here:
      rule: >-
        If QLS-U is given a residual-preservation mechanism, the GNN must be able
        to preserve the same fixed score at least as well, by the same mechanism
        or a strictly more expressive one.
      why: >-
        Section G makes the GNN strictly information-advantaged, and delta_MP is
        only interpretable while that holds. A preservation mechanism given to
        QLS-U alone would hand it an architectural advantage the GNN lacks, and a
        small or negative delta_MP could then be explained by the asymmetry
        rather than by compilation. This constraint is recorded now because it is
        cheap now and unfixable after the fits exist.
    tuning_prohibition: this is not authorisation to tune on GraphER

  section_I_headroom_after_adoption:
    do_not_yet: choose candidate budgets from declared upstream numbers
    after: adoption, alignment and the WebQSP encode are complete
    recompute_locally_on_the_canonical_substrate:
      - Dense/SPLADE candidate ceiling
      - STRUCT headroom
      - KNN headroom
      - FULL headroom
    datasets: all six
    ordering_dependency_recorded_here: >-
      WebQSP headroom cannot be computed before the WebQSP encode, because a
      candidate ceiling needs retrieval rows. WebQSP is therefore the last
      dataset to go green in section I, and a five-dataset headroom table is an
      intermediate state, never the filed one.
    status_of_pre_transfer_figures: historical and declarative until reproduced here

  section_J_compute_discipline:
    file_before_any_expensive_step:
      - jobs
      - CPU hours
      - GPU hours
      - walltime
      - storage
      - expected cost
      - hard ceiling
      - abort criteria
    expectation: verification is substantially cheaper than reconstruction
    do_not: >-
      rebuild artifacts merely to increase confidence when hashes plus
      losslessness and alignment checks establish the same thing

  # ------------------------------------------------------------------------
  # Authorisation
  # ------------------------------------------------------------------------
  current_authorization:
    authorised:
      - transfer-package immutable inventory
      - adoption verification
      - MetaQA local losslessness chain
      - WebQSP typed-substrate verification
      - six-dataset node/retrieval/embedding alignment
      - WebQSP missing embedding encode
      - relation-vocabulary diagnostics
      - adoption report
      - exact measured compute/storage report
    not_authorised:
      - construct final QLS-U features
      - construct high-headroom candidates
      - train QLS-U
      - train GAT
      - train GAT-NO-MP
    on_completion: STOP_FOR_REVIEW
    delivery_status:
      blocked: []
      reason: >-
        Superseded by the package_location correction. The package is on this
        machine, so every authorised item has something to read.
      item_6_note: >-
        The WebQSP encode is authorised, but its mandatory compute record derives
        counts from the delivered artifacts, so the record is filed from measured
        counts before the encode starts, not from declared ones.

