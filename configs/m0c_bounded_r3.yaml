# M0C -- repair M0B's R3 causal confound. Zero training.
#
# Status: DECLARED_NOT_LAUNCHED. Filed before any M0C number exists.
#
# M0B measured R3 as scored=Cq_struct=stable_union(Cq,A64), context=
# TARGET_H1(Cq_struct). That changes two things in one step: which nodes are
# scoreable (candidate eligibility) AND how large the surrounding graph
# context is (a second, uncontrolled TARGET_H1 walk seeded from the wider
# pool). On hotpotqa_clean the second effect dominates -- real measured
# median context grew from R2's 1,935 to R3's 126,056, ~65x -- which makes
# any future R2 -> R3 model comparison causally ambiguous: a change in model
# behaviour there could come from structural eligibility, from a vastly
# larger graph, or both, and M0B's own data cannot separate them.
#
# M0C does not rerun or reinterpret M0B. M0B's commits (acceffd, e769a1b),
# results, and regime definitions stand exactly as executed, retained as
# R3_FULL_REEXPANSION -- a real, valuable zero-training systems/structural
# finding ("full graph repair after candidate admission can be pathologically
# expensive on some graph regimes"), cited by name in the results doc, never
# recomputed here. M0C instead measures a second, distinct R3:
#
#   C3 = stable_union(Cq, A64)              -- unchanged from M0B
#   U3_bounded = stable_union(U2, A64)      -- NOT TARGET_H1(Cq_struct)
#
# which admits every structurally-scoreable node into the model's domain
# (C3 subset U3_bounded, proved below, not merely hoped for) without
# performing a second graph walk. This isolates the causal ladder the QLS-
# vs-GNN paper actually needs: R1 -> R2 repairs graph information; R2 -> R3
# repairs candidate eligibility, without recursively re-expanding graph
# information a second time.
#
# This document authorises step 1 only: filing the declaration. It does not
# authorise steps 2-8 (proving scored-set/headroom reuse, building bounded
# U3, recomputing context-dependent diagnostics, invariant verification, the
# corrected feature/regime map, the trained-screen proposal). Each later step
# needs its own artifact before the next runs.

status: DECLARED_NOT_LAUNCHED
this_file_authorises: file_declaration_only
does_not_authorise:
  - the_reuse_proof_run_step_2
  - the_bounded_u3_construction_step_3
  - the_headline_launch
  - any_fitting_of_any_kind
  - modifying_m0b_in_any_way

# --------------------------------------------------------------------------
# M0B is frozen. Nothing below re-derives it with a different algorithm.
# --------------------------------------------------------------------------

do_not_modify:
  commits: [acceffd, e769a1b]
  files:
    - configs/m0b_regime_map.yaml
    - docs/M0B_REGIME_MAP_PROTOCOL.md
    - docs/M0B_REGIME_MAP_RESULTS.md
    - scripts/run_m0b_regime_map.py
    - tests/test_m0b_runner.py
    - tests/test_m0b_declaration.py
    - scripts/modal_m0b_regime_map.py
  a64_construction: >-
    STRUCTURAL_NEIGHBOUR over the structural_only edge family, native
    structural edges, universal +64 cap, parameter-free, dataset-agnostic --
    reused exactly, re-derived (M0B persisted only aggregate statistics, not
    per-query node-ID arrays, so there is nothing to literally load), never
    regenerated with another algorithm or a per-dataset tuned cap.

carried_unchanged_not_recomputed:
  m0b_status: ALL_8_STEPS_COMPLETE_STOPPED_AT_STEP_8
  m0b_headline_scale: 600  # 100 queries x six datasets
  m0b_invariant_breaches: 0
  m0b_actual_compute_usd: 0.088
  m0b_hotpotqa_r2_context_node_count_median: 1935
  m0b_hotpotqa_r3_full_context_node_count_median: 126056
  m0b_hotpotqa_r2_to_r3_full_growth_ratio: ~65x
  m0b_hotpotqa_admitted_node_containment_in_u2: 0.9964  # 15/4167 admitted instances outside U2
  m0b_hotpotqa_is_the_only_dataset_where_a64_recovered_gold_beyond_u2: true
  m0b_webqsp_unrecovered_gold_instances_beyond_u2: 86
  m0b_webqsp_all_gold_at_pool: 0.31
  m0b_metaqa_peak_rss_bytes: 7680409600  # the real six-dataset peak, not webqsp
  source: docs/M0B_REGIME_MAP_RESULTS.md

# --------------------------------------------------------------------------
# Why this does not reopen paper 1's or M0B's own precedent
# --------------------------------------------------------------------------

why_this_does_not_relitigate_prior_declarations:
  the_contract: >-
    configs/candidate_headroom.yaml's diagnostic_contract (candidate_
    regeneration, candidate_admission, graph_expansion all prohibited_in_
    paper_1) is not edited, reinterpreted or relaxed here, exactly as M0A
    and M0B left it. It governs oracle(Cq); M0C, like M0B, studies the
    separate, disclosed object oracle(Cq_struct).
  the_precedent_chain: >-
    configs/m0a_probe.yaml opened the why_a_new_namespace precedent;
    configs/m0b_regime_map.yaml cited it rather than re-litigating it; this
    file cites the same chain a third time. M0C adds nothing new to argue
    here -- it only changes which CONTEXT the already-authorised C3 is
    measured against.
  what_is_new_here: >-
    Only the definition of R3's context. M0B's R3 used TARGET_H1(Cq_struct)
    -- a second, uncontrolled expansion. M0C uses stable_union(U2, A64) --
    bounded, no second graph walk. C3 itself (the scored set) is byte-for-
    byte the same construction in both.

historical_artifacts_are_untouched:
  m0b_results_and_commits: preserved_unmodified  # see do_not_modify above
  m0a_results: preserved_unmodified
  m0a1_results: preserved_unmodified
  packages_a_through_f: preserved_unmodified
  e2: PAUSED_NOT_RESUMED
  f: SEALED_NOT_OPENED
  frozen_pools_hashes_tags: preserved_unmodified
  workspace_migration: false
  test_split_read: false
  feature_selection_by_model_outcome: false
  qls_training: false
  gnn_training: false
  h2_h3_or_a_new_candidate_generator: false

# --------------------------------------------------------------------------
# Regimes and sets
# --------------------------------------------------------------------------

regimes:
  R1:
    name: HISTORICAL
    scored_nodes: Cq
    graph: G[Cq]
    unchanged_from_m0b: true
  R2:
    name: REPAIRED_GRAPH_CONTEXT
    scored_nodes: Cq
    graph: TARGET_H1(Cq)  # == U2
    unchanged_from_m0b: true
    causal_role: "repairs graph information: exposes more topology as context"
  R3_BOUNDED:
    name: STRUCTURAL_ADMISSION_BOUNDED_CONTEXT
    scored_nodes: C3  # == stable_union(Cq, A64), identical construction to M0B's Cq_struct
    graph: U3_bounded  # == stable_union(U2, A64) -- NOT TARGET_H1(C3)
    changes_candidate_oracle: true  # disclosed, inherited from M0B's own disclosure
    causal_role: >-
      repairs candidate eligibility only: permits the bounded A64 subset to
      become scoreable and folds exactly those nodes into the model's
      domain, without a second, uncontrolled graph re-expansion.
    does_not_run: TARGET_H1(C3)
    why_not: >-
      Admitting a node into the scored set does not recursively earn it
      another neighbourhood expansion. Running TARGET_H1(C3) in mainline
      M0C would silently reintroduce the exact confound this phase exists
      to remove.
  R3_FULL_REEXPANSION:
    name: M0B_HISTORICAL_SYSTEMS_CONTROL
    scored_nodes: Cq_struct  # identical to C3 above, different name for the historical object
    graph: TARGET_H1(Cq_struct)
    status: CITED_FROM_M0B_NOT_RECOMPUTED
    role: >-
      Retained as a zero-training systems/structural control: evidence that
      full graph repair after candidate admission can be pathologically
      expensive on some graph regimes (hotpotqa_clean's ~65x growth). Never
      trained on Hotpot or anywhere else. Its numbers in M0C's results doc
      are the exact values already filed in docs/M0B_REGIME_MAP_RESULTS.md,
      not a fresh measurement.

sets:
  Cq: the historical scored candidate set, frozen candidate order, bit-exact -- unchanged
  U2: "TARGET_H1(Cq) -- R2's context universe, unchanged contract, unchanged from M0B"
  A64: >-
    The exact M0B STRUCTURAL_NEIGHBOUR admission at graph_expansion_cap=64,
    re-derived by the identical construction (candidate_expansion_v2.expand,
    method=STRUCTURAL_NEIGHBOUR, budget=ExpansionBudget(hop_cap=1,
    per_seed_cap=16, graph_expansion_cap=64, neighbour_scan_cap_per_seed=
    4096)).admitted), over the same structural_only edge family. Not
    regenerated with another algorithm; not re-tuned per dataset.
  C3: "stable_union(Cq, A64) -- identical construction to M0B's Cq_struct, same object under a name that does not imply a particular context"
  U3_bounded: >-
    stable_union(U2, A64). Cheap: since Cq subset U2 already holds (M0B's
    own u2_contains_cq invariant, re-verified live by M0C, not assumed),
    U2 union A64 == U2 union C3 -- the same set stable_union(U2, A64)
    describes without a second TARGET_H1 walk. A plain np.union1d, not a
    graph traversal.
  why_union_with_a64_rather_than_asserting_a64_subset_u2: >-
    M0B measured real hotpotqa_clean containment = 0.9964 (15 of 4,167
    admitted instances outside U2), and hotpotqa_clean is the only dataset
    where A64 recovered gold beyond U2's own context. Asserting A64 subset
    U2 would silently discard exactly those nodes on exactly the one dataset
    where they mattered. U3_bounded = U2 union A64 guarantees every
    scoreable node is in the model's domain without triggering another
    uncontrolled expansion to reach it.

edge_provenance_family_backing_a64:
  chosen: structural_only
  unchanged_from: configs/m0b_regime_map.yaml#edge_provenance_family_backing_a64
  why: >-
    A64's construction is not reopened by M0C -- the same deterministic
    graph, chosen once in M0B, backs the identical admission rule here.

node_role_under_r3_bounded:
  exactly_one_role_per_node: true
  RETRIEVAL_CANDIDATE: v in Cq
  STRUCTURAL_SCORED_CANDIDATE: v in C3 minus Cq  # == A64, same as M0B
  CONTEXT_ONLY: v in U3_bounded minus C3
  implementation: src/mp_retrieval/overlap_audit.py#node_roles, unmodified
  reused_unmodified_because: >-
    node_roles(cq, scored, context) only requires cq subset scored subset
    context, which holds for (Cq, C3, U3_bounded) by the same containment
    argument as sets.U3_bounded above -- no code change, no new case.

# --------------------------------------------------------------------------
# Datasets -- the same six, same real numbers M0B already filed
# --------------------------------------------------------------------------

datasets:
  squad_clean: {expected_queries: 130319, m0b_measured: true}
  2wiki_clean:
    expected_queries: 15000
    candidate_contract_compatibility: pre_hop_metadata_v1
    m0b_measured: true
  musique_clean:
