# --------------------------------------------------------------------------
# Sampling -- identical to M0B, no new sampling
# --------------------------------------------------------------------------

sampling:
  reuses_m0b_exactly: true
  queries_per_dataset: 100
  split: validation
  selection: deterministic_prefix_of_the_split_order
  why_no_new_sampling: >-
    M0C's entire value proposition is a controlled comparison against M0B on
    the exact same 600 queries. A different sample would reopen the
    question M0C exists to close.
  smoke_sample_step_2:
    queries_per_dataset: 5
    split: validation
    selection: deterministic_prefix_of_the_split_order
    purpose: >-
      Prove scored-set/headroom reuse cheaply, against M0B's own filed
      smoke-stage numbers (outputs/m0b_regime_map/smoke/*.json), before the
      headline-scale container cost is incurred. Mirrors M0B's own step-2/3
      discipline exactly.

# --------------------------------------------------------------------------
# Reuse contract -- what M0C proves rather than assumes
# --------------------------------------------------------------------------

reuse_contract:
  what_is_reused: >-
    Candidate/headroom-side quantities whose meaning is identical between
    R3_FULL and R3_BOUNDED, because neither references U3: candidate counts,
    AnyGold/AllGold/GoldFraction, oracle R@1/R@5/R@20, recovered missing
    golds, rescued queries, provenance of admitted candidates, A64 itself.
  how_reuse_is_proved_not_assumed: >-
    M0B persisted only aggregate per-dataset statistics, never per-query
    node-ID arrays -- there is no literal cache to load. M0C re-derives
    these quantities live, with the identical deterministic construction
    (same frozen candidate pools, same seeds, same A64 rule), and asserts
    the resulting aggregates equal M0B's own filed numbers bit-exactly.
    Re-derivation IS the reuse proof, not a shortcut around it.
  what_is_new_and_actually_recomputed: >-
    Only context-dependent quantities: U3_bounded's node/edge count, isolate
    fraction, radius-1 retention, boundary-cut fraction, candidate-endpoint
    two-hop path retention, seed-relative reach, feature distributions/
    correlations/discrimination/latency/RSS for all nine catalogued
    families, and NODE_ROLE under the bounded partition.
  if_exact_reproduction_fails: STOP_AND_REPORT
  where_the_cross_check_lives: >-
    tests/test_m0c_reuse_against_m0b.py, conditionally skipped when the
    gitignored real outputs are not present locally (mirrors tests/
    test_m0b_declaration.py's own pattern for gitignored artifacts) -- not
    inside the runner itself, which has no access to M0B's downloaded
    outputs inside a fresh Modal container.
  r3_full_reexpansion_is_cited_not_recomputed_in_the_headline_run: >-
    M0C's Modal runner never calls TARGET_H1(C3). Recomputing it would pay
    for the same expensive walk M0B already paid for, for no new
    information, and would work against "M0C must be dramatically cheaper
    than M0B." The systems comparison table cites M0B's already-filed
    R3_FULL numbers directly.

# --------------------------------------------------------------------------
# Feature catalog wiring -- unchanged frozen catalog, narrower rebuild
# --------------------------------------------------------------------------

feature_catalog:
  frozen_declaration: configs/graph_context_pilot.yaml#feature_catalog
  frozen_doc: docs/GRAPH_CONTEXT_FEATURE_CATALOG.md
  reused_verbatim: true
  nine_families: [RETRIEVAL, SEED, GEOMETRY, SUPPORT, PATH, DIFFUSION, TOPOLOGY, PROVENANCE, NODE_ROLE]
  only_context_dependent_families_need_rebuilding: >-
    R1 and R2 feature measurements are unchanged from M0B (same Cq, same
    U2) and are re-derived only as part of the reuse proof, not as new
    measurement. Only R3's feature pass runs over the new U3_bounded.
  provenance_family_is_reused_not_remeasured:
    source: docs/EDGE_PROVENANCE_RESULTS.md
    unchanged_from_m0b: true
  do_not_use_m0b_r3_full_labels_for_bounded_r3: >-
    M0B's docs/M0B_REGIME_MAP_RESULTS.md classification labels were computed
    against R3_FULL's feature distributions. M0C recomputes the same five
    predeclared labels (below, unchanged rules) against R3_BOUNDED's own
    measured distributions -- it does not assume R3_FULL's labels transfer.

# --------------------------------------------------------------------------
# Classification labels -- unchanged rules, reapplied to the corrected map
# --------------------------------------------------------------------------

classification_labels:
  status: PREDECLARED_BEFORE_ANY_M0C_RESULT_IS_READ
  rules_unchanged_from: configs/m0b_regime_map.yaml#classification_labels
  applies_to: one (dataset, regime, feature_family) cell at a time, regime in {R1, R2, R3_BOUNDED}
  legitimate_use_of_gold: >-
    Unchanged: occupancy/redundancy stay gold-blind; any gold-conditioned
    diagnostic is reported separately and never an input to the five labels.

# --------------------------------------------------------------------------
# Systems contract -- unchanged thresholds
# --------------------------------------------------------------------------

systems_contract:
  inherits_thresholds_from: configs/m0b_regime_map.yaml#systems_contract
  latency_factor: 4.0
  peak_rss_bytes_max: 15032385536  # 14 GiB, same container-shape bound
  measured_independently_for: [candidate_admission, u3_bounded_construction, feature_construction, shared_graph_extraction]
  u3_bounded_construction_is_expected_to_be_cheap: >-
    np.union1d over two already-materialised arrays, not a graph walk --
    reported anyway, on the systems contract's own terms, not assumed cheap
    without measurement.

# --------------------------------------------------------------------------
# Invariants -- the eight M0C-specific gates. Any failure stops the stage.
# --------------------------------------------------------------------------

invariants_required:
  - name: scored_r1_equals_scored_r2
    checked: live, per query, in scripts/run_m0c_bounded_r3.py
  - name: oracle_r1_equals_oracle_r2_bit_exact
    checked: live, per dataset, in scripts/run_m0c_bounded_r3.py
  - name: c3_m0c_equals_c3_m0b
    checked: >-
      post-hoc, aggregate-level, in tests/test_m0c_reuse_against_m0b.py
      against outputs/m0b_regime_map/{smoke,headline}/*.json (no per-query
      cache exists to compare against directly -- see reuse_contract above)
  - name: u2_subset_u3_bounded
    checked: live, per query, in scripts/run_m0c_bounded_r3.py
  - name: c3_subset_u3_bounded
    checked: live, per query, in scripts/run_m0c_bounded_r3.py
  - name: admitted_delta_within_universal_cap  # |C3 \ Cq| <= 64
    checked: live, per query, in scripts/run_m0c_bounded_r3.py (overlap_audit.regime_set_invariants, unmodified)
  - name: r3_candidate_and_headroom_metrics_match_m0b_bit_exactly
    checked: post-hoc, in tests/test_m0c_reuse_against_m0b.py
  - name: node_role_partition_is_exhaustive_and_mutually_exclusive
    checked: >-
      inherited proof, not re-verified per query in M0C -- overlap_audit.
      node_roles proves this given cq subset scored subset context (module
      docstring, 200-trial randomized sweep in tests/test_overlap_audit.py),
      unmodified and reused exactly as M0B relied on it.

# --------------------------------------------------------------------------
# Modal deployment
# --------------------------------------------------------------------------

modal:
  app: message-passing-retrieval-m0c-bounded-r3
  result_volume: message-passing-retrieval-data
  storage_root: /root/message-passing-retrieval/storage
  gpu: null
  cpu: 4
  memory_mb: 16384
  timeout_seconds: 3600
  edge_provenance_root: edge_provenance_graphs
  execution_label: execution_1
  spawn_server_side: true
  never_modal_run_detach: >-
    submitted through scripts/spawn_modal_jobs.py so the run survives the
    local process, unchanged discipline from M0A/M0A.1/M0B.
  require_embeddings: false
  require_embeddings_why: >-
    Unchanged from M0B: this runner's only embeddings-shaped argument is
    expand(STRUCTURAL, ...)'s node_embeddings, which STRUCTURAL never
    dereferences.

# --------------------------------------------------------------------------
# Compute -- plan only. NOT FINAL. Final numbers come from the step-2 probe.
# --------------------------------------------------------------------------

compute:
  estimated_before_launch: true
  is_final: true
  final_numbers_deferred_to: step_2_smoke_run_on_real_data  # done; see below
  expected_to_be_dramatically_cheaper_than_m0b: >-
    Confirmed by the step-2 smoke run. R1/R2/A64 construction is the same
    real work M0B paid for (re-derived here as the reuse proof, not
    skipped) and its measured cost lands within noise of M0B's own smoke
    numbers. The saving is specifically R3: U3_bounded is a cheap array
    union rather than a TARGET_H1(Cq_struct) walk, so its build latency is
    sub-millisecond on every dataset, and mainline_r3_bounded_feature p99
    on hotpotqa_clean (115.0 ms) is roughly a tenth of M0B's filed
    R3_FULL_REEXPANSION feature p99 on the same dataset (1,145.0 ms) --
    because the bounded context never re-expands around the newly
    scoreable structural nodes.
  container: cpu_only
  gpu_hours_authorised: 0.0
  reuses_existing_artifacts: >-
    frozen candidate pools, edge-family graphs, confirmation manifests, and
    M0B's own filed per-dataset numbers for the R3_FULL comparison column.
  validate_cheaply_first: >-
    File jobs, CPU-hours, walltime, storage, peak RSS and cost BEFORE
    execution, exactly like M0A/M0A.1/M0B's own two-stage discipline: smoke
    on 5 queries/dataset first, derive a real estimate from that
    measurement, file a ceiling, gate-check, only then launch 100 queries x
    six datasets. Done: the smoke run returned on all six datasets
    (including a retry of musique_clean after the candidate-contract-flag
    fix -- see git history), peak RSS 3.66-7.69 GB per container (well
    under the 16 GB ceiling, highest at 48%, metaqa again the peak exactly
    as in M0B), and the cost below is derived from that real measurement.
  cost_ceiling_usd:
    filed_from_measurement: true
    point_estimate_usd: 0.0553
    point_estimate_derivation: >-
      Derived 2026-09-04 from the step-2 six-dataset smoke run: 6 datasets
      x 100 queries x (R1 feature + R2 build + R2 feature + A64 admission +
      U3_bounded build + R3_bounded feature) per-query cost, using each
      dataset's OWN real p99 measurement for every component -- the same
      method M0B used for its own point estimate, with R3_FULL's walk
      replaced by U3_bounded's array union. Plus each dataset's own real
      cold_start_compile_ms (1.7 ms-11.2 s, once per container, isolated to
      R1 query 0, same convention as M0B), plus the same 30s/container x 6
      residual margin M0B's own updated estimate used (image pull, data
      load, CSR construction). Total 314,117 ms = 0.087255 CPU-hours at the
      $0.634/h CPU rate docs/COMPUTE_LEDGER.md documents -> $0.0553. The
      residual margin (180,000 ms) dominates the real per-query total
      (134,117 ms across all six datasets combined) -- expected, since
      R3_BOUNDED's own cost is now small by construction. Per-dataset
      component table: scripts kept this derivation in the session
      scratchpad, not committed, matching M0B's own practice of filing the
      resulting number and its prose rather than the throwaway script.
    filed_ceiling_usd: 2.00
    ceiling_margin_rationale: >-
      ~36x the point estimate, inside this repo's own established
      convention (docs/COMPUTE_LEDGER.md: every stage files a ceiling
      roughly 30-40x its actual measured cost, e.g. Stage C: $5.15 ceiling
      vs $0.16 actual). Filed as a fixed round number rather than M0B's
      $5.00 verbatim -- M0C's own point estimate is smaller than M0B's
      ($0.0553 vs $0.088), and carrying M0B's ceiling forward unchanged
      would have meant an untethered ~90x margin rather than a re-derived
      one inside the stated band.
    is_final: true
    stop_condition_check: >-
      Not triggered. Peak RSS across all six smoke containers (3.66-7.69
      GB) leaves comfortable headroom under the 16 GB ceiling, and the
      point estimate ($0.0553) is far below the filed ceiling ($2.00), not
      above it. Step 4 (headline launch) may proceed.

# --------------------------------------------------------------------------
# After the map
# --------------------------------------------------------------------------

after_the_map:
  eight_step_plan:
    1: file_this_declaration
    2: prove_scored_set_and_headroom_reuse_against_m0b_on_the_smoke_sample
    3: build_bounded_u3_and_file_a_real_cost_ceiling_from_the_smoke_measurement
    4: recompute_context_dependent_diagnostics_on_the_full_600_query_panel
    5: verify_all_eight_invariants
    6: update_the_dataset_x_regime_x_feature_family_map_with_r3_bounded
    7: propose_not_launch_the_minimum_trained_screen_matrix_mechanically_from_the_corrected_map
    8: hard_stop
  step_7_must_not: >-
    reuse M0B's R3_FULL feature labels as if they automatically apply to
    R3_BOUNDED -- the corrected map is regenerated mechanically from R3_
    BOUNDED's own measured distributions, not inherited from
    docs/M0B_REGIME_MAP_RESULTS.md's proposal.
  step_8_is_a_hard_stop: >-
    No fitting of any kind begins without a further, separate, explicit
    authorisation after step 7's proposal is reviewed.
  standing_prohibitions_restated:
    - no_qls_fitting
    - no_gnn_fitting
    - no_h2_h3
    - no_new_candidate_generator
    - no_d_series_work
    - e2_stays_paused
    - f_stays_sealed
    - no_workspace_migration
