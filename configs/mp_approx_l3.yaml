population:
  rule: >-
    level 0's, recomputed through level 1's population_l1, imported unchanged. The scored ids must equal level 0's
    qids.json in order, and the population rows level 0's q_row.npy.
  sizes: {metaqa: 2400 queries and 165893 U_q rows, 2wiki: 6290 and 245055, squad: 5841 and 176880}
  squad: the control, NOT_READ at levels 0 and 1 (the GNN is not above its twin on any metric within U_q)

compile:   # laptop; one pass per dataset, in level 0's query order
  per_query: >-
    prepare the pools as level 0 did. For each scored query, read the pool's embeddings E. Compile the query's scalars
    with the frozen compile_query_v2 exactly as level 0's scoring stage did, and keep x = scalars[:, the 129 contract
    columns]. Build the message edges with pool_edges, then the v2 edge attributes with the frozen pack_queries_v2
    (family one-hot, weight, rel_compat, rel_mask, dir_fwd, dir_bwd, and K_REL = 4 relation-text slots).
  entries: >-
    taken from the frozen packer's batch: every FULL message edge u -> v whose v is a U_q row, in packed order
    (structural, ner, knn; duplicates kept, as the cell keeps them). Each entry stores v's U_q row, u's halo row, its
    family, its five attributes (float16), and its four slots as dataset-local relation ids (the bank row minus the
    dataset's offset; -1 empty). The self-loop is not stored: the probe adds one per row.
  halo: >-
    per query, the sorted union of the U_q rows and every entry's u. Each halo node stores its level-0 row and its
    depth-0 token as one 322-wide float16 row: B0 = sign(x) log1p(|x|) (129) | the pool z-score of x (129, level 0's
    column_z over the whole pool) | X R (64, level 1's JL matrix). row_halo gives each U_q row its own halo row.
  per_query_extra: >-
    q_tilde = qemb R (64, float32), which must equal level 1's q_tilde.npy exactly; rel_jl = the dataset's relation-text
    rows (context.rel_table.embeddings, the rows the served bank holds at the dataset's offset) times R (n_relations x
    64, float32; empty where the dataset has no typed relation)
  integrity:
    rows: >-
      the pool size equals level 0's q_pool_size, and the in-pool golds equal level 0's U_q rows with is_gold, as
      positions (level 1's integrity.rows)
    scalars: >-
      at every U_q row, x equals level 0's stored x exactly, and the pool z-score equals level 0's stored zx exactly.
      The compile reads the same scalars the models read.
    edges: >-
      level 1's integrity.edges, repeated with its functions: for each twin seed k, the three family prototypes
      recomputed from this pass's edge lists and embeddings with the twin's own projections equal level 0's stored
      channels at every U_q row, to within 2 float16 ulps of the stored value plus 1e-6
    attributes: >-
      the stored entries reproduce the packed batch's rows whose target is a U_q row, in order: u and v exactly, the
      family one-hot and the slots exactly, and the five attributes to float16 rounding. Every U_q row's in-edge
      count equals the packed batch's.
    on_mismatch: hard stop at the first mismatch, naming the query; no tolerance is added afterwards
  outputs: >-
    outputs/mp_approx_l3/<name>/: halo.npy (float16, n_halo x 322), halo_query.npy, row_halo.npy, ent_row.npy,
    ent_halo.npy, ent_family.npy, ent_attr.npy (float16), ent_slots.npy, q_tilde.npy, rel_jl.npy, qids.json, and
    meta.json with every array's sha256, the integrity counts and the sizes; then mirror.json

probe:   # host_gpu_det; cross-fitted with level 0's five folds and its inner split (imported unchanged)
  inputs_per_row: >-
    b_v: level 0's B0 row of the U_q row (258: sign(x) log1p(|x|) | zx), standardised with level 0's rule (per fold,
    training rows only; sd < 1e-6 gives 0; clipped to [-8, 8]). n_u: a halo row (322), standardised by the same rule
    over the halo rows of the training queries. eps_e: the entry's family one-hot over (structural, ner, knn, self) (4) |
    its five attributes | rel_text (64), the mean of rel_jl over the entry's valid slots times 8, zero without a slot.
    The self entry has the self one-hot, zero attributes and no slot. q_tilde: the query's (64).
  L3_att: >-
    score_e^h = a_h . LeakyReLU_0.2(W_u n_u + W_v [n_v | q_tilde] + (W_q q_tilde) * (W_e1 eps_e) + W_e2 eps_e), with 4 heads of
    width 16 (every W maps to 64), the cell's form of score over fixed inputs. alpha_e^h is the softmax of score_e^h over
    the row's entries and its self entry. m_v = the concatenation over heads of sum_e alpha_e^h value_e^h, with value_e =
    W_val [n_u | eps_e] (64). Readout: Linear(258 + 64, 128), GELU, Linear(128, 128), GELU, Linear(128, 1) on [b_v | m_v].
  L3_mean: L3_att with every score held at 0, so alpha is uniform over the row's entries and its self entry
  B0_mlp: level 0's ProbeMLP (Linear(258, 128), GELU, Linear(128, 128), GELU, Linear(128, 1)) on b_v
  objectives:
    MSE: >-
      level 0's: the mean over rows of (the within-query-centred prediction minus the centred target) squared
    LIST: >-
      per query and seed k, KL(softmax(z(G_k)) || softmax(z(T_k) + rhat)) over the query's U_q rows, at temperature 1,
      averaged over the queries of the minibatch. The teacher is the GNN's own score list; no gold enters any loss.
      Its optimum is rhat = r_k up to a constant, so it fits the same target as MSE and weights the errors toward the
      top of the GNN's ranking.
  fitting: >-
    level 0's for every probe: model built on the CPU after torch.manual_seed(1000 + 10 k + fold), then moved to the
    GPU; minibatch order from numpy default_rng(the same seed); AdamW lr 1e-3, weight decay 1e-4; minibatches of 64
    queries (all their U_q rows); at most 30 epochs; stop after 3 epochs without an inner-validation improvement of the
    probe's own objective, and restore the best epoch. Out-of-fold predictions are within-query centred.
  grid:
    r_k: [B0-mlp, B0-list, L3-mean, L3-att, L3-list]   # -list: the LIST objective; every other probe MSE
    e_k: [B0-mlp, L3-mean, L3-att]                     # e_k = z(G_k) - z(G0_k), the GNN's edge effect, MSE
  units: >-
    one unit per (target, probe): the three seeds times five folds, written atomically with its fit log and skipped on
    a restart. The order within a job: r's L3-att first, then the rest of r's grid, then e's.
  repeat: >-
    metaqa's unit (r, L3-att) is fitted again in a fresh process into repeat/, after metaqa's grid. The job files
    whether every out-of-fold prediction is bit-identical, and the largest absolute difference.

quantities: >-
  level 0's, computed by level 0's functions (per_query_measures, read_family, reproducibility, strata_masks) over this
  file's probes, with level 0's bootstrap: one resample matrix per dataset (1000 resamples, default_rng(0)), so every
  contrast is paired. References: ref:twin, ref:other_seed (r) and ref:no_edge, ref:other_seed (e), recomputed from the
  targets as level 0 does. The read runs on the host, in the dataset's job, after its probes.
statistics:
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    query_weighting: rho_bar(L3-att) - rho_bar(L3-mean) on r -- learned query-conditioned weighting against uniform weighting of the same neighbourhood
    neighbourhood: rho_bar(L3-mean) - rho_bar(B0-mlp) on r -- the fixed neighbourhood read uniformly, against node-local alone
    attention_over_node_local: rho_bar(L3-att) - rho_bar(B0-mlp) on r
    objective_node_local: rho_bar(B0-list) - rho_bar(B0-mlp) on r
    objective_attention: rho_bar(L3-list) - rho_bar(L3-att) on r
    edge_weighting: rho_bar(L3-att) - rho_bar(L3-mean) on e
    edge_neighbourhood: rho_bar(L3-mean) - rho_bar(B0-mlp) on e

readings:   # filed before any number; per dataset, no pooled reading
  primary_probe: L3-att on r_k (the MSE objective, as the primary of every earlier level)
  bands:   # of rho_bar, level 0's thresholds
    L3_HIGH: rho_bar >= 0.75 and its interval's lower end >= 0.50
    L3_LOW: rho_bar <= 0.25 and its interval's upper end <= 0.50
    L3_MID: neither
    NOT_READ: the dataset has no readable metric (squad is expected here; the control, not a failure)
  exactly_one: per dataset, the band of the primary probe is the dataset's reading
  flags:
    FIT_NOT_RANK: a probe with R2 >= 0.5 whose band is L3_LOW
    SEED_BOUND: mean reproducibility of r below 0.5
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l3_high: >-
      primary L3_HIGH: one-hop query-conditioned weighting of fixed compiled features predicts the GNN's ranking effect
      within U_q on that dataset (an upper bound, not a full-pool claim). Being the ceiling of the compiled-moment
      family, it licenses the compiled-moment arm (phi(q,v)^T psi(u) with compiled sum psi(u)(W h_u)^T and sum psi(u))
      as the next file.
    l3_weighting_adds: >-
      the query_weighting interval above 0 while the primary is L3_MID or L3_HIGH: the learned weighting, not the
      neighbourhood alone, carries part of the effect. With L3_MID it also licenses the compiled-moment arm, whose
      question is how much of the ceiling survives compilation.
    l3_low_weighting_flat: >-
      primary L3_LOW with the query_weighting interval's lower end at or below 0. The fixed rungs tested so far (levels
      0, 1 and the ceiling of 3) do not reproduce the GNN's ranking effect even with oracle access to its outputs. The
      remaining fixed rungs (typed paths, neighbour moments) each need their own file. Until one of them reads higher,
      the evidence places the effect in learned multi-step state, the part of message passing no rung has compiled.
    neighbourhood_adds: the neighbourhood interval above 0 -- fixed neighbour rows read uniformly already add over node-local alone
    objective_adds: >-
      either objective interval above 0: the probe's objective limits recovery, not only its features. The MSE
      readings of earlier levels then understate their features' capacity; re-reading them under LIST needs its own
      file, host-native.
    objective_flat: >-
      both objective intervals reach 0 or below: FIT_NOT_RANK is not an artefact of the MSE objective alone
    edge_effect_weighted: >-
      the band of L3-att on e is L3_HIGH, or edge_weighting's interval is above 0: the GNN's own edge effect is read
      by one-hop weighting of fixed rows
  wording: >-
    every probe is an oracle fit on the GNN's own outputs over V2_GATE queries of the same dataset. Recovery is a
    statement of capacity within U_q, never of a deployable model. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins"; low and high recovery are both results.

compute:
  compile: >-
    laptop, 6 threads, one lane per dataset, up to three at once. Level 0's compile plus nine forwards took 70, 13 and
    8 min, and level 1's pool pass 7.1, 4.7 and 2.5 min, so about 10 to 30 min per dataset.
  sizes: >-
    halo rows are 644 bytes and entries about 36 bytes. Estimate: about 0.3 to 1.5 GB for metaqa, 0.1 to 0.4 GB for
    2wiki and 0.1 to 0.2 GB for squad; the compile's meta.json files the exact numbers
  transfer: level 0's subset is about 0.67 GB; at the measured 1.1 to 1.2 MB/s, about 10 min plus the compiled sidecars
  probes: >-
    per dataset, 8 units of 15 fits on the GPU (metaqa 9 with the repeat). Minibatches are a few thousand rows and up to
    about 10^5 entries, so a fit is expected to take seconds to about a minute
  disk: host workspace outputs/mp_approx_l3/ and laptop outputs/mp_approx_l3/, git-ignored
  resumable: every compile chunk and every probe unit is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's included
  - the population digest or count, the ids, the halves or the population rows differ from the declared or level 0's
  - a held, select, fit or test row would be compiled
  - integrity.rows, integrity.scalars, integrity.edges or integrity.attributes fails
  - mirror_verification fails, or a host job's placement settings read back differently from host_gpu_det_as_tested
  - the host jobs' recorded code sha256 values are not one set equal to the committed files

outputs:
  script: scripts/mp_approx_l3.py (stages compile, mirror, probe, repeat, read, run, doc, file)
  sidecars: outputs/mp_approx_l3/<name>/ (the compiled arrays and meta.json; mirror.json; probes/ with the out-of-fold predictions, fit logs and probe_meta.json; repeat/; read.json)
  record: outputs/mp_approx_l3/record.json, assembled on the laptop from the host's per-dataset read.json files without arithmetic
  document: docs/MP_APPROX_L3.md
  run_record: run_record_mp_approx_l3_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l3.py
  - this file parses; its pins are the files' current sha256; level 0's pins pass; the JL matrix has the declared digest
  - the placement spec equals configs/gpu_task_qualification.yaml's host_gpu_det spec (env, threads, mode, TF32 off)
  - the halo row of a U_q row reproduces its B0 (to float16) and the entries of a random packed batch reproduce its edge_attr rows whose target is kept
  - L3-att's attention sums to 1 per row and head; L3-mean's is uniform; a row without an in-edge reads only its self entry
  - L3-att with every score at 0 equals L3-mean on the same weights; the LIST loss is 0 when rhat = r_k plus a constant and positive otherwise
  - the probe's forward is invariant to the order of a row's entries
  - the bands carry the L3 labels; the contrasts are the declared pairs
  - no held query id appears in any sidecar

execution:
  order: >-
    this file alone (commit); push of level 0's subset for metaqa, 2wiki, squad (background); script and tests (commit);
    compile metaqa, 2wiki, squad (laptop); mirror and push each dataset's sidecar; one host job per dataset (probe,
    metaqa's repeat, read), each submitted as its data lands; fetch; record, doc and run record on the laptop (commit)
  stop_after_run: STOP_FOR_REVIEW

