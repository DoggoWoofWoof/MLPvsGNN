transfer:   # a declared step of this stage
  what: >-
    per dataset: level 0's meta.json, qids.json, query.npy, local.npy, is_gold.npy, x.npy, zx.npy, z.npy and the
    q_*.npy arrays (q_fold, q_metrics, q_gold_total, q_hop, q_first_support_STRUCT, q_row, q_pool_size, q_uq_size), plus
    this file's compiled sidecar (below). Level 0's channels, bodies and messages are not sent, and no level 1 file is
    sent: no probe here reads them.
  how: >-
    rx push --inputs, with --force where the push exceeds push.max_mb 512 (that guard is a convenience while this push
    is declared here). Order: metaqa, 2wiki, squad; squad, the control, goes last. The code arrives as the git-tracked
    tree. No token or credential goes to the host.
  mirror_verification: >-
    the laptop writes outputs/mp_approx_l3/<name>/mirror.json, with the sha256 of every file sent for that dataset, and
    sends it with them. Before any read, the host job recomputes the sha256 of every one of those files and compares
    it with mirror.json. It then checks level 0's arrays against level 0's meta.json (whose sha256 is pinned in
    inputs) and this file's arrays against its compile meta.json. Any difference is a hard stop. The run record pins
    mirror.json's sha256 as computed on the laptop and on the host.

