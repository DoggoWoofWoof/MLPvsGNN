corrections_to_the_proposal:   # checked against the code before this file was written
  exact_attention_is_the_ceiling: >-
    The proposal's level 3 approximates the cell's attention kernel as K(q,v,u) ~ phi(q,v)^T psi(u), with compiled
    moments sum_u psi(u)(W h_u)^T and sum_u psi(u). With psi fixed, any such kernel weighting over the same fixed
    neighbour features is one member of the family that an exact softmax attention with a learned score function
    spans. This file therefore runs the exact one-hop attention first, as the ceiling of the compiled-moment family.
    The compiled-moment arm (random or fixed feature maps psi) is opened only by an entry of the interpretation map
    below, and then as its own file.
  one_hop_no_learned_state: >-
    The GNN runs three steps of its cell, and every step reads the learned states of the step before. A second attention
    hop here would read a learned state of the neighbour, which is learned neighbour-state propagation: a GNN, not a
    compilation. So the probe has one hop. What the neighbour contributes is its own fixed compiled row.
  the_twin_channels_are_not_used: >-
    Level 0's B1 holds the twin's learned vector channels (depth-1 family prototypes times q_state). They are a learned
    representation from the twin's training and are not compiled features. They are left out of every base here, and
    beyond_twin_channels is not re-measured. Level 1 measured it.
  the_uniform_control: >-
    Level 1's contrast with fixed mean propagation used different inputs and a different probe. Here the control for
    query-conditioned weighting is the same probe with its attention logits held at 0. That is uniform weighting over
    the same entries, with the same features, values and readout. Only the weighting differs.

this_file_does_not_touch:
  fits: >-
    nothing is fitted except the probes, which are cross-fitted analysis models. The three twin checkpoints are read on
    the laptop only, for the integrity check of the edge lists (level 1's integrity.edges, repeated). No GNN is run:
    every target comes from level 0's sidecars.
  rows: >-
    level 0's U_q rows exactly: the same queries (qids.json), the same pool positions (local.npy). V2_HELD_CONFIRMATION
    rows leave the population before anything is compiled, as at levels 0 and 1. All three eval splits are dev splits;
    no test row is read.
  frozen: >-
    M2-M3B, universal-v2, UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU task-level qualification,
    and levels 0 and 1 (their declarations, scripts, tests, sidecars, probes, records and documents) keep their bytes.
    Level 0's and level 1's scripts are imported unchanged.
  package: the CRAG package is read-only. Nothing is written under its root and nothing from it enters git or goes to the host
  competitors: no probe output, feature, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

