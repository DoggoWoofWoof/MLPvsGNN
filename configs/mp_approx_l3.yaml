extends: >-
  configs/mp_approx_l1.yaml (RUN at 4bc530b). Its interpretation entry l1_low_tokens_flat fired on metaqa and 2wiki. That
  entry "points past levels 1 and 2 to query-conditioned neighbourhood weighting (level 3, attention-kernel moments) as the
  next file". This is that file. Level 2 stays unopened. Level 3 reads level 0's U_q rows and targets, pinned by sha256,
  and rewrites nothing of level 0 or level 1.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  Extend level 0's node-local information with a one-hop, query-conditioned attention readout over each candidate's
  in-neighbours in the pool graph the GNN's cell reads (FULL edges plus a self-loop). Every key and value a candidate
  receives is a fixed function of compiled features; only the weighting and the readout are learned, and no learned
  neighbour state is propagated. How much of the trained GNN's residual over its matched twin, and of its edge effect,
  can such a probe predict? How much of that is the learned weighting, measured against uniform weighting of the same
  neighbourhood? And how much does the answer change when the probe is fitted to reproduce the GNN's own ranking within
  U_q (a listwise objective on the GNN's scores, never on golds) instead of its residual values?
role: >-
  Measurement only, as at levels 0 and 1. The GNN's outputs are the probes' targets, which the proposal allows "only to
  measure approximation capacity". No probe, feature, target or number of this file enters QLS-U, the twin, a feature
  contract, M3, M4 or any selection. A model that used these features without GNN outputs would be a competitor and
  needs its own declaration under the QLS-U contract. This file does not open one.

