experiment: message_passing_phase_diagram
status: preregistration_draft

primary_comparison: gcn_minus_parameter_matched_mlp
seeds: [0, 1, 2, 3, 4]

one_factor_sweeps:
  random_edge_addition: [0.0, 0.1, 0.25, 0.5, 1.0]
  degree_preserving_rewire: [0.0, 0.1, 0.25, 0.5, 1.0]
  edge_deletion: [0.0, 0.1, 0.25, 0.5, 0.75]
  edge_type_corruption: [0.0, 0.1, 0.25, 0.5, 1.0]
  feature_masking: [0.0, 0.25, 0.5, 0.75, 1.0]
  feature_gaussian_noise_snr_db: [30, 20, 10, 5, 0]
  training_fraction: [0.05, 0.1, 0.25, 0.5, 1.0]
  message_passing_layers: [0, 1, 2, 4, 8]

joint_design:
  method: sobol
  regimes_per_dataset: 128
  heldout_design_fraction: 0.25
  never_tune_on_heldout_design: true

crossover:
  metric: recall_at_5
  practical_margin_percentage_points: 1.0
  confidence: 0.95

predictor:
  target_regression: gnn_minus_mlp_recall_at_5
  target_classification: gnn_wins_by_practical_margin
  models: [linear_interaction, monotonic_gam]
  validation: leave_one_dataset_out
  inputs:
    - positive_neighbor_lift
    - relevant_neighbor_coverage
    - feature_alignment_lift
    - degree_mean
    - degree_gini
    - hubness_max_over_mean
    - directed_density
    - edge_type_entropy
    - feature_snr
    - training_size

