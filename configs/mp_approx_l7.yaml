extends: >-
  configs/mp_approx_l5.yaml (RUN at 0a21dfe) and configs/mp_approx_l6.yaml (RUN at 59b031d). On 2wiki, on r_k (the
  trained GNN over its matched twin), level 5's factorised kernel L5-kern read 0.746 [0.706, 0.789], 0.929 of learned
  one-hop attention's gain over the node-local probe (kernel_share [0.892, 0.966]; L3-att 0.799, B0-mlp 0.055), and
  level 6's three-step recurrent kernel read L6_HIGH 0.821. On metaqa every probe of both files read LOW. squad was
  NOT_READ at every level, as the control. Level 6 did not trigger the decomposition (advisor_ideal no). This file asks
  what the kernel keeps when its neighbour side may read only query-free inputs. It opens no later level and no
  deployable model.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  Does level 5's one-hop factorised kernel keep its recovery on 2wiki when psi and the values read only query-free
  inputs, so that its moments C_v = sum psi val^T and c_v = sum psi no longer depend on the query? Operationally: the
  same kernel, readout and fitting as L5-kern, with the neighbour side [n_u | eps_e] replaced by [X_u R | eps_e's
  query-free columns]. The receiver side phi = softplus(W_phi [n_v | q_tilde]) is unchanged. How much of r_k (primary)
  and of e_k does it recover, set against the refitted L5-kern, level 3's one-hop attention, the node-local probe, a
  variant that keeps the pool-relative edge weight, and a query-free neighbour mean with uniform weights?
role: >-
  Measurement only, as at levels 0 to 6. The GNN's outputs are the probes' targets, which the proposal allows "only to
  measure approximation capacity". No probe, kernel, target or number of this file enters QLS-U, the twin, a feature
  contract, M3, M4 or any selection. The deployable 2wiki compiled-kernel model is a competitor trained without GNN
  outputs, and it needs its own declaration under the QLS-U contract. This file does not open it. The file only
  measures which form that declaration can take.

