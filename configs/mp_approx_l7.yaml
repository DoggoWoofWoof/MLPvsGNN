corrections_to_the_proposal:   # checked against the code and the level 3 sidecars before this file was written
  what_depends_on_the_query: >-
    Level 3's halo row n_u holds sign(x) log1p|x| (129) and the pool z-score of x (129), where x is the candidate's
    query-conditioned feature row, then X_u R (64), the node's served embedding times level 1's R. Only X_u R is
    query-free. eps_e holds the family one-hot (structural, ner, knn, self), five attributes (weight, rel_compat,
    rel_mask, dir_fwd, dir_bwd, the order of m3b_features.EDGE_ATTR) and rel_text (64). weight is w over the largest w
    of the entry's family among the pool's edges, so it depends on the pool. rel_compat is cos(q, e_r), so it depends
    on the query. rel_mask, dir_fwd, dir_bwd, the family and rel_text are query-free.
  two_conditions_for_compile_once: >-
    Moments compiled once per node need (a) a query-free neighbour side, which this file tests, and (b) a fixed
    neighbourhood. Level 3's entries are in-pool: the first 64 in-pool neighbours per family, in the store's order. So
    even with (a), which entries exist still depends on the pool, and the moments over them are per pool. A node-level
    moment would sum over the neighbourhood without the pool test, and that neighbourhood includes nodes outside the
    pool. The level 3 sidecars hold no row for a neighbour outside the pool, so (b) is not tested here. Testing it
    needs the package (the host mirror), and it belongs to the deployable file. With (a) alone, psi and the values of
    every edge are query-free and can be computed once per edge. At query time only phi and the sum over the pool's
    entries remain.
  the_weight: >-
    The store's raw edge weight is query-free, but level 3's sidecar holds only the pool-relative weight. L7-qi drops the
    weight. L7-qw keeps the pool-relative weight, so weight_cost measures what that column carries. A query-free kernel
    with the raw weight cannot be fitted from these sidecars.
  what_each_dataset_carries: >-
    From the level 3 sidecars (entries per family, attributes that are non-zero). On 2wiki (and squad), structural
    entries carry direction only: there are no typed relations, rel_jl is empty, and rel_compat and rel_mask are 0.
    NER and kNN entries carry only the weight. So on 2wiki L7-qi's edge side is the family and the direction, and
    L7-qw's adds the weight. L7-qw differs from L5-kern there only in the halo's 258 query-dependent columns. On
    metaqa, structural entries (88%) carry rel_compat, the relation mask, direction and the relation text. Both
    L7 variants drop rel_compat and keep the text. phi reads q_tilde, so the kernel phi^T psi can still weight a
    relation by its fit to the query.
  the_self_entry: >-
    psi and the value of the self entry read [X_v R | the self entry's query-free eps]. The receiver's query-dependent
    columns still reach the model through phi and through b_v in the readout.
  refitted_not_borrowed: >-
    B0-mlp and L3-att are refitted with level 3's fit_units, and L5-kern with level 5's fit_units, both imported
    unchanged, because the host-native protocol names one commit per stage. Whether each refitted unit is bit-identical
    to the filed unit of the same name is filed as a flag (L3_REFIT_DIFFERS, L5_REFIT_DIFFERS). Level 6's refits were
    bit-identical. No earlier number enters a contrast.

