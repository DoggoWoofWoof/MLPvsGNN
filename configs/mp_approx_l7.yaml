population:
  rule: level 0's, through level 3's sidecars (qids.json equal to level 0's, in order)
  sizes: {metaqa: 2400 queries and 165893 U_q rows, 2wiki: 6290 and 245055, squad: 5841 and 176880}
  squad: the control, NOT_READ at levels 0, 1, 3, 4, 5 and 6 (the GNN is not above its twin on any metric within U_q)

probe:   # host_gpu_det; cross-fitted with level 0's five folds and its inner split (imported unchanged)
  inputs_per_row: b_v, n_u, eps_e and q_tilde exactly as level 3 builds them (level 3's ProbeData, imported unchanged); n_u standardised with the fold's training-query statistics, as at levels 3 to 6
  B0_mlp, L3_att: level 3's probes, refitted with level 3's fit_units (imported unchanged)
  L5_kern: level 5's probe, refitted with level 5's fit_units (imported unchanged)
  L7: >-
    level 5's factorised kernel with the neighbour side restricted. kappa_e^h = phi_h(v)^T psi_h(u, e), with phi =
    softplus(W_phi [n_v | q_tilde]) (level 5's, 322 + 64 -> 4 x 32), psi = softplus(W_psi s_ue) (-> 4 x 32) and the
    values val_e = W_val s_ue (-> 4 heads of 16). s_ue is the neighbour side: X_u R (n_u's columns 258-321, 64) and
    eps_e's query-free columns (71). Over the row's entries and its self entry, alpha = kappa over its sum, per head.
    m_v = sum alpha val, and level 3's readout reads [b_v | m_v]. psi and the values read nothing that depends on the
    query or the pool, so C_v = sum psi val^T and c_v = sum psi over a fixed set of entries depend on nothing else, and
    m_v = phi^T C_v / phi^T c_v.
  arms:
    L7-qi: the neighbour side X_u R and eps_e's query-free columns (135 inputs); the primary
    L7-qw: the neighbour side of L7-qi plus eps_e's pool-relative weight (136 inputs); not compile-once, a diagnostic of what the weight carries
    L7-qi-mean: no kernel; alpha is uniform over the row's entries and its self entry; the values are L7-qi's (the query-free neighbour mean)
    L7-qi-list: L7-qi under level 3's LIST objective
  objectives: level 3's MSE and LIST, unchanged (LIST on r only; no gold enters any loss)
  fitting: level 3's (seed 1000 + 10 k + fold; AdamW lr 1e-3, weight decay 1e-4; 64 queries per minibatch; at most 30 epochs; patience 3; best epoch restored; evaluation in batches of 128 queries)
  grid:
    r_k: [B0-mlp, L3-att, L5-kern, L7-qi, L7-qw, L7-qi-mean, L7-qi-list]   # L7-qi-list: the LIST objective; every other probe MSE
    e_k: [B0-mlp, L3-att, L7-qi]
  units: >-
    one unit per (target, probe): the three seeds times five folds, written atomically with its fit log and skipped on
    a restart. The order within a job: r's L7-qi first, then the rest of r's grid in the order above, then e's.
  repeat: 2wiki's (r, L7-qi) again in a fresh process into repeat/; the comparison is filed

quantities: >-
  level 0's, computed by level 0's functions (per_query_measures, read_family, reproducibility, strata_masks) over this
  file's probes, with level 0's bootstrap: one resample matrix per dataset (1000 resamples, default_rng(0)), so every
  contrast is paired. References: ref:twin, ref:other_seed (r) and ref:no_edge, ref:other_seed (e), as level 0 computes them.
statistics:
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    deploy_cost: rho_bar(L7-qi) - rho_bar(L5-kern) on r -- the query-free neighbour side against the full one (the primary contrast)
    halo_cost: rho_bar(L7-qw) - rho_bar(L5-kern) on r -- the halo's query-dependent columns and rel_compat dropped, the weight kept
    weight_cost: rho_bar(L7-qi) - rho_bar(L7-qw) on r -- the pool-relative weight dropped
    qi_vs_attention: rho_bar(L7-qi) - rho_bar(L3-att) on r
    qi_over_node_local: rho_bar(L7-qi) - rho_bar(B0-mlp) on r
    query_conditioning: rho_bar(L7-qi) - rho_bar(L7-qi-mean) on r -- the query-conditioned kernel against the query-free neighbour mean
    objective: rho_bar(L7-qi-list) - rho_bar(L7-qi) on r
    kernel_vs_attention: rho_bar(L5-kern) - rho_bar(L3-att) on r -- level 5's contrast, drawn again (descriptive)
    edge_qi_vs_attention: rho_bar(L7-qi) - rho_bar(L3-att) on e
  shares:   # descriptive; point and 95% percentile interval over the same resamples; read only where the denominator's interval lies above 0
    qi_share: (rho_bar(L7-qi) - rho_bar(B0-mlp)) / (rho_bar(L5-kern) - rho_bar(B0-mlp)) on r -- the part of the kernel's gain over node-local that the query-free kernel keeps
    qi_attention_share: (rho_bar(L7-qi) - rho_bar(B0-mlp)) / (rho_bar(L3-att) - rho_bar(B0-mlp)) on r -- the same in units of attention's gain
  strata_contrasts: >-
    descriptive: deploy_cost, qi_vs_attention and query_conditioning within each of level 0's strata (metaqa by hop), by
    the same functions over the stratum's queries. A stratum's contrast is shown only where the stratum has a readable
    metric, and it is never a reading.

readings:   # filed before any number; per dataset, no pooled reading
  primary_probe: L7-qi on r_k (the MSE objective, as the primary of every earlier level)
  bands:   # of rho_bar, level 0's thresholds
    L7_HIGH: rho_bar >= 0.75 and its interval's lower end >= 0.50
    L7_LOW: rho_bar <= 0.25 and its interval's upper end <= 0.50
    L7_MID: neither
    NOT_READ: the dataset has no readable metric (squad is expected here; the control, not a failure)
  exactly_one: per dataset, the band of the primary probe is the dataset's reading
  flags:
    FIT_NOT_RANK: a probe with R2 >= 0.5 whose band is L7_LOW
    SEED_BOUND: mean reproducibility of r below 0.5
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    L3_REFIT_DIFFERS: a refitted B0-mlp or L3-att unit is not bit-identical to level 3's filed unit of the same name (the unit and its largest difference are filed)
    L5_REFIT_DIFFERS: the refitted (r, L5-kern) unit is not bit-identical to level 5's filed unit (its largest difference is filed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l7_high: >-
      primary L7_HIGH: the one-hop kernel with a query-free neighbour side predicts the GNN's ranking effect within U_q
      on that dataset (an upper bound, not a full-pool claim)
    qi_not_below_kernel: the deploy_cost interval's upper end at or above 0 -- no measurable loss from a query-free neighbour side
    qi_below_kernel: the deploy_cost interval below 0 -- the query-free neighbour side recovers less than the full one
    qi_above_node_local: the qi_over_node_local interval above 0
    halo_carries: the halo_cost interval below 0 -- the halo's query-dependent columns (and rel_compat) carry recovery that X_u R and the query-free edge columns do not
    weight_carries: the weight_cost interval below 0 -- the pool-relative weight carries recovery
    conditioning_adds: the query_conditioning interval above 0 -- the query-conditioned kernel recovers more than the query-free neighbour mean
    qi_not_below_attention: the qi_vs_attention interval's upper end at or above 0
    objective_adds: the objective interval above 0 -- the objective limits recovery, not only the operator
    edge_effect_l7: the band of L7-qi on e is L7_HIGH, or edge_qi_vs_attention's interval reaches 0 or above
  cross_dataset:   # at the doc stage, from the per-dataset entries above only; no number is pooled
    compile_once_supported: 2wiki lists qi_not_below_kernel and qi_above_node_local
    compile_once_partial: 2wiki lists qi_below_kernel and qi_above_node_local
    compile_once_not_supported: 2wiki does not list qi_above_node_local
    weight_needed: 2wiki lists weight_carries
    kernel_reference_held: 2wiki's qi_share denominator lies above 0 (the refitted kernel is above node-local, so the question can be asked there)
    negative_control_as_expected: squad's reading is NOT_READ
  for_the_deployable_file: >-
    What the later deployable 2wiki file reads here. None of it opens that file. compile_once_supported: its kernel may
    use node moments compiled once from a query-free neighbour side. compile_once_partial: it declares both forms,
    the per-query form as the reference, and measures the retrieval cost of the compiled form directly.
    compile_once_not_supported: it uses moments compiled per query. weight_needed: its query-free neighbour side carries
    the store's raw edge weight, which is query-free and could not be tested here. In every case the fixed
    neighbourhood (corrections_to_the_proposal.two_conditions_for_compile_once, (b)) is that file's to test.
  wording: >-
    every probe is an oracle fit on the GNN's own outputs over V2_GATE queries of the same dataset. Recovery is a
    statement of capacity within U_q, never of a deployable model. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins"; low and high recovery are both results. Reach is
    one hop throughout. The entries are in-pool, so no reading here says that node moments compiled once over a fixed
    neighbourhood keep the recovery.

compute:
  probes: >-
    per dataset, 10 units of 15 fits (2wiki 11 with the repeat). Level 5's kernel units took 4.8 to 7.7 minutes each on
    host_gpu_det. L7's neighbour side is narrower (135 inputs against 395), so an L7 unit is expected at or below
    that. Expected about 1 hour per dataset, with the three jobs sharing the GPU.
  disk: host workspace outputs/mp_approx_l7/ (out-of-fold predictions and fit logs, tens of MB per dataset), fetched to the laptop
  resumable: every probe unit is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's, level 3's and level 5's included
  - level 3's mirror verification fails on the host, or a host job's placement settings read back differently from host_gpu_det_as_tested
  - level 5's filed (r, L5-kern) unit on the host is not the unit its pinned probe_meta.json files
  - a unit's out-of-fold predictions leave a row unpredicted or hold a non-finite value
  - the host jobs' recorded code sha256 values are not one set equal to the committed files

outputs:
  script: scripts/mp_approx_l7.py (stages probe, repeat, read, run, doc, file)
  sidecars: outputs/mp_approx_l7/<name>/ (probes/ with the out-of-fold predictions, fit logs and probe_meta.json; repeat/; read.json)
  record: outputs/mp_approx_l7/record.json, assembled on the laptop from the host's per-dataset read.json files without arithmetic
  document: docs/MP_APPROX_L7.md
  run_record: run_record_mp_approx_l7_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l7.py
  - this file parses; its pins are the files' current sha256; the placement spec is level 3's; the query-free column indices match level 3's EPS_FAMILIES, EDGE_ATTR, B0_WIDTH and JL_DIM
  - with every column kept, the L7 kernel gives level 5's L5Kern output exactly when given its parameters
  - L7-qi's psi, values, C_v and c_v do not change when n_u's query-dependent columns, the weight or rel_compat change, and do change when X_u R or a query-free edge column changes; L7-qw's change with the weight and not with the halo's query-dependent columns
  - the weights are positive and sum to 1 per row and head; the mean arm's weights are 1 over the row's entries plus one
  - the compiled form phi^T C_v / phi^T c_v equals the forward output, and the output is invariant to entry order
  - the bands carry the L7 labels; the contrasts, shares and grid are the declared ones; the refit comparisons are bitwise
  - the probe, repeat, read and doc stages run end to end on the CPU over a synthetic level 3 sidecar with a level 5 kernel unit, and the repeat and every refit are bit-identical there
  - no held query id appears in any sidecar

execution:
  order: >-
    this file alone (commit); the script and tests (commit); push; one host job per dataset (probe, 2wiki's repeat,
    read), submitted at once; fetch; record, doc and run record on the laptop (commit)
  stop_after_run: STOP_FOR_REVIEW
