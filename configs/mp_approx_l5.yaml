corrections_to_the_proposal:   # checked against the code before this file was written
  one_hop_only: >-
    Level 3's mirrored entries hold each U_q row's in-edges, and the halo holds the fixed rows of those in-neighbours.
    That is exactly one hop, and it is what level 3's attention read. Hop-conditioned means beyond one hop were level 1's
    fixed hop tokens (L1_LOW on metaqa and 2wiki), and they are not repeated. Multi-hop typed structure is level 4's.
  moments_not_attention: >-
    L3-mean's message is a learned 64-wide projection of the uniform mean of [n_u | eps_e] over the entries and the self
    entry. This file hands the readout the moments themselves, 3366 columns, with no learned weighting. So the
    moments_over_mean contrast asks what the spread, the maxima, the per-family split and the fixed kernels add over the
    mean. The moments_vs_attention contrast asks how far fixed moments are from learned weighting.
  the_compiled_moment_arm: >-
    The factorised kernel kappa_e = phi_h(q,v)^T psi_h(u,e) with phi = softplus(W_phi [n_v | q_tilde]) and psi =
    softplus(W_psi [n_u | eps_e]) is positive. psi reads only the neighbour's fixed row and the edge, so sum_e
    psi_h(u,e) value_e^T and sum_e psi_h(u,e) are node-level moments that a deployed system could compile once, and
    phi is the only query-time part. psi is learned in the fit and fixed afterwards, as a compiled system's would be.
    The probe computes kappa on the fly; a test holds the on-the-fly message equal to the compiled form phi^T C_v /
    phi^T c_v. Level 3's exact attention remains the ceiling that this arm is measured against.
  refitted_not_borrowed: >-
    B0-mlp, L3-mean and L3-att are refitted here with level 3's fit_probe, imported unchanged, because the host-native
    protocol names one commit per stage. Whether each refitted unit is bit-identical to level 3's filed unit is filed
    as a flag (L3_REFIT_DIFFERS). No level 3 number is borrowed into a contrast.

this_file_does_not_touch:
  fits: nothing is fitted except the probes, which are cross-fitted analysis models. No GNN is run, and no checkpoint is read.
  rows: >-
    level 0's U_q rows exactly, through level 3's sidecars. V2_HELD_CONFIRMATION rows left the population before level 0
    compiled anything. All three eval splits are dev splits; no test row is read.
  frozen: >-
    M2-M3B, universal-v2, UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU task-level qualification,
    and levels 0, 1 and 3 (their declarations, scripts, tests, sidecars, probes, records and documents) keep their bytes.
    Level 0's and level 3's scripts are imported unchanged.
  package: the CRAG package is not read at all by this file; everything it reads is already on the host
  competitors: no probe output, moment, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:   # under configs/gpu_task_qualification.yaml#host_native_protocol, as at level 3
  moments_probes_and_read: >-
    host-native. The moments are computed on the host CPU inside each dataset's job (numpy, float64, before the probes);
    the probes and the read run on host_gpu_det. Nothing of this file runs on the laptop but the doc and file stages.
  host_gpu_det_as_tested: >-
    quoted from configs/gpu_task_qualification.yaml#placements.candidate.host_gpu_det, not changed: "DESKTOP-SLQMEQH, rx
    env mpr-cu128@62fc45e9e1ba (torch 2.8.0+cu128, CUDA 12.8), NVIDIA RTX 4500 Ada Generation, driver 596.71; float32
    only; torch.backends.cuda.matmul.allow_tf32 = False, torch.backends.cudnn.allow_tf32 = False, float32 matmul
    precision "highest", cudnn.benchmark = False; torch.use_deterministic_algorithms(True, warn_only=True) with
    CUBLAS_WORKSPACE_CONFIG=:4096:8 set before CUDA starts; every determinism warning recorded". 8 threads.
  verdicts_relied_on: >-
    configs/gpu_task_qualification.yaml#run_record_gpu_task_qualification_2026_09_29: host_gpu_det TASK_EQUIVALENT and
    TRAINING_REPRODUCIBLE. The score-level NOT_EQUIVALENT verdict of configs/cpu_gpu_equivalence.yaml stands, so this
    stage is host-native.
  settings_applied_by: level 3's host_placement, imported unchanged (placement_settings("det", 8), read back, checked by environment_problems; any difference is a hard stop)
  host_native_protocol:
    same_placement_for_every_comparator: >-
      every probe this file compares is fitted and evaluated on host_gpu_det, and every moment is computed on the
      host. B0-mlp, L3-mean and L3-att are refitted here as new draws, with level 3's code.
    identical_inputs: >-
      level 3's verify_mirror, imported unchanged, re-hashes every level 0 and level 3 file on the host against level
      3's mirror.json, whose sha256 is pinned below per dataset, before any byte is read. No file is transferred for
      this stage.
    identical_code: >-
      every host job runs from one git commit, the commit that adds scripts/mp_approx_l5.py, and records the LF sha256
      of every repository module it imports. The file stage checks that they are one set, equal to the committed files.
    identical_checkpoints: no checkpoint is read on the host
    repeat_check: >-
      metaqa's (r, L5-mom) unit is fitted a second time in a fresh process, after metaqa's grid. That process first
      recomputes the moments and files whether they are byte-identical to moments.npy. It then files whether the
      unit's out-of-fold predictions are bit-identical.
    cross_stage_check: >-
      the refitted B0-mlp, L3-mean and L3-att units (r and e) are compared with level 3's filed units of the same
      names (pinned through level 3's probe_meta.json below); whether each is bit-identical is filed as a flag. It is
      reproducibility evidence only, and never enters a contrast.
    no_cross_machine_numbers: no number of this file is set beside a number made on the laptop
  laptop_steps: the doc and file stages only (they assemble and render the host's records; no number is made)
  scheduling: >-
    one rx job per dataset, submitted as soon as the code commit is pushed, with mpr's priority 10. The GPU is shared
    by this file's and level 4's jobs. Nothing running is preempted.

transfer: none. Level 0's subset and level 3's sidecars are on the host from level 3's transfer, and the code arrives as the git-tracked tree.

