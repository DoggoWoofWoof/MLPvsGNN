population:
  rule: level 0's, through level 3's sidecars (qids.json equal to level 0's, in order)
  sizes: {metaqa: 2400 queries and 165893 U_q rows, 2wiki: 6290 and 245055, squad: 5841 and 176880}
  squad: the control, NOT_READ at levels 0, 1 and 3 (the GNN is not above its twin on any metric within U_q)

moments:   # host CPU, numpy float64 from level 3's float16 halo rows; per U_q row over its level 3 entries (no self entry); 3366 columns
  self: v's own X R, halo columns 258-321 of v's halo row (64)
  full: the mean, the population standard deviation and the maximum of n_u over the row's entries (3 x 322)
  family: the mean of n_u over the row's structural, ner and knn entries, each separately (3 x 322)
  query_kernels: >-
    sum_e w_e n_u / sum_e w_e with w_e = exp((zc_u - max_e zc_u) / tau), zc_u = the neighbour's halo column 129, for
    tau = 1 and tau = 0.25 (2 x 322)
  top: n_u of the entry with the largest zc_u, the first in entry order on a tie (322)
  relation_kernel: >-
    over the row's structural entries with rel_mask 1: sum_e w_e n_u / sum_e w_e with w_e = exp((rc_e - max rc) / 0.1),
    rc_e = the entry's rel_compat attribute; 0 where there is no such entry (322)
  eps_mean: >-
    the mean over entries of eps_e as level 3 defines it: the family one-hot over (structural, ner, knn, self), the five
    attributes, and rel_text = 8 times the mean of rel_jl over the entry's valid slots (73)
  attribute_max: the maximum over entries of the five attributes (5)
  counts: log1p of the entry count, over all entries and per family (4)
  empty_rows: a row without an entry has every moment 0, and its own X R is kept
  storage: >-
    moments.npy (float16, U_q rows x 3366, level 0's row order, written through level 0's to_f16, which refuses a
    non-finite value) and moments_meta.json (column names, sha256, sizes, seconds), in the dataset's host directory
    outputs/mp_approx_l5/<name>/. Whole queries are processed at a time, and entries are reduced in entry order.

probe:   # host_gpu_det; cross-fitted with level 0's five folds and its inner split (imported unchanged)
  inputs_per_row: >-
    b_v, n_u, eps_e and q_tilde exactly as level 3 builds them (level 3's ProbeData, imported unchanged). M_v: the row's
    3366 moment columns, standardised with level 0's rule (per fold, the training queries' U_q rows only; float64, two
    passes; sd < 1e-6 gives 0; clipped to [-8, 8]).
  B0_mlp, L3_mean, L3_att: level 3's probes, refitted with level 3's fit_probe (imported unchanged)
  L5_mom: level 0's ProbeMLP on [b_v | M_v] (258 + 3366), no attention and no learned weighting
  L5_kern: >-
    the compiled-moment arm: level 3's L3-att with the score replaced by the factorised kernel. kappa_e^h =
    phi_h(q,v)^T psi_h(u,e), with phi = softplus(W_phi [n_v | q_tilde]) and psi = softplus(W_psi [n_u | eps_e]), 4 heads of
    rank 32; alpha_e^h = kappa_e^h / sum over the row's entries and its self entry. The values W_val [n_u | eps_e], the 4
    heads of 16, and the readout Linear(258 + 64, 128), GELU, Linear(128, 128), GELU, Linear(128, 1) on [b_v | m_v] are
    level 3's.
  objectives: level 3's MSE and LIST, unchanged (LIST on r only; no gold enters any loss)
  fitting: level 3's (seed 1000 + 10 k + fold; AdamW lr 1e-3, weight decay 1e-4; 64 queries per minibatch; at most 30 epochs; patience 3; best epoch restored)
  grid:
    r_k: [B0-mlp, L3-mean, L3-att, L5-mom, L5-list, L5-kern]   # -list: the LIST objective; every other probe MSE
    e_k: [B0-mlp, L3-mean, L3-att, L5-mom]
  units: >-
    one unit per (target, probe): the three seeds times five folds, written atomically with its fit log and skipped on
    a restart. The order within a job: r's L5-mom first, then the rest of r's grid, then e's.
  repeat: metaqa's (r, L5-mom) again in a fresh process into repeat/, after recomputing the moments; both comparisons filed

quantities: >-
  level 0's, computed by level 0's functions (per_query_measures, read_family, reproducibility, strata_masks) over this
  file's probes, with level 0's bootstrap: one resample matrix per dataset (1000 resamples, default_rng(0)), so every
  contrast is paired. References: ref:twin, ref:other_seed (r) and ref:no_edge, ref:other_seed (e), as level 0 computes them.
statistics:
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    moments_over_mean: rho_bar(L5-mom) - rho_bar(L3-mean) on r -- fixed moments against a learned projection of the uniform mean
    moments_vs_attention: rho_bar(L5-mom) - rho_bar(L3-att) on r -- fixed moments against learned query-conditioned attention
    moments_over_node_local: rho_bar(L5-mom) - rho_bar(B0-mlp) on r
    kernel_vs_attention: rho_bar(L5-kern) - rho_bar(L3-att) on r -- the compilable factorised kernel against exact attention
    kernel_over_moments: rho_bar(L5-kern) - rho_bar(L5-mom) on r
    objective_moments: rho_bar(L5-list) - rho_bar(L5-mom) on r
    edge_moments_vs_attention: rho_bar(L5-mom) - rho_bar(L3-att) on e
    edge_moments_over_mean: rho_bar(L5-mom) - rho_bar(L3-mean) on e
  shares:   # descriptive; point and 95% percentile interval over the same resamples; read only where the denominator's interval lies above 0
    moment_share: (rho_bar(L5-mom) - rho_bar(B0-mlp)) / (rho_bar(L3-att) - rho_bar(B0-mlp)) on r -- how much of attention's gain over node-local fixed moments reach
    kernel_share: (rho_bar(L5-kern) - rho_bar(B0-mlp)) / (rho_bar(L3-att) - rho_bar(B0-mlp)) on r -- how much of it survives the factorised kernel

readings:   # filed before any number; per dataset, no pooled reading
  primary_probe: L5-mom on r_k (the MSE objective, as the primary of every earlier level)
  bands:   # of rho_bar, level 0's thresholds
    L5_HIGH: rho_bar >= 0.75 and its interval's lower end >= 0.50
    L5_LOW: rho_bar <= 0.25 and its interval's upper end <= 0.50
    L5_MID: neither
    NOT_READ: the dataset has no readable metric (squad is expected here; the control, not a failure)
  exactly_one: per dataset, the band of the primary probe is the dataset's reading
  flags:
    FIT_NOT_RANK: a probe with R2 >= 0.5 whose band is L5_LOW
    SEED_BOUND: mean reproducibility of r below 0.5
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    MOMENTS_DIFFER: the repeat's recomputed moments are not byte-identical to moments.npy
    L3_REFIT_DIFFERS: a refitted unit is not bit-identical to level 3's filed unit of the same name (the unit and its largest difference are filed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l5_high: >-
      primary L5_HIGH: fixed one-hop neighbour-distribution moments, read by an MLP with no learned weighting, predict
      the GNN's ranking effect within U_q on that dataset (an upper bound, not a full-pool claim)
    moments_add_over_mean: the moments_over_mean interval above 0 -- the spread, maxima, family split and fixed kernels add over the mean
    moments_not_below_attention: >-
      the moments_vs_attention interval's upper end at or above 0: fixed moments are not measurably below learned
      one-hop attention on that dataset
    moments_below_attention: the moments_vs_attention interval below 0 -- learned query-conditioned weighting carries recovery that fixed moments do not
    kernel_not_below_attention: >-
      the kernel_vs_attention interval's upper end at or above 0: the compilable factorised kernel is not measurably
      below exact one-hop attention. This is the answer to level 3's l3_high question, how much of the ceiling survives
      compilation, on that dataset.
    kernel_below_attention: the kernel_vs_attention interval below 0 -- compilation to a rank-32 factorised kernel loses part of the ceiling
    objective_adds: the objective_moments interval above 0 -- the objective limits recovery, not only the features
    edge_effect_moments: the band of L5-mom on e is L5_HIGH, or edge_moments_vs_attention's interval reaches 0 or above
  wording: >-
    every probe is an oracle fit on the GNN's own outputs over V2_GATE queries of the same dataset. Recovery is a
    statement of capacity within U_q, never of a deployable model. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins"; low and high recovery are both results.

compute:
  moments: >-
    host CPU, inside each job before the probes: about 2.0M (metaqa), 1.6M (2wiki) and 1.9M (squad) entries of 322
    columns, in float64 passes over chunks of whole queries -- expected minutes
  sizes: >-
    6732 bytes per U_q row -- about 1.12 GB (metaqa), 1.65 GB (2wiki) and 1.19 GB (squad), written on the host and held
    on the GPU in float16
  probes: >-
    per dataset, 10 units of 15 fits (metaqa 11 with the repeat); five of them attention units like level 3's, the
    rest MLPs; so about level 3's probe time
  disk: host workspace outputs/mp_approx_l5/, fetched to the laptop without moments.npy (its sha256 is filed)
  resumable: the moments are written atomically and every probe unit is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's and level 3's included
  - level 3's mirror verification fails on the host, or a host job's placement settings read back differently from host_gpu_det_as_tested
  - the moments contain a non-finite value, or their row count or query order differs from level 0's
  - the host jobs' recorded code sha256 values are not one set equal to the committed files

outputs:
  script: scripts/mp_approx_l5.py (stages moments, probe, repeat, read, run, doc, file)
  sidecars: outputs/mp_approx_l5/<name>/ (moments.npy and moments_meta.json on the host; probes/ with the out-of-fold predictions, fit logs and probe_meta.json; repeat/; read.json)
  record: outputs/mp_approx_l5/record.json, assembled on the laptop from the host's per-dataset read.json files without arithmetic
  document: docs/MP_APPROX_L5.md
  run_record: run_record_mp_approx_l5_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l5.py
  - this file parses; its pins are the files' current sha256; the placement spec is level 3's; contract column 0 is dense_cos
  - on a small synthetic sidecar every moment family equals a direct per-row computation, and a row without entries is 0 but for its own X R
  - the moments are invariant to the order of a row's entries (the top-1 tie rule aside) and have 3366 columns with the declared names
  - L5-kern's attention is positive and sums to 1 per row and head, and its on-the-fly message equals the compiled form phi^T C_v / phi^T c_v
  - the bands carry the L5 labels; the contrasts and shares are the declared ones; the refit comparison is bitwise
  - no held query id appears in any sidecar

execution:
  order: >-
    this file alone (commit); the script and tests (commit); push; one host job per dataset (moments, probe, metaqa's
    repeat, read), submitted at once; fetch; record, doc and run record on the laptop (commit)
  stop_after_run: STOP_FOR_REVIEW
