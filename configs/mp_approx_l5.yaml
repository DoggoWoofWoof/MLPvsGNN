extends: >-
  configs/mp_approx_l3.yaml (RUN at 7106b7e): metaqa L3_LOW, 2wiki L3_HIGH, squad NOT_READ (the control). Level 3's
  interpretation map named the remaining fixed rungs, "typed paths, neighbour moments", and said each needs its own
  file. This is the neighbour-moment rung. It also carries the compiled-moment arm, which level 3's l3_high entry
  licensed on 2wiki "as the next file" (phi(q,v)^T psi(u) with compiled sum psi(u)(W h_u)^T and sum psi(u)). Level 4
  (typed paths) is a separate file, declared beside this one. Level 2 stays unopened.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  Replace level 3's learned one-hop attention with fixed summaries of the same one-hop neighbourhood: the mean, spread
  and maximum of the in-neighbours' fixed rows, per-family means, means under fixed query kernels, the most
  query-similar neighbour, a relation kernel, and the edge-feature mean. An MLP reads them beside node-local features.
  How much of the trained GNN's residual over its matched twin, and of its edge effect, do these moments recover, set
  against uniform weighting (L3-mean) and against learned attention (L3-att)? And how much of the attention ceiling
  survives when the kernel is restricted to a compilable factorised form, phi(q,v)^T psi(u,e)?
role: >-
  Measurement only, as at levels 0 to 3. The GNN's outputs are the probes' targets, which the proposal allows "only to
  measure approximation capacity". No probe, moment, target or number of this file enters QLS-U, the twin, a feature
  contract, M3, M4 or any selection. A model that used these moments or the factorised kernel without GNN outputs would
  be a competitor, and it would need its own declaration under the QLS-U contract. This file does not open one.

