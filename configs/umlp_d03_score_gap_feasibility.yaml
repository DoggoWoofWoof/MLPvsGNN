phase: UMLP_D03_SCORE_GAP_FEASIBILITY
opened: 2026-09-29
status: DECLARED_NOT_RUN
branch_type: POST_HOC_ANALYSIS
extends: >-
  configs/umlp_d01_2wiki_feature_readout.yaml (group and strata definitions, reused verbatim) and
  configs/umlp_v22a_linear_offset.yaml (the offset inspected; run_record_umlp_v22a_2026_09_29, commit 6ff664c).
  Neither is edited.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
d03_question: >-
  For the 2wiki secondary golds that the frozen twin misses from its top 5, how large is the score correction actually
  required to enter the top 5, relative to (1) the twin's within-query score scale, (2) the maximum correction v2.2A was
  allowed to make, and (3) the correction v2.2A actually learned?
role_for_the_registered_question: >-
  Diagnostic only. It explains the v2.2A failure (bound, or optimisation/objective/generalisation, or a local probe that
  does not globalise). No retrieval model is fitted, improved or selected; v2.2B is not started by this file.

authorization:
  given: 2026-09-29, by the user, pasted as "UMLP-D0.3 AUTHORIZATION -- SCORE-GAP FEASIBILITY DIAGNOSTIC"
  go_ahead: "Proceed immediately and autonomously."
  terminal: "Write the diagnostic report and commit it. Then stop. Do not start v2.2B from this declaration."

this_file_does_not_touch:
  fits: no model is fitted or trained; v2.2A is not altered or refitted
  held_half: V2_HELD_CONFIRMATION is not read; held rows are dropped before anything is compiled
  other_datasets: no MetaQA or SQuAD number is read
  gnn: u_gnn_v2_ef defines G_miss_mp / G_miss_both only, through the stored D0.1 sidecar ranks; no GNN is run
  v2_2b: not started

