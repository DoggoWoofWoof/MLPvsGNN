  # ── the three blockers, disposed ───────────────────────────────────────────
  blocker_dispositions:
    blocker_1_no_query_view_on_two_datasets:
      disposition: WITHDRAWN_WRONG_AT_FILING
      what_was_true_at_filing: >-
        metaqa had 407,513 encoded queries in the per-hop trees and 2wiki had
        192,606 in data/canonical/2wiki. outputs/m3a/transfer_manifest.json never
        walked those trees, and the silence of an inventory was filed as an
        absence. An inventory that did not look is not evidence of absence.
      served_now:
        metaqa: {canonical_query_rows: 407513, dense_queries: 407513, splade_queries: 407513}
        2wiki:  {canonical_query_rows: 192606, dense_queries: 192606, splade_queries: 192606}
        webqsp: {canonical_query_rows: 4737,   dense_queries: 4737,   splade_queries: 4737}
      filed_encode_budget: WITHDRAWN -- nothing to encode
      original_block: retained above, unedited, as the record of what was filed
    blocker_2_no_retrieval_anywhere:
      disposition: CLEARED_UPSTREAM
      served_now: >-
        12 of 12 top-1000 caches (dense and splade for every dataset), shapes as
        in served_substrate.datasets_served, each pinned by its DATASET.json and
        by the freeze.
      original_status_retained: BLOCKS_ALL_FIVE_DATASETS (as filed; no longer true)
    blocker_3_edge_families_are_not_uniform:
      disposition: CLEARED_UPSTREAM
      served_matrix: all 18 families present -- see served_substrate.served_edge_families
      what_changed_upstream:
        - NER added on metaqa (LOCKED_6_OF_6_FAMILY_COMPLETION_V1, 2026-09-09); node coverage 0.1314, and the record says to read the coverage, not the edge count
        - KNN added on hotpotqa, 2wiki and webqsp (V1)
        - musique KNN replaced by an audited rebuild (LOCKED_6_OF_6_FAMILY_COMPLETION_V2, 2026-09-11)
      caveat_that_survives: >-
        FULL is now the same three-family union on every dataset, but the
        families are not the same kind of object. structural is typed only on
        metaqa (9 relations) and webqsp (7,058); NER touches 30.7% of webqsp
        nodes and 13.1% of metaqa nodes; kNN weights are cosines in [0,1] while
        NER weights run to 35.3 with a mean near 0.12. Every FULL row carries its
        members, and nothing is averaged across datasets whose FULL means
        different things. The V1 record itself says the added families are a
        property to carry, not a uniformity fix.

  # ── measured rows this phase filed that are now wrong ──────────────────────
  stale_rows_withdrawn:
    rule: >-
      The measured files (docs/M3A_GRAPH_SUBSTRATE.md, docs/M3A_COMPILATION_REPORT.md,
      outputs/m3a/graph_substrate_stats.json) are not edited; a measurement is a
      record of what was true when it was taken. Served figures are read from
      the pinned GRAPH_MANIFEST.json files and GRAPH_DEGREE_HUB.json, and a
      served-substrate table is written as a NEW file. Nothing is rerun to
      recreate a table whose rows already exist.
    rows:
      - row: "2wiki: structural present, KNN absent"
        where: docs/M3A_GRAPH_SUBSTRATE.md; docs/M3A_COMPILATION_REPORT.md; substrate_blockers.blocker_3 matrix
        served: 13643063 kNN edges
        why_it_was_true_then: measured 2026-09-08, before family completion V1 (2026-09-09)
      - row: "musique kNN 266,488 edges, max degree 1,475"
        where: docs/M3A_GRAPH_SUBSTRATE.md lines 17, 34, 115; docs/M3A_COMPILATION_REPORT.md line 59; outputs/m3a/graph_substrate_stats.json
        served: 265366 edges, max degree 41
        why: >-
          the frozen kNN had been searched over 1,473 musique rows whose dense
          vectors were damaged; 4,402 of its edges could not be reproduced from
          the frozen vectors and its 1,475-degree hub was an artefact of zeroed
          vectors. Replaced by the audited rebuild (V2, exhaustive fp32 over the
          resolved vectors); the squad and metaqa controls reproduce their
          frozen kNN exactly. GRAPH_DEGREE_HUB keeps the superseded family
          measured under knn@frozen_superseded with served:false.
      - row: "nothing is stored reciprocally (max 0.2962)"
        status: >-
          SUPERSEDED for NER and kNN -- served adjacency is symmetric (one row per
          unordered pair, directed:false, symmetrised by the loader); structural
          stays directed as found (musique carries 185,592 real reverse rows).
      - row: blocker 1 as filed
        status: WITHDRAWN_WRONG_AT_FILING (see blocker_dispositions)

