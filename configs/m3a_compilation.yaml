  # ── K semantics, adopted from the record ───────────────────────────────────
  k_semantics_adopted:
    source: >-
      freeze K_SEMANTICS (R1-R6), first filed as
      _history/records/K_SEMANTICS_AND_EVAL_SPLITS.json. The package record is
      evidence; this file is where the rule binds for this phase.
    cache_depth: 1000
    R1_report_with: [K, model, pool_provenance, dataset, split]
    R2_naming: cache-derived ceilings are pool_ceiling@K; candidate_ceiling and corpus_ceiling are forbidden names for them
    R3_corpus_ceiling: >-
      1.0 by construction on metaqa, squad, musique, hotpotqa and 2wiki (their
      gold IS a corpus document and every labelled gold ref resolves); a per-split
      COLUMN on webqsp.
    R4_binding_is_measured: report recall@{1,5,10,20,100,1000} beside every pool ceiling so the reader sees whether depth binds
    R5_K_was_never_selected: one depth materialised; every shallower K is a prefix; no K was chosen from an outcome
    R6_membership_by_position: gold at canonical position p is in the pool for q iff p is in ids[q]; never test membership over distinct source rows
    relation_to_two_ceilings_rule: >-
      unchanged -- recall_ceiling@K is K-aware; pool_ceiling@K is its name when
      the pool is a cache prefix; candidate_ceiling remains the no-K pool
      coverage of a declared pool and is never used for a cache-bounded number.

  # ── headroom, amended ──────────────────────────────────────────────────────
  headroom_amended:
    regimes: [RETRIEVAL, STRUCT, NER, KNN, FULL]
    why_ner_is_added: >-
      The SOTA-matched graph substrate differs by dataset: typed STRUCT for
      metaqa and webqsp (the NuTrea / ReaRev / GNN-RAG lineage), the entity
      graph for hotpotqa, 2wiki and musique (the GraphER lineage), none
      published for squad. Testing across the three graph substrates means each
      family alone plus their union, so NER is a regime and not only a member of
      FULL.
    sota_matched_substrate: {metaqa: STRUCT, webqsp: STRUCT, hotpotqa: NER, 2wiki: NER, musique: NER, squad: none}
    regime_caveat_now: blocker_dispositions.blocker_3_edge_families_are_not_uniform.caveat_that_survives
    pools:
      inherited_verbatim_from: configs/candidate_headroom.yaml
      retrieval_pools:
        - dense_top200
        - splade_top200
        - frozen_union
        - equal_rrf_budget_50
        - equal_rrf_budget_100
        - equal_rrf_budget_200
        - equal_rrf_budget_400
      rrf: {dense_weight: 0.5, splade_weight: 0.5, constant: 60, tie_break: ascending_global_node_id, mirrors: src/mp_retrieval/candidate_budget.py::build_budget_dataset}
      constructed_as_prefixes_of: the served top-1000 caches (R5)
      seeds: dense top-5 union splade top-5 -- inference-safe; never gold; never assigned topic entities
      graph_exposure_pools: >-
        For each graph regime, the retrieval pool plus the bounded neighbourhood
        of the seeds: hop-1 with a per-seed neighbour cap, and a hop-2 extension
        under a per-query visited cap, neighbours ordered by a deterministic key
        (descending edge weight for NER and kNN, ascending canonical position for
        structural) so the pool is a function of the seeds and the graph alone.
        The cap grid is declared in the runner config before it runs.
      what_this_is_and_is_not: >-
        These pools measure the gold exposure that parameter-free expansion
        would add, which is the evidence HIGH_HEADROOM_CANDIDATE_CONTRACT needs
        before it freezes one budget. No frozen Paper-1 pool is regenerated
        (candidate_headroom.yaml prohibits that for its own pools, a different
        object), no ranking is run over an expanded pool in this phase, and R3
        stays closed.
    ks: [1, 5, 20]
    also_report:
      - pool_ceiling at recall@{10,100,1000} beside every ceiling (R4)
      - ANY and ALL / FullCov
      - candidates, nodes and edges per query
      - incremental unique-gold exposure of each expansion over its retrieval pool
      - zero-gold and unanswerable counts on the row
      - the corpus ceiling column (R3)
    exposure_matching_rule: >-
      Match the SOTA systems candidate exposure; do not exceed it. Each dataset
      reports the knee of its own ceiling curve beside its SOTA exposure target;
      the budget frozen later is the smallest defensible one that reaches the
      target (>= 90% of attainable recall@5, as the candidate contract already
      says). A pool larger than the SOTA pool is not headroom -- it is a
      comparison tilted in our favour and a cost explosion.
    sota_exposure_targets:
      metaqa_webqsp: >-
        The KB systems assign at least one topic entity per question (an oracle
        under the archaeology oracle_rule) and extract a bounded subgraph around
        it; the answer-in-subgraph rate is the exposure they had. We refuse
        assigned topic entities; our seeds are retrieved. Target: the reported
        subgraph answer coverage where a paper states it, otherwise the bounded
        2-hop exposure from retrieved seeds, labelled as the inference-safe
        counterpart.
      hotpotqa_2wiki_musique: >-
        GraphER reranks a 200-candidate scope drawn from a corpus induced from
        2,000 sampled dev queries -- corpus subsetting by query, which the
        freeze forbids for us -- and reports PR@K, a set-coverage metric. Target:
        our frozen_union / equal_rrf_budget_200 over the full corpus, with the
        corpus difference stated on the row.
      squad: no graph-retrieval SOTA exists; retrieval pools only.
    numbers_here: none -- the runner and its config are committed before they run and this block is not edited afterwards

  # ── the universal GNN, recorded now because it is cheap now ────────────────
  universal_gnn_calibration_rule:
    scope: M3B; recorded here so the requirement exists before any fit does
    single_family_across_datasets: true
    no_per_dataset_gnn_family: true
    no_dataset_router: true
    screen_must_contain:
      - question-conditioned, relation-aware attention (the ReaRev / NuTrea / GNN-RAG ingredient)
      - GATv2-style neighbour aggregation (the GraphER ingredient)
    screen_size: 1-2 depths x 1-2 hidden widths, selected by validation among GNN candidates only and never against a QLS-U number (the M3 firewall)
    same_information: >-
      Receives F(q, v) exactly as qls_u_sota_v1 and gat_no_mp do -- the compiled
      features are the compensation the no-message-passing arms of the
      literature were never given -- plus the raw edges, which are the treatment.
    calibration_column: >-
      Every result row carries the published SOTA number with its exposure
      separated as the archaeology requires (subgraph coverage / oracle topic
      entities / LLM reader / pretraining), and our universal GAT under our
      exposure.
    when_delta_mp_is_not_read: >-
      If the universal GAT falls outside the SOTA band and the gap is not
      explained by a named exposure difference, the GNN arm is not yet credible
      and delta_MP is not reported for that cell. A delta_MP read off a weak GNN
      is a strawman; the claim is only as strong as the message-passing arm.
    target_versus_result: >-
      universal MLP = universal GNN = SOTA GNN is the design target -- every arm
      as strong as matched information allows. The result is whatever delta_MP
      is measured, per dataset and per substrate; nonzero remains a valid
      outcome and the registered question is unchanged.

  # ── directions, touched only where the substrate changed ───────────────────
  directions_amended:
