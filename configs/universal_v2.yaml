# ══════════════════════════════════════════════════════════════════
# Amendment 3 (2026-09-19): the continuous execution authorization -- the
# standing ruling to run the declared pilot to its terminal state without a
# review stop at each mechanical checkpoint, filed verbatim before the first
# real cache is frozen. Autonomy applies to execution, never to scientific
# redesign; the terminal-state vocabulary and the ceiling guard it names.
# ══════════════════════════════════════════════════════════════════
amendment_3_2026_09_19:
  filed_utc: '2026-09-19T18:28:49Z'
  status_after: DECLARED_NOT_RUN
  reviewed: 0881d4b (amendment 2 and the step-3 tooling), with the step-3 compile of the trio running (started 2026-09-19T18:13:59Z,
    hidden process, outputs/universal_v2/logs/compile.*.log)
  what_this_is: >-
    the standing authorization of the user to run the declared pilot to its terminal state without a review stop
    at each mechanical checkpoint, filed verbatim; it changes no scientific quantity; where its wording and the
    declaration differ, the declaration governs and the difference is named under reconciliations. Autonomy applies
    to execution, not to scientific redesign: a family that fails its frozen gate is recorded as a result and nothing
    new is invented inside this phase.
  ruling_verbatim: |
    CONTINUOUS EXECUTION AUTHORIZATION — UNIVERSAL-v2
    =================================================

    From this point onward, do NOT stop for routine review between declared
    Universal-v2 stages.

    Continue autonomously through the already-preregistered pipeline,
    committing each completed stage and resuming after crashes/reboots where
    possible.

    This message is authorization to advance through the existing declared
    Universal-v2 pilot workflow without asking me again at each mechanical
    checkpoint.

    The scientific contract MUST NOT change as a consequence of observed
    results.

    ==================================================
    CURRENT STATE
    ==================================================

    Declaration:
        configs/universal_v2.yaml

    Step-2 implementation:
        bfdc4b2

    Prospective amendment 2:
        0881d4b

    Final declared raw feature contract:
        M3B core              = 78
        Universal-v2 additions = 86
        total raw contract     = 164

    Cache layout:
        197

    The real step-3 compile is already running.

    M3B is frozen and MUST NOT be altered or rerun.

    ==================================================
    GENERAL RULE
    ==================================================

    The execution loop is:

        finish current stage
            ↓
        verify declared invariants
            ↓
        commit
            ↓
        automatically enter next already-declared stage
            ↓
        repeat

    Do NOT stop merely because a stage completed successfully.

    Do NOT ask for approval for:

    - compilation completion
    - screening
    - contract freezing
    - timing measurements
    - choosing between the TWO already-declared compute schedules
    - seed-0 training
    - selection.json creation
    - V2_GATE scoring
    - seeds 1–2 after a declared PASS
    - supplement evaluation
    - seed-mean confirmation
    - V2_HELD_CONFIRMATION
    - report generation
    - run-record generation
    - commits
    - crash/reboot recovery

    All of those are already authorised.

    ==================================================
    HARD SCIENTIFIC FIREWALL
    ==================================================

    Never change after seeing results:

    - feature definitions
    - ordered relation-path definitions
    - raw feature list
    - screening rule
    - surviving-column rule
    - candidate pools
    - model architectures
    - H=128
    - K_REL=4
    - loss
    - dataset sampling mixture
    - gate thresholds
    - gate populations
    - held populations
    - seed list
    - checkpoint-selection rule
    - evaluation metrics
    - advance/fail criteria

    No architecture shopping.

    No new arm may be added.

    No threshold may be relaxed.

    No failed model may be replaced with a new idea inside this phase.

    No test split may be read.

    ==================================================
    STEP 3 — COMPLETE AUTOMATICALLY
    ==================================================

    Allow the current real compile to finish.

    Compile exactly:

        MetaQA
        2Wiki
        SQuAD

    for every declared fit/select/evaluation carve required by the pilot.

    After compile:

    1. verify input/carve/pool digests;
    2. produce diagnostics:
           exact ordered raw feature names
           feature count = 164
           block availability
           missingness
           constants
           variance
           correlation/redundancy
           K_REL=4 truncation frequency by dataset/hop
           ordered path availability
           direction availability
           wall time
           query/s
           peak RSS
           bytes on disk;
    3. apply ONLY the preregistered screen;
    4. freeze UNIVERSAL_V2_CORE_CONTRACT;
    5. hash:
           raw feature contract
           screen rule
           surviving ordered columns
           compiled caches;
    6. run declaration/contract tests;
    7. commit.

    If all checks pass:

        ADVANCE AUTOMATICALLY TO STEP 4.

    ==================================================
    STEP 4 — TIMING
    ==================================================

    Run the declared one-epoch timing measurement for:

        u_gnn_v2_ef

    Use the exact declared timing protocol.

    Then apply the already-filed rule mechanically:

    IF measured epoch time <= 3 hours:
        use the declared full training schedule.

    ELSE:
        use exactly the declared fallback:
            1000 batches / epoch
            12 epochs
            applied equally to every arm.

    No third option.

    File the timing decision and commit.

    Then:

        ADVANCE AUTOMATICALLY TO STEP 5.

    ==================================================
    STEP 5 — SEED-0 PILOT
    ==================================================

    Run exactly the declared seed-0 model matrix.

    Families/arms remain the ones already registered, including:

        u_mlp_v2
        u_mlp_v2_mix

        u_gnn_v2
        u_gnn_v2_ef

        u_gnn_v2_core78
            only according to the declared selected-GNN dependency

        gat_universal_v1_trio

    Use exactly the frozen:

        dataset mixture
        loss aggregation
        batches
        optimizer
        candidate pools
        compiled contract
        model-selection rule

    No extra model.

    ==================================================
    SELECTION
    ==================================================

    Create:

        selection.json

    exactly ONCE.

    Selection may use only the declared select carves.

    Once written:

        selection.json is immutable.

    Do not rewrite it because a later gate looks bad.

    ==================================================
    V2_GATE
    ==================================================

    Read V2_GATE exactly once after seed-0 selection.

    Evaluate the declared GNN and twin conditions exactly as filed.

    Record separately:

        GNN_GATE = PASS / FAIL
        TWIN_GATE = PASS / FAIL

    Do not collapse these prematurely into one generic PASS.

    Suggested overall labels:

        BOTH_PASS
        GNN_ONLY_PASS
        TWIN_ONLY_PASS
        PILOT_FAILED

    ==================================================
    IF A FAMILY FAILS AT SEED 0
    ==================================================

    That family stops.

    Do NOT:

    - modify it
    - replace it
    - change threshold
    - add features
    - add capacity
    - change propagation depth
    - tune the dataset mixture

    Preserve the failure as a result.

    If the declaration allows the other family to continue, continue only
    that family.

    If every eligible family fails:

        finish the failure report
        file the run record
        commit
        STOP_FINAL

    No new Universal-v2 architecture is to be invented automatically.

    ==================================================
    IF A FAMILY PASSES SEED 0
    ==================================================

    Automatically train declared seeds:

        1
        2

    for that family.

    Run the declared supplement evaluation.

    Compute the declared seed-mean gate on V2_GATE.

    Use the paired bootstrap exactly as declared.

    If seed-mean confirmation fails:

        mark family CONFIRMATION_FAIL
        do not rescue it.

    If it passes:

        mark family CONFIRMED_PASS.

    ==================================================
    V2_HELD_CONFIRMATION
    ==================================================

    Once all eligible passing families have completed seed confirmation,
    read:

        V2_HELD_CONFIRMATION

    exactly once.

    The held half must never have influenced:

    - feature screening
    - architecture selection
    - checkpoint selection
    - seed-0 gate
    - threshold choice
    - model selection

    Render held results only from the filed held record thereafter.

    Do not repeatedly re-read/recompute the held decision to tune anything.

    ==================================================
    H_OPERATOR_VS_BASIS
    ==================================================

    Always report the declared diagnostic:

        u_gnn_v2_core78
            -
        gat_universal_v1_trio

    where available.

    This is diagnostic only.

    No gate threshold depends on it.

    Use it to separate:

        new operator contribution

    from:

        new compiled-basis contribution.

    ==================================================
    REPORTING
    ==================================================

    At the end of the pilot produce one complete report containing:

    1. frozen feature contract
    2. feature-screen results
    3. compile cost
    4. timing decision
    5. selected arms
    6. seed-0 results
    7. seeds 1–2 results where authorised by gate
    8. seed means
    9. bootstrap intervals
    10. V2_GATE result
    11. V2_HELD_CONFIRMATION result
    12. GNN_GATE
    13. TWIN_GATE
    14. overall family status
    15. operator-vs-basis diagnostic
    16. per-dataset results:
            MetaQA
            2Wiki
            SQuAD
    17. comparison against frozen M3B references
    18. all incidents / reboots / resumptions
    19. actual CPU/GPU hours
    20. peak RAM / storage
    21. every artifact SHA256
    22. git commits

    Clearly distinguish:

        V2_GATE
    from:
        V2_HELD_CONFIRMATION

    Neither is to be described as globally unseen data because M3B already
    scored the parent development populations.

    ==================================================
    AUTOMATIC LATER-STAGE AUTHORIZATION
    ==================================================

    The purpose of this instruction is specifically to avoid requiring me
    to approve every mechanical phase transition.

    Therefore, where configs/universal_v2.yaml says that a later already-
    declared stage requires a dated authorization block, you may add a dated
    authorization block citing THIS ruling, provided:

    1. every prerequisite declared gate has passed;
    2. no scientific parameter changes;
    3. the stage already exists in the declaration;
    4. compute remains inside the existing filed ceiling.

    This authorization applies to already-declared work only.

    It does NOT authorize inventing a new experiment.

    ==================================================
    COMPUTE RULE
    ==================================================

    Continue to obey:

        validate cheaply;
        expand only when a declared gate permits expansion.

    Do not launch undeclared sweeps.

    Do not increase seeds beyond the declaration.

    Do not automatically migrate to another paid compute account/workspace.

    Respect the filed compute ceiling.

    If the compute ceiling will be exceeded:

        checkpoint
        calculate exact remaining work
        STOP_HARD

    ==================================================
    CRASH / REBOOT RULE
    ==================================================

    A crash or reboot is NOT a review point.

    If an existing valid checkpoint/artifact exists:

        verify it
        resume deterministically
        log the incident
        continue.

    Never repeat a completed expensive stage merely because the machine
    restarted.

    ==================================================
    HARD STOP CONDITIONS
    ==================================================

    STOP and report only if one of these happens:

    1. contract/hash/integrity violation;
    2. compiled cache disagrees with its frozen source;
    3. M3B pinned artifact changes;
    4. declaration and code disagree;
    5. test data is accidentally touched;
    6. gate/held leakage is detected;
    7. a result would require changing a frozen scientific choice;
    8. all eligible v2 families fail their declared gate;
    9. compute ceiling would be exceeded;
    10. unrecoverable corruption / missing prerequisite;
    11. a genuinely new scientific decision not already covered by the
        declaration is required.

    Routine success is NOT a stop condition.

    ==================================================
    END CONDITION
    ==================================================

    Keep running until the complete Universal-v2 pilot has reached a
    terminal state.

    Terminal states are:

        BOTH_CONFIRMED
        GNN_ONLY_CONFIRMED
        TWIN_ONLY_CONFIRMED
        PILOT_FAILED
        HARD_STOP_WITH_REASON

    At the terminal state:

        render final report
        append run record
        run tests
        commit
        return the results and interpretation.

    Do not stop for intermediate review.
