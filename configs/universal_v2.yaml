    original_pilot_status: PILOT_FAILED
    post_pilot_replication_status: GNN_REPLICATION_ONLY
  filed_before: any stage-2 cache, fit, evaluation or number exists
  ruling_verbatim: |
    This is a **good result**, even though the original Universal-v2 pilot remains correctly recorded as `PILOT_FAILED`.

    The important scientific result is now:

    > **The Universal-v2 GNN works. The Universal-v2 MLP idea is promising but not yet universal.**

    The replication separated those two conclusions very cleanly.

    ### What the GNN result means

    `u_gnn_v2_ef` now has three seeds, and its three-seed mean clears **every original gate without moving a single threshold**:

    | Criterion          | v2 GNN mean | Required |   Margin |
    | ------------------ | ----------: | -------: | -------: |
    | MetaQA Hit@1       |  **0.9099** |   0.8840 | +2.59 pp |
    | MetaQA 3-hop Hit@1 |  **0.8508** |   0.8172 | +3.36 pp |
    | 2Wiki R@5          |  **0.8996** |   0.8758 | +2.38 pp |
    | 2Wiki FC@5         |  **0.7763** |   0.7453 | +3.10 pp |
    | SQuAD R@5          |  **0.9020** |   0.8996 | +0.24 pp |

    And critically, the held-confirmation half reproduces it:

    * MetaQA Hit@1 **0.9095**
    * MetaQA 3-hop **0.8478**
    * 2Wiki R@5 **0.8977**
    * 2Wiki FC@5 **0.7755**
    * SQuAD R@5 **0.9071**

    That's much more important than the seed-0 failure. Seed 0's SQuAD miss was only 0.0008, and seeds 1-2 showed that it was initialization noise.

    The paired gains against the frozen v1 universal GAT are particularly valuable:

    $$
    \Delta_{\text{MetaQA Hit@1}}\approx +7.8\text{ pp}
    $$

    and

    $$
    \Delta_{\text{MetaQA 3-hop}}\approx +11.2\text{ pp}.
    $$

    So the v2 architectural changes are doing **exactly what we built them to do**: improve deep relational reasoning without destroying the text/retrieval cases.

    That is a real advance over the M3B GAT.

    ---

    ## And the MLP failure is informative, not disastrous

    The twin isn't some obviously broken model.

    It gets:

    * MetaQA Hit@1 **0.7753**, approximately **+16 pp** over frozen QLS-U on that gate.
    * SQuAD **0.9063**, so it preserves the do-nothing/retrieval case.
    * But 2Wiki R@5 is consistently low:

    ```text
    seed 0   .8545
    seed 1   .8523
    seed 2   .8481
    mean     .8516
    required .8578
    ```

    All three seeds miss.

    That means **this is not seed noise**.

    And that's exactly what we needed the replication to determine.

    The current fixed/depth-compiled representation substantially improves the KB case, but something about the new universal non-MP model sacrifices a little of the text-graph ranking behavior on 2Wiki.

    So don't patch it inside v2. Universal-v2 did its job: it told us where the non-MP model still fails.

    ---

    # The project has now split naturally into two tracks

    ### Universal GNN: advance

    I would now freeze:

    ```text
    UNIVERSAL_GNN_V2_SELECTED
        = u_gnn_v2_ef
    ```

    and move it into the **six-dataset universal stage**.

    This is the first point where I think it makes sense to pursue your "one GNN for KB + text" claim seriously.

    It has demonstrated on the triangle that it can simultaneously:

    ```text
    MetaQA  -> improve deep typed reasoning massively
    2Wiki   -> improve/retain text-graph performance
    SQuAD   -> avoid harming retrieval
    ```

    Now we need to see whether that transfers to the three datasets it has not been optimized against:

    ```text
    WebQSP
    HotpotQA
    MuSiQue
    ```

    Those are exactly the right stress tests.

    ### Universal MLP: new declaration

    Don't advance `u_mlp_v2_mix` as the universal MLP.

    Open a tiny **v2.1 non-MP phase** whose explicit problem is:

    > **Retain the large MetaQA gain of v2 while recovering the 2Wiki regression.**

    That is far better than vaguely "make MLP better."

    ---

    # I think I know the minimal MLP-v2.1 change worth testing

    Do **not** add another huge feature family yet.

    The existing v2 basis is clearly useful-MetaQA gained ~16 points.

    The problem appears to be that the model cannot cleanly fall back to the old strong representation when the new depth/path basis is unhelpful.

    So I would make the first v2.1 architecture a **residual block mixer with an explicit identity path**:

    $$
    s_{\text{v2.1}}
    =
    s_{\text{core}}
    +
    \sum_b g_b(q,v)\,\Delta_b(q,v),
    $$

    where \(b\) could be:

    ```text
    depth/support
    ordered relation paths
    fixed semantic prototypes
    seed-conditioned aggregates
    ```

    and importantly:

    $$
    g_b \approx 0
    $$

    is an easy solution.

    I'd initialize those new-block residual gates at or very near zero rather than the v2 mixer's 0.5.

    This gives the model an easy behavior:

    > "On 2Wiki, keep the strong old/core representation."

    while still allowing:

    > "On MetaQA, turn on the deep relation/path blocks."

    No dataset ID. No per-dataset head. Still one universal MLP.

    That is a very principled response to the observed failure.

    Before fitting even that, use the already-existing outputs to diagnose **where** 2Wiki v2 loses to QLS-U/core: seed-distance bucket, multi-gold versus single-gold, STRUCT reach, depth block activation, and new-block gate values. That's analysis only and may tell us whether the residual-gating hypothesis is right.

    ---

    # Most important next experiment: six-dataset U-GNN

    I would authorize this before spending much time on the MLP repair.

    The question now is:

    > **Does `u_gnn_v2_ef`, trained as one checkpoint across all six datasets, retain its new KB reasoning strength while remaining strong on passage retrieval?**

    That gives us the potential method contribution.

    The key six-dataset table should eventually be:

    | Dataset |               M3B GAT-v1 | U-GNN-v2 |      Relevant SOTA calibration |
    | ------- | -----------------------: | -------: | -----------------------------: |
    | MetaQA  |                 .831 H@1 |        ? | ~high-90s dedicated KB systems |
    | WebQSP  |                 .595 H@1 |        ? |                         ~76-77 |
    | Hotpot  |                 .896 R@5 |        ? |         strong text retrievers |
    | 2Wiki   |                 .885 R@5 |        ? |         strong text retrievers |
    | MuSiQue |                 .521 R@5 |        ? |         strong text retrievers |
    | SQuAD   | retrieval already strong |        ? |                        control |

    We should not yet call the v2 GNN SOTA from the trio pilot. But **MetaQA moving from ~.83 to ~.91 while 2Wiki and SQuAD remain good is exactly the kind of movement we needed before spending six-dataset compute.**

    ---

    ## What I would authorize next

    I would make the order:

    1. **Freeze `u_gnn_v2_ef` as the successful replicated Universal-v2 GNN.**
    2. File a dated authorization for its already-planned **joint six-dataset checkpoint**; keep uniform dataset sampling and no dataset-specific heads.
    3. Evaluate all six using the existing frozen candidate contracts and report both our metrics and exact SOTA-compatible metrics where possible.
    4. Separately run **analysis-only diagnostics** on why `u_mlp_v2_mix` loses 2Wiki.
    5. Then declare **Universal-MLP-v2.1**, with the smallest defensible change, likely explicit zero-initialized residual/block gating.
    6. Do not modify M3B or Universal-v2 records; both remain historical evidence exactly as filed.

    The Modern Standby incident and shard-guard bug do not concern me scientifically based on your description. The fit resumed without redraw/change, and the eval bug was a bookkeeping guard that was fixed without changing populations or scores. Keeping both incidents in the run record is sufficient.

    ### Where the paper stands now

    This is stronger than it was two days ago.

    You now have:

    **M3B:** a clean causal result about *when message passing matters.*

    **Universal-v2:** evidence that a relation/depth-aware universal GNN can materially improve the hardest KB regime **without sacrificing text retrieval**, replicated over three seeds and on a v2-held half.

    **Universal MLP:** evidence that deterministic compilation can make a huge KB improvement, but also a concrete remaining universality failure on 2Wiki.

    So I would **advance the GNN**, not repair it further, and **open a separate minimal MLP-v2.1 track**.

    That keeps the paper clean: one successful universal GNN trajectory, one transparent non-MP trajectory, and the original causal experiment untouched.
