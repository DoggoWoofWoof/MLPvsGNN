      replication_held_record: outputs/universal_v2/replication_held_record.json (written once, only for a REPLICATION_PASS
        family)
      document: 'docs/UNIVERSAL_V2_REPLICATION.md (re-renderable from the records; states ORIGINAL PILOT STATUS:
        PILOT_FAILED and POST-PILOT REPLICATION STATUS: <status> separately)'
      report_record: outputs/universal_v2/replication_report_record.json (the document's sha256 table)
      declaration_block: replication_record_<date> (a dated block appended by scripts/universal_v2_run.py --stage
        file --which replication; the status line is not moved)
      fits: outputs/universal_v2/fits/<arm>__H128__s<1|2>.json and .pt, each record carrying the authorising block
        and the checks it passed
      evals: outputs/universal_v2/eval/<name>__more_<sha8>.json / .npz / _query_ids.json
    reporting:
    - seed-wise gate numbers
    - three-seed means
    - seed standard deviations
    - original thresholds
    - margins to threshold
    - bootstrap intervals
    - family replication statuses
    - held-confirmation results where authorised
    - compute time
    - incidents
    - artifact hashes
    - checkpoint hashes
    - commit IDs
    interpretation_rule:
      BOTH_REPLICATION_PASS: the seed-0 terminal PILOT_FAILED result was sensitive to initialization, while the
        frozen architectures satisfy the original requirements on three-seed mean; the original pilot is still reported
        as failed
      GNN_REPLICATION_ONLY: the proposed universal GNN is stable enough to continue; the universal non-MP twin is
        not yet sufficiently robust
      TWIN_REPLICATION_ONLY: the compiled non-MP architecture is stable enough to continue; the proposed universal
        GNN is not yet sufficiently robust
      BOTH_REPLICATION_FAIL: the seed-0 failures were not merely initialization noise; this closes Universal-v2
        without rescue; any architecture change must happen in a new phase
    no_architecture_repair: >-
      inside this amendment nothing is added: no fixed-score gating mechanism, no no-harm loss, no further recurrent
      step, no relation or path feature, no hidden dimension, no dataset balancing change, no dataset-specific head,
      no other candidate; those belong to a later Universal-v2.1 / Universal-v3 declaration
    compute: >-
      the amendment_3 compute_ceiling_guard applies unchanged (compute.hard_ceiling 150 fit-hours, 24.65 spent by
      the pilot seed-0 matrix): two u_gnn_v2_ef fits of about 5.0 h and two u_mlp_v2_mix fits of about 1.1 h at
      8 threads are expected, about 12.3 fit-hours, one fit lane; the supplement eval pass is not a fit and does
      not count, as the timing run did not; the fit-hours and the eval lane-hours are reported
    hard_stops:
      frozen contract hash changes: amendment_3 condition 1 (model_inputs and the fit records pin contract_frozen_2026_09_19)
      M3B pin changes: amendment_3 condition 3 (every stage verifies the pins first)
      compiled-cache hash changes: amendment_3 condition 2 (the caches are read as compiled; the fit refuses a cache
        that is not this contract)
      model code differs from the frozen selected architecture: 'amendment_3 condition 4 (the seed-0 fit record:
        parameter count, columns, core sha256 and evidence fields)'
      gate or held populations differ: 'amendment_3 condition 6 (pooled_rows: query lists, half labels and fixed
        rrf per query)'
      test data is touched: amendment_3 condition 5
      compute exceeds the existing authorised ceiling: amendment_3 condition 9 (the fit-hours guard)
      completing the work would require a scientific change: amendment_3 conditions 7 and 11
      procedure: 'amendment_3 hard_stop_procedure: hard_stop_<date> with the condition, the evidence and the remaining
        work; the status line is not moved'
    crash_and_reboot: 'as amendment_3 crash_and_reboot: the checkpoint resumes the fit, finished records are not
      repeated, eval shards merge, every incident is logged with its wall clock in replication_record_<date>.incidents'
    execution:
    - file amendment
    - commit before fitting
    - train seeds 1-2 for the two frozen selected arms
    - score V2_GATE (the supplement eval pass, both halves labelled)
    - compute three-seed confirmation (replication_record.json)
    - read V2_HELD_CONFIRMATION only for REPLICATION_PASS families (replication_held_record.json)
    - render report (docs/UNIVERSAL_V2_REPLICATION.md)
    - append run record (replication_record_<date>)
    - run tests
    - commit
    - STOP
  reconciliations_where_the_ruling_and_the_declaration_differ:
    ensemble_wording: >-
      the ruling says per-query ensemble/seed mean: the declared aggregation is the per-query mean of the per-seed
      metric values (each seed scored on its own, the metric averaged per query over the seeds), not an ensemble
      of the seeds' scores re-ranked; that is what runs, as it ran for the pilot's seed confirmation
    held_half_of_the_pilot: >-
      held_record.json was read once under the pilot for both selected arms at seed 0 (the pilot's reported column,
      filed in run_record_2026_09_21); the replication does not re-read it; a REPLICATION_PASS family gets one further
      held reading of seeds 1-2 and the seed mean; a REPLICATION_FAIL family gets none
    status_line: the ruling keeps the original status; the declaration's one status line therefore stays RUN_PILOT_FAILED
      and the replication status is a field of the dated replication record
    hard_stop_conditions: the ruling's eight conditions are the amendment_3 conditions named under post_pilot_replication.hard_stops;
      a stop is filed as amendment_3 states
    seed_0_of_the_gnn_and_the_twin: >-
