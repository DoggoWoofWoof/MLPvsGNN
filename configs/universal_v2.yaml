  training_mixture_pinned:   # restates check_3_firewalls_made_explicit.data_mixture_frozen with the code facts; nothing changes
    sampler: mp_retrieval.m3b_train.draw_indices with dataset_draw per_query (M3B amendment 3, pinned) -- for each of the 16 query draws of a batch the dataset is drawn uniformly among the three pilot datasets (multinomial counts per batch, no quota), then that many fit queries of the dataset are taken from a per-dataset permutation without replacement, reshuffled when exhausted
    balance: balanced, not proportional -- each dataset receives one third of the draws in expectation regardless of its carve size (metaqa 5,960 fit queries, 2wiki 5,928, squad 5,856); over an epoch of 2,000 batches each dataset is drawn about 10,700 times
    drawn_from: the trainable fit queries of each carve (at least one gold in the pool), so every drawn query contributes to the loss
    loss: mp_retrieval.m3b_models.listwise_loss, pinned -- per query, minus the mean over its in-pool golds of the log-softmax over its pool; the batch loss is the unweighted mean over the drawn queries of the batch; no per-dataset weight, no per-query weight, no normalisation by dataset
    optimiser_and_budget: as training.rule -- Adam lr 1e-3, weight decay 1e-4, clip 1.0, 6 epochs of 2,000 batches, patience 2 on the select macro recall@5, 8-hour epoch limit; identical for every arm including the control gat_universal_v1_trio
