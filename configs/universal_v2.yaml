    - any candidate architecture beyond the arms declared here, until a dated amendment names it before its first fit
    - the historical graph.pt substrate (regime 2, docs/M3B_RESULTS.md section 6); everything here is the served NAME_ONLY package
  on_completion_of_each_stop: STOP_FOR_REVIEW with the numbers; nothing continues on its own past a stop

