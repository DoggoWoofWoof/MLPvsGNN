# ══════════════════════════════════════════════════════════════════
# Amendment 4 (2026-09-21): the post-pilot replication of the two frozen
# selected arms -- the user's prospective ruling filed verbatim after the
# pilot closed at PILOT_FAILED (d2850ab), before any of the fits it
# authorises. Seeds 1-2 of u_gnn_v2_ef and u_mlp_v2_mix under the frozen
# protocol, the three-seed mean against the original frozen cells, a
# separate replication status; the original status is not moved and
# nothing is redesigned. Filed after the run-produced blocks: the file is
# chronological and append-only.
# ══════════════════════════════════════════════════════════════════
amendment_4_2026_09_21:
  filed_utc: '2026-09-21T10:01:22Z'
  status_after: RUN_PILOT_FAILED
  reviewed: 'd2850ab (the terminal state of the pilot: docs/UNIVERSAL_V2_PILOT.md, pilot_gate_record_2026_09_21,
    run_record_2026_09_21, status RUN_PILOT_FAILED); filed after the run-produced blocks in the order the file is
    written (chronological, append-only, as the M3B declaration filed its amendments 3 and 4 after its run-produced
    blocks)'
  what_this_is: >-
    the user's prospective amendment, filed verbatim after the pilot closed at PILOT_FAILED: seeds 1 and 2 of the
    two already-selected frozen arms are fitted under the frozen training protocol and the three-seed per-query
    mean is read against the original frozen gate cells on V2_GATE by the aggregation the declaration already carries
    for seed confirmation; the pilot's status, records and document are not touched and its result is not reinterpreted;
    the replication carries its own status vocabulary, filed here before any of its fits; nothing is redesigned
    inside it. Where its wording and the declaration differ, the declaration governs and the difference is named
    under reconciliations.
  ruling_verbatim: |
    AMENDMENT — POST-PILOT REPLICATION OF FROZEN UNIVERSAL-v2 ARMS
    ===============================================================

    Date: 2026-09-21

    This amendment is prospective with respect to every fit authorised below.

    The original Universal-v2 pilot remains closed with its filed result:

        PILOT_FAILED

    at commit:

        d2850ab

    Nothing in this amendment changes, reinterprets, overrides, or retroactively
    passes the original seed-0 pilot.

    ===============================================================
    MOTIVATION
    ===============================================================

    The two selected families failed exactly one gate cell each:

    GNN:
        selected arm:
            u_gnn_v2_ef

        failed cell:
            SQuAD R@5

        observed:
            0.8988

        frozen threshold:
            0.8996

        shortfall:
            0.0008

    Twin:
        selected arm:
            u_mlp_v2_mix

        failed cell:
            2Wiki R@5

        observed:
            0.8545

        frozen threshold:
            0.8578

        shortfall:
            0.0033

    Every other gate cell for those selected arms passed.

    Because both failures are small and only seed 0 has been fitted, the next
    scientific question is:

        Are the failures stable properties of the frozen models,
        or seed-specific variation?

    This must be answered before any architecture is modified.

    ===============================================================
    FROZEN OBJECTS
    ===============================================================

    Do NOT change:

    - raw feature contract
    - surviving 129-column contract
    - feature screen
    - compiled caches
    - candidate pools
    - model architectures
    - H=128
    - relation-path features
    - K_REL
    - dataset mixture
    - loss
    - optimizer
    - training schedule
    - checkpoint-selection rule
    - model-selection result
    - gate thresholds
    - gate population
    - held-confirmation population
    - M3B artifacts
    - seed-0 checkpoints/results

    No feature may be added or removed.

    No architecture may be modified.

    No threshold may be relaxed.

    No new candidate model may be introduced.

    ===============================================================
    AUTHORISED FITS
    ===============================================================

    Train ONLY:

        u_gnn_v2_ef
            seed 1
            seed 2

        u_mlp_v2_mix
            seed 1
            seed 2

    using exactly the frozen training protocol.

    Do not retrain seed 0.

    Do not train any other Universal-v2 arm.

    Do not rerun model selection.

    ===============================================================
    REPLICATION METRIC
    ===============================================================

    After seeds 1 and 2 complete, score all three seeds on the existing:

        V2_GATE

    Compute the per-query ensemble/seed mean exactly using the aggregation
    already declared for Universal-v2 seed confirmation.

    Evaluate against the ORIGINAL frozen gate thresholds.

    No threshold is changed.

    For each family report:

        seed 0
        seed 1
        seed 2
        mean
        standard deviation
        paired bootstrap interval where applicable

    ===============================================================
    STATUS VOCABULARY
    ===============================================================

    The original status remains:

        PILOT_FAILED

    The replication receives a SEPARATE status.

    For each family:

        REPLICATION_PASS
        REPLICATION_FAIL

    Overall:

        BOTH_REPLICATION_PASS
        GNN_REPLICATION_ONLY
        TWIN_REPLICATION_ONLY
        BOTH_REPLICATION_FAIL

    Never rename a replication pass to:

        PILOT_PASS

    or imply that the original preregistered pilot passed.

    ===============================================================
    REPLICATION PASS RULE
    ===============================================================

    A family receives:

        REPLICATION_PASS

    only if its THREE-SEED MEAN satisfies EVERY original frozen gate cell for
    that family.

    Not merely the cell that failed seed 0.

    No averaging across datasets is allowed to compensate for a failed cell.

    No tolerance band is added.

    No epsilon is introduced.

    ===============================================================
    HELD CONFIRMATION
    ===============================================================

    If a family obtains REPLICATION_PASS:

        score/read V2_HELD_CONFIRMATION exactly once for that family.

    If it obtains REPLICATION_FAIL:

        do NOT read the held half for that family.

    The held half remains a Universal-v2 architecture-selection holdout, not a
    globally unseen dataset, because the parent M3B development population had
    already been evaluated previously.

    Use only the already-declared held evaluation procedure.

    Do not introduce a new held threshold.

    If the declaration already specifies how gate thresholds map to the held
    half, use that rule unchanged.

    Report:

        V2_GATE seed-mean result
        V2_HELD_CONFIRMATION result

    separately.

    ===============================================================
    INTERPRETATION RULE
    ===============================================================

    Four scientifically different outcomes are possible.

    1. BOTH_REPLICATION_PASS

    Interpretation:

        the seed-0 terminal PILOT_FAILED result was sensitive to initialization,
        while the frozen architectures satisfy the original requirements on
        three-seed mean.

    The original pilot is still reported as failed.

    2. GNN_REPLICATION_ONLY

    Interpretation:

        the proposed universal GNN is stable enough to continue;
        the universal non-MP twin is not yet sufficiently robust.

    3. TWIN_REPLICATION_ONLY

    Interpretation:

        the compiled non-MP architecture is stable enough to continue;
        the proposed universal GNN is not yet sufficiently robust.

    4. BOTH_REPLICATION_FAIL

    Interpretation:

        the seed-0 failures were not merely initialization noise.

    This closes Universal-v2 without rescue.

    Any architecture change must happen in a new phase.

    ===============================================================
    NO ARCHITECTURE REPAIR INSIDE THIS AMENDMENT
    ===============================================================

    Even if a failure is extremely small, do NOT automatically add:

    - a fixed-score gating mechanism
    - a no-harm loss
    - another recurrent step
    - more relation features
    - more path features
    - more hidden dimensions
    - dataset balancing changes
    - dataset-specific heads
    - another model candidate

    Those belong to a later Universal-v2.1 / Universal-v3 declaration.

    ===============================================================
    REPORTING
    ===============================================================

    Produce a post-pilot replication section containing:

    - seed-wise gate numbers
    - three-seed means
    - seed standard deviations
    - original thresholds
    - margins to threshold
    - bootstrap intervals
    - family replication statuses
    - held-confirmation results where authorised
    - compute time
    - incidents
    - artifact hashes
    - checkpoint hashes
    - commit IDs

    Explicitly state:

        ORIGINAL PILOT STATUS: PILOT_FAILED

    and separately:

        POST-PILOT REPLICATION STATUS: <status>

    ===============================================================
    EXECUTION AUTHORIZATION
    ===============================================================

    This amendment authorises the complete replication workflow without
    intermediate review:

        file amendment
            ↓
        commit before fitting
            ↓
        train seeds 1–2 for the two frozen selected arms
            ↓
        score V2_GATE
            ↓
        compute three-seed confirmation
            ↓
        read V2_HELD_CONFIRMATION only for REPLICATION_PASS families
            ↓
        render report
            ↓
        append run record
            ↓
        run tests
            ↓
        commit
            ↓
        STOP

    Crashes/reboots are resumable operational incidents and do not require
    review.

    ===============================================================
    HARD STOP
    ===============================================================

    Stop immediately if:

    - frozen contract hash changes;
    - M3B pin changes;
    - compiled-cache hash changes;
    - model code differs from the frozen selected architecture;
    - gate or held populations differ;
    - test data is touched;
    - compute exceeds the existing authorised ceiling;
    - completing the work would require a scientific change.

    Otherwise continue autonomously to terminal replication status.
  gloss_verbatim: |
    Yes — the clean next move is not to redesign anything yet. Both failures are tiny enough that the first question should be whether they are seed-0 noise.
    The scientifically safest follow-up is a new dated amendment that trains seeds 1–2 for only the two already-selected frozen models, with no threshold changes and no model changes. The original pilot remains `PILOT_FAILED`; this is a post-pilot replication, not a retroactive rescue.
    Send this verbatim:
    [the ruling above]
    Why I prefer this over immediately making v2.1
    Because 0.0008 on SQuAD is tiny. If GNN seeds 1–2 are around or above the threshold, redesigning the GNN now would be architecture shopping around one initialization.
    Likewise the MLP is only 0.0033 short on 2Wiki. Before we invent another compiled block, we should know whether that deficit is reproducible.
    There are two particularly useful possible outcomes:

    * If the three-seed GNN mean passes SQuAD and the other GNN cells remain strong, then Universal-v2's GNN idea may already be viable.
    * If the MLP still consistently misses 2Wiki, then the next non-MP phase has a concrete weakness to fix rather than a noisy one.

    And if both fail again, that is also valuable: then we open Universal-v2.1 prospectively, with the original v2 failure preserved cleanly.
    So this is the cheapest and most defensible next experiment.
