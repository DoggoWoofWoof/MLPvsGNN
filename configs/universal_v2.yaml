# -- amendment 7: the placement that answers the measured epoch, filed before any stage-2 fit --
amendment_7_2026_09_23:
  filed_utc: '2026-09-23T05:22:59Z'
  what_this_is: The placement required by timing_before_the_schedule.if_the_projection_exceeds_the_ceiling of authorization_stage_2_2026_09_22.
    The measured joint epoch filed as timing_stage_2_2026_09_23 exceeded three hours, so the schedule may not proceed
    until the placement or a reduced schedule is filed in a dated amendment. This files the placement. No fit has
    been started, no stage-2 weight exists, and no number in this amendment comes from a model.
  what_was_measured:
    filed_as: timing_stage_2_2026_09_23
    epoch_seconds: 20282.9
    epoch_hours: 5.634
    threads_used: 6
    peak_rss_gb: 9.4
    declared_projection_per_epoch_hours: 2.0 to 2.7
    declared_projection_three_seeds_hours: 24 to 33
    measured_projection_three_seeds_hours_at_max_epochs: 101.41
    fit_hours_spent: 46.36
    ceiling_fit_hours: 150.0
  the_measurement_was_taken_off_the_declared_placement:
    what_the_rule_asks_for: the rule asks for the epoch wall clock at 8 threads. The pass was run at 6, a placement
      the driver chose so the machine could be shared with an unrelated job of another session. That is a deviation
      from the declared placement, and it is recorded here rather than corrected quietly.
    why_the_trigger_fires_anyway: thread scaling is at best linear, so 8 threads cannot be faster than 5.634 hours
      times 6 over 8, which is 4.226 hours. That is over three hours, so the trigger fires whatever the 8-thread
      number would have been. The amendment is required, not elective, and no 8-thread measurement is needed to
      establish that.
    why_the_measured_number_is_kept_and_not_re_measured: the compute guard projects each fit as the filed epoch
      times max_epochs. A 6-thread epoch makes that projection larger than the truth, so keeping it leaves the ceiling
      guard strictly conservative. Re-measuring at 8 threads could only loosen the guard, and would spend about
      four more hours of wall clock to do it. The number is kept as measured and is labelled a 6-thread number wherever
      it is read.
  why_the_epoch_is_longer_than_the_filed_projection:
    the_part_that_is_the_substrate:
      mean_nodes_per_drawn_query_trio: 724
      mean_nodes_per_drawn_query_six: 1079
      ratio: 1.49
      per_dataset_fit_mean_nodes_per_query:
        metaqa: 2017
        2wiki: 106
        squad: 50
        hotpotqa: 94
        webqsp: 2119
        musique: 2090
      what_it_predicts: the pilot measured this same arm at 2.247 seconds per batch at 8 threads on batches of 9011
        to 12879 nodes, and its fits ran about 1.25 hours per epoch. Scaling by 1.49 predicts roughly 1.9 hours
        per epoch at 8 threads, which is what the filed projection of 2.0 to 2.7 hours was built on. The substrate
        alone does not account for the measurement.
    the_part_that_is_the_machine:
      resident_cache: the six fit and select caches total about 20.7 GB (6.84 GB trio, 13.88 GB added) on a 16.8
        GB machine, so the memory-mapped scalar columns cannot stay resident and a batch gathers rows that are no
        longer in page cache. Free memory during the pass was 0.64 GB.
      contention: an unrelated job of another session held between 1.2 and 6.3 GB for part of the pass. The pilot
        shows how large this factor is on this machine -- the three u_gnn_v2_ef seeds took 18060, 25618 and 37351
        seconds for identical work, a spread of 2.07 times, from contention alone.
      conclusion: the measured 5.634 hours is an upper bound taken at three quarters of the declared threads on
        a shared machine. It is not established as a property of the six-dataset schedule.
  the_placement_that_is_filed:
    fits: the three fits run at 8 threads, the placement the rule names and the placement every pilot fit used,
      so the seeds are comparable with one another and with the trio checkpoint that amendment 6 reprints beside
      them. One fit at a time, with nothing else of this session running next to them.
    evaluation: the one eval pass runs one dataset at a time at 4 threads, with metaqa in four shards merged afterwards.
      Placement only -- the populations, the pools and the scoring are untouched.
    local_only: no Modal placement is taken. later_stages.compute_placement would require the CPU-GPU equivalence
      test first, and that test is not run here.
  what_does_not_change:
    training_rule: max_epochs 6, 2000 batches of 16, patience 2, lr 0.001, weight decay 0.0001, clip 1.0, per_query
      dataset draw and epoch_limit_s 28800, every one of them as frozen. No reduced schedule is filed.
    seeds: three, 0 and 1 and 2, none dropped
    architecture: u_gnn_v2_ef, 420932 parameters, hidden 128, K_REL 4, evidence flow, the 129-column contract
    populations: the six declared M3B eval populations, webqsp on train_holdout, no test split
    selection: the macro-six select recall@5 checkpoint rule, unchanged
    the_ceiling: 150 fit-hours and the guard that enforces it, both unchanged
  the_ceiling_arithmetic:
    worst_case: 46.36 spent plus three fits at the conservative 33.80 projected is 147.76 fit-hours against the
      ceiling of 150, inside it by 2.24 hours.
    what_is_likely: every pilot fit early-stopped after 4 epochs under patience 2, which would put a six-way seed
      near 22.5 hours at the measured rate and lower at 8 threads. The worst case is the case where no seed early-stops.
    what_happens_if_it_binds: fit_hours_guard_six refuses the fit before it starts, writes six/ceiling_breach.json
      and the stage stops for a declaration. Nothing overruns quietly.
    not_counted: the 5.64 hours of the timing pass is not a fit record and does not enter fit_hours_spent, so the
      machine time this stage has cost is larger than the accounted figure by that much.
  what_this_does_not_authorise:
  - no reduced schedule -- not fewer epochs, not fewer batches, not a smaller batch, not a dropped seed
  - no architecture, contract, column, K_REL or parameter change
  - no change to the populations, the splits, the metrics, the references or the band verdicts
  - no gate -- this_stage_has_no_gate is unchanged, and this amendment reads no model number
  - no Modal placement and no GPU, which would need the equivalence test of later_stages.compute_placement
  - no second timing block; timing_stage_2_2026_09_23 is filed once and stands as measured, at 6 threads
  status_lines_not_moved:
    file_status: RUN_PILOT_FAILED
    original_pilot_status: PILOT_FAILED
    post_pilot_replication_status: GNN_REPLICATION_ONLY
    stage_2_status: DECLARED_NOT_RUN until run_record_stage_2_<date> is filed
  filed_before: any stage-2 fit exists; the measured epoch is the only stage-2 number that precedes it
  tests:
  - the amendment is the last dated block and follows amendment_6_2026_09_23
  - it answers timing_stage_2_2026_09_23, and that block records an epoch over three hours
  - the frozen training rule is restated unchanged and no reduced schedule is filed
  - the filed fit placement is 8 threads, the placement every pilot fit record used
  - no status line moves, no weight is fitted and no model number is read by this block

# -- amendment 8: the cache figure of amendment 7 corrected, and the filed placement measured --
amendment_8_2026_09_23:
  filed_utc: '2026-09-23T15:59:04Z'
  what_this_is: A correction to amendment_7_2026_09_23. One number in its explanation of the slow epoch was wrong,
    and the placement it filed has since been measured and did not help. Filed while the first fit is still running
    -- no stage-2 fit record, checkpoint hash or evaluation number exists yet. Nothing scientific is changed and
    no status line moves.
  the_number_that_was_wrong:
    where: amendment_7_2026_09_23.why_the_epoch_is_longer_than_the_filed_projection.the_part_that_is_the_machine.resident_cache
    what_it_said: the six fit and select caches total about 20.7 GB (6.84 GB trio, 13.88 GB added) on a 16.8 GB
      machine
    what_is_true: the six caches total 13.88 GB, not 20.7 GB. cache_bytes_total in the compile record is the total
      across all six datasets, and amendment 7 read it as the added three and then added the trio to it a second
      time. Of the 13.88 GB the trio is 6.84 GB and the three added datasets are 7.04 GB.
    measured_per_dataset_gb:
      metaqa: 6.31
      musique: 5.38
      webqsp: 1.34
      2wiki: 0.35
      hotpotqa: 0.32
      squad: 0.18
      total: 13.88
    what_it_does_not_touch: the compile record is itself correct and is not edited -- cache_bytes_total 13877946520
      is the figure it filed, inside the 20 GB bound of amendment 5 on either reading. Neither the placement decision
      nor the ceiling arithmetic of amendment 7 used this number, so no decision filed there rests on it.
    what_it_does_change: the magnitude of the memory argument only. The argument stands on the measurements below
      rather than on an inflated cache figure, and is restated here at its true size.
  what_has_since_been_measured:
    the_filed_placement_did_not_help: epoch 0 of seed 0 at the filed 8 threads took 23008.5 s, against 20282.9 s
      for the same work at 6 threads in the timing pass. The placement amendment 7 filed cost about 13 percent rather
      than saving the third the thread count would suggest.
    the_constraint_is_memory_not_cores: the fit consumed 136672 s of CPU over 613 minutes of wall clock, which is
      3.72 of the 8 threads it asked for. Swap in use ran between 16.1 and 17.8 GB and free RAM between 0.5 and
      1.5 GB of 16.8. More threads raise concurrent memory demand on a machine that is already paging, which is
      why 8 was slower than 6.
    disk_is_stable: free space on the system disk is 8.81 to 8.85 GB across twelve one-minute samples, above the
      8 GB floor of compute.abort_criteria and not falling. The earlier decline from 16.7 GB was the system pagefile
      expanding to its allocated 37.4 GB, which has stopped.
    a_gap_that_is_recorded_not_fixed: SixDiskGuard is enforced in the compile stage only. The fits, the eval pass
      and the merge do not check free disk. That is recorded here as a known gap; changing the runner while a fit
      is running would be a systems change made on top of a live number, which the process rules do not allow.
  the_placement_is_not_changed:
    decision: the three fits stay at 8 threads
    why: the three seeds have to be comparable with one another and with the trio checkpoint amendment 6 reprints
      beside them, and seed 0 has already spent two epochs at 8 threads. A 13 percent saving is not worth a fit
      whose epochs ran at two different placements, and one comparison is weak evidence against a machine the pilot
      showed to vary by 2.07 times from contention alone.
    what_would_change_it: an EpochTooLong halt or a ceiling refusal, either of which stops the stage for a declaration
      rather than being worked around at run time.
  what_this_does_not_authorise:
  - no change to the training rule, the seeds, the architecture, the contract or the columns
  - no change to the populations, the splits, the metrics, the references or the band verdicts
  - no reduced schedule, and no new placement -- the fits continue exactly as amendment 7 filed them
  - no gate, no threshold and no reading of a model number; this_stage_has_no_gate is unchanged
  - no edit to amendment_7_2026_09_23, to timing_stage_2_2026_09_23 or to the compile record
  - no change to the runner while a fit is running
  status_lines_not_moved:
    file_status: RUN_PILOT_FAILED
    original_pilot_status: PILOT_FAILED
    post_pilot_replication_status: GNN_REPLICATION_ONLY
    stage_2_status: DECLARED_NOT_RUN until run_record_stage_2_<date> is filed
  filed_before: any stage-2 fit record, checkpoint hash or evaluation number exists
  tests:
  - the amendment is the last dated block and follows amendment_7_2026_09_23
  - the corrected cache total equals the compile record cache_bytes_total and the caches measured on disk
  - the trio and added shares sum to that total, so the trio is not counted twice
  - amendment 7 is quoted, not edited, and its blocks are unchanged
  - the placement stays 8 threads and no reduced schedule is filed
  - no status line moves and no model number is read by this block

