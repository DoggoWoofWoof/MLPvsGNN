  correction_2_ordered_relation_path_channel:   # supersedes the endpoint-order invariance of information_contract_v2.depth_basis_columns.relpath_* as the only relation-path reading
    why: >-
      relpath_max / mean / min are functions of the multiset of cos(q, e_r)
      along a walk: r1 -> r2 and r2 -> r1 give the same three numbers at the
      endpoint, and a relation followed head -> tail is not told from the
      same relation followed tail -> head. The MetaQA mechanism under test is
      ordered relation composition (a 2-hop or 3-hop chain in a stated
      direction), so the contract must let the model distinguish it; the
      fixed-score twin must be given the same information, or the comparison
      measures who has the input, not who has message passing.
    channel: the best typed STRUCT walk of length t from a seed to v, reported position by position, for t in (2, 3)
    best_walk: >-
      the walk relpath_max_h{t} already scores -- the typed STRUCT walk of
      length t from a seed to v with the maximum mean cos(q, e_r) -- kept by
      one back-pointer per node and depth in the same dynamic programme;
      position k = 1 is the step out of the seed, position k = t the step into
      v. Ties: at every step the first entry in (owner, neighbour, relation)
      order among those attaining the maximum (the M3B typed_pool_edges
      order), so the chosen walk is deterministic and independent of the
      machine.
    columns:   # 13 = 5 at t = 2 + 8 at t = 3; group ordered_relation_path; block TYPED_h{t}; mask typed_walks_h{t}
      opath_h{t}_q{k}: cos(q, e_r) of the relation at position k of the best walk; 0 if no typed walk of length t reaches v; k = 1..t
      opath_h{t}_dir{k}: +1 if step k traverses its stored relation head -> tail (forward), -1 if tail -> head (inverse), 0 if no walk; k = 1..t
      opath_h{t}_adj{k}{k+1}: cos(e_r at position k, e_r at position k + 1) of the best walk -- the served relation-text embeddings of consecutive steps (1 when a relation is composed with itself); 0 if no walk; k = 1..t-1
    direction_convention: >-
      a typed entry (owner v, neighbour u, rel, dir) as M3B reads it has dir 2
      when the stored triple is u -> v, so the walk step u -> v follows the
      relation head -> tail (+1), and dir 1 when the stored triple is v -> u,
      so the step goes against it (-1)
    properties:
      bounded: one walk per node and depth, never the set of walks; the invariant summaries (max / mean / min over every walk) stay as declared
      fixed_dimensional: 13 scalars whatever the dataset, the relation vocabulary or the pool size
      semantic: every value is a cosine with the served relation-text embeddings (gte-Qwen2, outputs/m3b/relations/) or the sign of a stored orientation; no relation id, no per-dataset table, no learned relation vocabulary enters the contract
      identity: the mean over k of opath_h{t}_q{k} equals relpath_max_h{t} wherever a walk exists (tested); the ordered channel adds the order and the direction to what the invariant summary already carries, nothing else
      order_distinguished: on the chain 0 -a-> 1 -b-> 2 -c-> 3 versus 0 -b-> 1 -a-> 2 -c-> 3 the endpoint reads (a, b) versus (b, a) at t = 2 and its adj23 changes at t = 3, while relpath_* cannot tell them apart (tests/test_universal_v2_features.py)
    untyped_datasets: 2wiki and squad carry no relation table; every ordered column is 0 with typed_walks_h{t} = 0, exactly as the typed depth-basis columns already are -- one contract, one state dict
    parameter_budgets_at_164_columns: {u_mlp_v2: 339330, u_mlp_v2_mix: 339915, u_gnn_v2: 426563, u_gnn_v2_ef: 429892, u_gnn_v2_core78: 407876, gat_universal_v1_trio: 353410, twin_budget: 350000, gnn_budget: 450000, holds: true}
    cost: one integer back-pointer array per node and depth plus a back-trace of length t and two gathers of relation rows; measured with the rest of the typed basis in the step-3 compile record (group_seconds_per_1000_queries.typed_basis)
    tests_added:
      - the ordered channel distinguishes r1 -> r2 from r2 -> r1 at the endpoint itself
      - reversing a stored relation flips the sign of exactly the dir columns that read it and changes nothing else in the 86
      - the argmax walk is taken and ties break by entry order (an inverse walk first when it is listed first)
      - the mean of the ordered q columns equals relpath_max wherever a walk exists; no walk gives zeros and mask 0
