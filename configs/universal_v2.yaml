# ══════════════════════════════════════════════════════════════════
# UNIVERSAL-v2 — two universal retrieval models, a GNN and its
# non-message-passing twin, over one inference contract, on the served
# canonical substrate. Declared after M3B closed (commit 0bbb3c4) and before
# any v2 code that fits, any compiled v2 column and any v2 weight exists.
# Every rule a later number depends on is in this file or in the dated blocks
# appended to it, in order; nothing below is a result. ONE FILE PER PHASE:
# this is the universal-v2 file. M3B's file is closed and is not edited.
# ══════════════════════════════════════════════════════════════════
experiment: universal_v2
phase: UNIVERSAL_V2
status: DECLARED_NOT_RUN
declared: 2026-09-19
declared_under:
  - configs/m3b_controlled_comparison.yaml       # closed at 0bbb3c4 (status RUN, run_record_2026_09_19): the incumbents and every reference number below
  - configs/m3a_sota_information_contract.yaml   # model naming, feature / candidate / proposed-object contracts
  - configs/m3a_compilation.yaml                 # directions A-D, the calibration rule (read as diagnostic here, see methodological_ruling)
  - configs/m3a_headroom.yaml                    # the pools, seeds, expansions and the knee rule the M3B contract froze on
  - configs/m3_gnn_development.yaml              # the firewall, carried over
place_in_the_track: >-
  the phase after M3B in the development track (method selection on the
  current datasets, development populations only, before canonical CRAG).
  M3B answered whether learned message passing adds anything under matched
  candidate exposure and matched inference-time graph information. This phase
  asks whether genuinely strong universal models, with and without message
  passing, can be built on what M3B measured. Two layers of contribution:
  contribution 1 is M3B's and is closed; contribution 2 is this phase's.

registered_question: >-
  Can depth-preserving compiled reasoning and a query-conditioned
  semantic-relation operator close the MetaQA weakness of the current universal
  models without sacrificing their behaviour on text retrieval?
registered_question_of_the_paper_unchanged: >-
  After matching candidate exposure and inference-time graph information to
  modern graph-retrieval/GNN systems, how much effectiveness remains
  attributable specifically to learned message passing?
contribution_2_as_registered: >-
  A single retrieval-seeded architecture can operate across typed KGs and text
  graphs, with either learned propagation or deterministic graph compilation.
forbidden_framings:
  - prove message passing is unnecessary
  - show that we do not need message passing
  - demonstrate that the MLP wins
  - describe the READ / NOT_READ band threshold of M3B as pre-registered (methodological_ruling_band_rule below)
  - architecture shopping -- fitting any candidate beyond the arms declared here without a dated amendment filed before its first fit
result_is: >-
  whatever the pilot gate reads for the selected GNN and the selected twin on
  the three anchor datasets, and whatever the later stages measure if they
  open; a failed gate is a valid outcome and closes the phase with its numbers.

