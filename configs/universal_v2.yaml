  incidents:
  - '2026-09-23T01:37Z to 02:03Z -- the stage-2 compile was queued, not launched: another session of the same user
    held a SPLADE job of 4.8 to 6.3 GB on the same 16.85 GB laptop and free memory was between 0.5 and 2.7 GB. The
    replication''s logged mistake was launching into that contention, so the compile waited. Nothing scientific
    waited on this: no cache, weight or number existed yet.'
  - '2026-09-23T02:03Z -- the wait was replaced by a driver that compiles the three added carves one process per
    dataset (hotpotqa, then webqsp, then musique: smallest graph first) behind a 2.5 GB free-memory pre-flight,
    beside the other session''s job rather than after it. The trio compile peaked at 2.73 GB on metaqa (329,282
    nodes) and the three added graphs are smaller (90,447 / 1,549 / 19,938 nodes), and the row streams go to disk
    through NpyAppender, so the footprint of each added compile is bounded well below that. Placement only: no science
    moves.'
  - '2026-09-24T20:45Z to 20:50Z -- free disk was observed oscillating at the 8 GB floor declared in compute.abort_criteria
    during seed 1 of the stage-2 fit: 7.97 GB at 20:45Z, 8.58 GB at 20:50Z, 8.58-8.58 GB on re-measurement. The
    floor was crossed at the first reading only, transiently. Nothing halted, and nothing should have: SixDiskGuard
    is constructed only in stage_compile_six, which finished 2026-09-23T05:04Z, and the fit arms only fit_hours_guard_six;
    stage_eval_six, stage_read_six, stage_doc_six and stage_file_six never construct it, so no remaining stage-2
    stage can be halted by this floor. The pipeline is not the consumer -- outputs/universal_v2/six totals 8.5 MB,
    8.4 MB of it checkpoints; the movement is the machine''s pagefile and other sessions. Recorded so the report
    can state the floor was touched and why no stage stopped. No science, no placement.'
  - '2026-09-25, between 20:48Z on the 24th and 09:47Z on the 25th -- a session restart killed both background shells
    (exit 4): the stage-2 driver and the epoch watcher. Seed 1 died during epoch 2; no stage-2 process was alive
    when this was checked. Seed 0 was already complete and its record and weights were untouched on disk. Seed 1
    was RESUMED, not restarted, from the .ckpt m3b_train.fit_operator writes after every epoch: it restores weights,
    optimiser, both RNG states, the per-dataset draw cursors, best_state, the record, the patience counter and elapsed_s,
    and it refuses a checkpoint whose arm, seed or config do not match, so the resumed run sees the same batches
    the uninterrupted run would have and the recorded seconds exclude the idle gap. This is continuation of the
    declared fit; the_freeze.no_warm_start bars loading the TRIO checkpoint as an initialization, which nothing
    here does. The replacement driver runs seeds (1, 2) only and refuses to start if seed 0''s artifacts are missing
    -- drive_stage2b.py looped (0, 1, 2) unconditionally and would have overwritten a completed fit. Its per-seed
    summary line also read a filename missing the __six segment, so it never printed; that is fixed. Placement and
    recovery only: no science moves, no config is touched, and the compute guard is unchanged because the killed
    partial wrote no fit record.'
