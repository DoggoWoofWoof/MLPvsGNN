    scoring: >-
      one supplement eval pass per population through the order_of_operations 7 tooling (scripts/universal_v2_run.py
      --stage eval --models <the four keys>: <name>__more_<sha8>, sharded and merged for metaqa), the same query
      lists, pools, half labels and fixed rrf per query as the seed-0 records (pooled_rows refuses otherwise); both
      halves are labelled as they are written and nothing is read from the pass
    aggregation: >-
      scripts/universal_v2_report.py seed_confirmation, the aggregation the declaration already carries (pilot_gate.on_pass;
      amendment_3 terminal_state_vocabulary.computed_from): per cell, the per-query mean over seeds 0, 1, 2 on V2_GATE,
      its population mean at or above the frozen threshold (a float tolerance of 1e-12 and nothing else), and for
      a paired cell the declared paired bootstrap of that per-query seed mean against the frozen M3B reference (1000
      resamples, default_rng(0), 95 percent percentile interval) excluding zero on the positive side; the sd is
      over the three per-seed population means; the seed-wise values, the mean, the sd, the threshold, the margin
      and the interval are reported per cell
    thresholds: amendment_1_2026_09_19.pilot_gate_amended, unchanged (gate_thresholds reads the same block); no
      epsilon, no tolerance band, no averaging across datasets
    pass_rule: >-
      a family is REPLICATION_PASS only if all three seeds are present on every population and the three-seed mean
      holds EVERY original frozen gate cell of that family (the paired condition included where the cell is paired);
      otherwise REPLICATION_FAIL; the cell that failed at seed 0 is not privileged and no other cell may compensate
      for it
    status_vocabulary:
