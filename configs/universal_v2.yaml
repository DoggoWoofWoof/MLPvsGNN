# Amendment 2 (2026-09-19): the review of step 2 (commit bfdc4b2). Two
# corrections filed before any real cache is compiled or frozen -- the raw
# contract pinned as an exact ordered list (correction 1) and an ordered,
# direction-sensitive relation-path channel (correction 2) -- plus the family
# status vocabulary, the training mixture restated, the truncation report
# required of step 3, and step 3 authorised. Where a block below names an
# as-filed block above, the block below supersedes it; the as-filed text
# stays for the record. Nothing is compiled, timed or fitted by this amendment.
# ══════════════════════════════════════════════════════════════════
amendment_2_2026_09_19:
  filed_utc: "2026-09-19T17:59:42Z"
  status_after: DECLARED_NOT_RUN
  reviewed: step 2 as committed at bfdc4b2 -- features, models, run and report tooling and their tests; no cache compiled, no weight fitted
  ruling_verbatim:
    - "Yes -- GO for step 3, but make two corrections before the real caches are compiled/frozen. Everything else in the step-2 tooling looks aligned with the experiment."
    - "The first correction is mandatory: the declaration previously said 78 + 64 = 142 raw columns, while the implementation report now says 78 + 73 = 151. Do not let the real compile happen with that discrepancy hidden by passing tests. Decide which is actually intended, amend configs/universal_v2.yaml prospectively if 73 is correct, and pin the exact ordered feature-name list plus total count. After that, tests should assert code contract == declaration contract == frozen contract."
    - "The second correction is more scientifically important: do not leave relation-path features endpoint/order-invariant only. That weakens exactly the MetaQA mechanism we are trying to test. r1 -> r2 and r2 -> r1, and forward versus inverse traversal, can encode different reasoning chains. Before any v2 fit exists, add a bounded ordered, direction-sensitive relation-path channel for typed STRUCT paths at t=2/3. You can keep the invariant summaries too, but the model must be able to distinguish ordered relation composition. Keep this fixed-dimensional and semantic -- no dataset-specific relation-ID table."
    - "Everything else I approve: supplement scoring for seeds 1-2: keep; seed confirmation on V2_GATE: keep; held half read once only after gate/seeds: keep; seventh core78 - old GAT diagnostic: keep; protecting the original 78 columns during screening: keep; splade_rr as the declared sparse evidence quantity: fine; K_REL=4: keep for now, but the step-3 compile report must show how often truncation actually occurs by dataset/hop before the contract is frozen; mix gates initialized at 0.5: fine."
    - "I would make one reporting tweak too. Instead of the overall run status being merely RUN whenever any selected arm passes, preserve family status separately: GNN_GATE = PASS / FAIL; TWIN_GATE = PASS / FAIL; overall = BOTH_PASS / GNN_ONLY_PASS / TWIN_ONLY_PASS / PILOT_FAILED. The phase can still continue if one family passes according to the declaration, but later we should not accidentally describe a one-family success as success of the proposed universal pair."
    - "AUTHORIZE STEP 3 ONLY. 1. Compile the real MetaQA / 2Wiki / SQuAD v2 caches. 2. No model fitting. 3. No V2_GATE or V2_HELD reads. 4. Produce compile diagnostics: raw feature count and exact ordered names; availability/missingness by block and dataset; variance/constant columns; redundancy/correlation decisions; K_REL=4 truncation frequency by dataset and hop; ordered relation-path availability; compilation wall time / queries per second; peak RAM; bytes on disk. 5. Apply only the preregistered screen. 6. Freeze the surviving column list as UNIVERSAL_V2_CORE_CONTRACT. 7. Hash: raw contract, screen rule, surviving columns, three compiled caches. 8. Commit. 9. STOP_FOR_REVIEW before the one-epoch timing run."
    - "One more check before later fitting: make sure the declaration pins the joint trio sampling/loss weighting -- e.g. balanced vs proportional dataset sampling, query counts per dataset/batch, and loss aggregation. MetaQA must not later receive extra training weight because we know it is the weak dataset."
    - "So: yes, proceed with step 3 after fixing the 142/151 discrepancy and making relation paths ordered/directional. Those are exactly the kinds of things worth catching now; after contract_frozen they should be untouchable."
  correction_1_the_raw_contract_pinned:
    discrepancy: >-
      the as-filed information_contract_v2.count says 64 depth-basis columns
      and 78 + 64 = 142 raw columns; amendment 1 added the 9 availability
      masks (count_amended: 73 and 151), but the as-filed prose still carries
      64 / 142 (information_contract_v2.depth_basis_columns header,
      compute.per_fit_estimate, compute.compile_and_screen, outputs.code,
      order_of_operations "3", and the ruling line "142->surviving" quoted in
      amendment 1), and the step-2 module carried 73 columns without the list
      itself being pinned anywhere in this file -- a passing test compared the
      code to the code.
    decided: >-
      73 is intended: the 64 depth-basis columns of the first draft plus the
      9 availability masks of amendment 1. Correction 2 below adds 13 ordered
      relation-path columns, so the v2 contract is 86 columns and the screen
      input is 78 + 86 = 164; the cache layout is the 111 M3B raw columns
      first, unchanged, then the 86, i.e. 197 columns. The exact ordered list
      is pinned in raw_contract_pinned; every stage reads that pin and refuses
      on any difference from the code; after contract_frozen_<date> the frozen
      block must carry the same raw_contract_sha256 (code == declaration ==
      frozen, asserted by tests/test_universal_v2_declaration.py).
