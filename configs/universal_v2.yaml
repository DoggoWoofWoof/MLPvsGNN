  correction_2_ordered_relation_path_channel:   # supersedes the endpoint-order invariance of information_contract_v2.depth_basis_columns.relpath_* as the only relation-path reading
    why: >-
      relpath_max / mean / min are functions of the multiset of cos(q, e_r)
      along a walk: r1 -> r2 and r2 -> r1 give the same three numbers at the
      endpoint, and a relation followed head -> tail is not told from the
      same relation followed tail -> head. The MetaQA mechanism under test is
      ordered relation composition (a 2-hop or 3-hop chain in a stated
      direction), so the contract must let the model distinguish it; the
      fixed-score twin must be given the same information, or the comparison
      measures who has the input, not who has message passing.
    channel: the best typed STRUCT walk of length t from a seed to v, reported position by position, for t in (2, 3)
    best_walk: >-
      the walk relpath_max_h{t} already scores -- the typed STRUCT walk of
      length t from a seed to v with the maximum mean cos(q, e_r) -- kept by
      one back-pointer per node and depth in the same dynamic programme;
      position k = 1 is the step out of the seed, position k = t the step into
      v. Ties: at every step the first entry in (owner, neighbour, relation)
      order among those attaining the maximum (the M3B typed_pool_edges
      order), so the chosen walk is deterministic and independent of the
      machine.
    columns:   # 13 = 5 at t = 2 + 8 at t = 3; group ordered_relation_path; block TYPED_h{t}; mask typed_walks_h{t}
      opath_h{t}_q{k}: cos(q, e_r) of the relation at position k of the best walk; 0 if no typed walk of length t reaches v; k = 1..t
      opath_h{t}_dir{k}: +1 if step k traverses its stored relation head -> tail (forward), -1 if tail -> head (inverse), 0 if no walk; k = 1..t
      opath_h{t}_adj{k}{k+1}: cos(e_r at position k, e_r at position k + 1) of the best walk -- the served relation-text embeddings of consecutive steps (1 when a relation is composed with itself); 0 if no walk; k = 1..t-1
    direction_convention: >-
      a typed entry (owner v, neighbour u, rel, dir) as M3B reads it has dir 2
      when the stored triple is u -> v, so the walk step u -> v follows the
      relation head -> tail (+1), and dir 1 when the stored triple is v -> u,
      so the step goes against it (-1)
    properties:
      bounded: one walk per node and depth, never the set of walks; the invariant summaries (max / mean / min over every walk) stay as declared
      fixed_dimensional: 13 scalars whatever the dataset, the relation vocabulary or the pool size
      semantic: every value is a cosine with the served relation-text embeddings (gte-Qwen2, outputs/m3b/relations/) or the sign of a stored orientation; no relation id, no per-dataset table, no learned relation vocabulary enters the contract
      identity: the mean over k of opath_h{t}_q{k} equals relpath_max_h{t} wherever a walk exists (tested); the ordered channel adds the order and the direction to what the invariant summary already carries, nothing else
      order_distinguished: on the chain 0 -a-> 1 -b-> 2 -c-> 3 versus 0 -b-> 1 -a-> 2 -c-> 3 the endpoint reads (a, b) versus (b, a) at t = 2 and its adj23 changes at t = 3, while relpath_* cannot tell them apart (tests/test_universal_v2_features.py)
    untyped_datasets: 2wiki and squad carry no relation table; every ordered column is 0 with typed_walks_h{t} = 0, exactly as the typed depth-basis columns already are -- one contract, one state dict
    parameter_budgets_at_164_columns: {u_mlp_v2: 339330, u_mlp_v2_mix: 339915, u_gnn_v2: 426563, u_gnn_v2_ef: 429892, u_gnn_v2_core78: 407876, gat_universal_v1_trio: 353410, twin_budget: 350000, gnn_budget: 450000, holds: true}
    cost: one integer back-pointer array per node and depth plus a back-trace of length t and two gathers of relation rows; measured with the rest of the typed basis in the step-3 compile record (group_seconds_per_1000_queries.typed_basis)
    tests_added:
      - the ordered channel distinguishes r1 -> r2 from r2 -> r1 at the endpoint itself
      - reversing a stored relation flips the sign of exactly the dir columns that read it and changes nothing else in the 86
      - the argmax walk is taken and ties break by entry order (an inverse walk first when it is listed first)
      - the mean of the ordered q columns equals relpath_max wherever a walk exists; no walk gives zeros and mask 0
  family_status_vocabulary:   # supersedes the statuses RUN / RUN_PILOT_FAILED of order_of_operations "7"
    per_family: {GNN_GATE: "PASS if the selected GNN holds all three gnn_gate cells at seed 0, else FAIL", TWIN_GATE: "PASS if the selected twin holds all three twin_gate cells at seed 0, else FAIL"}
    overall: {BOTH_PASS: "GNN_GATE PASS and TWIN_GATE PASS", GNN_ONLY_PASS: "GNN_GATE PASS, TWIN_GATE FAIL", TWIN_ONLY_PASS: "GNN_GATE FAIL, TWIN_GATE PASS", PILOT_FAILED: "both FAIL"}
    where: the gate record (pilot_gate_record_<date>.family_outcome) beside the per-arm outcome; the run record; the report at a glance; the top-level status line
    statuses: {after_the_gate: PILOT_GATE_READ, after_the_run_record: "RUN_BOTH_PASS | RUN_GNN_ONLY_PASS | RUN_TWIN_ONLY_PASS | RUN_PILOT_FAILED"}
    continuation: unchanged -- pilot_gate.on_pass applies per family (a passing family confirms with seeds 1-2; a failing family stops at seed 0 and is reported), so the phase continues on GNN_ONLY_PASS or TWIN_ONLY_PASS
    reporting_rule: >-
      a one-family pass is a pass of that family and is written as such; the
      proposed universal pair (one GNN and its non-message-passing twin over
      one contract) has passed only under BOTH_PASS. The report and every
      later document name the family that passed; no sentence describes
      GNN_ONLY_PASS or TWIN_ONLY_PASS as a pass of the pair.
  training_mixture_pinned:   # restates check_3_firewalls_made_explicit.data_mixture_frozen with the code facts; nothing changes
    sampler: mp_retrieval.m3b_train.draw_indices with dataset_draw per_query (M3B amendment 3, pinned) -- for each of the 16 query draws of a batch the dataset is drawn uniformly among the three pilot datasets (multinomial counts per batch, no quota), then that many fit queries of the dataset are taken from a per-dataset permutation without replacement, reshuffled when exhausted
    balance: balanced, not proportional -- each dataset receives one third of the draws in expectation regardless of its carve size (metaqa 5,960 fit queries, 2wiki 5,928, squad 5,856); over an epoch of 2,000 batches each dataset is drawn about 10,700 times
    drawn_from: the trainable fit queries of each carve (at least one gold in the pool), so every drawn query contributes to the loss
    loss: mp_retrieval.m3b_models.listwise_loss, pinned -- per query, minus the mean over its in-pool golds of the log-softmax over its pool; the batch loss is the unweighted mean over the drawn queries of the batch; no per-dataset weight, no per-query weight, no normalisation by dataset
    optimiser_and_budget: as training.rule -- Adam lr 1e-3, weight decay 1e-4, clip 1.0, 6 epochs of 2,000 batches, patience 2 on the select macro recall@5, 8-hour epoch limit; identical for every arm including the control gat_universal_v1_trio
    metaqa: receives no extra weight, quota, curriculum, over-sampling or loss multiplier because it is the weak dataset, now or later in the phase; any change to the mixture is a dated amendment filed before the fit it touches and applies to every arm
    not_allowed: per-dataset loss weights, per-dataset batch quotas, a curriculum, re-weighting or over-sampling of any dataset, temperature-scaled dataset sampling, or any change to the mixture between arms
    tested: tests/test_universal_v2_models.py (sampler and loss are the pinned M3B functions; one batch may hold queries of several datasets; no dataset id reaches a model); tests/test_universal_v2_declaration.py (this block names the pinned functions and forbids the weights)
  k_rel_truncation_report_required:
    what: K_REL = 4 relation slots per structural message edge (arms.u_gnn_v2 innovations) stays; before contract_frozen_<date> the compile record must show, over every query of every carve, by dataset and (metaqa) by hop, the fraction of structural pairs carrying more than 4 stored relations, the fraction of queries with any such pair, and the histogram of relations per pair
    also: the availability of the typed / ordered relation-path channel by dataset and hop -- candidate rows and gold rows with a typed STRUCT walk of length t, queries with any such row, the fraction of best walks with an inverse step, the fraction composing two different relations
    where: scripts/universal_v2_run.py CompileDiagnostics -> meta.json diagnostics of every carve -> contract_frozen_<date>.compile_record -> section 1 of docs/UNIVERSAL_V2_PILOT.md
    decision_rule: none is pre-registered on these numbers; K_REL is not changed by them in this phase; a change is a dated amendment before any fit
  step_3_authorised:
    what:
      - compile the real metaqa / 2wiki / squad fit and select caches under the pinned 197-column layout (scripts/universal_v2_run.py --stage compile)
      - compile diagnostics in every meta.json -- raw feature count and exact ordered names (feature_contract.json), availability by block and dataset, variance / constant columns, redundancy decisions (feature_screen.json), K_REL truncation by dataset and hop, ordered relation-path availability, wall time, queries per second, peak RSS, bytes on disk
      - the pre-registered screen only (information_contract_v2.screen, the M3B rule verbatim, the M3B 78 protected), on the fit caches only
      - freeze the survivors as UNIVERSAL_V2_CORE_CONTRACT in contract_frozen_<date> with the hashes of the raw contract, the screen rule, the surviving columns and the six compiled cache directories (per file and combined)
      - commit; STOP_FOR_REVIEW before the one-epoch timing run (order_of_operations "4")
    not:
      - no model fitting, no timing run
      - no V2_GATE or V2_HELD_CONFIRMATION read; no eval population compiled (check_3)
    order: this amendment and the code it describes are committed before the first real cache is compiled (the rule before the number)
  supersedes: [information_contract_v2.depth_basis_columns.count and every 64 / 142 / 151 count above, order_of_operations "3" (the 142-column contract), order_of_operations "7" (statuses RUN / RUN_PILOT_FAILED), check_3_firewalls_made_explicit.availability_masks.count_amended (73 / 151, now 86 / 164), the relpath_* endpoint-order invariance as the only relation-path reading]
