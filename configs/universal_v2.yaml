    selected_arms:
      gnn: u_gnn_v2_ef
      twin: u_mlp_v2_mix
    selected_arms_are: >-
      the arms selection.json and gate_record.json name (order_of_operations 5, behind the firewall); a fit of any
      other arm, of seed 0, or of a seed outside the list is refused; seed 0 is never retrained (its record exists
      and is not repeated; its weights must hash to run_record_2026_09_21.fits.<key>.state_sha256)
    frozen_training_protocol: >-
      training.rule as the seed-0 fit record of the same arm stores it (max_epochs 6, 2000 batches per epoch, batch
      16, patience 2, AdamW lr 1e-3 wd 1e-4 clip 1.0, dataset_draw per_query, epoch_limit_s 28800, checkpoint per
      epoch, resumable); the fit refuses a rule that differs from that record
    frozen_architecture: >-
      make_model(arm) on the frozen inputs (contract_frozen_2026_09_19, H=128, K_REL=4, the relation bank of the
      seed-0 record): the parameter count, the column count, the core sha256, the evidence and evidence-substitution
      fields must equal the seed-0 fit record of the same arm; the fit refuses otherwise (hard stop: model code
