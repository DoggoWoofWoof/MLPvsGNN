population:
  rule: level 0's, through level 3's sidecars (qids.json equal to level 0's, in order)
  sizes: {metaqa: 2400 queries and 165893 U_q rows, 2wiki: 6290 and 245055, squad: 5841 and 176880}
  squad: the control, NOT_READ at levels 0, 1, 3, 4 and 5 (the GNN is not above its twin on any metric within U_q)

probe:   # host_gpu_det; cross-fitted with level 0's five folds and its inner split (imported unchanged)
  inputs_per_row: b_v, n_u, eps_e and q_tilde exactly as level 3 builds them (level 3's ProbeData, imported unchanged)
  B0_mlp, L3_att: level 3's probes, refitted with level 3's fit_probe (imported unchanged)
  L6: >-
    the recurrence, with shared parameters at every step and no dataset input. The state is z_v^(0) = W_in n_v
    (322 -> 64). The receiver side at step t is rx_v^(t) = [n_v | z_v^(t) | q_tilde] (322 + 64 + 64). Each step, the
    kernel gives each of the row's entries and its self entry (level 3's self entry, eps family "self") a positive
    weight w_e^(t,h) that sums to 1 over the row, per head (4 heads). The values val_e = W_val [n_u | eps_e] are level 3's,
    4 heads of 16, computed once. The messages are M_typed = sum_e w_e val_e and M_STRUCT = sum over structural e of
    w_e val_e / sum over structural e of w_e, 0 where the row has no structural entry (64 each). The update is
    z^(t+1) = z^(t) + g([z^(t) | M_typed^(t) | M_STRUCT^(t) | q_tilde]), with g = Linear(256, 128), GELU,
    Linear(128, 64). The readout is Linear(258 + 64, 128), GELU, Linear(128, 128), GELU, Linear(128, 1) on
    [b_v | z_v^(T)], level 3's readout with the state in place of the message.
  forms:
    KERN: >-
      level 5's factorised kernel with the state on the receiver side. kappa_e^(t,h) = phi_h(rx_v^(t))^T psi_h(u, e), with
      phi = softplus(W_phi rx_v^(t)) and psi = softplus(W_psi [n_u | eps_e]), rank 32 per head; w = kappa over its row
      sum. psi, C_v and c_v do not depend on t.
    ATT: >-
      level 3's attention score with the state on the receiver side. score_e^(t,h) = att_h . leaky_relu_0.2(W_u n_u +
      W_v rx_v^(t) + (W_q q_tilde) * W_e1 eps_e + W_e2 eps_e), head by head; w = the segment softmax over the row.
  arms:
    L6-1: KERN, T = 1
    L6-2: KERN, T = 2
    L6-3: KERN, T = 3 (the primary)
    L6-fix3: KERN, T = 3, the weights of step 0 used at every step (the fixed-kernel analogue; same parameters)
    L6-list: KERN, T = 3, level 3's LIST objective
    L6-att1: ATT, T = 1
    L6-att3: ATT, T = 3
  parameters: every arm of one form has the same parameter count at every T and in the fixed variant (a test holds this)
  objectives: level 3's MSE and LIST, unchanged (LIST on r only; no gold enters any loss)
  fitting: level 3's (seed 1000 + 10 k + fold; AdamW lr 1e-3, weight decay 1e-4; 64 queries per minibatch; at most 30 epochs; patience 3; best epoch restored; evaluation in batches of 128 queries)
  grid:
    r_k: [B0-mlp, L3-att, L6-1, L6-2, L6-3, L6-fix3, L6-list, L6-att1, L6-att3]   # L6-list: the LIST objective; every other probe MSE
    e_k: [B0-mlp, L3-att, L6-3]
  units: >-
    one unit per (target, probe): the three seeds times five folds, written atomically with its fit log and skipped on
    a restart. The order within a job: r's L6-3 first, then the rest of r's grid in the order above, then e's.
  repeat: metaqa's (r, L6-3) again in a fresh process into repeat/; the comparison is filed

quantities: >-
  level 0's, computed by level 0's functions (per_query_measures, read_family, reproducibility, strata_masks) over this
  file's probes, with level 0's bootstrap: one resample matrix per dataset (1000 resamples, default_rng(0)), so every
  contrast is paired. References: ref:twin, ref:other_seed (r) and ref:no_edge, ref:other_seed (e), as level 0 computes them.
statistics:
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    composition_2: rho_bar(L6-2) - rho_bar(L6-1) on r -- two composed steps against one
    composition_3: rho_bar(L6-3) - rho_bar(L6-1) on r -- three composed steps against one (the composition contrast)
    depth_3_over_2: rho_bar(L6-3) - rho_bar(L6-2) on r
    state_kernel: rho_bar(L6-3) - rho_bar(L6-fix3) on r -- re-weighting on the updated state against a kernel held at step 0
    l6_vs_attention: rho_bar(L6-3) - rho_bar(L3-att) on r -- the recurrence against level 3's one-hop attention (the frozen reference)
    one_step_vs_attention: rho_bar(L6-1) - rho_bar(L3-att) on r
    att_composition_3: rho_bar(L6-att3) - rho_bar(L6-att1) on r -- composition with the exact attention score
    att_l6_vs_attention: rho_bar(L6-att3) - rho_bar(L3-att) on r
    objective: rho_bar(L6-list) - rho_bar(L6-3) on r
    l6_over_node_local: rho_bar(L6-3) - rho_bar(B0-mlp) on r
    edge_l6_vs_attention: rho_bar(L6-3) - rho_bar(L3-att) on e
  shares:   # descriptive; point and 95% percentile interval over the same resamples; read only where the denominator's interval lies above 0
    l6_share: (rho_bar(L6-3) - rho_bar(B0-mlp)) / (rho_bar(L3-att) - rho_bar(B0-mlp)) on r -- the recurrence's gain over node-local, in units of attention's
    gap_closed: (rho_bar(L6-3) - rho_bar(L3-att)) / (rho_bar(ref:other_seed) - rho_bar(L3-att)) on r -- how much of the gap between attention and another GNN seed the recurrence closes
  strata_contrasts: >-
    descriptive: composition_3, l6_vs_attention and att_composition_3 within each of level 0's strata (metaqa by hop), by
    the same functions over the stratum's queries. A stratum's contrast is shown only where the stratum has a readable
    metric, and it is never a reading.

readings:   # filed before any number; per dataset, no pooled reading
  primary_probe: L6-3 on r_k (the MSE objective, as the primary of every earlier level)
  bands:   # of rho_bar, level 0's thresholds
    L6_HIGH: rho_bar >= 0.75 and its interval's lower end >= 0.50
    L6_LOW: rho_bar <= 0.25 and its interval's upper end <= 0.50
    L6_MID: neither
    NOT_READ: the dataset has no readable metric (squad is expected here; the control, not a failure)
  exactly_one: per dataset, the band of the primary probe is the dataset's reading
  flags:
    FIT_NOT_RANK: a probe with R2 >= 0.5 whose band is L6_LOW
    SEED_BOUND: mean reproducibility of r below 0.5
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    L3_REFIT_DIFFERS: a refitted unit is not bit-identical to level 3's filed unit of the same name (the unit and its largest difference are filed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l6_high: >-
      primary L6_HIGH: composing the one-hop typed kernel over three receiver-state steps predicts the GNN's ranking
      effect within U_q on that dataset (an upper bound, not a full-pool claim)
    composition_recovers: the composition_3 interval above 0 -- three composed steps recover more than one step of the same form
    composition_flat: the composition_3 interval contains 0 -- no measurable gain from composing the one-hop kernel
    composition_hurts: the composition_3 interval below 0
    depth_adds: the depth_3_over_2 interval above 0 -- the third step adds over the second
    state_matters: >-
      the state_kernel interval above 0 -- re-weighting on the updated state carries recovery that a kernel held at
      step 0, with the same depth and mixer, does not
    l6_above_attention: the l6_vs_attention interval above 0 -- the recurrence recovers more than level 3's one-hop attention
    l6_not_below_attention: the l6_vs_attention interval's upper end at or above 0
    l6_below_attention: the l6_vs_attention interval below 0
    att_composition_recovers: the att_composition_3 interval above 0 -- composition adds when the step is the exact attention score
    objective_adds: the objective interval above 0 -- the objective limits recovery, not only the operator
    edge_effect_l6: the band of L6-3 on e is L6_HIGH, or edge_l6_vs_attention's interval reaches 0 or above
  cross_dataset:   # at the doc stage, from the per-dataset entries above only; no number is pooled
    advisor_ideal: metaqa lists l6_above_attention and 2wiki lists l6_not_below_attention ("MetaQA lifts while 2Wiki stays roughly unchanged")
    positive_control_held: 2wiki lists l6_not_below_attention
    negative_control_as_expected: squad's reading is NOT_READ
  wording: >-
    every probe is an oracle fit on the GNN's own outputs over V2_GATE queries of the same dataset. Recovery is a
    statement of capacity within U_q, never of a deployable model. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins"; low and high recovery are both results. Reach is
    one hop throughout (corrections_to_the_proposal.one_hop_reach). A reading here says nothing about neighbour-state
    propagation, which this file does not test.

compute:
  probes: >-
    per dataset, 12 units of 15 fits (metaqa 13 with the repeat). Level 5's attention and kernel units took 5 to 9
    minutes each on host_gpu_det. An L6 unit runs its per-entry step T times, so it is expected at 1 to 3 times that.
    Expected 1.5 to 3 hours per dataset, with the three jobs sharing the GPU.
  disk: host workspace outputs/mp_approx_l6/ (out-of-fold predictions and fit logs, tens of MB per dataset), fetched to the laptop
  resumable: every probe unit is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's and level 3's included
  - level 3's mirror verification fails on the host, or a host job's placement settings read back differently from host_gpu_det_as_tested
  - a unit's out-of-fold predictions leave a row unpredicted or hold a non-finite value
  - the host jobs' recorded code sha256 values are not one set equal to the committed files

outputs:
  script: scripts/mp_approx_l6.py (stages probe, repeat, read, run, doc, file)
  sidecars: outputs/mp_approx_l6/<name>/ (probes/ with the out-of-fold predictions, fit logs and probe_meta.json; repeat/; read.json)
  record: outputs/mp_approx_l6/record.json, assembled on the laptop from the host's per-dataset read.json files without arithmetic
  document: docs/MP_APPROX_L6.md
  run_record: run_record_mp_approx_l6_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l6.py
  - this file parses; its pins are the files' current sha256; the placement spec is level 3's; the structural column is eps column 0
  - every arm of a form has the same parameter count at T = 1, 2 and 3 and in the fixed variant, and no input names a dataset
  - the weights are positive and sum to 1 per row, head and step; M_STRUCT is 0 on a row without a structural entry and is the renormalised structural part otherwise
  - the kernel form's message at every step equals the compiled form phi^T C_v / phi^T c_v (and its structural part), and the output is invariant to entry order
  - the fixed variant uses step 0's weights at every step, and at T = 1 it equals the re-weighting variant
  - the bands carry the L6 labels; the contrasts, shares and grid are the declared ones; the refit comparison is bitwise
  - the probe, repeat, read and doc stages run end to end on the CPU over a synthetic level 3 sidecar, and the repeat is bit-identical there
  - no held query id appears in any sidecar

execution:
  order: >-
    this file alone (commit); the script and tests (commit); push; one host job per dataset (probe, metaqa's repeat,
    read), submitted at once; fetch; record, doc and run record on the laptop (commit)
  stop_after_run: STOP_FOR_REVIEW
