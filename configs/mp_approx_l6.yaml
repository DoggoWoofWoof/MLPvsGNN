registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  The advisor's L6 question, unchanged: "Can the residual MetaQA message-passing advantage be recovered by composing the
  already-successful one-hop query-conditioned operator across multiple typed steps, without learned neighbor-state
  propagation?" Operationally: a receiver state z_v starts from v's own fixed row. At each of T steps a shared,
  query-conditioned, typed kernel re-weights v's one-hop entries given the current state, and a shared mixer updates
  the state from the resulting messages. How much of r_k (primary) and of e_k does T = 3 recover, set against T = 1,
  against a kernel held at its step-0 value, and against level 3's one-hop attention?
role: >-
  Measurement only, as at levels 0 to 5. The GNN's outputs are the probes' targets, which the proposal allows "only to
  measure approximation capacity". No probe, kernel, target or number of this file enters QLS-U, the twin, a feature
  contract, M3, M4 or any selection. A model that used this recurrence without GNN outputs would be a competitor, and
  it would need its own declaration under the QLS-U contract. This file does not open one.

