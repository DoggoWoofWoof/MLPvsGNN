corrections_to_the_proposal:   # checked against the code and the level 3 sidecars before this file was written
  one_hop_reach: >-
    In the advisor's form the message always carries the neighbour's fixed row h_u, never a neighbour state, which is
    what "without learned neighbor-state propagation" means. So the recurrence never reaches past v's one-hop entries.
    The steps re-weight the same neighbourhood, each time conditioned on the receiver's updated state, and the order of
    relations enters only through that state. Level 3's sidecars also hold one-hop entries only: they hold the
    in-edges of U_q rows, and the halo rows of neighbours that are not U_q rows have no entries of their own. A LOW
    reading here therefore does not show that multi-hop reach is needed. It shows only that iterated receiver-state
    re-weighting of the one-hop neighbourhood does not recover the residual.
  the_two_messages: >-
    g reads M_STRUCT^(t) and M_typed^(t). Here M_typed^(t) is the kernel's message over all of the row's entries and
    its self entry, the one-hop operator's own message. The kernel reads each entry's family, relation text, relation
    attributes and direction, so it is typed. M_STRUCT^(t) uses the same step's weights restricted to the row's
    structural entries and renormalised over them. It is 0 for a row without a structural entry. Neither channel
    changes the one-hop operator's weights.
  fixed_kernel_analogue: >-
    Read as the same recurrence with the kernel held at its step-0 value at every step: the same depth, parameters and
    mixer, but no re-weighting on the updated state (L6-fix3). A non-learned, uniform kernel is level 3's L3-mean
    question, and it is not repeated.
  compiled_scope: >-
    The factorised kernel is level 5's: kappa = phi(receiver)^T psi(u, e) with psi reading only the neighbour's halo
    row and the edge. So C_v = sum psi val^T and c_v = sum psi are computed once per forward and reused at every step,
    and a step costs phi^T C_v / phi^T c_v. The halo row is fixed by the contract, not learned. It does hold
    query-dependent columns, though: the pool z-scores and the query-similarity features such as dense_cos. So C_v and
    c_v are per query and candidate pool, not per node; they are compiled once per query, not once for the graph. Level
    5's words "compile once" are read in that sense here. Level 5's file is not edited.
  attention_form: >-
    On metaqa the factorised kernel was the weaker one-step operator (L5-kern -0.358 against L3-att -0.076 on r_k). A
    failure of composition could therefore be blamed on the kernel. The same recurrence is also fitted with level 3's
    exact attention score, the receiver side reading the state, at T = 1 and T = 3 (L6-att1, L6-att3). The primary
    probe stays the advisor's kernel form.
  refitted_not_borrowed: >-
    B0-mlp and L3-att are refitted here with level 3's fit_units, imported unchanged, because the host-native protocol
    names one commit per stage. Whether each refitted unit is bit-identical to level 3's filed unit is filed as a flag
    (L3_REFIT_DIFFERS); level 5's refits were bit-identical. No earlier number is borrowed into a contrast.

