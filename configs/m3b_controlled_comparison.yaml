        as in (Sun et al., 2018). We have m = 2,000 for Webqsp (full KG) and CWQ, and m = 500 for MetaQA-3 and Webqsp
        (incomplete KG)." The seed entities are the ones provided with the datasets (Yih et al. 2015 for WebQSP,
        Talmor and Berant 2018 for CWQ, Miller et al. 2016 for MetaQA-3).'
