    gnn_rag_2024:
      citation: 'Mavromatis and Karypis, "GNN-RAG: Graph Neural Retrieval for Large Language Model Reasoning", arXiv
        2405.20139 (the OpenReview copy is behind a verification page; the arXiv PDF was read).'
      subgraph_construction_verbatim: '"For subgraph retrieval, we use the linked entities and the pagerank algorithm
        to extract dense graph information [He et al., 2021]. We employ ReaRev [Mavromatis and Karypis, 2022] ..."
        and, in the appendix, "We obtain dense subgraphs by He et al. [2021]. It runs the PageRank Nibble Andersen
        et al. [2006] (PRN) method starting from the linked entities to select the top-m (m = 2,000) entities to
