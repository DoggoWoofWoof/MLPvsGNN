  eval_pass:
    how: scripts/m3b_run.py --stage eval, one dataset per process (open_contexts loads only the named dataset);
      metaqa in four shards (--shard k/4 = queries k::4 of the population, 0-based) merged by --stage merge, which
      interleaves the shards back into population order, recomputes the ceilings from the merged arrays and verifies
      the population digest. Every query is compiled once and scored by the 12 selected models and the three fixed
      columns; latency is measured on the first 500 queries of the unsharded or shard-0 process, batch of one; the
      ceiling as compiled is checked against the frozen contract cell (SystemExit on mismatch); the MRR audit runs
      before any record is written. Scoring under torch.no_grad (commit 0c76067).
