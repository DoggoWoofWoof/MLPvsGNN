      table_7_dataset_statistics: WebQSP avg |Vq| 1,429.8, coverage 94.9 %; CWQ 1,305.8, 79.3 %; MetaQA-3 497.9,
        99.0 % (same coverage definition).
      limitation_named_by_the_paper: entity-linking errors can yield question subgraphs that contain no answer.
    cwq_coverage_disagrees_between_the_two_tables: ReaRev Table 6 reports CWQ coverage 64.4 % and GNN-RAG Table
      7 reports 79.3 % for subgraphs of the same average size (1,305.8). CWQ is not one of this phase's datasets;
