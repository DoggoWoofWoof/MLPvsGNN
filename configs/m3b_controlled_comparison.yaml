# ═════════════════════════════════════════════════════════════════════════════
# M3B — the controlled comparison: QLS-U, one universal GAT, and GAT-NO-MP,
# under one information contract, on the served canonical substrate.
#
# Declared and committed before any candidate contract is frozen, before any
# feature is compiled and before any weight is fitted. Every rule that a later
# number depends on is in this file or in the dated blocks appended to it, in
# order; nothing below is a result. ONE FILE PER PHASE: this is M3B's file.
# ═════════════════════════════════════════════════════════════════════════════
experiment: m3b_controlled_comparison
phase: M3B
status: DECLARED_NOT_RUN
declared: 2026-09-13
declared_under:
  - configs/m3a_sota_information_contract.yaml   # model naming, feature / candidate / proposed-object contracts
  - configs/m3a_compilation.yaml                 # directions A-D, qls_u_architecture, universal_gnn_calibration_rule, amendment 1
  - configs/m3a_headroom.yaml                    # the pools, seeds, expansions and the knee rule the contract freezes on
  - configs/m3_gnn_development.yaml              # the M3 firewall
headroom_evidence: outputs/m3a/headroom/*.json as filed in configs/m3a_headroom.yaml#run_record (commit 9c807de)

registered_question: >-
  After matching candidate exposure and inference-time graph information to
  modern graph-retrieval/GNN systems, how much effectiveness remains
  attributable specifically to learned message passing?
forbidden_framings:
  - prove message passing is unnecessary
  - show that we do not need message passing
  - demonstrate that the MLP wins
result_is: >-
  whatever delta_MP is measured, per dataset and per substrate; nonzero remains
  a valid outcome and the registered question is unchanged.

