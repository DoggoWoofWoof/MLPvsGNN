  check_outcomes:
    1_the_asymmetry_is_how_the_headroom_is_obtained:
      verdict: CONFIRMED_AND_ALREADY_MEASURED
      reading: 'Theirs: q + provided topic entity -> PageRank-Nibble top-m subgraph -> GNN. Ours: q -> Dense / SPLADE
