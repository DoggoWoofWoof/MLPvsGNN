substrate:
  package_root: C:/Users/Swastik/Desktop/CRAG
  served_root: data/final_canonical
  access_mode: READ_ONLY
  loader: data/final_canonical/canonical.py, imported from the package, never copied
  byte_code: sys.dont_write_bytecode is set before the import; refuse to run if data/final_canonical/__pycache__ exists
