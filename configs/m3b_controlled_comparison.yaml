    rearev_emnlp_findings_2022:
      citation: 'Mavromatis and Karypis, "ReaRev: Adaptive Reasoning for Question Answering over Knowledge Graphs",
        Findings of EMNLP 2022, pages 2447-2458 (aclanthology 2022.findings-emnlp.181; arXiv 2210.13650).'
      table_6_dataset_statistics:
        webqsp: train 2,848 / dev 250 / test 1,639; avg |Vq| 1,429.8; coverage 94.9 %
        cwq: train 27,639 / dev 3,519 / test 3,531; avg |Vq| 1,305.8; coverage 64.4 %
