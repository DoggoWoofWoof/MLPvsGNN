  what_was_asserted_and_checked: The user's message (2026-09-17, after the preliminary select-carve table) argued
    that the asymmetry between the KB-QA lineage and this phase is how the headroom is obtained, not its amount;
    that their 94.9 % / 99.0 % "coverage" is at-least-one-answer-in-subgraph and must not be set against our pool
