  - date: 2026-09-07
    change: >-
      STEP D IS MEASURED AND THE SPLIT IS ADOPTED. The question
      feature_build_compute_check asked is now answered by measurement, and
      the answer moves ~83% of M2's estimated billed seconds off the A10G. No
      compute was spent and no feature changed. (1) THE MEASUREMENT:
      scripts/m2_feature_build_equivalence.py, artifact
      outputs/m2_qls_v2_freeze/feature_build_equivalence.json, verdict
      EQUIVALENT. Four stages, all on the real-shaped fixture
      scripts/m2_reuse_audit.py already probes with, so the two audits cannot
      disagree about what a cell looks like. Stage 1 invokes the real run()
      call site with recorders around _cell_master_local and _arm_store: no
      torch object and no device ever enters the build, and all six persisted
      objects reload identical. Stage 2 slices every runner arm the matrix
      names out of a reloaded master -- 13 byte-identical, 2 refused on both
      sides (BASE+NODE_ROLE under R1/R2, which has no column to slice). Stage
      3 rebuilds in a child process with CUDA_VISIBLE_DEVICES emptied and
      NUMBA_NUM_THREADS pinned to 1, bit-exact against a parent that pins
      neither, with the fixture hashed on both sides so a master difference
      could not be blamed on a different input; several kernels on this path
      are njit(parallel=True) and a CPU container would not share the GPU
      container's core count. Stage 4 fits from a reloaded store and gets the
      identical checkpoint and the identical metrics. Comparison is dtype-and-
      bytes throughout, never np.array_equal, because the local block is
      float16 and value equality would pass a store built at the wrong width.
      (2) WHAT IT CANNOT PROVE, recorded in the artifact rather than glossed:
      this machine's torch is a CPU build, so stage 3 compares CPU against CPU
      across a process boundary and not against an A10G container. Stage 1's
      finding is what makes that sufficient -- a build that receives only
      numpy arrays, ints and plain objects cannot observe whether an
      accelerator is attached, and in the current path that build already runs
      on the container's CPU while the A10G sits attached and idle. (3) ADOPT.
      feature_build_compute_check.adopt_only_if is satisfied on both limbs.
      Behaviour-preserving, per (1). A small orchestration change, per the
      diff: run_m2_qls_v2_freeze.py gains a --stage argument (full, build,
      fit), a build key over the inputs that decide what a master IS, and a
      loader that REFUSES a master built for a different cell instead of
      silently rebuilding one; the launcher gains CPU-only functions and a
      shared artifact root. No feature formula, dtype, normalisation or column
      order moved, so feature_build_compute_check.never is honoured; full
      remains the default stage and stays tested. (4) THE SMOKE NOW EXERCISES
      THE SPLIT, because the headline will run on it. smoke_spec.
      split_verification adds a CPU build and a GPU fit of the SAME declared
      cell, held against the one-container smoke's own result: two containers
      on real Modal hardware, one with the card and one without, which is
      exactly the cross-container comparison the probe states it cannot
      produce locally. Still pipeline validation only, and it concludes
      nothing scientific. (5) The gate named
      feature_build_equivalence_proved flips to true on that evidence, with
      tests/test_m2_feature_build_equivalence.py holding the probe's
      comparison strict and its verdict a conjunction over what it actually
      measured. Three gates stay false and are unchanged by this amendment:
      compute_within_ceiling, engineering_smoke_passes, and
      musique_clean_data_verified. No M2 fit exists.

