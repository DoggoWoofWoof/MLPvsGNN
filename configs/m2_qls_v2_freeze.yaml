# M2 -- freeze the QLS-v2 candidate. First phase of the development
# closure declared by the 2026-09-07 course decision.
#
# Status: DECLARED_NOT_LAUNCHED. Filed before any M2 fit exists.
#
# Chain to here, all frozen and unmodified by this file:
#   M0A -> M0A.1 -> M0B -> M0C  zero-training availability map
#   M1A (configs/m1a_feature_screen.yaml)  one-seed trained feature screen,
#       44 arms / 13 cells / 5 datasets, seed=0, COMPLETE
#   M1B (configs/m1b_targeted_resolution.yaml)  3-seed + bootstrap targeted
#       resolution of exactly 4 R3 ambiguities, COMPLETE, result recorded as
#       M1B_LEGACY_DEVELOPMENT_COMPLETE
#
# M2's job is to fix the complete candidate QLS-v2 specification -- one
# schema, one architecture, one normalization, one loss, one hyperparameter
# set -- and then SELECT it by testing that single specification for
# Pareto-admissibility across all six current datasets, so that every later
# phase (semantic minimality, the independent GNN screen, the QLS-vs-GNN
# comparison, the minimality certificate) compares against a frozen target
# rather than a moving one. It invents no feature family and reopens no
# M1A/M1B verdict.

substrate_scope: >-
  DEVELOPMENT SUBSTRATE ONLY. squad_clean, 2wiki_clean, hotpotqa_clean,
  metaqa, webqsp and musique_clean are the method-selection substrate for
  this whole development track. Nothing produced under M2 -- or under any
  phase before LEGACY_DEVELOPMENT_FREEZE -- may be described as a final or
  canonical result. Canonical CRAG full-universe data is reserved for final
  confirmation after the method is frozen. Same framing as
  configs/m1b_targeted_resolution.yaml#result.substrate_scope; restated here
  so this file stands alone.

amendments:
  - date: 2026-09-07
    change: >-
      User ruling on the one open implementation precondition, plus three
      corrections to the initial filing, all before the first commit of
      this file. (1) NODE_ROLE under R1/R2 -- option (a): universal_node_
      role_policy = ZERO_WHEN_NOT_APPLICABLE. Reason: R1/R2 contain no
      structurally admitted scored candidates (the scored set is Cq), so
      NODE_ROLE's own definition (1 iff v in C3 \ Cq) evaluates to a
      well-defined constant zero -- the feature's correct value, not a
      hack. Purpose: keep the universal schema and architecture literally
      identical across regimes; dropping the column would make the schema
      regime-dependent and weaken the claim that QLS-UNIVERSAL is one fixed
      representation. Implemented as a scoped compatibility path in
      scripts/run_m1a_feature_screen.py (UNIVERSAL_ARM registered in
      ARM_FAMILIES; _cell_master_local now emits the NODE_ROLE column for
      every regime, zero outside R3; _arm_columns permits NODE_ROLE outside
      R3 only for arms in ZERO_NODE_ROLE_WHEN_NOT_APPLICABLE and refuses a
      nonzero column there). The historical M1A/M1B rule -- NODE_ROLE is an
      R3-only tested family for every historical arm -- is unchanged and
      still raises. Tests: tests/test_m2_universal_schema.py (R1/R2 column
      shape and identically-zero; R3 semantics unchanged; the 14-column
      model equals the 13-column model on any R1/R2 input, weights
      transplanted; live counts 3,585 / 3,072 / 513, and 3,553 for the
      13-column comparison). (2) musique_clean and squad_clean must
      EVALUATE the universal model, not only BASE: both become R1 x {BASE,
      QLS-UNIVERSAL}. A universal model selected "across all six datasets"
      while never running its structural schema on two of them would be
      misnamed; the two are the track's control datasets and their expected
      nulls are evidence only if measured. R1-only scope for both stands on
      the M0C evidence (1.00x R3_BOUNDED growth). (3) QLS-CELL and
      QLS-UNIVERSAL are kept conceptually separate: QLS-CELL is the
      historical/development incumbent map (confirmed where M1B exists,
      provisional where only M1A evidence exists -- never silently
      promoted); QLS-UNIVERSAL is a NEW object M2 selects by testing
      Pareto-admissibility per cell, not a union of cell winners. The
      workload was recomputed from the scientific matrix rather than
      preserved at the earlier "14": 15 new fits, 19 reused seed-0 fits, 34
      logical fits (m2_selection_matrix below). this_file_authorises is
      extended to the compute estimate for that matrix (spends nothing);
      launch stays unauthorised pending a further amendment, the same
      estimate -> smoke -> launch gate ordering M1A used for its steps 3/4/5.
  - date: 2026-09-07
    change: >-
      THE LAUNCH AMENDMENT (second filing, same date, after the user reviewed
      the declaration checkpoint and the compute estimate). Six things, all
      filed BEFORE any M2 outcome exists. (1) The universal selection rule is
      frozen ahead of results, and it is dataset-balanced rather than a naive
      mean over all 14 cells: per cell the reference is the QLS-CELL incumbent
      if one exists, otherwise BASE; the primary quantity is delta R@5
      (UNIVERSAL - reference); dataset_delta is the mean of that dataset's own
      declared regime cells; macro_delta is the equal-weight mean over the six
      datasets. QLS-UNIVERSAL advances iff macro_delta >= -0.25pp AND no
      dataset_delta < -0.50pp AND no individual cell delta < -0.50pp.
      Rationale for replacing "ADMISSIBLE in all 14 cells": an unweighted cell
      mean would give 2wiki_clean and hotpotqa_clean three votes each and
      squad_clean/musique_clean one, so the six-dataset coverage claim would be
      decided by which datasets happen to declare more regimes. See
      universal_selection_rule below -- that block, not this summary, is the
      operative text. R@1/R@20/MRR/FullCov@20 are reported and can never
      replace R@5 after outcomes. (2) The compute estimate amendment 1
      authorised is filed: compute below, from scripts/m2_compute_estimate.py
      -- 15 new fits, 1.82-1.93 GPU-h pure compute, $4.07-$4.33 all-GPU-billed,
      $9.00 proposed ceiling. (3) The reuse of all 19 seed-0 fits must be
      earned mechanically, not by prose: scripts/m2_reuse_audit.py, including a
      bit-exact old-code-vs-current-code feature probe for every historical arm
      type; any candidate that fails is marked NEW and the workload/cost are
      recomputed rather than forced. (4) Instrumentation becomes a launch gate
