      scripts/run_m1a_feature_screen.py (UNIVERSAL_ARM registered in
      ARM_FAMILIES; _cell_master_local now emits the NODE_ROLE column for
      every regime, zero outside R3; _arm_columns permits NODE_ROLE outside
