# --------------------------------------------------------------------------
# What M2 answers, and what it explicitly does not
# --------------------------------------------------------------------------

scientific_questions:
  qls_cell: >-
    Per (dataset, regime) cell, what is the incumbent feature subset the
    already-completed validation evidence supports -- and, for each one, is
    that support a real bootstrap confirmation or only a one-seed point
    estimate? Answered below from existing evidence; no new fit.
  qls_universal: >-
    Is one single frozen specification -- schema, architecture,
    normalization, loss, hyperparameters, applied identically to all six
    datasets -- Pareto-admissible in every cell against BASE and against
    the QLS-CELL incumbent where one exists? If yes, it is the selected
    universal model every later phase tests against. If it fails in a
    cell, this file records where and by how much; it does not retune.
  musique_reintroduction: >-
    musique_clean has real zero-training M0B/M0C evidence but has never been
    through any trained phase. What is the smallest screen that brings it
    into the development substrate on the same footing as the other five
    AND actually evaluates the universal schema on it?
  out_of_scope: >-
    Everything else. M2 does not re-run M1A's screen, does not re-test any
    M1B verdict, does not choose between QLS and a GNN, does not compare
    semantic rungs, and does not remove features to certify minimality --
    each of those is its own later, separately declared phase.

# --------------------------------------------------------------------------
# QLS-CELL -- the incumbent map, derived mechanically from completed evidence
# --------------------------------------------------------------------------

qls_cell:
  definition: >-
    The historical/development INCUMBENT map: per (dataset, regime) cell,
    the feature subset already-completed validation evidence supports,
    labelled by how strong that evidence is. Confirmed where an M1B
    bootstrap exists; provisional where only M1A one-seed evidence exists.
    A per-cell finding and a comparator for M2's selection -- not a
    deployable model, and not what QLS-UNIVERSAL is derived from.
  derivation:
    script: scripts/m2_qls_cell_derivation.py
    artifact: outputs/m2_qls_v2_freeze/qls_cell_derivation.json
    tests: tests/test_m2_qls_cell_derivation.py
    inputs:
      - outputs/m1a_feature_screen/headline/{squad_clean,2wiki_clean,hotpotqa_clean,metaqa,webqsp}.json
      - outputs/m1b_targeted_resolution/m1b_result_map.json
    why_a_committed_script_and_a_map_inside_this_file: >-
      M1A's own step-6 classification map was "delivered to the user in
      chat, not duplicated into this file" (configs/m1a_feature_screen.yaml
      amendment, 2026-09-05). It was therefore not recoverable from any repo
      file, and had to be re-derived from the raw headline JSONs before M2
      could state QLS-CELL honestly -- real rework caused purely by an
      unfiled result. Three things prevent a recurrence: the derivation is
      a committed script; its tests are committed and cross-check the
      script's output against the real M1A/M1B evidence; and the resulting
      map is written INTO this file (map: below), where
      tests/test_m2_declaration.py locks it against the script's output.
      The JSON artifact itself lives under outputs/, which this repo
      gitignores for every result artifact (M1B's included) -- it is
      regenerable in seconds from committed code over the same inputs, not
      a source of truth. Same lesson as M1B's amendment 5 (mid-flight
      row-capture correction); see instrumentation_requirement below.
  m1a_labelling_rule_reproduced_faithfully: >-
    M1A issued no PROMOTED and no HARMFUL label anywhere, on any cell. Both
    labels require "uncertainty not overlapping zero", which a one-seed
    screen structurally cannot supply, so every |delta R@5| > 0.25pp result
    -- gray-zone or material-magnitude alike -- fell back to
    UNRESOLVED_BY_FILED_RULE (m1a_feature_screen.yaml amendment 2026-09-05).
    The derivation reproduces that behaviour rather than the idealised
    four-label rule. This matters concretely: reproducing the idealised rule
    would label webqsp/R3 NODE_ROLE (+2.358pp, one seed) PROMOTED, and M1B
    then failed to confirm exactly that effect.
  map:
    squad_clean:
      R1: {features: [], status: NO_STRUCTURAL_ARMS_DECLARED}
    2wiki_clean:
      R1: {features: [], status: NO_EFFECT_M1A_ONLY}
      R2: {features: [], status: NO_EFFECT_M1A_ONLY}
      R3:
        features: [NODE_ROLE]
        status: MIXED_SEE_PER_FEATURE
        per_feature:
          NODE_ROLE: UNRESOLVED_PROVISIONAL_M1A_ONE_SEED_ONLY
          SUPPORT: M1B_BOOTSTRAP_NOT_CONFIRMED
          GEOMETRY: UNRESOLVED_NEVER_TESTED_BY_M1B
          PATH: UNRESOLVED_NEVER_TESTED_BY_M1B
    hotpotqa_clean:
      R1: {features: [SUPPORT], status: UNRESOLVED_PROVISIONAL_M1A_ONE_SEED_ONLY}
      R2: {features: [SUPPORT], status: UNRESOLVED_PROVISIONAL_M1A_ONE_SEED_ONLY}
      R3: {features: [SUPPORT], status: M1B_BOOTSTRAP_CONFIRMED}
    metaqa:
      R1: {features: [], status: NO_EFFECT_M1A_ONLY}
      R2: {features: [PATH], status: UNRESOLVED_PROVISIONAL_M1A_ONE_SEED_ONLY}
      R3: {features: [PATH], status: M1B_BOOTSTRAP_CONFIRMED}
    webqsp:
      R1: {features: [], status: NO_STRUCTURAL_ARMS_DECLARED}
      R2: {features: [], status: NO_STRUCTURAL_ARMS_DECLARED}
      R3: {features: [], status: M1B_BOOTSTRAP_NOT_CONFIRMED}
    musique_clean:
      status: NO_TRAINED_EVIDENCE_YET
      note: see musique_clean_reintroduction below
  what_is_actually_confirmed: >-
    Exactly two cells in the entire development substrate carry a
    bootstrap-confirmed structural feature: hotpotqa_clean/R3 (SUPPORT,
    +1.38pp, CI [1.00, 1.78]pp) and metaqa/R3 (PATH, +0.87pp, CI [0.60,
    1.15]pp). Everything else is either a genuine null, an untested
    alternative, or a one-seed point estimate carried forward provisionally.
    Provisional cells are never silently promoted by this file or by M2's
    selection; they remain provisional until something tests them.
  named_open_risks:
    2wiki_node_role: >-
      2wiki_clean/R3's NODE_ROLE sits in QLS-CELL on one-seed evidence only
      (+2.625pp). M1B never tested "BASE+NODE_ROLE vs BASE" on 2wiki_clean;
      it tested only whether SUPPORT adds anything on top of an assumed
      NODE_ROLE base (it does not: +0.22pp, CI [-0.28, 0.72]pp). The one
      time a comparable NODE_ROLE point estimate was properly tested --
      webqsp/R3, +2.358pp at seed 0 -- it did not survive (CI [-4.10,
      5.23]pp, one seed outright negative). This is a live risk, not a
      resolved question. M2 does not resolve it; QLS-UNIVERSAL's design
      below makes resolving it unnecessary for the frozen model, and the
      later minimality certificate is where it gets decided on evidence.
    regime_carryover: >-
      M1B tested R3 only ("no regime other than R3",
      m1b_targeted_resolution.yaml#scientific_questions.out_of_scope). Every
      R1/R2 feature in the map above is therefore PROVISIONAL, inherited
      from a regime-neighbouring confirmation, never itself confirmed.
    untested_tied_alternatives: >-
      2wiki_clean/R3's GEOMETRY (+2.583pp) and PATH (+2.375pp) are
      effectiveness-tied with the arms that were tested (spread 0.21pp,
      inside the filed tolerance) and lost only the systems tie-break. They
      are unconfirmed, not rejected. Reopening them is not authorised here.

# --------------------------------------------------------------------------
# QLS-UNIVERSAL -- the candidate to be selected. One spec, six datasets.
# --------------------------------------------------------------------------

qls_universal:
  definition: >-
    One specification applied identically to all six datasets and every
    declared regime: identical feature schema, identical column order,
    identical input width, identical architecture, identical normalization,
    identical loss, identical hyperparameters, identical training protocol,
    identical trainable parameter count. Weights are fit per (dataset,
    regime) cell -- as in every phase of this track -- but nothing about the
    specification varies by cell. It is a NEW object M2 selects, not a
    union of QLS-CELL winners: the candidate schema below is a reasonable
    candidate because each structural family helped somewhere, but it is
    the selected universal model only once m2_selection_matrix shows it
    Pareto-admissible in every cell. Once selected, it is the object the
    GNN is later compared against and the object the minimality
    certificate later ablates.
  feature_schema:
    frozen_column_order: [
      seed_identity,                       # precomputed 0-3: base_columns() order, m1a_screen.py
      dense_reciprocal_rank,
      splade_reciprocal_rank,
      retriever_agreement,
      node_role_is_structurally_admitted,  # precomputed 4-8: arm_families_tuple order via _arm_columns()
      support_seed_connections,
      path_length_1,
      path_length_2,
      path_length_3,
      cosine_qd,                           # 9-13: SemanticHead(S3).feature_names, verbatim, appended last
      dot_qd_pct,
      mean_abs_diff,
      semantic_product,
      semantic_difference,
    ]
    column_order_source: >-
      M1AScorer.forward_explicit concatenates [structural_features, semantic]
      -- precomputed block first, live semantic block last. Within the
      precomputed block, scripts/run_m1a_feature_screen.py::_arm_columns
      emits BASE's four columns then each family in the arm's ARM_FAMILIES
      tuple order. The semantic names are SemanticHead's own feature_names,
      not relabelled. tests/test_m2_declaration.py asserts the semantic
      block against the live module and the precomputed block against the
      registered arm's family tuple.
    arm_name: "BASE+NODE_ROLE+SUPPORT+PATH"
    arm_families_tuple: [NODE_ROLE, SUPPORT, PATH]   # registered verbatim as run_m1a_feature_screen.UNIVERSAL_ARM
    width: 14
    precomputed_width: 9        # M1AScorer's precomputed_width= argument: 4 BASE + 1 NODE_ROLE + 1 SUPPORT + 3 PATH
    semantic_feature_count: 5   # SemanticHead(rung=S3).feature_names, computed live per query, not precomputed
    families: [SEED, RETRIEVAL, SEMANTIC_S3, NODE_ROLE, SUPPORT, PATH]
    every_family_is_preexisting: >-
      All six are already-frozen catalog families reused verbatim (SEED /
      RETRIEVAL / NODE_ROLE / SUPPORT / PATH per
      m1a_feature_screen.yaml#feature_catalog, S3 per
      base.semantic_rung). No new family, no new formula inside a family,
      no re-representation of SUPPORT or PATH. GEOMETRY, DIFFUSION and
      TOPOLOGY are excluded -- see excluded_families below.
    why_all_three_structural_families_are_always_present: >-
      QLS-UNIVERSAL is deliberately NOT the union of the per-cell QLS-CELL
      findings, and deliberately not validation-selected per dataset.
      Selecting its schema per dataset would (a) make "one schema across
      six datasets" false by construction, (b) bake the named open risks
      above into the frozen model -- 2wiki's unconfirmed NODE_ROLE would
      decide a column's existence -- and (c) leave the minimality
      certificate nothing to ablate, since a pre-minimised schema cannot be
      tested for minimality. Including all three, testing the whole for
      admissibility in every cell, and letting the certificate remove them
      one at a time on evidence is the design that answers the question
      rather than assuming it.
    universal_node_role_policy:
      policy: ZERO_WHEN_NOT_APPLICABLE
      ruled_by: user, 2026-09-07 (amendment 1)
      contract: >-
        QLS-UNIVERSAL input schema: always 14 columns.
        NODE_ROLE(v) = 0 for every scored candidate under R1;
        NODE_ROLE(v) = 0 for every scored candidate under R2;
        NODE_ROLE(v) = 1 iff v in C3 \ Cq, 0 iff v in Cq, under R3.
        Same column order, same input width, same M1AScorer architecture,
        same 3,585 trainable parameters, same formulas, same hyperparameters
        across every dataset and regime.
      why_zero_is_the_feature_value_not_a_placeholder: >-
        Under R1 and R2 the scored set is Cq by construction
        (run_m1a_feature_screen.py::_cell_master_local), so C3 \ Cq is
        empty and the family's own definition evaluates to 0 for every
        scored candidate. m1a_feature_screen.yaml#feature_catalog.NODE_ROLE.
        constant_under_r1_r2 already states this fact; M2 keeps the column
        so the schema is literally regime-independent.
      scoped_implementation: >-
        run_m1a_feature_screen.py: UNIVERSAL_ARM is registered in
        ARM_FAMILIES with families (NODE_ROLE, SUPPORT, PATH);
        _cell_master_local emits the NODE_ROLE column for every regime
        (node_role_column under R3, an explicit zero column otherwise);
        _arm_columns permits NODE_ROLE outside R3 only for arms in
        ZERO_NODE_ROLE_WHEN_NOT_APPLICABLE and raises if that column is not
        identically zero there. Every historical M1A/M1B arm is unchanged:
        BASE+NODE_ROLE under R1/R2 still raises, and every historical arm's
        store is column-for-column identical to before (the NODE_ROLE
        column exists in the in-memory master block for R1/R2 but no
        historical arm reads it).
      tests: tests/test_m2_universal_schema.py
      parameter_accounting_under_r1_r2: >-
        The 32 first-layer weights connected to the NODE_ROLE input receive
        a zero input under R1/R2 and therefore no gradient; they are dead
        weight in those regimes by design, and the price of insisting on
        one universal architecture. Parameter count stays 3,585 everywhere.
        The 14-column model is functionally identical to a 13-column model
        with those weights removed on any R1/R2 input -- tested by weight
        transplant, not by metric agreement after training.
  excluded_families:
    GEOMETRY:
      reason: >-
        Not excluded for weakness -- it is one of the tied 2wiki/R3
        alternatives. Excluded because including it would widen the frozen
        schema by 3 columns on the strength of a single dataset's untested
        one-seed tie, and because its column 0 overlaps SEED (already in
        BASE), making its true addition 3 columns of geometry the catalog
        rated ADMITTED only on 2wiki/CAND. Recorded as an exclusion by
        parsimony, reversible only by a future declaration, never silently.
    DIFFUSION: {reason: "NEGLIGIBLE on the only cell ever measured (2wiki/CAND, D7); excluded from M1A's matrix for the same reason"}
    TOPOLOGY: {reason: "NEGLIGIBLE, same basis as DIFFUSION"}
  architecture:
    scorer: src/mp_retrieval/m1a_screen.py::M1AScorer
    unchanged_from_m1a: true
    semantic_head: "src/mp_retrieval/qls_v2_semantic.py::SemanticHead(rung=S3, dim=1536)"
    head_width: 32
    head: "nn.Sequential(Linear(width, 32), GELU, Dropout(0.2), Linear(32, 1))"
    why_unchanged: >-
      M1A and M1B both fit this exact scorer. Changing the architecture at
      freeze time would invalidate the reuse of every completed fit and make
      QLS-CELL's evidence non-comparable with QLS-UNIVERSAL's. The freeze
      fixes what already ran; it does not redesign it.
  parameter_count:
    total: 3585
    semantic: 3072       # 2 * frozen_embedding_dim (1536), S3
    scorer: 513          # 32 * 14 + 32 (bias) + 32 + 1 (output layer)
    thirteen_column_comparison_model: 3553   # scorer 481; used only by the R1/R2 equivalence test, never fit
    derivation_check: >-
      scorer params = 32*in_dim + 65. Verified against three real M1A arms
      at three widths: BASE (in_dim 9) -> 353, observed 3425-3072=353;
      BASE+SUPPORT (in_dim 10) -> 385, observed; BASE+PATH (in_dim 12) ->
      449, observed. QLS-UNIVERSAL's in_dim 14 -> 513. Arithmetic, not an
      estimate -- and asserted live against the instantiated module in
      tests/test_m2_declaration.py and tests/test_m2_universal_schema.py,
      per this track's standing never-assume-a-parameter-count discipline
      (m1a_feature_screen.yaml#model_architecture.head_width.live_verification).
    context: >-
      3,585 parameters against historical QLS-v1's ~213K, of which 98,304
      is the fixed 768->64 projection this line of work exists to question.
  normalization: candidate            # qls_local_features(normalisation="candidate"), hardcoded, unchanged
  loss: listwise                      # run_sa_mlp_confirmation.py::_fit, reused unmodified
  hyperparameters:
    epochs: 3
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    dropout: 0.2
    temperature: 0.07
    batch_size: 16
    holdout_fraction: 0.2
    per_seed_cap: 16
    neighbour_scan_cap_per_seed: 4096
    device: cuda
    source: >-
      Every value above is what scripts/modal_m1a_feature_screen.py's
      _runner_args already hardcodes, and what M1A's 44 arms and M1B's 27
      fits actually ran under. Frozen by transcription, not by new choice --
      no hyperparameter is tuned by or for M2.
  regimes: [R1, R2, R3]               # R1/R2/R3_BOUNDED exactly as frozen in M1A; R3_FULL never trained
  seeds:
    m2_seeds: 1
    seed_values: [0]
    why_one: >-
      Compute ladder, unchanged: cheap validation -> one seed -> only
      genuinely ambiguous decisions get 3. Every reused comparator is a
      seed-0 fit, so the new fits are seed 0 too. A cell whose
      admissibility verdict lands in the gray zone (see
      m2_selection_matrix.admissibility_rule) is the only thing that earns
      a 3-seed expansion, and only by a further amendment.
    five_seed_confirmation: RESERVED_FOR_CANONICAL_DATA_NOT_AUTHORISED_ANYWHERE_IN_DEVELOPMENT
  weights_are_fit_per_cell_not_jointly: >-
    Explicit, because "one universal model" is ambiguous: the SPECIFICATION
    is universal, the WEIGHTS are fit per (dataset, regime) cell, exactly as
    in M1A/M1B. No cross-dataset joint training happens anywhere in this
    track, and introducing it would be a new architectural decision nothing
    has asked for.

# --------------------------------------------------------------------------
# M2 selection matrix -- what gets compared, per cell. Not authorised to run.
# --------------------------------------------------------------------------

m2_selection_matrix:
  comparators_per_cell: >-
    In every cell QLS-UNIVERSAL is compared against BASE (the floor) and,
    where QLS-CELL names one, against the incumbent arm. Both comparators
    already exist as real seed-0 fits and are REUSED, never refit, subject
    to the reuse audit below. Only QLS-UNIVERSAL is new -- plus both
    musique_clean arms, since musique_clean has no trained fit of any kind.
  cells:
    squad_clean:
      R1: {BASE: reuse_m1a_seed0, QLS-UNIVERSAL: new}
    2wiki_clean:
      R1: {BASE: reuse_m1a_seed0, QLS-UNIVERSAL: new}
      R2: {BASE: reuse_m1a_seed0, QLS-UNIVERSAL: new}
      R3: {BASE: reuse_m1a_seed0, "BASE+NODE_ROLE": reuse_m1a_seed0_incumbent_provisional, QLS-UNIVERSAL: new}
    hotpotqa_clean:
      R1: {BASE: reuse_m1a_seed0, "BASE+SUPPORT": reuse_m1a_seed0_incumbent_provisional, QLS-UNIVERSAL: new}
      R2: {BASE: reuse_m1a_seed0, "BASE+SUPPORT": reuse_m1a_seed0_incumbent_provisional, QLS-UNIVERSAL: new}
      R3: {BASE: reuse_m1a_seed0, "BASE+SUPPORT": reuse_m1a_seed0_incumbent_confirmed, QLS-UNIVERSAL: new}
    metaqa:
      R1: {BASE: reuse_m1a_seed0, QLS-UNIVERSAL: new}
      R2: {BASE: reuse_m1a_seed0, "BASE+PATH": reuse_m1a_seed0_incumbent_provisional, QLS-UNIVERSAL: new}
      R3: {BASE: reuse_m1a_seed0, "BASE+PATH": reuse_m1a_seed0_incumbent_confirmed, QLS-UNIVERSAL: new}
    webqsp:
      R1: {BASE: reuse_m1a_seed0, QLS-UNIVERSAL: new}
      R2: {BASE: reuse_m1a_seed0, QLS-UNIVERSAL: new}
      R3: {BASE: reuse_m1a_seed0, QLS-UNIVERSAL: new}   # BASE+NODE_ROLE is not an incumbent here: M1B NOT_CONFIRMED
    musique_clean:
      R1: {BASE: new, QLS-UNIVERSAL: new}
  workload:
    cells: 14
    new_fits: 15            # 13 QLS-UNIVERSAL + musique_clean BASE + musique_clean QLS-UNIVERSAL
    reused_fits: 19         # 13 BASE + 6 incumbents (2wiki R3; hotpot R1/R2/R3; metaqa R2/R3)
    logical_fits: 34
    seeds_per_fit: 1
    recomputed_not_preserved: >-
      The initial filing said 14 fits (13 QLS-UNIVERSAL + one musique BASE).
      Amendment 1 added musique_clean's QLS-UNIVERSAL arm; the count is
      recomputed from the matrix above, and tests/test_m2_declaration.py
      derives it from the matrix rather than asserting a literal.
  admissibility_rule:
    source: configs/m1a_feature_screen.yaml#selection_rule, applied verbatim
    primary_metric: recall_at_5
    per_cell: >-
      QLS-UNIVERSAL is ADMISSIBLE in a cell if its R@5 is within the filed
      +/-0.25pp tolerance of, or better than, the best comparator in that
      cell (BASE, or the incumbent where one exists). It is INADMISSIBLE
      in a cell if it regresses that comparator by more than the filed
      0.50pp material threshold. Strictly between the two it is GRAY --
      the only outcome that earns a 3-seed expansion, by further amendment.
      Parameter count is constant by construction and uncached feature
      build p95 is shared per cell, so the lexicographic systems tie-break
      cannot separate arms here; effectiveness decides, systems are
      reported.
    universal_verdict: >-
      SUPERSEDED BY universal_selection_rule (amendment 2, 2026-09-07),
      which is the operative rule and was frozen before any M2 outcome
      existed. The original wording -- "SELECTED_UNIVERSAL only if
      ADMISSIBLE in all 14 cells" -- is retained here as the historical
      record of what amendment 1 filed, and its all-cell no-material-
      regression requirement survives verbatim as the third clause of the
      new rule (no individual cell delta R@5 below -0.50pp). What changed
      is that the aggregate is now dataset-balanced rather than an
      unweighted mean over 14 cells, so a six-dataset coverage claim is not
      decided by which datasets happen to declare three regimes and which
      declare one. Unchanged either way: no schema is reduced or retuned
      inside M2 in response to a failure -- a reduced universal schema is a
      new candidate for a new declaration, and the minimality certificate
      is the phase built to remove families on evidence.
    per_cell_labels_are_still_reported: >-
      The ADMISSIBLE / GRAY / INADMISSIBLE label above is still computed and
      reported for every cell. It is a diagnostic that locates a problem;
      the advancement decision itself is universal_selection_rule's three
      clauses, nothing else.
    secondary_diagnostics_reported_never_deciding: [recall_at_1, recall_at_20, mrr, full_coverage_at_20, ceiling_attainment_at_5]
  reuse_audit_required_before_launch: >-
    M1B's audit (scripts/m1b_reuse_audit.py) proved reuse via git-HEAD
    identity with the M1A launch commit. That identity no longer holds:
    HEAD has moved for M1B's own commit and for amendment 1's scoped runner
    change. M2's audit must therefore reason per change rather than per
    HEAD: the only trainer/feature-builder source change since M1A's launch
    is the universal-schema path in run_m1a_feature_screen.py, and it
    leaves every historical arm's store column-for-column identical (pinned
    by tests/test_run_m1a_feature_screen.py::test_arm_columns_selects_the_
    declared_family_slots_in_order and tests/test_m2_universal_schema.py).
    All 19 reused fits are historical arms. Where a seed-0 fit exists both
    in M1A and in M1B's execution_2 re-run (the four R3 cells), prefer the
    M1B one: it carries per-query rows, which a gray-zone expansion would
    need. Filed by amendment 2 as reuse_audit below; that block, not this
    paragraph, is what the launch gate reads.
  reuse_audit: # filed by amendment 2, 2026-09-07
    status: MECHANICAL_NOT_PROSE
    script: scripts/m2_reuse_audit.py
    artifact: outputs/m2_qls_v2_freeze/reuse_audit.json
    tests: tests/test_m2_reuse_audit.py
    scope: >-
      All 19 proposed reused seed-0 fits, individually. Not a single
      repository-level verdict inherited by all of them, which is what
      git-HEAD identity gave M1B and what no longer applies here.
    per_fit_checks_all_required:
      - same_historical_arm_name
      - same_feature_column_indices                 # MASTER_COLUMNS/ARM_FAMILIES slices, old code vs current
      - same_model_input_width                      # precomputed_width recorded in the source result
      - same_trainer_hyperparameters                # against modal_m1a_feature_screen.py::_runner_args, live
      - same_validation_and_holdout_query_ids
      - same_dataset_fingerprint
      - same_candidate_contract_fingerprint
    bit_exact_feature_probe: >-
      Required, and the reason this audit is not prose. For every historical
      arm type (BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH,
      BASE+NODE_ROLE, BASE+NODE_ROLE+SUPPORT) the audit loads the
      pre-change feature builder from git object 3d85916 as a separate
      module, runs it and the current one on the same deterministic
      fixture, and requires the produced feature tensors to be equal
      element-for-element -- not close, equal. The universal compatibility
      path must not have altered any historical M1A/M1B arm, and this is
      what proves it rather than assuming it from a diff.
    on_failure: >-
      A candidate that fails any check is marked NEW, not argued into
      reuse. The workload and the compute estimate are then recomputed from
      the audit's own counts (scripts/m2_compute_estimate.py reads them),
      and the launch gate re-evaluated against the filed ceiling. Forcing a
      reuse past a failed check is prohibited.
    result: # written by the script, 2026-09-07, per instrumentation_requirement.also_applies_to_analysis_products
      status: M2_REUSE_AUDIT_COMPLETE
      all_reusable: true
      reusable_fits: 19
      refused_fits: []
      workload_unchanged: true     # 15 new / 19 reused / 34 logical, exactly as filed
      bit_exact_feature_probe: BIT_EXACT_HISTORICAL_ARM_EQUIVALENCE
      probe_detail: >-
        All six historical arms compared across R1, R2 and R3 on the committed
        deterministic fixture. Where both paths produce a tensor it is equal
        element-for-element in float16, with candidate_ptr, query_position and
        precomputed_width equal; where the arm is BASE+NODE_ROLE or
        BASE+NODE_ROLE+SUPPORT outside R3 both paths refuse it identically.
        The R1/R2 master block did widen from 11 to 12 columns -- that is the
        change under audit -- and the added column is identically zero while
        every column a historical arm reads is unchanged.
      probe_is_not_vacuous: >-
        The fixture admits a real A64-only node outside Cq (doc_8), so the
        NODE_ROLE column is genuinely nonzero under R3 rather than agreeing on
        zeros. tests/test_m2_reuse_audit.py re-runs the probe against three
        deliberately perturbed feature paths -- a one-unit change to a single
        BASE value, a reordered family block at the same width, and a
        historical arm that stops refusing NODE_ROLE outside R3 -- and requires
        the probe to refuse each of them.
      one_check_was_wrong_and_was_corrected: >-
        The first run refused squad_clean/R1/BASE on a64_mainline_family. The
        fit was fine: run_m1a_feature_screen.run() records that field only when
        the dataset declares an R3 cell, because A64 exists to build C3, so an
        R1-only dataset correctly records null. The audit, not the fit, was
        corrected (_a64_family_matches), and the correction is itself tested.
      m1b_sourced_fits: 7   # the four R3 cells' BASE plus 2wiki NODE_ROLE, hotpot SUPPORT, metaqa PATH
    prefer_m1b_rows_where_both_exist: >-
      For the four R3 cells M1B re-ran with row capture (2wiki_clean,
      hotpotqa_clean, metaqa, webqsp), the M1B execution_2 seed-0 fit is the
      preferred source: identical result, plus the per-query rows a
      gray-zone expansion would need. Verified equal to M1A's own recorded
      recall@5 at seed 0 in every case (M1B's own cross_checked_against_
      m1a_splice records delta 0.0pp on all of them), so this is a choice of
      the richer artifact, not of a different number.
  compute_estimate:
    status: FILED_2026_09_07     # amendment 2; see the compute block below for the figures
    script: scripts/m2_compute_estimate.py
    artifact: outputs/m2_qls_v2_freeze/compute_estimate.json
    note: >-
      Inputs are M1A's own real measured rates (per-cell uncached feature
      build, per-train-query fit seconds) from the real M1A headline JSONs;
      15 new fits over 14 cells, musique_clean's feature build being the
      only cell with no prior M1A-scale measurement (M0B/M0C measured it at
      zero-training scale, calibrated here by the measured M0C->M1A drift on
      its twin squad_clean/R1). The script asserts its enumerated counts
      against the workload block above rather than restating them.

# --------------------------------------------------------------------------
# The universal selection rule -- frozen before any M2 outcome exists.
# Amendment 2, 2026-09-07. This block is operative; m2_selection_matrix.
# admissibility_rule.universal_verdict is the superseded earlier wording.
# --------------------------------------------------------------------------

universal_selection_rule:
  status: CLOSED_2026_09_07_BEFORE_ANY_M2_RESULT_EXISTS
  ruled_by: user, 2026-09-07 (amendment 2)
  primary_metric: recall_at_5
  effect_scale: percentage_points

  per_cell:
    reference: >-
      The QLS-CELL incumbent arm for that cell if one exists, otherwise
      BASE. Exactly the map in qls_cell.map above -- six cells have an
      incumbent (2wiki_clean/R3 BASE+NODE_ROLE; hotpotqa_clean/R1, R2, R3
      BASE+SUPPORT; metaqa/R2, R3 BASE+PATH) and the other eight reference
      BASE. Never "the better of the two", which would silently make the
      comparison adaptive to the outcome.
    quantity: "cell_delta = R@5(QLS-UNIVERSAL) - R@5(reference), in percentage points"
    both_sides_are_seed_0: >-
      The reference is a reused (or, where the audit refuses reuse, a
      re-run) seed-0 fit and QLS-UNIVERSAL is a new seed-0 fit on the same
      cell, the same validation prefix, the same holdout split and the same
      candidate contract -- paired by construction, exactly as M1A's own
      arm comparisons were.

  per_dataset:
    quantity: "dataset_delta = mean(cell_delta) over that dataset's own declared regime cells"
    cells_per_dataset: {squad_clean: 1, 2wiki_clean: 3, hotpotqa_clean: 3, metaqa: 3, webqsp: 3, musique_clean: 1}

  macro:
    quantity: "macro_delta = mean(dataset_delta) over the six datasets, equal weight each"
    why_not_a_flat_cell_mean: >-
      A flat mean over the 14 cells weights 2wiki_clean, hotpotqa_clean,
      metaqa and webqsp at 3/14 each and squad_clean and musique_clean at
      1/14 each. M2's claim is that one specification works across six
      DATASETS, so the aggregate that decides it must weight datasets
      equally; otherwise the verdict is decided by which datasets happened
      to earn three regime cells in M1A, which is a fact about M0C's
      context-growth map, not about the universal schema.

  advancement_condition: >-
    ADVANCE_QLS_UNIVERSAL iff all three hold at this one-seed screening
    scale: (1) macro_delta >= -0.25pp; AND (2) no dataset_delta < -0.50pp;
    AND (3) no individual cell_delta < -0.50pp. All three are required; any
    one failing means the candidate does not advance as filed.
  thresholds:
    macro_tolerance_pp: -0.25          # m1a_feature_screen.yaml#selection_rule tolerance, reused verbatim
    dataset_material_regression_pp: -0.50   # m1a's filed material threshold, reused verbatim
    cell_material_regression_pp: -0.50      # same threshold, applied per cell
    no_new_number_is_introduced_here: >-
      Both magnitudes are M1A's own filed +/-0.25pp tolerance and 0.50pp
      material threshold, reused unchanged. The only new content in this
      rule is the two-level aggregation, not a retuned threshold.

  outcome_labels:
    ADVANCE_QLS_UNIVERSAL: "all three clauses hold; QLS-UNIVERSAL is the selected universal candidate every later phase tests against"
    NOT_ADVANCED_AS_FILED: "clause (2) or (3) failed -- the result names every failing dataset/cell and its magnitude"
    GRAY_PENDING_THREE_SEED: >-
      macro_delta between -0.50pp and -0.25pp with clauses (2) and (3)
      holding, or a single cell/dataset sitting inside the -0.50/-0.25pp
      band. Resolved -- if resolved at all -- by the already-established
      3-seed procedure (configs/m1b_targeted_resolution.yaml#uncertainty_
      procedure + promotion_rule_for_m1b, reused unmodified), and only by a
      further amendment that authorises those seeds. Not resolved by
      re-reading the one-seed numbers.
  gray_zone_uses_an_existing_procedure_not_a_new_one: >-
    M1B already filed a paired per-query bootstrap over a shared held-out
    set, 10,000 replicates, seed 20260905, and a 3-seed promotion rule. A
    gray M2 verdict inherits that machinery verbatim rather than inventing
    a second uncertainty procedure. Nothing about it is re-opened or
    re-tuned here.

  secondary_diagnostics:
    reported_always: [recall_at_1, recall_at_20, mrr, full_coverage_at_20]
    never_deciding: >-
      Reported for every fit at every level (cell, dataset, macro) and
      never substituted for R@5 after outcomes are visible. This restates
      m1a_feature_screen.yaml#selection_rule.secondary_diagnostics_never_
      swap_primary, which M1A filed and M1B honoured; M2 adds nothing to it
      and removes nothing from it.

  frozen_before_outcomes: >-
    Filed 2026-09-07 as amendment 2, before scripts/run_m2_qls_v2_freeze.py
    existed, before any smoke ran and before any M2 fit produced a number.
    The rule is applied mechanically by a committed script
    (scripts/m2_selection_report.py) whose tests assert the arithmetic on
    synthetic cases that exercise each clause independently, so the verdict
    cannot be reached by reading a table and choosing a framing.
  qls_universal_is_not_modified_after_results: >-
    Whatever this rule returns, the 14-column schema, the architecture, the
    normalization, the loss and the hyperparameters stay exactly as
    qls_universal declares them. A different schema is a different
    candidate and needs a different declaration; the minimality certificate
    is the phase built to remove families on evidence.

# --------------------------------------------------------------------------
# musique_clean -- reintroduction, derived from M0C's own map
# --------------------------------------------------------------------------

musique_clean_reintroduction:
  prior_status: OUT_OF_SCOPE_FOR_M1A     # m1a_feature_screen.yaml#datasets.musique_clean
  why_it_was_deferred: >-
    M0C found musique_clean's R3_BOUNDED context growth is exactly 1.00x
    (docs/M0C_BOUNDED_R3_RESULTS.md), and its entire residual gold gap is 4
    instances in total, of which R3_BOUNDED recovers 0. M0C Step 7 grouped
    it with squad_clean as "deprioritized ... at or near ceiling already --
    no family can improve what is barely missing". M1A found no condition it
    supplied that squad_clean did not already cover.
  why_it_returns_now: >-
    The course decision requires the universal model to be developed over
    all six current datasets. That is a coverage requirement -- and
    coverage means the universal schema is actually evaluated here, not
    that the dataset merely appears in a table with a BASE number.
  proposed_cells:
    R1: {arms: [BASE, QLS-UNIVERSAL], why: "BASE is the floor; QLS-UNIVERSAL is the object under selection. Both new -- musique_clean has no trained fit of any kind."}
  why_r1_only: >-
    Mechanical, not a judgement call: squad_clean's R2/R3 cells were skipped
    because "context growth is 1.00x over R1 in every M0C measurement --
    there is no repair happening on this dataset for a second or third
    regime cell to isolate" (m1a_feature_screen.yaml#datasets.squad_clean.
    why_only_one_regime). musique_clean's M0C growth ratio is the same 1.00x.
    The same rule therefore yields the same regime scope. It does NOT yield
    a BASE-only arm scope -- see the next key.
  why_the_universal_arm_is_mandatory_here: >-
    Reintroduced means evaluated. Running only BASE would let a universal
    model be "selected across all six datasets" while its structural
    schema was never once fit on this one. musique_clean and squad_clean
    are the track's control datasets: the expected null (structure earns
    nothing at or near ceiling) is evidence only if it is measured, and a
    material regression here would be exactly the kind of universal-schema
    failure M2 exists to catch.
  why_no_other_structural_arms: >-
    Same M0C rule, same evidence: a single family cannot demonstrate value
    on 4 total missing gold instances, 0 of them structurally recoverable.
    Declaring GEOMETRY/SUPPORT/PATH/NODE_ROLE arms individually would spend
    compute reproducing a null M0C already establishes structurally. The
    universal arm is the one structural test that carries information here.
  squad_clean_gets_the_same_treatment: >-
    squad_clean's M1A cell was R1 x {BASE}. In M2 it is R1 x {BASE (reused),
    QLS-UNIVERSAL (new)} for exactly the reason above -- see
    m2_selection_matrix.cells.squad_clean.
  preconditions_to_verify_before_any_launch:
    - musique_clean node embeddings exist at the frozen 1536-dim width M1A asserts at load time.
    - Its candidate contract passes the same BIT_EXACT_FROZEN_CANDIDATE_EQUIVALENCE gate every M1A/M1B result carries.
    - Its A64 admission set was built with the unchanged STRUCTURAL_NEIGHBOUR / graph_expansion_cap=64 construction.
    - none_of_these_are_assumed_here: true

# --------------------------------------------------------------------------
# Instrumentation -- adopted immediately, no gate
# --------------------------------------------------------------------------

instrumentation_requirement:
  status: ADOPTED_IMMEDIATELY
  why_no_gate: >-
    This is a lesson already paid for. M1B's amendment 5 caught mid-flight
    that per-query rows were not being written, forcing a re-run of work
    that had already completed. The requirement below prevents a repeat; it
    costs nothing and gates nothing.
  every_future_fit_must_persist_from_its_first_execution:
    - model_checkpoint
    - per_query_prediction_and_outcome_rows
    - aggregate_metrics
    - query_ids
    - candidate_ids
    - configuration_fingerprint
    - source_commit
    - dataset_fingerprint
    - feature_store_fingerprint
    - train_and_inference_timings
    - peak_memory
    - parameter_count
  applies_to: every_fit_in_m2_and_every_later_development_phase
  also_applies_to_analysis_products: >-
    A classification map, a result map or a selection derivation is
    produced by a committed script, locked by committed tests, and its
    conclusion is written into the phase's declaration -- never delivered
    only in conversation. M1A's unfiled step-6 map is the counterexample;
    see qls_cell.derivation.why_a_committed_script_and_a_map_inside_this_file.

  # --- amendment 2, 2026-09-07: the same requirement, made checkable ---
  exact_fields_every_new_m2_fit_writes:
    - checkpoint                              # torch state_dict, one file per fit
    - per_query_rows                          # one row per held-out query, keyed by query_id
    - query_ids
    - candidate_ids_sha256                    # candidate_contract.candidate_id_order_sha256, the frozen order the rows index
    - aggregate_metrics
    - source_commit
    - config_sha256
    - dataset_fingerprint_sha256
    - candidate_contract_sha256
    - feature_store_fingerprint_sha256
    - training_seconds
    - feature_build_latency_ms_p50_p95_p99
    - peak_gpu_memory_mb
    - peak_cpu_rss_mb
    - parameter_counts_total_semantic_scorer
  per_query_rows_must_reconstruct_the_aggregate: >-
    The rows are not a summary. Each row carries every field
    run_operator_screen.py::_metric_row produces -- recall@{1,5,20},
    full_coverage@{1,5,20}, mrr, the conditional_* variants, and the
    candidate_ceiling/candidate_available flags -- so re-running
    _aggregate_rows over the stored rows reproduces the stored aggregate
    for R@1, R@5, R@20, MRR and FullCov@20 exactly, not approximately.
  test_requirement: >-
    tests/test_run_m2_qls_v2_freeze.py asserts aggregate_from_rows ==
    stored_aggregate for all five metrics on a real toy run, and asserts
    every field above is present and non-null in each fit's record. This is
    a launch gate (launch_authorization.gates.instrumentation_tests_pass),
    not a follow-up task.
  why_this_became_a_gate: >-
    M1B's amendment 5 discovered mid-flight that per-query rows were not
    being written and had to re-run 27 completed fits to get them -- real,
    avoidable, re-spent compute. Stating the requirement was not enough
    last time; a test that fails the build is.

# --------------------------------------------------------------------------
# Compute -- filed from real measurements, amendment 2, 2026-09-07
# --------------------------------------------------------------------------

compute:
  status: FILED_2026_09_07
  script: scripts/m2_compute_estimate.py
  manifest: outputs/m2_qls_v2_freeze/compute_estimate.json
  method: >-
    Every rate is a real measurement from this track, none is a guess.
    Feature build: each (dataset, regime) cell's own M1A headline
    uncached_feature_build_latency_ms times that cell's real validation
    split size -- p50 as the steady-state floor, mean as the conservative
    figure since it includes the first-query JIT outlier. Fits: the slowest
    real seed-0 training_seconds M1A recorded on that same cell, whatever
    the arm (M1A's own data shows fit time is width-insensitive, e.g.
    hotpotqa_clean/R3 BASE 121.8s vs BASE+PATH 119.8s, so the cell's
    slowest arm is the conservative bracket for the 2-columns-wider
    universal arm). musique_clean, which M1A never ran, is the only cell
    without a direct measurement: its feature build is M0C's own 100-query
    steady state scaled by 1.3258, the largest M0C->M1A drift measured on
    its twin squad_clean/R1, and its fit uses M1A's filed conservative
    0.0154934 s per train query.
  cells: 14
  logical_fits: 34
  reused_fits: 19
  new_fits: 15
  feature_build_seconds: {floor: 5430.7, conservative: 5781.9}
  new_fits_seconds: {floor: 1112.2, conservative: 1181.1}
  pure_compute_gpu_h: {floor: 1.8175, conservative: 1.9342}
  cost_usd_all_gpu_billed: {floor: 4.07, conservative: 4.33}
  cost_usd_blended_feature_cpu_fit_gpu: 1.75
  wall_clock_hours_with_per_dataset_parallelism: 1.42   # hotpotqa_clean's own serial chain, 85.3 min, dominates
  rate_source: "docs/COMPUTE_LEDGER.md L546-547 -- $2.241/h GPU, $0.634/h CPU, reused verbatim throughout this track"
  proposed_ceiling_usd: 9.00
  ceiling_basis: >-
    2x the $4.33 conservative all-GPU-billed bracket = $8.66, rounded up to
    a stated round figure -- the same convention M1A ($20.00) and M1B
    ($5.00) used, and never below M1B's $5 floor.
  no_large_safety_multiple: >-
    $9.00 is ~2.1x the real conservative estimate, not a disguised larger
    budget. The M1A step-3 lesson (docs/COMPUTE_LEDGER.md's own Stage C
    entry names a 32x ceiling as a MISTAKE) is honoured here.
  dominant_cost_driver: >-
    Feature build, not training: 5781.9s of the 6963.0s conservative total
    is feature construction (83%), and hotpotqa_clean alone is 4111.6s of
    it. That imbalance is exactly what feature_build_compute_check below
    exists to address -- an A10G billed at $2.241/h to run single-threaded
    numpy/numba is the specific waste the user flagged.
  not_costed:
    - "gray-zone 3-seed expansions (only by further amendment, only where a verdict lands inside the -0.50/-0.25pp band)"
    - "the smoke runs (real but tiny; itemised separately from the 15 counted fits, same convention M1B used)"
    - "the reuse audit and the selection report (read-only, local, no Modal compute)"

# --------------------------------------------------------------------------
# Feature-build compute check -- amendment 2, 2026-09-07
# --------------------------------------------------------------------------

feature_build_compute_check:
  status: REQUIRED_BEFORE_LAUNCH
  the_problem_in_numbers: >-
    83% of the estimated GPU-billed seconds (5781.9s of 6963.0s) is
    _cell_master_local -- qls_local_features, the A64 admission and the
    per-family column assembly. All of it is CPU-side numpy/numba: it
    touches no torch tensor, no CUDA kernel, and reads node embeddings only
    as a numpy array that the STRUCTURAL expansion never dereferences.
    hotpotqa_clean alone would hold an A10G for ~68 minutes doing it.
  what_must_be_tested_before_launch: >-
    Whether the immutable per-(dataset, regime) feature store can be built
    on a CPU container, persisted, and then loaded by the GPU trainer, with
    the loaded store bit-exact against what the current single-container
    path builds in memory.
  equivalence_requirement: >-
    CPU-built store == current-path store, element-for-element, under the
    exact dtype and normalisation semantics already in force: the float16
    `local` block byte-identical, candidate_ptr and query_position
    identical, and the derived precomputed_width identical. Not "close",
    not "same metrics after training". A test proving this is the gate; a
    reasoned argument that it must be true is not.
  persistence_format: >-
    The existing on-disk format, not a new one: fixed_structural_features_v1
    (metadata.json + static.npy + local.npy + candidate_ptr.npy +
    query_position.npy), written so that
    mp_retrieval.structural_features.StructuralFeatureStore.load reads it
    back unchanged. context_feature_store already constructs exactly this
    object in memory; persistence writes the same arrays out.
  adopt_only_if: >-
    The split is behaviour-preserving AND is a small orchestration change
    (a persist step, a load step, and a second Modal function shape). If it
    would require substantial changes to the scientific code, the proven
    single-container path is retained and the reason is written into
    launch_authorization.gates.feature_build_equivalence_proved's note --
    a documented decision, not silent abandonment.
  never: >-
    No feature formula, normalisation, dtype or column order changes for
    systems convenience. If making the split cheap would require changing
    what a feature means, the split is refused, not the feature.

# --------------------------------------------------------------------------
# Engineering prerequisites -- what has to exist before execution, and whether
# it does. Amendment 3 (2026-09-07) built the first four; the fifth is still
# open and is its own launch gate.
# --------------------------------------------------------------------------

engineering_prerequisites_before_execution:
  m2_runner: >-
    BUILT 2026-09-07 (amendment 3). scripts/run_m2_qls_v2_freeze.py reads
    m2_selection_matrix above (not M1A's declaration) and reuses
    run_m1a_feature_screen.py's _cell_master_local / _widen_query /
    _arm_store and run_sa_mlp_confirmation.py's _fit / _score_once
    unmodified. It supports BASE, the QLS-CELL incumbent arms, and
    QLS-UNIVERSAL, and fits only the arms the reuse manifest marks new. The
    universal arm is NOT added to M1A's own experiment matrix:
    configs/m1a_feature_screen.yaml stays frozen, and
    tests/test_m2_universal_schema.py already asserts the arm appears in no
    M1A cell.
  why_a_separate_runner: >-
    Same reason M1B got its own: run_m1a_feature_screen.py's run() reads
    its cells from M1A's frozen declaration and hard-fails on seed != 0 at
    the CLI, and its _run_arm discards the per-query rows M2's
    instrumentation requires. Editing it to serve M2 would also break the
    code-identity premise the reuse audit depends on.
  instrumentation: >-
    BUILT 2026-09-07 (amendment 3). Every field in instrumentation_
    requirement.exact_fields_every_new_m2_fit_writes is persisted from the
    first execution, and the runner refuses to record a fit whose stored
    per-query rows do not re-aggregate to the metrics it reports -- the
    check sits in the write path, not only in a test.
  feature_store_persistence: >-
    BUILT 2026-09-07 (amendment 3). Each fit writes its arm store in the
    existing fixed_structural_features_v1 format and each cell writes its
    master block once, so the step-D CPU/GPU split is an orchestration
    change rather than a rewrite. Required by feature_build_compute_check
    above, and separately useful: M1A never persisted its stores, which is
    why every M2 cell has to rebuild features it has already built once
    before.
  modal_launcher: >-
    BUILT 2026-09-07 (amendment 3). scripts/modal_m2_qls_v2_freeze.py,
    registered in scripts/spawn_modal_jobs.py as m2-qls-v2-freeze, with its
    own _jobs builder -- M1A's excludes musique_clean by construction
    (ALL_DATASETS), and M2 needs it. Each dataset's validation split size is
    derived from that dataset's own completed confirmation artifact and
    cross-checked against M1A's declared value wherever one exists, which is
    what makes musique_clean an ordinary row rather than a transcribed
    number. The headline stage re-reads launch_authorization.gates at call
    time and refuses while any is false.
  musique_clean_data_availability: >-
    musique_clean has never run a trained phase on any active workspace, so
    its training-capable slice (nodes.npy, queries_all.npy, and the
    edge_provenance_graphs subtree) is NOT known to be present where the
    job would run. Verified before the launch, per musique_clean_
    reintroduction.preconditions_to_verify_before_any_launch, not assumed.

# --------------------------------------------------------------------------
# Launch: chained, conditional. Gates, not a blanket go-ahead.
# --------------------------------------------------------------------------

launch_authorization:
  status: GATES_OPEN_2026_09_07   # filed with amendment 2; flipped per gate as each is earned
  rule: >-
    The 15 new seed-0 fits (or whatever count the reuse audit leaves) are
    authorised to launch without a further review stop once every gate
    below is TRUE. If any gate is FALSE when checked at launch time,
    execution stops before the full launch and returns for review -- this
    file pre-authorises passing the gates, never working around a failed
    one. The Modal launcher re-reads these gates at call time and refuses
    the headline stage while any is false, the same mechanism
    scripts/modal_m1b_targeted_resolution.py already uses.
  gates:
    amendment_filed: true             # this amendment, 2026-09-07, committed with tests/test_m2_declaration.py green
    selection_rule_frozen: true       # universal_selection_rule above, CLOSED before any outcome and locked by tests
    reuse_audit_passes: true          # scripts/m2_reuse_audit.py, 19/19, bit-exact probe green -- see reuse_audit.result
    instrumentation_tests_pass: true  # aggregate_from_rows == stored_aggregate, all five metrics, plus field presence -- earned 2026-09-07, see amendment 3
    feature_build_equivalence_proved: false  # CPU-built store == current-path store, bit-exact -- or a filed decision to retain the proven path
    compute_within_ceiling: false     # measured cost under compute.proposed_ceiling_usd ($9.00)
    engineering_tests_pass: true      # tests/test_run_m2_qls_v2_freeze.py + tests/test_modal_m2_qls_v2_freeze.py + the full repo suite -- earned 2026-09-07, see amendment 3
    engineering_smoke_passes: false   # smoke_spec below, real, on Modal
    musique_clean_data_verified: false  # its training-capable slice present on the workspace that will run it
  smoke_spec:
    purpose: PIPELINE_VALIDATION_ONLY_NO_SCIENTIFIC_CONCLUSION
    primary:
      dataset: 2wiki_clean
      regime: R2
      arms: [QLS-UNIVERSAL]
      queries: 100        # this track's established diagnostic panel size, m1a_feature_screen.yaml#modal.smoke_queries
      seed: 0
      verifies:
        - fourteen_column_schema
        - node_role_column_present
        - node_role_identically_zero
        - support_and_path_columns_active
        - total_parameters_equal_3585
        - checkpoint_written
        - per_query_rows_written
        - aggregate_reconstructed_from_rows
        - feature_store_fingerprint_recorded
      why_this_cell: >-
        An R1/R2 universal cell is the one that exercises the actually-new
        contract: NODE_ROLE present in the schema but identically zero,
        SUPPORT and PATH live, 14 columns, 3,585 parameters. 2wiki_clean/R2
        rather than hotpotqa_clean/R2 because its feature build is ~5.8ms
        per query against hotpot's ~85ms -- the same validation for a
        fraction of the billed time, and the smoke is not the place to pay
        hotpot's cost.
    secondary_only_if_needed:
      dataset: 2wiki_clean
      regime: R3
      arms: [QLS-UNIVERSAL]
      queries: 100
      condition: >-
        Run only if the R2 smoke does not already establish that the
        NODE_ROLE column is nonzero exactly on C3 \ Cq -- which it cannot,
        since that column is zero by construction under R2. Treated as
        expected-to-be-needed, kept minimal, and still pipeline validation
        only.
      verifies: [node_role_nonzero_exactly_on_c3_minus_cq]
    no_scientific_interpretation: >-
      No smoke result feeds scientific_questions, qls_cell,
      universal_selection_rule, or any reported metric. Its only job is
      proving the pipeline runs end to end on real Modal hardware.
  after_gates_pass: >-
    Launch the remaining new seed-0 fits automatically, one spawned call
    per dataset (the RESUME_GRANULARITY convention every launcher in this
    track uses), then produce m2_output below and stop.

# --------------------------------------------------------------------------
# What M2 produces
# --------------------------------------------------------------------------

m2_output:
  script: scripts/m2_selection_report.py
  artifact: outputs/m2_qls_v2_freeze/selection_report.json
  tests: tests/test_m2_selection_report.py
  contents:
    - qls_cell_incumbent_map                      # already derived; carried into the report unchanged
    - qls_universal_six_dataset_dataset_balanced_evaluation
    - per_cell_deltas                             # cell_delta for all 14 cells, with the reference each used
    - per_dataset_deltas                          # dataset_delta for all six
    - macro_delta
    - secondary_diagnostics_table                 # R@1, R@20, MRR, FullCov@20 at every level
    - systems_and_parameter_table                 # params, train seconds, feature-build p50/p95/p99, peak VRAM/RSS
    - verdict                                     # universal_selection_rule applied mechanically
  applied_mechanically: >-
    The verdict is computed by the script from the three frozen clauses,
    and its conclusion is written back into this file -- never delivered
    only in conversation (instrumentation_requirement.also_applies_to_
    analysis_products).
  qls_universal_is_not_modified_after_seeing_this: >-
    Restated because it is the failure this whole ordering exists to
    prevent. Whatever the report says, the candidate specification stays as
    declared.

# --------------------------------------------------------------------------
# Standing prohibitions -- restated, unchanged in force
# --------------------------------------------------------------------------

standing_prohibitions_restated:
  - no_five_seed_confirmation_anywhere_in_development
  - no_package_f
  - no_e2_resume
  - no_a64_changes
  - no_new_feature_families_beyond_this_file's_schema
  - no_h2_h3
  - no_r3_full_reexpansion_training
  - no_qls_tuning_against_gnn_results
  - no_substrate_switch_to_canonical_crag_before_LEGACY_DEVELOPMENT_FREEZE
  - no_current_substrate_result_described_as_final
  - no_m2b_semantic_minimality_until_m2_has_selected_and_frozen_the_structural_universal_candidate
  - no_extra_seeds_beyond_seed_zero_without_a_further_amendment
reversal_note: >-
  The course decision does reverse two long-standing prohibitions, but only
  in later, separately-declared phases: GNN work (development-scale,
  validation-only, never tuned against QLS outcomes) and musique_clean's
  reintroduction. musique_clean's return is scoped by this file.
  GNN work is NOT authorised by this file in any form.

# --------------------------------------------------------------------------
# After this file
# --------------------------------------------------------------------------

after_this_file:
  next_step: EXECUTE_M2_UNDER_THE_GATES_THEN_STOP_FOR_REVIEW
  superseded_next_step: COMPUTE_ESTIMATE_THEN_STOP   # amendment 1's; the estimate is now filed (compute above)
  execution_order:
    A: file_this_launch_amendment                    # this block
    B: mechanical_reuse_audit                        # scripts/m2_reuse_audit.py
    C: m2_runner_with_instrumentation_and_persistence
    D: cpu_vs_current_feature_build_equivalence_probe
    E: real_smoke                                    # launch_authorization.smoke_spec
    F: launch_the_remaining_new_seed_zero_fits       # only with every gate true
    G: universal_selection_report                    # m2_output
    H: STOP_FOR_REVIEW
  what_stops: >-
    Everything past the M2 universal-selection verdict. No M2B semantic
    minimality, no GNN code of any kind, no extra seeds, no new feature
    families, no canonical CRAG, no Package F, no E2 resume -- none of them
    runs on the strength of this filing or of M2's result, and each needs
    its own separate dated declaration first. Within M2, nothing spends
    compute until every launch_authorization gate is true; a false gate
    stops execution and returns for review rather than being worked around.
  to_proceed_requires: >-
    For M2's own launch: every gate in launch_authorization TRUE, which
    this amendment pre-authorises earning but not bypassing. For anything
    beyond M2's scope -- including M2B, which is explicitly not opened by
    this amendment -- that phase's own separate declaration file, filed and
    reviewed first, per the one-file-per-phase pacing the user settled on
    2026-09-07.
  phases_that_follow_each_in_their_own_file:
    1: semantic_minimality            # S2 vs S3 vs the historical ~98K projection, around this file's frozen structure
    2: independent_gnn_development    # small validation-only screen, never tuned against QLS outcomes
    3: development_qls_vs_gnn_comparison
    4: minimality_certificate         # remove-one-at-a-time over this file's 14-column schema
    5: LEGACY_DEVELOPMENT_FREEZE      # then, and only then, canonical CRAG migration
