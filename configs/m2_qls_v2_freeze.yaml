# After this file
# --------------------------------------------------------------------------

after_this_file:
  next_step: COMPUTE_ESTIMATE_THEN_STOP
  what_stops: >-
    Everything that spends compute. No musique_clean fit, no QLS-UNIVERSAL
    fit, no GNN code, and no opening of the next phase's declaration runs on
    the strength of this filing. The QLS-CELL derivation that this file
    authorises has already run; its script, its tests and its map (in this
    file) are what get committed. The compute estimate amendment 1
    authorises is arithmetic over already-measured rates and spends nothing.
  to_proceed_requires: >-
    A further amendment to this file authorising the launch of the 15 new
    fits, filed only after the compute estimate and the reuse audit exist
    -- the same estimate -> smoke -> launch gate ordering M1A used for its
    steps 3/4/5 -- or, for anything beyond M2's own scope, that phase's own
    separate declaration file.
  phases_that_follow_each_in_their_own_file:
    1: semantic_minimality            # S2 vs S3 vs the historical ~98K projection, around this file's frozen structure
    2: independent_gnn_development    # small validation-only screen, never tuned against QLS outcomes
    3: development_qls_vs_gnn_comparison
    4: minimality_certificate         # remove-one-at-a-time over this file's 14-column schema
    5: LEGACY_DEVELOPMENT_FREEZE      # then, and only then, canonical CRAG migration
