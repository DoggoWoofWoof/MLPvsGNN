# ==========================================================================
# M2B -- SEMANTIC MINIMALITY
#
# One declaration per phase. This file declares M2B and authorises
# declaration and reconnaissance ONLY. No fit is authorised by this file.
#
# Opened by: configs/m2_qls_v2_freeze.yaml#selected (M2_QLS_UNIVERSAL_SELECTED)
# ==========================================================================

substrate_scope: >-
  Development / method-selection substrate only: squad_clean, 2wiki_clean,
  hotpotqa_clean, metaqa, webqsp, musique_clean. Canonical CRAG data remains
  reserved for final confirmation after LEGACY_DEVELOPMENT_FREEZE and is not
  read by this phase. Nothing decided here is a confirmation of anything; M2B
  selects a representation, and later phases test it.

amendments:
  - date: 2026-09-07
    change: >-
      M2B IS DECLARED, AND RECONNAISSANCE IS COMPLETE. Filed together because
      the user authorised declaration and reconnaissance in one turn and
      neither is a fit. (1) THE CANDIDATES WERE INSTANTIATED, NOT QUOTED.
      scripts/m2b_semantic_audit.py builds a real M1AScorer for each of S2, S3
      and S4 at the frozen 1536 width and counts parameters with numel(), and
      the count it reports for S3 reproduces the 3,585 that 15 completed M2
      fits ran under, which is what makes its other two numbers worth
      believing. (2) THE HISTORICAL PROJECTION NUMBER WAS WRONG FOR THIS
      TRACK, BY EXACTLY A FACTOR OF TWO. qls_v2_semantic.V1_SEMANTIC_PARAMETERS
      is 98,304 and planning prose has repeated it for months. It is
      2 x 768 x 64, a fact about a 768-dimensional payload. Instantiated
      against this track's 1536-dimensional payload the same projection holds
      196,608 semantic parameters, so S4 totals 205,217, not the ~98K a
      transcription would have filed. This rung is therefore labelled
      CURRENT_DIMENSION_PROJECTION_CONTROL and not HISTORICAL_EXACT. (3) THE
      M2 FEATURE STORES ARE REUSABLE, AND THE PROOF IS MECHANICAL.
      scripts/m2b_reuse_and_compute.py calls the real cell_build_key with the
      semantic rung set to S2, S3 and S4 and shows the key is identical in
      every declared regime; the rung is not one of its eight fields. (4) ONE
      OBSTRUCTION EXISTS AND IT IS NOT THE RUNG. That key's eighth field is a
      hash of the whole M2 declaration file, which has changed since the
      stores were built, so load_cell_for_fit would refuse all 14 of them on
      paperwork rather than on features. See feature_store_reuse below for the
      rule that resolves it without weakening the check. (5) NOTHING WAS FIT.
      No container was started, no seed was run, no dataset was read beyond
      already-persisted artifacts.

  - date: 2026-09-07
    change: >-
      LAUNCH AMENDMENT. THE SMOKE AND THE 28-FIT FAN-OUT ARE CONDITIONALLY
      AUTHORISED, GATE BY GATE. Nine things are closed here and none of them
      touches the 42-logical-fit scientific matrix, which is unchanged. (1)
      FEATURE-STORE REUSE NO LONGER RESTS ON A PINNED HASH. Amendment 1
      resolved the config_sha256 drift by passing the recorded build-time
      value, which works exactly once: M3, M4 and the canonical migration each
      amend a declaration too, and each would face the same refusal and be
      tempted to pin again until the identity check certified nothing. A
      feature store's scientific identity is not the identity of an entire
      mutable phase-declaration file. scripts/feature_build_contract.py
      defines feature_build_contract_sha256 over the 23 inputs that can change
      a cell tensor and excludes the 12 that cannot -- authorisation, seeds,
      optimiser settings, compute ceilings, selection wording, and the
      semantic rung itself. Both hashes are kept: the original config_sha256
      travels as provenance and is never rewritten. See feature_store_reuse
      below. (2) S3 REUSE IS PROVED AGAINST THE INJECTION, NOT ASSUMED.
      M1AScorer gained an optional semantic_head for this phase, so the S3
      model current code builds must be shown to be the same function as the
      one M2's 14 fits ran. scripts/m2b_s3_reuse_proof.py builds S3 from the
      pre-injection source at eae453a and from current code, and requires
      state-dict compatibility and bit-level forward equality on a probe;
      verdict S3_REUSE_PERMITTED. Had it failed, those 14 fits would have been
      recalculated rather than reused. (3) THE FORMULAS ARE FROZEN, NOT THE
      COLUMN COUNTS. 258 is 4 x 64 + 2 and nobody should have to reverse it
      out of the number. semantic_formulas below carries the actual expression
      producing every output block of every rung, each re-implemented a second
      time from its own formula text and required to reproduce the live module
      within 1e-05 on a probe. (4) LATENCY IS MEASURED OVER THE WHOLE STACK.
      A benchmark starting from an already-computed semantic tensor would
      charge S4 nothing for the two 1536x64 projections that are the entire
      thing under test, and a projection control that costs nothing would win
      every tie-break it entered. See inference_timing. (5) THE TIE-BREAK
      AGGREGATIONS ARE FILED BEFORE THE NUMBERS. "Lower uncached inference
      p95" over 14 cells is not yet one number; selection_rule now says how it
      becomes one. (6) THE RULE-APPLYING SCRIPT IS COMMITTED BEFORE ANY M2B
      NUMBER EXISTS, as M2 did at eae453a: scripts/m2b_selection_report.py,
      44 tests, one per clause and per refusal. (7) A PAIRED BOOTSTRAP IS
      ADDED AS A DIAGNOSTIC AND ONLY AS A DIAGNOSTIC. M2B runs one seed, so it
      cannot speak to seed stability and says so in a field. It exists because
      webqsp holds out 63 queries where one query moves recall by 1.587pp
      against a 0.50pp tolerance, and because M2 already saw that dataset
      supply +9.881pp of a +1.776pp macro. It is not an advancement condition
      and the selection rule is not amended to make it one. (8) THE
      ORCHESTRATION IS SIX CONTAINERS, NOT 28 AND NOT 12. One job per dataset,
      every cell and every rung of that dataset inside it, still producing 28
      independently checkpointed and result-addressable fits. A p95 is a
      property of the machine that measured it, so comparing p95 across
      containers would compare containers. (9) THE CEILING IS NOT FINAL. The
      2.5x S4 fit multiplier is still an argument. The smoke measures it, and
      only then is the ceiling refiled.

status: DECLARED_LAUNCH_CONDITIONALLY_AUTHORISED

this_file_authorises: >-
  As amended 2026-09-07: the smoke cell, and then the 28-fit fan-out, each
  conditional on the gates in launch_authorization being true when the
  launcher re-reads them at call time. Also everything the first amendment
  authorised -- reading M2's persisted artifacts, instantiating candidates on
  CPU, and computing the proofs and estimates listed in m2b_output. The
  authorisation is to PASS the gates, never to work around one that is false.

does_not_authorise: >-
  Any fit outside the 42-cell matrix declared here, or any arm other than the
  frozen QLS-UNIVERSAL. Modifying the QLS structural schema. Opening M3.
  Training a GNN of any kind. Adding any seed beyond 0, including the 3-seed
  resolution this file allows to be PROPOSED. Reading canonical CRAG data.
  Using Package F. Resuming E2. Exceeding the compute ceiling in force.
  Launching the fan-out while any gate is false, including on the strength of
  a smoke that has run but not been verified.

# --------------------------------------------------------------------------
# The question
# --------------------------------------------------------------------------

scientific_question: >-
  With the M2 structural representation frozen, what is the minimum semantic
  representation that remains Pareto-admissible across all six development
  datasets?

why_it_is_worth_asking: >-
  M2 froze a 14-column schema of which 5 columns and 3,072 of 3,585 trainable
  parameters are semantic. The semantic block is therefore 86% of the model's
  parameters and the structural claim this track exists to make is about the
  other 14%. If S2 -- which learns no semantic parameter at all -- is
  admissible, the publication model drops to 449 parameters and the structural
  claim gets sharper. If it is not, the S3 columns are earning their place and
  that is worth being able to say with a filed number rather than an
  assumption.

what_is_frozen: >-
  Everything except the semantic representation, exactly as
  configs/m2_qls_v2_freeze.yaml#qls_universal froze it. The list is
  frozen_structural_schema below, transcribed from that file's own
  selected.frozen_for_m2b and checked against it by
  tests/test_m2b_declaration.py.

frozen_structural_schema:
  - R1/R2/R3
  - A64
  - scored_and_context_sets
  - retrieval_prior
  - seed_identity
  - NODE_ROLE
  - SUPPORT
  - PATH
  - candidate_normalization
  - loss
  - optimizer
  - training_hyperparameters

only_semantic_representation_may_vary: >-
  Feature selection is NOT reopened here. M2 answered that question, and
  reopening it would make M2's verdict retroactively conditional on a later
  phase. The structural schema above is frozen for the whole of M2B; the
  semantic branch is the only thing that differs between the three
  candidates, and it is the only thing this phase is allowed to change.

# --------------------------------------------------------------------------
# The candidates -- counted from live modules, never transcribed
# --------------------------------------------------------------------------

semantic_candidates:
  audited_by: scripts/m2b_semantic_audit.py
  artifact: outputs/m2b_semantic_minimality/semantic_audit.json
  tests: tests/test_m2b_semantic_control.py
  frozen_set: [S2, S3, S4]
  no_other_rung_is_in_scope: >-
    S0 and S1 exist in qls_v2_semantic.RUNG_FEATURES and are deliberately
    excluded: S0 is no semantic signal at all and S1 is a single cosine, and
    neither is a serious candidate for a retrieval model whose whole input is
    a query and a document. The question is minimality among usable
    representations, not the floor of the ladder.

  method: >-
    Every number below was read off an instantiated nn.Module with numel(),
    at the frozen 1536 embedding width, with precomputed_width 9 and M2's own
    dropout and temperature. No parameter count in this file is transcribed
    from prose, from a constant, or from an earlier draft. The audit refuses
    to report anything if its S3 row does not reproduce the 3,585 that M2's
    15 fits actually ran under.

  frozen_embedding_dim: 1536
  precomputed_width: 9
  scorer: nn.Sequential(Linear(width, 32), GELU, Dropout(0.2), Linear(32, 1))
  scorer_parameters_formula: 32 * width + 65

  S2:
    implementation: src/mp_retrieval/qls_v2_semantic.py::SemanticHead(rung=S2, dim=1536)
    description: zero-learned-parameter semantic representation
    columns: [cosine_qd, dot_qd_pct, mean_abs_diff]
    raw_embedding_dimension: 1536
    semantic_output_width: 3
    semantic_trainable_parameters: 0
    scorer_input_width: 12
    scorer_trainable_parameters: 449
    total_trainable_parameters: 449

  S3:
    implementation: src/mp_retrieval/qls_v2_semantic.py::SemanticHead(rung=S3, dim=1536)
    description: the M2 incumbent -- S2's three columns plus two learned 1536-vectors
    columns: [cosine_qd, dot_qd_pct, mean_abs_diff, semantic_product, semantic_difference]
    raw_embedding_dimension: 1536
    semantic_output_width: 5
    semantic_trainable_parameters: 3072
    scorer_input_width: 14
    scorer_trainable_parameters: 513
    total_trainable_parameters: 3585
    reproduces_the_m2_filed_count: true

  S4:
    implementation: src/mp_retrieval/m2b_semantic_control.py::ProjectionSemanticHead(dim=1536)
    description: projection-style control -- two learned 1536->64 projections and their interaction
    columns: 4 blocks of 64 (query_state, node_state, product, absolute difference) plus 2 scalars
    raw_embedding_dimension: 1536
    projection_dim: 64
    semantic_output_width: 258
    semantic_trainable_parameters: 196608
    scorer_input_width: 267
    scorer_trainable_parameters: 8609
    total_trainable_parameters: 205217

    historical_status: CURRENT_DIMENSION_PROJECTION_CONTROL
    not_historical_exact: >-
      qls_v2_semantic.V1_SEMANTIC_PARAMETERS is 98,304, which is 2 x 768 x 64
      and therefore a fact about a 768-dimensional payload. This track's
      payload is 1536-dimensional, so the same projection instantiated here
      holds 196,608 -- exactly twice. Two further things are not historical:
      the input width is the current payload's, and what consumes the columns
      is M2's frozen scorer rather than v1's parameter-matched head. Calling
      this "the v1 model" would be wrong on all three counts. It is a control
      for whether a projection-style semantic branch buys anything over two
      learned vectors, which is M2B's question, not a reconstruction of v1,
      which would answer a different one.
    why_it_is_not_a_rung_in_RUNG_FEATURES: >-
      qls_v2_semantic's rungs form a strictly nested chain and
      tests/test_qls_v2_semantic.py asserts it. A projection block shares no
      column with S2 or S3, so adding it there would break that invariant and
      would assert a monotone relationship that does not exist. It lives in
      its own module instead.

  parameter_ladder:
    S2: 449
    S3: 3585
    S4: 205217
    S4_over_S3: 57.2
    S3_over_S2: 8.0

  how_the_branch_is_swapped: >-
    M1AScorer takes an optional semantic_head. Passing None -- what every
    M1A, M1B and M2 caller does -- builds SemanticHead(rung, dim) exactly as
    before, so no completed fit's construction changes. M2B passes its own
    head. The constructor raises if an injected head's rung disagrees with the
    rung name the model is being recorded under, because a fit filed under the
    wrong rung is unrecoverable after the fact.

# --------------------------------------------------------------------------
# The exact formulas -- filed by amendment 2, because a column count is not a
# specification
# --------------------------------------------------------------------------

semantic_formulas:
  why_this_section_exists: >-
    Amendment 1 filed widths and parameter counts. Those do not say what any
    column contains. 258 in particular is 4 x 64 + 2 and no reader should have
    to reverse-engineer that from the number, nor guess whether the projection
    is normalised, whether it carries a bias, or which of its blocks is
    elementwise. Every formula below is the expression the module evaluates.
  frozen_by: scripts/m2b_semantic_formula_freeze.py
  artifact: outputs/m2b_semantic_minimality/semantic_formula_freeze.json
  verdict: FORMULAS_FROZEN
  how_each_formula_was_checked: >-
    Implemented a second time in the freeze script from the formula text
    written beside it, and required to reproduce the live module within a
    relative 1e-05 on a 17-candidate probe at seed 20260907. The two differ
    only in floating-point association order. A formula that describes the
    module is not the same object as a formula that was transcribed from it.
  frozen_embedding_dim: 1536
  eps: 1.0e-12

  S2:
    module: src/mp_retrieval/qls_v2_semantic.py::SemanticHead(rung='S2')
    learned_parameters: 0
    columns:
      - name: cosine_qd
        index: 0
        formula: cos(q, d) = (q / max(||q||_2, eps)) . (d / max(||d||_2, eps))
      - name: dot_qd_pct
        index: 1
        formula: >-
          rank of <q, d> among the candidates of this query, ties taking the
          average of the ordinal ranks they span, divided by (n - 1); exactly
          0.5 when n <= 1
        why_average_ties: >-
          Ordinal ranking resolves ties by position, so permuting the
          candidate list would change the feature. Averaging makes it a
          function of the multiset alone.
      - name: mean_abs_diff
        index: 2
        formula: (1 / dim) * sum_i |d_i - q_i|
    width: 3
    scorer_input_width: 12
    total_trainable_parameters: 449
    the_total_does_not_depend_on_the_embedding_width: >-
      S2 learns no semantic parameter, so 449 is 32 * 12 + 65 whatever the
      payload width is. Verified live at a toy width of 6, where the same 449
      appears. That is a fact about the rung and is the reason the runner's
      declared-count guard is gated on the frozen 1536 and not on whatever
      width a test happens to run at.

  S3:
    module: src/mp_retrieval/qls_v2_semantic.py::SemanticHead(rung='S3')
    description: S2's three columns plus two learned vectors over the payload
    columns:
      - name: cosine_qd
        index: 0
        formula: as S2
      - name: dot_qd_pct
        index: 1
        formula: as S2
      - name: mean_abs_diff
        index: 2
        formula: as S2
      - name: semantic_product
        index: 3
        formula: sum_i w_i * q_i * d_i,  w in R^dim, initialised w_i = 1/dim
        parameters: 1536
        what_it_is: >-
          The diagonal restriction of the bilinear form q^T W d that a rank-64
          projection approximates -- strictly less expressive there.
      - name: semantic_difference
        index: 4
        formula: sum_i v_i * |d_i - q_i|,  v in R^dim, initialised v_i = 0
        parameters: 1536
    width: 5
    scorer_input_width: 14
    total_trainable_parameters: 3585
    initialisation_is_part_of_the_design: >-
      w_i = 1/dim makes semantic_product the mean elementwise product, a
      monotone function of the raw dot already available at S2, and v_i = 0
      makes semantic_difference identically zero. S3 therefore starts as S2
      plus one redundant channel and can only depart from it by learning, so
      an S3-over-S2 gain is attributable to the weights rather than to the
      channels existing.

  S4:
    module: src/mp_retrieval/m2b_semantic_control.py::ProjectionSemanticHead
    projection_dim: 64
    steps:
      - step: 1
        name: query_projection
        formula: g = GELU(W_q q),  W_q in R^{P x dim}, bias=False
        parameters: 98304
        why_no_bias: >-
          operator_models.OperatorModel, where the historical projection
          lives, is bias-free; a bias here would be a quiet 128-parameter
          departure from the thing this controls for.
      - step: 2
        name: candidate_projection
        formula: h = GELU(W_d d),  W_d in R^{P x dim}, bias=False
        parameters: 98304
      - step: 3
        name: normalisation
        formula: >-
          qhat = g / max(||g||_2, 1e-12);  dhat = h / max(||h||_2, 1e-12)
        note: torch.nn.functional.normalize over the last dimension
    output_blocks:
      - {name: query_state, columns: [0, 64], formula: qhat, broadcast over the candidates}
      - {name: node_state, columns: [64, 128], formula: dhat}
      - {name: state_product, columns: [128, 192], formula: qhat * dhat (elementwise)}
      - {name: state_absolute_difference, columns: [192, 256],
         formula: '|qhat - dhat| (elementwise)'}
      - {name: normalized_state_dot, columns: [256, 257], formula: sum_k qhat_k * dhat_k}
      - {name: raw_projection_dot_scaled, columns: [257, 258],
         formula: (sum_k g_k * h_k) / sqrt(P),
         note: the RAW projections, before normalisation}
    width_derivation:
      expression: 4 * P + 2
      blocks: 4
      projection_dim: 64
      scalars: 2
      width: 258
    parameter_derivation:
      expression: 2 * dim * P
      value: 196608
      not_98304: >-
        qls_v2_semantic.V1_SEMANTIC_PARAMETERS is 98,304, which is 2 * 768 * 64
        and therefore a fact about a 768-dimensional payload. The same
        projection on this track's 1536-dimensional payload holds 196,608 --
        exactly twice.
    scorer_input_width: 267
    total_trainable_parameters: 205217

# --------------------------------------------------------------------------
# S3 reuse, proved against the injection -- filed by amendment 2
# --------------------------------------------------------------------------

s3_behaviour_reuse:
  question: >-
    Is an S3 model built by the current code the same function as the S3 model
    that produced M2's 14 reused fits?
  why_it_had_to_be_asked: >-
    M1AScorer gained an optional semantic_head for this phase. Passing None --
    what every M1A, M1B and M2 caller does -- builds SemanticHead(rung, dim)
    exactly as before, but "exactly as before" is a claim about a constructor
    that was edited, and 14 of M2B's 42 cells are reused on the strength of
    it.
  proof: scripts/m2b_s3_reuse_proof.py
  artifact: outputs/m2b_semantic_minimality/s3_reuse_proof.json
  baseline: src/mp_retrieval/m1a_screen.py at eae453a, which predates the injection
  requires:
    - state-dict keys, shapes and dtypes identical between the two constructions
    - a trained M2 checkpoint loads into the current model with strict=True
    - forward outputs bit-identical on a fixed probe
  verdict: S3_REUSE_PERMITTED
  what_a_failure_would_have_meant: >-
    Not a waiver. If state-dict compatibility or forward equality had failed,
    those 14 S3 results would not have been reused and the workload would have
    become 42 new fits, at the cost of recalculating them. A reuse that cannot
    be proved is a fabricated reuse whether or not anyone notices.

# --------------------------------------------------------------------------
# What the latency measurement spans -- filed by amendment 2
# --------------------------------------------------------------------------

inference_timing:
  implementation: src/mp_retrieval/m2b_inference_timing.py
  measured_span: >-
    raw query and candidate embeddings -> the rung's semantic computation ->
    the frozen precomputed structural block -> the scorer -> a score per
    candidate.
  why_the_span_starts_there: >-
    A benchmark that starts from an already-computed semantic tensor and times
    only the scorer compares S2, S3 and S4 on a Linear(W, 32) whose widths
    differ by a factor of twenty, while the thing that actually separates them
    -- S4's two 1536x64 projections -- is never charged for at all. A
    projection control that costs nothing would win every tie-break it
    entered, and the tie-break is what selects among admissible rungs.
  uncached_means: >-
    One query at a time, with nothing carried between queries. The p95 the
    paper reports is the latency of a query nobody has asked before.
  percentiles: nearest-rank on the sorted sample, so every reported percentile was observed
  attribution_note: >-
    semantic_ms and scorer_ms come from a second pass with forward hooks
    attached. The hooks' own synchronisations cost time the clean pass does
    not pay, so those two do not sum to the total and are not a partition of
    it. The tie-break uses the clean total's p95 and nothing else.
  the_tie_break_orders_on: total uncached inference p95
  an_early_measurement_contradicts_the_intuition: >-
    At the real 1536 width over 200 candidates on CPU, S4's semantic branch
    measured CHEAPER than S2's and S3's -- 0.739 ms against 1.055 and 1.410 --
    because two BLAS matmuls beat within_query_percentile's
    argsort/unique/scatter_add chain plus a full-width elementwise mean.
    196,608 parameters do not imply a slower query. Nothing in this phase
    assumes an ordering between the rungs; the ordering is a result the smoke
    measures, which is precisely why the fit multiplier may not be guessed.

# --------------------------------------------------------------------------
# The evaluation matrix -- M2's cells, unchanged
# --------------------------------------------------------------------------

evaluation_matrix:
  cells_are_m2s: >-
    Read from configs/m2_qls_v2_freeze.yaml#m2_selection_matrix.cells, not
    re-derived. M2B changes the semantic rung and nothing about which cells
    exist, so a cell added or dropped here would make the two phases
    incomparable.
  cells:
    squad_clean: [R1]
    musique_clean: [R1]
    2wiki_clean: [R1, R2, R3]
    hotpotqa_clean: [R1, R2, R3]
    metaqa: [R1, R2, R3]
    webqsp: [R1, R2, R3]
  cell_count: 14
  rungs_per_cell: 3
  logical_matrix: 42

workload:
  proof: scripts/m2b_reuse_and_compute.py
  artifact: outputs/m2b_semantic_minimality/reuse_and_compute.json
  reused: 14
  new: 28
  new_by_rung:
    S2: 14
    S4: 14
  reuse_basis: >-
    All 14 M2 QLS-UNIVERSAL fits are seed-0 S3 fits in exactly these cells
    under exactly this schema, so the S3 row of the matrix is already run. The
    ledger derives that by checking each declared cell against the fits M2's
    headline artifacts actually contain, and reports any cell it cannot match
    rather than assuming coverage. Zero cells were unmatched.
  what_is_not_reused: >-
    S3's timings. The systems tie-break orders on uncached inference p95, and
    an S3 latency measured on another day in another container would be a
    measurement of the container. S3 is re-benchmarked for inference alongside
    the new rungs; only its fitted weights and its effectiveness metrics are
    reused.

# --------------------------------------------------------------------------
# Feature-store reuse
# --------------------------------------------------------------------------

feature_store_reuse:
  rule: >-
    M2's feature stores are immutable inputs to M2B. Graph and structural
    features are not rebuilt per semantic rung.

  proof: scripts/m2b_reuse_and_compute.py
  artifact: outputs/m2b_semantic_minimality/reuse_and_compute.json

  why_it_holds_by_construction: >-
    A persisted cell's identity is run_m2_qls_v2_freeze.cell_build_key, whose
    eight fields are dataset, data fingerprint, regime, panel size, per-seed
    cap, neighbour scan cap, A64 mainline family and the declaration hash. The
    semantic rung is not among them. The proof calls that function with the
    rung set to S2, S3 and S4 on an otherwise identical namespace and shows
    the key is byte-identical in every declared regime -- an equality
    demonstrated, not a property asserted.

  what_the_store_actually_holds: >-
    Twelve structural columns -- BASE 4, GEOMETRY 3, SUPPORT 1, PATH 3,
    NODE_ROLE 1 -- of which QLS-UNIVERSAL reads 9; the surplus is the excluded
    GEOMETRY family. No column is semantic. M1AScorer.forward_explicit
    computes the semantic block live, per query, from raw node and query
    embeddings, so there is nothing rung-specific in the store to be stale.

  equality_required_across_rungs_in_a_cell:
    - query_ids
    - scored_candidates
    - context
    - structural_feature_tensor
    - retrieval_features
    - seed
    - NODE_ROLE
    - SUPPORT
    - PATH
    - candidate_normalization
  how_that_equality_is_enforced: >-
    By identity rather than by comparison. All ten come from the one persisted
    store, which the proof above shows is the same object for all three rungs.
    The only thing constructed per rung is the semantic head. A comparison
    would be the weaker guarantee: it could pass on two objects that happened
    to agree.

  the_one_obstruction:
    field: config_sha256
    build_time_value: d9518792075054612f70cd77d710c4af71f70407c287e8b883b87e68b84747a1
    recorded_in: each M2 headline artifact's provenance.config_sha256, identical across all six
    why_it_drifted: >-
      cell_build_key hashes the whole of configs/m2_qls_v2_freeze.yaml, and
      that file has since gained amendment 7 (M2's verdict), the result block,
      amendment 8 and the selected block. The hash moved. No cell changed.
    consequence_if_ignored: >-
      load_cell_for_fit recomputes the key and raises on any differing field,
      so all 14 stores would be refused on a field that describes the
      paperwork rather than the features -- and the obvious workaround, a
      rebuild, would spend the largest line in the budget to reproduce
      byte-identical arrays.
    resolution: FEATURE_BUILD_CONTRACT_SHA256
    superseded_resolution: PIN_TO_RECORDED_BUILD_TIME_HASH
    why_the_pin_was_superseded: >-
      Filed by amendment 1 and replaced by amendment 2 before any store was
      loaded under it. The pin works exactly once. M3, M4 and the canonical
      migration each amend a declaration too, and each would meet the same
      refusal and be tempted to pin again, until the identity check certified
      nothing. An amendment about authorisation or statistics should not be
      able to invalidate an immutable structural feature store, and the fix
      for that is a better identity, not a standing exemption.
    resolution_rule: >-
      A feature store's scientific identity is not the identity of the entire
      mutable phase-declaration file that happened to be in force when it was
      built. scripts/feature_build_contract.py defines
      feature_build_contract_sha256 over exactly the inputs that can change a
      cell tensor -- dataset, data fingerprint, regime, panel size and
      selection, per-seed cap, neighbour scan cap, A64 mainline family,
      candidate contract and candidate id order, context arm, damping, PPR
      iterations, normalisation, builder, formula version, master column
      layout, count, dtype and store format, and the contract version itself.
      Nothing is relaxed: every one of those is compared exactly, so a store
      from the wrong dataset, regime, panel or A64 budget is still refused.
      What is excluded is what cannot move a float in a structural feature
      tensor: config_sha256, source_commit, seed, epochs, learning rate, batch
      size, dropout, temperature, the semantic rung, compute ceilings,
      authorisation and selection wording.
    both_hashes_are_kept: >-
      original_full_config_sha256 travels beside the contract hash as
      provenance and governs nothing. No store's recorded config_sha256 is
      rewritten, and the audit never writes to the volume at all.
    reconstruction_for_the_existing_stores: >-
      The 14 M2 stores predate the contract, so their key is rebuilt from
      their own recorded provenance plus the seven exact cell-identity fields.
      That reconstruction is only trustworthy if it produces what current code
      would build, so tests/test_feature_build_contract.py proves the
      reconstructed key equals the forward key, and pins the behaviour of the
      real _cell_master_local over a deterministic toy cell in R1/R2/R3 so a
      changed formula cannot keep an unchanged version string.
    proof: scripts/m2b_feature_store_identity.py
    artifact: outputs/m2b_semantic_minimality/feature_store_identity.json
    verdict: FEATURE_STORE_REUSE_PERMITTED
    the_data_side_gap_is_closed_in_the_container: >-
      validate_candidate_contract measures the corpus, which lives on the
      Modal volume, so the local audit passes through the hashes the build
      recorded. The runner recomputes the contract in the container from the
      candidate contract it measures there and refuses any store whose
      reconstructed hash differs, so the local audit closes the
      declaration-side gap and the container closes the data-side one.
    what_this_does_not_license: >-
      Reuse across a change that alters the features. If any contract field
      moved, the store would be refused and should be. What this covers is
      exactly one situation: paperwork changed and the tensor did not.

# --------------------------------------------------------------------------
# The selection rule -- frozen before any M2B number exists
# --------------------------------------------------------------------------

selection_rule:
  primary_metric: recall@5
  anchoring: SYMMETRIC_BEST_ANCHORED
  not_incumbent_anchored: >-
    Every threshold below is measured against the best rung in the relevant
    scope, not against S3. S3 gets no privilege for being the incumbent and S2
    gets none for being smaller. If the rule were incumbent-anchored, S3 would
    be admissible by definition and the phase would only be able to reject its
    challengers.

  definitions:
    cell_best: max recall@5 among S2/S3/S4 in cell c
    dataset_score: mean recall@5 of rung r over that dataset's declared regimes
    dataset_best: max dataset_score among S2/S3/S4 for dataset d
    macro_score: equal-weight mean of the six dataset_scores
    macro_best: max macro_score among S2/S3/S4

  effectiveness_admissible_iff:
    macro: macro_score(r) >= macro_best - 0.25pp
    per_dataset: every dataset_score(r, d) >= dataset_best(d) - 0.50pp
    per_cell: every recall@5(r, c) >= cell_best(c) - 0.50pp

  why_all_three_clauses: >-
    The per-dataset clause stops a rung buying one giant gain by sacrificing
    another dataset -- a macro-only rule would admit that trade. The
    equal-weight dataset macro stops the three-regime datasets carrying triple
    the weight of squad_clean and musique_clean, which have one cell each. The
    per-cell clause stops a rung failing badly in one regime and being covered
    by its siblings within the same dataset.

  effectiveness_admissible_iff_pp:   # numeric mirror, filed by amendment 2
    macro: 0.25
    per_dataset: 0.50
    per_cell: 0.50
  why_a_numeric_mirror: >-
    So that nothing has to parse prose to know what the rule says.
    scripts/m2b_selection_report.py reads the tolerance out of the clause text
    above, then refuses to produce a verdict at all if this block disagrees
    with what it parsed. It is a cross-check, not a second authority.

  boundary_handling:
    rule: A_RUNG_EXACTLY_ON_A_TOLERANCE_IS_ADMISSIBLE
    why_it_is_stated: >-
      The clauses are written with >=, so the boundary belongs to the
      admissible side. In binary floating point 0.4975 against a best of 0.50
      lands at -0.2500000000000002 and a strict comparison would refuse it, so
      the report allows 1e-9pp of slack. That is eight orders of magnitude
      below what any declared panel can resolve -- webqsp's 63 queries move
      recall in steps of 1.587pp -- and it is filed here rather than left as
      an implementation detail because which side of a boundary a rung falls
      on can decide the phase.

  systems_ordering_aggregation:   # filed by amendment 2, before any latency exists
    uncached_inference_p95_ms: >-
      Equal-weight mean over the six datasets of that dataset's mean over its
      declared regimes -- the same shape as the effectiveness macro, so the
      four three-regime datasets do not carry triple weight in the tie-break
      either.
    total_trainable_parameters: >-
      Constant per rung by construction. The report refuses if a rung's count
      differs between cells, because a parameter count that moves between
      cells is not one object.
    peak_memory: >-
      Max over all 14 cells, not a mean, because a memory figure is a ceiling
      and a rung that fits everywhere is bounded by its worst cell. Ordered on
      peak VRAM first and peak RSS second: VRAM is the binding constraint on
      the declared A10G, and on a CPU run every VRAM figure is zero so RSS
      decides -- deterministic rather than adaptive.
    why_it_is_filed_here: >-
      "Lower uncached inference p95" over 14 cells is not yet a single number.
      Choosing how to reduce 14 numbers to one after seeing them would be
      choosing the winner.
    the_final_tie_rule_is_unreachable: >-
      Stated rather than left as an unchecked branch: the second ordering key
      is the total parameter count, and 449, 3,585 and 205,217 are distinct by
      construction, so the semantic-width and rung-order tie rule below can
      never fire. It stays filed because a rule that is only unreachable by
      arithmetic should still exist.

  if_none_survives: SEMANTIC_PARETO_CONFLICT
  thresholds_are_not_adjustable: >-
    If no rung satisfies all three clauses the phase reports
    SEMANTIC_PARETO_CONFLICT and stops for review. It does not widen a
    tolerance, drop a clause, or reweight the macro. A threshold moved after
    seeing the numbers it failed is not a threshold.

  if_multiple_survive:
    ordering: LEXICOGRAPHIC_SYSTEMS_PARETO
    keys:
      - 1. lower uncached inference p95
      - 2. fewer total trainable parameters
      - 3. lower peak memory
      - 4. deterministic filed tie rule
    tie_rule: >-
      If all four keys tie exactly, select the rung with the smaller semantic
      output width; if those tie, select the earlier of S2, S3, S4 in that
      order. Filed here, before any number exists, so that a tie is resolved
      by a rule rather than by whichever rung is being argued for at the time.
    why_latency_outranks_parameters: >-
      Parameter count is the headline this track cares about, which is exactly
      why it is not first: ordering on it would let M2B select for its own
      publication story. Latency is the property a reader of the systems table
      can check against their own hardware.

  secondary_diagnostics:
    reported: [recall@1, recall@20, MRR, FullCov@20]
    status: DIAGNOSTIC_ONLY
    cannot_replace_the_primary_metric: >-
      Reported for every cell and every rung, and read only after the
      recall@5 outcome is computed. A secondary metric may explain a result or
      raise a caution for a later phase; it may not overturn the verdict or be
      substituted for recall@5 post-outcome.

seed_policy:
  seed: 0
  count: 1
  five_seed_confirmation: PROHIBITED
  three_seed_resolution: >-
    If selection remains decision-critical within the gray bands above after
    the one-seed result, the smallest sufficient 3-seed resolution may be
    PROPOSED, naming the specific cells it would resolve. It is not launched
    with the one-seed run and is not launched automatically. Five seeds are
    not the fallback and are prohibited throughout development.

uncertainty_diagnostic:      # filed by amendment 2
  status: DIAGNOSTIC_ONLY
  is_not_an_advancement_condition: >-
    M2B advances on selection_rule's three effectiveness clauses and its filed
    systems ordering. No interval computed here can admit or refuse a rung.
    Making one an advancement condition would mean amending the selection rule
    after seeing the numbers it would have decided, which is the thing this
    whole file exists to prevent.
  implementation: scripts/m2b_bootstrap_diagnostic.py
  artifact: outputs/m2b_semantic_minimality/bootstrap_diagnostic.json
  reused_from: scripts/m1b_bootstrap_analysis.py
  parameters_read_from: >-
    configs/m1b_targeted_resolution.yaml#uncertainty_procedure, at run time
    rather than transcribed: 10,000 replicates, 95% percentile interval, RNG
    seed 20260905, a fresh generator per cell so any cell reproduces in
    isolation. A copied 10,000 would be a second authority that could drift.
  design:
    resampling_unit: whole query, with replacement, from the held-out panel
    pairing: >-
      One set of resampled indices per cell, applied to every rung, so a
      replicate compares the rungs on the same drawn queries. Two rungs that
      agree on every query then get an interval of exactly zero, which
      independent resampling could not produce.
    statistic: >-
      The plain paired delta of mean recall@5. M1B's statistic was
      mean_s(delta_seed) over three seeds; with one seed it collapses to this,
      and the collapse is the only change made to the implementation.
  what_it_cannot_measure: >-
    Training-seed stability. M2B runs one seed by declaration, so every
    replicate resamples the same fit's per-query outcomes. A narrow interval
    means the panel would have produced a similar difference had different
    queries been drawn into it; it does not mean a second seed would have
    produced a similar fit. This phase does not pretend otherwise.
  why_it_is_worth_computing_anyway: >-
    webqsp holds out 63 queries and the equal-weight macro gives it the same
    weight as squad_clean's 26,063. One webqsp query moves recall by 1.587pp
    against a 0.50pp per-cell tolerance, so a point estimate there can sit
    anywhere in the decision band for reasons that have nothing to do with the
    semantic rung. M2 already saw that dataset supply +9.881pp of a +1.776pp
    macro. The diagnostic exists to stop a second WebQSP point-estimate
    artefact quietly driving a universal decision.
  what_it_feeds:
    output: a PROPOSAL for the smallest sufficient 3-seed resolution
    criterion: >-
      A cell qualifies only if it is in the selection report's decision band
      -- the selected rung was admitted there by the per-cell tolerance rather
      than by winning the cell -- AND at least one bootstrap interval
      involving the selected rung straddles zero. Both, not either: a wide
      interval in a cell the rung won outright changes nothing, and a tight
      one-signed interval inside the tolerance has already been resolved.
    it_is_not_launched: >-
      seed_policy.three_seed_resolution governs. The resolution is proposed,
      naming its cells, and is not launched by this phase -- not with the
      one-seed run and not by the script that identifies its candidates. It
      needs a further authorisation. Five seeds remain prohibited throughout
      development.
  per_query_outcomes_are_persisted_at_fit_time: >-
    M1B needed amendment 5 because no per-query outcome had been persisted
    anywhere and its bootstrap was not computable after the fact; a rerun to
    obtain them would have been a different fit on different hardware. M2B
    pays that cost up front: every fit records per_query_recall_at_5 and every
    cell records held_out_query_ids once, and a rung whose vector is not the
    panel's length stops the run.

# --------------------------------------------------------------------------
# Instrumentation -- mandatory for every new fit, no recovery reruns
# --------------------------------------------------------------------------

instrumentation_requirement:
  rule: >-
    Every new fit records the full field list below at the time it runs. A
    field missing from a completed fit is not recoverable by a later rerun,
    because the rerun would be a different fit on different hardware; a run
    that cannot record these is not started.
  fields:
    - checkpoint
    - per_query_rows
    - aggregate_metrics_reconstructed_from_rows
    - source_commit
    - config_fingerprint
    - dataset_fingerprint
    - candidate_fingerprint
    - feature_store_fingerprint
    - semantic_rung_fingerprint
    - semantic_parameter_count
    - scorer_parameter_count
    - total_parameter_count
    - train_time_seconds
    - uncached_inference_p50_ms
    - uncached_inference_p95_ms
    - uncached_inference_p99_ms
    - peak_vram_mb
    - peak_rss_mb
  semantic_rung_fingerprint: >-
    New in M2B and the field that makes the phase auditable: a hash over the
    rung name, the implementing module and class, the ordered feature names,
    the embedding width, the projection width where one exists, and the
    semantic parameter count. Two fits that differ only in semantic
    representation are otherwise nearly indistinguishable in their
    provenance, which is precisely the confusion this phase could produce.
  aggregates_are_rebuilt_from_rows: >-
    As in M2. Every stored aggregate is reconstructed from that fit's own
    per-query rows rather than carried from a summary, and the artifact
    records that it was.

# --------------------------------------------------------------------------
# Compute
# --------------------------------------------------------------------------

compute:
  estimate: scripts/m2b_reuse_and_compute.py
  artifact: outputs/m2b_semantic_minimality/reuse_and_compute.json
  rate_source: docs/COMPUTE_LEDGER.md L546-547 -- $2.241/h GPU, $0.634/h CPU, reused verbatim
  status: CEILING_REFILED_AGAINST_THE_MEASURED_S4_FIT

  feature_store_build:
    new_builds: 0
    cost_usd: 0.0
    cost_avoided_usd: 3.5992
    why_zero: >-
      All 14 stores exist and are provably rung-independent. M2's own estimate
      put feature build at 5,431-5,782 s and called it 83% of that phase; M2B
      does not spend it again. This is the largest line in the estimate and it
      is zero because of a proof, not an assumption.

  s2_fits:
    new_fits: 14
    seconds: {floor: 1112.0, conservative: 1112.0}
    cost_usd: {floor: 0.6922, conservative: 0.6922}
    basis: >-
      Each cell's own measured M2 S3 training_seconds, unscaled. S2 runs the
      same per-query loop over the same candidates and does strictly less
      arithmetic inside it, so it cannot be slower for a compute reason; it is
      floored at parity rather than estimated below it.

  s4_fits:
    new_fits: 14
    seconds: {floor: 1112.0, conservative: 2780.0}
    cost_usd: {floor: 0.6922, conservative: 1.7306}
    basis: >-
      The same measured seconds, scaled by 2.5 for the conservative bound. S4
      replaces three reductions with two 1536x64 projections -- about 64x the
      arithmetic per candidate -- and widens the scorer's first layer from 14
      to 267 columns. Neither is likely to appear at 64x in wall clock,
      because at this scale the fits are dominated by per-query kernel-launch
      overhead in M1AScorer's Python loop rather than by the size of each
      kernel. That is an argument, not a measurement, which is why the smoke
      cell measures it before any fan-out. 2.5 is a loose bound to launch
      under, not a prediction.

  inference_benchmarking:
    arms: 42
    includes_the_incumbent: true
    cost_usd: 0.7843

  container_overhead:
    priced_containers: 28
    usd_each: 0.0474
    cost_usd: 1.3272
    source: M2's measured smoke, outputs/m2_qls_v2_freeze/measured_cost.json
    this_is_an_upper_bound: >-
      An upper bound, priced at one container per fit. M2 actually ran one
      container per dataset and did every cell inside it; the same
      orchestration here is 6 datasets x 2 new rungs = 12 containers, less
      than half. The larger number is kept because the estimate should not
      depend on an orchestration choice that has not been made.
    revised_by_amendment_2: >-
      The choice has now been made and it is 6, not 12 and not 28: one
      container per dataset carrying every cell and every rung of that
      dataset. See launch_authorization.orchestration. The 28-container line
      above is left as filed rather than rewritten, because it is the record
      of what was estimated before the decision; the recomputation lives in
      launch_authorization.compute_revision and the ceiling is not refiled
      until the smoke replaces the S4 multiplier.

  storage:
    checkpoint_megabytes_all_cells: {S2: 0.025, S3: 0.201, S4: 11.492}
    total_megabytes: 11.718
    note: >-
      S4's checkpoint is 57x the incumbent's per cell. Still under a megabyte
      each and not worth pricing, but the ratio is the point of the phase and
      is not hidden inside a rounding.

  total_cost_usd: {floor: 3.4959, conservative: 4.5343}   # as filed, on the guessed multiplier
  proposed_ceiling_usd: 6.00                             # superseded by refiled_ceiling_usd below
  ceiling_basis: >-
    The conservative bound plus roughly 32%, which is headroom for the S4 fit
    multiplier being wrong in the expensive direction. Deliberately below M2's
    $9.00 because M2B buys no feature builds and M2 measured $4.3914 with
    them. Not a safety multiple over an unknown -- the dominant unknown is one
    multiplier, and the smoke measures it before anything fans out.
  refiled_ceiling_usd: 3.5732
  refiled_on: 2026-09-07
  refiled_from: outputs/m2b_semantic_minimality/measured_cost.json
  refiled_basis: >-
    The smoke measured the one dominant unknown. S4's fit took 15.338 s
    against M2's 19.117 s for the same cell, so the multiplier is 0.8023 and
    not the 2.5 that was guessed: S4 replaces three full-1536-width reductions
    with two 1536x64 projections, and on this candidate-set size the
    projections are cheaper than what they replace rather than 64x dearer.
    Measured total is {floor: 2.3163, conservative: 2.7003}; the refile
    carries the same 1.3232 margin the original filing carried, clamped at the
    filed ceiling because a ceiling only comes down. Headroom against the
    original filing: $3.2997.
  what_the_measurement_did_not_settle: >-
    The ratio comes from one of the cheapest cells in the matrix, where a fit
    is dominated by per-query kernel-launch overhead rather than by the
    arithmetic S4 adds. A cell with a larger candidate panel could move it
    toward the guess, which is what the 1.5x scale headroom in
    scripts/m2b_measured_cost.py is carried for. It was filed before the
    number was known.
  not_costed:
    - the smoke cell, a subset of the fits above rather than additional to them
    - storage rent on a volume this track already holds
    - any seed beyond 0, which is prohibited without a further authorisation

smoke_before_fanout:
  rule: >-
    Exactly one representative cell is smoked before any fan-out. All three
    rungs run in it, but only S2 and S4 are FITTED: S3 enters the smoke the
    same way it enters the fan-out, by loading the checkpoint M2 paid for.
    Re-training S3 would spend money to re-answer a question with a filed
    answer, and leaving it out entirely would leave the reuse path untested
    until the fan-out, where a failure costs six containers instead of one.
  cell: 2wiki_clean / R3
  why_that_cell: >-
    It exercises a real R3 NODE_ROLE column -- non-constant structural
    admission -- so the smoke tests the branch under the schema's most
    demanding regime rather than under R1, where NODE_ROLE is identically
    zero and a broken structural path could pass unnoticed. It is also the
    cell M2 smoked, so its build is warm and its numbers are comparable, and
    it is one of the cheapest cells in the matrix at about 19 s of training.
  panel: the full declared validation panel for the cell, not a 100-query diagnostic
  why_the_full_panel: >-
    The smoke's job is to measure the S4 fit time that replaces the 2.5
    multiplier. A fit over 100 queries would measure a different fit, and the
    number it produced would not be the one the ceiling is recomputed from.
    This is a real cell of the matrix, run once, and its numbers are the
    matrix's.
  seed: 0
  rungs: [S2, S3, S4]
  which_of_those_are_fitted: >-
    S2 and S4. S3 is loaded from M2's checkpoint by the runner, which selects
    the reused path on rung identity and refuses outright when no fits root is
    given rather than silently refitting -- a fresh fit reported in a column
    the declaration calls reused would be a fabricated reuse.
  why_s3_is_in_the_smoke_at_all: >-
    s3_behaviour_reuse proved state-dict compatibility and forward equality
    offline, against local checkpoints. It did not prove that the reuse path
    works in the container, on the volume, against the sealed M2 tree, which
    is the arrangement all fourteen reused cells will run under. The smoke
    costs one extra inference pass to establish that, and no training. It
    also makes the smoke's controlled comparison the same three-way
    comparison the fan-out will produce, rather than a two-way rehearsal of
    it.
  what_it_does_not_do: >-
    It does not add a fit to the workload. The matrix is unchanged at 42
    logical, 14 reused, 28 new. S3 here is a re-benchmark of an existing fit,
    which is exactly what the fourteen reused cells are.
  what_the_smoke_must_establish:
    - both heads instantiate at the frozen 1536 width and produce the declared column counts
    - >-
      the persisted M2 store loads under its reconstructed
      feature_build_contract_sha256, with the seven cell-identity fields
      compared exactly, and no cell master is rebuilt
    - >-
      every rung in this cell records byte-identical shared inputs: the same
      query ids, the same scored candidates, the same context, the same
      structural feature fingerprint, the same NODE_ROLE, SUPPORT and PATH
      values and the same candidate normalization, with only the semantic
      rung differing -- enforced by one store handed to every rung, and
      checked by comparing their shared_inputs digests afterwards
    - S2 reports semantic parameters 0 and 449 total, with 3 semantic columns
    - S4 reports semantic parameters 196,608 and 205,217 total, with 258 semantic columns
    - a checkpoint is written and reloads into the same model with strict=True
    - per-query rows are written and the aggregate rebuilt from them matches exactly
    - >-
      every training-epoch loss is finite for the rungs that trained, and no
      held-out score is NaN or Inf for any rung including the reused one
    - every instrumentation field above is populated and non-null
    - full uncached inference p50, p95 and p99 over the whole model stack, and peak VRAM
    - the measured S4 fit time, which replaces the 2.5 multiplier with a number
    - >-
      S3 is loaded rather than refitted -- its recorded training time is
      exactly zero and its checkpoint is M2's -- so the reuse path the
      fourteen reused cells depend on is exercised in the container before
      the fan-out rather than during it
  why_nan_checking_is_listed_separately: >-
    Argsorting a vector containing NaN still returns a permutation, so a model
    that emits NaN produces a ranking, and aggregate metrics computed from
    that ranking can look entirely healthy. M2 did not check this. A fit whose
    scores are not finite is refused before it is recorded, not diagnosed
    afterwards from a metric that survived.
  authorisation: >-
    AUTHORISED BY AMENDMENT 2, conditional on the six precursor gates in
    launch_authorization being true when the launcher re-reads them. The smoke
    is not gated on the gates it exists to earn -- that would make it unable
    to run first -- and it does not authorise the fan-out, which has its own
    gates.

# --------------------------------------------------------------------------
# Launch authorization -- filed by amendment 2, 2026-09-07
# --------------------------------------------------------------------------

launch_authorization:
  status: GATES_OPEN_2026_09_07
  rule: >-
    The smoke cell, and then the 28 new fits, are authorised to launch once
    the gates below are true. scripts/modal_m2b_semantic_minimality.py
    re-reads this block at call time -- not at deploy time, because the
    amendment is filed between the app being deployed and a job being spawned
    -- and refuses the stage while any gate it checks is false. This file
    pre-authorises PASSING a gate. It never authorises working around one.
  gates:
    amendment_filed: true                  # this amendment, 2026-09-07, with tests/test_m2b_declaration.py green
    selection_rule_frozen: true            # scripts/m2b_selection_report.py, committed before any M2B number existed
    feature_store_reuse_proved: true       # FEATURE_STORE_REUSE_PERMITTED, outputs/m2b_semantic_minimality/feature_store_identity.json
    s3_behaviour_reuse_proved: true        # S3_REUSE_PERMITTED, outputs/m2b_semantic_minimality/s3_reuse_proof.json
    semantic_formulas_frozen: true         # FORMULAS_FROZEN, outputs/m2b_semantic_minimality/semantic_formula_freeze.json
    instrumentation_tests_pass: true       # tests/test_run_m2b_semantic_minimality.py + tests/test_modal_m2b_semantic_minimality.py
    uncertainty_diagnostic_committed: true # scripts/m2b_bootstrap_diagnostic.py, filed before any interval existed
    engineering_smoke_passes: true         # earned 2026-09-07: 12/12 in outputs/m2b_semantic_minimality/smoke_verification.json
    parameter_accounting_matches: true     # earned by the same artifact: 0/449 and 196,608/205,217 observed, 3 and 258 columns, at the frozen 1536 width
    measured_cost_within_ceiling: true     # earned 2026-09-07: WITHIN_FILED_CEILING, conservative $2.7003 vs filed $6.00, refiled to $3.5732
  which_gates_the_smoke_is_held_to: >-
    The first six only. The smoke exists to earn the last three, so gating it
    on them would make it unable to run first. The fan-out is held to all ten.
  a_smoke_that_ran_is_not_a_smoke_that_passed: >-
    engineering_smoke_passes is flipped by a verification artifact against
    smoke_before_fanout.what_the_smoke_must_establish, item by item, not by
    the job exiting zero.

  orchestration:
    shape: ONE_CONTAINER_PER_DATASET
    containers: 6
    not_28: >-
      28 separate GPU containers would pay 28 startups, 28 image pulls and 28
      volume mounts to run fits that take tens of seconds each, and would
      reload the same cell master up to three times for the three rungs that
      share it.
    not_12: >-
      Six datasets x two new rungs would split a cell's rungs across
      containers, which is the one split that matters here.
    why_the_split_matters: >-
      The systems tie-break orders on uncached inference p95, and a latency is
      a property of the machine that measured it. Comparing S2's p95 from one
      container against S4's from another compares containers. Running every
      rung of every cell of a dataset on one machine makes the comparison a
      comparison of rungs.
    it_also_makes_the_shared_store_structural: >-
      One container builds or loads a cell's store once and hands the same
      object to all three rungs, so "only the semantic rung differs" is true
      by construction rather than by a comparison that could pass on two
      objects that happened to agree.
    every_fit_stays_addressable: >-
      Sharing a container is not sharing a result. Each fit writes its own
      checkpoint, its own per-query rows and its own fit.json under
      <artifact_root>/<regime>/<rung>/, so 28 fits in 6 containers are 28
      results and not 6. Resume granularity is the dataset.
    execution_placement: INHERITED_FROM_M2
    why_placement_is_inherited: >-
      M2B declares no placement map of its own and the launcher falls back to
      configs/m2_qls_v2_freeze.yaml#launch_authorization.execution_placement.
      M2B reads M2's stores, and a Modal volume lives in exactly one
      workspace, so the dataset must run where its store already is. Copying
      the map here would create a second authority that could drift from the
      one that actually holds the data.

  compute_revision:
    what_changed: the container count only, from the orchestration decision above
    container_overhead_usd: {before: 1.3272, after: 0.2844}
    containers: {before: 28, after: 6}
    usd_each: 0.0474
    total_cost_usd: {floor: 2.4531, conservative: 3.4915}
    fit_lines_are_unchanged: >-
      The S2 line, the S4 line, the inference line and the zero feature-build
      line are exactly as amendment 1 filed them. Nothing here is a new
      measurement.
    the_ceiling_is_not_refiled_here: >-
      The dominant unknown is still the 2.5x S4 fit multiplier, which is an
      argument and not a measurement. The $6.00 ceiling stands as filed until
      the smoke measures that multiplier; then the estimate is recomputed from
      the measured value and the ceiling is refiled against it. Lowering a
      ceiling on the strength of an orchestration choice, before the
      measurement that motivated the smoke, would be spending the smoke's
      answer before hearing it.

  after_the_smoke:
    - recompute the S2 and S4 fit lines from the measured seconds, not the multiplier
    - refile the ceiling against the recomputed total
    - flip measured_cost_within_ceiling only if the projection is at or under it
    - if the projection exceeds the ceiling, stop for review rather than raise it

# --------------------------------------------------------------------------
# Output and stop
# --------------------------------------------------------------------------

m2b_output:
  contents:
    - semantic_candidate_parameter_accounting
    - feature_store_reuse_proof
    - workload_ledger
    - compute_estimate
  artifacts:
    - outputs/m2b_semantic_minimality/semantic_audit.json
    - outputs/m2b_semantic_minimality/reuse_and_compute.json

stop_condition:
  status: STOP_FOR_REVIEW
  reached_when: >-
    Amendment 1's stop is reached and superseded. The declaration, the live
    implementation audit, the parameter accounting, the exact workload, the
    reuse plan and the compute estimate were all filed, and the review they
    stopped for produced amendment 2. The stop that is in force now is the one
    below.
  the_stop_now_in_force: >-
    After the M2B semantic-rung verdict. The phase runs the smoke, verifies
    it, refiles the ceiling, runs the 28-fit fan-out, applies the committed
    selection rule and files the verdict -- and then stops.
  what_happens_next: >-
    Nothing. Not M3. Not a GNN of any kind. Not a seed beyond 0, including the
    3-seed resolution this file allows to be PROPOSED and does not launch. Not
    canonical CRAG. A further dated amendment is required, after a review of
    the verdict.

standing_prohibitions_restated:
  - no_five_seed_confirmation_anywhere_in_development
  - no_package_f
  - no_e2_resume
  - no_a64_changes
  - no_structural_schema_changes_in_this_phase
  - no_gnn_training
  - no_m3
  - no_canonical_crag_read

reversal_note: >-
  If M2B returns SEMANTIC_PARETO_CONFLICT, or if a reviewer rejects the
  candidate set, the frozen object remains M2's: QLS-UNIVERSAL at S3, 3,585
  parameters, exactly as configs/m2_qls_v2_freeze.yaml#selected records it.
  M2B can only narrow the semantic representation or fail to; it cannot
  invalidate M2, because it changes nothing M2 measured.

after_this_file: >-
  As amended 2026-09-07: the smoke, its verification, the refiled ceiling, the
  fan-out, the committed rule's verdict, and then STOP_FOR_REVIEW. Not M3, not
  a GNN, not a seed beyond 0, and not canonical CRAG.
