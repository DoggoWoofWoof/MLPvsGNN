    UNIVERSAL_V2_CORE_CONTRACT, contract_frozen_2026_09_19, 129 columns, core sha256
    8d1da88b14dfdee13dd32ee6a05f6d9733d14a9899d5e011c41b0cce53000bf9; parameters 420,932 (GNN) and 330,955 (twin),
