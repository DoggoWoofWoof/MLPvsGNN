probe:
  batches: >-
    the first 16 batches of the frozen stage-2 draw for seed 0, exactly as mp_retrieval.m3b_train.fit_model draws them:
    numpy default_rng(0) draws one permutation of each fit carve's trainable queries in sorted dataset order, then
    draw_indices draws each batch (batch 16, dataset_draw per_query). These are the batches
    u_gnn_v2_ef__H128__six__s0 trained on at steps 1-16 (its record: no warm start, no batch skipped): 256 query
    draws, every one from a fit carve -- 2wiki 46, hotpotqa 43, metaqa 35, musique 52, squad 40, webqsp 40 (counted at
    declaration by replaying the draw over the carves' gold pointers; no model was run and no batch was packed).
  why_not_one_whole_carve: >-
    compute_placement said "one fit carve". No single carve exercises both paths of the selected GNN (typed relations
    with evidence flow on metaqa and webqsp; untyped passage graphs elsewhere). Packing a whole carve on the host would
    also need its data mirrored first (metaqa's fit cache alone is 4.7 GB, over an hour of upload at the measured
    1.2 MB/s, before its stores and served files), which would test the mirror and the device at once. The probe separates them: the device
    sees batches packed on the laptop, and the mirror has its own check (mirror_verification). The first stage-2
    batches are fit-carve queries of all six datasets, mixed exactly as training packs them. The tolerance is inherited
    unchanged.
  packing: >-
    on the laptop, by the frozen code -- scripts/universal_v2_six.open_six (fit kind), CarveDataV2.pack,
    pack_queries_v2 -- which refuses any cache that is not the filed carve
  fit_carves_sha256:   # carve_sha256_declared in outputs/universal_v2/cache/<name>/fit/meta.json = the stage-2 training carves
    2wiki: fd6ae7c1baaed8519db1f9f3019b6ab7e2984b503cac4381ec260517653b93f3
    hotpotqa: 2b94ca1c438d6c58bc2436b409a44328bc56a911138dece6116a9e423b31223c
    metaqa: 161a00b2fe086d6d40d2caa8da4a8ba9f1fabe59da6996203d54c82cea366188
    musique: 7976539fa1fbf0e132429f9983335b452c8f557b6f5bc13984a71a9c388fdfcf
    squad: 39189e5d42ab75f7d5076fa8f2581be67b5e4885a458b670fac0a3fb4eebf515
    webqsp: b744f21fcccf880290bd87c580052d2ebe0f29f1f4bb3af3bebb636e94d13eaa
  bundle: >-
    outputs/cpu_gpu_equivalence/bundle/: the 16 PackedBatch objects in any lossless encoding (node embeddings may be
    stored once per dataset and gathered by index), the relation bank, the model inputs, and manifest.json with the
    sha256 of every file and of every field of every reconstructed batch (x, qptr, node_query, emb, qemb, seedw,
    seed_nodes, edge_index, edge_attr, gold). Estimated at 0.6-0.8 GB, of which about 0.49 GB is embeddings (counted
    from the pools). Git-ignored, like everything under outputs/.
  size_cap: if the bundle exceeds 1.0 GB, B drops to the largest value >= 8 whose bundle fits; B is filed in the run record before any arm runs, and every tier uses it
  transfer: >-
    rx push with --inputs for the bundle and the six checkpoints with their records; code arrives as the git-tracked
    tree. The push exceeds push.max_mb 512 and is sent with --force: that guard is a convenience, and this push is
    declared here. Nothing else is sent, and no token or credential goes to the host.
  integrity_in_every_arm: >-
    every bundle file and every reconstructed field matches its manifest sha256; every checkpoint and record matches
    object_under_test.models; the bank matches its sha256; frozen_code holds. Any mismatch is a hard stop, never a
    verdict.

tiers:   # one script, one function per tier, identical in every arm; only the device differs
  T1_forward:
    what: >-
      every model in eval() (dropout off) under no_grad, on every probe batch. Per query draw it keeps the centred scores
      s - mean_q(s) as tests/test_m3b_models.py::_centred_scores takes them (a shift shared by a query's candidates
      ranks nothing, and the readout bias's value is rounding noise), and the 14 METRIC_NAMES of rank_metrics on the raw
      scores.
  T2_gradient:
    what: >-
      every model in eval() (dropout off) with gradients on, on every probe batch separately, from the loaded weights:
      loss = listwise_loss(model(batch), batch), then loss.backward(). Nothing is stepped. It keeps the loss and the
      gradient of every parameter tensor.
    why_dropout_off: >-
      each device draws dropout masks from its own generator, so train-mode gradients differ by construction. With
      dropout off the gradient is a deterministic function of the weights and the batch, and that function is what a
      device computes.
  T3_trajectory:   # descriptive; never a gate
    what: >-
      seed 0 of each family, dropout off, a fresh AdamW at the frozen lr 1e-3, weight decay 1e-4 and clip 1.0, taking the
      probe batches as consecutive steps; centred scores on every probe draw after steps 1, 2, 4, 8 and 16
    reads: how fast rounding differences grow along a trajectory, beside the same growth for laptop_cpu_t4 -- context for placement_rules.new_seeds only
  T4_clock:   # systems; never a gate
    what: per probe batch, the forward and the forward+backward wall clock (packing excluded, CUDA synchronised) and peak GPU memory

tolerances:   # filed before any number
  forward_inherited: >-
    per query draw, the arm's centred scores against laptop_cpu_t8 under torch.testing.assert_close(atol=1e-5,
    rtol=1e-5): elementwise |a - b| <= 1e-5 + 1e-5 * |b|, with b the reference. This is configs/universal_v2.yaml's
    "per-query centred scores atol 1e-5" as tests/test_m3b_models.py applies it.
  gradient:   # per batch
    loss: "|L - L_ref| <= 1e-5 * |L_ref| + 1e-6"
    global: "||g - g_ref||_2 <= 1e-4 * ||g_ref||_2, over all parameters"
    per_tensor: "||g_p - g_ref_p||_2 <= 1e-4 * ||g_ref_p||_2 + 1e-6 * ||g_ref||_2 for every parameter tensor p"
    absolute_term: the second term keeps near-null tensors (the readout bias, whose true gradient is zero) from failing on rounding noise
    why_these: >-
      float32 rounding through these models is of order 1e-6 relative, while a mathematical difference (a missing or
      extra term, a different mask, a different op) moves a gradient by 1e-2 or more. 1e-4 sits two orders of magnitude
      from each.
  bit_identical: torch.equal on every centred-score vector, loss and gradient tensor
  every_process: a candidate's first run and its _r2 repeat are both held to the gates
  cell: a check is made per cell -- (model, query draw) for T1; (model, batch, loss | global | tensor p) for T2

readings:   # per candidate, from T1 and T2 against laptop_cpu_t8 over all 6 models and all probe batches
  floor_first: laptop_cpu_t4 goes through the same checks against laptop_cpu_t8 before any candidate is read
  EQUIVALENT_BIT_IDENTICAL: every T1 and T2 value is bit_identical to the reference
  EQUIVALENT_WITHIN_TOLERANCE: not bit-identical, and every cell of forward_inherited and gradient holds
  NOT_EQUIVALENT: >-
    any cell fails that the floor passes. The record names every failing cell and its largest excess over the
    tolerance.
  INCONCLUSIVE_FLOOR: >-
    every failing cell of the candidate also fails for the floor -- the tolerance is tighter than the reference's own
    thread-count reproducibility there, so the failure cannot be attributed to the placement
  exactly_one: per candidate, the first of the four that holds
  reported_beside_never_gating:
    - per model and arm, the largest |centred difference| and the largest ratio |a - b| / (1e-5 + 1e-5 |b|); loss and gradient relative errors (largest and median over batches)
    - decision agreement -- per model, how many query draws differ from the reference in any of the 14 metrics, and the largest |difference| of any metric's probe mean. When forward_inherited holds, each such draw is a near-tie swap between candidates within twice the tolerance
    - determinism -- whether each _r2 run is bit-identical to its first run, and every warning the determinism request raised
    - the T3 divergence curves and the T4 clocks
  wording: >-
    a pass says the placement computes these models' scores and gradients within the filed tolerance on these inputs. It
    never says that a fit on the placement reproduces a laptop fit (placement_rules.new_seeds).

what_a_verdict_opens:
  pass: >-
    EQUIVALENT_BIT_IDENTICAL or EQUIVALENT_WITHIN_TOLERANCE makes the placement NAMEABLE as the compute placement in a
    later dated authorization block of a declared stage. That block quotes the tested settings verbatim (host, env
    name@hash, torch and CUDA versions, the determinism mode that passed, TF32 off, float32, 8 threads for host CPU work)
    and runs mirror_verification first. A verdict opens no stage by itself.
  fail: >-
    NOT_EQUIVALENT or INCONCLUSIVE_FLOOR keeps the placement barred. No tolerance is relaxed and no setting is changed
    under this file; the only routes are a new arm (placement_arms_added_later) or a new declaration.
  placement_arms_added_later: >-
    another placement (Modal, WSL, another GPU, float64, another thread count) is admitted only by running this same
    test -- the same bundle, reference arm, tolerances and readings -- filed as a dated amendment with its own verdict

placement_rules:   # filed now; they bind every stage placed off the laptop
  one_placement_per_comparison: >-
    arms whose numbers a stage compares are fitted and evaluated on one placement, so a device is never a hidden
    difference between an MP arm and a non-MP arm. A cross-placement reading is allowed only if the stage's block names
    it in advance, and then only on seed means (never seed-paired), with each placement named beside its number.
  new_seeds: >-
    a GPU fit is a new draw of the frozen rule (its dropout masks come from the device's generator): it never replaces,
    pairs with, or is averaged as the same seed as a laptop fit with the same seed number. A host CPU fit is treated
    the same way, even after EQUIVALENT_BIT_IDENTICAL, unless a later block declares a replica check and it passes.
  no_regeneration: filed arrays and checkpoints (M2-M3B, universal-v2, UMLP) are never re-produced on another placement to confirm or replace them
  record_the_placement: >-
    every fit and eval record names the host, env name@hash, device and driver, torch and CUDA versions, determinism and
    TF32 flags, and threads. Weights are saved as CPU tensors and pinned by state_sha256.
  passed_settings_only: a mode that did not pass is not used, even when another mode on the same GPU passed
  packing_on_cpu: batches are packed on the host CPU by the frozen code; the device sees only packed tensors
  reference: the laptop CPU stays the reference placement

mirror_verification:   # named here as a prerequisite; each placement block runs it for the datasets it reads; this file does not
  rule: >-
    before a stage reads data on the host, every mirrored input it opens matches the laptop copy byte for byte by
    sha256: v2 caches, CSR stores, relation embeddings, and the served loader files and dense-doc shards. The served
    freeze check of scripts/m3b_compile.open_package passes on the host. The stage's own first 16 batches, packed on the
    host, are field-for-field torch.equal to the same batches packed on the laptop.
  package: >-
    the CRAG package stays read-only on the laptop. A host mirror is written by reading it, lives outside the rx project
    workspace (never inside the repository or its mirror), and reaches the frozen code as a placement-only, in-memory
    substitution of substrate.package_root. No config file is edited.
  sizes_for_planning: >-
    dense-doc shards + CSR stores + v2 fit and select caches: squad 0.25 GB, metaqa 6.0, musique 5.5, webqsp 9.1,
    hotpotqa 16.1, 2wiki 18.8 -- about 56 GB, roughly 13 h at the 2026-09-29 upload rate

device_path:   # the systems code the run adds; no scientific module is edited
  where: >-
    a new module, src/mp_retrieval/device_placement.py, holds fit_model and evaluate_carve copied from the pinned
    mp_retrieval.m3b_train under new names, with an optional device. This is the route m3b_incumbents.must_not
    prescribes ("v2 code imports M3B modules unchanged or copies a function under a v2 name"); m3b_train.py keeps its
    pinned bytes.
  constraints:
    - with device None or "cpu", the copies execute the pinned code path statement for statement
    - the copies call the pinned draw_indices, pack_parts, listwise_loss, macro_recall_at_5, rank_metrics, node_budgeted_batches and BatchPrefetcher by identity; the sampler and the loss are never copied
    - with a device, the model moves once before the optimiser is built, and each batch moves on the main thread after BatchPrefetcher.next(); packing stays on CPU threads
    - checkpoints hold CPU tensors; the CUDA generator state is saved and restored beside the CPU one, so a resumed GPU fit continues as the uninterrupted fit on the same device
    - records gain the placement block of placement_rules.record_the_placement
  tests:
    - on the synthetic world of tests/test_m3b_models.py, the copies with device None and "cpu" give the pinned originals' fits (weights torch.equal; history and record equal apart from wall-clock fields) and evaluations (every metric array equal)
    - on CUDA (skipped where there is none; run on the host in mpr-cu128 under the host_gpu_det settings), a synthetic fit on device "cuda" runs, checkpoints CPU tensors and resumes to the uninterrupted fit -- weights torch.equal when the determinism request raised no warning, otherwise centred scores within tolerances.forward_inherited, with the warning recorded
    - evaluate_carve's copy on CUDA gives, for the same weights, the CPU evaluation's metrics on every synthetic query without a near tie (two candidates whose CPU scores differ by less than twice the forward tolerance); near ties are counted and reported
  gate: the device-path tests pass on the laptop and on the host GPU before any candidate arm runs
  not_runnable: if a frozen model cannot run on a device as written, it is not edited; the run stops for review, naming the op and the model

