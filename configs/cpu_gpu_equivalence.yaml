    u_gnn_v2_ef__H128__six__s1: {weights: aabe9110122b51048d027a8fbeaed2e518beed2edcc677a034ab5594310161cd, record: 7f7df04d771a1d4ed68e936f4e448e801074654627cc4c56b8a998df7547cea0}
    u_gnn_v2_ef__H128__six__s2: {weights: ac4bf9c2b1868249e4fd41cd16bdb2f5b7529e6ea5f406494344f149ce0ddd54, record: 3c480be2c6255cabcf36578a4d126acf359bbcfc7e7482f8b36a7e08570d8bfc}
