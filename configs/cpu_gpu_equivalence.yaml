phase: CPU_GPU_EQUIVALENCE
opened: 2026-09-29
status: RUN
branch_type: PLACEMENT_EQUIVALENCE
extends: >-
  configs/universal_v2.yaml#later_stages.compute_placement -- "an equivalence test on one fit carve holds the GPU path to
  the CPU path (per-query centred scores atol 1e-5) before any number is read from it" -- and every later line that
  defers to it: stage 2's if_the_projection_exceeds_the_ceiling, amendment 7's local_only, and the placement lines of
  the UMLP-D0.1, v2.1 and v2.2A declarations. This file is that test. None of those files is edited.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
equivalence_question: >-
  On inputs that are bit-identical by construction, do the lab host's CPU and GPU compute the frozen universal-v2 models'
  per-query scores and training gradients within the repository's own tolerance of the laptop CPU, the machine that
  produced every filed number?
role_for_the_registered_question: >-
  None directly: it decides only WHERE later stages may run. It fits nothing, selects nothing and reads no retrieval
  number. Metric values on fit-carve queries are computed only to compare one placement with another; their levels are
  never tabulated, reported or read.

authorization:
  requested: 2026-09-29, by the user -- "draft the equivalence test declaration"
  this_commit: >-
    the declaration only, filed before any number exists. Nothing below has run: no bundle, no placement arm, no code
    of device_path. The run opens on the user's go-ahead and follows this file as written.
  hardware_ready: >-
    the lab host was set up and validated on 2026-09-29 (commits d143ea5 and e22dee9; tools/rx/README.md, "Validated on
    the lab host"): envs mpr-cpu@31803e6457ab and mpr-cu128@62fc45e9e1ba built, CUDA inside a job working, CPU jobs
    unable to see the GPU. That work was systems only, and every rx job stays systems only until a verdict below says
    otherwise.

this_file_does_not_touch:
  fits: no fit, no selection, no early stopping; the six checkpoints are loaded read-only by sha256
  rows: fit-carve rows only (training data). No select, eval, held or test row is packed, scored or read; V2_HELD_CONFIRMATION is not touched
  frozen: >-
    M2-M3B, universal-v2 (pilot, replication, stage 2), UMLP-D0 to D0.3, v2.1 and v2.2A keep their files, arrays,
    checkpoints and status lines. M3B code stays byte-pinned (configs/universal_v2.yaml#m3b_incumbents.must_not: "edit,
    rerun, re-render or re-hash anything of M3B").
  package: >-
    the CRAG package is read-only. The bundle holds node rows that the frozen packer gathered through the served loader,
    as the v2 caches already hold query embeddings. Nothing is written under the package root, and nothing from it
    enters git.
  placement: no stage is placed by this file. A passing verdict makes a placement nameable in a later dated authorization block, nothing more

reconciliations:
  route: >-
    compute_placement (2026-09-19) named Modal, through scripts/spawn_modal_jobs.py, as the GPU route. The lab host,
    driven by tools/rx (8b6d258), is a second route and the only one this file covers; Modal would enter as a new arm
    (what_a_verdict_opens.placement_arms_added_later).
  one_fit_carve: see probe.why_not_one_whole_carve
  gradient_tier: >-
    compute_placement asked for scores only. A gradient tier is added because the placement it would open is for fits.
    It adds a condition and relaxes none, and it is filed before any number.

placements:
  reference:
    laptop_cpu_t8: >-
      the laptop (Intel Family 6 Model 186, 12 logical CPUs, AVX2, 15.7 GB), Python 3.13.5, torch 2.8.0+cpu (MKL 2025.2),
      numpy 2.3.2, torch_geometric 2.6.1, at 8 threads -- the thread count of every universal-v2 fit
  floor:
    laptop_cpu_t4: >-
      the same machine at 4 threads, the stage-2 evaluation's thread count. It measures a difference the filed science
      already treats as the same computation.
  candidates:
    host_cpu_t8: >-
      the lab host (ssh alias gpu; i9-14900 with 32 threads, AVX2, 128 GB, Windows 11), rx env mpr-cpu@31803e6457ab
      (torch 2.8.0+cpu, numpy 2.3.2, torch_geometric 2.6.1), Windows native, 8 threads
    host_gpu_det: >-
      the same host, rx env mpr-cu128@62fc45e9e1ba (torch 2.8.0+cu128), NVIDIA RTX 4500 Ada Generation 24 GB, driver
      596.71. float32 only; torch.backends.cuda.matmul.allow_tf32 = False, torch.backends.cudnn.allow_tf32 = False,
      float32 matmul precision "highest", cudnn.benchmark = False; torch.use_deterministic_algorithms(True,
      warn_only=True) with CUBLAS_WORKSPACE_CONFIG=:4096:8 set before CUDA starts; every determinism warning recorded
    host_gpu_default: the same GPU and settings with the determinism request left off (TF32 still off, float32 only)
  repeats: laptop_cpu_t8, host_gpu_det and host_gpu_default run T1 a second time in a fresh process (arm suffix _r2)
  one_process_per_arm: every arm is one process reading the same bundle; it sets the settings above, reads them back and records them
  not_covered: >-
    WSL on the host, Modal, any other GPU, driver or torch build, mixed precision, and host CPU work at a thread count
    other than 8. Each becomes a new arm (placement_arms_added_later) before it is used.

