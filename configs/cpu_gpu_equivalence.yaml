hard_stops:   # on any of these: file hard_stop_<date> with the evidence, leave the status line where it is, and report
  - any pin in this file fails (bundle file or field, checkpoint, record, bank, contract, frozen_code, fit carve, parameter count)
  - an arm's environment is not the one declared for it (env name@hash, torch version, device name)
  - a frozen model would have to be edited to run on a device (device_path.not_runnable)
  - a select, eval, held or test row would be packed, scored or read
  - anything beyond probe.transfer would have to go to the host, or a token or credential would be needed there
  - the floor arm cannot run

compute:
  laptop: the bundle build (the six contexts opened once, fit kind), then laptop_cpu_t8, its _r2 and laptop_cpu_t4 -- about 1 to 1.5 h in one lane, with nothing else of this session beside it
  host: >-
    rx jobs: host_cpu_t8 at --cpus 8 --mem 16; the GPU arms in one -p gpu job (1 GPU, 8 CPUs, 32 GB), one process per
