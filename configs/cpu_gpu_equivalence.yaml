  paths: outputs/universal_v2/six/fits/<key>.pt|.json for the GNN, outputs/universal_v2/fits/<key>.pt|.json for the twin
  why_these: >-
    the selected universal GNN (UNIVERSAL_GNN_V2_SELECTED = u_gnn_v2_ef, its stage-2 six-dataset checkpoints) and the
    non-message-passing twin u_mlp_v2_mix -- the pilot's fits on the trio (2wiki, metaqa, squad) under the same frozen
