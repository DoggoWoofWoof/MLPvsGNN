    compares these two families; a device that treated them differently would be a confound, so both face the same
    test. On typed-KB batches (metaqa, webqsp) the GNN runs its relation cells and evidence flow; on passage-graph
    batches it runs the untyped path; the twin runs the gated input block and the MLP body. On hotpotqa, musique and
