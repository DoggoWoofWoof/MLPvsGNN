    compute_within_ceiling: true  # re-verified fifth filing (amendments above): $5.008 cumulative ($2.728 27-fit rerun-with-rows + $2.28 already spent) vs $5.00 filed ceiling, a $0.008/0.16% overage judged immaterial and proceeding on the user's explicit go-ahead -- see outputs/m1b_targeted_resolution/rerun_with_rows_estimate.json. Supersedes the original $2.28-vs-$5.00 figure, which assumed splicing and no longer reflects what will be spent.
    bootstrap_and_promotion_rule_closed: true  # uncertainty_procedure + promotion_rule_for_m1b, both CLOSED above
    engineering_tests_pass: true  # re-verified fifth filing (amendments above): tests/test_run_m1b_targeted_resolution.py, 15/15 passing (extended for row capture + cross-check-not-splice); full repo suite 6021 passed, 108 skipped, 0 failed (was 6019/108/0 before this filing) -- the +2 delta is exactly this filing's own net new test count
    engineering_smoke_passes: true  # webqsp R3 seed=1, BASE + BASE+NODE_ROLE: ran real on Modal (hemachandraminchu), M1B_TARGETED_RESOLUTION_DATASET_COMPLETE, 40.8s. development_seed_values=[1] (not 0), both arms reused_from_m1a=false (correctly trained fresh, no false splice), train/held_out=80/20 matches holdout_fraction=0.2 on 100 queries. Manifest: outputs/m1b_targeted_resolution/smoke/webqsp.json. Not re-earned by a fresh dedicated Modal run for the row-capture change (fifth filing, amendments above) -- reasoning for why filed there; webqsp will be the first of the 4 real re-runs launched under the new code and inspected before the other 3, as a belt-and-braces check beyond what this gate formally requires.
  smoke_spec:
