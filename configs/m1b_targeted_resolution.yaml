# M1B -- targeted uncertainty + minimality resolution.
#
# NOT the brute-force Pareto-survivor confirmation the sampling section of
# configs/m1a_feature_screen.yaml reserves multi-seed confirmation for.
# M1A's Step 6 (trained-effect map, see that file's after_the_map amendment
# dated 2026-09-05) found that almost every large-magnitude cell resolves to
# UNRESOLVED_BY_FILED_RULE, not because the effects are small, but because no
# uncertainty procedure was ever operationalised for a one-seed screen. M1B
# exists to resolve exactly four specific ambiguities that finding left open
# -- nothing broader. Declaration only: this file authorises nothing beyond
# its own filing. Compute estimation, the real run, and any later 5-seed
# confirmation each need their own separate, explicit, dated amendment,
# exactly the discipline configs/m1a_feature_screen.yaml itself used at
# every step.
#
# Supersedes an earlier, chat-only 3-cell/5-seed M1B sketch (2026-09-05,
# same day) that the user rejected before it was filed here: it jumped
# straight to confirmation-scale seeding, proposed confirming 2Wiki
# BASE+NODE_ROLE alone (which cannot answer whether richer structure adds
# anything beyond candidate origin), picked Hotpot's PATH by raw point
# estimate inside the tolerance band rather than the filed tie-break, and
# treated more training seeds as sufficient for WebQSP's n=63 problem, which
# is a query-sampling problem, not a training-variance one. None of that
# reached this file. Everything below reflects the corrected design.

