# --------------------------------------------------------------------------
# Compute: a real estimate, from M1A's own measured rates. No guessing.
# --------------------------------------------------------------------------

compute:
  status: FILED_2026_09_05
  script: scripts/m1b_compute_estimate.py
  manifest: outputs/m1b_targeted_resolution/compute_estimate.json
  method: >-
    Feature-build seconds from the real steady-state per-query latency
    filed at configs/m1a_feature_screen.yaml#compute.inputs.
    real_per_query_feature_build_ms_steady_state_mean, times each dataset's
    real validation query count. Per-fit training seconds from the real
    M1A seed=0 R3 training_seconds for each reused-rate arm. The one arm
    with no direct M1A measurement (2wiki_clean BASE+NODE_ROLE+SUPPORT)
    uses the conservative max of its two constituent single-family arms'
    real rates on the same dataset (17.70s), not an average and not a
    guess -- the same "use the slower real bracket" convention M1A step 3
    used.
  logical_fits: 27
  reused_fits: 8
  new_fits: 19
  feature_build_gpu_h: 0.6083  # 4 cells, one build each, reused across every seed/arm in that cell
  new_fits_gpu_h: 0.4103
  pure_compute_gpu_h: 1.0186
  cost_usd_all_gpu_billed: 2.28  # conservative primary basis, M1A's own convention
  cost_usd_blended: 1.31  # feature-build CPU-billed, fit GPU-billed, optimistic
  rate_source: "docs/COMPUTE_LEDGER.md L546-547 -- $2.241/h GPU, $0.634/h CPU, reused verbatim throughout this track"
  bootstrap_analysis_cost: "pure-CPU, post-hoc, over already-scored held-out queries -- negligible next to $2.28; not separately costed"
  proposed_ceiling_usd: 5.00
  ceiling_basis: "2x the $2.28 worst-case real bracket = $4.56, rounded up to a stated round figure -- M1A's own convention"
  no_large_safety_multiple: >-
    $5.00 is ~2.2x the real $2.28 estimate, not a disguised larger budget --
    matching the explicit instruction that this estimate carry no large
    safety multiple presented as an expected cost.

# --------------------------------------------------------------------------
# Uncertainty: preregistered here, before any M1B result exists.
# --------------------------------------------------------------------------

uncertainty_procedure:
  status: CLOSED_2026_09_05
  why_this_exists: >-
    Step 6 found "uncertainty not overlapping zero" referenced three times
    in configs/m1a_feature_screen.yaml and docs/M1A_FEATURE_SCREEN_PROTOCOL.md
    but never operationalised. M1B is where that gets fixed prospectively --
    not invented after seeing which cells look promising, the same failure
    mode Step 6 refused to commit on M1A's results.
  design:
    pairing: "Same seed used for BASE and its feature arm in every comparison -- never cross-seed."
    query_level: >-
      Paired per-query metric deltas (arm's per-query outcome minus BASE's
      per-query outcome, same query, same seed), not independent-sample
      comparison -- holdout_split (scripts/run_graph_context_d1.py:237-249)
      is a deterministic order-based tail slice with no seed argument, so
      the held-out query set is identical across arms and across seeds by
      construction; confirmed by reading its source, not assumed.
    resampling: "Bootstrap resample over the paired per-query deltas, held-out queries only."
    report_separately: >-
      Query-sampling uncertainty (the bootstrap interval) and training-seed
      variability (spread across the 3 development seeds) are two different
      variance sources and must be reported as two separate numbers, never
      collapsed into one interval. 3 seeds evaluated on the same 63 WebQSP
      queries measures only the first kind of variance repeatedly against a
      fixed, small sample of the second -- it does not substitute for the
      bootstrap.
    aggregation_across_seeds: >-
      CLOSED: bootstrap_statistic = mean_s(delta_seed) -- within each
      bootstrap replicate, compute delta_seed = metric(challenger_s) -
      metric(BASE_s) for each of the 3 development seeds on that
      replicate's resampled query set, then average the 3 per-seed deltas.
      Repeat for all 10,000 replicates; the CI is the [2.5th, 97.5th]
      percentile of the resulting 10,000 bootstrap_statistic values. This
      is neither "pool all seeds' queries then bootstrap once" nor
      "bootstrap each seed separately then combine intervals" -- it
      resamples queries once per replicate and shares that same resample
      across all 3 seeds and both arms (BASE and challenger) within that
      replicate, consistent with holdout_split's seed-independent, shared
      held-out query set.
  bootstrap_resample_count: 10000
  confidence_level: 0.95
  ci_method: percentile  # [2.5th, 97.5th] percentile of the 10,000 bootstrap_statistic values
  bootstrap_rng_seed: 20260905
  bootstrap_rng_seed_note: >-
    Fixed and recorded before any M1B result exists, per the explicit
    instruction not to borrow one after seeing outcomes. Value is the
    filing date (2026-09-05) as an integer -- arbitrary as a number, but
    traceable to when it was preregistered and trivially distinguishable
    from the 3 training-seed values {0, 1, 2}, so the two RNG streams
    (training-seed RNG vs. bootstrap-resample RNG) are never confusable in
    logs or code. No other significance.
  exact_paired_resampling_procedure: >-
    For each of the 10,000 replicates: draw a sample of query indices, of
    the same size as the held-out query set, uniformly with replacement
    from that held-out set (whole-query resampling -- an index may be
    drawn 0, 1, or multiple times). Apply the identical drawn index
    multiset to BASE and to the challenger arm, and to all 3 development
    seeds, within that replicate (paired resampling, never resampled
    independently per arm or per seed). Recompute each arm/seed's metric
    on the resampled query multiset, then compute delta_seed and
    bootstrap_statistic per aggregation_across_seeds above.
  multi_gold_metric_handling: >-
    Resampling operates on whole query indices only, never on individual
    gold documents within a query. A query drawn k times in a replicate
    contributes its complete, unmodified gold set k times to that
    replicate's metric computation -- gold sets are never split,
    subsampled, or resampled independently of their query.
  report_requirement: >-
    Per configs.m1b_targeted_resolution.yaml#uncertainty_procedure.design.
    report_separately (unchanged): report the bootstrap 95% CI and the
    3-seed spread (delta_seed0, delta_seed1, delta_seed2, mean, sample SD,
    min/max, sign pattern) as two distinct, never-collapsed quantities.
    Neither is "combined query-and-seed uncertainty."

promotion_rule_for_m1b:
  status: CLOSED_2026_09_05  # extends, does not replace, configs/m1a_feature_screen.yaml#selection_rule
  promoted_condition: >-
    PROMOTED iff: mean R@5 improvement across the 3 development seeds
    exceeds +0.50pp (unchanged filed material threshold) AND the paired
    query-level bootstrap 95% CI lower bound is > 0 AND no individual
    development seed shows R@5 delta <= -0.50pp.
  harmful_condition: >-
    HARMFUL iff: mean R@5 change across the 3 development seeds is below
    -0.50pp AND the paired query-level bootstrap 95% CI upper bound is < 0
    AND no individual development seed shows R@5 delta >= +0.50pp.
  otherwise: >-
    Neither PROMOTED nor HARMFUL -- reported as "not confirmed by M1B."
    This is a real, reportable outcome, not a filing gap: it means the
    effect did not clear both the magnitude threshold and the bootstrap
    CI condition without a seed-level contradiction, at this seed/query
    budget.
  dropped_from_the_draft: >-
    The DRAFT's "no >0.50pp sacrifice on protected secondary effectiveness
    criteria" clause is removed rather than left half-specified. No
    sacrifice-threshold rule for R@1/R@20/MRR/FullCov@20 exists anywhere
    in this track -- configs/m1a_feature_screen.yaml#selection_rule only
    requires that a secondary diagnostic never silently replace the
    primary metric, which is a reporting requirement, not a promotion
    gate. Reintroducing a sacrifice threshold here would be inventing a
    rule post-hoc, exactly what this track's discipline prohibits.

# --------------------------------------------------------------------------
# Known engineering prerequisite, not yet built.
# --------------------------------------------------------------------------

engineering_prerequisites_before_execution:
  seed_loop_in_runner: >-
    scripts/run_m1a_feature_screen.py's main() currently hard-fails if
    --seed != 0 (its own one-seed-screen guard) and run()/_cell_master_local
    build one (dataset, regime) cell's features once per invocation with no
    seed loop at all. Feature-build (_cell_master_local) and holdout_split
    are both confirmed seed-independent (see uncertainty_procedure.design.
    query_level above), so the 27 fits only need 4 feature-builds (one per
    declared cell here) reused across 3 seeds each, per this file's own
    scientific_questions scope and the user's explicit "do not rebuild
    identical features 27 times" instruction -- but the runner does not yet
    support that reuse across a seed loop. Needs a runner change before
    execution; not written by this filing.
  feature_store_reuse: >-
    The runner must cache built features per (dataset, R3) cell and reuse
    them across all 3 seeds and all arms in that cell -- not rebuild
    identical features per seed. A test proving cached tensor ==
    independently rebuilt tensor, elementwise, on real/smoke samples is
    required before the engineering smoke (see launch_authorization below),
    not optional polish.
  seed_scope: >-
    Seed must affect model/training RNG only (seed_everything at the start
    of _run_arm), never feature construction -- confirmed already true for
    _cell_master_local and holdout_split, neither of which takes a seed
    argument. The seed-loop change must not alter this.

