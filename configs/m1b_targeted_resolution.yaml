    regime: R3
    seed: 1  # a seed not already real in M1A, so it genuinely exercises the new seed loop
    arms: [BASE, "BASE+NODE_ROLE"]
    superseded_original:
      dataset: 2wiki_clean
      arms: [BASE, "BASE+NODE_ROLE+SUPPORT"]
      why_changed: "see amendments[2] (2026-09-05, third filing) -- pilgnnteam ResourceExhaustedError, no other M1A-step-5 workspace holds 2wiki_clean's data"
    note: >-
      Deliberately small and deliberately not the full 19-fit matrix. Its
