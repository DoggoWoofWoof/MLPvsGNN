# --------------------------------------------------------------------------
# Scope: resolve exactly these four ambiguities. Do not broaden.
# --------------------------------------------------------------------------

scientific_questions:
  2wiki_r3: >-
    Does explicit structure (X, one family) add anything after the model
    already knows a candidate's structural-admission origin (NODE_ROLE)? If
    BASE+NODE_ROLE+X does not beat BASE+NODE_ROLE materially, the R3
    structural-family gains measured in M1A reduce substantially to
    candidate-provenance information NODE_ROLE alone already captures. If it
    does, that is evidence for genuinely nonredundant structural information
    beyond provenance.
  hotpot_r3: >-
    Does the tie-break-selected SUPPORT/PATH survivor (Y) confirm as a real
    effect under a preregistered uncertainty procedure?
  metaqa_r3: >-
    Does PATH's +0.73pp residual feature effect (small next to the +11.60pp
    R2->R3 regime effect, but above the filed material threshold) survive?
  webqsp_r3: >-
    Does NODE_ROLE's apparent recovery survive both training-seed variance
    and, separately, the query-sampling uncertainty its 63-query held-out
    set carries?
  out_of_scope: >-
    Nothing else. No new feature families, no additional interactions beyond
    the single authorised 2wiki_r3 nesting, no regime other than R3 (the
    ambiguities above are all R3-specific), no dataset beyond these four.
    squad_clean contributes no cell (R1-only, no feature arm exists to
    resolve).

# --------------------------------------------------------------------------
# Seeds: development, not confirmation.
# --------------------------------------------------------------------------

seeds:
  development_seeds: 3
  development_seed_values: [0, 1, 2]  # seed 0 already real (M1A); 1-2 are new
  confirmation_seeds_reserved: 5
  confirmation_seeds_scope: >-
    Reserved for whatever survives M1B as a frozen Pareto candidate, per
    configs/m1a_feature_screen.yaml#sampling.why_one_seed_only's own
    "reserved for whatever survives M1A/M1B" language. Not authorised by
    this file. A separate, later, explicit amendment is required before any
    5-seed run, exactly like every other step-gate in this track.

# --------------------------------------------------------------------------
# The four cells. X and Y are derived mechanically below, not chosen here.
# --------------------------------------------------------------------------

cells:
  2wiki_clean:
    regime: R3
    arms: [BASE, "BASE+NODE_ROLE", "BASE+NODE_ROLE+X"]
    x_binding: SUPPORT  # see mechanical_selection_of_x_and_y below
    fits: 9  # 3 arms x 3 seeds
    primary_comparison: "BASE+NODE_ROLE+SUPPORT vs BASE+NODE_ROLE"
    note: >-
      The only interaction arm authorised anywhere in M1B. BASE and
      BASE+NODE_ROLE are re-run at 3 seeds (not reused from M1A's single
      seed=0 point) so all three arms in the comparison share the same
      seed panel.
  hotpotqa_clean:
    regime: R3
    arms: [BASE, "BASE+Y"]
    y_binding: SUPPORT  # see mechanical_selection_of_x_and_y below
    fits: 6  # 2 arms x 3 seeds
    note: "No NODE_ROLE interaction here -- that question is 2wiki_clean's alone."
  metaqa:
    regime: R3
    arms: [BASE, "BASE+PATH"]
    fits: 6  # 2 arms x 3 seeds
    note: >-
      PATH kept per the corrected magnitude reading (+0.73pp exceeds the
      filed >0.50pp threshold). The dominant +11.60pp R2->R3 regime effect
      is not re-tested here -- it is a BASE-vs-BASE comparison already
      measured at seed=0 in M1A with no feature-arm ambiguity to resolve;
      re-running it under 3 seeds would spend fits on a question M1B was
      not filed to answer.
  webqsp:
    regime: R3
    arms: [BASE, "BASE+NODE_ROLE"]
    fits: 6  # 2 arms x 3 seeds
    note: >-
      3 seeds measure training-seed variance only. The dominant uncertainty
      source here is query-sampling (63 held-out queries) -- see
      uncertainty_procedure below. Report the number of query outcomes
      behind each metric movement, not only percentage points, given how
      few queries are behind each point of movement at this n.

total_workload:
  fits: 27  # 9 + 6 + 6 + 6
  exact_list_required_before_launch: >-
    A literal (dataset, regime, arm, seed) enumeration -- all 27 rows --
    must be filed (as a follow-up amendment to this file, or a generated
    manifest this file points to) before any launch. Not written here;
    this file fixes the cells/arms/seeds, the enumeration is mechanical
    from that and should be generated, not hand-typed, to avoid a
    transcription gap between this declaration and what actually runs.

# --------------------------------------------------------------------------
# Mechanical X/Y selection -- shown, not asserted.
# --------------------------------------------------------------------------

mechanical_selection_of_x_and_y:
  rule_applied: >-
    configs/m1a_feature_screen.yaml#selection_rule's own admissibility +
    tie-break order: effectiveness first (tied within the filed
    +/-0.25pp pareto_admissibility_tolerance_pp), then (1) uncached
    feature-build p95 [shared per (dataset,regime) cell -- never
    differentiates arms within one cell, so inert here], (2) fewer
    parameters, (3) lower peak train memory.
  2wiki_r3_candidates:
    GEOMETRY: {delta_r5_pp: 2.58, params_delta: 96, vram_delta_mb: 0.07}
    SUPPORT: {delta_r5_pp: 2.42, params_delta: 32, vram_delta_mb: 0.02}
    PATH: {delta_r5_pp: 2.37, params_delta: 96, vram_delta_mb: 0.07}
    spread_pp: 0.21  # 2.58 - 2.37, inside +/-0.25pp -- effectiveness-tied
    verdict: "X = SUPPORT (strictly fewer params AND lower VRAM than both alternatives; effectiveness tied)"
  hotpot_r3_candidates:
    SUPPORT: {delta_r5_pp_by_regime: {R1: 1.52, R2: 1.52, R3: 1.265}, params_delta: 32, vram_delta_mb_by_regime: {R1: 0.022, R2: 0.022, R3: 0.025}}
    PATH: {delta_r5_pp_by_regime: {R1: 1.571, R2: 1.622, R3: 1.316}, params_delta: 96, vram_delta_mb_by_regime: {R1: 0.068, R2: 0.068, R3: 0.077}}
    spread_pp_by_regime: {R1: 0.05, R2: 0.10, R3: 0.06}  # all inside +/-0.25pp -- effectiveness-tied
    verdict: "Y = SUPPORT (strictly fewer params AND lower VRAM in every regime; effectiveness tied)"
  observation_not_a_rule: >-
    SUPPORT wins both derivations independently -- it is the single-column
    family (precomputed_width contribution 1, vs 3 for GEOMETRY/PATH), so
    params_delta = family_width x head_width(32) makes it structurally the
    cheapest non-NODE_ROLE family everywhere it competes. Noted as a
    pattern, not used to skip showing the derivation per dataset.

