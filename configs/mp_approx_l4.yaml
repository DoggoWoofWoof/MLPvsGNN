corrections_to_the_proposal:   # checked against the code before this file was written
  a_count_sketch_not_an_enumeration: >-
    The number of distinct typed walks grows as tokens^length, so the walks are not enumerated. Each walk contributes its
    sign to one bucket of a count sketch, and the bucket and sign are position-wise hashes of its edge tokens: bucket =
    sum over positions l of h_l(token_l) mod B, sign = product of s_l(token_l) (a tensor sketch of the sequence). This is
    linear in the walk counts, so a dynamic programme over the message edges computes it exactly, as integers in float64.
    "r1 -> r2" and "r2 -> r1" use different position hashes and are different sequences.
  relation_ids_are_hashed: >-
    A token hashes the family, the two direction flags and the edge's relation slots (dataset-local relation ids, sorted).
    The probe sees only hash buckets and never a relation-id parameter. The buckets are still dataset-specific in
    practice, and each dataset is probed on its own, as at every level.
  wl_as_typed_in_paths: >-
    A WL colour refined three times is close to unique per node in pools of 40 to 2000 nodes, so a hashed colour would
    be noise to a probe. The typed-subtree term is therefore the linear WL surrogate: the same sketch over every typed
    walk that ends at the node, starting anywhere in the pool (lengths 1 and 2). Length 1 is the typed in-degree
    histogram and length 2 the typed two-step in-paths. Seeds get no special role there. The seed-walk sketch is the
    query-conditioned part.
  one_hop_attention_is_refitted_not_borrowed: >-
    Level 3's L3-att units were fitted on host_gpu_det from level 3's commit. The host-native protocol names one commit
    per stage, so this file refits L3-att (and B0-mlp) with level 3's own fit_probe, imported unchanged, and files
    whether each refitted unit is bit-identical to level 3's filed unit (flag L3_REFIT_DIFFERS). No level 3 number is
    borrowed into a contrast.

