registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  Give each candidate a fixed, compiled summary of the typed walks that reach it from the query's seeds in the pool graph
  the GNN's cell reads (FULL message edges, in their message direction, up to 3 hops), and of its typed in-paths from
  anywhere in the pool (up to 2 hops). The summary is a count sketch of the walks' edge-token sequences, plus exact walk
  totals and a path-query match. How much of the trained GNN's residual over its matched twin, and of its edge effect,
  do these sketches add to level 3's one-hop attention over fixed rows? How much do they recover without any attention?
  Does the listwise objective change the answer?
role: >-
  Measurement only, as at levels 0 to 3. The GNN's outputs are the probes' targets, which the proposal allows "only to
  measure approximation capacity". No probe, sketch, target or number of this file enters QLS-U, the twin, a feature
  contract, M3, M4 or any selection. A model that used these sketches without GNN outputs would be a competitor, and it
  would need its own declaration under the QLS-U contract. This file does not open one.

