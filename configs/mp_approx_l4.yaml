population:
  rule: >-
    level 0's, recomputed through level 1's population_l1, imported unchanged. The scored ids must equal level 0's
    qids.json in order, and the population rows level 0's q_row.npy.
  sizes: {metaqa: 2400 queries and 165893 U_q rows, 2wiki: 6290 and 245055, squad: 5841 and 176880}
  squad: the control, NOT_READ at levels 0, 1 and 3 (the GNN is not above its twin on any metric within U_q)

compile:   # laptop; one pass per dataset, in level 0's query order
  per_query: >-
    prepare the pools as level 0 did. Build the query's message edges with the frozen pack_queries_v2 on a single-query
    record whose x, emb and seedw are zero placeholders (the packer only copies them; the edges and their v2 attributes
    depend on the pool, the stores and qemb alone). Seeds are the query's prepared seeds as pool positions, and every
    seed must be a pool member.
  graph: the FULL message edges u -> v (structural, ner, knn, in packed order, duplicates kept), as the cell reads them
  token: >-
    per edge, a 64-bit hash (splitmix64 chaining) of (family, dir_fwd > 0.5, dir_bwd > 0.5, the four relation slots as
    dataset-local ids sorted ascending, -1 for an empty slot). Position hashes, for position l in 1..3: h_l = mix(token
    xor salt_h[l]) and s_l = +1 or -1 from the top bit of mix(token xor salt_s[l]); the salts are constants of the script.
  block:   # per U_q row; float16; 267 columns
    seed_walk_sketch: >-
      L = 1, 2, 3, B = 64 each (192): S_0 = e_0 at every seed (weight 1 per seed); S_L(v) = sum over message edges
      u -> v of s_L(token) * roll(S_{L-1}(u), h_L(token) mod 64). Every walk of length L from a seed to v contributes its
      sign to its bucket. Stored as sign(S) log1p(|S|).
    subtree_sketch: >-
      L = 1, 2, B = 32 each (64): the same recursion with T_0 = e_0 at every pool node, so every typed walk of length L
      that ends at v counts, from any start (h_L mod 32). Stored as sign(T) log1p(|T|).
    walk_totals: log1p of the number of walks of length L from the seeds (L = 1, 2, 3) and from anywhere (L = 1, 2) (5)
    path_query_match: >-
      over the walks of length L from the seeds (L = 1, 2, 3), the walk's mean rel_compat (the edge attribute: 0 on ner
      and knn edges and on datasets without relation text), averaged over the walks and maximised over the walks (6).
      0 where no walk reaches v.
    arithmetic: >-
      the sketches and totals are integers held exactly in float64 (every count is far below 2^53), so they do not depend
      on summation order. The path-query sums are float64 accumulated in edge order, and the maxima are exact.
  integrity:
    rows: the pool size equals level 0's q_pool_size, and the in-pool golds equal level 0's U_q rows with is_gold, as positions
    graph: >-
      the packed edges into the query's U_q rows reproduce level 3's stored entries exactly: level 3's query_entries,
      imported unchanged, run on this pass's batch, must give level 3's ent_row, ent_halo, ent_family, ent_attr (float16)
      and ent_slots for the query, and level 3's halo size and row_halo. The sketch therefore reads the graph level 3's
      attention read.
    seeds: every prepared seed is a pool member
    on_mismatch: hard stop at the first mismatch, naming the query; no tolerance is added afterwards
  outputs: >-
    outputs/mp_approx_l4/<name>/: paths.npy (float16, U_q rows x 267, level 0's row order), qids.json, and meta.json
    with the array's sha256, the column names, the integrity counts and the sizes; then mirror.json

probe:   # host_gpu_det; cross-fitted with level 0's five folds and its inner split (imported unchanged)
  inputs_per_row: >-
    b_v, n_u, eps_e and q_tilde exactly as level 3 builds them (level 3's ProbeData, imported unchanged). p_v: the row's
    267 path columns, standardised with level 0's rule (per fold, the training queries' U_q rows only; float64, two
    passes; sd < 1e-6 gives 0; clipped to [-8, 8]).
  L3_att: level 3's probe, refitted with level 3's fit_probe (imported unchanged)
  B0_mlp: level 0's ProbeMLP on b_v, refitted with level 3's fit_probe (imported unchanged)
  L4_mlp: level 0's ProbeMLP on [b_v | p_v] (258 + 267), no attention
  L4_att: >-
    level 3's L3-att with the readout's input widened to [b_v | p_v | m_v] (258 + 267 + 64). The attention's scores,
    values and heads are level 3's, and so is their initialisation for the same seed (the wider readout is drawn after
    them).
  objectives: level 3's MSE and LIST, unchanged (LIST on r only; no gold enters any loss)
  fitting: level 3's (seed 1000 + 10 k + fold; AdamW lr 1e-3, weight decay 1e-4; 64 queries per minibatch; at most 30 epochs; patience 3; best epoch restored)
  grid:
    r_k: [B0-mlp, L4-mlp, L3-att, L4-att, L4-list]   # -list: the LIST objective; every other probe MSE
    e_k: [L3-att, L4-att]
  units: >-
    one unit per (target, probe): the three seeds times five folds, written atomically with its fit log and skipped on
    a restart. The order within a job: r's L4-att first, then the rest of r's grid, then e's.
  repeat: metaqa's unit (r, L4-att) again in a fresh process into repeat/; bit-identity and the largest absolute difference filed

quantities: >-
  level 0's, computed by level 0's functions (per_query_measures, read_family, reproducibility, strata_masks) over this
  file's probes, with level 0's bootstrap: one resample matrix per dataset (1000 resamples, default_rng(0)), so every
  contrast is paired. References: ref:twin, ref:other_seed (r) and ref:no_edge, ref:other_seed (e), as level 0 computes them.
statistics:
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    paths_over_attention: rho_bar(L4-att) - rho_bar(L3-att) on r -- the typed-walk sketches added to one-hop attention over fixed rows
    paths_over_node_local: rho_bar(L4-mlp) - rho_bar(B0-mlp) on r -- the sketches added to node-local features, with no attention
    paths_vs_attention: rho_bar(L4-mlp) - rho_bar(L3-att) on r -- an attention-free readout of the sketches against one-hop attention
    objective_paths: rho_bar(L4-list) - rho_bar(L4-att) on r
    edge_paths_over_attention: rho_bar(L4-att) - rho_bar(L3-att) on e

readings:   # filed before any number; per dataset, no pooled reading
  primary_probe: L4-att on r_k (the MSE objective, as the primary of every earlier level)
  bands:   # of rho_bar, level 0's thresholds
    L4_HIGH: rho_bar >= 0.75 and its interval's lower end >= 0.50
    L4_LOW: rho_bar <= 0.25 and its interval's upper end <= 0.50
    L4_MID: neither
    NOT_READ: the dataset has no readable metric (squad is expected here; the control, not a failure)
  exactly_one: per dataset, the band of the primary probe is the dataset's reading
  flags:
    FIT_NOT_RANK: a probe with R2 >= 0.5 whose band is L4_LOW
    SEED_BOUND: mean reproducibility of r below 0.5
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    L3_REFIT_DIFFERS: a refitted unit is not bit-identical to level 3's filed unit of the same name (the unit and its largest difference are filed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l4_high: >-
      primary L4_HIGH: one-hop attention over fixed rows plus compiled typed-walk sketches predicts the GNN's ranking
      effect within U_q on that dataset (an upper bound, not a full-pool claim)
    l4_paths_add: >-
      the paths_over_attention interval above 0: typed multi-hop walk structure from the seeds carries part of the GNN's
      ranking effect that one-hop attention over fixed rows does not
    l4_paths_flat: >-
      the paths_over_attention interval reaches 0 or below: on that dataset the compiled typed-walk sketches add nothing
      measurable to one-hop attention. With a primary of L4_LOW, the fixed rungs through level 4 do not reproduce the
      GNN's ranking effect even with oracle access to its outputs.
    paths_node_local_adds: the paths_over_node_local interval above 0 -- the sketches add to node-local features without any attention
    paths_not_below_attention: >-
      the paths_vs_attention interval's upper end at or above 0: an attention-free MLP on node-local features and the
      compiled sketches is not measurably below one-hop attention on that dataset
    objective_adds: the objective_paths interval above 0 -- the objective limits recovery, not only the features
    edge_effect_paths: the band of L4-att on e is L4_HIGH, or edge_paths_over_attention's interval lies above 0
  wording: >-
    every probe is an oracle fit on the GNN's own outputs over V2_GATE queries of the same dataset. Recovery is a
    statement of capacity within U_q, never of a deployable model. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins"; low and high recovery are both results.

compute:
  compile: >-
    laptop, 6 threads, one lane per dataset, up to three at once. Level 1's pool pass took 7.1, 4.7 and 2.5 min; the
    sketch adds a few passes over about 11,000 (metaqa) or 500 (2wiki, squad) edges per query, so about 5 to 15 min
    per dataset
  sizes: 534 bytes per U_q row -- about 89 MB (metaqa), 131 MB (2wiki) and 94 MB (squad)
  probes: >-
    per dataset, 7 units of 15 fits on the GPU (metaqa 8 with the repeat), four of them attention units like level 3's,
    so about level 3's probe time
  disk: host workspace outputs/mp_approx_l4/ and laptop outputs/mp_approx_l4/, git-ignored
  resumable: every compile chunk and every probe unit is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's and level 3's included
  - the population digest or count, the ids, the halves or the population rows differ from the declared or level 0's
  - a held, select, fit or test row would be compiled
  - integrity.rows, integrity.graph or integrity.seeds fails
  - mirror_verification fails (this file's or level 3's), or a host job's placement settings read back differently from host_gpu_det_as_tested
  - the host jobs' recorded code sha256 values are not one set equal to the committed files

outputs:
  script: scripts/mp_approx_l4.py (stages compile, mirror, probe, repeat, read, run, doc, file)
  sidecars: outputs/mp_approx_l4/<name>/ (paths.npy, qids.json, meta.json, mirror.json; probes/ with the out-of-fold predictions, fit logs and probe_meta.json; repeat/; read.json)
  record: outputs/mp_approx_l4/record.json, assembled on the laptop from the host's per-dataset read.json files without arithmetic
  document: docs/MP_APPROX_L4.md
  run_record: run_record_mp_approx_l4_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l4.py
  - this file parses; its pins are the files' current sha256; the placement spec is level 3's
  - on small random typed graphs the seed-walk and subtree sketches, the walk totals and the path-query mean and max equal a brute-force enumeration of the walks
  - the sketches are invariant to the order of the edges, and a token is invariant to the order of its slots
  - reversing a two-edge typed path changes its bucket or sign pattern (position hashes differ)
  - the block has 267 columns with the declared names; a row no walk reaches has zero sketches and totals
  - L4-att's attention parameters initialise as L3-att's for the same seed, and its forward with p_v set to 0 and the extra readout columns zeroed equals L3-att's
  - the bands carry the L4 labels; the contrasts are the declared pairs; the refit comparison is bitwise
  - no held query id appears in any sidecar

execution:
  order: >-
    this file alone (commit); the script and tests (commit); compile metaqa, 2wiki, squad (laptop); mirror and push
    each dataset's sketch; one host job per dataset (probe, metaqa's repeat, read), each submitted as its data lands;
    fetch; record, doc and run record on the laptop (commit)
  stop_after_run: STOP_FOR_REVIEW

