extends: >-
  configs/mp_approx_l3.yaml (RUN at 7106b7e): metaqa L3_LOW, 2wiki L3_HIGH, squad NOT_READ (the control). Level 3's
  interpretation map named the remaining fixed rungs, "typed paths, neighbour moments", and said each needs its own
