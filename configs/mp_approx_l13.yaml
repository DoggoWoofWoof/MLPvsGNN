population:   # the scored rows, all dev rows
  rule: >-
    Start from metaqa V2_GATE, recomputed as level 8's stage_score does (the M3B eval population with its declared
    digest and count, the stored halves and hops, held rows out). Level 0's 2,400 rows leave it (recomputed through
    level 0's metaqa_subsample, equal to level 0's pinned qids.json and q_row.npy). The rows of levels 8 to 12 leave it,
    each recomputed through its own level's rule and salt and checked against its pinned qids.json. Level 12's come from
    l12_rows ("mp_approx_l12|"), which recomputes levels 8 to 11 and checks level 11's. Per hop, the remaining rows are
    sorted by sha256("mp_approx_l13|" + query_id), and the first per_hop are kept, in population order. The rule reads
    only ids, hops and the gate mask.
  per_hop: {1: 0, 2: 1000, 3: 1000}   # 2,000 queries; no hop-1 row remains
  available_per_hop: {1: 0, 2: 1644, 3: 1473}   # level 12's available rows per hop (221, 2,644, 2,473) less level 12's per_hop
  budget: >-
    After this file, 644 hop-2 and 473 hop-3 metaqa V2_GATE rows remain outside every level's population, and no hop-1
    row. A later level that draws fresh metaqa dev rows says in its own file how it draws.
  why_hops_2_and_3: >-
    No hop-1 row is left. Level 12's gap to the GNN sat on hop 3, and on hop 2 its primary read 1.012, so the two strata
    read b1d where the gap is and where it is not.
  folds: >-
    Level 0's fold_of and is_inner are stored on every row, as at levels 8 to 12, and level 8's Data checks them. The
    units do not read them: every scored row is in the one scored set (units.roles).
  gold: >-
    The in-pool golds are m3b_compile.gold_local_of's. A query with no in-pool gold is scored and read, but it enters no
    fit.
  why_disjoint: >-
    Levels 0 to 7 were read on level 0's rows and levels 8 to 12 on their own rows, and b1d was chosen from a look at
    level 12's. A fresh draw keeps all of those rows out of every number here.

carves:   # the training rows: level 12's carves (configs/mp_approx_l12.yaml#carves), unchanged; no carve is recomputed or rescored here
  rule: configs/mp_approx_l12.yaml#carves.rule, unchanged
  sidecars: >-
    Level 12's carve sidecars, outputs/mp_approx_l12/carves/<carve>/ on the host, read in place. Level 12's carve pass
    scored them (the fit and select carves checked equal to the pilot's training cache, the carve loop checked equal to
    level 8's scoring pass), and each passed level 12's carve check. Their meta.json and check.json are pinned
    (inputs.level12_carves). A deploy view checks every array of a carve against its meta.json, and its ids, count and
    hops against the pins below.
  pins:   # copied unchanged from configs/mp_approx_l12.yaml#carves.pins; ids_sha256 is m3b_pools.ids_digest of the carve's kept ids in order
    N: 329282
    source_sha256: ce7bafc9d664f1c79af7c3a4990cd9c95d9176cfbe66d8159fb850db99920c59
    s_sel: 220
    s_fit: 55
    remaining: 327785
    fit: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 161a00b2fe086d6d40d2caa8da4a8ba9f1fabe59da6996203d54c82cea366188, hops: {1: 1740, 2: 2153, 3: 2067}}
    select: {queries: 1497, zero_gold_excluded: 0, ids_sha256: f0ec84fec4e07a050e8feacec5f4880342f10d60eb788b0cb0112334bc999828, hops: {1: 437, 2: 541, 3: 519}}
    x1: {queries: 5960, zero_gold_excluded: 0, ids_sha256: fbad6b74b28676888e51f18405da842e50e723b646a07fce0af2ae5ec8eb3b89, hops: {1: 1740, 2: 2153, 3: 2067}}
    x2: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 0b31fdad6280eb9feb46e12fe8c904f83e47e9ecbe574f387f14b5240b620311, hops: {1: 1740, 2: 2153, 3: 2067}}
    x3: {queries: 5960, zero_gold_excluded: 0, ids_sha256: cc84887b0b2bb318da23a12db6c7494c225bded4370243619f66aa9e60ffdd9b, hops: {1: 1740, 2: 2153, 3: 2067}}
