  fits:   # fit: its training carves; the select carve is every fit's inner set, and the dev rows are every fit's scored set
    TW-1x: [fit]
    TW-4x: [fit, x1, x2, x3]
  label_counts: >-
    Level 12's training_rows anchor gives 5,883 fit rows with an in-pool gold for TW-1x and 23,538 for TW-4x, and 1,482
    select rows with an in-pool gold for both. The read files them again per fit, and each fit's count is named beside
    every reading of it.

scoring_pass:   # the dev rows; host CPU, score threads; level 8's stage_score, imported unchanged, with its names rebound in this process
  path: >-
    As at levels 9 to 12, level 8's scoring pass runs unchanged, with the names of its module that level 12 rebinds,
    rebound in this process only. The population rule becomes this file's, and PER_HOP and AVAILABLE_PER_HOP become this
    file's. The walk programme is level 9's combined programme (walk_entries_both, imported unchanged). The pins become
    this file's, which include every one of level 12's. The declaration and output paths become this file's. The
    chunking, the six forwards, the integrity check, the kept per-query and per-node arrays and the shards are level
    8's, and the sidecar has level 9's combined form.
  integrity: >-
    As at levels 8 to 12. rank_metrics of T_k and G_k on the full pool must equal the pilot's stored per-query values of
    all 14 metrics exactly, on every scored query. The first mismatch is a hard stop.
  shards: four processes, --shard i/4, then one process without --shard that assembles

walks: >-
  Level 9's (configs/mp_approx_l9.yaml#walks), unchanged: the std family (level 8's counts) and the nb family
  (non-backtracking counts), compiled in one pass into one sidecar and read back as two views; the per-query checks,
  the null type, the ceilings and level 8's true-chain map. The fits read the nb family only.

check: >-
  Before any fit, the check stage runs level 9's check_family on each family of the dev sidecar, imported unchanged:
  level 8's direction check (a swapped share above the declared share, in either family, is a hard stop) and level 9's
  anchors, as level 12 files them. It refuses a smoke sidecar, any level 0 or level 8 to 12 query id, any held row and
  any train-split id in the dev sidecar.

arms:   # each arm reads z(T_k), the query embedding, the relation text and the nb family's compiled types and counts, nothing else
  model: >-
    Level 12's, unchanged (configs/mp_approx_l12.yaml#arms.model): level 10's NB-set model, level 9's NB-hyb model on
    non-backtracking walks with level 10's set likelihood and its closed-form theta. p(tau | q) is the softmax of
    w(q, .) over the query's nb types and the null type.
  fits: carves.fits
  procedure: >-
    Each unit is level 12's run_unit (scripts/mp_approx_l12_fit.py, imported unchanged) on the fit's deploy view (units):
    level 11's fit_and_capture, which runs level 10's fit_unit for NB-set unchanged, then level 11's score_dsh on its
    capture. Level 11's fit_and_capture is wrapped in this process only, to keep the capture it already returns; nothing
    it computes changes. The b1d score is level 11's score_dsh, called unchanged, on that capture after b1d's change of
    every inner and scored row's log-probabilities.
  scores:   # s_k(v) = z(T_k)(v) + kappa log(n_q m_beta(v) + eta)
    dsh: level 11's sharpened mixture (configs/mp_approx_l11.yaml#arms.scores.dsh), as level 12 scores it
    b1d: >-
      dsh after one fixed change of the posterior, made before the tempering. On each query, every walk type whose
      bucket digit is 1 (code // 28^3 = 1: the walks that start from a seed other than the dense and the splade rank-1
      node) gives its probability to the null type: p'(null) = p(null) + the sum of p over the bucket-1 types, and
      p'(tau) = 0 for each bucket-1 type. Bucket-0 types keep theirs. A query with no bucket-1 type keeps its
      log-probabilities bit for bit. The fit and its kept round are dsh's.
  selection: >-
    Level 11's (configs/mp_approx_l11.yaml#arms.selection), on the select carve's rows with an in-pool gold, for each
    score on its own: beta in {1, 1.5, 2, 3, 4, 8, infinity}, kappa in {1/32, 1/16, 1/8, 1/4, 1/2, 1, 2, 4, 8, 16} and
    eta in {0.01, 0.1, 1, 10, 100} chosen together by the mean of recall@5, full_coverage@5 and hit@1. Ties go to the
    smaller beta, then the smaller kappa, then the larger eta.
  read_arms:   # arm: fit, score; in this order
    TW-1x-dsh: [TW-1x, dsh]
    TW-1x-b1d: [TW-1x, b1d]   # the primary arm: the GNN's metaqa labels and carves
    TW-4x-dsh: [TW-4x, dsh]
    TW-4x-b1d: [TW-4x, b1d]
  references:
    NB-oracle: level 8's oracle rule on the dev sidecar's nb view (R*, the true chain's reach set from the bucket with the larger Jaccard with the golds, plus 1e6)
  not_arms: >-
    Level 10's cov score is still computed inside fit_unit and kept in the unit arrays, and it is not read. The count
    mixtures and the topic-entity change of the design look are not arms.

em: >-
  Level 10's, unchanged (configs/mp_approx_l10.yaml#em), as at level 12. On a deploy view, the minibatches, the E-step
  and theta's sums run over the fit's training rows with an in-pool gold, and the per-epoch early stopping and the kept
  round read the select carve's rows with an in-pool gold.

units:
  deploy_view: >-
    Level 12's deploy_view (scripts/mp_approx_l12_fit.py, imported unchanged), with its dev-rows path rebound to this
    file's sidecar inside the process only. It is level 11's MultiView of nb views, with its parts in order: eval (this
    file's dev sidecar), select, then the fit's carves in the order of carves.fits. Each part has passed its check (both
    direction checks) on the meta.json it now has, is level 9's View with its checks on, is not a smoke run, and has the
    ids the declaration records: population.per_hop and no train-split id for eval, carves.pins for a carve. The folds
    and inner flags are then set by role.
  roles:   # part: [q_fold, q_inner] -> its set in level 8's unit_queries at fold 0 (level 12's, unchanged)
    eval: [0, 0]          # the scored set; never a fit or inner row
    select: [-1, 1]       # the inner set (rows with an in-pool gold); never scored
    fit_and_x: [-1, 0]    # the fit set (rows with an in-pool gold); never scored
  per_fit: >-
    One unit per (fit, k) at fold 0, for k = 0, 1 and 2: 6 units. Each is level 12's run_unit, so its seeds, its fit and
    its dsh score are level 12's procedure; b1d is then scored on the same capture. Every unit reads its own seed's twin,
    z(T_k), on the inner and scored rows only.
  type_table: As at level 12 (configs/mp_approx_l12.yaml#units.type_table).
  unit_files: >-
    Each unit is written atomically, to units/<fit>/k<k>_f0. It holds level 12's arrays (the scored rows, the cov and dsh
    scores and metrics, the argmax), the b1d scores and metrics, and the fit log: level 12's, with the b1d choice (beta,
    kappa, eta and its inner mean), the b1d inner grid, the inner and scored rows with a bucket-1 type, and the mean
    posterior mass b1d moves on the scored rows. A unit already written is skipped on a restart.
  repeat: >-
    The unit (TW-1x, k = 0) runs again in a fresh process. Its arrays and fit log are compared bitwise with the first
    run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule. T_k's and G_k's values on the dev rows are the stored ones, checked in the scoring pass.
  rho_readable_rho_bar_gap: >-
    As at levels 8 to 12: rho_M = (mean over k and queries of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)). A metric
    is readable when its denominator's 95% interval lies above 0. rho_bar is the mean of rho_M over the readable
    metrics, and gap_to_gnn is the mean of M(arm_k) - M(G_k) per metric.
  strata: per hop (2, 3); a stratum's rho is read only if its own denominator interval lies above 0
  anchors:   # descriptive
    level9_anchors: level 9's check anchors on each view of the dev sidecar and of every carve read (fit, select, x1, x2, x3)
    carve_metrics: per carve read and on the dev rows, the mean over k of recall@5, full_coverage@5 and hit@1 of T_k and G_k
    training_rows: per fit, the fit and inner rows with an in-pool gold, by part and in total
    unseen_sequences: >-
      Per fit, the number of distinct walk token sequences among the dev rows' types that occur on none of the fit's
      training rows, and the share of dev rows whose true chain's sequence occurs on none of them
    agreement: >-
      Per fit, the share of dev rows on which the argmax type has the true chain's token sequence, with the bucket
      ignored; per k, then the mean over k; overall and per hop. A null argmax does not agree.
    genre_agreement: the same share, on the dev rows whose qtype's last kind is genre
    gap_split: >-
      For TW-1x-b1d and TW-4x-b1d: (NB-oracle - arm) per metric, summed over the (query, seed) pairs on which the fit's
      argmax sequence is the true chain's, and over those on which it is not, each divided by the seed count and the
      metric's summed denominator; the mean over the readable metrics; overall and per hop.
    theta: per fit, the kept theta (rho_1, rho_2, rho_3, eps_s), the mean, minimum and maximum over units
    grid_edges: per read arm, the number of units whose kappa or eta sits at an end of the grid, and the number whose kept round is the last
    beta_choices: per read arm, the number of units that choose each beta
    b1d_moved: per fit, the mean over units of the inner and scored rows with a bucket-1 type and of the posterior mass b1d moves to the null type on the scored rows
    reaches_gnn: >-
      The first read arm, in the order of arms.read_arms, with no readable metric flagged BELOW_GNN, with its fit's
      training rows; none when every one has such a metric or no metric is readable

statistics:
  bootstrap: >-
    Level 0's bootstrap over the dev rows: queries resampled with replacement, 1000 resamples, numpy default_rng(0)
    (level 0's boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample
    matrix serves every quantity, so contrasts are paired. The intervals resample the scored queries. They do not
    resample the training carves or the fits.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    b1d_adds: TW-1x-b1d - TW-1x-dsh
    b1d_adds_4x: TW-4x-b1d - TW-4x-dsh
    data_4x: TW-4x-dsh - TW-1x-dsh
    data_4x_b1d: TW-4x-b1d - TW-1x-b1d
    ceiling_gap: NB-oracle - TW-1x-b1d
    ceiling_gap_4x: NB-oracle - TW-4x-b1d

readings:   # filed before any number
  primary: TW-1x-b1d
  bands:   # of rho_bar; the first that applies; the same thresholds as levels 8 to 12
    L13_ABOVE_GNN: the interval's lower end is above 1
    L13_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L13_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L13_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: NB-oracle's rho_bar interval upper end <= 0.50
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
    GRID_EDGE: more than half of the primary's 3 units choose kappa or eta at an end of the grid
    THETA_AT_CLIP: a unit's kept theta has a component at a clip bound (the units are listed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l13_above_gnn: >-
      Primary L13_ABOVE_GNN. On this population of hop-2 and hop-3 metaqa rows, a non-message-passing model fitted on the
      GNN's own metaqa labels, with its bucket-1 walk types dropped, scores above the GNN on the readable metrics on
      average. It reads compiled non-backtracking typed walks and the relation text.
    l13_high: primary L13_HIGH -- at the GNN's own labels, the model with b1d recovers most of the GNN's gain on this population
    l13_mid: primary L13_MID -- at the GNN's own labels, it recovers part of the gain
    l13_low: primary L13_LOW -- at the GNN's own labels, it recovers little of the gain; read it with CEILING_LOW and the agreement anchor
    matched_below_gnn: the primary has a readable metric flagged BELOW_GNN -- at the GNN's labels, the model stays measurably below the GNN on that metric
    matched_not_below_gnn: no readable metric of the primary is flagged BELOW_GNN -- at the GNN's labels, the model is not measurably below the GNN on any readable metric
    b1d_adds: the b1d_adds interval lies above 0 -- dropping the bucket-1 walk types adds at the GNN's labels
    b1d_hurts: the b1d_adds interval lies below 0
    b1d_adds_4x: the b1d_adds_4x interval lies above 0 -- it still adds at four times the labels
    b1d_hurts_4x: the b1d_adds_4x interval lies below 0
    data_adds_4x: the data_4x interval lies above 0 (under dsh)
    data_adds_4x_b1d: the data_4x_b1d interval lies above 0 (under b1d)
    chain_not_identified: the primary fit's agreement below 0.5 with ceiling_gap's interval above 0 -- the chain is not learned from the question
  wording: >-
    TW-1x is label-matched to the GNN on metaqa: its fit rows are the GNN's metaqa fit carve, its settings are chosen on
    the GNN's select carve, and it is read on dev rows that neither model saw. The GNN also trained on 2wiki's and
    squad's fit carves, which hold no metaqa label. TW-4x fits on four times as many metaqa train-split labels as the
    GNN, the GNN is not refitted on them, and its readings name its label count; none is a matched comparison. b1d was
    chosen from a look at level 12's dev rows, which leave this population. The file measures what non-message-passing
    typed-walk models recover of the GNN's gain on this population of hop-2 and hop-3 rows. It is never a deployable or
    selected model, and it says nothing about another dataset or about hop 1. No reading may be phrased as "message
    passing is unnecessary", "we do not need message passing" or "the MLP wins". rho here is level 8's quantity on a
    fresh population without hop-1 rows, so it is not level 12's overall rho, and level 12's numbers are quoted beside
    this file's only with their population named. rho is not the within-U_q oracle rho of levels 0 to 7, and the two
    are never set side by side as one quantity.

compute:
  scoring: >-
    2,000 dev rows. Level 12's shards scored 1,111 rows in about 2,800 s each, so four shards of 500 should take about
    21 min each, at once.
  fits: >-
    Level 12's TW-1x units took about 11.5 min and its TW-4x units about 28 min. b1d adds one more selection grid on the
    select carve, about 3.5 min, so about 15 and 32 min.
  storage: about 1 GB on the host for the dev sidecar, the units and the read; the carve sidecars are read in place
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the population digest or count, the halves, the hops, or the recomputed rows of level 0 or levels 8 to 12 differ
    from the declared or stored ones, or a level 0 or level 8 to 12 row, a held row, a train-split row or a test row
    would be scored
  - any integrity check of scoring_pass fails
  - any hard stop of level 9's walks or check
  - the relation table differs from the pinned embeddings or vocabulary order
  - a set likelihood's theta or marginal log-likelihood is not finite
  - >-
    a deploy view's part has not passed its check, is a smoke run, its meta.json or one of its arrays is not what its
    pins and meta.json record, its arrays do not line up with the view's, or a row's set is not its role's (a carve row
    scored, a dev row fitted)
  - level 10's two calls of score_fold in a unit did not receive the same log-probabilities
  - the host jobs' recorded code sha256 values are not one value per module equal to the committed files

outputs:
  scripts: >-
    scripts/mp_approx_l13.py (stages score [--shard i/n], assemble and check; the population rule and the pins) and
    scripts/mp_approx_l13_fit.py (stages fit --fit F --k K, repeat, read, doc and file; the deploy views and b1d)
  sidecars: >-
    outputs/mp_approx_l13/metaqa/, on the host: the per-query and per-node arrays, the walk entries of both families,
    qids.json, meta.json (the sha256 of every array), check.json, units/<fit>/, repeat/ and read.json
  record: outputs/mp_approx_l13/record.json, assembled on the laptop without arithmetic from the fetched read.json, check.json and meta.json files
  document: docs/MP_APPROX_L13.md
  run_record: run_record_mp_approx_l13_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l13.py and tests/test_mp_approx_l13_fit.py, run on the host in rx env mpr-cpu
  - this file parses, its pins are the files' current sha256, level 12's inputs and carve pins are copied unchanged, and the declared constants are the scripts'
  - >-
    the population rule on toy ids is disjoint from the rows of levels 0 and 8 to 12, recomputes level 12's rows by level
    12's rule, sorts per hop by this file's salted sha256 and keeps per_hop[h] rows of hop h
  - the rebound scoring pass restores level 8's names after it runs, and reads this file's rule, per_hop, pins and paths inside it
  - >-
    the check on synthetic sidecars, and its refusals: a smoke, an earlier level's id (level 12's included), a held row,
    a train-split id and a failed direction check
  - >-
    b1d on toy posteriors: the bucket-1 mass goes to the null type, the bucket-0 types keep theirs, and a query with no
    bucket-1 type keeps its log-probabilities bit for bit
  - >-
    a unit's level 12 arrays and fit-log entries equal level 12's run_unit on the same view bit for bit, and its b1d
    arrays equal level 11's score_dsh on the b1d capture
  - >-
    permuting the scored rows' golds, the other seeds' twins and the stored metrics changes none of a unit's dsh or b1d
    scores (each arm's inputs are only z(T_k), q, the relation text and the view's types and counts)
  - bands, reaches_gnn and the interpretation on toy cases, and the contrasts are the declared pairs
  - the fit, repeat, read, doc and file stages run end to end on synthetic sidecars

execution:
  order: >-
    This file alone (commit). Then scripts/mp_approx_l13.py and tests/test_mp_approx_l13.py (commit), run first on the
    laptop with scratch outputs that make no number, then on the host, with the four dev score shards submitted at once
    beside them. The assemble and the check follow as the shards finish. In parallel, scripts/mp_approx_l13_fit.py and
    tests/test_mp_approx_l13_fit.py (commit) and those tests on the host. Once the dev rows are checked, the six units
    and the repeat run at once. Then the read. Then fetch the read, check and meta files, and on the laptop build the
    record, the doc and the run record (commit).
  stop_after_run: STOP_FOR_REVIEW
