phase: MP_APPROX_L13
opened: 2026-10-01
status: DECLARED_NOT_RUN
branch_type: POST_HOC_ANALYSIS
track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  Level 12 (configs/mp_approx_l12.yaml, RUN at a43746a). On metaqa, level 11's non-message-passing typed-walk model,
  fitted on the GNN's own metaqa fit carve with its settings chosen on the GNN's select carve, read L12_HIGH: TW-1x-dsh
  rho_bar 0.878 [0.826, 0.934] on 2,221 fresh V2_GATE dev rows. At those labels it stayed below the GNN on recall@5
  (-0.010 [-0.015, -0.006]) and full_coverage@5 (-0.013 [-0.020, -0.007]), and hit@1 did not read. Four times the
  labels added +0.038 [0.011, 0.068] (TW-4x-dsh 0.916), eight times added no more, and no fit reached the GNN. By hop,
  TW-1x-dsh read 1.024 / 1.012 / 0.838, so hop 3 is the weak point. This file keeps level 12's model, carves, deploy
  views, units and selection, imported and called unchanged. It adds one fixed, gold-free change of the posterior, b1d:
  every bucket-1 walk type's probability moves to the null type before the tempering. Both scores are read once on
  fresh hop-2 and hop-3 dev rows, at the GNN's labels (TW-1x) and at four times them (TW-4x).
design_informed_by: >-
  Level 12's run record, and one design look on level 12's dev rows after it, made before this file and not filed as a
  result: outputs/mp_approx_l12_diag/diag.py (raw sha256
  ac6ec4cee83a59159ffa50350b0dc72c2dc13e9a5845d90af6e873ef40024986) with diag.json
  (ddde49a147999c6f285c273a278b8f57ef1bd82986d3e9059300799d83becaa7), diag_grid.json
  (21392f6d0b441505b72576a0f1f6e6c1a721da9819dfaa417e6b017ea317bc74) and diag_mix.json
  (db826006e8a9e8d810fbc3a4c48b29844d7627f47b7b684069d2cf775ece8390), all untracked. On the host it refitted level
  12's three TW-1x units (each equal to its filed unit, bit for bit), kept their captures, and rescored level 12's dev
  rows under fixed changes of the posterior and under stratified choices of (beta, kappa, eta), each chosen on the
  select carve as level 11 chooses. On those rows, b1d (named b1drop there) read 0.915 [0.863, 0.969], +0.037 [0.007,
  0.066] over dsh; by hop +0.050, +0.051 and +0.034. Moving all of the mass onto the true chain's sequence, in both
  buckets, did not help (-0.011 [-0.053, 0.029]), while the true chain in the bucket nearer the golds read 1.012
  [0.960, 1.069], so given the chain the bucket carries the gap. No stratified choice of (beta, kappa, eta) by a
  gold-free statistic of the posterior read above the global choice; stratifying by whether the argmax chain is right,
  which reads the truth, gave +0.043 [0.018, 0.070]. Weighting each type's reach set by its walk counts to the power
  alpha (0.5 and 1) added nothing over b1d: -0.002 [-0.015, 0.011] and -0.005 [-0.018, 0.009]. A change that reads the
  dataset's annotated topic entity (+0.036) is not used, because the GNN does not read that annotation. The remaining
  gap on those rows sat mostly on hop-3 rows whose qtype ends in genre or year, where the NB-oracle itself is below
  the GNN. Those rows are level 12's and leave this file's population, and no number of the look enters a reading
  here.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, how much of the GNN's gain over its twin does level 12's non-message-passing typed-walk model recover on
  fresh hop-2 and hop-3 rows when its bucket-1 walk types are dropped from the posterior (b1d), at the GNN's own labels?
  It reads rho on recall@5, full_coverage@5 and hit@1 of the primary arm TW-1x-b1d, against the twin and the GNN of each
  seed pair, on 2,000 fresh V2_GATE queries (1,000 of hop 2 and 1,000 of hop 3) disjoint from levels 0 and 8 to 12. As
  paired contrasts on the same queries it reads what b1d adds over level 12's dsh score at 1x and at 4x the labels, and
  what 4x the labels add under each score. It also reads the first arm at which no readable metric stays below the GNN.
  The non-backtracking true-chain oracle bounds what choosing the right chain can give.
role: >-
  Measurement, as at levels 8 to 12. The objects are non-message-passing models fitted to gold labels of the metaqa train
  split and read on dev rows. No GNN output enters any fit, target, loss or selection. The twin's z-scored output is the
  base score, as at every level. TW-1x is fitted and selected under the GNN's own metaqa labels and carves, as at level
  12. It is still a measurement, not a deployable or selected model. No model, number or reading of this file enters
  QLS-U, the twin, a feature contract, M3, M4 or any selection. A deployable model of this form would be a competitor
  under the QLS-U contract on every dataset, with its compiled form timed, and it would need its own declaration. This
  file does not open one, and it opens no later level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code, as at levels 8 to 12
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    Level 12's argument (configs/mp_approx_l12.yaml#boundary) holds for every unit unchanged: the model, the walks, the
    reach sets, the set likelihood, the fits and the dsh score are level 12's. b1d adds one fixed map applied to the
    posterior before the tempering. It reads p(tau | q), a function of the query embedding and a discrete walk type, and
    the bucket digit of each type's code, which is part of the discrete type. It reads no edge, no neighbour's embedding,
    score or state, and no gold, it has no trainable parameter, and it is applied once. Its three settings are chosen on
    the select carve by level 11's selection, as dsh's are.
  what_it_is: >-
    The function class is a query-weighted count of typed walks, as at levels 9 to 12. Under b1d, a node's structural
    term is a tempered posterior's average of the uniform reach sets of the walks that start from the dense and splade
    rank-1 seeds. It has no learned per-edge message, no neighbour state and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    As at levels 8 to 12, the walks read only the packed structural message edges the GNN's cell reads: the same pool,
    the same cap of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction
    flags. The ner and knn families are not read. The bucket digit comes from the seed lists the twin and the GNN also
    read: bucket 0 holds the seeds that are the dense or the splade rank-1 node, bucket 1 the other seeds.

authorization:
  given:
    - '2026-09-30, the user: "basically i dont want message passing but approximations to it, and pushing it as far as possible and targeting the weakpoints, i think offsets or rope based methods can work because all the stuff is anyways in the semantic space we just need to learn those transformations from the query etc and work from that, and explicit positions so that we have a proper way to represnt, what else do you think we should focus on"'
  how_the_messages_are_answered: >-
    "Targeting the weakpoints" becomes level 12's weak point: at the GNN's own labels the model stayed below the GNN on
    recall@5 and full_coverage@5, mostly on hop 3. The design look located a gold-free share of that gap in the
    posterior's mass on bucket-1 walk types. This file reads the one change that removes it, on fresh rows, and keeps
    everything else level 12's.
  go_ahead: >-
    Standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  placement_messages:
    - '2026-09-29, the user: "use the damn host not on laptop"'
    - '2026-09-30, the user: "pls mpve and do on the host for faster execution"'
    - '2026-10-01, the user: "dont request resources if you wont use them i want the best utilization at all times dont create a deadlock for other projects if you wont use the resources and whatever you request use them fully"'
    - '2026-10-01, the user: "parallely keep stuff i want full utilization and less time stuck waiting by any project or process request only what you can actually use and dont over request and keep underutilizing"'
    - answered in placement below
  terminal: STOP_FOR_REVIEW after the run record. No later level, arm or deployable model is opened by any reading here.

this_file_does_not_touch:
  fits: >-
    No GNN or twin is fitted or refitted, on any carve. The pilot's six checkpoints are read. Only this file's arms are
    fitted, and they are measurement models.
  rows: >-
    Level 0's 2,400 metaqa rows, the 3,000 rows of each of levels 8 to 11 and level 12's 2,221 rows leave the population
    before anything is scored. None of their sidecars is read, except level 12's carve sidecars (carves.sidecars).
    V2_HELD_CONFIRMATION is never read. The metaqa eval split is a dev split, and no test row is read. No train-split
    row is scored: the training rows are level 12's carve sidecars, read in place.
  frozen: >-
    M2-M3B, universal-v2 (its training caches included), UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU
    task-level qualification, the six-dataset base, DEPLOY_CK_2WIKI, DEPLOY_CK_FULL_2WIKI and levels 0 to 12 all keep
    their bytes: declarations, scripts, tests, caches, sidecars, probes, records and documents. The scripts of levels 8
    to 12 are imported unchanged, and this file's scripts rebind some of their module names inside their own processes
    only. Level 12's carve sidecars are opened read-only and pinned.
  package: >-
    The CRAG package is read-only. On the host, the verified mirror stands in for it in memory only. Nothing is written
    under either root, and nothing from them enters git.
  competitors: no arm output, type weight, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:
  where: >-
    The host CPU, through tools/rx (docs/GPU_HOST_HANDOVER.md), in rx env mpr-cpu (torch 2.8.0+cpu, numpy 2.3.2, the
    laptop's pinned closure), Windows native. No GPU is used, and scipy and numba are not used. The tests run there too.
  why_the_host: >-
    The user's placement messages. Level 12's carve sidecars are on the host, and the units read them in place, so no
    sidecar moves.
  package: As at level 12 (configs/mp_approx_l12.yaml#placement.package), through the pinned verify_metaqa.json.
  threads:
    score: 6 torch threads and BLAS and OpenMP pools of 6, set before numpy loads, for the dev scoring pass and its assemble (level 9's scoring counts)
    fit_and_read: 4 torch threads and pools of 4, with torch's deterministic algorithms (level 8's fit_process), for the check, the units, the repeat and the read
  reservations: >-
    Each job reserves what the same kind of job measurably used at level 12 (rx status: cpu_s over wall time and peak
    memory), plus a small margin. A dev score shard reserves 1.9 CPUs and 2.75 GB (level 12's two dev shards ran at 1.86
    and 1.88 CPUs and peaked at 2.47 and 2.50 GB; the chunked pass's memory does not grow with a shard's rows). The
    assemble reserves 1 CPU and 2.5 GB (level 12's peaked at 2.13 GB on 2,221 rows), and the check 1 CPU and 0.5 GB
    (0.21 GB). TW-1x units and the repeat reserve 1.25 CPUs and 1.25 GB (level 12's TW-1x units and repeat ran at 1.20 to
    1.23 CPUs and peaked at 1.02 to 1.03 GB on views of 9,678 queries; TW-1x's view here has 9,457). TW-4x units reserve
    1.35 CPUs and 2 GB (level 12's ran at 1.34 to 1.35 CPUs and peaked at 1.63 GB on 27,558; here 27,337). The b1d score
    keeps one more copy of the captured log-probabilities, a few MB. The read reserves 1 CPU and 0.5 GB (level 12's
    peaked at 0.35 GB), and each test job 1 CPU and 0.5 GB (level 12's peaked at 0.23 and 0.38 GB). rx reserves without
    capping, and every process fixes its own pools at start, so a reservation changes no number. Jobs whose inputs exist
    are submitted at once, so they run in parallel under mpr's priority, and nothing running is preempted. A job that
    waits on others is submitted by a local waiter once its inputs exist, so a waiting job holds no reservation.
  proof_per_query: >-
    On the dev rows, the scoring pass checks the 14 metrics of T_k and G_k against the pilot's stored per-query values on
    every scored query, as at levels 8 to 12. Any mismatch is a hard stop, and no tolerance is added. The carve sidecars
    were checked by level 12 (its carve_pass and carve_check) and are pinned by their meta.json and check.json, and each
    of their arrays is checked against its meta.json when a deploy view opens it.
  host_native: >-
    Every arm and reference is fitted, scored and read on the host CPU. On the dev rows, the twin's and the GNN's
    metrics are the stored values, checked exactly. No number of this file is set beside a number made on the laptop.
  identical_code: >-
    Every host job runs from a commit of this phase and records the LF sha256 of every repository module it imports.
    The file stage checks that each module has one value across all jobs, equal to the file at the commit it names.
    scripts/mp_approx_l13.py is committed first and is not edited after that commit. scripts/mp_approx_l13_fit.py
    follows in a second commit, and the score jobs never import it.
  laptop_steps: the doc and file stages, which make no number

transfer: >-
  The inputs of levels 8 to 12, level 12's qids.json and level 12's carve sidecars are already on the host. The code
  arrives as the git-tracked tree. No token or credential goes to the host.

