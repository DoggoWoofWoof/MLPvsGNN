corrections_to_the_proposal:   # checked against the code and the data before this file was written
  qtypes: >-
    metaqa's dev split has 49 question types, not 46: 13 one-hop, 21 two-hop and 15 three-hop. "tag" (tag_to_movie) and
    "tags" (movie_to_tags) both name has_tags.
  direction: >-
    A structural entry carries dir 2 when the stored triple runs u -> v along the message edge u -> v, and dir 1 when it
    runs v -> u (m3b_features.typed_pool_edges). The packed flags are dir_fwd = max(dir == 2) and dir_bwd = max(dir ==
    1) per pair (m3b_features.pool_edges). metaqa's triples are stored movie -> object, so a step movie -> X reads fwd
    and a step X -> movie reads bwd. The direction check below tests this on the population before any fit.
  repeated_slots: >-
    A pair's entries are listed once per direction of reading, so one relation can fill two of its K_REL slots
    (universal_v2_models.relation_slots). Tokens take the distinct relations among the slots. A pair with more than
    K_REL entries keeps the first K_REL, as the GNN does.
  seeds: >-
    The seed rule is dense top-5 then splade top-5, first occurrence kept (m3b_pools.seeds_of), so the dense rank-1 and
    splade rank-1 nodes are always seeds.
  full_pool_not_U_q: >-
    Level 0's U_q holds every in-pool gold, so a gold-label fit within U_q would read the gold through U_q membership.
    Every quantity here is on the full pool.
  hashed_control: >-
    TP-hash is not level 4's sketch. It keeps this file's model and replaces only the text-composed type vector with a
    learned vector per (length, bucket), the bucket coming from level 4's position hashes. It isolates text against
    hash, not level 4.

