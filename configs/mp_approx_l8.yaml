population:
  rule: >-
    Start from metaqa V2_GATE: the M3B eval population, with its declared digest and count, the stored halves and hops,
    and held rows out, all recomputed as level 0's stage_score does. Level 0's 2,400 rows leave it. They are recomputed
    through level 0's metaqa_subsample and must equal level 0's qids.json and q_row.npy (pinned). Per hop, the remaining
    rows are sorted by sha256("mp_approx_l8|" + query_id), and the first 1,000 are kept: 3,000 queries in population
    order. The rule reads only ids, hops and the gate mask.
  available_per_hop: {1: 4221, 2: 6644, 3: 6473}   # V2_GATE per hop (5,021, 7,444, 7,273) less level 0's 800 each
  folds: level 0's fold_of (sha256(id) mod 5) and is_inner (sha256(id + "|inner") mod 10 == 0), imported unchanged
  gold: >-
    The in-pool golds are m3b_compile.gold_local_of's. A query with no in-pool gold is scored and read, but it enters no
    fit, because it carries no evidence about the chain.
  why_disjoint: >-
    Levels 0 to 7 were read on level 0's rows, and this file's design follows their metaqa readings. A fresh draw keeps
    those rows out of every number here.

scoring_pass:   # host CPU, score threads; one pass that also compiles the walks
  path: >-
    Level 0's path: m3b_compile.prepare, then compile_query_v2 per query and pack_queries_v2 per chunk. Chunks are level
    0's CHUNK_NODES (24,000) over the mean pool size. Then the forwards of T_k = u_mlp_v2_mix__H128__s{k} and G_k =
    u_gnn_v2_ef__H128__s{k}, k = 0, 1, 2, through universal_v2_run.arm_view. There is no tap and no no-edge forward.
  integrity: >-
    rank_metrics (m3b_train, the 14 METRIC_NAMES) of T_k and G_k on the full pool must equal the pilot's stored
    per-query values exactly, on every scored query. Seed 0 is checked against metaqa.npz and seeds 1 and 2 against
    metaqa__more_69caa3fe.npz. The first mismatch is a hard stop that names the query, the function and the metric.
  kept_per_query: >-
    Row, id, hop, qtype, fold, inner flag, pool size, gold total, the in-pool golds, and the topic entity's pool
    position (-1 when it is outside the pool). Also the seeds with their buckets, and the 14 stored metrics of the six
    functions.
  kept_per_node: >-
    T_k's raw full-pool scores, as the float32 the forward returns (three seeds), and is_gold. z(T_k) is level 0's
    pool_z of these (float64, within the query over the full pool), computed where it is read, so nothing is rounded
    in storage.
  shards: >-
    Three processes, --shard i/3, where shard i scores the chunks ci with ci mod 3 = i. One process without --shard then
    finds every chunk written, scores any chunk no shard wrote, and assembles them, as the six-base amendment 2's shards
    do. Each shard files its chunks, seconds, peak RSS, threads, placement and module sha256.

walks:   # compiled inside the scoring pass, per query, from the packed batch the forwards read
  graph: >-
    The query's structural message edges u -> v in the packed batch (family one-hot = structural), exactly as the GNN's
    cell reads them. The ner and knn edges are not read.
  token: >-
    Per structural edge, there is one token per distinct relation among its K_REL slots. r is the dataset-local id, 0
    to 8, read from the slots as level 3's slots_local reads them. The edge's direction class d is fwd when dir_fwd >
    0.5 and dir_bwd <= 0.5, bwd in the reverse case, and both when both flags are set. token = 3 r + d, with fwd 0, bwd 1
    and both 2, which gives 27 tokens. An edge with no relation slot or with neither flag is a hard stop, because every
    structural entry carries a relation and a direction.
  buckets: >-
    b0 is the seeds equal to the dense rank-1 or the splade rank-1 node, and b1 is the other seeds. The prepared seeds
    must equal m3b_pools.seeds_of(dense top-5, splade top-5), as pool members.
  types: >-
    A walk type is (bucket, t1, ..., tL) with L = 1, 2 or 3. It is coded ((b * 28 + t1 + 1) * 28 + t2 + 1) * 28 + t3 + 1,
    where t = -1 past the walk's end.
  counts: >-
    c_tau(v) is the number of walks of type tau from a seed of the bucket to v over the tokenised edges, summed over the
    bucket's seeds. An edge with two relations counts as two parallel edges, and walks may revisit nodes. The counts come
    from an exact dynamic programme over (type, node) states in int64, joined by sorted edge lists. They are stored
    sparse per query as (type, node, count), with the count as uint32. A count >= 2^32 is a hard stop.
  per_type: >-
    |R_tau| is the number of pool nodes with c_tau(v) > 0, and h_tau is the number of in-pool golds among them. These
    are the only statistics the E-step reads.
  null_type: every query also has the null type, u(v) = 1 / n_q over its pool
  ceilings: more than 2e7 stored (type, node) entries in one query, or more than 2e9 over the population, is a hard stop
  true_chain: >-
    Taken from the qtype: split it at "_to_" into kinds k_0 ... k_H. Step i is (rel(k_{i+1}), fwd) when k_i is movie,
    and (rel(k_i), bwd) when k_{i+1} is movie. rel maps actor to starred_actors, director to directed_by, writer to
    written_by, year to release_year, genre to has_genre, tag and tags to has_tags, language to in_language, imdbrating
    to has_imdb_rating and imdbvotes to has_imdb_votes. Every qtype in the population must parse to a chain of its
    hop's length, and every step must have exactly one movie side.
  direction_check: >-
    Before any fit, the check stage files the share of queries whose true chain reaches an in-pool gold from either
    bucket. It files the same share for the chain with fwd and bwd swapped at every step. If the swapped chain reaches
    a gold on more queries than the declared one, the map is wrong: that is a hard stop, and a correction is filed
    before any fit.

arms:   # each arm reads z(T_k), the query embedding, the relation text and the compiled types and counts, nothing else
  relation_text: >-
    e_r is the served relation table's row for relation r (context.rel_table.embeddings, float32 unit rows): the rows
    the GNN's relation slots read. It must equal the pinned metaqa_rel_embeddings.npy cast to float32, in the pinned
    vocabulary order.
  query: q is the query embedding the pool was built from (prep.qemb)
  token_vector: >-
    rho(r, d) = P e_r + delta_d, where P is a learned 1536 x 64 map and delta_d a learned 64-vector per direction class
    (D = 64).
  type_vector:
    TP: >-
      e(tau) = the sum over positions l of Rot(l theta) rho(t_l). The rotation turns 32 planes (dimensions 2i and 2i + 1)
      by the angle l theta_i. theta is learned and initialised at theta_i = 100^(-i/32). This is the primary arm.
    TP-bag: TP with theta held at 0, which is a sum of offsets and blind to order
    TP-pos: e(tau) = sum_l M_l rho(t_l), with a learned 64 x 64 map per position, initialised at the identity (explicit, untied positions)
    TP-hash: >-
      e(tau) = H[L, bucket(tau)], a learned 64-vector per (length, bucket). bucket = (sum_l h_l(token_l)) mod 64, with
      level 4's position hashes h_l = mix64(token xor SALT_H[l]) (scripts/mp_approx_l4.py, imported unchanged). No
      relation text enters.
  weight: >-
    w(q, tau) = <A q, e(tau) + beta_b + lambda_L> + c_{b,L}. A is a learned 1536 x 64 map, beta_b a 64-vector per
    bucket, lambda_L a 64-vector per length, and c_{b,L} a scalar per (bucket, length). The null type's logit is <A q,
    nu> + c_null. The maps take torch's default initialisation, and the vectors and scalars start at 0.
  mixture: >-
    p(tau | q) is the softmax of w(q, .) over the query's types and the null type. u_tau(v) = 1[c_tau(v) > 0] / |R_tau|,
    and m_q(v) = sum_tau p(tau | q) u_tau(v).
  mixture_score: s_k(v) = z(T_k)(v) + kappa log(n_q m_q(v) + eta), for TP, TP-bag, TP-pos and TP-hash
  TP-direct: >-
    s_k(v) = softplus(alpha) z(T_k)(v) + sum_tau w(q, tau) log1p(c_tau(v)), with TP's w (rotary type vectors, no null
    type) and alpha initialised so that softplus(alpha) = 1. It is fitted directly, with no EM.
  TP-oracle: >-
    A reference, not fitted. s_k(v) = z(T_k)(v) + 1e6 1[v in R*]. R* is the reach set of the query's true chain from
    the bucket, b0 or b1, whose reach set has the larger Jaccard with the in-pool golds. Ties, and queries without an
    in-pool gold, take b0. There is no bonus when neither bucket reaches a node by the chain. The oracle uses the right
    chain from the better bucket and the twin's order inside it, with the golds choosing the bucket.

em:   # TP, TP-bag, TP-pos, TP-hash
  likelihood: >-
    For a query with g in-pool golds, lik(tau) = the product over its golds of ((1 - eps) 1[gold in R_tau] / |R_tau| +
    eps / n_q), with eps = 0.01. The null type's is n_q^-g. It reads only |R_tau| and h_tau.
  e_step: gamma_q(tau) is proportional to p(tau | q) lik_q(tau), computed in log space
  round_0: p is uniform over the query's types and the null type
  m_step: >-
    Minimise the mean over fit-set queries of - sum_tau gamma_q(tau) log p(tau | q), with AdamW (lr 1e-3, weight decay
    1e-4), 64 queries per minibatch and 10 epochs. The epoch with the best inner-validation soft cross-entropy (against
    the inner queries' gammas of the same round) is restored. Each round starts from the previous round's parameters.
  rounds: >-
    5 (E, M) rounds after round 0. The kept round is the one with the best inner-validation marginal log-likelihood,
    sum_q log sum_tau p(tau | q) lik_q(tau).
  kappa_eta: >-
    kappa in {0.25, 0.5, 1, 2, 4, 8} and eta in {0.01, 0.1, 1} are chosen on the inner-validation queries by the mean
    of recall@5, full_coverage@5 and hit@1 of s_k. Ties go to the smaller kappa, then to the larger eta.

direct_fitting:   # TP-direct
  loss: >-
    The listwise loss: minus the mean over the query's in-pool golds of the log-softmax over the pool of s_k, averaged
    over fit-set queries.
  fitting: >-
    AdamW (lr 1e-3, weight decay 1e-4), 64 queries per minibatch, at most 30 epochs, patience 3 on the inner-validation
    loss, and the best epoch restored.

cross_fitting:
  units: >-
    One unit per (arm, k, fold). A unit trains on the other four folds' queries that have an in-pool gold, with the
    inner-validation queries held out of the gradient, and scores the fold's queries. torch.manual_seed and numpy
    default_rng both take 1000 + 10 k + fold.
  out_of_fold: every scored query's arm score comes from the unit that did not see the query
  unit_files: >-
    Each unit is written atomically with its fit log (the per-round and per-epoch losses, the marginal
    log-likelihoods, the chosen round, kappa and eta, and the parameter count) and is skipped on a restart.
  repeat: >-
    The unit (TP, k = 0, fold 0) runs again in a fresh process. Its out-of-fold scores and fit log are compared bitwise
    with the first run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule (score descending, then pool position). T_k's and G_k's values are the stored ones, checked in the
    scoring pass.
  rho: >-
    rho_M = (mean over k and queries of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)), level 0's form, on the full
    pool.
  readable: a metric is readable when its denominator's 95% interval lies above 0
  rho_bar: the mean of rho_M over the readable metrics
  gap_to_gnn: per metric, the mean of M(arm_k) - M(G_k), with its interval
  strata: per hop (1, 2, 3); a stratum's rho is read only if its own denominator interval lies above 0
  anchors:   # descriptive, overall and per hop
    topic_entity: the share of queries whose topic entity is in the pool, among the seeds, and in b0
    chain_reach: the share whose true chain reaches an in-pool gold from b0, from b1 and from either (the direction check's numbers)
    chain_fit: recall and precision of R* against the in-pool golds, averaged over queries with an in-pool gold
    gold_in_pool: the share of queries with an in-pool gold
    sizes: types and stored entries per query, mean and maximum
    agreement: >-
      the share of queries on which TP's out-of-fold argmax type has the true chain's token sequence, with the bucket
      ignored; per k, then the mean over k. A null argmax does not agree.
    nmi: the normalised mutual information between TP's out-of-fold argmax token sequence and the qtype (k = 0)

statistics:
  bootstrap: >-
    Level 0's bootstrap: queries resampled with replacement, 1000 resamples, numpy default_rng(0) (level 0's
    boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample matrix serves
    every quantity, so contrasts are paired.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    order: TP - TP-bag
    untied_positions: TP-pos - TP
    text_vs_hash: TP - TP-hash
    latent_vs_direct: TP - TP-direct
    ceiling_gap: TP-oracle - TP

readings:   # filed before any number
  primary: TP
  bands:   # of rho_bar; the first that applies
    L8_ABOVE_GNN: the interval's lower end is above 1
    L8_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L8_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L8_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: TP-oracle's rho_bar interval upper end <= 0.50 (with these pools and seeds, choosing the chain cannot close the GNN's gain)
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l8_above_gnn: >-
      Primary L8_ABOVE_GNN: on this metaqa population, a non-message-passing model that reads compiled typed walks and
      the relation text, fitted to golds, scores above the GNN on the readable metrics on average. The GNN's metaqa
      advantage over its twin is then reproducible without learned message passing, given those inputs.
    l8_high: primary L8_HIGH -- the model recovers most of the GNN's gain on this population
    l8_mid: primary L8_MID -- it recovers part of the gain
    l8_low: >-
      Primary L8_LOW: with the chain represented through its relation text and fitted to golds, the non-message-passing
      form still does not reproduce the GNN's metaqa gain. Read it with CEILING_LOW and the agreement anchor, which
      separate "the chain cannot be chosen from the question" from "choosing it would not suffice".
    order_matters: the order interval lies above 0 -- position-aware composition adds to a bag of offsets
    untied_positions_add: the untied_positions interval lies above 0 -- explicit maps per position add to rotations
    text_beats_hash: the text_vs_hash interval lies above 0 -- relation text adds to hashed buckets under the same model
    latent_beats_direct: the latent_vs_direct interval lies above 0 -- the EM over the chain adds to a direct listwise fit of the same features
    chain_not_identified: the agreement anchor below 0.5 with ceiling_gap's interval above 0 -- the chain is not learned from the question
  wording: >-
    Every arm is cross-fitted on metaqa V2_GATE queries with gold labels. The file measures what a non-message-passing
    typed-walk model recovers of the GNN's gain on this population. It is never a deployable or selected model, and it
    says nothing about another dataset. No reading may be phrased as "message passing is unnecessary", "we do not need
    message passing" or "the MLP wins". rho here is not the within-U_q oracle rho of levels 0 to 7, and the two are
    never set side by side as one quantity.

compute:
  scoring: >-
    The host equivalence scored metaqa at 0.43 to 0.69 s per query with nine functions and level 0's taps. This pass
    has six functions and adds the walk programme, so it is about 0.5 to 1.5 s per query. For 3,000 queries over three
    shards that is about 10 to 25 min, at about 5 to 8 GB per shard.
  storage: >-
    Stored entries per query are not yet measured. The script files them, and the ceilings above stop a blow-up. The
    estimate is 1e5 to 1e6 per query, 3 to 30 GB in all on the host workspace, git-ignored, memory-mapped by the fits.
  fits: >-
    Five arms x 3 seeds x 5 folds = 75 units plus the repeat, each small (about 200,000 parameters), at 4 threads. One
    job per arm runs at once, for about 10 to 60 min.
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the population digest or count, the halves, the hops, or level 0's recomputed rows differ from the declared or
    stored ones, or a level 0 row, a held row or a test row would be scored
  - any integrity check of scoring_pass fails
  - >-
    a structural edge without a relation slot or a direction flag; a walk count >= 2^32; a ceiling of walks is passed;
    the seeds differ from seeds_of; a seed is not a pool member
  - a qtype does not parse to a chain of its hop's length, or the direction check fails
  - the relation table differs from the pinned embeddings or vocabulary order
  - the host jobs' recorded code sha256 values are not one set equal to the committed files

outputs:
  script: scripts/mp_approx_l8.py (stages score [--shard i/n], assemble, check, fit [--arm], repeat, read, doc, file)
  sidecars: >-
    outputs/mp_approx_l8/metaqa/ on the host: the per-query and per-node arrays, the walk entries, qids.json and
    meta.json (the sha256 of every array); check.json; units/<arm>/ with the out-of-fold scores and fit logs; repeat/;
    read.json
  record: outputs/mp_approx_l8/record.json, assembled on the laptop from the fetched read.json, check.json and meta.json without arithmetic
  document: docs/MP_APPROX_L8.md
  run_record: run_record_mp_approx_l8_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l8.py
  - this file parses, and its pins are the files' current sha256
  - the population rule on toy ids is disjoint from the excluded rows, sorts per hop by the salted sha256 and keeps the first N
  - on small random typed multigraphs, the walk counts of both buckets at lengths 1 to 3 equal a brute-force enumeration and do not depend on the order of the edges
  - tokens take the distinct relations of an edge's slots, the direction class follows the flags, and an edge with no slot or no flag stops
  - the true-chain map parses all 49 metaqa qtypes to their hop's length with the declared tokens, and the direction swap is an involution
  - >-
    each arm's inputs are only z(T_k), q, the relation text and the compiled types and counts, and no edge list,
    neighbour embedding or neighbour score reaches the model; the mixture m_q equals a direct sum over types
  - >-
    rotary composition distinguishes (t1, t2) from (t2, t1) when theta is not 0 and preserves norms; TP-bag does not
    distinguish them; TP-pos at the identity equals TP-bag
  - TP-hash's bucket equals level 4's mix64 and SALT_H rule
  - the E-step equals Bayes' rule computed directly on a toy, and EM recovers a planted chain from query features on synthetic data
  - metrics, rho, readability and the band order (L8_ABOVE_GNN before L8_HIGH) come out right on toy cases, and the contrasts are the declared pairs
  - no held or level 0 query id appears in any sidecar

execution:
  order: >-
    This file alone (commit). The script and tests (commit). Then on the host: three score shards submitted at once,
    the assemble, and the check (direction check and anchors). Then the five fit jobs and the repeat at once, then the
    read. Then fetch the read, check and meta files, and on the laptop build the record, the doc and the run record
    (commit).
  stop_after_run: STOP_FOR_REVIEW

