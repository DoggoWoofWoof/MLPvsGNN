phase: MP_APPROX_L8
opened: 2026-09-30
status: RUN
branch_type: POST_HOC_ANALYSIS
track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  the ladder's metaqa readings. Every oracle probe of levels 0 to 7 that read metaqa read LOW there: level 0's
  node-local B0-mlp -0.650 (717e7dc), level 1's hop tokens (4bc530b), level 3's one-hop attention -0.076 (7106b7e),
  level 4's typed-walk sketches -0.182 (f025ed7), level 5's moments -0.55 (0a21dfe), level 6's recurrent kernel -0.129
  (59b031d). On 2wiki the same rungs read HIGH (level 3 0.80, level 4 0.82, level 6 0.821). metaqa is where the pilot
  GNN's gain over its twin is largest (V2_GATE seed means, GNN vs twin: recall@5 0.7822 vs 0.7157, hit@1 0.9099 vs
  0.7753, full_coverage@5 0.6602 vs 0.5880) and where no fixed rung has reproduced it. Level 4 hashed each relation
  sequence into 64 signed buckets per length, so relation chains collided, and no rung has represented a chain
  through its relation text. This file changes two things at once and says so. The chain is represented through the
  relation text, composed by rotary offsets per position. The model is fitted to the gold labels, not to the GNN's
  outputs, so it is no longer an oracle probe.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, can a model without message passing recover the GNN's gain over its twin? It reads the typed walks from
  the query's seeds as fixed compiled counts and learns only which relation chain the question asks for.
  Operationally, per candidate, it has the compiled number of walks of each type that reach the candidate from the
  seeds, in the pool graph the GNN's cell reads. A type is a seed bucket followed by up to three edge tokens, and each
  token is a relation and a direction class. A query-to-type model p(type | query) composes its type vectors from the
  relation text by per-position rotations. The score is z(twin) + kappa log(the mixture of the types' reach sets). It
  is fitted by EM over the latent chain with gold labels, cross-fitted on 3,000 V2_GATE queries disjoint from levels 0
  to 7. The file reads how much of the GNN's gain the model recovers (rho on recall@5, full_coverage@5 and hit@1,
  against the twin and the GNN of each seed pair). It also reads what order, untied positions, relation text (against
  hashed buckets) and the latent objective (against a direct listwise fit) each add. A chain oracle bounds what
  choosing the right chain can give.
role: >-
  Measurement, as at levels 0 to 7, but of a different object. The object is a non-message-passing model fitted to gold
  labels, cross-fitted within V2_GATE, not an oracle probe of the GNN's outputs. No GNN output enters any fit, target,
  loss or selection. The twin's z-scored output is the base score, as it is at every level. No model, number or reading
  of this file enters QLS-U, the twin, a feature contract, M3, M4 or any selection. A deployable model of this form would
  be a competitor trained on the fit split under the QLS-U contract, and it would need its own declaration. This file
  does not open one, and it opens no later level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    The walk counts c_tau(v) and the reach sets R_tau are computed at compile time from the served graph, the seed set
    and the retrieval ranks, with no trainable parameter. They are the "fixed" quantities of that section. Inside the
    model, every learned quantity is a function of the query embedding and a discrete walk type only: w(q, tau) and
    p(tau | q). It multiplies compiled columns once, after the aggregation, so that score(v) = sum over types of
    f(c_tau(v)) g(q, tau). Nothing in the model reads the edge list or a neighbour's embedding, score or state, and
    nothing is repeated. This is the M3B input-block argument (a parameter-free aggregation, then a learned map)
    applied to typed walk counts.
  what_it_is: >-
    The function class is a query-weighted typed walk count. The same sum could be written as a linear propagation whose
    weight per walk depends on (query, walk type). It is therefore an approximation of message passing by
    construction, which is what this track measures. It differs from the GNN in three ways: it has no learned per-edge
    message, no neighbour state and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    The walks read only the packed structural message edges the GNN's cell reads. That means the same pool, the same cap
    of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction flags. The ner and
    knn families are not read, so this model reads less of the pool graph than the GNN. The fairness contract holds:
    both read the same pool graph.

