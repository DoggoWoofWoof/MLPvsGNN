  how_the_messages_are_answered: >-
    Offsets and RoPE become the type composition: TP (rotary) and TP-bag (plain offsets). Explicit positions become
    TP-pos. Edges only, with learned offsets from the query, becomes the compiled typed walks, read under the boundary
    above. A learned edge representation instead of a hash becomes the relation-text token vectors, with TP-hash as the
    hashed control. The EM refinement becomes the latent-chain EM, whose E-step re-estimates which chain explains the
    golds from the current model and whose M-step refits the model to it.
  go_ahead: >-
    standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
