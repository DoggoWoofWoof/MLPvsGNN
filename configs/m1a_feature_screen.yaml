# --------------------------------------------------------------------------
# M0A-M0C and the D-series are frozen. Nothing below re-derives them.
# --------------------------------------------------------------------------

do_not_modify:
  commits: [acceffd, e769a1b, c0f6402]  # M0B, M0C results, M0C prose corrections
  files:
    - configs/m0a_probe.yaml
    - configs/m0a1_overlap.yaml
    - configs/m0b_regime_map.yaml
    - configs/m0c_bounded_r3.yaml
    - docs/M0B_REGIME_MAP_RESULTS.md
    - docs/M0C_BOUNDED_R3_RESULTS.md
    - docs/GRAPH_CONTEXT_FEATURE_CATALOG.md
    - configs/graph_context_pilot.yaml  # feature_catalog section
    - all scripts/run_graph_context_d*.py and their docs/GRAPH_CONTEXT_D*_RESULTS.md
  a64_construction: >-
    Unchanged from M0B/M0C: STRUCTURAL_NEIGHBOUR over structural_only,
    graph_expansion_cap=64. Never re-tuned, never regenerated with another
    algorithm, for any dataset, in M1.
  feature_catalog: >-
    The nine families and their column ranges (docs/GRAPH_CONTEXT_FEATURE_
    CATALOG.md, FROZEN_AT_D10) are reused verbatim. M1 does not re-litigate
    which representation is "historical" for SUPPORT or PATH -- see
    support_path_controls below.

# --------------------------------------------------------------------------
# Why this does not relitigate M0-M0C or the D-series
# --------------------------------------------------------------------------

why_this_does_not_relitigate_prior_declarations:
  the_precedent_chain: >-
    configs/m0a_probe.yaml opened why_a_new_namespace; m0b_regime_map.yaml
    and m0c_bounded_r3.yaml each cited it rather than re-arguing it. This
    file cites the same chain. M1 is a new kind of phase (trained, not
    zero-training) but the namespace/declaration discipline is unchanged.
  what_is_new_here: >-
    M0-M0C measured whether context/candidates were AVAILABLE. M1 measures,
    for the first time, whether a trained ranker actually USES what is
    available. Every zero-training finding cited above is read strictly as
    availability evidence, never substituted for a trained result -- exactly
    the scope correction filed in commit c0f6402.
  the_catalog_is_2wiki_only_and_cand_only: >-
    docs/GRAPH_CONTEXT_FEATURE_CATALOG.md's ADMITTED/NEGLIGIBLE/CARRIED_NOT_
    ON_ACCURACY verdicts were measured on exactly one dataset (2wiki_clean)
    under exactly one regime (CAND, == this track's R1). Testing the same
    families on hotpotqa_clean/metaqa/webqsp, and at R2/R3_BOUNDED on
    2wiki_clean itself, is a TRANSFER test the catalog has never run -- it is
    motivated new work, not "re-measuring R2's own already-known story"
    (the phrase M0C's Step 7 used specifically about R3_BOUNDED adding no
    NEW wide-context material over R2, which is a narrower claim than "these
    families are settled everywhere").

historical_artifacts_are_untouched:
  m0a_through_m0c_results_and_commits: preserved_unmodified
  d_series_results_and_commits: preserved_unmodified
  packages_a_through_f: preserved_unmodified
  e2: PAUSED_NOT_RESUMED
  f: SEALED_NOT_OPENED
  workspace_migration: false
  gnn_training: false
  gnn_result_used_for_qls_selection: false

# --------------------------------------------------------------------------
# Frozen regimes (verbatim, canonical for all trained work from here on)
# --------------------------------------------------------------------------

regimes:
  R1:
    name: HISTORICAL
    scored_nodes: Cq
    graph: G[Cq]
    maps_to_existing_arm: CAND  # src/mp_retrieval/graph_context.py::ARMS
  R2:
    name: GRAPH_REPAIR
    scored_nodes: Cq
    graph: U2  # TARGET_H1(Cq)
    maps_to_existing_arm: TARGET_H1
  R3:
    name: BOUNDED_STRUCTURAL_SCOREABILITY
    scored_nodes: C3  # Cq union A64
    graph: U3  # U2 union A64, NOT TARGET_H1(C3)
    maps_to_existing_arm: none  # new wiring required, see reuse_contract below
    alias_in_this_file: R3_BOUNDED
  R3_FULL_REEXPANSION:
    status: CITED_FROM_M0B_NEVER_TRAINED
    scored_nodes: C3
    graph: TARGET_H1(C3)
    role: systems_control_only
    standing_prohibition: never_trained_on_any_dataset_in_m1

# --------------------------------------------------------------------------
# M1 scientific question
# --------------------------------------------------------------------------

scientific_question: >-
  Which explicit feature families actually improve a trained QLS/MLP
  ranker, and does their usefulness change across dataset and graph/
  candidate regime? GNN results must not influence QLS feature selection at
  any point in M1.

# --------------------------------------------------------------------------
# Frozen BASE -- identical composition and meaning across every cell
# --------------------------------------------------------------------------

base:
  composition:
    - seed_identity        # SEED family, col 0 (distance_0), I[v in Cq's seed set]
    - dense_reciprocal_rank   # RETRIEVAL family, (K+1)/(K+rank+1), K=60
    - splade_reciprocal_rank  # RETRIEVAL family, same transform, SPLADE side
    - retriever_agreement     # RETRIEVAL family, deterministic fn of the two above
    - semantic_branch         # see semantic_rung / semantic_controls below
  reused_from:
    dense_and_splade_reciprocal_rank: >-
      src/mp_retrieval/linear_control.py::rank_feature_rows /
      RANK_FEATURE_NAMES = ("dense_reciprocal_rank", "splade_reciprocal_
      rank") -- the frozen (K+1)/(K+rank+1) transform, K=60. NOT
      src/mp_retrieval/qls_v2_retrieval_prior.py, which is a separate,
      unused, not-yet-integrated QLS-v2 module with different column
      semantics (9 columns, none of them wired into any trained run).
    retriever_agreement: >-
      NOT part of RANK_FEATURE_NAMES (verified: that tuple has exactly two
      entries). This is scripts/run_graph_context_d4.py's own new-at-D4
      column, `in_dense & in_splade` cast to float32 (run_graph_context_d4.
      py:235-238) -- a deterministic boolean AND of "ranked by the dense
      retriever" and "ranked by SPLADE", reused verbatim from that
      construction, not from linear_control.py.
    seed_identity: >-
      scripts/run_graph_context_d3.py::SEED_ID_COLUMN /
      assert_seed_identity_column -- col 0 of the frozen 10-col local block,
      unchanged.
  semantic_rung:
    primary: S3
    module: src/mp_retrieval/qls_v2_semantic.py::SemanticHead
    features: [cosine_qd, dot_qd_pct, mean_abs_diff, semantic_product, semantic_difference]
    learned_parameters: 3072
    semantic_parameter_formula: 2 * embedding_dim
    frozen_embedding_dim: 1536
    embedding_dim_derivation: >-
      AMENDED 2026-09-04 (accounting correction, see amendments above). Not
      768 (qls_v2_semantic.EMBEDDING_DIM's module default) -- that default
      is deliberately left unchanged by this file, since it is used by other,
      unrelated code paths. M1A's own frozen embedding width is 1536,
      independently corroborated by configs/m0a_probe.yaml's "frozen
      feature_dim of 1536" and docs/QLS_V1_COMPONENT_AUDIT.md's
      "2x1536x64" QLS-v1 projection figure. scripts/run_m1a_feature_screen.
      py builds SemanticHead with dim=node_embeddings.shape[1] (the real
      loaded array's own width, never the module default) and additionally
      asserts that width equals frozen_embedding_dim immediately after
      loading each dataset, before any model is built -- see run()'s
      embedding-width guard. This makes M1A explicitly dimension-aware
      rather than reliant on qls_v2_semantic.EMBEDDING_DIM.
    verified_against_implementation: >-
      NOT assumed from the RUNG_PARAMETERS dict/docstring alone (that dict
      could itself drift, the way RANK_FEATURE_NAMES was found to have two
      entries not three -- see reused_from above), and NOT assumed from
      SemanticHead(rung="S3")'s own default width either -- that default is
      768 (qls_v2_semantic.EMBEDDING_DIM), not M1A's real frozen width, and
      instantiating without an explicit dim= is exactly the mistake the
      2026-09-04 accounting-correction amendment fixes. Confirmed live at
      the real M1A width: instantiated SemanticHead(rung="S3",
      dim=frozen_embedding_dim) and summed p.numel() for every p in
      .parameters() -- 3072, all trainable (requires_grad=True, no frozen
      params), matching 2 * frozen_embedding_dim = 2 * 1536. Also confirmed
      end to end on the real step-4 smoke: both arms
      (hotpotqa_clean x R3 x {BASE, BASE+NODE_ROLE}) instantiated a
      3,072-parameter semantic head from the real loaded 1536-dim node
      embeddings (outputs/m1a_feature_screen/smoke/hotpotqa_clean.json).
      See SemanticHead.parameter_count() (src/mp_retrieval/qls_v2_semantic.
      py:178-179) and tests/test_m1a_declaration.py's live-instantiation
      tests, none of which may instantiate S3 without an explicit real-data
      dim= again.
    why_s3_now_primary: >-
      AMENDED 2026-09-04 by explicit user decision, reversing the prior S2
      judgement call retained below for its own record. The reason is
      causal, not performance-oriented: M1A asks whether a structural
      feature family adds value once the ranker already has a competent
      semantic signal. A zero-learned-parameter semantic rung
      under-constrains that question -- a structural family could look
      important partly because the semantic branch was artificially fixed,
      making a finding like "PATH matters on MetaQA" hard to interpret (is
      it PATH, or graph structure compensating for a deliberately weak
      semantic scorer?). Earlier work already showed semantic information
      can dominate on some datasets, MuSiQue especially -- screening
      structural families against a weak semantic baseline risks
      rediscovering that omitted semantic capacity as "graph value." S3
      remains tiny relative to the historical ~213K-parameter QLS model, so
      this does not undermine the paper's efficiency thesis -- it is a
      methodological choice for the conditioning baseline, not a promotion
      of S3 in an effectiveness experiment. S3 is shared identically across
      every arm and regime, so "frozen BASE, identical meaning across
      datasets" still holds; BASE was already a learned ranker (the shared
      MLP head trains regardless), so there was no methodological purity
      being protected by forcing the semantic component specifically to
      stay parameter-free.
  semantic_controls:
    S2:
      role: later_minimality_ablation
      module: src/mp_retrieval/qls_v2_semantic.py::SemanticHead
      features: [cosine_qd, dot_qd_pct, mean_abs_diff]
      learned_parameters: 0
      verified_against_implementation: >-
        Confirmed live: instantiated SemanticHead(rung="S2") and summed
        p.numel() for p in .parameters() -- 0, matching
        RUNG_PARAMETERS["S2"].
      not_multiplied_through_m1a: true
      why_retained_not_deleted: >-
        S2's original rationale (richest zero-parameter rung -- S0 has no
        semantic signal at all, S1 discards two free scalars) still holds
        as a minimality control; it is demoted, not wrong. Do not run
        S2 x every feature arm -- that would double the 44-arm matrix for a
        question M1A is not asking.
      later_use: >-
        Once M1A's structural survivors are known: final_survivor + S2 vs.
        final_survivor + S3, on one or two representative cells, to test
        whether the learned 3,072-parameter semantic diagonal/head earns
        its cost. NOT authorised by this declaration -- a separate, later
        step.
    why_not_s0_or_s1: >-
      S0 is empty (no semantic signal at all, which is not what "semantic
      branch" in the user's spec can mean); S1 is cosine-only and discards
      dot-percentile and mean-abs-diff for free -- both S2 and S3 build on
      all three parameter-free scalars rather than S1's single one.
  r3_only_structural_candidates:
    dense_reciprocal_rank: 0
    splade_reciprocal_rank: 0
    retriever_agreement: 0
    why: >-
      A64-admitted nodes were never retrieval-scored, so both ranks are
      genuinely absent, not merely low. Zero retrieval rank alone must not
      be used as a role indicator (user's explicit instruction) -- that is
      exactly what node_role's is_structurally_admitted bit exists to
      disambiguate from "ranked last."

# --------------------------------------------------------------------------
# Feature catalog wiring -- frozen families, reused column ranges
# --------------------------------------------------------------------------

feature_catalog:
  frozen_declaration: configs/graph_context_pilot.yaml#feature_catalog
  frozen_doc: docs/GRAPH_CONTEXT_FEATURE_CATALOG.md
  reused_verbatim: true
  families:
    RETRIEVAL: {in: base, columns_10_12: [dense_reciprocal_rank, splade_reciprocal_rank, retriever_agreement]}
    SEED: {in: base, column_0: seed_identity}
    GEOMETRY: {columns: [0, 1, 2, 3], note: "col 0 overlaps SEED -- admitting GEOMETRY as an arm means columns 1-3 only are the ADDITION over BASE, since col 0 is already in BASE"}
    SUPPORT: {column: 4, representation: historical_seed_connections, replacement_tested_not_promoted: "distinct_support -- D8, Pareto-matched not beat"}
    PATH: {columns: [5, 6, 7], representation: historical_paths_length_1_2_3, replacement_tested_not_promoted: "branch_diversity -- D9/D10, MIXED, R@5 -0.67, not promoted"}
    DIFFUSION: {column: 8, representation: personalized_pagerank, catalog_status_2wiki_cand: NEGLIGIBLE, excluded_from_m1a: true}
    TOPOLOGY: {column: 9, representation: common_out_neighbors_with_seed_neighborhood, catalog_status_2wiki_cand: NEGLIGIBLE, excluded_from_m1a: true}
    PROVENANCE: {status: graph_construction_axis_not_a_feature_column, not_a_screening_target_in_m1a: true}
    NODE_ROLE:
      status_in_catalog: NOT_TESTED  # D0b's only probe (bridge_support) was killed, no surviving code
      m1a_encoding: >-
        One new column, is_structurally_admitted: 1.0 for v in A64 (==
        STRUCTURAL_SCORED_CANDIDATE), 0.0 for v in Cq (==
        RETRIEVAL_CANDIDATE). CONTEXT_ONLY nodes (v in U3 minus C3) are
        never scored under any regime, so they never receive this feature
        at all -- a two-state, not three-state, encoding for the ranker.
      why_this_is_not_a_prohibited_new_feature: >-
        overlap_audit.node_roles already proves the exhaustive, mutually-
        exclusive (Cq, C3, U3) partition (200-trial randomized sweep,
        tests/test_overlap_audit.py, reused unmodified through M0B and
        M0C). This exposes an already-proven set-membership fact as a
        training column -- it introduces no new formula, no new graph
        computation, and no new admission rule. It is the one catalogued
        family (NODE_ROLE) that was always slated for testing once a
        trained phase existed; D0b's killed bridge_support probe was a
        different, unrelated formula, not this partition.
      constant_under_r1_r2: >-
        Under R1 and R2 the scored set is always Cq, so
        is_structurally_admitted is identically 0 for every scored
        candidate -- NO_VARIATION, so NODE_ROLE arms are not declared under
        R1 or R2 in the cell matrix below.
  excluded_families_rationale: >-
    DIFFUSION and TOPOLOGY are excluded from M1A's declared matrix entirely.
    2wiki_clean/CAND is the only cell with any evidence at all for them
    (both NEGLIGIBLE, D7), and M0C adds that R3_BOUNDED gives the whole
    wide-context group no additional material to draw on. Neither fact
    proves zero learned value elsewhere, but "conditional training, not
    power set" means the weakest-evidenced families are the right ones to
    leave for M1B if M1A's results motivate revisiting them -- not tested
    here for the first time on unproven ground.

support_path_controls:
  preserves_d_series_evidence: true
  historical_representation_is_primary: true
  declared_before_seeing_any_m1a_outcome: true
  no_new_formulas: >-
    Only the two representations already measured (historical
    seed_connections / paths_length_1_2_3, and D8/D10's tested replacements)
    are in scope. distinct_support and branch_diversity are NOT arms in
    M1A -- D8 Pareto-matched (didn't beat) history and D10 was MIXED
    (R@5 -0.67, not promoted per docs/GRAPH_CONTEXT_D10_RESULTS.md's own
    corrected verdict, not the misleading PARETO-MATCHES string the code
    wrote into stage_d10.json). Reopening either replacement is out of
    scope for M1A.

# --------------------------------------------------------------------------
# Per-dataset cell/arm matrix -- derived mechanically from the frozen
# catalog (R1/CAND evidence) + M0C's corrected map (R3_BOUNDED evidence).
# This IS step 2 of the eight-step plan, filed inside the declaration.
# --------------------------------------------------------------------------

datasets:
  squad_clean:
    role: low_structure_control
    validation_split_queries: 26063
    cells:
      R1: {arms: [BASE], why: "at/near ceiling already (all_gold_at_pool=1.0, M0C); a floor/reference point, not a family screen -- M0C: no family can improve what is barely missing"}
    why_only_one_regime: >-
      squad_clean's R2/R3_BOUNDED context growth is 1.00x over R1 in every
      M0C measurement -- there is no repair happening on this dataset for a
      second or third regime cell to isolate. Testing R2/R3_BOUNDED here
      would cost real compute to reproduce a result 6c already establishes
      structurally (identical context).
  2wiki_clean:
    validation_split_queries: 3000
    cells:
      R1:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH], why: "the catalog's own home cell -- D3/D5/D6/D7 all measured here; a trained re-check on the exact cell that produced ADMITTED/CARRIED/PROMISING verdicts"}
      R2:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH], why: "does context repair change what the catalog found at CAND? Never measured before -- this is new transfer information, not a rerun"}
      R3:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH, BASE+NODE_ROLE], why: "completes the R1/R2/R3 ladder per the minimum-contrast table; NODE_ROLE added because M0C found 41 recovered gold instances at R2-level context cost here (Priority 2)"}
  hotpotqa_clean:
    validation_split_queries: 19570
    priority: 1
    cells:
      R1:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH], why: "transfer test -- catalog verdicts were never measured on this dataset"}
      R2:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH], why: "same transfer test at R2, needed to see whether context repair changes family usefulness here"}
      R3:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH, BASE+NODE_ROLE], why: "M0C's headline cell -- the only dataset where structural admission recovered gold plain one-hop context could not reach (1/9 recovered instances), now isolated from the R3_FULL context-size confound and 14.5x cheaper to compute than it appeared under M0B's R3"}
  metaqa:
    validation_split_queries: 39138
    cells:
      R1:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH], why: "transfer test; MetaQA's own 1/2/3-hop stratification (by_hop, already wired in run_sa_mlp_confirmation.py) gives GEOMETRY a dataset-native reason to matter here independent of the 2wiki catalog"}
      R2:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH], why: "same transfer test at R2"}
      R3:  {arms: [BASE, BASE+GEOMETRY, BASE+SUPPORT, BASE+PATH, BASE+NODE_ROLE], why: "Priority 2 -- 43 recovered gold instances at R2-level context cost (M0C)"}
    extra_diagnostic: report by_hop metrics per fit, reusing the existing stratification -- no new build required
  webqsp:
    validation_split_queries: 315
    cells:
      R1:  {arms: [BASE], why: "reference point only -- ceiling is 0.3351 (perfect ranker over Cq); small-N (315 queries, wide CIs already observed in SA_MLP confirmation) argues against multiplying arms here"}
      R2:  {arms: [BASE], why: "reference point -- how much of R1->R2's headroom gain (0.3351 -> higher ceiling via U2) a trained ranker actually recovers"}
      R3:  {arms: [BASE, BASE+NODE_ROLE], why: "M0C: R3_BOUNDED recovers 78 gold instances, ALL already reachable within U2 -- zero ADDITIONAL ceiling lift over R2 -- but promotion into the SCORED set (C3) rather than mere context presence is a scoreability question, not a ceiling question, and is exactly what NODE_ROLE tests. Priority 2 (M0C)."}
    why_bounded: >-
      "bounded cells justified by reachable headroom" (user's instruction)
      -- no GEOMETRY/SUPPORT/PATH arms anywhere on webqsp: no catalog
      transfer motivation beyond what 2wiki/hotpot/metaqa already test, and
      webqsp's own small validation split argues for the minimum matrix
      that still answers the NODE_ROLE scoreability question.
  musique_clean:
    status: OUT_OF_SCOPE_FOR_M1A
    why: >-
      Per the user's explicit deferral: musique_clean is out unless M0C's
      map shows it supplies a feature/regime condition absent from
      squad_clean. Checked: musique_clean's 6b/6c pattern (1.00x R3_BOUNDED
      growth, near-ceiling gold recovery, M0C Step 7 groups it with
      squad_clean as "deprioritized... no family can improve what is
      barely missing") does not differ qualitatively from squad_clean's own
      low-structure-control role. No condition found that squad_clean does
      not already cover -- stays deferred to a transfer expansion, not M1A.

arm_count_summary:
  predeclared_arms: 44  # 1 + 13 + 13 + 13 + 4 (squad, 2wiki, hotpot, metaqa, webqsp)
  conditional_interaction_arms_reserved: up_to_3  # one per R3 cell with 2+ material individual families (2wiki/hotpot/metaqa), see conditional_interaction_arms below
  seeds_per_arm: 1
  total_seed_units_ceiling: 47

# --------------------------------------------------------------------------
# Conditional training, not power set
# --------------------------------------------------------------------------

conditional_training_rule:
  individual_arms_only_first: true
  interaction_arms:
    max_per_cell: 2
    trigger_condition: >-
      An interaction arm BASE+X+Y is added to a cell ONLY if both BASE+X
      and BASE+Y individually improved that cell's validation R@5 by more
      than the material-regression threshold's mirror image (i.e. both show
      a real, non-noise-band positive move, not merely "inside the
      admissibility band") relative to BASE alone. Never pre-declared before
      individual-arm results exist.
    candidate_pairs_by_cell: >-
      2wiki_clean/R3, hotpotqa_clean/R3, metaqa/R3: BASE+NODE_ROLE paired
      with whichever of GEOMETRY/SUPPORT/PATH individually moved that same
      cell materially. webqsp/R3 has only one non-BASE arm (NODE_ROLE), so
      no interaction arm is possible there. squad_clean and every R1/R2
      cell have no NODE_ROLE arm to pair against, so no interaction arm
      applies there either.
  never_enumerate_power_set: true

# --------------------------------------------------------------------------
# Pre-declared selection rule -- filed before any fit runs
# --------------------------------------------------------------------------

selection_rule:
  primary_metric: recall_at_5
  pareto_admissibility_tolerance_pp: 0.25
  material_regression_threshold_pp: 0.50
  regression_exception: unless_uncertainty_overlaps
  secondary_diagnostics_never_swap_primary: [recall_at_1, recall_at_20, mrr, full_coverage_at_20]
  among_admissible_arms_prefer_lexicographic:
    1: lower_uncached_feature_build_p95
    2: fewer_parameters
    3: lower_peak_train_memory
    4: deterministic_tie_rule_TBD_before_first_tie  # filed here as a placeholder; must be resolved before step 5, not decided post-hoc on a real tie
  gnn_outcomes_excluded_from_selection: true

# --------------------------------------------------------------------------
# Metrics required per fit
# --------------------------------------------------------------------------

metrics_required_per_fit:
  effectiveness: [recall_at_1, recall_at_5, recall_at_20, mrr, full_coverage_at_20]
  regime_headroom: [recall_ceiling_at_1, recall_ceiling_at_5, recall_ceiling_at_20, candidate_ceiling_mean]
  ceiling_attainment: mandatory_on_webqsp  # achieved / regime-specific oracle, so unreachable gold is never misread as a ranking failure
  systems: [parameters, train_time_seconds, peak_train_vram_mb, peak_train_rss_mb, uncached_feature_build_latency_p50_ms, uncached_feature_build_latency_p95_ms, uncached_feature_build_latency_p99_ms]
  do_not_attribute_unreachable_gold_to_ranking: true
  metrics_field_reuse: >-
    recall@1/5/20, mrr, full_coverage@20, parameters, training.
    training_seconds, peak_gpu_memory_mb_{total,incremental}, peak_cpu_
    rss_mb_{total,incremental}, inference.latency_ms_per_query -- these
    exact keys are confirmed present in scripts/run_sa_mlp_confirmation.py
    (training_seconds:430; peak_gpu_memory_mb_total/incremental:285-286,
    338-339; peak_cpu_rss_mb_total/incremental:287-288,341-343; latency_ms_
    per_query:283,331-332). uncached_feature_build_latency_p50/95/99 is new
    instrumentation -- RESOLVED: reuse the same convention M0B/M0C's own
    feature_latency_ms.steady_state.p99 came from, confirmed as
    scripts/run_m0b_webqsp_probe.py::_feature_ms (125-138, perf_counter
    around qls_local_features) reduced by scripts/run_m0a_probe.py::
    _percentiles (52-62, np.percentile at 50/95/99, query-0 excluded from
    steady_state per run_m0c_bounded_r3.py's cold-start attribution notes).
    The new runner's p50/p95/p99 must be produced the same way.

# --------------------------------------------------------------------------
# Model architecture -- the shared scorer, and why it is not ExplicitFeatureMLP
# --------------------------------------------------------------------------

model_architecture:
  status: newly_declared_2026-09-04
  why_not_explicit_feature_mlp: >-
    src/mp_retrieval/operator_models.py::ExplicitFeatureMLP.forward_explicit
    (operator_models.py:368-401) always applies its own learned 768->64
    node_projection/query_projection -- 98,304 params, the exact projection
    qls_v2_semantic.py's own module docstring names ("QLS-v1 spends a
    learned 768 -> 64 projection on q and on d -- 98,304 parameters, 46% of
    the model... This module asks whether that is necessary") -- plus four
    interaction features derived from that projection, before any
    structural_features are concatenated. Reusing it wholesale would put a
    fixed, always-on 98,304-parameter block in every arm regardless of
    semantic_rung, swamping and confounding the S2-vs-S3 (0 vs 3,072 param)
    contrast base.semantic_rung.why_s3_now_primary exists to make legible.
    Verified by reading forward_explicit's body directly, not assumed from
    its "sa_mlp" name or its status as the frozen historical model
    elsewhere in this repo.
  scorer: >-
    A new, minimal nn.Module (src/mp_retrieval/m1a_screen.py::M1AScorer)
    with no embedding projection of its own. At forward time it calls
    SemanticHead(rung) live, once per query, on the raw query/candidate
    embeddings already threaded through run_sa_mlp_confirmation.py's
    batching -- so semantic_rung's learned parameters (0 for S2, 3,072 for
    S3) receive real gradients every training step rather than being frozen
    into a precomputed column -- concatenates that output with the
    precomputed BASE + per-arm family + NODE_ROLE columns, and scores the
    concatenation with one small nn.Sequential(Linear, GELU, Dropout,
    Linear(., 1)) head. See reuse_contract.reused_as_is.trainer_core for
    what stays unmodified around this model.
  head_width:
    value: 32
    rule: fixed_small_constant_not_parameter_matched
    why: >-
      No target_parameters figure is declared anywhere in this file or its
      protocol for M1A's own scorer -- "a shared tiny MLP" (user
      instruction) is descriptive, not a specific width. Historical QLS-v1
      parameter-matches its head width against a ~213K-parameter budget
      dominated by the 768->64 projection this architecture deliberately
      drops; reusing that matching utility here would size the head against
      a budget that no longer applies to what M1A actually scores. 32 is a
      small, round width against an input of at most ~13 columns (4 BASE +
      up to 5 semantic + up to 4 family/NODE_ROLE), held fixed across every
      arm and regime so head width is never itself a confound -- only the
      input columns change between arms.
    live_verification: >-
      tests/test_m1a_declaration.py asserts the instantiated M1AScorer's
      total and per-module (semantic_head vs. scorer) trainable parameter
      counts directly against this file, the same live-instantiation
      discipline used for semantic_rung/semantic_controls above -- never
      assumed from this number alone.

# --------------------------------------------------------------------------
# Reuse contract -- what M1A reuses vs. builds new
# --------------------------------------------------------------------------

reuse_contract:
  reused_as_is:
    trainer_core: >-
      scripts/run_sa_mlp_confirmation.py::_fit, _score_once, _prepare_batch,
      validate_candidate_contract -- the shell (optimizer, listwise loss,
      epoch loop, batching, telemetry), unmodified, by giving the new model
      the same forward_explicit(nodes, queries, batch_index,
      structural_features) signature ExplicitFeatureMLP exposes and calling
      it under model_name "sa_mlp" so _prepare_batch's existing dispatch
      needs no edit. NOT _build_model's "sa_mlp" construction branch itself
      -- see model_architecture.why_not_explicit_feature_mlp for why that
      one piece is newly written instead of reused, corrected from this
      file's original text by the amendment dated 2026-09-04 (model
      architecture).
    metrics: "scripts/run_operator_screen.py::_metric_row, _aggregate_rows"
    static_features: "scripts/run_graph_context_d0b.py::load_or_build_static"
    local_features_and_splits: "scripts/run_graph_context_d1.py::build_local_features, context_feature_store, holdout_split, stratify, METRICS, MODEL_NAME"
    seed_identity: "scripts/run_graph_context_d3.py::SEED_ID_COLUMN, assert_seed_identity_column, masked_local"
    retrieval_columns: "src/mp_retrieval/linear_control.py::rank_feature_rows, RANK_FEATURE_NAMES"
    semantic_branch: "src/mp_retrieval/qls_v2_semantic.py::SemanticHead (rung S3 primary, S2 retained as a later minimality-ablation control, not multiplied through M1A) -- code exists, unit-level only, never before wired into a real trained run"
    r1_r2_regime_arms: "src/mp_retrieval/graph_context.py::ARMS, build_operators, context_nodes -- CAND==R1, TARGET_H1==R2 map directly"
    node_role_partition_proof: "src/mp_retrieval/overlap_audit.py::node_roles, unmodified"
  must_be_newly_written:
    scorer_model: >-
      See model_architecture above -- M1AScorer, not ExplicitFeatureMLP.
    r3_bounded_context_builder: >-
      No existing code feeds a regime-switched context into
      context_feature_store/StructuralFeatureStore for R3 (U2 union A64).
      Needs: candidate_expansion_v2.expand for A64 (reused construction,
      new call site) + np.union1d against U2 (matches M0C's own
      U3_bounded construction) + wiring that pool into
      context_feature_store/build_local_features where today only the six
      graph_context.ARMS are accepted.
    per_family_column_mask: >-
      No existing code slices/zeros specific catalog column ranges per
      declared arm. ExplicitFeatureMLP's include_interactions/
      include_static/include_local are SA_MLP's own three coarse arm-types,
      not the 9-family catalog's column ranges. Needs a new mask keyed by
      family name -> column range (GEOMETRY [1:4] beyond BASE's shared col
      0, SUPPORT [4], PATH [5:8], NODE_ROLE the one new column).
    node_role_column: >-
      One new column, is_structurally_admitted -- see feature_catalog.
      NODE_ROLE.m1a_encoding above. Not a new formula; exposes an
      already-proven set membership.
    cell_matrix_runner: >-
      A new runner looping (dataset, regime, arm), one seed, over the 47
      declared/reserved seed-units above, calling the reused trainer core
      per cell -- closest template is run_sa_mlp_confirmation.py's own
      fit/score/telemetry loop, generalised from its fixed model identities
      to this file's column-masked arms.
    uncached_feature_build_percentiles: >-
      Confirm/reuse the timing utility M0B/M0C used for feature_latency_ms;
      wire p50/p95/p99 reporting into the new runner if not already emitted
      by the reused feature-building path at this grain.

# --------------------------------------------------------------------------
# Sampling -- full canonical validation split per dataset, one seed
# --------------------------------------------------------------------------

sampling:
  split: validation
  subsampling: none  # the entire canonical validation split, same convention as SA_MLP confirmation
  reused_automatically_from: src/mp_retrieval/complete_data.py::CompleteRetrievalDataset.split
  distinct_from_m0_diagnostic_sample: >-
    M0A/M0B/M0C's 100-query panel is a deterministic-prefix diagnostic
    slice of this same validation split, not an alternate sample. M1A does
    not reuse the 100-query slice -- it trains and selects over the full
    split, matching every prior trained phase's own convention (SA_MLP
    screen/confirmation, D4-D10).
  seeds: [0]
  why_one_seed_only: >-
    Explicit instruction. Multi-seed confirmation (5 seeds, the ladder's
    established confirmation-stage convention) is reserved for whatever
    survives M1A/M1B as a Pareto candidate, not for the screen itself.

# --------------------------------------------------------------------------
# Compute -- NOT ESTIMATED HERE. Step 3, gated on this file being reviewed.
# --------------------------------------------------------------------------

compute:
  estimated_in_this_file: true  # step 3 -- pure-compute projection only. NOT a filed ceiling.
  ceiling_filed: false
  ceiling_deferred_to: step_4_real_smoke_measurement
  rates_source: >-
    docs/COMPUTE_LEDGER.md's E2 entry (L546-547): GPU $2.241/h, CPU
    $0.634/h -- the same measured Modal rates this track has used since D0,
    reused verbatim, not re-quoted from memory.
  gpu_rate_usd_per_hour: 2.241
  cpu_rate_usd_per_hour: 0.634

  inputs:
    real_validation_split_sizes: >-
      squad_clean=26063, 2wiki_clean=3000, hotpotqa_clean=19570,
      metaqa=39138, webqsp=315 -- outputs/sa_mlp_confirmation/*.json,
      data.splits.validation, matches datasets.*.real_validation_split_n
      elsewhere in this file.
    real_per_seed_training_seconds: >-
      squad_clean=174.46, 2wiki_clean=20.51, hotpotqa_clean=160.46,
      metaqa=492.82, webqsp=1.80 -- outputs/sa_mlp_confirmation/*.json,
      models.sa_mlp.aggregate.training_seconds.mean, the 5-seed
      CONFIRMATION run's own per-seed mean (this file uses 1 seed, so one
      arm's fit cost = one of these numbers, not five). Measured on the
      historical ~213K-parameter model; S3 adds 3,072 params (corrected
      2026-09-04; see amendments), +1.44% of that total -- folded into
      headroom, not modelled as a separate term.
    real_per_query_feature_build_ms_steady_state_mean: >-
      From outputs/m0c_bounded_r3/headline/*.json, systems.
      {r1,r2,mainline_r3_bounded}_feature_latency_ms.steady_state.mean (100
      query panel, extrapolated to the full split -- same "extrapolate to
      the same shape" practice as COMPUTE_LEDGER.md's own Stage C/E2
      entries). squad_clean R1=6.687; 2wiki_clean R1=2.573 R2=6.113
      R3=6.329; hotpotqa_clean R1=44.095 R2=84.924 R3=81.079; metaqa
      R1=1.889 R2=14.328 R3=14.553; webqsp R1=41.566 R2=42.168 R3=45.792.
      A64-admission and U3-build latency (also real-measured in the same
      artifacts) are both <1% of these feature-build figures on every
      dataset -- the new R3-bounded wiring's underlying operations are
      already measured and cheap; what step 4 actually tests is
      integration correctness, not undiscovered compute cost.
    feature_build_runs_once_per_cell_not_per_arm: >-
      13 (dataset, regime) cells share one built feature matrix each,
      column-masked per arm (see feature_catalog.per_family_column_mask,
      §8/step 4) -- feature-build cost scales with cells (13), fit cost
      scales with arms (44). Conflating the two overstates feature-build
      cost by ~3.4x.

  derivation:
    feature_build_seconds_total: 5576.0  # sum over 13 cells: (ms/1000) * val_n
    feature_build_hours_total: 1.549
    feature_build_by_dataset_seconds: {squad_clean: 174.3, 2wiki_clean: 45.0, hotpotqa_clean: 4111.6, metaqa: 1204.3, webqsp: 40.8}
    fit_seconds_total: 8940.9  # sum over 44 arms: dataset's real per-seed training_seconds, one seed each
    fit_hours_total: 2.484
    fit_by_dataset_seconds: {squad_clean: 174.5, 2wiki_clean: 266.6, hotpotqa_clean: 2086.0, metaqa: 6406.7, webqsp: 7.2}
    pure_compute_floor_gpu_hours: 4.032
    cost_all_gpu_billed_usd: 9.04  # conservative: whole pipeline on one GPU-billed container
    cost_blended_feature_cpu_fit_gpu_usd: 6.55  # optimistic: feature-build on a CPU container, fit on GPU
    dominant_cost_driver_feature_build: hotpotqa_clean  # 1.14h of 1.55h total, ~74% -- highest per-query ms
    dominant_cost_driver_fit: metaqa  # 1.78h of 2.48h total, ~72% -- largest validation split
    wall_clock_estimate_with_per_dataset_parallelism_hours: "~2.1-2.5"  # 5 concurrent containers (M0B/M0C's own established pattern); metaqa's own serial chain (feature+fit) dominates at ~2.11h

  non_binding_sanity_range: >-
    Applying the E2 realized/pure-compute ratio (~4.2x, see
    preliminary_anchor_not_a_ceiling below) to the 4.032 GPU-h floor gives
    ~16.9 GPU-h / ~$37.95 (all-GPU) or ~$27.50 (blended) as a
    non-binding upper anchor for what step 4's real smoke might reveal --
    NOT a filed ceiling. Either end of this range is small in absolute
    terms, comparable to M0B's $5.00 and M0C's $2.00 filed ceilings -- step
    3's real question was scale sanity (is a 44-arm/full-split screen a
    reasonable thing to run at all), not dollar risk, and the answer is yes.
  preliminary_anchor_not_a_ceiling: >-
    docs/COMPUTE_LEDGER.md's E2 phase-confirmation measured 0.174 GPU-h per
    seed-unit REALIZED (vs. 0.041 GPU-h pure-compute estimate, ~4.2x) at a
    comparable full-validation-split scale. Retained here for the ratio
    only (container-startup/image-pull overhead as a fraction of
    pure-compute); E2's own absolute per-unit magnitude does not transfer,
    since M1A's real per-dataset feature-build/fit numbers above are
    already measured on this track's own real data, not borrowed from E2's
    unrelated workload.
  recommended_step_4_smoke_scope: >-
    hotpotqa_clean x R3 x {BASE, BASE+NODE_ROLE} -- the single cell that is
    simultaneously the dominant feature-build cost driver AND the one
    exercising the actually-new code (R3-bounded context builder, column
    mask, is_structurally_admitted) for the first time, which is also
    hotpotqa's own declared NODE_ROLE priority-1 cell. One smoke covers the
    highest-uncertainty code path and the highest-cost regime at once,
    rather than needing two separate smokes for cost vs. correctness risk.
    A recommendation for step 4 to review, not an authorisation to run it.
  ceiling_derivation_discipline: >-
    docs/COMPUTE_LEDGER.md's own Stage C entry (L358-362) names a 32x
    cost ceiling as a MISTAKE ("approves more than it needs to"), not a
    convention to replicate -- despite m0c_bounded_r3.yaml's compute
    section describing "roughly 30-40x" as "this repo's own established
    convention." That description will not be repeated for M1A: the real filed
    ceiling still comes from step 4's real smoke measurement with
    reasoned, stated headroom (per D0's own corrected practice: derive from
    measured throughput, state the multiplier's basis, re-derive the cost
    ceiling from the SAME measured rate as the CPU/GPU-hour ceiling rather
    than carrying an unrelated placeholder forward) -- this section's
    numbers are step 3's pure-compute projection, not that ceiling.
  validate_cheaply_first: >-
    Same two-stage discipline as M0A-M0C: one dataset x one cell x BASE,
    plus one feature arm, on the real pipeline, before any fan-out --
    step 4, not this file. See recommended_step_4_smoke_scope above.

# --------------------------------------------------------------------------
# Modal -- GPU shape for the trainer core this file reuses verbatim
# (scripts/run_sa_mlp_confirmation.py::_fit/_score_once run on an A10G in
# every prior use of that code; M1AScorer is smaller, not larger, than
# ExplicitFeatureMLP, so the same shape is not undersized). Two-stage
# smoke/headline naming mirrors configs/m0b_regime_map.yaml and
# configs/m0c_bounded_r3.yaml exactly, though here "smoke" additionally
# restricts to the declared compute.recommended_step_4_smoke_scope's own
# regime/arm pair, not only a smaller query count.
# --------------------------------------------------------------------------

modal:
  app: message-passing-retrieval-m1a-feature-screen
  result_volume: message-passing-retrieval-data
  storage_root: /root/message-passing-retrieval/storage
  gpu: A10G
  cpu: 16
  memory_mb: 49152
  timeout_seconds: 86400
  edge_provenance_root: edge_provenance_graphs
  execution_label: execution_1
  spawn_server_side: true
  never_modal_run_detach: >-
    submitted through scripts/spawn_modal_jobs.py so the run survives the
    local process, unchanged discipline from M0A/M0A.1/M0B/M0C.
  smoke_queries: 100  # this track's own established 100-query diagnostic panel size, not a new number

# --------------------------------------------------------------------------
# After the map
# --------------------------------------------------------------------------

after_the_map:
  eight_step_plan:
    1: file_this_declaration_and_derive_cells  # THIS FILE
    2: derive_exact_cells_arms_from_m0c_map  # folded into datasets/ above
    3: estimate_compute_before_any_launch
    4: real_smoke_one_dataset_one_cell_base_plus_one_feature_arm
    5: if_gates_pass_run_m1a_one_seed_screen
    6: build_dataset_x_regime_x_family_trained_effect_map
    7: propose_not_launch_m1b_survivor_expansion
    8: hard_stop
  classification_definitions_for_step_6:
    PROMOTED: "admissible under selection_rule AND validation R@5 improvement exceeds the material threshold, uncertainty not overlapping zero"
    PARETO_MATCH: "admissible under selection_rule, improvement inside the tolerance band either direction"
    NO_EFFECT: "inside the tolerance band on every metric, no systems cost advantage either"
    REGIME_SPECIFIC: "PROMOTED or PARETO_MATCH in exactly one of R1/R2/R3 for a given dataset, NO_EFFECT or HARMFUL in the others"
    DATASET_SPECIFIC: "PROMOTED or PARETO_MATCH on exactly one dataset at a given regime, NO_EFFECT or HARMFUL elsewhere"
    HARMFUL: "validation R@5 regression exceeds the material threshold, uncertainty not overlapping zero"
