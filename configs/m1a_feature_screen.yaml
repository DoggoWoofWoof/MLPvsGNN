# M1A -- one-seed trained feature screening. First TRAINED phase in this track.
#
# Status: DECLARED_NOT_LAUNCHED. Filed before any M1 number exists.
#
# M0A -> M0A.1 -> M0B -> M0C established, entirely zero-training, that:
#   - A64 admission determines which nodes become scoreable (candidate
#     eligibility), independent of graph context size.
#   - R3_BOUNDED (U3 = U2 union A64) isolates that eligibility repair from
#     M0B's R3 re-expansion confound: bit-exact same C3, same recovered
#     gold, statistically flat context vs. R2.
#   - GEOMETRY/SUPPORT/PATH/DIFFUSION/TOPOLOGY gain no additional
#     wide-context material moving R2 -> R3_BOUNDED. That is an
#     availability finding, not a learned-value finding -- M0C fits no
#     model (docs/M0C_BOUNDED_R3_RESULTS.md, the corrected conclusion).
#   - NODE ROLE carries the scoreability signal at R2-level context cost,
#     itself equally untested for learned usefulness.
#
# M1 is the first phase that fits anything. Its job is not to re-run the
# D-series' 2Wiki-only catalog verdicts, and not to compare against a GNN
# yet -- it is a dataset x regime TRANSFER screen: take the frozen 9-family
# catalog (measured only on 2wiki_clean, CAND regime) and the M0C map
# (which regimes/families have a reason to be tested at all), and find out
# which families actually move a trained QLS/MLP ranker, on which dataset,
# under which of the three frozen regimes below.
#
#   R1 -- HISTORICAL                    scored=Cq   context=G[Cq]
#   R2 -- GRAPH REPAIR                  scored=Cq   context=U2=TARGET_H1(Cq)
#   R3 -- BOUNDED STRUCTURAL SCOREABILITY  scored=C3=Cq∪A64  context=U3=U2∪A64
#
# frozen verbatim as canonical for all trained work from this point forward.
# R3_FULL_REEXPANSION (=TARGET_H1(C3)) is cited only, never trained here or
# anywhere in M1.

amendments:
  - date: 2026-09-04
    change: >-
      base.semantic_rung changed from S2 (primary, 0 params) to S3
      (primary, 1536 params); S2 retained as semantic_controls.S2, a later
      minimality ablation not multiplied through the 44-arm matrix. User
      decision, causal rationale (avoid rewarding structural families for
      compensating for an artificially fixed semantic branch), made before
      step 3 (compute estimate). Does not change the 44-cell/arm matrix,
      feature-family choices, R1/R2/R3 definitions, A64, seed count,
      metrics, or selection thresholds. See base.semantic_rung.why_s3_now_primary.
  - date: 2026-09-04
    change: >-
      Step 3 (compute estimate) executed, per explicit user instruction to
      proceed directly after the S2->S3 amendment. Pure-compute projection
      only, from real measured inputs -- see compute.derivation below.
      Floor 4.032 GPU-h (~$9.04 conservative / ~$6.55 blended); non-binding
      E2-anchored sanity range up to ~16.9 GPU-h (~$38). This is NOT a
      filed ceiling -- compute.ceiling_filed stays false; the real ceiling
      still waits for step 4's real smoke measurement per compute.
      ceiling_derivation_discipline. this_file_authorises extended to
      include step 3; step 4 (smoke) and beyond remain unauthorised.
  - date: 2026-09-04
    change: >-
      Corrected reuse_contract.reused_as_is.trainer_core and added
      model_architecture below, before any step-4 code was written. Reading
      ExplicitFeatureMLP.forward_explicit directly (operator_models.py:
      368-401) during step-4 preparation found it always applies its own
      learned 768->64 node/query projection (98,304 params -- qls_v2_
      semantic.py's own module docstring names this exact projection as
      the thing the S0-S3 ladder exists to question) plus four projection-
      derived interaction features, before any structural_features concat.
      Reusing _build_model's "sa_mlp" branch as originally filed would put
      that fixed 98,304-param block in every arm regardless of
      semantic_rung, confounding the S2-vs-S3 (0 vs 1,536 param) contrast
      this same amendment list's first entry was designed to make legible.
      _fit/_score_once/_prepare_batch remain reused unmodified (a new model
      need only match forward_explicit's signature); only model construction
      changes. No cell/arm/regime/family/threshold changes. See
      model_architecture.why_not_explicit_feature_mlp.
  - date: 2026-09-04
    change: >-
      User explicitly authorised step 4 (the real one-cell/two-arm smoke,
      hotpotqa_clean x R3 x {BASE, BASE+NODE_ROLE}) in chat, in the same
      instruction that ordered step 3 executed without a further review
      stop: "if the estimate is inside the filed compute policy, execute
      the previously declared BASE + one-feature real smoke; if smoke
      invariants and runtime pass, proceed to the one-seed M1A screen;
      otherwise stop at the corresponding gate." Step 3's estimate (see
      compute.derivation above) is inside the filed compute policy -- a
      $9.04 conservative / $6.55 blended floor for the full 44-arm screen,
      with a non-binding $38 sanity ceiling, both small in absolute terms
      and consistent with this track's own M0B/M0C-scale precedent -- so
      this amendment executes the first half of that instruction:
      this_file_authorises is extended to include step 4 unconditionally.
      Step 5 (the real one-seed M1A screen) remains a SEPARATE, event-
      conditional authorisation -- granted only once step 4's own smoke
      invariants and runtime are actually measured and pass, not granted
      pre-emptively here. the_real_m1a_screen_launch_step_5 therefore stays
      listed under does_not_authorise until a further amendment records
      that step 4 passed. Before this amendment, the runner script
      (scripts/run_m1a_feature_screen.py) and its local test suite
      (tests/test_run_m1a_feature_screen.py, 21 tests) were already written
      and passing against synthetic data, and the full repo suite (5989
      tests) was confirmed clean -- the "validate cheaply first" discipline
      -- with zero Modal contact for M1A up to this point. This amendment
      is what authorises the first real Modal spend for M1A.
  - date: 2026-09-04
    change: >-
      Post-smoke accounting correction to base.semantic_rung.learned_
      parameters and semantic_controls.S2.later_use, filed after the real
      step-4 smoke (hotpotqa_clean x R3 x {BASE, BASE+NODE_ROLE}) actually
      ran on Modal. Sequence: filed expectation 1,536 (= 2 x 768, this
      file's amendments above and tests/test_m1a_declaration.py both
      instantiated SemanticHead(rung="S3") without an explicit dim=,
      silently inheriting qls_v2_semantic.EMBEDDING_DIM's module default) /
      smoke observation 3,072 (both arms) / root cause: the real frozen
      M1A payload is 1,536-dimensional, not 768 -- independently
      corroborated by configs/m0a_probe.yaml's own "frozen feature_dim of
      1536" (filed for a wholly separate, earlier zero-training phase) and
      docs/QLS_V1_COMPONENT_AUDIT.md's "2x1536x64" historical QLS-v1
      projection figure / corrected contract: semantic_parameter_formula
      = 2 * embedding_dim, frozen_embedding_dim (M1A) = 1536, therefore
      learned_parameters = 3072. The deployed runner
      (scripts/run_m1a_feature_screen.py) was never wrong: it already
      built SemanticHead from node_embeddings.shape[1] (the real loaded
      data), not from the module default -- see
      base.semantic_rung.embedding_dim_derivation below. No fitted architecture,
      candidate set, feature tensor, training result, or metric changed
      because of this correction; the smoke JSON
      (outputs/m1a_feature_screen/smoke/hotpotqa_clean.json) is untouched
      and was not rerun. This is a declaration/test correction only,
      methodologically sound because step 4 was explicitly a pipeline-
      validation smoke, not the scientific feature screen (see the eight-
      step plan, docs/M1A_FEATURE_SCREEN_PROTOCOL.md#13). qls_v2_semantic.
      EMBEDDING_DIM (768) is deliberately NOT changed by this amendment --
      it is a separate module's historical default, used elsewhere, out of
      scope here; M1A instead becomes explicitly dimension-aware via the
      new frozen_embedding_dim field below plus a live run()-time guard
      (base.semantic_rung.embedding_dim_derivation) so no M1A code path can silently
      fall back to that default again. Once the corrected gate verifier
      confirms all step-4 gates pass against the existing (unmodified)
      smoke artifact, the result is recorded as M1A_STEP4_SMOKE =
      PASS_AFTER_ACCOUNTING_CORRECTION, not plain PASS, so this provenance
