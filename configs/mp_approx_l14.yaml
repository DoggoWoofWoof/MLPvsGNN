population:   # the scored rows: the read carve r, all of them metaqa train-split rows
  rule: >-
    Level 12's carve rule (configs/mp_approx_l12.yaml#carves.rule), unchanged: the train split's sorted ids (N), the
    select stride s_sel, the ids outside it (remaining) and the fit stride s_fit, recomputed and checked against the pins.
    r is remaining[i] for every position i with i mod s_fit in {8, 9}, in position order: the union of the fit stride's
    offsets 8 and 9, which no level has read. Its population is m3b_compile.population's train branch, line for line, on
    those ids (level 12's carve_population): the golds by m3a.resolve_gold, and an id with no gold leaves. The rule reads
    only ids and the strides.
  offsets: [8, 9]
  pin: carves.pins.r
  hops: {1: 3480, 2: 4306, 3: 4134}   # 11,920 rows; no id has zero golds
  why_train_split_rows: >-
    No hop-1 V2_GATE dev row is left, and the 644 hop-2 and 473 hop-3 that are left are too few to read every hop at
    level 13's precision. The train split holds 329,282 rows. The twin and the GNN trained on its fit carve and selected
    on its select carve, and levels 12 and 13 fitted on those and on x1 to x7. No model trained or selected on, and no
    level read, the fit stride's offsets 8 to 54, and r takes two of them. On r, the twin's, the GNN's and every arm's
    metrics are all measured on rows none of them saw, so the comparison is paired and out of sample for all of them.
  exchangeability: >-
    MetaQA's train and dev questions come from one generator. The design looks found r no closer to the training carves
    than the dev rows are (design_informed_by). The read files r's twin and GNN metrics beside those of level 12's and
    level 13's dev rows and of level 12's carves (quantities.anchors.exchangeability). A reading on r is a reading on
    train-split rows, and it is named so beside every number. It is not a dev-split or a test-split reading.
  budget: >-
    After this file, the fit stride's offsets 10 to 54 (45 strides of 5,960 rows) stay unread, and so do 644 hop-2 and
    473 hop-3 V2_GATE dev rows. A later level that draws from them says in its own file how it draws.
  folds: >-
    The carve pass stores level 0's fold_of and is_inner on every row, as on level 12's carves, and level 9's View checks
    them. The units do not read them: every row of r is in the one scored set (units.roles).
  gold: >-
    The in-pool golds are m3b_compile.gold_local_of's, as on every carve. A row with no in-pool gold is scored and read,
    but it enters no fit.
  why_disjoint: >-
    r is disjoint from level 12's nine carves by the stride: the population check recomputes all ten sets and refuses
    any shared id, and the check stage compares r's ids with every assembled carve's. r holds no V2_GATE row. b0 was
    chosen from a look at level 12's dev rows, which are not in r.

