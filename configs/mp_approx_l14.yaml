registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, how much of the GNN's gain over its twin does level 12's non-message-passing typed-walk model recover when
  it is fitted, selected and scored on its bucket-0 walk types only (b0), at the GNN's own labels? It reads rho on
  recall@5, full_coverage@5 and hit@1 of the primary arm TW-1x-b0, against the twin and the GNN of each seed pair, on r:
  11,920 metaqa train-split rows (3,480 of hop 1, 4,306 of hop 2 and 4,134 of hop 3) that no model was trained or
  selected on and no level has read. As paired contrasts on the same rows it reads what b0 adds over b1d (level 13's
  primary score) at 1x and at 4x the labels, what b1d adds over dsh, and what 4x the labels add under each score; the
  first two also per hop. Two references bound the arms. The non-backtracking true-chain oracle (NB-oracle) bounds what
  choosing the right chain can give, and its bucket-0 form (NB-oracle-b0) bounds it for a model that reads bucket-0
  types only. It also reads the first arm at which no readable metric stays below the GNN.
role: >-
  Measurement, as at levels 8 to 13. The objects are non-message-passing models fitted to gold labels of the metaqa train
  split and read on train-split rows that neither they, the twin nor the GNN saw. No GNN output enters any fit, target,
  loss or selection. The twin's z-scored output is the base score, as at every level. TW-1x is fitted and selected under
  the GNN's own metaqa labels and carves, as at levels 12 and 13. It is still a measurement, not a deployable or
  selected model. No model, number or reading of this file enters QLS-U, the twin, a feature contract, M3, M4 or any
  selection. A deployable model of this form would be a competitor under the QLS-U contract on every dataset, with its
  compiled form timed, and it would need its own declaration. This file does not open one, and it opens no later level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code, as at levels 8 to 13
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    Level 12's argument (configs/mp_approx_l12.yaml#boundary) holds for every unit unchanged: the model, the walks, the
    reach sets, the set likelihood, the fits and the dsh score are level 12's, and b1d is level 13's. b0 is one fixed
    filter, applied to every part of a deploy view before the fit. Each query keeps the walk types whose bucket digit is
    0, and the null type. The filter reads the bucket digit of each type's code, which is part of the discrete type, and
    nothing else: no edge, no neighbour's embedding, score or state, and no gold. It has no trainable parameter, and it
    is applied once. The model is then fitted, and its settings chosen, by level 12's procedure on what is left.
  what_it_is: >-
    The function class is a query-weighted count of typed walks, as at levels 9 to 13. Under b0, a node's structural
    term is a tempered posterior's average of the uniform reach sets of the walks that start from the dense and splade
    rank-1 seeds, and the posterior is fitted on those walks only. It has no learned per-edge message, no neighbour state
    and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    As at levels 8 to 13, the walks read only the packed structural message edges the GNN's cell reads: the same pool,
    the same cap of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction
    flags. The ner and knn families are not read. The bucket digit comes from the seed lists the twin and the GNN also
    read: bucket 0 holds the seeds that are the dense or the splade rank-1 node, bucket 1 the other seeds. Under b0 the
    model reads the walks from bucket-0 seeds only, which is less of the graph than the GNN reads.

authorization:
  given:
    - '2026-09-30, the user: "basically i dont want message passing but approximations to it, and pushing it as far as possible and targeting the weakpoints, i think offsets or rope based methods can work because all the stuff is anyways in the semantic space we just need to learn those transformations from the query etc and work from that, and explicit positions so that we have a proper way to represnt, what else do you think we should focus on"'
  how_the_messages_are_answered: >-
    "Targeting the weakpoints" becomes level 13's weak points. At the GNN's own labels the model stayed below the GNN on
    recall@5, and hop 3 was its weakest stratum. The design looks found that b1d's change, made after the fit, leaves
    the null type the argmax on part of the rows, and that fitting on the bucket-0 types alone read higher on hops 2 and
    3 and lower on hop 1. This file reads that one change on a population large enough to read every hop, and keeps
    everything else level 12's and level 13's.
  go_ahead: >-
    Standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  placement_messages:
