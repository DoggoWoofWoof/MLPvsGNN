scoring_pass:   # r; host CPU, score threads; level 12's carve pass, imported unchanged, with four of its module's names rebound in this process
  path: >-
    Level 12's stage_carve (scripts/mp_approx_l12.py), called unchanged, with four names of its module rebound in this
    process only and restored after it: CARVES gains r; carve_ids_of returns r by population.rule and every other carve
    by level 12's own function; verify_inputs becomes this file's; and CONFIG becomes this file's declaration. Its
    population check (carve_population_checked) then recomputes the source, the strides and all ten carves, refuses any
    shared id, checks x_0 through the train-branch lines against m3b_compile.population's fit carve, and checks r against
    its pin and every id as a metaqa train-split id. The whole of r is prepared, and the chunk loop (level 12's
    score_rows: level 8's loop, line for line, with level 9's combined walks), the chunk rule and the assemble are level
    12's. r has no training cache, so no cache is opened. The sidecar is written to outputs/mp_approx_l14/metaqa/.
  integrity: >-
    Level 12's carve pass checks: every prepared seed set equals seeds_of and is in the pool, every structural edge
    carries a relation slot and a direction flag, every walk count is below 2^32 and no ceiling is passed. The metrics of
    T_k and G_k on r are computed, not checked against stored values (placement.proof_per_query).
  shards: twelve processes, --shard i/12 (the chunks ci with ci mod 12 = i), then one process without --shard that assembles

walks: >-
  Level 9's (configs/mp_approx_l9.yaml#walks), unchanged: the std family (level 8's counts) and the nb family
  (non-backtracking counts), compiled in one pass into one sidecar and read back as two views; the per-query checks,
  the null type, the ceilings and level 8's true-chain map. The fits read the nb family only.

check: >-
  Before any fit, the check stage runs level 9's check_family on each family of r's sidecar, imported unchanged: level
  8's direction check (a swapped share above the declared share, in either family, is a hard stop) and level 9's
  anchors, as level 12 files them for a carve. It refuses a smoke sidecar, a sidecar whose meta.json does not name carve
  r and r's ids digest, any id that is not a metaqa train-split id, ids other than r's pin, a q_row other than each
  row's position in r, any query id of the populations of level 0 and levels 8 to 13, any id of level 12's nine carve
  sidecars (each must be assembled, and its ids are checked against its meta.json), and a loopcheck not on file as
  equal.

arms:   # each arm reads z(T_k), the query embedding, the relation text and the nb family's compiled types and counts, nothing else
  model: >-
    Level 12's, unchanged (configs/mp_approx_l12.yaml#arms.model): level 10's NB-set model, level 9's NB-hyb model on
    non-backtracking walks with level 10's set likelihood and its closed-form theta. p(tau | q) is the softmax of
    w(q, .) over the query's nb types in the view and the null type.
  fits: carves.fits
  views:
    full: level 12's deploy view, every nb type, as at levels 12 and 13
    b0: >-
      The same deploy view with every part's nb types filtered before the fit. Each query keeps the types whose bucket
      digit is 0 (code // 28^3 = 0: the walks that start from a seed that is the dense or the splade rank-1 node) and the
      null type, and drops the rest. A query's bucket-0 types are a prefix of its types (codes ascend), and their entries
      are one block; a view in which they are not is a hard stop. The filter is applied alike to the eval part (r), the
      select carve and every fit carve, inside the unit's process only, by rebinding level 9's View to the filtered View
      (the design look's B0View, copied unchanged). Nothing on disk changes.
  procedure: >-
    A full unit is level 13's run_unit (scripts/mp_approx_l13_fit.py, imported unchanged) on the fit's full deploy
    view: level 12's run_unit (level 11's fit_and_capture, which runs level 10's fit_unit for NB-set unchanged, then
    level 11's score_dsh), then level 11's score_dsh on the b1d capture. A b0 unit is level 12's run_unit, called
    unchanged, on the fit's b0 view: fitted, its kept round and its dsh settings chosen, and its rows scored, all on the
    b0 view. Its dsh score is this file's b0 score. b1d is not computed on a b0 view, where no bucket-1 type is left
    and it would equal dsh bit for bit.
  scores:   # s_k(v) = z(T_k)(v) + kappa log(n_q m_beta(v) + eta)
    dsh: level 11's sharpened mixture (configs/mp_approx_l11.yaml#arms.scores.dsh) on the full view, as levels 12 and 13 score it
    b1d: level 13's (configs/mp_approx_l13.yaml#arms.scores.b1d), on the full view's capture
    b0: level 11's sharpened mixture of a b0 unit, a model fitted and selected on the bucket-0 types only
  selection: >-
    Level 11's (configs/mp_approx_l11.yaml#arms.selection), on the select carve's rows with an in-pool gold, for each
    score on its own: beta in {1, 1.5, 2, 3, 4, 8, infinity}, kappa in {1/32, 1/16, 1/8, 1/4, 1/2, 1, 2, 4, 8, 16} and
    eta in {0.01, 0.1, 1, 10, 100} chosen together by the mean of recall@5, full_coverage@5 and hit@1. Ties go to the
    smaller beta, then the smaller kappa, then the larger eta. A b0 unit chooses on its own view.
  read_arms:   # arm: [fit, score]; in this order
    TW-1x-dsh: [TW-1x, dsh]
    TW-1x-b1d: [TW-1x, b1d]
    TW-1x-b0: [TW-1x, b0]   # the primary arm: the GNN's metaqa labels and carves
    TW-4x-dsh: [TW-4x, dsh]
    TW-4x-b1d: [TW-4x, b1d]
    TW-4x-b0: [TW-4x, b0]
  references:
    NB-oracle: level 8's oracle rule on r's nb view (R*, the true chain's reach set from the bucket with the larger Jaccard with the golds, plus 1e6), as at level 13
    NB-oracle-b0: >-
      the true chain's bucket-0 reach set on r's nb view (the bucket-0 part of level 8's chain_reach), plus 1e6; empty,
      and so no bonus, when the query has no bucket-0 walk of the true chain. It bounds what choosing the right chain
      can give a model that reads bucket-0 types only.
  not_arms: >-
    Level 10's cov score is still computed inside fit_unit and kept in the unit arrays of both views, and it is not
    read. The design look's changes made after the fit (b1renorm, b1tob0) are not arms.

em: >-
  Level 10's, unchanged (configs/mp_approx_l10.yaml#em), as at levels 12 and 13. On a deploy view, the minibatches, the
  E-step and theta's sums run over the fit's training rows with an in-pool gold, and the per-epoch early stopping and the
  kept round read the select carve's rows with an in-pool gold. On a b0 view they run over its types.

units:
  deploy_view: >-
    Level 12's deploy view with one part's check changed. It is level 11's MultiView, imported unchanged, of the parts
    eval (r's sidecar), select, then the fit's carves in the order of carves.fits, with the folds and inner flags then
    set by role (level 12's with_roles). The select and fit parts are level 12's part_view, called unchanged on level
    12's carve sidecars. Each has passed its carve check (both direction checks) on the meta.json it now has, is level
    9's View with its checks on, is not a smoke run, and has its pinned ids, count and hops. The eval part is this
    file's. r's sidecar has passed this file's check (both direction checks) on the meta.json it now has, is level 9's
    View with its checks on, is not a smoke run, names carve r and r's ids digest, and has r's pinned ids, count and
    hops, every id a train-split id.
  roles:   # part: [q_fold, q_inner] -> its set in level 8's unit_queries at fold 0 (level 12's, unchanged)
    eval: [0, 0]          # r: the scored set; never a fit or inner row
    select: [-1, 1]       # the inner set (rows with an in-pool gold); never scored
    fit_and_x: [-1, 0]    # the fit set (rows with an in-pool gold); never scored
  per_fit: >-
    One unit per (view, fit, k) at fold 0, for the views full and b0, the fits TW-1x and TW-4x, and k = 0, 1 and 2: 12
    units. Each is its view's procedure (arms.procedure), so its seeds and its fit are level 12's. Every unit reads its
    own seed's twin, z(T_k), on the inner and scored rows only.
  type_table: As at level 12 (configs/mp_approx_l12.yaml#units.type_table), on the view's types; a b0 view's table holds bucket-0 codes only.
  unit_files: >-
    Each unit is written atomically, to units/<view>/<fit>/k<k>_f0. A full unit holds level 13's arrays and fit log, and
    a b0 unit level 12's. Both add the view and the fit. A unit already written is skipped on a restart.
  repeat: >-
    The unit (b0, TW-1x, k = 0), which the primary reads, runs again in a fresh process, into repeat/. Its arrays and
    fit log are compared bitwise with the first run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule. T_k's and G_k's values on r are the carve pass's (placement.proof_per_query).
  rho_readable_rho_bar_gap: >-
    As at levels 8 to 13: rho_M = (mean over k and rows of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)). A metric is
    readable when its denominator's 95% interval lies above 0. rho_bar is the mean of rho_M over the readable metrics,
    and gap_to_gnn is the mean of M(arm_k) - M(G_k) per metric.
  strata: per hop (1, 2, 3); a stratum's rho is read only if its own denominator interval lies above 0
  anchors:   # descriptive
    level9_anchors: level 9's check anchors on each view of r's sidecar and of every carve read (fit, select, x1, x2, x3)
    carve_metrics: per carve read and on r, the mean over k of recall@5, full_coverage@5 and hit@1 of T_k and G_k
    exchangeability: >-
      r's carve_metrics beside those of level 12's dev rows and carves (fit, select, x1 to x7) and of level 13's dev
      rows, from their pinned read.json (inputs.earlier_reads); the twin and the GNN trained on the fit carve and
      selected on the select carve, and saw none of the other populations
    training_rows: per fit and view, the fit and inner rows with an in-pool gold, by part and in total
    unseen_sequences: >-
      Per fit and view, the number of distinct walk token sequences among r's types that occur on none of the fit's
      training rows, and the share of r's rows whose true chain's sequence occurs on none of them
    agreement: >-
      Per fit and view, the share of r's rows on which the argmax type has the true chain's token sequence, with the
      bucket ignored; per k, then the mean over k; overall and per hop. A null argmax does not agree.
    genre_agreement: the same share, on r's rows whose qtype's last kind is genre
    gap_split: >-
      For TW-1x-b1d and TW-4x-b1d against NB-oracle, and for TW-1x-b0 and TW-4x-b0 against NB-oracle-b0: (reference -
      arm) per metric, summed over the (row, seed) pairs on which the fit's argmax sequence is the true chain's, and
      over those on which it is not, each divided by the seed count and the metric's summed denominator; the mean over
      the readable metrics; overall and per hop.
    theta: per fit and view, the kept theta (rho_1, rho_2, rho_3, eps_s), the mean, minimum and maximum over units
    grid_edges: per read arm, the number of units whose kappa or eta sits at an end of the grid, and the number whose kept round is the last
    beta_choices: per read arm, the number of units that choose each beta
    b1d_moved: per fit, the mean over the full units of the inner and scored rows with a bucket-1 type and of the posterior mass b1d moves to the null type on the scored rows
    b0_view: >-
      On r's nb view: the mean nb types and walk entries per row, the same over the bucket-0 types, and the share of
      rows with no bucket-0 type; overall and per hop
    reaches_gnn: >-
      The first read arm, in the order of arms.read_arms, with no readable metric flagged BELOW_GNN, with its fit's
      training rows; none when every one has such a metric or no metric is readable

statistics:
  bootstrap: >-
    Level 0's bootstrap over r's rows: rows resampled with replacement, 1000 resamples, numpy default_rng(0) (level 0's
    boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample matrix serves
    every quantity, so contrasts are paired. A stratum's quantities use the same matrix restricted to its rows. The
    intervals resample the scored rows. They do not resample the training carves or the fits.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    b0_adds: TW-1x-b0 - TW-1x-b1d
    b0_adds_4x: TW-4x-b0 - TW-4x-b1d
    b1d_adds: TW-1x-b1d - TW-1x-dsh
    b1d_adds_4x: TW-4x-b1d - TW-4x-dsh
    data_4x: TW-4x-dsh - TW-1x-dsh
    data_4x_b1d: TW-4x-b1d - TW-1x-b1d
    data_4x_b0: TW-4x-b0 - TW-1x-b0
    ceiling_gap: NB-oracle - TW-1x-b1d
    ceiling_gap_b0: NB-oracle-b0 - TW-1x-b0
    ceiling_gap_b0_4x: NB-oracle-b0 - TW-4x-b0
    bucket_ceiling: NB-oracle - NB-oracle-b0
  hop_contrasts: >-
    b0_adds and b1d_adds per hop (1, 2, 3), each the paired difference of the stratum's rho_bar under the same resample
    matrix; read only where the stratum has a readable metric

readings:   # filed before any number
  primary: TW-1x-b0
  bands:   # of rho_bar; the first that applies; the same thresholds as levels 8 to 13
    L14_ABOVE_GNN: the interval's lower end is above 1
    L14_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L14_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L14_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: NB-oracle-b0's rho_bar interval upper end <= 0.50 (the primary's own ceiling)
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
    GRID_EDGE: more than half of the primary's 3 units choose kappa or eta at an end of the grid
    THETA_AT_CLIP: a unit's kept theta has a component at a clip bound (the units are listed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l14_above_gnn: >-
      Primary L14_ABOVE_GNN. On r, a non-message-passing model fitted on the GNN's own metaqa labels and on the bucket-0
      walk types only scores above the GNN on the readable metrics on average. It reads compiled non-backtracking typed
      walks from the dense and splade rank-1 seeds and the relation text.
    l14_high: primary L14_HIGH -- at the GNN's own labels, the b0 model recovers most of the GNN's gain on r
    l14_mid: primary L14_MID -- at the GNN's own labels, it recovers part of the gain
    l14_low: primary L14_LOW -- at the GNN's own labels, it recovers little of the gain; read it with CEILING_LOW and the agreement anchor
    matched_below_gnn: the primary has a readable metric flagged BELOW_GNN -- at the GNN's labels, the model stays measurably below the GNN on that metric
    matched_not_below_gnn: no readable metric of the primary is flagged BELOW_GNN -- at the GNN's labels, the model is not measurably below the GNN on any readable metric
    b0_adds: the b0_adds interval lies above 0 -- fitting on the bucket-0 types adds over dropping bucket 1 after the fit, at the GNN's labels
    b0_hurts: the b0_adds interval lies below 0
    b0_adds_4x: the b0_adds_4x interval lies above 0 -- it still adds at four times the labels
    b0_hurts_4x: the b0_adds_4x interval lies below 0
    b1d_adds: the b1d_adds interval lies above 0 -- level 13's change adds on r at the GNN's labels
    b1d_hurts: the b1d_adds interval lies below 0
    b1d_adds_4x: the b1d_adds_4x interval lies above 0
    b1d_hurts_4x: the b1d_adds_4x interval lies below 0
    data_adds_4x: the data_4x interval lies above 0 (under dsh)
    data_adds_4x_b1d: the data_4x_b1d interval lies above 0 (under b1d)
    data_adds_4x_b0: the data_4x_b0 interval lies above 0 (under b0)
    b0_ceiling_binds: the bucket_ceiling interval lies above 0 -- reading bucket-0 types only lowers what the right chain can give
    chain_not_identified: the primary fit's agreement on the b0 view below 0.5 with ceiling_gap_b0's interval above 0 -- the chain is not learned from the question
    b0_adds_hop1: the hop-1 b0_adds interval lies above 0
    b0_hurts_hop1: the hop-1 b0_adds interval lies below 0 -- the design look's hop-1 loss holds on r
    b0_adds_hop2: the hop-2 b0_adds interval lies above 0
    b0_hurts_hop2: the hop-2 b0_adds interval lies below 0
    b0_adds_hop3: the hop-3 b0_adds interval lies above 0
    b0_hurts_hop3: the hop-3 b0_adds interval lies below 0
  wording: >-
    TW-1x is label-matched to the GNN on metaqa: its fit rows are the GNN's metaqa fit carve, its settings are chosen on
    the GNN's select carve, and it is read on train-split rows that neither model saw (r). The GNN also trained on 2wiki's
    and squad's fit carves, which hold no metaqa label. TW-4x fits on four times as many metaqa train-split labels as the
    GNN, the GNN is not refitted on them, and its readings name its label count; none is a matched comparison. r is
    train-split rows, not dev rows. Every number here is named a reading on r, and it is never set beside a dev-row
    number as one quantity; level 13's dev-row numbers are quoted beside this file's only with their population named.
    b0 was chosen from a look at level 12's dev rows, where it read +0.021 [-0.009, 0.051] over b1d with a loss on hop
    1. The file measures what non-message-passing typed-walk models recover of the GNN's gain on r. It is never a
    deployable or selected model, and it says nothing about another dataset. b0 reads the walks from two of the seeds
    only, so it reads less of the graph than the GNN reads. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins". rho here is level 8's quantity. It is not the
    within-U_q oracle rho of levels 0 to 7, and the two are never set side by side as one quantity.

compute:
  scoring: >-
    11,920 rows in twelve shards of about 993. Level 12's carve shards scored 1,485 to 1,496 rows in 2,669 to 4,459 s,
    so a shard should take about 30 to 50 min, with all twelve at once when the host has room.
  fits: >-
    Level 13's TW-1x units took about 12.7 min and its TW-4x units about 22.4 min with 2,000 rows scored; scoring 11,920
    adds a few minutes per score. So about 15 to 25 and 25 to 35 min for the full units. The design look's b0 units took
    about 7.3 min, so about 10 to 15 and 15 to 25 min here.
  storage: >-
    r's sidecar, about twice one of level 12's carve sidecars, and the units, each holding its scores' per-node arrays
    (about 0.2 GB per score); about 15 GB on the host. The carve sidecars are read in place.
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the source, the strides or any of the ten carves differ from the pins or from carves_for, two carves share an id, a
    row of r is not a metaqa train-split id, or a V2_GATE row, a held row or a test row would be scored
  - any integrity check of scoring_pass fails, or level 12's loopcheck is not on file as equal
  - any hard stop of level 9's walks or check
  - the relation table differs from the pinned embeddings or vocabulary order
  - a set likelihood's theta or marginal log-likelihood is not finite
  - >-
    a deploy view's part has not passed its check, is a smoke run, its meta.json or one of its arrays is not what its
    pins and meta.json record, its arrays do not line up with the view's, or a row's set is not its role's (a carve row
    scored, a row of r fitted)
  - a b0 view holds a type outside bucket 0, or a query's bucket-0 entries are not one block
  - level 10's two calls of score_fold in a unit did not receive the same log-probabilities
  - the host jobs' recorded code sha256 values are not one value per module equal to the committed files

outputs:
  scripts: >-
    scripts/mp_approx_l14.py (stages score [--shard i/n], assemble and check; r's rule, the rebound carve pass and the
    pins) and scripts/mp_approx_l14_fit.py (stages fit --view V --fit F --k K, repeat, read, doc and file; the deploy
    views and b0)
  sidecars: >-
    outputs/mp_approx_l14/metaqa/, on the host: r's per-query and per-node arrays, the walk entries of both families,
    qids.json, meta.json (the sha256 of every array), check.json, units/<view>/<fit>/, repeat/ and read.json
  record: outputs/mp_approx_l14/record.json, assembled on the laptop without arithmetic from the fetched read.json, check.json and meta.json files
  document: docs/MP_APPROX_L14.md
  run_record: run_record_mp_approx_l14_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l14.py and tests/test_mp_approx_l14_fit.py, run on the host in rx env mpr-cpu
  - this file parses, its pins are the files' current sha256, level 13's inputs and level 12's carve pins are copied unchanged, and the declared constants are the scripts'
  - r's rule on toy strides is the union of offsets 8 and 9 in position order, disjoint from every other carve, and every other carve is level 12's function's
  - >-
    the rebound carve pass restores level 12's names after it runs, on success and on an error, and reads this file's
    carves, rule, pins, declaration and paths inside it
  - >-
    the check on synthetic sidecars, and its refusals: a smoke, a sidecar not r's, a non-train id, ids other than the
    pin's, a q_row out of order, an earlier level's id, an id of one of level 12's carves, an unassembled carve, a
    loopcheck not equal and a failed direction check
  - the eval part's refusals: no check, a failed direction check, a changed meta.json, a smoke, and ids other than r's pin
  - >-
    the b0 view on toy sidecars: only bucket-0 types are kept, the per-query pointers and entry blocks agree, and a
    query with no bucket-0 type keeps the null type only; a view whose bucket-0 entries are not one block is refused
  - a full unit equals level 13's run_unit on the same view bit for bit, and a b0 unit level 12's run_unit on the b0 view
  - >-
    permuting the scored rows' golds, the other seeds' twins and the stored metrics changes none of a unit's dsh, b1d
    or b0 scores (each arm's inputs are only z(T_k), q, the relation text and the view's types and counts)
  - bands, reaches_gnn and the interpretation (per hop included) on toy cases, and the contrasts are the declared pairs
  - the fit, repeat, read, doc and file stages run end to end on synthetic sidecars

execution:
  order: >-
    This file alone (commit). Then scripts/mp_approx_l14.py and tests/test_mp_approx_l14.py (commit), run first on the
    laptop with scratch outputs that make no number, then on the host, with r's twelve score shards submitted at once
    beside them. The assemble and the check follow as the shards finish. In parallel, scripts/mp_approx_l14_fit.py and
    tests/test_mp_approx_l14_fit.py (commit) and those tests on the host. Once r is checked, the twelve units and the
    repeat run at once. Then the read. Then fetch the read, check and meta files, and on the laptop build the record,
    the doc and the run record (commit).
  stop_after_run: STOP_FOR_REVIEW

