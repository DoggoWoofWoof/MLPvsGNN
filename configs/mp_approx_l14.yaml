this_file_does_not_touch:
  fits: >-
    No GNN or twin is fitted or refitted, on any carve. The pilot's six checkpoints are read. Only this file's arms are
    fitted, and they are measurement models.
  rows: >-
    r is train-split rows, so it holds none of level 0's 2,400 metaqa rows and none of the dev rows of levels 8 to 13,
    which are V2_GATE rows; a check refuses any of them. None of their sidecars is read, except level 12's carve sidecars
    (carves.sidecars). V2_HELD_CONFIRMATION is never read, and no dev row or test row is read. The train-split rows
    scored here are r's 11,920. The training rows are level 12's carve sidecars, read in place, and no row of level 12's
    nine carves is in r.
  frozen: >-
    M2-M3B, universal-v2 (its training caches included), UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU
    task-level qualification, the six-dataset base, DEPLOY_CK_2WIKI, DEPLOY_CK_FULL_2WIKI and levels 0 to 13 all keep
    their bytes: declarations, scripts, tests, caches, sidecars, probes, records and documents. The design looks keep
    theirs. The scripts of levels 8 to 13 are imported unchanged, and this file's scripts rebind some of their module
    names inside their own processes only. Level 12's carve sidecars are opened read-only and pinned.
  package: >-
    The CRAG package is read-only. On the host, the verified mirror stands in for it in memory only. Nothing is written
    under either root, and nothing from them enters git.
  competitors: no arm output, type weight, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:
  where: >-
    The host CPU, through tools/rx (docs/GPU_HOST_HANDOVER.md), in rx env mpr-cpu (torch 2.8.0+cpu, numpy 2.3.2, the
    laptop's pinned closure), Windows native. No GPU is used, and scipy and numba are not used. The tests run there too.
  why_the_host: >-
    The user's placement messages. Level 12's carve sidecars are on the host, and the units read them in place, so no
    sidecar moves.
  package: As at level 12 (configs/mp_approx_l12.yaml#placement.package), through the pinned verify_metaqa.json.
  threads:
    score: 6 torch threads and BLAS and OpenMP pools of 6, set before numpy loads, for r's scoring pass and its assemble (level 12's carve pass counts)
    fit_and_read: 4 torch threads and pools of 4, with torch's deterministic algorithms (level 8's fit_process), for the check, the units, the repeat and the read
  reservations: >-
    Each job reserves what the same kind of job measurably used at levels 12 and 13 (rx status: cpu_s over wall time and
    peak memory), scaled where r is larger, plus a small margin. A score shard reserves 2 CPUs and 3.1 GB. Level 13's dev
    shards ran at 1.94 to 2.0 CPUs and peaked at 2.42 to 2.87 GB, and level 12's carve shards ran at 1.79 to 1.87 CPUs
    and peaked at 2.84 GB. Every shard prepares the whole carve, and r has twice a carve's rows, which adds an estimated
    0.1 to 0.2 GB. The assemble reserves 1 CPU and 3.1 GB: it also prepares the whole carve, and level 12's carve
    assembles reached 3.05 GB of working set. The check reserves 1 CPU and 1.25 GB (level 12's carve checks reached 0.73
    GB of working set on 5,960 rows). The full TW-1x units reserve 1.15 CPUs and 2.25 GB, and the full TW-4x units 1.35
    CPUs and 2.75 GB. Level 13's ran at 1.14 to 1.15 and 1.33 CPUs and peaked at 1.03 to 1.04 and 1.61 GB, on views of
    9,457 and 27,337 queries with 2,000 scored; here the views hold 19,377 and 37,257 queries with 11,920 scored. Level
    12's and level 13's units grew about 0.037 GB per 1,000 view queries, and each score's per-node array adds about
    0.017 GB per 1,000 scored rows. The b0 TW-1x units and the repeat reserve 1.1 CPUs and 1.6 GB, and the b0 TW-4x
    units 1.25 CPUs and 1.9 GB. The design look's b0 units ran at 1.08 CPUs and peaked at 0.76 GB on a 9,678-query view
    with 2,221 rows scored, and a b0 unit keeps two per-node scores (cov and dsh) where a full unit keeps three. The read
    reserves 1 CPU and 1.1 GB: it holds two of the repeat's per-node arrays at a time, about 0.2 GB each. Each test job
    reserves 1 CPU and 0.4 GB (level 13's peaked at 0.22 and 0.36 GB). rx reserves without capping, and every process
    fixes its own pools at start, so a reservation changes no number. Jobs whose inputs exist are submitted at once, so
    they run in parallel under mpr's priority, and nothing running is preempted. A job that waits on others is submitted
    by a local waiter once its inputs exist, so a waiting job holds no reservation. Measured against reserved goes into
    the run record.
  proof_per_query: >-
    r's rows have no stored per-query metrics: the pilot never evaluated on them. So the twin's and the GNN's metrics on
    r are computed by the carve pass's six forwards, as on level 12's x carves, and nothing stored is checked against
    them. Level 12's loopcheck (inputs.level12_loopcheck) ran the carve loop on 24 dev rows whose metrics the pilot
    stored. Their stored metrics were checked as level 8 checks them, and every array of level 8's ARRAY_KEYS equalled
    level 8's pass by dtype, shape and bytes. Its record is pinned, and it must be on file as equal before any fit. The
    carve sidecars were checked by level 12 (its carve pass and carve check) and are pinned by their meta.json and
    check.json. Each of their arrays is checked against its meta.json when a deploy view opens it.
  host_native: >-
    Every arm and reference is fitted, scored and read on the host CPU, and the twin's and the GNN's metrics on r are
    computed there. No number of this file is set beside a number made on the laptop.
  identical_code: >-
    Every host job runs from a commit of this phase and records the LF sha256 of every repository module it imports.
    The file stage checks that each module has one value across all jobs, equal to the file at the commit it names.
    scripts/mp_approx_l14.py is committed first and is not edited after that commit. scripts/mp_approx_l14_fit.py
    follows in a second commit, and the score, assemble and check jobs never import it.
  laptop_steps: the doc and file stages, which make no number

