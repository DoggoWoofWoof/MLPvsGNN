track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  Level 13 (configs/mp_approx_l13.yaml, RUN at 0fc7feb). On 2,000 fresh metaqa hop-2 and hop-3 V2_GATE dev rows, level
  12's non-message-passing typed-walk model, with its bucket-1 walk types' probability moved to the null type after the
  fit (b1d), read L13_HIGH: TW-1x-b1d rho_bar 0.967 [0.911, 1.031] at the GNN's own labels. It stayed below the GNN on
  recall@5 (-0.006 [-0.011, -0.001]), and full_coverage@5 and hit@1 did not read. b1d added +0.051 [0.022, 0.080] over
  dsh, and by hop the primary read 1.062 (hop 2) and 0.934 [0.864, 1.010] (hop 3). This file keeps level 12's model,
  level 11's selection and level 12's carves, and changes one thing, before the fit: b0. Every part of a deploy view
  keeps only its bucket-0 walk types (and the null type), so the model is fitted, selected and scored on them. Every arm
  is read once on a new population, r: 11,920 metaqa train-split rows that the twin, the GNN and every level have never
  trained on, selected on or read. r holds rows of all three hops, so hop 1 is read again.
