  placement_notes:
  - Every job reserved the declared figures (placement.reservations), and rx reserves without capping, so a reservation changes no number.
  - 'Measured against reserved (rx status: cpu_s over wall time, and the peak memory) is under measured_jobs. Peaks above the reservation: full TW-1x units: 2.61
    GB peak against 2.25 GB; full TW-4x units: 3.19 GB peak against 2.75 GB; b0 TW-1x units: 1.75 GB peak against 1.6 GB; b0 TW-4x units: 2.1 GB peak against 1.9
    GB; repeat: 1.75 GB peak against 1.6 GB; read: 1.32 GB peak against 1.1 GB. Reservations well above the peak (more than 1/0.6 of it): tests: 0.22 GB peak against
    0.4 GB; r-assemble: 1.01 GB peak against 3.1 GB; r-check: 0.73 GB peak against 1.25 GB.'
  - 'Why the fit-side jobs peaked above their reservations: placement.reservations scaled level 13''s units by view size and by scored rows, and it under-counted
    what scoring r costs per row (level 13''s units scored 2,000 rows; these score r''s 11,920). The overrun was full TW-1x units +0.36 GB (16%), full TW-4x units
    +0.44 GB (16%), b0 TW-1x units +0.15 GB (9%), b0 TW-4x units +0.2 GB (11%), repeat +0.15 GB (9%), read +0.22 GB (20%). rx reserves without capping, so no job
    was stopped or slowed by its reservation and no number depends on it. The measured peaks under measured_jobs are the basis for the next level''s reservations.'
  - The population module's host tests and r's twelve score shards were submitted at once. The fit module's host tests ran while the shards scored, and the assemble
    and the check followed the shards. The twelve units and the repeat were then submitted together, and the read ran after all thirteen had finished. Every job was
    submitted once.
  - 'The population module''s host tests pushed dfd8088''s tree and r''s twelve score shards ran on it without a push. The fit module''s host tests then pushed 89a79c2,
    which adds only the fit module and its tests, so the assemble and the check (submitted after it without a push), the units, the repeat and the read all ran with
    89a79c2''s tree. The code check is by module: every module has one LF sha256 across all jobs, equal to the file at code_commit.'
