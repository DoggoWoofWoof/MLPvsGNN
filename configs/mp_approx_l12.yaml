phase: MP_APPROX_L12
opened: 2026-10-01
status: RUN
branch_type: POST_HOC_ANALYSIS
track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  Level 11 (configs/mp_approx_l11.yaml, RUN at c8d3f24). On metaqa, level 11's primary arm NB-setX-dsh read L11_HIGH,
  with rho_bar 0.879 [0.825, 0.930]. Its lever was more gold-labelled training rows: data_adds +0.083 [0.049, 0.117],
  with 7,473 fit queries per unit against NB-set's 2,153. The sharpened mixture added nothing that read (dsh_adds +0.007
  [-0.013, 0.027]). Every learned arm still sat below the GNN on all three metrics, by about one point, and ceiling_gap
  was 0.199 [0.160, 0.242]. Levels 8 to 11 cross-fitted their units on metaqa V2_GATE dev rows. The GNN trained on the
  metaqa train split's fit carve (5,960 queries) and chose its epoch on the select carve (1,497 queries). So no level so
  far has been label-matched to the GNN. This file fits level 11's model on the GNN's own carves. The fit carve trains
  it, the select carve chooses its kept round and every score parameter, and it is read once on fresh dev rows. It then
  adds 1, 3 and 7 further train-split carves, drawn by the same carve rule's stride, to see how many labels the model
  needs to reach the GNN. Level 10's model, likelihood, EM and fit_unit, and level 11's capture and dsh score, are
  imported and called unchanged.
design_informed_by: >-
  Level 11's run record, and one look at the train split, made before this file and not filed as a result:
  outputs/mp_approx_l12_design/l12_carve_pins.py (sha256 363e84cea3980352b02d6d64320242f40814524a2464471912c72d1ba73d6816)
  with its l12_carve_pins.json (sha256 047f4e432a1e488e636d302ecd95d9a5ed60ed5ba439b31e33bbdccf017691e0), both
  untracked. It read only the metaqa train split's ids, their gold resolution and their hops, through the frozen
  loaders. It recomputed the M3B fit and select carves (equal to configs/universal_v2.yaml's digests) and the seven
  further carves of carves.pins, with their digests, sizes and hops. No walk, score, metric or model output was
  computed on any train-split row before this file. The pilot's training caches of the fit and select carves were
  hashed (inputs.carve_cache) and their meta.json files read (sizes, the construction, the queries without an in-pool
  gold). No number in them enters a reading.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, how much of the GNN's gain over its twin does level 11's non-message-passing typed-walk model recover when
  it is fitted on the same train-split labels as the GNN, has its settings chosen on the same select carve, and is read
  once on fresh dev rows? It reads rho on recall@5, full_coverage@5 and hit@1 of the primary arm TW-1x-dsh, against the
  twin and the GNN of each seed pair, on 2,221 fresh V2_GATE queries disjoint from levels 0 to 11. As paired contrasts
  on the same queries, it reads what 2, 4 and 8 times the fit carve's train-split labels add. It also reads the
  smallest of the four label counts at which no readable metric stays below the GNN. The non-backtracking true-chain
  oracle bounds what choosing the right chain can give.
role: >-
  Measurement, as at levels 8 to 11. The objects are non-message-passing models fitted to gold labels of the metaqa train
  split and read on dev rows. No GNN output enters any fit, target, loss or selection. The twin's z-scored output is the
  base score, as at every level. TW-1x is fitted and selected under the GNN's own metaqa labels and carves, which makes
  it this track's first label-matched reading. It is still a measurement, not a deployable or selected model. No model,
  number or reading of this file enters QLS-U, the twin, a feature contract, M3, M4 or any selection. A deployable model
  of this form would be a competitor under the QLS-U contract on every dataset, with its compiled form timed, and it
  would need its own declaration. This file does not open one, and it opens no later level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code, as at levels 8 to 11
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    Level 11's argument (configs/mp_approx_l11.yaml#boundary) holds unchanged. The model, the walks, the reach sets, the
    set likelihood and the sharpened mixture are level 11's. The training rows change from dev rows to train-split rows,
    which changes only the queries the query map and theta are fitted on. Inside the model, every learned quantity is
    still a function of the query embedding and a discrete walk type only. Nothing in any model reads the edge list or a
    neighbour's embedding, score or state, and nothing is repeated.
  what_it_is: >-
    The function class is a query-weighted count of typed walks, as at levels 9 to 11. Under the sharpened mixture, a
    node's structural term is a tempered posterior's average of uniform reach sets. It has no learned per-edge message,
    no neighbour state and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    As at levels 8 to 11, the walks read only the packed structural message edges the GNN's cell reads: the same pool,
    the same cap of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction
    flags. The ner and knn families are not read. On the fit and select carves, every query's pool, seeds, golds and
    edge counts are checked equal to the pilot's training cache, which holds the graphs the GNN was trained and
    selected on (carve_pass.cache_equality).

authorization:
  given:
    - '2026-09-30, the user: "basically i dont want message passing but approximations to it, and pushing it as far as possible and targeting the weakpoints, i think offsets or rope based methods can work because all the stuff is anyways in the semantic space we just need to learn those transformations from the query etc and work from that, and explicit positions so that we have a proper way to represnt, what else do you think we should focus on"'
    - '2026-09-30, the user: "i think we can do something like learn the proper edge representation that works for us in our space and not hash then use that as extra feature, keep improving that feature and the learning from it, like how isonet++ worked, idk some sort of estimation maximization"'
  how_the_messages_are_answered: >-
    "Pushing it as far as possible and targeting the weakpoints" becomes the question level 11 left open. Level 11's
    lever was more gold-labelled rows, and its units fitted on dev rows, so its reading did not say how the model
    compares with the GNN at the GNN's own labels. This file reads that comparison first (TW-1x), then the data curve
    on the train split (TW-2x, TW-4x, TW-8x). Level 10's model, set likelihood and EM over the latent chain and level
    11's sharpened mixture are kept unchanged.
  go_ahead: >-
    Standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  placement_messages:
    - '2026-09-29, the user: "use the damn host not on laptop"'
    - '2026-09-30, the user: "pls mpve and do on the host for faster execution"'
    - '2026-10-01, the user: "dont request resources if you wont use them i want the best utilization at all times dont create a deadlock for other projects if you wont use the resources and whatever you request use them fully"'
    - '2026-10-01, the user: "parallely keep stuff i want full utilization and less time stuck waiting by any project or process request only what you can actually use and dont over request and keep underutilizing"'
    - answered in placement below
  terminal: STOP_FOR_REVIEW after the run record. No later level, arm or deployable model is opened by any reading here.

this_file_does_not_touch:
  fits: >-
    No GNN or twin is fitted or refitted, on any carve. The pilot's six checkpoints are read. Only this file's arms are
    fitted, and they are measurement models.
  rows: >-
    Level 0's 2,400 metaqa rows (which levels 1 to 7 reused) and the 3,000 rows of each of levels 8, 9, 10 and 11 leave
    the population before anything is scored. None of their sidecars is read. V2_HELD_CONFIRMATION is never read. The
    metaqa eval split is a dev split, and no test row is read. The train split is read only through the carves below.
  frozen: >-
    M2-M3B, universal-v2 (its training caches included), UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU
    task-level qualification, the six-dataset base, DEPLOY_CK_2WIKI, DEPLOY_CK_FULL_2WIKI and levels 0 to 11 all keep
    their bytes: declarations, scripts, tests, caches, sidecars, probes, records and documents. The scripts of levels 8
    to 11 are imported unchanged, and this file's scripts rebind some of their module names inside their own processes
    only. Level 0's and level 4's scripts and the frozen M3B and universal-v2 code are imported unchanged. The training
    caches are opened read-only.
  package: >-
    The CRAG package is read-only. On the host, the verified mirror stands in for it in memory only. Nothing is written
    under either root, and nothing from them enters git.
  competitors: no arm output, type weight, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:
  where: >-
    The host CPU, through tools/rx (docs/GPU_HOST_HANDOVER.md), in rx env mpr-cpu (torch 2.8.0+cpu, numpy 2.3.2, the
    laptop's pinned closure), Windows native. No GPU is used, and scipy and numba are not used. The tests run there too.
  why_the_host: >-
    The user's placement messages. Scoring about 51,400 queries takes about 39 CPU-hours, which the host runs as
    parallel shards.
  package: As at level 11 (configs/mp_approx_l11.yaml#placement.package), through the pinned verify_metaqa.json.
  threads:
    score: 6 torch threads and BLAS and OpenMP pools of 6, set before numpy loads, for the dev and carve scoring passes, their assembles and the loopcheck (level 9's scoring counts)
    fit_and_read: 4 torch threads and pools of 4, with torch's deterministic algorithms (level 8's fit_process), for the checks, the units, the repeat and the read
  reservations: >-
    Each job reserves what the same kind of job measurably used at level 11, plus a small margin, and never more than it
    can use. A dev score shard reserves 2.25 CPUs and 3 GB (level 11's shards measured 2.15 CPUs on average and 2.48 to
    2.65 GB). A carve score shard reserves 2.25 CPUs and 3.5 GB: the same loop, plus a whole carve prepared in the
    process. Assembles reserve 1 CPU and 3 GB for the dev rows and 3.5 GB for a carve. Checks reserve 1 CPU and 2.5 GB.
    TW-1x units and the repeat reserve 1.5 CPUs and 1.5 GB. Level 11's NB-setX units measured 1.3 CPUs and 0.77 GB on
    views of 9,000 queries, and TW-1x's view has 9,678. TW-2x, TW-4x and TW-8x units reserve 1.5 CPUs and TW-1x k = 0's
    measured peak scaled by the view's queries (15,638, 27,558 and 51,398 against 9,678), plus 0.5 GB, rounded up to
    the next 0.5 GB. The read reserves 1 CPU and 1.5 GB. Tests reserve 1 CPU and 2 GB, and the smokes and the
    loopcheck 2.25 CPUs and 3.5 GB. rx reserves without capping, and every process fixes its own pools at start, so a
    reservation changes no number. Jobs whose inputs exist are submitted at once, so they run in parallel under mpr's
    priority, and nothing running is preempted. A job that waits on others is submitted by a local waiter once its
    inputs exist, so a waiting job holds no reservation.
  proof_per_query: >-
    On the dev rows, the scoring pass checks the 14 metrics of T_k and G_k against the pilot's stored per-query values on
    every scored query, as at levels 8 to 11. The train-split rows have no stored values. On the fit and select carves,
    every query's pool, seeds, golds, gold total, edge counts, dataset row and float16 query embedding are checked equal
    to the pilot's training cache (carve_pass.cache_equality). The carve scoring loop is checked equal to level 8's
    scoring pass on dev rows, array by array and bit for bit (carve_pass.loopcheck). Any mismatch is a hard stop, and no
    tolerance is added.
  host_native: >-
    Every arm and reference is fitted, scored and read on the host CPU. On the dev rows, the twin's and the GNN's
    metrics are the stored values, checked exactly. On the carves, they are computed by the same forwards on the host.
    No number of this file is set beside a number made on the laptop.
  identical_code: >-
    Every host job runs from a commit of this phase and records the LF sha256 of every repository module it imports.
    The file stage checks that each module has one value across all jobs, equal to the file at the commit it names.
    scripts/mp_approx_l12.py is committed first and is not edited after that commit. scripts/mp_approx_l12_fit.py
    follows in a second commit, and the score and carve jobs never import it.
  laptop_steps: the doc and file stages, which make no number

transfer: >-
  The inputs of levels 8 to 11, level 11's qids.json and the pilot are already on the host. The training-cache files of
  the fit and select carves named in inputs.carve_cache are pushed with rx push --inputs, as the same bytes, before the
  first carve job. scalars.npy and seedw.npy are not pushed, and no stage reads them. Every carve job checks each pinned
  cache file's sha256 before reading it. The code arrives as the git-tracked tree. No token or credential goes to the
  host.

