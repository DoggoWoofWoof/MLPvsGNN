population:   # the scored rows, all dev rows
  rule: >-
    Start from metaqa V2_GATE, recomputed as level 8's stage_score does (the M3B eval population with its declared
    digest and count, the stored halves and hops, held rows out). Level 0's 2,400 rows leave it (recomputed through
    level 0's metaqa_subsample, equal to level 0's pinned qids.json and q_row.npy). The 3,000 rows of each of levels 8,
    9, 10 and 11 leave it, each recomputed through its own level's rule and salt and checked against its pinned
    qids.json. Level 11's rows come from l11_rows ("mp_approx_l11|"), which checks level 10's; level 10's l10_rows checks
    level 9's, and level 9's l9_rows checks level 8's. Per hop, the remaining rows are sorted by
    sha256("mp_approx_l12|" + query_id), and the first per_hop are kept, in population order. The rule reads only ids,
    hops and the gate mask.
  per_hop: {1: 221, 2: 1000, 3: 1000}   # 2,221 queries; hop 1 takes every remaining row
  available_per_hop: {1: 221, 2: 2644, 3: 2473}   # level 11's available rows per hop (1,221, 3,644, 3,473) less level 11's 1,000 each
  budget: >-
    After this file, no metaqa hop-1 V2_GATE row remains outside every level's population, and 1,644 hop-2 and 1,473
    hop-3 rows remain. A later level that draws fresh metaqa dev rows says in its own file how it draws.
  folds: >-
    Level 0's fold_of and is_inner are stored on every row, as at levels 8 to 11, and level 8's Data checks them. The
    units do not read them: every scored row is in the one scored set (units.roles).
  gold: >-
    The in-pool golds are m3b_compile.gold_local_of's. A query with no in-pool gold is scored and read, but it enters no
    fit, because it carries no evidence about the chain.
  why_disjoint: >-
    Levels 0 to 7 were read on level 0's rows, and levels 8 to 11 on their own rows. This file's design follows level
    11's readings. A fresh draw keeps all of those rows out of every number here.

carves:   # the training rows, all metaqa train-split rows, through the M3B carve rule
  rule: >-
    The M3B training carves (configs/m3b_controlled_comparison.yaml#populations.training_carves; m3b_compile.carves_for,
    imported unchanged): source = sorted(train ids), N = 329,282; size = min(1500, N // 5); s_sel = max(2, round(N /
    size)) = 220; select = source[::s_sel], 1,497 ids; remaining = the source ids outside that stride, 327,785 ids;
    s_fit = max(1, ceil(len(remaining) / 6000)) = 55; fit = remaining[::s_fit], 5,960 ids. This file's further carves
    are the same stride's other offsets: x_j = remaining[j::s_fit] for j = 1 to 7. Each process recomputes remaining and
    s_fit by carve_ids' formulas, and checks remaining[0::s_fit] and the select stride against carves_for's fit and
    select, before it forms an x carve. Each carve becomes a population by m3b_compile.population's train branch: the
    dataset row of each id, its train-split row, the golds by m3a.resolve_gold, and zero-gold ids out. For the fit and
    select carves that is m3b_compile.population itself. For an x carve it is the same lines applied to its ids, and
    the same lines applied to x_0 must equal m3b_compile.population's fit carve.
  why_these: >-
    The fit carve is the GNN's metaqa training data and the select carve chose its epoch, so TW-1x's labels are the
    GNN's own. The x carves are the train split's next draws by the same rule. Each has the fit carve's size and hop
    mix, none overlaps another carve or the dev rows, and the pilot never read any of them. So TW-kx adds labels without
    changing the population's form.
  pins:   # outputs/mp_approx_l12_design/l12_carve_pins.json; ids_sha256 is m3b_pools.ids_digest of the carve's kept ids in order
    N: 329282
    source_sha256: ce7bafc9d664f1c79af7c3a4990cd9c95d9176cfbe66d8159fb850db99920c59
    s_sel: 220
    s_fit: 55
    remaining: 327785
    fit: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 161a00b2fe086d6d40d2caa8da4a8ba9f1fabe59da6996203d54c82cea366188, hops: {1: 1740, 2: 2153, 3: 2067}}
    select: {queries: 1497, zero_gold_excluded: 0, ids_sha256: f0ec84fec4e07a050e8feacec5f4880342f10d60eb788b0cb0112334bc999828, hops: {1: 437, 2: 541, 3: 519}}
    x1: {queries: 5960, zero_gold_excluded: 0, ids_sha256: fbad6b74b28676888e51f18405da842e50e723b646a07fce0af2ae5ec8eb3b89, hops: {1: 1740, 2: 2153, 3: 2067}}
    x2: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 0b31fdad6280eb9feb46e12fe8c904f83e47e9ecbe574f387f14b5240b620311, hops: {1: 1740, 2: 2153, 3: 2067}}
    x3: {queries: 5960, zero_gold_excluded: 0, ids_sha256: cc84887b0b2bb318da23a12db6c7494c225bded4370243619f66aa9e60ffdd9b, hops: {1: 1740, 2: 2153, 3: 2067}}
    x4: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 2b69ca637c929236f3770233cdc120a484d629fbd73312ae2ef7026bfb64652d, hops: {1: 1740, 2: 2153, 3: 2067}}
    x5: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 877e1db5f983eea9e45f3845b94496c6a74b28b6a4c959c9980081df669e8b23, hops: {1: 1740, 2: 2153, 3: 2067}}
    x6: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 638b4a652d95577c6a5ef0fb5c98cc020ec5db80c6dd48fd776eabfcf0fa6d3c, hops: {1: 1740, 2: 2153, 3: 2067}}
    x7: {queries: 5960, zero_gold_excluded: 0, ids_sha256: 6ce0e53092beec8a52153b34d459b47ad53b19520a929770c261c0d2498dcc7d, hops: {1: 1740, 2: 2153, 3: 2067}}
  fits:   # fit: its training carves; the select carve is every fit's inner set, and the dev rows are every fit's scored set
    TW-1x: [fit]
    TW-2x: [fit, x1]
    TW-4x: [fit, x1, x2, x3]
    TW-8x: [fit, x1, x2, x3, x4, x5, x6, x7]
  label_counts: >-
    The training rows with an in-pool gold are filed per carve by the carve check, and per fit by the training_rows
    anchor, and each fit's count is named beside every reading of it. The training cache's meta.json files give 77 fit
    carve queries and 15 select carve queries without an in-pool gold, so about 5,883 fit rows and 1,482 inner rows are
    expected for TW-1x.

scoring_pass:   # the dev rows; host CPU, score threads; level 8's stage_score, imported unchanged, with its names rebound in this process
  path: >-
    As at levels 9 to 11, level 8's scoring pass runs unchanged, with the names of its module that level 11 rebinds,
    rebound in this process only. The population rule becomes this file's, and PER_HOP becomes this file's per_hop. The
    walk programme is level 9's combined programme (walk_entries_both, imported unchanged). The pins become this file's,
    which include every one of level 11's. The declaration and output paths become this file's. The chunking, the six
    forwards, the integrity check, the kept per-query and per-node arrays and the shards are level 8's, and the sidecar
    has level 9's combined form.
  integrity: >-
    As at levels 8 to 11. rank_metrics of T_k and G_k on the full pool must equal the pilot's stored per-query values of
    all 14 metrics exactly, on every scored query. The first mismatch is a hard stop.
  shards: two processes, --shard i/2, then one process without --shard that assembles

carve_pass:   # the carves; host CPU, score threads; this file's carve stage
  path: >-
    For a carve, every process loads the pilot's models and the metaqa context as level 8's stage_score does. It forms
    the carve's population, checks it against carves.pins, and prepares the whole carve through m3b_compile.prepare
    (about 12 s per 6,000 queries). It then scores its chunks through this file's score_rows, a copy of level 8's chunk
    loop: the same seed check, the same compile_query_v2 call with the node embeddings, the same packing, the six
    forwards, the same walk programme (level 9's walk_entries_both), the same per-query, per-node, per-type and
    per-entry arrays and the same chunk files. Two things differ from level 8's loop. The train split has no stored
    per-query metrics to check, and q_row is the query's position in its carve. The chunk size is level 8's rule over
    the whole carve's pool sizes, so every shard of a carve agrees on it. A run without --shard scores any chunk not yet
    written and assembles through level 8's assemble, called unchanged.
  cache_equality: >-
    On the fit and select carves, each process checks the carve's kept ids, in order, against the training cache's
    query_ids.json, and their dataset rows against qrow.npy. For every query it scores, it checks the pool,
    seeds_local and per-family edge counts of compile_query_v2, the in-pool golds and the gold total against the
    cache's pool, seeds, edge_counts, gold and gold_total. It also checks the prepared query embedding, in float16,
    against qemb.npy. Every comparison is exact. Each shard record files the number of queries checked. The cache's
    scalars and seed weights are float16 and depend on the BLAS thread count. They are not compared, and no stage reads
    them.
  loopcheck: >-
    Before any carve shard, score_rows runs on the rows of a dev smoke: level 8's rebound scoring pass with --limit 24,
    written outside outputs/mp_approx_l12. The stored metrics are checked as level 8 checks them. The assembled arrays
    are then compared with the smoke's, every array of level 8's ARRAY_KEYS, by dtype, shape and bytes. Any difference
    is a hard stop. The result is filed as outputs/mp_approx_l12/loopcheck.json.
  shards: >-
    The fit carve and x1 to x7 in four shards each and the select carve in two: 34 processes. Then one process per
    carve without --shard assembles it.
  sidecar: outputs/mp_approx_l12/carves/<carve>/, in level 9's combined form, with qids.json (the carve's kept ids) and meta.json

walks: >-
  Level 9's (configs/mp_approx_l9.yaml#walks), unchanged: the std family (level 8's counts) and the nb family
  (non-backtracking counts), compiled in one pass into one sidecar and read back as two views; the per-query checks,
  the null type, the ceilings and level 8's true-chain map. The fits read the nb family only.

check: >-
  Before any fit, the check stage runs level 9's check_family on each family of the dev sidecar, imported unchanged:
  level 8's direction check (a swapped share above the declared share, in either family, is a hard stop) and level 9's
  anchors. It refuses any level 0, 8, 9, 10 or 11 query id, any held row and any train-split id in the dev sidecar.

carve_check: >-
  Per carve, after its assemble, the carve check runs level 9's check_family on each family (the direction check is a
  hard stop). It checks that every id is a metaqa train-split id and that the carve's ids are its pinned digest, and
  that no id is in another assembled carve or in the dev sidecar. Every qtype must parse to a chain of its hop's length.
  It files level 9's anchors, the rows with an in-pool gold per hop, and the carve's mean recall@5, full_coverage@5 and
  hit@1 of T_k and G_k (carve_metrics, descriptive; on the fit carve both are in-sample).

arms:   # each arm reads z(T_k), the query embedding, the relation text and the nb family's compiled types and counts, nothing else
  model: >-
    Level 10's NB-set model, unchanged, on every fit (configs/mp_approx_l11.yaml#arms.model): level 9's NB-hyb model on
    non-backtracking walks, with level 10's set likelihood and its closed-form theta. p(tau | q) is the softmax of
    w(q, .) over the query's nb types and the null type.
  fits: carves.fits
  procedure: >-
    Each unit is level 10's fit_unit for NB-set (scripts/mp_approx_l10_fit.py, imported unchanged), called unchanged on
    level 10's SetFitter over the fit's deploy view (units), through level 11's fit_and_capture (imported unchanged).
    fit_unit runs the EM and keeps a round by the inner marginal log-likelihood. It then scores the dev rows under the
    cov score, with kappa and eta chosen on the inner queries. The capture gives the inner and scored log-probabilities
    under the kept round. The dsh score is level 11's score_dsh, imported unchanged, on that capture.
  scores:   # s_k(v) = z(T_k)(v) + kappa log(a_q(v) + eta)
    cov: level 10's coverage score, as fit_unit computes and selects it (configs/mp_approx_l10.yaml#arms.scores.cov)
    dsh: level 11's sharpened mixture (configs/mp_approx_l11.yaml#arms.scores.dsh)
  selection: >-
    Level 11's (configs/mp_approx_l11.yaml#arms.selection), on the select carve's rows with an in-pool gold. For dsh,
    beta in {1, 1.5, 2, 3, 4, 8, infinity}, kappa in {1/32, 1/16, 1/8, 1/4, 1/2, 1, 2, 4, 8, 16} and eta in {0.01, 0.1,
    1, 10, 100} are chosen together by the mean of recall@5, full_coverage@5 and hit@1. Ties go to the smaller beta,
    then the smaller kappa, then the larger eta. For cov, fit_unit's own choice is kept.
  read_arms:   # arm: fit, score
    TW-1x-dsh: [TW-1x, dsh]   # the primary arm: the GNN's metaqa labels and carves
    TW-1x-cov: [TW-1x, cov]
    TW-2x-dsh: [TW-2x, dsh]
    TW-2x-cov: [TW-2x, cov]
    TW-4x-dsh: [TW-4x, dsh]
    TW-4x-cov: [TW-4x, cov]
    TW-8x-dsh: [TW-8x, dsh]
    TW-8x-cov: [TW-8x, cov]
  references:
    NB-oracle: level 8's oracle rule on the dev sidecar's nb view (R*, the true chain's reach set from the bucket with the larger Jaccard with the golds, plus 1e6)

em: >-
  Level 10's, unchanged (configs/mp_approx_l10.yaml#em), as at level 11. On a deploy view, the minibatches, the E-step
  and theta's sums run over the fit's training rows with an in-pool gold, and the per-epoch early stopping and the kept
  round read the select carve's rows with an in-pool gold.

units:
  deploy_view: >-
    A fit's view is level 11's MultiView of nb views, imported unchanged. Its parts, in order, are eval (the dev
    sidecar), select, then the fit's carves in the order of carves.fits. Each part is level 9's View with its checks on,
    so every array and qids.json is checked against its meta.json and its folds and inner flags against level 0's rules.
    After the view is built, its folds and inner flags are set by role. Level 8's unit_queries, level 10's fit_unit and
    level 11's score_dsh then read it unchanged.
  roles:   # part: [q_fold, q_inner] -> its set in level 8's unit_queries at fold 0
    eval: [0, 0]          # the scored set; never a fit or inner row
    select: [-1, 1]       # the inner set (rows with an in-pool gold); never scored
    fit_and_x: [-1, 0]    # the fit set (rows with an in-pool gold); never scored
  per_fit: >-
    One unit per (fit, k) at fold 0, for k = 0, 1 and 2: 12 units. torch.manual_seed and numpy default_rng take 1000 +
    10 k, which is fit_unit's 1000 + 10 k + fold at fold 0. Every unit reads its own seed's twin, z(T_k), on the inner
    and scored rows only.
  type_table: >-
    Level 8's Fitter builds its type table over every type of the view, the dev rows' included, as at levels 8 to 11.
    A walk sequence that occurs on no fit row gets no gradient from the loss. The unseen_sequences anchor counts such
    sequences among the dev rows' types.
  unit_files: >-
    Each unit is written atomically, to units/<fit>/k<k>_f0. It holds fit_unit's arrays (the scored rows, the cov scores
    and metrics, the argmax), the dsh scores and metrics, and the fit log. The fit log holds fit_unit's log, the dsh
    choice (beta, kappa, eta and its inner mean), the dsh inner grid, the fit and inner rows by part, and
    unseen_sequences. A unit already written is skipped on a restart.
  repeat: >-
    The unit (TW-1x, k = 0) runs again in a fresh process. Its arrays and fit log are compared bitwise with the first
    run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule. T_k's and G_k's values on the dev rows are the stored ones, checked in the scoring pass.
  rho_readable_rho_bar_gap: >-
    As at levels 8 to 11: rho_M = (mean over k and queries of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)). A metric
    is readable when its denominator's 95% interval lies above 0. rho_bar is the mean of rho_M over the readable
    metrics, and gap_to_gnn is the mean of M(arm_k) - M(G_k) per metric.
  strata: per hop (1, 2, 3); a stratum's rho is read only if its own denominator interval lies above 0
  anchors:   # descriptive
    level9_anchors: level 9's check anchors on each view of the dev sidecar and of every carve
    carve_metrics: per carve and on the dev rows, the mean over k of recall@5, full_coverage@5 and hit@1 of T_k and G_k
    training_rows: per fit, the fit and inner rows with an in-pool gold, by part and in total
    agreement: >-
      Per fit, the share of dev rows on which the argmax type has the true chain's token sequence, with the bucket
      ignored; per k, then the mean over k; overall and per hop. A null argmax does not agree.
    genre_agreement: the same share, on the dev rows whose qtype's last kind is genre
    gap_split: >-
      For TW-1x-dsh and TW-8x-dsh: (NB-oracle - arm) per metric, summed over the (query, seed) pairs on which the fit's
      argmax sequence is the true chain's, and over those on which it is not, each divided by the seed count and the
      metric's summed denominator; the mean over the readable metrics; overall and per hop.
    unseen_sequences: >-
      Per fit, the number of distinct walk token sequences among the dev rows' types that occur on none of the fit's
      training rows, and the share of dev rows whose true chain's sequence occurs on none of them
    theta: per fit, the kept theta (rho_1, rho_2, rho_3, eps_s), the mean, minimum and maximum over units
    grid_edges: per read arm, the number of units whose kappa or eta sits at an end of the grid, and the number whose kept round is the last
    beta_choices: per dsh arm, the number of units that choose each beta
    reaches_gnn: >-
      The first fit, in the order TW-1x, TW-2x, TW-4x, TW-8x, whose dsh arm has no readable metric flagged BELOW_GNN,
      with its training rows; none when every one has such a metric

statistics:
  bootstrap: >-
    Level 0's bootstrap over the dev rows: queries resampled with replacement, 1000 resamples, numpy default_rng(0)
    (level 0's boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample
    matrix serves every quantity, so contrasts are paired. The intervals resample the scored queries. They do not
    resample the training carves or the fits.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    data_2x: TW-2x-dsh - TW-1x-dsh
    data_4x: TW-4x-dsh - TW-1x-dsh
    data_8x: TW-8x-dsh - TW-1x-dsh
    step_4x: TW-4x-dsh - TW-2x-dsh
    step_8x: TW-8x-dsh - TW-4x-dsh
    dsh_adds: TW-1x-dsh - TW-1x-cov
    dsh_adds_8x: TW-8x-dsh - TW-8x-cov
    ceiling_gap: NB-oracle - TW-1x-dsh
    ceiling_gap_8x: NB-oracle - TW-8x-dsh

readings:   # filed before any number
  primary: TW-1x-dsh
  bands:   # of rho_bar; the first that applies; the same thresholds as levels 8 to 11
    L12_ABOVE_GNN: the interval's lower end is above 1
    L12_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L12_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L12_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: NB-oracle's rho_bar interval upper end <= 0.50
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
    GRID_EDGE: more than half of the primary's 3 units choose kappa or eta at an end of the grid
    THETA_AT_CLIP: a unit's kept theta has a component at a clip bound (the units are listed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l12_above_gnn: >-
      Primary L12_ABOVE_GNN. On this metaqa population, a non-message-passing model fitted on the GNN's own metaqa labels
      scores above the GNN on the readable metrics on average. It reads compiled non-backtracking typed walks and the
      relation text. The GNN's metaqa advantage over its twin is then reproducible without learned message passing at
      the GNN's label count, given those inputs.
    l12_high: primary L12_HIGH -- at the GNN's own labels, the model recovers most of the GNN's gain on this population
    l12_mid: primary L12_MID -- at the GNN's own labels, it recovers part of the gain
    l12_low: primary L12_LOW -- at the GNN's own labels, it recovers little of the gain; read it with CEILING_LOW and the agreement anchor
    matched_below_gnn: the primary has a readable metric flagged BELOW_GNN -- at the GNN's labels, the model stays measurably below the GNN on that metric
    matched_not_below_gnn: no readable metric of the primary is flagged BELOW_GNN -- at the GNN's labels, the model is not measurably below the GNN on any readable metric
    data_adds_2x: the data_2x interval lies above 0
    data_adds_4x: the data_4x interval lies above 0
    data_adds_8x: the data_8x interval lies above 0
    data_hurts_8x: the data_8x interval lies below 0
    last_doubling_adds: the step_8x interval lies above 0 -- the curve still rises between 4x and 8x
    last_doubling_flat: the step_8x interval spans 0
    dsh_adds: the dsh_adds interval lies above 0 -- the sharpened mixture adds to the coverage score at the GNN's labels
    dsh_hurts: the dsh_adds interval lies below 0
    chain_not_identified: the primary fit's agreement below 0.5 with ceiling_gap's interval above 0 -- the chain is not learned from the question
  wording: >-
    TW-1x is label-matched to the GNN on metaqa. Its fit rows are the GNN's metaqa fit carve, its settings are chosen on
    the GNN's select carve, and it is read on dev rows that neither model saw. The GNN also trained on 2wiki's and
    squad's fit carves, which hold no metaqa label. TW-2x, TW-4x and TW-8x fit on 2, 4 and 8 times as many metaqa
    train-split labels as the GNN, and the GNN is not refitted on them. Each of their readings names its label count,
    and none is a matched comparison. The file measures what non-message-passing typed-walk models recover of the GNN's
    gain on this population. It is never a deployable or selected model, and it says nothing about another dataset. No
    reading may be phrased as "message passing is unnecessary", "we do not need message passing" or "the MLP wins".
    rho here is level 8's quantity on a fresh population. Level 11's numbers are quoted beside this file's only with
    their population and training rows named, and never as one quantity with this file's. rho is not the within-U_q
    oracle rho of levels 0 to 7, and the two are never set side by side as one quantity.

compute:
  scoring: >-
    About 51,400 queries (2,221 dev rows and 49,177 carve rows) at level 11's 2.7 CPU-seconds per query: about 39
    CPU-hours, and about 31 min per carve shard of 1,490 queries.
  storage: >-
    Level 11's sidecar held about 10,300 walk entries per query, in both families. Over the dev rows and the nine
    carves that is about 530 million entries, or 8 to 10 GB on the host with the per-node arrays. A carve's chunks
    double its size until it is assembled. The host's free disk is checked before the shards are submitted.
  fits: >-
    A TW-1x unit should take about 7 min (level 11's NB-setX units fitted 7,473 queries in about 7.5 min). TW-2x, TW-4x
    and TW-8x units should take about 2, 4 and 8 times as long, so about 50 min for TW-8x.
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the population digest or count, the halves, the hops, or the recomputed rows of level 0, 8, 9, 10 or 11 differ from
    the declared or stored ones, or a level 0, 8, 9, 10 or 11 row, a held row, a train-split row or a test row would be
    scored
  - any integrity check of scoring_pass fails
  - >-
    a carve's recomputed source, strides, ids, counts or hops differ from carves.pins; the fit or select carve differs
    from m3b_compile.population's or from configs/universal_v2.yaml's digests; x_0 differs from the fit carve; a carve
    id is not a metaqa train-split id, is in another carve or is a dev row
  - a training-cache file is not its pinned sha256, or any comparison of carve_pass.cache_equality fails
  - the loopcheck finds any array that differs in dtype, shape or bytes
  - any hard stop of level 9's walks, check or carve check
  - the relation table differs from the pinned embeddings or vocabulary order
  - a set likelihood's theta or marginal log-likelihood is not finite
  - >-
    a deploy view's part is a smoke run, its meta.json or one of its arrays is not what its pins and meta.json record,
    its arrays do not line up with the view's, or a row's set is not its role's (a carve row scored, a dev row fitted)
  - level 10's two calls of score_fold in a unit did not receive the same log-probabilities
  - the host jobs' recorded code sha256 values are not one value per module equal to the committed files

outputs:
  scripts: >-
    scripts/mp_approx_l12.py (stages score [--shard i/n], assemble, check, carve --carve C [--shard i/n], carve_check
    --carve C and loopcheck; the population rule, the carves and the pins) and scripts/mp_approx_l12_fit.py (stages fit
    --fit F --k K, repeat, read, doc and file; the deploy views)
  sidecars: >-
    outputs/mp_approx_l12/metaqa/ (the dev rows) and outputs/mp_approx_l12/carves/<carve>/, on the host. Each holds the
    per-query and per-node arrays, the walk entries of both families, qids.json, meta.json (the sha256 of every array)
    and check.json. metaqa/ also holds units/<fit>/, repeat/ and read.json.
  loopcheck: outputs/mp_approx_l12/loopcheck.json
  record: outputs/mp_approx_l12/record.json, assembled on the laptop without arithmetic from the fetched read.json, check.json, loopcheck.json and meta.json files
  document: docs/MP_APPROX_L12.md
  run_record: run_record_mp_approx_l12_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l12.py and tests/test_mp_approx_l12_fit.py, run on the host in rx env mpr-cpu
  - this file parses, its pins are the files' current sha256, and the declared constants are the scripts'
  - >-
    the population rule on toy ids is disjoint from the rows of levels 0 and 8 to 11, recomputes level 11's rows by
    level 11's rule, sorts per hop by this file's salted sha256 and keeps per_hop[h] rows of hop h, all of them when
    per_hop[h] is what is available
  - >-
    the carve rule on toy sorted ids: x_0 is carve_ids' fit, and the x_j are disjoint from each other, from the fit
    carve and from the select carve; the train-branch replica on the fit carve's ids gives m3b_compile.population's
    fit population
  - the rebound scoring pass restores level 8's names after it runs, and reads this file's rule, per_hop, pins and paths inside it
  - >-
    the loopcheck's comparison finds a changed byte, dtype or shape in any array, and the cache check refuses a changed
    pool, seed, gold, gold total, edge count, dataset row, embedding or id order
  - >-
    the check and the carve check on synthetic sidecars, and their refusals: an earlier level's id, a held row or a
    train-split id in the dev sidecar, a dev id in a carve, and two carves sharing an id
  - >-
    a deploy view's roles: every dev row is scored and in no fit or inner set, every select row with an in-pool gold is
    inner, every fit or x row with an in-pool gold is fit, and no carve row is scored; per-query reads equal the part's
  - >-
    a unit equals level 11's fit_and_capture plus score_dsh on the same view, bit for bit, and permuting the scored
    rows' golds changes none of their scores
  - each arm's inputs are only z(T_k), q, the relation text and the view's types and counts
  - >-
    metrics, rho, readability, the band order, reaches_gnn, the gap split and unseen_sequences come out right on toy
    cases, and the contrasts are the declared pairs
  - the check, carve check, fit, repeat, read, doc and file stages run end to end on synthetic sidecars

execution:
  order: >-
    This file alone (commit). Then scripts/mp_approx_l12.py and tests/test_mp_approx_l12.py (commit), and those tests on
    the host. The training-cache files are pushed. Then, outside outputs/mp_approx_l12, a dev smoke (--limit 24), the
    loopcheck on its rows, and carve smokes on the select carve (the cache equality) and on x1. Then all 36 score shards
    at once, in the order dev (2), select (2), fit (4) and x1 to x7 (4 each), with each assemble and check submitted as
    its shards finish. In parallel, scripts/mp_approx_l12_fit.py and tests/test_mp_approx_l12_fit.py (commit) and those
    tests on the host. Once the dev rows, the select carve and the fit carve are checked, TW-1x's three units run. Once
    TW-1x k = 0 is written, the repeat runs. Once its peak memory is known and a fit's carves are checked, that fit's
    three units run. Then the read. Then fetch the read, check, loopcheck and meta files, and on the laptop build the
    record, the doc and the run record (commit).
  stop_after_run: STOP_FOR_REVIEW

