corrections_to_the_proposal:   # checked against the code and L7's record before this file was written
  it_is_an_mp_arm: >-
    L7's role text placed the deployable model "under the QLS-U contract". By universal-v2's own definition of learned
    propagation the kernel is not QLS-U: its message weights kappa = phi^T psi and its values W_val s_ue are trainable
    and applied over the pool edges. The file therefore names the kernel arms MP arms, fits them under the GNN's
    parameter budget (450,000; configs/universal_v2.yaml shared.parameter_accounting) and never under the twin's.
  what_compile_once_means_here: >-
    With ck_qi's query-free neighbour side, psi_h(u, e) and val(u, e) depend only on the node's served embedding (X_u R),
    the entry's family, its relation mask and its direction, so they can be computed once per edge. At query time
    only phi (which reads the query) and the sums over the pool's entries remain. ck_full computes psi and the values
    from the query-conditioned halo row per query and edge, as a one-hop GNN layer does. The moments C_v = sum psi val^T
    and c_v = sum psi are still summed over the pool's entries (in-pool), so they are per query.
  the_fixed_neighbourhood_is_not_this_file: >-
    Moments compiled once per node would sum over a fixed neighbourhood that includes nodes outside the pool (L7's
    two_conditions_for_compile_once, (b)). Such a kernel reads graph information the GNN never sees: its context node set
    and induced edge set differ from the GNN's, which docs/GRAPH_INFORMATION_FAIRNESS_CONTRACT.md section 2 (items 1 and
    5) names a different condition ("A condition is named by its context"). It needs its own file with a GNN matched to
    that context. This file is the in-pool condition: every arm reads the same pool and the same induced edges.
  the_entries_and_inputs_are_the_gnns: >-
    the kernel's entries are the message edges the GNN reads (universal_v2_models.pack_queries_v2: the first 64 in-pool
    neighbours per family, in store order), plus one self entry per node, as level 3's entries were. Its neighbour side
    reads only what the packed batch carries: under qi, the entry's family one-hot (structural, ner, knn, self), rel_mask,
    dir_fwd and dir_bwd beside X_u R. Level 3's eps, which the L7 probes read, also carried 64 relation-text columns;
    2wiki has no relation table, so no 2wiki edge carries a relation, and the deployable arm reads no relation text.
  forward_compiled_is_an_exactness_check: >-
    CKv2.forward_compiled computes the same scores through the moments (m_v = phi^T C_v / phi^T c_v). In-pool it is not
    the cheaper path: forming C_v per query costs more than summing alpha val. It is scored beside the forward to show the
    two agree (COMPILED_DIFFERS), never timed, and never a separate arm.
  new_draws_single_dataset: >-
    every arm is fitted on 2wiki alone (the sampler draws a 2wiki fit query per draw; early stopping reads 2wiki's select
    recall@5). No arm here has been fitted before in this condition. No number is compared with the trio pilot, the
    six-dataset stage 2, M3B or any laptop fit.
  the_relation_bank: >-
    with 2wiki alone open the served relation bank has no rows (2wiki has no relation table, offset -1, as in the trio).
    The bank is an input, never a parameter; every parameter count below is pinned.

