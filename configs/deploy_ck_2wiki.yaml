measurement:
  scoring: >-
    universal_v2_six.eval_dataset_six's pass with a device (the script's eval_placed): each query compiled on the host
    CPU by compile_query_v2 under the frozen contract, packed on the CPU (pack_queries_v2), moved to the GPU, scored by
    every fit (15 fits and the repeat) and, on the CPU, by universal-v2's seven fixed scorers. Each kernel fit is also
    scored by forward_compiled (named <fit>@compiled), whose largest score difference from the forward and whose metric
    differences are filed. rank_metrics of m3b_train gives the 14 METRIC_NAMES per query.
  checks: >-
    the ceiling from the arrays equals the headroom cell (m3a.cell) to 1e-9; the M3B MRR audit on every scorer
    (universal_v2_run.audit_scorers); the fixed rrf reproduces the frozen M3B eval arrays per query
    (m3b_fixed_rrf_agreement, outputs/m3b/eval/2wiki.npz, pinned). Any failure is a hard stop.
  metrics: recall@5 (primary), full_coverage@5 (co-read), hit@1 (descriptive; each fit's own); per arm, the per-query mean over its three seeds
  mechanism: delta_ratio and top1_changed per fit (universal_v2_run.mechanism, descriptive)
  latency: >-
    systems only, never a reading: a batch of one on the first 500 eval queries -- the unchanged per-query compile, the
    pack, the move to the GPU, and per arm (seed 0) the forward on host_gpu_det (synchronised) and on the host CPU at
    8 threads. It is the model-side cost only; the end-to-end timing with the fast compiler is step 4's file. No latency
    of this file is set beside a laptop number.

statistics:
  resamples: >-
    one matrix per half: default_rng(0), 1000 resamples of the half's queries with replacement, drawn in sequence as
    universal_v2_run.paired_bootstrap draws them (a test holds the two equal). 95% percentile intervals.
  contrasts:   # paired differences of per-query seed means
    gnn_gain: gnn - twin
    ck_gain: ck_qi - twin
    edge_gain: ck_qi - ck_self
    self_gain: ck_self - twin
    ck_vs_gnn: ck_qi - gnn
    compiled_cost: ck_qi - ck_full -- the retrieval cost of the compiled form, measured directly
    ref_gain: ck_full - twin
    ref_vs_gnn: ck_full - gnn
  shares:   # a ratio of two contrasts over the same resamples; read only where the denominator's interval lies above 0
    ck_share: (ck_qi - twin) / (gnn - twin)
    edge_share: (ck_qi - ck_self) / (gnn - twin)
    ref_share: (ck_full - twin) / (gnn - twin)

readings:   # filed before any weight exists
  primary_kernel: ck_qi
  per_query_reference: ck_full
  primary_half: V2_HELD_CONFIRMATION
  primary_metric: recall@5
  co_read_metric: full_coverage@5
  bands:   # exactly one, on the primary half and metric; the same bands are computed descriptively for ck_full (ref_gain, ref_share)
    GNN_GAIN_ABSENT: gnn_gain's interval reaches 0 (lower end <= 0) -- there is no GNN gain on this half to keep; nothing else is read as a reading
    CK_KEEPS: ck_share >= 0.75 and its interval's lower end >= 0.50
    CK_PARTIAL: not CK_KEEPS, and ck_gain's interval lies above 0
    CK_NO_GAIN: ck_gain's interval reaches 0 (lower end <= 0)
  flags:
    CK_NOT_BELOW_GNN: ck_vs_gnn's interval reaches 0 or above (upper end >= 0)
    EDGES_CARRY: edge_gain's interval lies above 0 -- the in-pool edges carry gain beyond the kernel's self-entry capacity
    SELF_CARRIES: self_gain's interval lies above 0 -- the added node-local capacity alone lifts the twin
    COMPILED_COST: compiled_cost's interval lies below 0 -- the compiled form retrieves measurably less than the per-query form
    COMPILED_DIFFERS: forward_compiled changes a metric of any query for any kernel fit (the largest score difference is filed)
    REPEAT_DIFFERS: the repeat's weights are not bit-identical to the seed-0 fit's, or a metric differs
    GATE_HALF_DIFFERS: the band on V2_GATE is not the reading
    FC5_DIFFERS: the band on full_coverage@5 (primary half) is not the reading
  interpretation: >-
    CK_KEEPS: one compiled hop keeps most of the GNN's gain in the in-pool condition, and the deployable model is the
    compiled form. CK_PARTIAL: it keeps some; the shares and ck_vs_gnn say how much is left to the GNN. CK_NO_GAIN: the
    compiled form keeps none, and the reference's band says whether the per-query form does. L7 filed the oracle
    expectation (qi_share 0.113), so CK_PARTIAL or CK_NO_GAIN with COMPILED_COST is the anticipated outcome, and
    CK_KEEPS would contradict the oracle ladder. None of these opens a stage.
  wording: >-
    every kernel arm is learned propagation, one hop, in-pool. No reading may be phrased as "message passing is
    unnecessary", "we do not need message passing" or "the MLP wins": the kernel is a message-passing arm, and whatever
    it keeps is kept by message passing. All numbers are dev-split numbers on one dataset, fitted and scored on
    host_gpu_det; none is a canonical result, and none is set beside a laptop or an earlier-stage number.

