arms:   # every arm under universal-v2's frozen contract (UNIVERSAL_V2_CORE_CONTRACT, 197 compiled columns) and H = 128
  twin:
    arm: u_mlp_v2_mix
    parameters: 330955
    what: the matched twin, built by universal_v2_run.make_model unchanged; no learned propagation
  ck_qi:
    side: qi
    form: KERN
    parameters: 377803
    what: >-
      the compiled form (primary): the twin plus one hop of the factorised kernel (4 heads of rank 32, value width 16)
      with a query-free neighbour side, psi = softplus(W_psi s_ue) and val = W_val s_ue, s_ue = [X_u R | entry family
      one-hot | rel_mask, dir_fwd, dir_bwd], R level 1's JL matrix (default_rng(20260929), 1536 x 64 over sqrt 64);
      phi = softplus(W_phi [h_v | q_state_v]); alpha = kappa over its sum across the node's entries and its self entry;
      the message W_msg m_v (W_msg zero-initialised) is added to the input block's h before the body
      (compiled_kernel.build_ck(side="qi", form="KERN"))
  ck_full:
    side: full
    form: KERN
    parameters: 390475
    what: >-
      the per-query form (the reference): the same kernel with the full neighbour side, whose halo reads the query
      (build_ck(side="full", form="KERN"))
  ck_self:
    side: qi
    form: SELF
    parameters: 343883
    what: >-
      the self-entry control: ck_qi's entries reduced to the self entry, so m_v = W_val [X_v R | self one-hot] and alpha
      = 1. It adds the kernel's node-local path with every edge removed, separating what the edges carry from what the
      added capacity carries (build_ck(side="qi", form="SELF"))
  gnn:
    arm: u_gnn_v2_ef
    parameters: 420932
    what: universal-v2's GNN (three steps, edge features, evidence flow structurally 0 on 2wiki), built by make_model unchanged

parameter_budgets: >-
  every arm is within the GNN's 450,000; the twin is within its own 350,000. The kernel arms add 46,848 (ck_qi), 59,520
  (ck_full) and 12,928 (ck_self) parameters to the twin; tests/test_compiled_kernel.py holds each count.

