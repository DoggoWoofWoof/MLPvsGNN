transfer:
  what: the 28 pinned 2wiki carve-cache files and the frozen M3B eval arrays (29 files, about 354 MB), pushed by rx into the host workspace (rx push --force, the files named one by one), read in place
  not_transferred: >-
    the CSR family stores (about 1.4 GB) are built on the host from the host mirror by m3b_pools.load_or_build_store,
    unchanged, at the verify stage, then compared by content with the pins above. Nothing else reaches the host but the
    git-tracked tree.
  verification: >-
    the verify stage (host): every pushed file's sha256 and every frozen module's LF sha256; the mirror's 2wiki verify
    record; the contexts opened from the mirror (the served freeze checked by m3b_compile.open_package); each family
    store equal by content; the fit and select carves opened. It writes outputs/deploy_ck_2wiki/verify.json, which the
    fit and eval stages require.

placement:   # configs/gpu_task_qualification.yaml#host_native_protocol, as at levels 3 to 7
  host_stages: verify, fit, eval and read run on the host; fits and eval on host_gpu_det. The laptop runs the pins, transfer, doc and file stages only (no number is made there).
  host_gpu_det_as_tested: >-
    quoted from configs/gpu_task_qualification.yaml#placements.candidate.host_gpu_det, not changed: "DESKTOP-SLQMEQH, rx
    env mpr-cu128@62fc45e9e1ba (torch 2.8.0+cu128, CUDA 12.8), NVIDIA RTX 4500 Ada Generation, driver 596.71; float32
    only; torch.backends.cuda.matmul.allow_tf32 = False, torch.backends.cudnn.allow_tf32 = False, float32 matmul
    precision "highest", cudnn.benchmark = False; torch.use_deterministic_algorithms(True, warn_only=True) with
    CUBLAS_WORKSPACE_CONFIG=:4096:8 set before CUDA starts; every determinism warning recorded". 8 threads.
  verdicts_relied_on: >-
    configs/gpu_task_qualification.yaml#run_record_gpu_task_qualification_2026_09_29: host_gpu_det TASK_EQUIVALENT and
    TRAINING_REPRODUCIBLE (T5 held two fresh GPU runs of fit_model's arithmetic bit-identical). The score-level
    NOT_EQUIVALENT verdict of configs/cpu_gpu_equivalence.yaml stands, so this file is host-native.
  settings_applied_by: cpu_gpu_equivalence's placement_settings("det", 8), placement_block and environment_problems, imported unchanged; any difference read back is a hard stop; a driver other than 596.71 is a filed deviation
  host_native_protocol:
    same_placement_for_every_comparator: every arm is fitted and scored on host_gpu_det, every seed a new draw
    identical_inputs: transfer.verification above
    identical_code: >-
      every host job runs from one git commit, the commit that adds scripts/deploy_ck_2wiki.py, and records the LF sha256
      of every repository module it imported. The file stage checks that they are one set, equal to the committed files.
    identical_checkpoints: the eval stage re-hashes every fit's weights (file bytes and content) against its record
    repeat_check: fitting.repeat
    no_cross_machine_numbers: no number of this file is set beside a number made on the laptop
  scheduling: >-
    rx jobs with mpr's priority 10, nothing running preempted. The verify job first (4 cpu, 24 GB, no GPU); once it has
    written VERIFIED, all 16 fits are submitted at once (-p gpu, 0.2 GPU, 4 cpu, 12 GB each; the queue orders them);
    after the last fit, one job runs eval then read (-p gpu, 0.25 GPU, 8 cpu, 24 GB).

compute:
  first_projection_hours: 1.5
  fit_hours_ceiling: 60
  basis: >-
    no arm has been fitted on 2wiki alone, and none of these arms has been fitted on the host. The trio pilot's laptop
    CPU fits (three datasets) took about 4,000-7,900 s (twin) and 18,000-37,000 s (GNN). A 2wiki fit draws from one
    dataset of about 106 candidates a query, steps on the card and packs on the host CPU, so a fit is projected at
    under 1.5 h. The projection is a guess: the guard sums the filed fits' wall hours plus the projection of the next
    (the longest filed fit, else 1.5 h), and over 60 fit-hours it writes fits/ceiling_breach.json and starts no fit.
  eval: the per-query compile of 12,576 queries on the host CPU, scoring 16 fits on the GPU and the fixed scorers on the CPU, and the latency block
  disk: host workspace outputs/deploy_ck_2wiki/ (16 weight files of about 1.5 MB, the eval arrays, the records), fetched to the laptop

hard_stops:   # on any: the evidence is written to outputs/deploy_ck_2wiki/hard_stop.json, nothing further runs in that process, and it is reported
  - any pin in inputs fails, on the laptop or the host
  - the host mirror's 2wiki verify record is missing, not VERIFIED, or names another root
  - a family store built on the host differs by content from the laptop's
  - a host job's placement settings read back differently from host_gpu_det_as_tested, or CUDA is unavailable to a fit or eval stage
  - an arm's parameter count is not its pin, or exceeds the GNN's budget
  - the frozen training rule returns anything other than fitting.rule
  - the eval population, its split or its halves differ from population; any test split
  - the ceiling check, the MRR audit or the M3B fixed-rrf agreement fails
  - a fit's weights on the host are not the file or the content its record pins

outputs:
  host: outputs/deploy_ck_2wiki/{verify.json, fits/<key>.{pt,json}, eval/2wiki.{npz,json}, eval/2wiki_query_ids.json, read.json}, fetched to the laptop (git-ignored)
  laptop: outputs/deploy_ck_2wiki/record.json (git-ignored, assembled from the host's records without arithmetic) and docs/DEPLOY_CK_2WIKI.md
  run_record: run_record_deploy_ck_2wiki_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_deploy_ck_2wiki.py, laptop CPU, committed with the script and run before any host job
  - this file parses; its arms are the script's (construction and parameter pins), its bands and flags are the script's in order, and the placement spec is level 3's
  - the frozen code, the pushed files and the family stores equal their pins on the laptop
  - every arm builds at its pinned parameter count
  - a store's content digest ignores nothing and is stable (one changed element changes it)
  - the resample matrix reproduces universal_v2_run.paired_bootstrap's interval
  - the bands and shares on synthetic arrays land where the rules say (each band, an unreadable share)
  - >-
    a smoke on the real 2wiki data, CPU, read-only -- one ck_qi fit and its repeat under a two-batch rule
    (bit-identical), the eval pass on a slice of the population with all 16 fits (the population, halves, ceiling,
    audits and M3B agreement pass; forward_compiled within 1e-4 of the forward), then the read and doc stages on those
    records

execution:
  order: >-
    this file (with compiled_kernel.py and its tests) committed alone -> the script and its tests committed, the tests
    passing on the laptop -> pushed -> the transfer -> the verify job once the mirror's 2wiki record is VERIFIED -> all
    fits -> eval and read -> fetched -> doc -> file (run record) -> STOP_FOR_REVIEW

amendment_1_2026_09_30_smoke_placement:   # filed before the transfer and before any host job
  what: >-
    The tests' real-data smoke (test_smoke_fit_repeat_eval_read_doc_on_real_2wiki) and the family-store content test run
    on the host, in one rx job after the verify stage and before any fit, on host_gpu_det: the smoke fits, repeats and
    scores on the GPU, so it also exercises the CUDA path the fits and the eval take, which the laptop cannot. Every
    other test ran on the laptop before the transfer (19 passed), as declared.
  why: >-
    at 09:40Z the laptop had 0.7 GB of memory available while the six-base fit (configs/mp_approx_six_base.yaml, PID
    16744) held 8.6 GB; the smoke opens 2wiki's family stores (about 1.4 GB) and its package. Running it there would
    page both processes.
  unchanged: >-
    the tests themselves, the rule that they pass before any fit starts, and every reading. The smoke writes only under
    pytest's temporary directory; it makes no number of this file, and its fits are not fits of this file.
  order: >-
    transfer -> verify job -> test job (the smoke and the store test, pytest on the host; a failure stops the file here)
    -> all fits -> eval and read
  scheduling: >-
    placement.scheduling's fit jobs take 0.125 GPU, 4 cpu and 10 GB each instead of 0.2, 4 and 12 (systems only): the
    arms are small (at most 420,932 parameters, batches of 16 queries), so the GPU share is what would bind the number of
    fits running together; at 0.125 up to eight are admitted, subject to the CPUs, the memory and the other projects'
    jobs, under mpr's priority 10 with nothing preempted. The test job takes 0.25 GPU, 8 cpu, 24 GB; verify, eval and
    read are as declared.

amendment_2_2026_09_30_batch_check:   # filed before the verify job and before any fit; no host job of this file has run
  what: >-
    configs/host_mirror_six.yaml#verification requires that "a stage that a later file places on the host runs its own
    16-batch check before it reads anything (its first 16 batches, packed on the host, torch.equal to the laptop's)";
    configs/cpu_gpu_equivalence.yaml#mirror_verification says the same, field for field. transfer.verification above
    omitted it. It is added here, before any host job of this file has run.
  laptop_half: >-
    a new laptop stage, reference, opens 2wiki from the laptop's package and stores (read-only) and packs, with the code
    the host runs and at the host stages' BLAS thread count, the first 16 batches of each seed's fit draw under the
    frozen rule (fit_draws replays fit_model_placed's generator, cursors and the pinned draw_indices; the pinned
    pack_parts packs them) and the first 16 blocks of the eval pass (eval_population, then each query compiled and
    packed as eval_placed does). Every batch is pinned field by field by cpu_gpu_equivalence.field_pins (dtype, shape,
    sha256 of the bytes) with each floating field's NaN count. No model is built and no number is made.
  reference: outputs/deploy_ck_2wiki_reference/batches_laptop.json
  reference_sha256: 17353b736b2faf14add3d5148c66647fe96d120f242d7829fa41add7df821e2c
  reference_made: 2026-09-30T11:06:46Z on the laptop at 8 BLAS threads, 1450.1 s, peak RSS 2.6 GB; 48 fit batches and 16 eval blocks of 227 queries, no NaN
  threads: >-
    compile_query_v2's features depend on the BLAS thread count, with the same OpenBLAS build. A first reference, packed
    at the laptop stages' 6 threads (sha256 77dcf1e116af02f39faa7b35bff7fc3781069e0ae8957040438847d5632a145f), was set
    aside before any host job read it: a laptop probe packed eval block 0 again and found it equal at 6 threads, and x
    different at 8, 4 and 1 threads, every other field equal. Between the two references all 48 fit batches are equal
    (they come from the pushed carve caches) and all 16 eval blocks differ in x only; the probe's 8-thread block 0, from
    another process, equals the pinned reference's byte for byte. The host's env loads the same numpy 2.3.2 and
    OpenBLAS 0.3.30 library file with the same Haswell kernels; rx limits a job's memory and priority, not its CPUs;
    and the script sets 8 threads for every host stage before numpy loads, so the host packs at 8. The reference stage
    therefore packs at the host stages' count, refuses any other, and records it; verify records both counts. The first
    reference, its log and the probe stay in outputs/deploy_ck_2wiki_reference/ (git-ignored).
  host_half: >-
    the verify stage packs the same 48 fit batches and 16 eval blocks from the mirror and compares them before it
    writes VERIFIED. Each fit stage packs its own seed's 16 again and compares them before its first step. The eval
    stage compares each of its first 16 blocks once it is packed and before any fit scores it, so the latency block's
    first queries stay the pass's own first compile. Equal pins are byte identity, which is torch.equal wherever a field
    holds no NaN. Any difference is a hard stop, with the differing batches and fields in hard_stop.json. The reference
    is refused unless its sha256 is the one above; it travels with the verify job (rx --inputs). The verify job now
    also prepares the eval population and compiles 16 blocks (the laptop took 1450 s for the whole reference).
  tested_by: >-
    tests/test_deploy_ck_2wiki.py adds five tests (26 in all): the pins and their comparison (a changed field, draw,
    block or count); fit_draws against fit_model_placed's own loop (its first 16 draws recorded as it makes them, across
    two reshuffles); the reference refused unless it is the pinned file; the reference stage refused at any BLAS thread
    count but the host stages'; the pinned file's shape, rule and count. The host smoke records the fit loop's own draws
    and packs while it fits and holds them equal to the replay, and runs the eval pass's check on two blocks of its
    slice, including a tampered reference that stops the pass before any scoring. The host test job must pass all 26
    with none skipped.
  identical_code: >-
    placement.host_native_protocol.identical_code's commit is the one that files this amendment (the script's new stage
    and checks, and the tests); no host job ran from 6a99244. The transfer (a laptop rx push of the pinned data files at
    09:46Z) is unchanged.
  driver: >-
    systems only. The host driver stopped at 09:49:14Z before submitting any job: its wait for the mirror matched an
    earlier route's "driver stops" line in outputs/host_mirror_six/driver.log. It now reads amendment 2's lines of that
    log only, pushes the reference with the verify job, refuses to push while a tracked file differs from the commit, and
    requires the host test job to pass every collected test with none failed, errored or skipped (a warnings count no
    longer fails it). The mirror's 2wiki record is VERIFIED (configs/host_mirror_six.yaml, run record at 06b6667).
  unchanged: every arm, the rule, the population, the statistics, the readings and amendment 1's placement and scheduling

