registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  Trained from the gold labels alone on 2wiki's own carves, does u_mlp_v2_mix plus one hop of the compiled factorised
  kernel keep the trained GNN's gain over its matched twin? Two forms are fitted: ck_qi (the compiled form: psi and the
  values read only query-free inputs, so they can be computed once per node and edge type) and ck_full (the per-query
  form: level 5's neighbour side, which reads the query; the reference). Beside them: the twin (u_mlp_v2_mix), the
  kernel's self-entry control (ck_self: the same added capacity with every edge removed) and the GNN (u_gnn_v2_ef).
  Every arm is fitted three times and scored on 2wiki's M3B eval population, all on host_gpu_det.
role: >-
  The advisor's next step after L6 ("then a deployable 2Wiki compiled-kernel MLP", quoted in
  configs/mp_approx_l6.yaml#authorization.advisor_text.priority_after_this), in the form L7 fixed. It
  is a competitor trained without GNN outputs: no GNN output, probe, kernel or number of the MP-Approx ladder enters any
  arm as an input, a target, a teacher or an initialisation. The kernel is learned propagation by
  configs/universal_v2.yaml#learned_vs_fixed_propagation ("any operator applied over the pool edges inside the model
  whose messages or message weights depend on trainable parameters"), so every kernel arm is an MP arm, never QLS-U and
  never the twin. What the file measures is how much of the GNN's gain one compiled hop keeps and what the compiled form
  costs against the per-query form; its deployable property is cost, not the absence of message passing.

