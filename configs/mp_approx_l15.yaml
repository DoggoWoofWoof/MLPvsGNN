  terminal: STOP_FOR_REVIEW after the run record. No later level, arm or deployable model is opened by any reading here.

this_file_does_not_touch:
  fits: >-
    No GNN or twin is fitted or refitted, on any carve. The pilot's six checkpoints are read. Only this file's arms are
    fitted, and they are measurement models.
  rows: >-
    r2 is train-split rows, so it holds none of level 0's 2,400 metaqa rows and none of the dev rows of levels 8 to 13,
    which are V2_GATE rows, and it is disjoint from level 14's r; a check refuses any of them. None of their sidecars is
    read, except level 12's carve sidecars (carves.sidecars). V2_HELD_CONFIRMATION is never read, and no dev row or test
    row is read. The train-split rows scored here are r2's 11,920. The training rows are level 12's carve sidecars, read
    in place, and no row of level 12's nine carves or of r is in r2.
  frozen: >-
    M2-M3B, universal-v2 (its training caches included), UMLP D0-D0.3, v2.1, v2.2A, the CPU-GPU equivalence file, the GPU
    task-level qualification, the six-dataset base, DEPLOY_CK_2WIKI, DEPLOY_CK_FULL_2WIKI and levels 0 to 14 all keep
    their bytes: declarations, scripts, tests, caches, sidecars, probes, units, records and documents. The design looks
    keep theirs. The scripts of levels 8 to 14 are imported unchanged, and this file's scripts rebind some of their
    module names inside their own processes only. Level 12's carve sidecars are opened read-only and pinned. Level 14's
    sidecar, units and read are not opened, except its pinned qids.json (r's ids, for r2's disjointness check) and its
    pinned read.json (the exchangeability anchor).
  package: >-
    The CRAG package is read-only. On the host, the verified mirror stands in for it in memory only. Nothing is written
    under either root, and nothing from them enters git.
  competitors: no arm output, type weight, target or number becomes an input, target, teacher, gate or selection criterion of any retriever

placement:
  where: >-
    The host CPU, through tools/rx (docs/GPU_HOST_HANDOVER.md), in rx env mpr-cpu (torch 2.8.0+cpu, numpy 2.3.2, the
    laptop's pinned closure), Windows native. No GPU is used, and scipy and numba are not used. The tests run there too.
  why_the_host: >-
    The user's placement messages. Level 12's carve sidecars are on the host, and the units read them in place, so no
    sidecar moves.
  package: As at level 12 (configs/mp_approx_l12.yaml#placement.package), through the pinned verify_metaqa.json.
  threads:
    score: 6 torch threads and BLAS and OpenMP pools of 6, set before numpy loads, for r2's scoring pass and its assemble (level 12's carve pass counts)
    fit_and_read: 4 torch threads and pools of 4, with torch's deterministic algorithms (level 8's fit_process), for the check, the units, the repeat and the read
  reservations: >-
    Each job reserves what the same kind of job measurably used on r (rx status: cpu_s over wall time and peak memory),
    which has r2's size, plus a small margin. Level 14's run record (measured_jobs) and the design look's FZ units give
    the figures. A score shard reserves 1.85 CPUs and 2.95 GB (level 14's ran at 1.78 to 1.84 CPUs and peaked at 2.68 to
    2.8 GB). The assemble reserves 1 CPU and 1.2 GB (0.99 and 1.01 GB), and the check 1 CPU and 0.85 GB (0.99 and 0.73
    GB). The sm units reserve level 14's peaks plus about 0.15 GB: full TW-1x 1.15 CPUs and 2.8 GB (1.13, 2.61 GB), full
    TW-4x 1.3 CPUs and 3.35 GB (1.3, 3.19 GB), b0 TW-1x 1.1 CPUs and 1.9 GB (1.07, 1.75 GB) and b0 TW-4x 1.2 CPUs and
    2.25 GB (1.2, 2.1 GB). The FZ units reserve the design look's: full TW-1x 1.3 CPUs and 2.8 GB (1.28 to 1.29, 2.64
    to 2.67 GB), full TW-4x 1.5 CPUs and 3.4 GB (1.49, 3.21 to 3.23 GB), b0 TW-1x 1.15 CPUs and 1.95 GB (1.14, 1.78 to
    1.82 GB) and b0 TW-4x 1.3 CPUs and 2.3 GB (1.28 to 1.29, 2.13 to 2.16 GB). The repeat reserves its unit's figures.
    The read reserves 1 CPU and 1.6 GB (level 14's peaked at 1.32 GB with half as many units). Each test job reserves
    0.7 CPU and 0.3 GB, and the fit module's 0.9 CPU and 0.45 GB (level 14's ran at 0.64 and 0.89 CPUs and peaked at
    0.22 and 0.36 GB). rx reserves without capping, and every process fixes its own pools at start, so a reservation
    changes no number. Jobs whose inputs exist are submitted at once, so they run in parallel under mpr's priority, and
    nothing running is preempted. A job that waits on others is submitted by a local waiter once its inputs exist, so a
    waiting job holds no reservation. Measured against reserved goes into the run record.
  proof_per_query: >-
    r2's rows have no stored per-query metrics: the pilot never evaluated on them. So the twin's and the GNN's metrics on
    r2 are computed by the carve pass's six forwards, as on level 12's x carves and level 14's r, and nothing stored is
    checked against them. Level 12's loopcheck (inputs.level12_loopcheck) ran the carve loop on 24 dev rows whose metrics
    the pilot stored, and every array of level 8's ARRAY_KEYS equalled level 8's pass by dtype, shape and bytes. Its
    record is pinned, and it must be on file as equal before any fit. The carve sidecars were checked by level 12 and are
    pinned by their meta.json and check.json. Each of their arrays is checked against its meta.json when a deploy view
    opens it.
  host_native: >-
    Every arm and reference is fitted, scored and read on the host CPU, and the twin's and the GNN's metrics on r2 are
    computed there. No number of this file is set beside a number made on the laptop.
  identical_code: >-
    Every host job runs from a commit of this phase and records the LF sha256 of every repository module it imports.
    The file stage checks that each module has one value across all jobs, equal to the file at the commit it names.
    scripts/mp_approx_l15.py is committed first and is not edited after that commit. scripts/mp_approx_l15_fit.py
    follows in a second commit, and the score, assemble and check jobs never import it.
  laptop_steps: the doc and file stages, which make no number

transfer: >-
  The inputs of levels 8 to 14, the pinned qids.json and read.json files and level 12's carve sidecars and loopcheck are
  already on the host. The code arrives as the git-tracked tree. No token or credential goes to the host.

