    process only and restored after it: CARVES gains r and r2; carve_ids_of returns r2 by population.rule, r by level
    14's r_ids_of and every other carve by level 12's own function; verify_inputs becomes this file's; and CONFIG becomes
    this file's declaration. Its population check (carve_population_checked) then recomputes the source, the strides and
    all eleven carves, refuses any shared id, checks x_0 through the train-branch lines against m3b_compile.population's
    fit carve, and checks r and r2 against their pins and every id of r2 as a metaqa train-split id. The whole of r2 is
    prepared, and the chunk loop (level 12's score_rows: level 8's loop, line for line, with level 9's combined walks),
    the chunk rule and the assemble are level 12's. r2 has no training cache, so no cache is opened. The sidecar is
    written to outputs/mp_approx_l15/metaqa/.
  integrity: >-
    Level 12's carve pass checks: every prepared seed set equals seeds_of and is in the pool, every structural edge
    carries a relation slot and a direction flag, every walk count is below 2^32 and no ceiling is passed. The metrics of
    T_k and G_k on r2 are computed, not checked against stored values (placement.proof_per_query).
  shards: twelve processes, --shard i/12 (the chunks ci with ci mod 12 = i), then one process without --shard that assembles

walks: >-
  Level 9's (configs/mp_approx_l9.yaml#walks), unchanged: the std family (level 8's counts) and the nb family
  (non-backtracking counts), compiled in one pass into one sidecar and read back as two views; the per-query checks,
  the null type, the ceilings and level 8's true-chain map. The fits read the nb family only.

check: >-
  Before any fit, the check stage runs level 9's check_family on each family of r2's sidecar, imported unchanged: level
  8's direction check (a swapped share above the declared share, in either family, is a hard stop) and level 9's
  anchors, as level 12 files them for a carve. It refuses a smoke sidecar, a sidecar whose meta.json does not name carve
  r2 and r2's ids digest, any id that is not a metaqa train-split id, ids other than r2's pin, a q_row other than each
  row's position in r2, any query id of the populations of level 0 and levels 8 to 14 (level 14's is r), any id of
  level 12's nine carve sidecars (each must be assembled), and a loopcheck not on file as equal.

arms:   # each arm reads z(T_k), the query embedding, the relation text and the nb family's compiled types and counts, nothing else
  model: >-
    Level 12's, unchanged (configs/mp_approx_l12.yaml#arms.model): level 10's NB-set model, level 9's NB-hyb model on
    non-backtracking walks with level 10's set likelihood and its closed-form theta.
  norms:
    sm: >-
      Level 8's softmax, as at levels 9 to 14: p(tau | q) is the softmax of w(q, .) over the query's types in the view
      and the null type. An sm unit is level 14's unit, called unchanged.
    fz: >-
      FZ, the one change of this file, in training and scoring alike. With w(q, tau) level 9's NB-hyb logit and w_null
      its null logit, V the walk types present on the unit's fit rows (the fit set of level 8's unit_queries at fold 0,
      read from their type codes before the fit), P the row's present types, U = V united with P, and s(tau) a type's
      token sequence: p(b, s | q) = exp w(q, (b, s)) / Z with Z = exp w_null + the sum of exp w over U. A row's posterior
      is p_row(b, s) = [the sum of p(b', s | q) over the buckets b' with (b', s) in U] * p(b, s | q) / [the sum of p(b'',
      s | q) over the buckets b'' with (b'', s) in P], for each present type, and p_row(null) = p(null | q) + the sum of
      p(tau | q) over the types of U whose sequence has no present bucket in the row. It sums to one on every row. A
      chain's mass over both buckets goes to the buckets where the row has its walks, and to the null type when it has
      none. In a b0 view (one bucket) it is a softmax over U with the mass of the types the row lacks on the null type.
      With V empty it is level 8's softmax. The model is level 9's ResidualModel with two fixed attributes (V and each
      type's partner, the same sequence in the other bucket); its parameters and state dict are level 9's, created in the
      same order, so a seed starts where the sm unit's does. The fitter is level 10's SetFitter, with its logp and its
      soft cross-entropy taking FZ's log-probabilities; the rest of level 10's EM, level 11's selection and dsh, level
      13's b1d and level 14's b0 view are called unchanged.
  fits: carves.fits
  views:
    full: level 12's deploy view, every nb type, as at levels 12 to 14
    b0: level 14's (configs/mp_approx_l14.yaml#arms.views.b0), unchanged; level 14's B0View is imported, not copied
  procedure: >-
    An sm unit is level 14's run_unit (scripts/mp_approx_l14_fit.py, imported unchanged) on the view of the fit's
    deploy view: on the full view level 13's run_unit (level 12's, then level 11's score_dsh on the b1d capture), and on
    the b0 view level 12's run_unit. An FZ unit is the same call, with level 9's make_model and the fitter rebound to
    FZ's in its process only. The unit's fit, its kept round, its dsh settings and b1d's are chosen as level 14 chooses
    them, on its own view and norm.
  scores:   # s_k(v) = z(T_k)(v) + kappa log(n_q m_beta(v) + eta)
    dsh: level 11's sharpened mixture (configs/mp_approx_l11.yaml#arms.scores.dsh) on the full view
    b1d: level 13's (configs/mp_approx_l13.yaml#arms.scores.b1d), on the full view's capture
    b0: level 11's sharpened mixture of a b0 unit, a model fitted and selected on the bucket-0 types only
  selection: >-
    Level 11's (configs/mp_approx_l11.yaml#arms.selection), on the select carve's rows with an in-pool gold, for each
    score on its own: beta in {1, 1.5, 2, 3, 4, 8, infinity}, kappa in {1/32, 1/16, 1/8, 1/4, 1/2, 1, 2, 4, 8, 16} and
    eta in {0.01, 0.1, 1, 10, 100} chosen together by the mean of recall@5, full_coverage@5 and hit@1. Ties go to the
    smaller beta, then the smaller kappa, then the larger eta. A unit chooses on its own view and norm.
  read_arms:   # arm: [norm, fit, score]; in this order
    TW-1x-dsh: [sm, TW-1x, dsh]
    TW-1x-b1d: [sm, TW-1x, b1d]
    TW-1x-b0: [sm, TW-1x, b0]   # level 14's primary procedure, refitted with r2 as its scored set
    TW-4x-dsh: [sm, TW-4x, dsh]
    TW-4x-b1d: [sm, TW-4x, b1d]
    TW-4x-b0: [sm, TW-4x, b0]
    FZ-TW-1x-dsh: [fz, TW-1x, dsh]
    FZ-TW-1x-b1d: [fz, TW-1x, b1d]   # the primary arm: the GNN's metaqa labels and carves
    FZ-TW-1x-b0: [fz, TW-1x, b0]
    FZ-TW-4x-dsh: [fz, TW-4x, dsh]
    FZ-TW-4x-b1d: [fz, TW-4x, b1d]
    FZ-TW-4x-b0: [fz, TW-4x, b0]
  references:
    NB-oracle: level 8's oracle rule on r2's nb view (R*, the true chain's reach set from the bucket with the larger Jaccard with the golds, plus 1e6), as at levels 13 and 14
    NB-oracle-b0: level 14's, on r2's nb view (the true chain's bucket-0 reach set, plus 1e6; no bonus when the query has no bucket-0 walk of the true chain)
  not_arms: >-
    Level 10's cov score is still computed inside fit_unit and kept in the unit arrays, and it is not read. The design
    looks' routed scores (two-model routes, mode-routed dsh and b1d) are not arms.

em: >-
  Level 10's, unchanged (configs/mp_approx_l10.yaml#em), as at levels 12 to 14, under each unit's norm. On a deploy
  view, the minibatches, the E-step and theta's sums run over the fit's training rows with an in-pool gold, and the
  per-epoch early stopping and the kept round read the select carve's rows with an in-pool gold. On a b0 view they run
  over its types.

units:
  deploy_view: >-
    Level 14's deploy view with its eval part replaced. It is level 11's MultiView, imported unchanged, of the parts eval
    (r2's sidecar), select, then the fit's carves in the order of carves.fits, with the folds and inner flags then set by
    role (level 12's with_roles). The select and fit parts are level 12's part_view, called unchanged on level 12's carve
    sidecars, read through level 14's B0View on a b0 view. The eval part is this file's: r2's sidecar has passed this
    file's check (both direction checks) on the meta.json it now has, is level 9's View with its checks on, is not a
    smoke run, names carve r2 and r2's ids digest, and has r2's pinned ids, count and hops, every id a train-split id.
  roles:   # part: [q_fold, q_inner] -> its set in level 8's unit_queries at fold 0 (level 12's, unchanged)
    eval: [0, 0]          # r2: the scored set; never a fit or inner row
    select: [-1, 1]       # the inner set (rows with an in-pool gold); never scored
    fit_and_x: [-1, 0]    # the fit set (rows with an in-pool gold); never scored
  per_fit: >-
    One unit per (norm, view, fit, k) at fold 0, for the norms sm and fz, the views full and b0, the fits TW-1x and
    TW-4x, and k = 0, 1 and 2: 24 units. Each is its norm's procedure (arms.procedure). Every unit reads its own seed's
    twin, z(T_k), on the inner and scored rows only.
  type_table: As at level 12 (configs/mp_approx_l12.yaml#units.type_table), on the view's types; a b0 view's table holds bucket-0 codes only.
  fz_vocabulary: >-
    An FZ unit builds V from its deploy view before the fit: the table types of the fit set's rows (level 8's
    unit_queries at fold 0), and each table type's partner. Its fit log files V's size, the partners' count, and the
    count of the scored rows' (row, type) entries outside V and of scored rows with any. V never reads an inner or scored
    row's types, and a test checks it.
  unit_files: >-
    Each unit is written atomically, to units/<norm>/<view>/<fit>/k<k>_f0. A unit holds level 14's arrays and fit log for
    its view, and adds the norm (and under FZ the vocabulary counts). A unit already written is skipped on a restart.
  repeat: >-
    The unit (fz, full, TW-1x, k = 0), which the primary reads, runs again in a fresh process, into repeat/. Its arrays
    and fit log are compared bitwise with the first run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule. T_k's and G_k's values on r2 are the carve pass's (placement.proof_per_query).
  rho_readable_rho_bar_gap: >-
    As at levels 8 to 14: rho_M = (mean over k and rows of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)). A metric is
    readable when its denominator's 95% interval lies above 0. rho_bar is the mean of rho_M over the readable metrics,
    and gap_to_gnn is the mean of M(arm_k) - M(G_k) per metric.
  strata: >-
    Per hop (1, 2, 3), and per where: true_from_b0 (the true chain has a walk from a bucket-0 seed), true_from_b1_only
    (from bucket-1 seeds only) and true_nowhere (from neither), by level 8's chain_reach on r2's nb view with the chain
    named by the row's qtype, as level 14's anchors name it. A stratum's rho is read only if its own denominator
    interval lies above 0. The where strata are descriptive.
  anchors:   # descriptive
    level9_anchors: level 9's check anchors on each view of r2's sidecar and of every carve read (fit, select, x1, x2, x3)
    carve_metrics: per carve read and on r2, the mean over k of recall@5, full_coverage@5 and hit@1 of T_k and G_k
    exchangeability: >-
      r2's carve_metrics beside those of r (level 14's read.json) and of level 12's dev rows and carves and level 13's
      dev rows, from their pinned read.json files; the twin and the GNN trained on the fit carve and selected on the
      select carve, and saw none of the other populations
    training_rows: per norm, fit and view, the fit and inner rows with an in-pool gold, by part and in total
    unseen_sequences: >-
      Per fit and view, the number of distinct walk token sequences among r2's types that occur on none of the fit's
      training rows, and the share of r2's rows whose true chain's sequence occurs on none of them
    agreement: >-
      Per norm, fit and view, the share of r2's rows on which the argmax type has the true chain's token sequence, with
      the bucket ignored; per k, then the mean over k; overall, per hop and per where. A null argmax does not agree.
    null_mode: per norm, fit and view, the share of (row, seed) pairs whose argmax is the null type; overall, per hop and per where
    genre_agreement: the same share, on r2's rows whose qtype's last kind is genre
    gap_split: >-
      For FZ-TW-1x-b1d, TW-1x-b1d and FZ-TW-4x-b1d against NB-oracle, and for FZ-TW-1x-b0 and TW-1x-b0 against
      NB-oracle-b0: (reference - arm) per metric, summed over the (row, seed) pairs on which the unit's argmax sequence
      is the true chain's, and over those on which it is not, each divided by the seed count and the metric's summed
      denominator; the mean over the readable metrics; overall and per hop.
    theta: per norm, fit and view, the kept theta (rho_1, rho_2, rho_3, eps_s), the mean, minimum and maximum over units
    grid_edges: per read arm, the number of units whose kappa or eta sits at an end of the grid, and the number whose kept round is the last
    beta_choices: per read arm, the number of units that choose each beta
    b1d_moved: per norm and fit, the mean over the full units of the inner and scored rows with a bucket-1 type and of the posterior mass b1d moves to the null type on the scored rows
    fz_vocabulary: per fit and view, V's size and partners, and the mean over the FZ units of the scored entries and rows outside V
    b0_view: >-
      On r2's nb view: the mean nb types and walk entries per row, the same over the bucket-0 types, and the share of
      rows with no bucket-0 type; overall and per hop
    reaches_gnn: >-
      The first read arm, in the order of arms.read_arms, with no readable metric flagged BELOW_GNN, with its fit's
      training rows; none when every one has such a metric or no metric is readable

statistics:
  bootstrap: >-
    Level 0's bootstrap over r2's rows: rows resampled with replacement, 1000 resamples, numpy default_rng(0) (level 0's
    boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample matrix serves
    every quantity, so contrasts are paired. A stratum's quantities use the same matrix restricted to its rows. The
    intervals resample the scored rows. They do not resample the training carves or the fits.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    fz_adds: FZ-TW-1x-b1d - TW-1x-b1d
    fz_adds_b0: FZ-TW-1x-b0 - TW-1x-b0
    fz_adds_dsh: FZ-TW-1x-dsh - TW-1x-dsh
    fz_adds_4x: FZ-TW-4x-b1d - TW-4x-b1d
    fz_adds_4x_b0: FZ-TW-4x-b0 - TW-4x-b0
    fz_adds_4x_dsh: FZ-TW-4x-dsh - TW-4x-dsh
    over_l14_primary: FZ-TW-1x-b1d - TW-1x-b0
    b1d_over_b0_fz: FZ-TW-1x-b1d - FZ-TW-1x-b0
    b1d_over_b0_fz_4x: FZ-TW-4x-b1d - FZ-TW-4x-b0
    data_4x_fz: FZ-TW-4x-b1d - FZ-TW-1x-b1d
    data_4x_fz_b0: FZ-TW-4x-b0 - FZ-TW-1x-b0
    ceiling_gap: NB-oracle - FZ-TW-1x-b1d
    ceiling_gap_4x: NB-oracle - FZ-TW-4x-b1d
    ceiling_gap_b0: NB-oracle-b0 - FZ-TW-1x-b0
    bucket_ceiling: NB-oracle - NB-oracle-b0
  hop_contrasts: >-
    fz_adds, fz_adds_b0 and over_l14_primary per hop (1, 2, 3), each the paired difference of the stratum's rho_bar under
    the same resample matrix; read only where the stratum has a readable metric
  where_contrasts: fz_adds and fz_adds_b0 per where stratum, in the same way; descriptive

readings:   # filed before any number
  primary: FZ-TW-1x-b1d
  bands:   # of rho_bar; the first that applies; the same thresholds as levels 8 to 14
    L15_ABOVE_GNN: the interval's lower end is above 1
    L15_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L15_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L15_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: NB-oracle's rho_bar interval upper end <= 0.50 (the primary's own ceiling)
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
    GRID_EDGE: more than half of the primary's 3 units choose kappa or eta at an end of the grid
    THETA_AT_CLIP: a unit's kept theta has a component at a clip bound (the units are listed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l15_above_gnn: >-
      Primary L15_ABOVE_GNN. On r2, a non-message-passing model fitted on the GNN's own metaqa labels, with its type
      posterior normalised by FZ and scored by b1d, scores above the GNN on the readable metrics on average. It reads
      compiled non-backtracking typed walks from the seeds and the relation text.
    l15_high: primary L15_HIGH -- at the GNN's own labels, the FZ model recovers most of the GNN's gain on r2
    l15_mid: primary L15_MID -- at the GNN's own labels, it recovers part of the gain
    l15_low: primary L15_LOW -- at the GNN's own labels, it recovers little of the gain; read it with CEILING_LOW and the agreement anchor
    matched_below_gnn: the primary has a readable metric flagged BELOW_GNN -- at the GNN's labels, the model stays measurably below the GNN on that metric
    matched_not_below_gnn: no readable metric of the primary is flagged BELOW_GNN -- at the GNN's labels, the model is not measurably below the GNN on any readable metric
    fz_adds: the fz_adds interval lies above 0 -- FZ adds over level 8's softmax under b1d, at the GNN's labels
    fz_hurts: the fz_adds interval lies below 0
    fz_adds_b0: the fz_adds_b0 interval lies above 0 -- FZ adds under b0, at the GNN's labels
    fz_hurts_b0: the fz_adds_b0 interval lies below 0
    fz_adds_dsh: the fz_adds_dsh interval lies above 0
    fz_hurts_dsh: the fz_adds_dsh interval lies below 0 -- under dsh, which keeps the bucket-1 walks, FZ lowers the reading
    fz_adds_4x: the fz_adds_4x interval lies above 0 -- FZ still adds under b1d at four times the labels
    fz_hurts_4x: the fz_adds_4x interval lies below 0
    fz_adds_4x_b0: the fz_adds_4x_b0 interval lies above 0
    fz_hurts_4x_b0: the fz_adds_4x_b0 interval lies below 0
    fz_adds_4x_dsh: the fz_adds_4x_dsh interval lies above 0
    fz_hurts_4x_dsh: the fz_adds_4x_dsh interval lies below 0
    over_l14_primary: the over_l14_primary interval lies above 0 -- the primary reads above level 14's primary procedure on the same rows
    under_l14_primary: the over_l14_primary interval lies below 0
    b1d_over_b0_fz: the b1d_over_b0_fz interval lies above 0 -- under FZ, fitting on every type and dropping bucket 1 after the fit reads above fitting on bucket 0 only
    b0_over_b1d_fz: the b1d_over_b0_fz interval lies below 0
    b1d_over_b0_fz_4x: the b1d_over_b0_fz_4x interval lies above 0
    b0_over_b1d_fz_4x: the b1d_over_b0_fz_4x interval lies below 0
    data_adds_4x_fz: the data_4x_fz interval lies above 0 (under FZ and b1d)
    data_adds_4x_fz_b0: the data_4x_fz_b0 interval lies above 0 (under FZ and b0)
    b0_ceiling_binds: the bucket_ceiling interval lies above 0 -- reading bucket-0 types only lowers what the right chain can give
    chain_not_identified: the primary unit's agreement below 0.5 with ceiling_gap's interval above 0 -- the chain is not learned from the question
    fz_adds_hop1: the hop-1 fz_adds interval lies above 0
    fz_hurts_hop1: the hop-1 fz_adds interval lies below 0
    fz_adds_hop2: the hop-2 fz_adds interval lies above 0
    fz_hurts_hop2: the hop-2 fz_adds interval lies below 0
    fz_adds_hop3: the hop-3 fz_adds interval lies above 0
    fz_hurts_hop3: the hop-3 fz_adds interval lies below 0
  wording: >-
    TW-1x and FZ-TW-1x are label-matched to the GNN on metaqa: their fit rows are the GNN's metaqa fit carve, their
    settings are chosen on the GNN's select carve, and they are read on train-split rows that neither model saw (r2). The
    GNN also trained on 2wiki's and squad's fit carves, which hold no metaqa label. TW-4x and FZ-TW-4x fit on four times
    as many metaqa train-split labels as the GNN, the GNN is not refitted on them, and their readings name their label
    count; none is a matched comparison. r2 is train-split rows, not dev rows. Every number here is named a reading on
    r2, and it is never set beside a dev-row number as one quantity, nor beside level 14's numbers on r as one quantity;
    level 14's are quoted beside this file's only with their population named. FZ was chosen from looks at r, where it
    read +0.043 [0.031, 0.056] under b1d. The file measures what non-message-passing typed-walk models recover of the
    GNN's gain on r2. It is never a deployable or selected model, and it says nothing about another dataset. No reading
    may be phrased as "message passing is unnecessary", "we do not need message passing" or "the MLP wins". rho here is
    level 8's quantity. It is not the within-U_q oracle rho of levels 0 to 7, and the two are never set side by side as
    one quantity.

compute:
  scoring: >-
    11,920 rows in twelve shards of about 993. Level 14's shards of r, the same size, took 41.9 to 42.4 min, so about 40
    to 45 min with all twelve at once when the host has room.
  fits: >-
    Level 14's sm units on r took 16.3 to 16.5 min (full TW-1x), 28.3 min (full TW-4x), 10.9 to 11.1 min (b0 TW-1x) and
    21.9 to 22.0 min (b0 TW-4x); the design look's FZ units took 16.8 to 17.1, 31.6 to 31.7, 11.4 to 11.7 and 24.4 min.
    So about the same here, with all 24 units and the repeat at once when the host has room.
  storage: >-
    r2's sidecar, about level 14's r sidecar, and 24 units, each holding its scores' per-node arrays (about 0.2 GB per
    score); about 20 GB on the host. The carve sidecars are read in place.
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the source, the strides or any of the eleven carves differ from the pins or from carves_for, two carves share an id,
    a row of r2 is not a metaqa train-split id, a row of r2 is a row of r, or a V2_GATE row, a held row or a test row
    would be scored
  - any integrity check of scoring_pass fails, or level 12's loopcheck is not on file as equal
  - any hard stop of level 9's walks or check
  - the relation table differs from the pinned embeddings or vocabulary order
  - a set likelihood's theta or marginal log-likelihood is not finite
  - >-
    a deploy view's part has not passed its check, is a smoke run, its meta.json or one of its arrays is not what its
    pins and meta.json record, its arrays do not line up with the view's, or a row's set is not its role's (a carve row
    scored, a row of r2 fitted)
  - a b0 view holds a type outside bucket 0, or a query's bucket-0 entries are not one block
  - level 10's two calls of score_fold in a unit did not receive the same log-probabilities
  - >-
    an FZ unit's vocabulary holds a type of no fit-set row or misses one, a type's partner is not the same sequence in
    the other bucket, its model is not level 9's NB-hyb, or its posterior does not sum to one (within 1e-4) on a row it
    scores, fits or selects on
  - the host jobs' recorded code sha256 values are not one value per module equal to the committed files

outputs:
  scripts: >-
    scripts/mp_approx_l15.py (stages score [--shard i/n], assemble and check; r2's rule, the rebound carve pass and the
    pins) and scripts/mp_approx_l15_fit.py (stages fit --norm N --view V --fit F --k K, repeat, read, doc and file; the
    eval part, FZ and the deploy views)
  sidecars: >-
    outputs/mp_approx_l15/metaqa/, on the host: r2's per-query and per-node arrays, the walk entries of both families,
    qids.json, meta.json (the sha256 of every array), check.json, units/<norm>/<view>/<fit>/, repeat/ and read.json
  record: outputs/mp_approx_l15/record.json, assembled on the laptop without arithmetic from the fetched read.json, check.json and meta.json files
  document: docs/MP_APPROX_L15.md
  run_record: run_record_mp_approx_l15_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l15.py and tests/test_mp_approx_l15_fit.py, run on the host in rx env mpr-cpu
  - this file parses, its pins are the files' current sha256, level 14's inputs (its earlier_reads extended by level 14's read) and carve pins are copied unchanged, and the declared constants are the scripts'
  - r2's rule on toy strides is the union of offsets 10 and 11 in position order, disjoint from r and every other carve, and every other carve is level 12's or level 14's function's
  - >-
    the rebound carve pass restores level 12's names after it runs, on success and on an error, and reads this file's
    carves, rule, pins, declaration and paths inside it
  - >-
    the check on synthetic sidecars, and its refusals: a smoke, a sidecar not r2's, a non-train id, ids other than the
    pin's, a q_row out of order, an earlier level's id (r's included), an id of one of level 12's carves, an
    unassembled carve, a loopcheck not equal and a failed direction check
  - the eval part's refusals: no check, a failed direction check, a changed meta.json, a smoke, and ids other than r2's pin
  - >-
    FZ's log-probabilities on toy tables equal the formula of arms.norms.fz (both buckets, partners, absent and present
    types, an empty row), sum to one, and have finite gradients; with V empty and no partner they equal level 8's
    softmax; the FZ model's initial state equals level 9's ResidualModel's for the same seed
  - >-
    FZ's vocabulary on a toy view is the fit set's types only: changing the inner and scored rows' types leaves it
    unchanged, and each partner is the same sequence in the other bucket
  - an sm unit equals level 14's run_unit on the same view bit for bit
  - >-
    permuting the scored rows' golds, the other seeds' twins and the stored metrics changes none of an sm or FZ unit's
    dsh, b1d or b0 scores (each arm's inputs are only z(T_k), q, the relation text and the view's types and counts)
  - bands, reaches_gnn and the interpretation (per hop included) on toy cases, and the contrasts are the declared pairs
  - the fit, repeat, read, doc and file stages run end to end on synthetic sidecars

execution:
  order: >-
    This file alone (commit). Then scripts/mp_approx_l15.py and tests/test_mp_approx_l15.py (commit), run first on the
    laptop with scratch outputs that make no number, then on the host, with r2's twelve score shards submitted at once
    beside them. The assemble and the check follow as the shards finish. In parallel, scripts/mp_approx_l15_fit.py and
    tests/test_mp_approx_l15_fit.py (commit) and those tests on the host. Once r2 is checked, the 24 units and the repeat
    run at once. Then the read. Then fetch the read, check and meta files, and on the laptop build the record, the doc
    and the run record (commit).
  stop_after_run: STOP_FOR_REVIEW
