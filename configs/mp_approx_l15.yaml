track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  Level 14 (configs/mp_approx_l14.yaml, RUN at 99a2685). On r, 11,920 metaqa train-split rows, level 12's
  non-message-passing typed-walk model, fitted, selected and scored on its bucket-0 walk types (b0), read L14_HIGH at the
  GNN's own labels: TW-1x-b0 rho_bar 0.905 [0.879, 0.933], below the GNN on all three metrics. b1d (level 13's move of
  the bucket-1 probability to the null type after the fit) read 0.895 [0.869, 0.922] and cost hop 1. Inside bucket 0,
  what was left was mostly the true chain's identification on hop 3. This file keeps level 14's model, views, scores,
  selection, carves and fits, and changes one thing, in training and scoring alike: FZ, the normalisation of the type
  posterior (arms.norms.fz). Every arm is read once on a new population, r2: 11,920 metaqa train-split rows that the
  twin, the GNN and every level have never trained on, selected on or read (the M3B fit stride's offsets 10 and 11).
  Level 14's own procedure (level 8's softmax, sm) is refitted beside FZ with r2 as its scored set, so every FZ
  contrast is paired on r2's rows.
design_informed_by: >-
  Level 14's run record, and design looks made after it and before this file, none filed as a result, all untracked
  and pinned by raw sha256. Six looks read r, which level 14 had read once and which is now a design population; none
  reads r2. outputs/mp_approx_l14_diag/diag_route.py
  (74a2e14d73b7f1e935466c26ede85157595913c0fd4611232cfbc4cdb8ed3094) with diag_route.json
  (d73e818eb4a6cb47289462ff4fac99fb9f2659620b80db437994810f68b8f6c5) and diag_gate.py
  (98e68b1feaf24ed1b3ad885f12b1d7a0eb65bc5831da44b4a1e2ad10760567fb) with diag_gate.json
  (f733e731f627ae4e7e907033e49c9357d5b959c0c9367212b1d3b18ac5a9486d) routed each row between level 14's b0 and full
  units after the fit. A gold-chosen route read 1.027 [1.002, 1.054] at 1x, and the best gold-free route (the full
  unit where its mode is a 1-token bucket-1 walk) 0.919 [0.894, 0.947], +0.014 [0.008, 0.021] over TW-1x-b0.
  diag_chain.py (3f9a899ebe3024918d7700dc88f58ba29ec763e7ad69a5426e70ccef6eaa2a8a) with diag_chain.json
  (474b3330b824c8d3ae2573da2d2a3028240593b67d3aa1649970d6ceb28491f0) sorted the b0 units' wrong-chain gap by kind. Half
  of it at 1x (0.041 of 0.083) was on rows whose true chain has no walk from a bucket-0 seed: level 8's softmax runs
  over the row's present types and the null type, so the absent chain's mass goes to the present types in proportion,
  and the mode is a wrong chain. diag_probe.py (a45533b03966b483c384f89ace8be4c7780ad88628e928a49a8d04771f602999) with
  diag_probe.json (1def4cc2b3f1c891c2a9ac3626d95d7ae5164045d19c08432b66b40e2ec567bd) fitted probes of the true chain
  (49 classes, named by the qtype) on the query embedding, linear and a small MLP, on the 1x fit rows. They were right
  on 0.993 to 0.998 of r's rows, against 0.867 to 0.885 for the units' modes, and on 0.98 to 0.99 of the pairs whose
  mode was wrong while the chain was present. So the chain can be read from the query, and the shortfall is in what the
  fit picks. diag_fz.py (699858d32152da05a81752708f2c87d667d7024b0f840e0099060bb568c816f2) with diag_fz.json
  (e0d217129269bcf803bc9139a728b7a54434ae008f593597cbf26bf5b07e4c2e) fitted the twelve units of level 14's fits and
  views under FZ. FZ-TW-1x-b1d read 0.938 [0.913, 0.966], +0.043 [0.031, 0.056] over level 14's TW-1x-b1d and +0.033
  [0.017, 0.047] over its primary TW-1x-b0. By hop it read 0.861, 1.175 and 0.881. FZ-TW-1x-b0 read 0.930 [0.905,
  0.957], +0.024 [0.009, 0.039] over TW-1x-b0, while under dsh FZ read lower, -0.027 [-0.041, -0.013]. At 4x,
  FZ-TW-4x-b1d read 0.971 [0.946, 0.997], +0.033 [0.022, 0.045], and FZ-TW-4x-b0 0.971 [0.945, 0.997], +0.024 [0.012,
  0.037]. On the 1,001 rows whose true chain has walks from bucket-1 seeds only, FZ-TW-1x-b0 read -0.069 against level
  14's -0.851. diag_route2.py (e447f93f420eb5496c21ada77f467b3511b9059050b315bc696e647d85fafbce) with diag_route2.json
  (34d4fdbe79f430df6a9a75d037cfe3fcd4fa27f82b38b1357fa0b3f95d376e51) routed each row between a full unit's dsh and b1d
  by the unit's own mode. Under FZ it added nothing (-0.000 [-0.007, 0.007] for a 1-token mode, -0.051 [-0.065,
  -0.037] for a bucket-1 mode), so no routed score is an arm here. One look read only ids, strides and qtypes, and no
  gold, score or metric (the zero-gold count of its pin excepted): outputs/mp_approx_l15_design/l15_read_carve_pins.py
  (2444526546ffa9129dbcb1d5ccd08865417338d74125cc0b477d3abc137d03bd) with l15_read_carve_pins.json
  (bcf02dad0c18543635d3a917de2e13dff35c68aa730fa60b6745023369f2e8ec) computed r2's ids, count, hops and digest, and
  checked r2 disjoint from level 12's nine carves and level 14's r. No number of these looks enters a reading here.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, how much of the GNN's gain over its twin does level 12's non-message-passing typed-walk model recover when
  its type posterior is normalised by FZ, in training and scoring alike, and scored by b1d, at the GNN's own labels? It
  reads rho on recall@5, full_coverage@5 and hit@1 of the primary arm FZ-TW-1x-b1d, against the twin and the GNN of
  each seed pair, on r2: 11,920 metaqa train-split rows (3,480 of hop 1, 4,306 of hop 2 and 4,134 of hop 3) that no
  model was trained or selected on and no level has read. As paired contrasts on the same rows it reads what FZ adds
  over level 8's softmax under each score (b1d, b0 and dsh) at 1x and at 4x the labels, what the primary adds over level
  14's primary procedure (TW-1x-b0) refitted here, b1d against b0 under FZ, and what 4x the labels add under FZ; the
  FZ contrasts also per hop and per where the true chain's walks start. Two references bound the arms: the
  non-backtracking true-chain oracle (NB-oracle) and its bucket-0 form (NB-oracle-b0). It also reads the first arm at
  which no readable metric stays below the GNN.
role: >-
  Measurement, as at levels 8 to 14. The objects are non-message-passing models fitted to gold labels of the metaqa train
  split and read on train-split rows that neither they, the twin nor the GNN saw. No GNN output enters any fit, target,
  loss or selection. The twin's z-scored output is the base score, as at every level. TW-1x and FZ-TW-1x are fitted and
  selected under the GNN's own metaqa labels and carves, as at levels 12 to 14. It is still a measurement, not a
  deployable or selected model. No model, number or reading of this file enters QLS-U, the twin, a feature contract,
  M3, M4 or any selection. A deployable model of this form would be a competitor under the QLS-U contract on every
  dataset, with its compiled form timed, and it would need its own declaration. This file does not open one, and it
  opens no later level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code, as at levels 8 to 14
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    Level 12's argument (configs/mp_approx_l12.yaml#boundary) holds for every unit unchanged: the model, the walks, the
    reach sets, the set likelihood, the fits and the dsh score are level 12's, b1d is level 13's and b0 level 14's. FZ
    changes only the normaliser of the type posterior. Its logits are level 9's NB-hyb logits w(q, tau), with level 9's
    parameters created in the same order. They are normalised over U, the union of a fixed vocabulary V and the row's
    present types, plus the null type. V is the walk types present on the unit's fit rows, built once from their type
    codes before the fit. A chain's mass over both seed buckets then goes to the buckets where the row has its walks,
    and to the null type when it has none. FZ reads each type's code (bucket digit and token sequence), V and the row's
    type presence, which level 8's softmax already reads. No edge list, neighbour embedding, neighbour score or gold
    reaches it, it adds no trainable parameter, and no operator runs over the pool edges.
  what_it_is: >-
    The function class is a query-weighted count of typed walks, as at levels 9 to 14. A node's structural term is a
    tempered posterior's average of the uniform reach sets of the row's walk types. Under FZ the posterior is a softmax
    of the same logits over a fixed vocabulary, whose mass on chains the row lacks is the null type's. It has no learned
    per-edge message, no neighbour state and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    As at levels 8 to 14, the walks read only the packed structural message edges the GNN's cell reads: the same pool,
    the same cap of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction
    flags. The ner and knn families are not read. The bucket digit comes from the seed lists the twin and the GNN also
    read: bucket 0 holds the seeds that are the dense or the splade rank-1 node, bucket 1 the other seeds. V is a set of
    walk-type codes, not of nodes or edges. Under b0 the model reads the walks from bucket-0 seeds only, which is less
    of the graph than the GNN reads.

authorization:
  given:
    - '2026-09-30, the user: "basically i dont want message passing but approximations to it, and pushing it as far as possible and targeting the weakpoints, i think offsets or rope based methods can work because all the stuff is anyways in the semantic space we just need to learn those transformations from the query etc and work from that, and explicit positions so that we have a proper way to represnt, what else do you think we should focus on"'
    - '2026-10-01, the user: "keep doing the line you are and max it out as much as possible while still being a lightweight mlp"'
  how_the_messages_are_answered: >-
    "Max it out" becomes level 14's weak points, read by the design looks on r. Half of the b0 units' wrong-chain gap
    was on rows whose true chain the row lacks, where level 8's softmax hands the chain's mass to the wrong chains
    present; the true chain can be read from the query embedding (probes were right on 0.993 to 0.998 of r's rows), so
    the shortfall is in the posterior, not in the query. FZ changes that normalisation and nothing else, adds no parameter
    and keeps the model a query-weighted count of typed walks with one linear map of the query. This file reads that one
    change on a fresh population large enough to read every hop.
  go_ahead: >-
    Standing: "keep continuing autonomusly without asking for perms and try to find improvements and pause only at
    something substancial". This file is committed alone, before any code of the phase runs, and is then run as written.
  placement_messages:
