phase: MP_APPROX_L10
opened: 2026-10-01
status: DECLARED_NOT_RUN
branch_type: POST_HOC_ANALYSIS
track: MP-APPROX (a gold-label, non-message-passing rung; not MP-ORACLE)
extends: >-
  Level 9 (configs/mp_approx_l9.yaml, RUN at 4667e9b). On metaqa, level 9's primary arm NB-hyb read L9_HIGH, with
  rho_bar 0.757 [0.691, 0.815], and every learned arm stayed below the GNN on all three metrics. The non-backtracking
  true-chain oracle read 1.069 [1.017, 1.122], and ceiling_gap was 0.312 [0.258, 0.367]. By hop NB-hyb read 0.626,
  0.956 and 0.725, and its argmax type had the true chain's tokens on 0.846 of queries. This file targets the ceiling
  gap with two changes and says so. First, the EM likelihood becomes a set likelihood. Every node of a type's reach set
  is gold with one fitted probability, and every other pool node with another. Level 8's likelihood charged a factor
  eps / n_q for each gold outside the reach set. So a type that covers a whole small node kind beat the true chain
  whenever the pool cut one gold from the true chain's reach. Second, the score reads the posterior's coverage: the
  probability that a node lies in the reach set of the type the query picks. Level 8 read a mixture of uniform reach
  sets instead, under which a small reach set outside R* could outrank the nodes of a large R*. Each change has its own
  paired contrast on the same queries, and level 9's primary procedure is re-run on them.
design_informed_by: >-
  This design was informed by a descriptive look at level 9's filed units and sidecar on the host, made after level 9's
  run record: outputs/mp_approx_l9_diag/diag.py (sha256 7ae6d2c45059ea87504b09f3ab9a5b282a9dfce47af6d8c95cee279b0e1b7ef3)
  and diag.json (sha256 29ccbe3e2379ed60ff1b9a60e0665f85cf674f9836a6d4bae43f63b12b68ab7c), untracked, not a result and
  not filed (job 261001-042143-l9-diag-17f6). It recovered n_q m_q from the stored scores by inverting s = z + kappa
  log(n_q m_q + eta) (the recovered m_q sums to 1 within 2e-7, and the recomputed metrics equal the stored ones
  exactly). It found five things.
  (a) The gate's form does not separate the arm from the oracle. All of the mixture's mass was put on the true chain's
  R*, from the oracle's bucket, so that n_q m_q(v) = n_q / |R*| on R* and 0 elsewhere. Scored with the arm's own soft
  gate (each unit's kappa and eta), this read 1.065, against the oracle's 1.069. The true chain from b0 alone, under the
  oracle's hard gate, read 0.980. This file's coverage score equals that point-mass score whenever the posterior is a
  point mass.
  (b) The ceiling gap splits in two about equally. Over the 9,000 (query, seed) pairs, the 7,617 on which the argmax
  sequence was the true chain's hold 0.150 of the 0.312, in rho_bar units. On those, the posterior still left mixture
  mass outside R* (the mass on R* had mean 0.886 and q10 0.690). The 1,383 pairs on which it was not hold 0.161, of which
  0.112 is at hop 3.
  (c) The wrong argmax clusters on genre-ending qtypes, as one type. At k = 0, "release_year:fwd > release_year:bwd >
  has_genre:fwd" (the genres of the movies released in the topic movie's year) was the argmax on 40 of 80
  movie_to_director_to_movie_to_genre queries. It was also the argmax on 25 of 62 writer_to_movie_to_genre, 25 of 80
  movie_to_actor_to_movie_to_genre, 22 of 51 movie_to_writer_to_movie_to_genre and 21 of 36 actor_to_movie_to_genre
  queries. The per-qtype wrong shares were highest on genre-ending qtypes (0.85, 0.83, 0.75, 0.73, 0.71). A reach set
  that holds most genre nodes contains every gold genre. Under level 8's likelihood, a gold outside R_tau costs a factor
  eps / n_q (about 5e-6 at eps = 0.01), against about 1 / 20 per gold for a reach set of 20 genres.
  (d) The wrong argmax type still reached a gold on 0.633 of those pairs. The two other large confusions were hop-3
  order swaps between written_by and directed_by chains.
  (e) Ranking by the mixture mass first and z second read 0.019, and the argmax type's reach set under a hard gate read
  0.533. The soft gate is kept.
  These looks used level 9's 3,000 queries, and this file's population excludes them.
registered_question: "After matching candidate exposure and inference-time graph information to modern graph-retrieval/GNN systems, how much effectiveness remains attributable specifically to learned message passing?"
question: >-
  On metaqa, how far toward the GNN's gain over its twin can level 9's non-message-passing typed-walk model go when it
  is fitted with a set likelihood and scored by coverage? It reads how much of the GNN's gain the primary arm
  NB-set-cov recovers: rho on recall@5, full_coverage@5 and hit@1, against the twin and the GNN of each seed pair, on
  3,000 fresh V2_GATE queries disjoint from levels 0 to 9. As paired contrasts on the same queries, it also reads what
  each change adds: the likelihood under each score, the score under each likelihood, and non-backtracking against
  standard walks under the new model. It reads the total against level 9's primary procedure, re-run on these queries.
  The non-backtracking and standard true-chain oracles bound what choosing the right chain can give.
role: >-
  Measurement, as at levels 8 and 9. The object is a set of non-message-passing models fitted to gold labels,
  cross-fitted within V2_GATE. No GNN output enters any fit, target, loss or selection. The twin's z-scored output is
  the base score, as at every level. No model, number or reading of this file enters QLS-U, the twin, a feature
  contract, M3, M4 or any selection. A deployable model of this form would be a competitor trained on the fit split
  under the QLS-U contract, and it would need its own declaration. This file does not open one, and it opens no later
  level.

boundary:   # configs/universal_v2.yaml#learned_vs_fixed_propagation (pinned below), applied before any code, as at levels 8 and 9
  learned_propagation_quoted: >-
    "any operator applied over the pool edges inside the model whose messages or message weights depend on trainable
    parameters, or any repetition of an aggregation with a trainable transform between repetitions."
  why_this_is_fixed: >-
    Level 9's argument (configs/mp_approx_l9.yaml#boundary) holds unchanged, and the walks and reach sets are level
    9's. The set likelihood is a training-time function of each type's |R_tau| and h_tau and the query's in-pool gold
    count and pool size, with four scalar parameters. It is fitted to the fit fold's golds and never read at
    inference. The coverage c_q(v) = sum over types of p(tau | q) 1[v in R_tau] reads the type weights and the compiled
    reach sets, as level 8's mixture does, with 1[v in R_tau] in place of 1[v in R_tau] / |R_tau|. Inside the model,
    every learned quantity is still a function of the query embedding and a discrete walk type only. Nothing in any
    model reads the edge list or a neighbour's embedding, score or state, and nothing is repeated.
  what_it_is: >-
    The function class is a query-weighted count of typed walks, as at level 9. Under the coverage score, a node's
    structural term is the posterior probability that the query's chosen walk type reaches it. It has no learned
    per-edge message, no neighbour state and no nonlinearity between hops.
  crossing_the_line:   # none of these appears in any arm; a test checks every arm's inputs
    - a learned function of a neighbour's embedding, scalars, score or state, applied per edge
    - learned weights inside an iterated aggregation over the edges
    - a continuous edge attribute passed through a learned nonlinearity per edge
    - candidate scores pooled back into the type weights at inference (a cross-candidate arm, which is not in this file)
  equal_graph_information: >-
    As at levels 8 and 9, the walks read only the packed structural message edges the GNN's cell reads: the same pool,
    the same cap of 64 in-pool in-neighbours per receiver, the same K_REL = 4 relation slots and the same direction
    flags. The ner and knn families are not read. The fairness contract holds, because both models read the same pool graph.

