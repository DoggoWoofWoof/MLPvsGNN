population:
  rule: >-
    Start from metaqa V2_GATE: the M3B eval population, with its declared digest and count, the stored halves and hops,
    and held rows out, all recomputed as level 8's stage_score does. Level 0's 2,400 rows leave it; they are recomputed
    through level 0's metaqa_subsample and must equal level 0's qids.json and q_row.npy (pinned). Level 8's 3,000 rows
    leave it; they are recomputed through level 8's own rule and salt and must equal level 8's qids.json (pinned).
    Level 9's 3,000 rows leave it; they are recomputed through level 9's own rule and salt (l9_rows, "mp_approx_l9|"),
    from the rows level 9 excluded, and must equal level 9's qids.json (pinned). Per hop, the remaining rows are sorted
    by sha256("mp_approx_l10|" + query_id), and the first 1,000 are kept: 3,000 queries in population order. The rule
    reads only ids, hops and the gate mask.
  available_per_hop: {1: 2221, 2: 4644, 3: 4473}   # level 9's available rows per hop (3,221, 5,644, 5,473) less level 9's 1,000 each
  folds: level 0's fold_of (sha256(id) mod 5) and is_inner (sha256(id + "|inner") mod 10 == 0), imported unchanged
  gold: >-
    The in-pool golds are m3b_compile.gold_local_of's. A query with no in-pool gold is scored and read, but it enters no
    fit, because it carries no evidence about the chain.
  why_disjoint: >-
    Levels 0 to 7 were read on level 0's rows. Levels 8 and 9 were read on their own rows, and this file's design
    follows level 9's readings and a descriptive look at level 9's rows. A fresh draw keeps all of those rows out of
    every number here.

scoring_pass:   # host CPU, score threads; level 8's stage_score, imported unchanged, with its names rebound in this process
  path: >-
    Level 8's scoring pass runs unchanged, with the names of its module that level 9 rebinds, rebound in this process
    only. The population rule becomes this file's. The walk programme is level 9's combined programme
    (walk_entries_both, imported unchanged). The pins become this file's, which include every one of level 9's. The
    declaration and output paths become this file's. The chunking, the six forwards, the integrity check, the kept
    per-query and per-node arrays and the shards are level 8's, and the sidecar has level 9's combined form.
  integrity: >-
    As at levels 8 and 9. rank_metrics of T_k and G_k on the full pool must equal the pilot's stored per-query values of
    all 14 metrics exactly, on every scored query. The first mismatch is a hard stop.
  shards: three processes, --shard i/3, then one process without --shard that assembles, as at level 9

walks: >-
  Level 9's (configs/mp_approx_l9.yaml#walks), unchanged: the std family (level 8's counts) and the nb family
  (non-backtracking counts), compiled in one pass into one sidecar and read back as two views; the per-query checks,
  the null type, the ceilings and level 8's true-chain map.

check: >-
  Before any fit, the check stage runs level 9's check_family on each view, imported unchanged: level 8's direction
  check (a swapped share above the declared share, in either family, is a hard stop) and level 9's anchors.

arms:   # each arm reads z(T_k), the query embedding, the relation text and one family's compiled types and counts, nothing else
  model: >-
    Level 9's NB-hyb model on every fit: the type vector is level 8's TP composition plus the exact per-sequence
    residual E, the query map is linear (A q, 1536 x 64), and w(q, tau) = <A q, e(tau) + beta_b + lambda_L> + c_{b,L}
    with the null logit <A q, nu> + c_null. p(tau | q) is the softmax of w(q, .) over the query's types in the fit's
    family and the null type. The parameters are created in level 9's order, so the draw fit is level 9's NB-hyb fit.
  fits:   # fit: family, likelihood
    NB-draw: [nb, draw]
    NB-set: [nb, set]
    STD-set: [std, set]
  likelihood:
    draw: >-
      Level 8's: lik(tau) = the product over the query's in-pool golds of ((1 - eps) 1[gold in R_tau] / |R_tau| + eps / n_q),
      with eps = 0.01, and the null type's n_q^-g. Level 8's Fitter, called unchanged.
    set: >-
      For a query with n_q pool nodes and g in-pool golds, and a type of length L whose reach set has r nodes, h of them
      gold: log lik(tau) = h log rho_L + (r - h) log(1 - rho_L) + (g - h) log eps_s + (n_q - r - g + h) log(1 - eps_s).
      The null type has r = h = 0. theta = (rho_1, rho_2, rho_3, eps_s), each clipped to [1e-6, 1 - 1e-6]. It reads
      only |R_tau|, h_tau, g and n_q.
    set_parameters: >-
      Before round 0, over the unit's fit queries (those with an in-pool gold, the inner ones out), rho_L is the sum of h
      over all their types of length L divided by the sum of r, and eps_s is the sum of g over the queries divided by
      the sum of n_q. In every round r >= 1, the E-step on the fit queries gives gamma under the current prior and theta.
      The M-step then fits the query map to gamma as at level 8, and sets theta in closed form from the same gamma:
      rho_L = sum over queries and types of length L of gamma h / the same sum of gamma r, and eps_s = sum over queries
      and types of gamma (g - h) / the same sum of gamma (n_q - r), with the null type in eps_s's sums. A ratio whose
      denominator is 0 keeps the value it had (before round 0, rho_L then starts at eps_s). The round's marginal
      log-likelihoods are then computed under the new prior and theta. The kept round keeps its theta, which the score
      does not read.
  scores:   # s_k(v) = z(T_k)(v) + kappa log(a_q(v) + eta); every fit is scored both ways
    dens: >-
      a_q(v) = n_q m_q(v), level 8's mixture (Fitter.mixture, called unchanged): m_q(v) = sum over types of p(tau | q)
      1[v in R_tau] / |R_tau|, plus p(null | q) / n_q.
    cov: >-
      c_q(v) = sum over the query's types of p(tau | q) 1[v in R_tau]; the null type covers nothing. a_q(v) = n_q c_q(v)
      / sum over u of c_q(u) when that sum is above 0, and 1 for every node otherwise.
  selection: >-
    The kept round is the one with the best inner-validation marginal log-likelihood over rounds 0 to 10 (ties go to
    the earliest), and both scores use it. Then, per score, kappa in {1/32, 1/16, 1/8, 1/4, 1/2, 1, 2, 4, 8, 16} and
    eta in {0.01, 0.1, 1, 10, 100} are chosen on the inner-validation queries by the mean of recall@5, full_coverage@5
    and hit@1. Ties go to the smaller kappa, then to the larger eta. This is level 9's protocol.
  read_arms:   # arm: fit, score
    NB-set-cov: [NB-set, cov]       # the primary arm
    NB-set-dens: [NB-set, dens]
    NB-draw-cov: [NB-draw, cov]
    NB-draw-dens: [NB-draw, dens]   # level 9's primary procedure (NB-hyb) on these queries
    STD-set-cov: [STD-set, cov]
    STD-set-dens: [STD-set, dens]
  references:
    NB-oracle: level 8's oracle rule on the nb view (R*, the true chain's reach set from the bucket with the larger Jaccard with the golds, plus 1e6)
    STD-oracle: the same rule on the std view

em:
  e_step_m_step: >-
    As at level 9, through level 8's Fitter on the fit's view: eps = 0.01 for the draw likelihood, AdamW (lr 1e-3,
    weight decay 1e-4), 64 queries per minibatch and 10 epochs per M-step, with the epoch that has the best
    inner-validation soft cross-entropy restored. Each round starts from the previous round's parameters. For the set
    likelihood, a subclass of level 8's Fitter replaces only the likelihood rows, and updates them with theta.
  rounds: 10 (E, M) rounds after round 0, as at level 9
  draw_equals_level9: >-
    NB-draw's units with the dens score are level 9's fit_unit for NB-hyb under its own protocol. A test checks this
    bit for bit on a synthetic sidecar: scores, metrics, argmax, kept round, kappa and eta.

cross_fitting:
  units: >-
    As at level 9: one unit per (fit, k, fold). It trains on the other four folds' queries that have an in-pool gold,
    with the inner-validation queries held out of the gradient, and scores the fold's queries both ways.
    torch.manual_seed and numpy default_rng both take 1000 + 10 k + fold.
  out_of_fold: every scored query's arm score comes from the unit that did not see the query
  unit_files: >-
    Each unit is written atomically with its fit log: the per-round and per-epoch losses, the marginal log-likelihoods,
    theta per round for the set fits, the kept round, kappa and eta per score, and the parameter count. A unit already
    written is skipped on a restart.
  repeat: >-
    The unit (NB-set, k = 0, fold 0) runs again in a fresh process. Its out-of-fold arrays and fit log are compared
    bitwise with the first run's (REPEAT_DIFFERS).

quantities:
  metrics: >-
    recall@5, full_coverage@5 and hit@1 of each arm's s_k on the full pool, by m3b_train.rank_metrics under the frozen
    tie rule. T_k's and G_k's values are the stored ones, checked in the scoring pass.
  rho_readable_rho_bar_gap: >-
    As at levels 8 and 9: rho_M = (mean over k and queries of M(arm_k) - M(T_k)) / (mean of M(G_k) - M(T_k)). A metric
    is readable when its denominator's 95% interval lies above 0. rho_bar is the mean of rho_M over the readable
    metrics, and gap_to_gnn is the mean of M(arm_k) - M(G_k) per metric.
  strata: per hop (1, 2, 3); a stratum's rho is read only if its own denominator interval lies above 0
  anchors:   # descriptive
    level9_anchors: level 9's check anchors on each view (topic entity, chain reach, gold in pool, sizes, edges, self_reach, nb_trim)
    agreement: >-
      Per fit, the share of queries on which the out-of-fold argmax type has the true chain's token sequence, with the
      bucket ignored; per k, then the mean over k; overall and per hop. A null argmax does not agree.
    genre_agreement: the same share, on the queries whose qtype's last kind is genre
    gap_split: >-
      For NB-set-cov and NB-draw-dens: (NB-oracle - arm) per metric, summed over the (query, seed) pairs on which the
      fit's argmax sequence is the true chain's, and over those on which it is not, each divided by the seed count and
      the metric's summed denominator; the mean over the readable metrics; overall and per hop.
    theta: per set unit, the kept theta (rho_1, rho_2, rho_3, eps_s)
    grid_edges: per read arm, the number of units whose kappa or eta sits at an end of the grid, and the number whose kept round is the last

statistics:
  bootstrap: >-
    Level 0's bootstrap: queries resampled with replacement, 1000 resamples, numpy default_rng(0) (level 0's
    boot_weights), and a 95% percentile interval. Seeds are averaged inside each resample. One resample matrix serves
    every quantity, so contrasts are paired.
  contrasts:   # point and 95% interval of the paired difference of rho_bar
    set_adds: NB-set-cov - NB-draw-cov
    set_adds_dens: NB-set-dens - NB-draw-dens
    cov_adds: NB-set-cov - NB-set-dens
    cov_adds_draw: NB-draw-cov - NB-draw-dens
    over_level9_primary: NB-set-cov - NB-draw-dens
    nb_adds: NB-set-cov - STD-set-cov
    ceiling_gap: NB-oracle - NB-set-cov

readings:   # filed before any number
  primary: NB-set-cov
  bands:   # of rho_bar; the first that applies; the same thresholds as levels 8 and 9
    L10_ABOVE_GNN: the interval's lower end is above 1
    L10_HIGH: rho_bar >= 0.75 and the interval's lower end >= 0.50
    L10_LOW: rho_bar <= 0.25 and the interval's upper end <= 0.50
    L10_MID: none of the above
    NOT_READ: no readable metric
  exactly_one: the primary's band is the file's reading
  per_metric_flags:
    BEATS_GNN: the interval of M(arm) - M(G) lies above 0
    BELOW_GNN: the interval of M(arm) - M(G) lies below 0
  flags:
    CEILING_LOW: NB-oracle's rho_bar interval upper end <= 0.50
    REPEAT_DIFFERS: the repeated unit is not bit-identical (its largest difference is filed)
    EM_NOT_MONOTONE: the fit-set marginal log-likelihood falls between two consecutive rounds of a unit (the units are listed)
    GRID_EDGE: more than half of the primary's 15 units choose kappa or eta at an end of the grid
    THETA_AT_CLIP: a set unit's kept theta has a component at a clip bound (the units are listed)
  interpretation_map:   # every entry that applies is listed; they are not exclusive, and none opens a stage
    l10_above_gnn: >-
      Primary L10_ABOVE_GNN. On this metaqa population, a non-message-passing model scores above the GNN on the readable
      metrics on average. It reads compiled non-backtracking typed walks and the relation text, and it is fitted to
      golds. The GNN's metaqa advantage over its twin is then reproducible without learned message passing, given those
      inputs.
    l10_high: primary L10_HIGH -- the model recovers most of the GNN's gain on this population
    l10_mid: primary L10_MID -- it recovers part of the gain
    l10_low: primary L10_LOW -- it recovers little of the gain; read it with CEILING_LOW and the agreement anchor
    set_adds: the set_adds interval lies above 0 -- the set likelihood adds to level 8's under the coverage score
    set_hurts: the set_adds interval lies below 0 -- the set likelihood loses to level 8's under the coverage score
    cov_adds: the cov_adds interval lies above 0 -- the coverage score adds to level 8's mixture under the set likelihood
    cov_hurts: the cov_adds interval lies below 0 -- the coverage score loses to level 8's mixture under the set likelihood
    above_level9_primary: the over_level9_primary interval lies above 0 -- the primary beats level 9's primary procedure on the same queries
    nb_adds: the nb_adds interval lies above 0 -- non-backtracking walks add to standard walks under the primary's model
    nb_hurts: the nb_adds interval lies below 0 -- non-backtracking walks lose to standard walks under the primary's model
    chain_not_identified: the primary fit's agreement below 0.5 with ceiling_gap's interval above 0 -- the chain is not learned from the question
  wording: >-
    Every arm is cross-fitted on metaqa V2_GATE queries with gold labels. The file measures what non-message-passing
    typed-walk models recover of the GNN's gain on this population. It is never a deployable or selected model, and it
    says nothing about another dataset. No reading may be phrased as "message passing is unnecessary", "we do not need
    message passing" or "the MLP wins". rho here is level 8's quantity on a fresh population. Level 9's numbers are
    quoted beside this file's only with the population named, and the paired comparison with level 9 is the
    NB-draw-dens arm on this file's queries. rho is not the within-U_q oracle rho of levels 0 to 7, and the two are
    never set side by side as one quantity.

compute:
  scoring: level 9's pass took 17.5 to 17.6 min per shard at 6 threads; the same is expected here
  storage: level 9's sidecar held about 31 million entries (both families); the same order is expected here
  fits: >-
    Three fits x 3 seeds x 5 folds = 45 units plus the repeat, at 4 threads, in nine fit jobs (one per fit and seed, five
    units each). Level 9's NB-hyb units took about 1 min; scoring both ways and the set likelihood's updates should
    keep a unit under 2 min, so a fit job takes about 10 min.
  resumable: every chunk, shard, unit and read file is written atomically and skipped on a restart

hard_stops:   # on any: file hard_stop_<date> with the evidence, leave the status line, report
  - any pin in inputs fails, level 0's frozen code included, or the host mirror check fails
  - >-
    the population digest or count, the halves, the hops, level 0's, level 8's or level 9's recomputed rows differ from
    the declared or stored ones, or a level 0, 8 or 9 row, a held row or a test row would be scored
  - any integrity check of scoring_pass fails
  - any hard stop of level 9's walks or check
  - the relation table differs from the pinned embeddings or vocabulary order
  - a set likelihood's theta or marginal log-likelihood is not finite
  - the host jobs' recorded code sha256 values are not one value per module equal to the committed files

outputs:
  scripts: >-
    scripts/mp_approx_l10.py (stages score [--shard i/n], assemble, check; the population rule and the pins) and
    scripts/mp_approx_l10_fit.py (stages fit [--fit F --k K], repeat, read, doc, file)
  sidecars: >-
    outputs/mp_approx_l10/metaqa/ on the host. It holds the per-query and per-node arrays, the walk entries of both
    families, qids.json and meta.json (the sha256 of every array), check.json, units/<fit>/ with the out-of-fold scores
    of both scores and the fit logs, repeat/ and read.json.
  record: outputs/mp_approx_l10/record.json, assembled on the laptop from the fetched read.json, check.json and meta.json without arithmetic
  document: docs/MP_APPROX_L10.md
  run_record: run_record_mp_approx_l10_<date>, appended to this file; status DECLARED_NOT_RUN -> RUN

tests:   # tests/test_mp_approx_l10.py and tests/test_mp_approx_l10_fit.py, run on the host in rx env mpr-cpu
  - this file parses, its pins are the files' current sha256, and the declared constants are the scripts'
  - >-
    the population rule on toy ids is disjoint from level 0's, level 8's and level 9's rows, recomputes level 9's rows
    by level 9's rule, sorts per hop by this file's salted sha256 and keeps the first N
  - the rebound scoring pass restores level 8's names after it runs, and reads this file's rule, pins and paths inside it
  - >-
    the set likelihood rows equal a brute-force Bernoulli log-likelihood over the pool's nodes on toy reach sets; the
    closed-form theta is the maximiser of the gamma-weighted log-likelihood (no small perturbation of it is higher);
    the initial theta is the declared pooled ratio
  - the coverage equals a brute-force sum of p(tau | q) over the types whose reach set holds the node, and a_q has pool mean 1
  - >-
    NB-draw's unit with the dens score equals level 9's fit_unit for NB-hyb bit for bit on a synthetic combined sidecar
    (scores, metrics, argmax, kept round, kappa and eta)
  - >-
    on a synthetic sidecar with a planted chain whose reach set loses one gold per query and a planted catch-all type
    whose reach set holds every node of the golds' kind, EM with the set likelihood puts its argmax on the chain
  - each arm's inputs are only z(T_k), q, the relation text and the view's types and counts
  - metrics, rho, readability, the band order and the gap split come out right on toy cases, and the contrasts are the declared pairs
  - the check, fit, repeat, read, doc and file stages run end to end on a synthetic combined sidecar
  - no held, level 0, level 8 or level 9 query id appears in any sidecar

execution:
  order: >-
    This file alone (commit). Then scripts/mp_approx_l10.py and tests/test_mp_approx_l10.py (commit), those tests on
    the host, a smoke on a few queries written outside outputs/mp_approx_l10, the three score shards at once, then the
    assemble and the check. In parallel, scripts/mp_approx_l10_fit.py and tests/test_mp_approx_l10_fit.py (commit) and
    those tests on the host. Once the check has passed, the nine fit jobs and the repeat at once, then the read. Then
    fetch the read, check and meta files, and on the laptop build the record, the doc and the run record (commit).
  stop_after_run: STOP_FOR_REVIEW
