# rx: run this project's work on the lab GPU machine. See tools/rx/README.md.
#   python tools/rx/rx.py run -- python scripts/some_script.py ...
#
# Systems only. Placing a SCIENTIFIC stage on the remote host (CPU or GPU)
# needs a passing verdict of the CPU-GPU equivalence test for that placement
# (configs/cpu_gpu_equivalence.yaml; declared 1ee9e48, not yet run) and the
# stage's own dated authorization block. Guide: docs/GPU_HOST_HANDOVER.md.
# Do not edit the [envs.*] tables: a verdict names these env hashes.

[project]
name = "mpr"
host = "gpu"

[push]
# Code and configs only: the files git tracks. Data and sealed artifacts stay
# where they are unless a job names them with --inputs.
include = ["git:tracked"]
exclude = ["legacy/**"]
max_mb = 512

[run]
env = "mpr-cpu"
cpus = 8
mem_gb = 16
outputs = ["outputs/**", "logs/**"]
env_vars = { PYTHONHASHSEED = "0" }

[profiles.gpu]
env = "mpr-cu128"
gpus = 1
cpus = 8
mem_gb = 32

[profiles.big]
cpus = 24
mem_gb = 96

# The laptop's closure, pinned. torch and the PyG extension wheels come from
# their own indexes; everything else from PyPI.
[envs.mpr-cpu]
extra_index_urls = ["https://download.pytorch.org/whl/cpu"]
find_links = ["https://data.pyg.org/whl/torch-2.8.0+cpu.html"]
requirements = [
  "torch==2.8.0+cpu", "torch_scatter==2.1.2+pt28cpu", "torch_sparse==0.6.18+pt28cpu",
  "torch-geometric==2.6.1", "numpy==2.3.2", "scipy==1.16.1", "scikit-learn==1.7.1", "networkx==3.5",
  "faiss-cpu==1.13.2", "sentence-transformers==5.2.0", "transformers==4.57.3", "tokenizers==0.22.1",
  "huggingface-hub==0.36.0", "safetensors==0.7.0", "pyarrow==23.0.1", "psutil==7.2.2", "PyYAML==6.0.2",
  "pytest==8.4.2", "tqdm==4.67.1", "regex==2025.11.3", "requests==2.34.2", "aiohttp==3.12.15",
  "fsspec==2025.7.0", "filelock==3.18.0", "Jinja2==3.1.6", "MarkupSafe==3.0.2", "sympy==1.14.0",
  "mpmath==1.3.0", "joblib==1.5.1", "threadpoolctl==3.6.0", "packaging==25.0", "pyparsing==3.2.3",
  "typing_extensions==4.14.1", "setuptools==80.9.0",
]
verify = ["import torch, torch_geometric, torch_scatter, torch_sparse, faiss, numpy; print(torch.__version__, numpy.__version__, torch_geometric.__version__)"]

[envs.mpr-cu128]
gpus = 1                   # the build reserves the GPU so `verify` can reach it
extra_index_urls = ["https://download.pytorch.org/whl/cu128"]
find_links = ["https://data.pyg.org/whl/torch-2.8.0+cu128.html"]
requirements = [
  "torch==2.8.0+cu128", "torch_scatter==2.1.2+pt28cu128", "torch_sparse==0.6.18+pt28cu128",
  "torch-geometric==2.6.1", "numpy==2.3.2", "scipy==1.16.1", "scikit-learn==1.7.1", "networkx==3.5",
  "faiss-cpu==1.13.2", "sentence-transformers==5.2.0", "transformers==4.57.3", "tokenizers==0.22.1",
  "huggingface-hub==0.36.0", "safetensors==0.7.0", "pyarrow==23.0.1", "psutil==7.2.2", "PyYAML==6.0.2",
  "pytest==8.4.2", "tqdm==4.67.1", "regex==2025.11.3", "requests==2.34.2", "aiohttp==3.12.15",
  "fsspec==2025.7.0", "filelock==3.18.0", "Jinja2==3.1.6", "MarkupSafe==3.0.2", "sympy==1.14.0",
  "mpmath==1.3.0", "joblib==1.5.1", "threadpoolctl==3.6.0", "packaging==25.0", "pyparsing==3.2.3",
  "typing_extensions==4.14.1", "setuptools==80.9.0",
]
verify = ["import torch, torch_scatter, torch_sparse; assert torch.cuda.is_available(), 'no CUDA'; x = torch.randn(4096, 4096, device='cuda'); print(torch.__version__, torch.cuda.get_device_name(0), float((x @ x).sum()))"]
